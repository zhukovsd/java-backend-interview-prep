  id = 43
  question = "Проверить возможность продажи товара по времени и типу"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод, который определяет возможность продажи товара в зависимости от времени и категории продукта.\n\nПравила:\n\n- с 13:00 до 14:00 продажа любых товаров запрещена;\n    \n- с 23:00 до 03:00 запрещена продажа любого алкоголя;\n    \n- с 03:00 до 08:00 запрещена продажа алкоголя крепостью от 40 градусов;\n    \n- в остальных случаях продажа разрешена.\n    \n\n**Код:**\n\n```java\npublic class IceCream implements Product {\n}\n\npublic abstract class Alcohol implements Product {\n\n    abstract int getAbv();\n}\n\npublic boolean checkSale(Product item, Integer hour) {\n    // код тут\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала проверь входные данные.  \n💡 Обеденное время запрещает продажу любого товара.  \n💡 Ночной диапазон пересекает границу суток, поэтому используется `||`.  \n💡 Проверять крепость нужно только для объектов типа `Alcohol`.  \n💡 Если ни один запрет не сработал, можно вернуть `true`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic boolean checkSale(Product item, Integer hour) {\n    if (item == null) {\n        throw new IllegalArgumentException(\n                \"Product must not be null\"\n        );\n    }\n\n    if (hour == null || hour < 0 || hour > 23) {\n        throw new IllegalArgumentException(\n                \"Invalid hour: \" + hour\n        );\n    }\n\n    // Обед: 13:00–13:59\n    if (hour == 13) {\n        return false;\n    }\n\n    // С 23:00 до 02:59 запрещена продажа любого алкоголя\n    if (hour >= 23 || hour < 3) {\n        if (item instanceof Alcohol) {\n            return false;\n        }\n    }\n\n    // С 03:00 до 07:59 запрещён крепкий алкоголь\n    if (hour >= 3 && hour < 8) {\n        if (item instanceof Alcohol) {\n            Alcohol alcohol = (Alcohol) item;\n\n            if (alcohol.getAbv() >= 40) {\n                return false;\n            }\n        }\n    }\n\n    return true;\n}\n```\n\nПоскольку метод принимает только целое значение часа, обеденный интервал интерпретируется как время с `13:00` до `13:59`.\n\nНочной диапазон пересекает границу суток:\n\n```java\nhour >= 23 || hour < 3\n```\n\nПоэтому здесь используется оператор `||`.\n\nДля обычных товаров ночные ограничения на алкоголь не применяются, и метод возвращает `true`.\n\n{{< /details >}}"
  filepath = "if-else-can-sell"

[[tasks]]
  id = 44
  question = "Отфильтровать большую последовательность чисел"
  answer = "**Условие задачи:**  \nНеобходимо обработать последовательность чисел размером до 1 Гб и получить только значения больше `5`.\n\nДоступно 1.1 Гб памяти, поэтому нельзя загружать всю последовательность и результат целиком в память.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Обрабатывай данные последовательно, по одному элементу.  \n💡 Не создавай промежуточный список с результатами.  \n💡 Результат можно сразу записывать в выходной поток.  \n💡 Для файла удобно использовать `BufferedReader` и `BufferedWriter`.  \n💡 Потребление памяти должно оставаться постоянным и не зависеть от размера входных данных.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nЕсли числа записаны построчно, можно читать и фильтровать их на лету:\n\n```java\npublic void filter(\n        InputStream input,\n        OutputStream output\n) throws IOException {\n    BufferedReader reader = new BufferedReader(\n            new InputStreamReader(input)\n    );\n\n    BufferedWriter writer = new BufferedWriter(\n            new OutputStreamWriter(output)\n    );\n\n    String line;\n\n    while ((line = reader.readLine()) != null) {\n        int value = Integer.parseInt(line.trim());\n\n        if (value > 5) {\n            writer.write(Integer.toString(value));\n            writer.newLine();\n        }\n    }\n\n    writer.flush();\n}\n```\n\nМетод не хранит исходную последовательность и результат в коллекциях. В памяти одновременно находится только текущая строка и буферы чтения и записи.\n\nЕсли источник представлен как `Iterable<Integer>`, можно вернуть ленивый результат:\n\n```java\npublic Iterable<Integer> filter(Iterable<Integer> source) {\n    if (source == null) {\n        throw new IllegalArgumentException(\n                \"Source must not be null\"\n        );\n    }\n\n    return () -> new Iterator<Integer>() {\n\n        private final Iterator<Integer> iterator = source.iterator();\n        private Integer nextValue;\n        private boolean nextReady;\n\n        @Override\n        public boolean hasNext() {\n            if (nextReady) {\n                return true;\n            }\n\n            while (iterator.hasNext()) {\n                Integer value = iterator.next();\n\n                if (value != null && value > 5) {\n                    nextValue = value;\n                    nextReady = true;\n                    return true;\n                }\n            }\n\n            return false;\n        }\n\n        @Override\n        public Integer next() {\n            if (!hasNext()) {\n                throw new NoSuchElementException();\n            }\n\n            Integer result = nextValue;\n            nextValue = null;\n            nextReady = false;\n\n            return result;\n        }\n    };\n}\n```\n\nТакой результат вычисляется только во время обхода:\n\n```java\nfor (Integer value : filter(source)) {\n    System.out.println(value);\n}\n```\n\nВременная сложность — `O(n)`, дополнительная память — `O(1)`, без учёта внутренних буферов ввода и вывода.\n\n{{< /details >}}"
  filepath = "filter-big-sequence"

[[tasks]]
  id = 45
  question = "Подсчитать количество вхождений элементов списка"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод, который принимает список `Integer` и возвращает структуру, содержащую уникальные элементы и количество их вхождений.\n\n**Код:**\n\n```java\npublic class Utils {\n\n    // Пример:\n    // 1 2 11 2 11 9 11 1 2 3\n    //\n    // Результат:\n    // 1  -> 2\n    // 2  -> 3\n    // 11 -> 3\n    // 9  -> 1\n    // 3  -> 1\n\n    public Map<Integer, Integer> countElementItems(\n            List<Integer> list\n    ) {\n        // код тут\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Уникальный элемент можно использовать как ключ `Map`.  \n💡 Значением будет количество его появлений в списке.  \n💡 Для обновления счётчика удобно использовать `merge()` или `getOrDefault()`.  \n💡 Через Stream API можно применить `groupingBy()` и `counting()` или `summingInt()`.  \n💡 Для пустого списка нужно вернуть пустую карту.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через цикл:\n\n```java\npublic Map<Integer, Integer> countElementItems(\n        List<Integer> list\n) {\n    if (list == null || list.isEmpty()) {\n        return new HashMap<>();\n    }\n\n    Map<Integer, Integer> result = new HashMap<>();\n\n    for (Integer value : list) {\n        result.merge(value, 1, Integer::sum);\n    }\n\n    return result;\n}\n```\n\nВариант через Stream API:\n\n```java\npublic Map<Integer, Integer> countElementItems(\n        List<Integer> list\n) {\n    if (list == null || list.isEmpty()) {\n        return new HashMap<>();\n    }\n\n    return list.stream()\n            .collect(Collectors.groupingBy(\n                    value -> value,\n                    Collectors.summingInt(value -> 1)\n            ));\n}\n```\n\nКлючами карты являются уникальные элементы списка, а значениями — количество их вхождений.\n\nДля сохранения порядка первого появления элементов можно использовать `LinkedHashMap`:\n\n```java\nreturn list.stream()\n        .collect(Collectors.groupingBy(\n                value -> value,\n                LinkedHashMap::new,\n                Collectors.summingInt(value -> 1)\n        ));\n```\n\nВременная сложность — `O(n)`, дополнительная память — `O(k)`, где `k` — количество уникальных элементов.\n\n{{< /details >}}"
  filepath = "count-elements"

[[tasks]]
  id = 46
  question = "Найти младшего пользователя для каждого имени"
  answer = "**Условие задачи:**  \nДан список пользователей `List<User>`. Необходимо получить младшего пользователя для каждого имени.\n\nПоля класса `User`:\n\n- `String name`;\n    \n- `String surname`;\n    \n- `int age`.\n    \n\n**Код:**\n\n```java\nList<User> users = new ArrayList<>();\n\nusers.add(new User(\"Alex\", \"Ivanov\", 28));\nusers.add(new User(\"Alex\", \"Petrov\", 21));\n\nusers.add(new User(\"Mary\", \"Ivanova\", 34));\nusers.add(new User(\"Mary\", \"Petrova\", 25));\nusers.add(new User(\"Mary\", \"Sidonova\", 33));\n\nusers.add(new User(\"Anton\", \"Ivanov\", 33));\nusers.add(new User(\"Anton\", \"Petrov\", 33));\nusers.add(new User(\"Anton\", \"Sidorov\", 33));\n\nSystem.out.println(\"Hello, World!\");\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Пользователей нужно сгруппировать по полю `name`.  \n💡 При совпадении имён нужно оставить пользователя с минимальным возрастом.  \n💡 Удобно использовать `Collectors.toMap()` с функцией объединения значений.  \n💡 Для сравнения пользователей подойдёт `Comparator.comparingInt(User::getAge)`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nMap<String, User> youngestByName = users.stream()\n        .collect(Collectors.toMap(\n                User::getName,\n                Function.identity(),\n                BinaryOperator.minBy(\n                        Comparator.comparingInt(User::getAge)\n                )\n        ));\n\nyoungestByName.forEach((name, user) ->\n        System.out.println(\n                name + \" -> \"\n                        + user.getSurname()\n                        + \", age \"\n                        + user.getAge()\n        )\n);\n```\n\nМетод `toMap()` использует имя пользователя как ключ:\n\n```java\nUser::getName\n```\n\nПри появлении двух пользователей с одинаковым именем функция объединения оставляет младшего:\n\n```java\nBinaryOperator.minBy(\n        Comparator.comparingInt(User::getAge)\n)\n```\n\nРезультат:\n\n```text\nAlex -> Petrov, age 21\nMary -> Petrova, age 25\nAnton -> Ivanov, age 33\n```\n\nЕсли у нескольких пользователей с одним именем одинаковый минимальный возраст, останется первый встретившийся пользователь.\n\nВременная сложность — `O(n)`, дополнительная память — `O(k)`, где `k` — количество уникальных имён.\n\n{{< /details >}}"
  filepath = "youngest-user-by-name"

[[tasks]]
  id = 47
  question = "Проверить являются ли строки перестановками друг друга"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод `arePermutations(String a, String b)`, который проверяет, состоят ли строки из одинаковых символов с одинаковым количеством вхождений.\n\nПорядок символов может отличаться.\n\n**Код:**\n\n```java\nSystem.out.println(arePermutations(\"abc\", \"bca\"));   // true\nSystem.out.println(arePermutations(\"aab\", \"aba\"));   // true\nSystem.out.println(arePermutations(\"abc\", \"abcc\"));  // false\nSystem.out.println(arePermutations(\"\", \"\"));         // true\nSystem.out.println(arePermutations(null, \"abc\"));    // false\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Если одна из строк равна `null`, верни `false`.  \n💡 Строки разной длины не могут быть перестановками.  \n💡 Простой вариант — отсортировать символы и сравнить массивы.  \n💡 Более эффективный вариант — посчитать частоты символов.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через сортировку:\n\n```java\nstatic boolean arePermutations(String a, String b) {\n    if (a == null || b == null) {\n        return false;\n    }\n\n    if (a.length() != b.length()) {\n        return false;\n    }\n\n    char[] first = a.toCharArray();\n    char[] second = b.toCharArray();\n\n    Arrays.sort(first);\n    Arrays.sort(second);\n\n    return Arrays.equals(first, second);\n}\n```\n\nВременная сложность — `O(n log n)`, дополнительная память — `O(n)`.\n\nВариант через подсчёт частот:\n\n```java\nstatic boolean arePermutationsLinear(String a, String b) {\n    if (a == null || b == null) {\n        return false;\n    }\n\n    if (a.length() != b.length()) {\n        return false;\n    }\n\n    Map<Character, Integer> frequencies = new HashMap<>();\n\n    for (char symbol : a.toCharArray()) {\n        frequencies.merge(symbol, 1, Integer::sum);\n    }\n\n    for (char symbol : b.toCharArray()) {\n        Integer count = frequencies.get(symbol);\n\n        if (count == null) {\n            return false;\n        }\n\n        if (count == 1) {\n            frequencies.remove(symbol);\n        } else {\n            frequencies.put(symbol, count - 1);\n        }\n    }\n\n    return frequencies.isEmpty();\n}\n```\n\nВременная сложность — `O(n)`, дополнительная память — `O(k)`, где `k` — количество уникальных символов.\n\nПустые строки считаются перестановками друг друга, поскольку обе содержат одинаковый набор символов.\n\n{{< /details >}}"
  filepath = "permutations-of-strings"

[[tasks]]
  id = 48
  question = "Получить первый элемент списка с сохранением типа"
  answer = "**Условие задачи:**  \nНеобходимо реализовать универсальный метод, который получает первый элемент списка и сохраняет его тип.\n\nЭлементы списка могут иметь произвольный тип. Решение должно быть типобезопасным и не требовать явного приведения типов.\n\n**Код:**\n\n```java\nclass A {\n\n    public static T getFirstElementOfList(List<T> list) {\n        return list.size() > 0 ? list.get(0) : null;\n    }\n}\n```\n\nТакже необходимо объяснить использование wildcard:\n\n```java\nmethod(List<? extends T> producer)\n\nmethod(List<? super T> consumer)\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Параметр типа метода указывается перед возвращаемым типом: `<T>`.  \n💡 Вместо `null` можно возвращать `Optional<T>`.  \n💡 Если список предоставляет значения типа `T`, используй `? extends T`.  \n💡 Если в список записываются значения типа `T`, используй `? super T`.  \n💡 Это правило называется PECS: Producer Extends, Consumer Super.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nТипобезопасный вариант с `Optional`:\n\n```java\nclass A {\n\n    public static <T> Optional<T> firstOf(\n            List<? extends T> list\n    ) {\n        if (list == null || list.isEmpty()) {\n            return Optional.empty();\n        }\n\n        return Optional.ofNullable(list.get(0));\n    }\n}\n```\n\nПример использования:\n\n```java\nList<Integer> numbers = List.of(1, 2, 3);\n\nOptional<Integer> first = A.firstOf(numbers);\n\nfirst.ifPresent(System.out::println);\n```\n\nЕсли по контракту допустимо возвращать `null`:\n\n```java\npublic static <T> T firstOrNull(\n        List<? extends T> list\n) {\n    if (list == null || list.isEmpty()) {\n        return null;\n    }\n\n    return list.get(0);\n}\n```\n\nПример producer:\n\n```java\npublic static <T> void readValues(\n        List<? extends T> producer\n) {\n    for (T value : producer) {\n        System.out.println(value);\n    }\n}\n```\n\nИз `List<? extends T>` можно безопасно читать элементы как `T`, но нельзя добавлять новые значения, поскольку конкретный подтип неизвестен.\n\nПример consumer:\n\n```java\npublic static <T> void addValue(\n        List<? super T> consumer,\n        T value\n) {\n    consumer.add(value);\n}\n```\n\nВ `List<? super T>` можно безопасно добавлять значения типа `T`, но результат чтения доступен только как `Object`.\n\nПример с иерархией числовых типов:\n\n```java\nList<Integer> integers = List.of(1, 2, 3);\nList<Number> numbers = new ArrayList<>();\nList<Object> objects = new ArrayList<>();\n\nOptional<Integer> firstInteger = firstOf(integers);\nOptional<Number> firstNumber = firstOf(integers);\n\naddValue(numbers, 10);\naddValue(objects, 10);\n```\n\n`Integer` и `AtomicInteger` являются разными наследниками класса `Number`:\n\n```text\nObject\n└── Number\n    ├── Integer\n    └── AtomicInteger\n```\n\n{{< /details >}}"
  filepath = "generic-first-element"

[[tasks]]
  id = 49
  question = "Сгруппировать анаграммы"
  answer = "**Условие задачи:**  \nДан массив строк. Необходимо сгруппировать слова, являющиеся анаграммами друг друга.\n\nВнутри каждой группы слова должны быть отсортированы лексикографически. Повторяющиеся элементы необходимо сохранить.\n\nПредполагается, что строки состоят из строчных латинских букв `a-z`.\n\n**Код:**\n\n```text\nВвод:\n[\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"batq\"]\n\nВывод:\n[\n    [\"ate\", \"eat\", \"tea\"],\n    [\"batq\"],\n    [\"nat\", \"tan\"]\n]\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Анаграммы содержат одинаковое количество каждой буквы.  \n💡 Частоты букв можно хранить в массиве `int[26]`.  \n💡 На основе массива частот сформируй ключ для `Map`.  \n💡 Значением карты будет список слов с одинаковым ключом.  \n💡 После группировки отсортируй слова внутри каждой группы.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static List<List<String>> groupAnagrams(String[] words) {\n    if (words == null || words.length == 0) {\n        return List.of();\n    }\n\n    Map<String, List<String>> groups = new HashMap<>();\n\n    for (String word : words) {\n        int[] frequencies = new int[26];\n\n        for (int i = 0; i < word.length(); i++) {\n            frequencies[word.charAt(i) - 'a']++;\n        }\n\n        StringBuilder key = new StringBuilder();\n\n        for (int frequency : frequencies) {\n            key.append(frequency).append('#');\n        }\n\n        groups.computeIfAbsent(\n                key.toString(),\n                ignored -> new ArrayList<>()\n        ).add(word);\n    }\n\n    List<List<String>> result =\n            new ArrayList<>(groups.values());\n\n    for (List<String> group : result) {\n        Collections.sort(group);\n    }\n\n    result.sort(\n            Comparator.comparing(group -> group.get(0))\n    );\n\n    return result;\n}\n```\n\n`Map<String, List<String>>` подходит для группировки:\n\n- ключ описывает количество каждой буквы в слове;\n    \n- значение содержит все слова с таким набором букв;\n    \n- повторяющиеся слова сохраняются в списке.\n    \n\n`List<List<String>>` естественно представляет итоговый список групп.\n\nПостроение групп выполняется за `O(S)`, где `S` — суммарное количество символов во всех строках. Дополнительно требуется время на обязательную лексикографическую сортировку слов внутри групп.\n\nДополнительная память — `O(S)` для хранения результата и ключей групп.\n\n{{< /details >}}"
  filepath = "group-anagrams"

