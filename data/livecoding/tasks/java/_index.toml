  id = 13
  question = "Реализовать последовательности Фибоначчи длиной n"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод, который принимает число `n` и возвращает последовательность Фибоначчи длиной `n`.\n\nПоследовательность начинается с:\n\n```text\n0, 1, 1, 2, 3, 5, 8, 13, ...\n```\n\nКаждый следующий элемент равен сумме двух предыдущих.\n\nПример:\n\n```text\nВход:  n = 7\nВыход: [0, 1, 1, 2, 3, 5, 8]\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для генерации последовательности достаточно хранить два предыдущих числа.  \n💡 Начальные значения — `0` и `1`.  \n💡 На каждой итерации вычисляй сумму двух предыдущих элементов.  \n💡 Итеративный подход работает за `O(n)` и не создаёт лишних рекурсивных вызовов.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static List<Integer> generateFibonacci(int n) {\n    if (n <= 0) {\n        return new ArrayList<>();\n    }\n\n    List<Integer> result = new ArrayList<>(n);\n\n    int first = 0;\n    int second = 1;\n\n    for (int i = 0; i < n; i++) {\n        result.add(first);\n\n        int next = first + second;\n        first = second;\n        second = next;\n    }\n\n    return result;\n}\n```\n\nПример использования:\n\n```java\nSystem.out.println(generateFibonacci(7));\n```\n\nРезультат:\n\n```text\n[0, 1, 1, 2, 3, 5, 8]\n```\n\nНа каждой итерации в результат добавляется текущее число:\n\n```java\nresult.add(first);\n```\n\nПосле этого вычисляется следующее:\n\n```java\nint next = first + second;\nfirst = second;\nsecond = next;\n```\n\nТаким образом, для вычислений достаточно хранить только два последних значения.\n\nВременная сложность — `O(n)`. Дополнительная память для вычислений — `O(1)`, а для результирующего списка — `O(n)`.\n\nПри использовании `int` последовательность переполнится начиная с `F(47)`. Если нужно поддерживать большие значения `n`, следует использовать `long` или `BigInteger`.\n\n{{< /details >}}"
  filepath = "fibonacci-sequence"

[[tasks]]
  id = 14
  question = "Найти первый уникальный символ в строке"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод `findFirstUniqueLetter(String str)`, который возвращает первый символ строки, встречающийся ровно один раз.\n\nЕсли уникальных символов нет, можно вернуть специальное значение, например пробел `' '`.\n\n**Код:**\n\n```java\npublic class Main {\n\n    public static void main(String[] args) {\n        test();\n    }\n\n    private static char findFirstUniqueLetter(String str) {\n        // Write your code here\n    }\n\n    private static void test() {\n        Map<String, Character> testInOut = new HashMap<>() {{\n            put(\"summer time sadness\", 'u');\n            put(\"AA bb CC d\", 'd');\n        }};\n\n        testInOut.forEach((input, expected) -> {\n            char answer = findFirstUniqueLetter(input);\n\n            if (answer == expected) {\n                System.out.println(\"Passed\");\n            } else {\n                System.out.printf(\n                        \"Not passed. Received %s but expected %s%n\",\n                        answer,\n                        expected\n                );\n            }\n        });\n    }\n}\n```\n\nПримеры:\n\n```text\nfindFirstUniqueLetter(\"summer time sadness\") → 'u'\nfindFirstUniqueLetter(\"AA bb CC d\")           → 'd'\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала посчитай количество вхождений каждого символа.  \n💡 Для подсчёта удобно использовать `HashMap<Character, Integer>`.  \n💡 Затем ещё раз пройди по исходной строке слева направо.  \n💡 Первый символ с частотой `1` и будет ответом.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nprivate static char findFirstUniqueLetter(String str) {\n    Map<Character, Integer> frequencies = new HashMap<>();\n\n    for (char ch : str.toCharArray()) {\n        frequencies.merge(ch, 1, Integer::sum);\n    }\n\n    for (char ch : str.toCharArray()) {\n        if (frequencies.get(ch) == 1) {\n            return ch;\n        }\n    }\n\n    return ' ';\n}\n```\n\nНа первом проходе:\n\n```java\nfrequencies.merge(ch, 1, Integer::sum);\n```\n\nподсчитывается количество появлений каждого символа.\n\nНа втором проходе строка просматривается в исходном порядке:\n\n```java\nfor (char ch : str.toCharArray()) {\n    if (frequencies.get(ch) == 1) {\n        return ch;\n    }\n}\n```\n\nПоэтому возвращается именно **первый** уникальный символ.\n\nДля строки:\n\n```text\nsummer time sadness\n```\n\nпервым символом, встречающимся один раз, является:\n\n```text\nu\n```\n\n`LinkedHashMap` здесь не требуется: порядок мы получаем из второго прохода по исходной строке.\n\nВременная сложность в среднем — `O(n)`, дополнительная память — `O(k)`, где `k` — количество различных символов.\n\nВозврат `' '` используется как специальное значение согласно условию. В реальном коде, если пробел сам может быть уникальным символом, лучше изменить контракт метода и возвращать `Optional<Character>`.\n\n{{< /details >}}"
  filepath = "first-unique-char"

[[tasks]]
  id = 15
  question = "Отсортировать массив чисел по возрастанию"
  answer = "**Условие задачи:**  \nДан массив целых чисел `int[]`.\n\nНеобходимо реализовать функцию, которая сортирует массив по возрастанию и возвращает результат.\n\nНельзя использовать готовый метод `Arrays.sort()`.\n\nПример 1:\n\n```text\nВход:  [9, 4, 7, 3, 1]\nВыход: [1, 3, 4, 7, 9]\n```\n\nПример 2:\n\n```text\nВход:  [5, 1, 1, 2, 0, 0]\nВыход: [0, 0, 1, 1, 2, 5]\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Можно использовать пузырьковую сортировку.  \n💡 Сравнивай соседние элементы и меняй их местами, если левый больше правого.  \n💡 После каждого полного прохода самый большой элемент оказывается в конце массива.  \n💡 Если за проход не произошло ни одной перестановки, массив уже отсортирован и алгоритм можно завершить раньше.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static int[] sortArray(int[] arr) {\n    for (int i = 0; i < arr.length - 1; i++) {\n        boolean swapped = false;\n\n        for (int j = 0; j < arr.length - 1 - i; j++) {\n            if (arr[j] > arr[j + 1]) {\n                int temp = arr[j];\n                arr[j] = arr[j + 1];\n                arr[j + 1] = temp;\n\n                swapped = true;\n            }\n        }\n\n        if (!swapped) {\n            break;\n        }\n    }\n\n    return arr;\n}\n```\n\nНа каждой итерации сравниваются соседние элементы:\n\n```java\nif (arr[j] > arr[j + 1])\n```\n\nЕсли они расположены в неправильном порядке, элементы меняются местами.\n\nПосле первого прохода максимальный элемент оказывается в конце массива, поэтому на следующем проходе последний элемент уже можно не проверять:\n\n```java\nj < arr.length - 1 - i\n```\n\nФлаг:\n\n```java\nboolean swapped = false;\n```\n\nпозволяет закончить работу раньше, если массив уже отсортирован.\n\nПример:\n\n```java\nint[] nums = {9, 4, 7, 3, 1};\n\nSystem.out.println(\n        Arrays.toString(sortArray(nums))\n);\n```\n\nРезультат:\n\n```text\n[1, 3, 4, 7, 9]\n```\n\nАлгоритм сортирует исходный массив на месте.\n\nВременная сложность:\n\n- худший и средний случай — `O(n²)`;\n    \n- лучший случай для уже отсортированного массива — `O(n)` благодаря флагу `swapped`.\n    \n\nДополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "sort-array"

[[tasks]]
  id = 16
  question = "Реализовать простое двоичное дерево поиска"
  answer = "**Условие задачи:**  \nНеобходимо реализовать простое двоичное дерево поиска (`Binary Search Tree`, BST).\n\nДерево должно поддерживать:\n\n- добавление элементов;\n    \n- обход `in-order`: левое поддерево → текущий узел → правое поддерево.\n    \n\nДля BST выполняется правило:\n\n- значения меньше текущего хранятся слева;\n    \n- значения больше текущего хранятся справа.\n    \n\nПри `in-order` обходе значения BST выводятся в отсортированном порядке.\n\nПример:\n\n```text\nВход:\n[5, 3, 7, 2, 4, 6, 8]\n\nДерево:\n\n        5\n       / \\\n      3   7\n     / \\ / \\\n    2  4 6  8\n\nРезультат:\n[2, 3, 4, 5, 6, 7, 8]\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Каждый узел хранит значение и ссылки на левый и правый дочерние узлы.  \n💡 При вставке значения меньше текущего узла идут влево, больше — вправо.  \n💡 Для `in-order` обхода сначала рекурсивно обойди левое поддерево, затем текущий узел, затем правое.  \n💡 Дубликаты нужно обработать явно — в простом варианте их можно не добавлять.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class BinarySearchTree {\n\n    private static class Node {\n        private final int value;\n        private Node left;\n        private Node right;\n\n        private Node(int value) {\n            this.value = value;\n        }\n    }\n\n    private Node root;\n\n    public void insert(int value) {\n        root = insert(root, value);\n    }\n\n    private Node insert(Node node, int value) {\n        if (node == null) {\n            return new Node(value);\n        }\n\n        if (value < node.value) {\n            node.left = insert(node.left, value);\n        } else if (value > node.value) {\n            node.right = insert(node.right, value);\n        }\n\n        return node;\n    }\n\n    public List<Integer> inOrder() {\n        List<Integer> result = new ArrayList<>();\n        inOrder(root, result);\n        return result;\n    }\n\n    private void inOrder(Node node, List<Integer> result) {\n        if (node == null) {\n            return;\n        }\n\n        inOrder(node.left, result);\n        result.add(node.value);\n        inOrder(node.right, result);\n    }\n}\n```\n\nПример использования:\n\n```java\nBinarySearchTree tree = new BinarySearchTree();\n\ntree.insert(5);\ntree.insert(3);\ntree.insert(7);\ntree.insert(2);\ntree.insert(4);\ntree.insert(6);\ntree.insert(8);\n\nSystem.out.println(tree.inOrder());\n```\n\nРезультат:\n\n```text\n[2, 3, 4, 5, 6, 7, 8]\n```\n\nПри вставке:\n\n```java\nif (value < node.value) {\n    node.left = insert(node.left, value);\n} else if (value > node.value) {\n    node.right = insert(node.right, value);\n}\n```\n\nзначение рекурсивно направляется в левое или правое поддерево.\n\nЕсли значение уже существует, новая вершина не создаётся.\n\n`in-order` обход выполняется в порядке:\n\n```java\ninOrder(node.left, result);\nresult.add(node.value);\ninOrder(node.right, result);\n```\n\nПоэтому для двоичного дерева поиска результат будет отсортирован по возрастанию.\n\nСложность вставки зависит от высоты дерева `h`:\n\n- в среднем — `O(log n)`;\n    \n- в худшем случае, если дерево вырождается в список, — `O(n)`.\n    \n\nОбход всего дерева занимает `O(n)`. Дополнительная память рекурсивного обхода — `O(h)` плюс `O(n)` для результирующего списка.\n\n{{< /details >}}"
  filepath = "binary-tree"

[[tasks]]
  id = 17
  question = "Развернуть цифры целого числа"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод, который принимает целое число `x`, разворачивает порядок его цифр и возвращает полученное число.\n\nТребования:\n\n- входное число должно находиться в диапазоне `[-10000, 10000]`;\n    \n- если число выходит за этот диапазон, необходимо выбросить исключение;\n    \n- знак числа должен сохраняться;\n    \n- ведущие нули после разворота отбрасываются автоматически.\n    \n\nПримеры:\n\n```text\n123   → 321\n-123  → -321\n120   → 21\n0     → 0\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала проверь допустимый диапазон входного числа.  \n💡 Через `% 10` можно получить последнюю цифру числа.  \n💡 Через `/ 10` можно удалить последнюю цифру.  \n💡 На каждом шаге умножай накопленный результат на `10` и добавляй очередную цифру.  \n💡 Удобно отдельно сохранить знак числа и работать с его модулем.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static int reverse(int x) {\n    if (x < -10000 || x > 10000) {\n        throw new IllegalArgumentException(\n                \"Число должно быть в диапазоне [-10000, 10000]\"\n        );\n    }\n\n    int sign = x < 0 ? -1 : 1;\n    int number = Math.abs(x);\n    int reversed = 0;\n\n    while (number > 0) {\n        int digit = number % 10;\n\n        reversed = reversed * 10 + digit;\n        number /= 10;\n    }\n\n    return reversed * sign;\n}\n```\n\nНапример, для числа `123`:\n\n```text\n123 → digit = 3 → reversed = 3\n12  → digit = 2 → reversed = 32\n1   → digit = 1 → reversed = 321\n```\n\nПоследняя цифра получается через:\n\n```java\nint digit = number % 10;\n```\n\nПосле этого она добавляется к результату:\n\n```java\nreversed = reversed * 10 + digit;\n```\n\nа из исходного числа удаляется:\n\n```java\nnumber /= 10;\n```\n\nДля отрицательного числа вычисления выполняются с модулем, а знак возвращается в конце:\n\n```java\nreturn reversed * sign;\n```\n\nДля `120` получится `21`, поскольку ведущие нули у целого числа не сохраняются.\n\nВременная сложность — `O(d)`, где `d` — количество цифр числа. Дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "reverse-number"

[[tasks]]
  id = 18
  question = "Проверить, что символы строки повторяются не более двух раз  "
  answer = "**Условие задачи:**  \nДана непустая строка.\n\nНеобходимо проверить, что ни один символ в строке не встречается более двух раз.\n\nМетод должен вернуть:\n\n- `true` — если каждый символ встречается не более двух раз;\n    \n- `false` — если хотя бы один символ встречается три раза или больше.\n    \n\nПримеры:\n\n```text\n\"aabbcc\" → true\n\"aaabbc\" → false\n\"abcabc\" → true\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для каждого символа нужно хранить количество его появлений.  \n💡 Для этого удобно использовать `HashMap`.  \n💡 Как только количество какого-либо символа становится больше двух, можно сразу вернуть `false`.  \n💡 Полностью обрабатывать строку после этого уже не требуется.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static boolean validateString(String input) {\n    if (input == null || input.isEmpty()) {\n        throw new IllegalArgumentException(\n                \"Строка не должна быть null или пустой\"\n        );\n    }\n\n    Map<Character, Integer> frequencies = new HashMap<>();\n\n    for (char ch : input.toCharArray()) {\n        int count = frequencies.getOrDefault(ch, 0) + 1;\n\n        if (count > 2) {\n            return false;\n        }\n\n        frequencies.put(ch, count);\n    }\n\n    return true;\n}\n```\n\nДля каждого символа определяется новое количество вхождений:\n\n```java\nint count = frequencies.getOrDefault(ch, 0) + 1;\n```\n\nЕсли символ появился третий раз:\n\n```java\nif (count > 2) {\n    return false;\n}\n```\n\nметод сразу завершает работу.\n\nНапример, для строки:\n\n```text\naaabbc\n```\n\nобработка символа `a` будет выглядеть так:\n\n```text\na → 1\na → 2\na → 3 → false\n```\n\nЕсли строка полностью обработана и ни один символ не встретился более двух раз, возвращается:\n\n```java\nreturn true;\n```\n\nВременная сложность в среднем — `O(n)`, дополнительная память — `O(k)`, где `k` — количество различных символов.\n\nЕсли под «любыми символами» требуется корректная работа со всеми Unicode-кодпоинтами, включая символы за пределами BMP, вместо `char` следует обрабатывать `input.codePoints()` и хранить частоты в `Map<Integer, Integer>`.\n\n{{< /details >}}"
  filepath = "string-repetition"

[[tasks]]
  id = 19
  question = "Подсчитать количество `a` в бесконечно повторяющейся строке  "
  answer = "**Условие задачи:**  \nДана непустая строка `s`, состоящая из строчных английских букв. Строка повторяется бесконечно.\n\nТакже дано число `n`.\n\nНеобходимо определить, сколько символов `'a'` содержится в первых `n` символах бесконечно повторяющейся строки.\n\nПример 1:\n\n```text\ns = \"abcac\"\nn = 10\n\nБесконечная строка:\nabcacabcacabcac...\n\nПервые 10 символов:\nabcacabcac\n\nРезультат: 4\n```\n\nПример 2:\n\n```text\ns = \"a\"\nn = 1000000000000\n\nРезультат: 1000000000000\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Не нужно создавать строку длиной `n`.  \n💡 Сначала посчитай количество `'a'` в одном экземпляре строки `s`.  \n💡 Количество полных повторений строки равно `n / s.length()`.  \n💡 После полных повторений может остаться префикс длиной `n % s.length()`.  \n💡 Для `n` и результата используй `long`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static long repeatedString(String s, long n) {\n    long countInString = 0;\n\n    for (int i = 0; i < s.length(); i++) {\n        if (s.charAt(i) == 'a') {\n            countInString++;\n        }\n    }\n\n    long fullRepeats = n / s.length();\n    long result = fullRepeats * countInString;\n\n    int remainder = (int) (n % s.length());\n\n    for (int i = 0; i < remainder; i++) {\n        if (s.charAt(i) == 'a') {\n            result++;\n        }\n    }\n\n    return result;\n}\n```\n\nСначала считаем количество символов `'a'` в одной строке:\n\n```java\nfor (int i = 0; i < s.length(); i++) {\n    if (s.charAt(i) == 'a') {\n        countInString++;\n    }\n}\n```\n\nКоличество полных повторений:\n\n```java\nlong fullRepeats = n / s.length();\n```\n\nНапример, если:\n\n```text\ns.length() = 5\nn = 12\n```\n\nто строка полностью помещается два раза, а ещё остаются два символа:\n\n```text\n12 / 5 = 2\n12 % 5 = 2\n```\n\nКоличество `'a'` в полных повторениях:\n\n```java\nlong result = fullRepeats * countInString;\n```\n\nПосле этого отдельно проверяется оставшийся префикс:\n\n```java\nint remainder = (int) (n % s.length());\n\nfor (int i = 0; i < remainder; i++) {\n    if (s.charAt(i) == 'a') {\n        result++;\n    }\n}\n```\n\nТакой подход не создаёт строку огромного размера и работает даже для очень больших значений `n`.\n\nВременная сложность — `O(|s|)`, дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "repeated-string"

[[tasks]]
  id = 20
  question = "Отфильтровать список пользователей in-place"
  answer = "**Условие задачи:**  \nДан изменяемый список `ArrayList<User>`.\n\nНеобходимо реализовать метод `filterUsers()`, который изменяет исходный список **in-place**, оставляя только пользователей, у которых:\n\n- имя начинается с `namePrefix`;\n    \n- возраст строго больше `18`.\n    \n\nСоздавать новый список не требуется.\n\n**Код:**\n\n```java\n@Data\nclass User {\n    private String name;\n    private int age;\n}\n\npublic class UserUtils {\n\n    public static void filterUsers(\n            ArrayList<User> users,\n            String namePrefix\n    ) {\n        // ваш код\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Поскольку список нужно изменить in-place, можно использовать `removeIf()`.  \n💡 Удалять нужно пользователей, которые **не удовлетворяют** хотя бы одному из условий.  \n💡 Для проверки имени используй `startsWith(namePrefix)`.  \n💡 Пользователь остаётся только при `age > 18`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nСамый простой вариант:\n\n```java\npublic static void filterUsers(\n        ArrayList<User> users,\n        String namePrefix\n) {\n    users.removeIf(user ->\n            !user.getName().startsWith(namePrefix)\n                    || user.getAge() <= 18\n    );\n}\n```\n\nОставить пользователя нужно, если одновременно выполняются два условия:\n\n```java\nuser.getName().startsWith(namePrefix)\n        && user.getAge() > 18\n```\n\nСледовательно, удалить нужно всё, что этому условию не соответствует:\n\n```java\n!user.getName().startsWith(namePrefix)\n        || user.getAge() <= 18\n```\n\n`removeIf()` изменяет исходный список, поэтому дополнительная коллекция не создаётся.\n\nАльтернативный вариант через `Iterator`:\n\n```java\npublic static void filterUsers(\n        ArrayList<User> users,\n        String namePrefix\n) {\n    Iterator<User> iterator = users.iterator();\n\n    while (iterator.hasNext()) {\n        User user = iterator.next();\n\n        if (!user.getName().startsWith(namePrefix)\n                || user.getAge() <= 18) {\n            iterator.remove();\n        }\n    }\n}\n```\n\nДля `ArrayList` предпочтительнее `removeIf()`: он не только короче, но и позволяет удалить подходящие элементы более эффективно, чем последовательные `Iterator.remove()`, которые могут многократно сдвигать элементы массива.\n\n{{< /details >}}"
  filepath = "filter-users-in-place"

[[tasks]]
  id = 21
  question = "Найти первый неповторяющийся элемент в массиве"
  answer = "**Условие задачи:**  \nДан массив целых чисел.\n\nНеобходимо найти первый элемент, который встречается в массиве ровно один раз.\n\n**Код:**\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        int[] array = {9, 4, 9, 6, 6, 4, 5};\n        // TODO\n    }\n}\n```\n\nПример 1:\n\n```text\nВход:  [9, 4, 9, 6, 6, 4, 5]\nВыход: 5\n```\n\nПример 2:\n\n```text\nВход:  [1, 2, 3, 2, 1]\nВыход: 3\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала подсчитай количество вхождений каждого числа.  \n💡 Для этого удобно использовать `HashMap<Integer, Integer>`.  \n💡 Затем ещё раз пройди по исходному массиву слева направо.  \n💡 Первый элемент с частотой `1` и будет ответом.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static OptionalInt findFirstUnique(int[] array) {\n    Map<Integer, Integer> frequencies = new HashMap<>();\n\n    for (int value : array) {\n        frequencies.merge(value, 1, Integer::sum);\n    }\n\n    for (int value : array) {\n        if (frequencies.get(value) == 1) {\n            return OptionalInt.of(value);\n        }\n    }\n\n    return OptionalInt.empty();\n}\n```\n\nПример использования:\n\n```java\nint[] array = {9, 4, 9, 6, 6, 4, 5};\n\nfindFirstUnique(array)\n        .ifPresentOrElse(\n                System.out::println,\n                () -> System.out.println(\"Уникальных элементов нет\")\n        );\n```\n\nРезультат:\n\n```text\n5\n```\n\nНа первом проходе подсчитывается частота каждого значения:\n\n```java\nfrequencies.merge(value, 1, Integer::sum);\n```\n\nПосле этого массив просматривается повторно в исходном порядке:\n\n```java\nfor (int value : array) {\n    if (frequencies.get(value) == 1) {\n        return OptionalInt.of(value);\n    }\n}\n```\n\nИменно второй проход гарантирует, что будет найден **первый** неповторяющийся элемент.\n\n`LinkedHashMap` здесь не требуется, поскольку порядок элементов берётся непосредственно из исходного массива.\n\n`OptionalInt` позволяет корректно обозначить отсутствие результата и не использовать специальное значение вроде `-1`, которое само может находиться в массиве.\n\nВременная сложность в среднем — `O(n)`, дополнительная память — `O(k)`, где `k` — количество различных элементов.\n\n{{< /details >}}"
  filepath = "first-non-repeating-element"

[[tasks]]
  id = 22
  question = "Развернуть строку в обратном порядке  "
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод `reverse(String input)`, который возвращает переданную строку в обратном порядке.\n\nТребования:\n\n- если `input == null`, необходимо выбросить `IllegalArgumentException`;\n    \n- пустая строка должна возвращаться без изменений.\n    \n\n**Код:**\n\n```java\npublic class StringUtils {\n\n    public static String reverse(String input) {\n        // ваш код\n    }\n}\n```\n\nПримеры:\n\n```text\n\"hello\" → \"olleh\"\n\"Java\"  → \"avaJ\"\n\"\"      → \"\"\nnull    → IllegalArgumentException\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала проверь входную строку на `null`.  \n💡 Для разворота строки удобно использовать `StringBuilder`.  \n💡 У `StringBuilder` есть готовый метод `reverse()`.  \n💡 Пустая строка не требует отдельной обработки.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static String reverse(String input) {\n    if (input == null) {\n        throw new IllegalArgumentException(\n                \"Input string must not be null\"\n        );\n    }\n\n    return new StringBuilder(input)\n            .reverse()\n            .toString();\n}\n```\n\n`String` в Java неизменяемый, поэтому для разворота удобно создать `StringBuilder`:\n\n```java\nnew StringBuilder(input)\n```\n\nЗатем развернуть последовательность:\n\n```java\n.reverse()\n```\n\nи преобразовать результат обратно в строку:\n\n```java\n.toString()\n```\n\nДля пустой строки:\n\n```text\n\"\"\n```\n\nметод `reverse()` корректно вернёт такую же пустую строку, поэтому отдельная проверка не нужна.\n\nВременная сложность — `O(n)`, дополнительная память для результата — `O(n)`.\n\n{{< /details >}}"
  filepath = "reverse-string"

[[tasks]]
  id = 23
  question = "Реализовать `hashCode()` для класса Point"
  answer = "**Условие задачи:**  \nДан класс `Point` с двумя полями: `int x` и `int y`.\n\nНеобходимо:\n\n- реализовать метод `hashCode()`;\n    \n- учитывать оба поля при вычислении хеша;\n    \n- объяснить, какое значение возвращает `hashCode()` и для чего оно используется.\n    \n\n**Код:**\n\n```java\npublic class Point {\n    private int x;\n    private int y;\n\n    // конструкторы, геттеры/сеттеры\n\n    @Override\n    public int hashCode() {\n        // TODO\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `hashCode()` возвращает целое число типа `int`.  \n💡 Если два объекта равны по `equals()`, их `hashCode()` обязан быть одинаковым.  \n💡 Для объединения нескольких полей часто используется множитель `31`.  \n💡 Если `equals()` сравнивает `x` и `y`, эти же поля должны участвовать и в `hashCode()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class Point {\n    private int x;\n    private int y;\n\n    @Override\n    public int hashCode() {\n        int result = 17;\n        result = 31 * result + x;\n        result = 31 * result + y;\n        return result;\n    }\n\n    @Override\n    public boolean equals(Object obj) {\n        if (this == obj) {\n            return true;\n        }\n\n        if (!(obj instanceof Point)) {\n            return false;\n        }\n\n        Point other = (Point) obj;\n\n        return x == other.x\n                && y == other.y;\n    }\n}\n```\n\n`hashCode()` возвращает значение типа `int`, которое используется хеш-коллекциями, например `HashMap` и `HashSet`, для определения области, в которой следует искать объект.\n\nВ данном случае хеш рассчитывается по обоим полям:\n\n```java\nint result = 17;\nresult = 31 * result + x;\nresult = 31 * result + y;\n```\n\nГлавный контракт между `equals()` и `hashCode()`:\n\n```text\na.equals(b) == true\n        ↓\na.hashCode() == b.hashCode()\n```\n\nОбратное неверно: одинаковые хеш-коды не означают, что объекты обязательно равны. У разных объектов может возникнуть коллизия.\n\nНапример:\n\n```java\nPoint first = new Point(1, 2);\nPoint second = new Point(1, 2);\n```\n\nесли `equals()` сравнивает координаты, то эти объекты равны и должны иметь одинаковый `hashCode()`.\n\nТакже можно использовать более короткую запись:\n\n```java\n@Override\npublic int hashCode() {\n    return Objects.hash(x, y);\n}\n```\n\nНо ручная реализация хорошо показывает принцип вычисления хеша.\n\nВажно: если объект используется как ключ в `HashMap` или хранится в `HashSet`, поля, участвующие в `equals()` и `hashCode()`, нежелательно изменять после добавления объекта в коллекцию. Иначе объект может оказаться в неправильной хеш-корзине и перестать корректно находиться.\n\n{{< /details >}}"
  filepath = "point-hashcode"

[[tasks]]
  id = 24
  question = "Реализовать стек с получением минимума за O(1)  "
  answer = "**Условие задачи:**  \nНеобходимо реализовать класс `MinStack`, который поддерживает операции:\n\n- `void push(int x)` — добавить элемент в стек;\n    \n- `int pop()` — удалить и вернуть верхний элемент;\n    \n- `int top()` — вернуть верхний элемент без удаления;\n    \n- `int peekMin()` — вернуть минимальный элемент стека за `O(1)`.\n    \n\nВсе перечисленные операции должны выполняться за `O(1)`.\n\n**Код:**\n\n```java\npublic class MinStack {\n    // TODO\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй два стека: один для исходных значений, второй — для текущих минимумов.  \n💡 При каждом `push()` сохраняй во втором стеке минимум для текущего состояния.  \n💡 Тогда верхушка второго стека всегда будет содержать минимальное значение.  \n💡 При `pop()` необходимо удалить верхний элемент из обоих стеков.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class MinStack {\n\n    private final Deque<Integer> stack = new ArrayDeque<>();\n    private final Deque<Integer> minStack = new ArrayDeque<>();\n\n    public void push(int value) {\n        stack.push(value);\n\n        if (minStack.isEmpty()) {\n            minStack.push(value);\n        } else {\n            minStack.push(Math.min(value, minStack.peek()));\n        }\n    }\n\n    public int pop() {\n        if (stack.isEmpty()) {\n            throw new NoSuchElementException(\"Стек пуст\");\n        }\n\n        minStack.pop();\n        return stack.pop();\n    }\n\n    public int top() {\n        if (stack.isEmpty()) {\n            throw new NoSuchElementException(\"Стек пуст\");\n        }\n\n        return stack.peek();\n    }\n\n    public int peekMin() {\n        if (minStack.isEmpty()) {\n            throw new NoSuchElementException(\"Стек пуст\");\n        }\n\n        return minStack.peek();\n    }\n}\n```\n\nВо втором стеке на каждой позиции хранится минимальное значение для соответствующего состояния основного стека.\n\nНапример, после:\n\n```java\nminStack.push(Math.min(value, minStack.peek()));\n```\n\nдля последовательности:\n\n```text\npush(5)\npush(2)\npush(4)\npush(1)\n```\n\nстеки будут выглядеть так:\n\n```text\nstack:    [1, 4, 2, 5]\nminStack: [1, 2, 2, 5]\n```\n\nПоэтому текущий минимум всегда находится на вершине:\n\n```java\nreturn minStack.peek();\n```\n\nПри удалении элемента удаляется и соответствующее значение минимума:\n\n```java\nminStack.pop();\nreturn stack.pop();\n```\n\nПример:\n\n```java\nMinStack stack = new MinStack();\n\nstack.push(5);\nstack.push(2);\nstack.push(4);\n\nSystem.out.println(stack.peekMin()); // 2\n\nstack.push(1);\n\nSystem.out.println(stack.peekMin()); // 1\n\nstack.pop();\n\nSystem.out.println(stack.peekMin()); // 2\nSystem.out.println(stack.top());     // 4\n```\n\nСложность операций:\n\n- `push()` — `O(1)`;\n    \n- `pop()` — `O(1)`;\n    \n- `top()` — `O(1)`;\n    \n- `peekMin()` — `O(1)`.\n    \n\nДополнительная память — `O(n)`.\n\nДля реализации стека используется `ArrayDeque`, поскольку для новых реализаций в Java он обычно предпочтительнее устаревшего класса `Stack`.\n\n{{< /details >}}"
  filepath = "min-stack"

[[tasks]]
  id = 25
  question = "Проверить число на простоту"
  answer = "**Условие задачи:**  \nНеобходимо написать консольное приложение, которое считывает целое число и определяет, является ли оно простым.\n\nПростое число — это натуральное число больше `1`, которое делится без остатка только на `1` и на само себя.\n\n**Код:**\n\n```java\npublic class PrimeChecker {\n\n    public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\n        int number = scanner.nextInt();\n\n        if (isPrime(number)) {\n            System.out.println(number + \" — простое число.\");\n        } else {\n            System.out.println(number + \" — не является простым.\");\n        }\n\n        scanner.close();\n    }\n\n    public static boolean isPrime(int n) {\n        // ваш код\n    }\n}\n```\n\nПримеры:\n\n```text\n2  → простое число\n4  → не является простым\n17 → простое число\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Все числа `n <= 1` не являются простыми.  \n💡 `2` — единственное чётное простое число.  \n💡 После проверки на чётность достаточно рассматривать только нечётные делители.  \n💡 Проверять делители достаточно до квадратного корня из `n`.  \n💡 При обнаружении первого делителя можно сразу вернуть `false`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static boolean isPrime(int n) {\n    if (n <= 1) {\n        return false;\n    }\n\n    if (n == 2) {\n        return true;\n    }\n\n    if (n % 2 == 0) {\n        return false;\n    }\n\n    for (int divisor = 3; divisor <= n / divisor; divisor += 2) {\n        if (n % divisor == 0) {\n            return false;\n        }\n    }\n\n    return true;\n}\n```\n\nСначала исключаются числа, которые по определению не могут быть простыми:\n\n```java\nif (n <= 1) {\n    return false;\n}\n```\n\nЧисло `2` обрабатывается отдельно:\n\n```java\nif (n == 2) {\n    return true;\n}\n```\n\nПосле этого можно исключить все остальные чётные числа:\n\n```java\nif (n % 2 == 0) {\n    return false;\n}\n```\n\nДалее проверяются только нечётные делители:\n\n```java\nfor (int divisor = 3; divisor <= n / divisor; divisor += 2)\n```\n\nУсловие:\n\n```java\ndivisor <= n / divisor\n```\n\nэквивалентно проверке до `√n`, но не требует вычисления `Math.sqrt()` и избегает потенциального переполнения выражения `divisor * divisor`.\n\nЕсли найден делитель:\n\n```java\nif (n % divisor == 0) {\n    return false;\n}\n```\n\nчисло является составным.\n\nНапример, для `17` проверяются делители:\n\n```text\n3\n```\n\nНи один из них не делит `17` без остатка, поэтому результат — `true`.\n\nВременная сложность — `O(√n)`, дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "check-prime"

