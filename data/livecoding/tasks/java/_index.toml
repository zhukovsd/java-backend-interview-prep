  id = 26
  question = "Найти слово с минимальной частотой встречаемости"
  answer = "**Условие задачи:**  \nДана очень длинная строка `text`.\n\nНеобходимо найти слово, которое встречается в ней минимальное количество раз, но хотя бы один раз.\n\nЕсли несколько слов имеют одинаковую минимальную частоту, можно вернуть любое из них.\n\n**Код:**\n\n```java\npublic class RareWordFinder {\n\n    public static String findLeastFrequentWord(String text) {\n        // TODO\n    }\n}\n```\n\nПример:\n\n```text\nВход:\n\"apple orange banana apple pear banana apple\"\n\nЧастоты:\napple  → 3\nbanana → 2\norange → 1\npear   → 1\n\nРезультат:\n\"orange\" или \"pear\"\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для каждого слова нужно посчитать количество его появлений через `HashMap<String, Integer>`.  \n💡 После подсчёта пройди по `Map` и найди запись с минимальным значением.  \n💡 Поскольку строка может быть очень длинной, необязательно создавать массив всех слов через `split()`.  \n💡 Если нужно игнорировать регистр и пунктуацию, слова удобно извлекать через регулярное выражение.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static String findLeastFrequentWord(String text) {\n    if (text == null || text.isBlank()) {\n        return null;\n    }\n\n    Map<String, Integer> frequencies = new HashMap<>();\n\n    Matcher matcher = Pattern\n            .compile(\"[\\\\p{L}\\\\p{N}]+\")\n            .matcher(text);\n\n    while (matcher.find()) {\n        String word = matcher.group().toLowerCase(Locale.ROOT);\n        frequencies.merge(word, 1, Integer::sum);\n    }\n\n    String rareWord = null;\n    int minFrequency = Integer.MAX_VALUE;\n\n    for (Map.Entry<String, Integer> entry : frequencies.entrySet()) {\n        if (entry.getValue() < minFrequency) {\n            minFrequency = entry.getValue();\n            rareWord = entry.getKey();\n        }\n    }\n\n    return rareWord;\n}\n```\n\nСначала слова извлекаются из строки:\n\n```java\nMatcher matcher = Pattern\n        .compile(\"[\\\\p{L}\\\\p{N}]+\")\n        .matcher(text);\n```\n\nТакой вариант позволяет не создавать промежуточный массив всех слов, что полезно для длинного текста.\n\nДля каждого найденного слова увеличивается счётчик:\n\n```java\nfrequencies.merge(word, 1, Integer::sum);\n```\n\nНапример:\n\n```text\napple  → 3\norange → 1\nbanana → 2\npear   → 1\n```\n\nПосле этого достаточно найти минимальное значение в карте:\n\n```java\nfor (Map.Entry<String, Integer> entry : frequencies.entrySet()) {\n    if (entry.getValue() < minFrequency) {\n        minFrequency = entry.getValue();\n        rareWord = entry.getKey();\n    }\n}\n```\n\nЕсли несколько слов имеют одинаковую минимальную частоту, будет возвращено одно из них, что соответствует условию задачи.\n\nДля примера:\n\n```java\nString text =\n        \"apple orange banana! apple, pear? banana apple\";\n\nSystem.out.println(findLeastFrequentWord(text));\n```\n\nрезультатом может быть:\n\n```text\norange\n```\n\nили:\n\n```text\npear\n```\n\nВременная сложность — в среднем `O(n)`, где `n` — длина текста. Дополнительная память — `O(k)`, где `k` — количество различных слов.\n\n{{< /details >}}"
  filepath = "find-rare-word"

[[tasks]]
  id = 27
  question = "Подсчитать количество повторений каждого слова в строке"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод `countWords(String text)`, который принимает строку и возвращает `HashMap<String, Integer>`:\n\n- ключ — слово из строки;\n    \n- значение — количество вхождений этого слова.\n    \n\nСлова разделяются одним или несколькими пробельными символами.\n\n**Код:**\n\n```java\npublic class WordCounter {\n\n    public static HashMap<String, Integer> countWords(String text) {\n        // TODO\n    }\n}\n```\n\nПример 1:\n\n```text\nВход:\n\"тест тест1 нетест слово тест2 тест1 тест тест\"\n\nРезультат:\n\"тест\"   → 3\n\"тест1\"  → 2\n\"нетест\" → 1\n\"слово\"  → 1\n\"тест2\"  → 1\n```\n\nПример 2:\n\n```text\nВход:\n\"apple banana apple\"\n\nРезультат:\n\"apple\"  → 2\n\"banana\" → 1\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Разбей строку на слова с помощью `split(\"\\\\s+\")`.  \n💡 Для хранения количества повторений используй `HashMap<String, Integer>`.  \n💡 Метод `merge()` позволяет компактно увеличить счётчик существующего слова или добавить новое.  \n💡 Для `null` или пустой строки можно вернуть пустую карту.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static HashMap<String, Integer> countWords(String text) {\n    HashMap<String, Integer> result = new HashMap<>();\n\n    if (text == null || text.trim().isEmpty()) {\n        return result;\n    }\n\n    String[] words = text.trim().split(\"\\\\s+\");\n\n    for (String word : words) {\n        result.merge(word, 1, Integer::sum);\n    }\n\n    return result;\n}\n```\n\nСтрока сначала разбивается на слова:\n\n```java\nString[] words = text.trim().split(\"\\\\s+\");\n```\n\nРегулярное выражение `\\\\s+` означает один или несколько пробельных символов, поэтому корректно обрабатываются несколько пробелов подряд, табуляции и переносы строк.\n\nДля каждого слова выполняется:\n\n```java\nresult.merge(word, 1, Integer::sum);\n```\n\nЕсли слова ещё нет в карте, оно добавляется со значением `1`. Если уже есть, текущее значение увеличивается на `1`.\n\nНапример:\n\n```text\n\"apple banana apple\"\n```\n\nдаст следующие частоты:\n\n```text\napple  → 2\nbanana → 1\n```\n\nВременная сложность в среднем — `O(n)`, где `n` — количество символов в строке. Дополнительная память — `O(k)`, где `k` — количество различных слов.\n\n`HashMap` не гарантирует порядок элементов при обходе, поэтому порядок записей в возвращаемой карте может отличаться от порядка слов в примере.\n\n{{< /details >}}"
  filepath = "word-count-map"

[[tasks]]
  id = 28
  question = "Распределить грузы по грузовикам с минимальной недогруженностью"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод `calcTrucks()`, который принимает:\n\n- массив весов грузов `weights`;\n    \n- количество грузовиков `trucksCount`;\n    \n- максимальную грузоподъёмность одного грузовика `truckMaxCapacity`.\n    \n\nКаждый груз можно загрузить не более одного раза. Если груз невозможно или невыгодно разместить, его можно пропустить.\n\nНужно распределить грузы так, чтобы **суммарный вес размещённых грузов был максимальным**, а значит, суммарная недогруженность всех грузовиков — минимальной.\n\nМетод должен вернуть:\n\n```text\ntrucksCount * truckMaxCapacity - суммарный вес размещённых грузов\n```\n\n**Код:**\n\n```java\nprivate int calcTrucks(\n        int[] weights,\n        int trucksCount,\n        int truckMaxCapacity\n) {\n    // TODO\n}\n```\n\nПример 1:\n\n```text\nweights = [10, 100, 20, 30, 40, 10]\ntrucksCount = 4\ntruckMaxCapacity = 100\n\nОбщая вместимость: 400\nВес размещённых грузов: 210\n\nРезультат: 190\n```\n\nПример 2:\n\n```text\nweights = [10, 100, 20, 30, 40]\ntrucksCount = 4\ntruckMaxCapacity = 100\n\nОбщая вместимость: 400\nВес размещённых грузов: 200\n\nРезультат: 200\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Минимизировать свободное место — то же самое, что максимизировать суммарный вес загруженных грузов.  \n💡 Жадный алгоритм вроде Best Fit Decreasing может дать хороший результат, но не гарантирует минимум недогруженности.  \n💡 Для точного решения можно использовать перебор с возвратом (`backtracking`).  \n💡 Сортировка грузов по убыванию позволяет раньше рассматривать тяжёлые грузы.  \n💡 Грузовики с одинаковым остатком вместимости эквивалентны — повторно рассматривать такие состояния не нужно.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nprivate static int calcTrucks(\n        int[] weights,\n        int trucksCount,\n        int truckMaxCapacity\n) {\n    int[] sorted = Arrays.copyOf(weights, weights.length);\n    Arrays.sort(sorted);\n\n    for (int left = 0, right = sorted.length - 1;\n         left < right;\n         left++, right--) {\n\n        int temp = sorted[left];\n        sorted[left] = sorted[right];\n        sorted[right] = temp;\n    }\n\n    int[] remaining = new int[trucksCount];\n    Arrays.fill(remaining, truckMaxCapacity);\n\n    int maxLoaded = findMaxLoaded(sorted, 0, remaining);\n\n    return trucksCount * truckMaxCapacity - maxLoaded;\n}\n\nprivate static int findMaxLoaded(\n        int[] weights,\n        int index,\n        int[] remaining\n) {\n    if (index == weights.length) {\n        return 0;\n    }\n\n    int weight = weights[index];\n\n    // Вариант: не загружать текущий груз\n    int best = findMaxLoaded(weights, index + 1, remaining);\n\n    Set<Integer> usedRemaining = new HashSet<>();\n\n    for (int i = 0; i < remaining.length; i++) {\n        if (remaining[i] < weight) {\n            continue;\n        }\n\n        // Грузовики с одинаковым свободным местом\n        // приводят к одинаковым состояниям.\n        if (!usedRemaining.add(remaining[i])) {\n            continue;\n        }\n\n        remaining[i] -= weight;\n\n        best = Math.max(\n                best,\n                weight + findMaxLoaded(\n                        weights,\n                        index + 1,\n                        remaining\n                )\n        );\n\n        remaining[i] += weight;\n    }\n\n    return best;\n}\n```\n\nКлючевое наблюдение:\n\n```text\nнедогруженность =\nобщая вместимость - загруженный вес\n```\n\nОбщая вместимость постоянна:\n\n```java\ntrucksCount * truckMaxCapacity\n```\n\nпоэтому достаточно найти максимально возможный вес грузов, которые можно разместить.\n\nДля каждого груза рассматриваются варианты:\n\n```text\n1. пропустить груз;\n2. положить в первый подходящий грузовик;\n3. положить во второй подходящий грузовик;\n...\n```\n\nПосле рекурсивного вызова состояние грузовика восстанавливается:\n\n```java\nremaining[i] -= weight;\n\n// рекурсивный поиск\n\nremaining[i] += weight;\n```\n\nЭто классический `backtracking`.\n\nПроверка:\n\n```java\nif (!usedRemaining.add(remaining[i])) {\n    continue;\n}\n```\n\nотсекает симметричные варианты. Например, если три пустых грузовика имеют по `100` свободного места, нет смысла пробовать один и тот же груз отдельно в каждом из них — состояния будут эквивалентны.\n\nДля первого примера все грузы можно разместить:\n\n```text\n100\n40 + 30 + 20 + 10\n10\nпустой грузовик\n```\n\nОбщий загруженный вес:\n\n```text\n210\n```\n\nпоэтому:\n\n```text\n400 - 210 = 190\n```\n\nДля второго примера суммарный вес грузов равен `200`, и все они также помещаются:\n\n```text\n400 - 200 = 200\n```\n\nЗадача в общем случае относится к NP-трудным задачам упаковки. Поэтому точный алгоритм имеет экспоненциальную сложность в худшем случае. Если количество грузов очень велико и допустимо приближённое решение, можно использовать эвристику Best Fit Decreasing, но она не гарантирует минимальную недогруженность.\n\n{{< /details >}}"
  filepath = "calc-trucks"

[[tasks]]
  id = 29
  question = "Найти максимальное расстояние до ближайшего занятого места"
  answer = "**Условие задачи:**  \nДан массив `seats`, описывающий один ряд мест в кинотеатре:\n\n- `1` — место занято;\n    \n- `0` — место свободно.\n    \n\nНовый зритель выбирает свободное место так, чтобы расстояние до ближайшего занятого места было максимально возможным.\n\nГарантируется, что в массиве есть хотя бы одно занятое и хотя бы одно свободное место.\n\nНеобходимо реализовать метод `findBestSeatDist()`, который возвращает максимальное расстояние до ближайшего занятого места.\n\n**Код:**\n\n```java\npublic int findBestSeatDist(int[] seats) {\n    // TODO\n}\n```\n\nПримеры:\n\n```text\n[1, 0, 0, 0, 1]                → 2\n[1, 0, 1, 0, 0, 1, 0, 0, 0, 1] → 2\n[1, 0, 1, 0]                   → 1\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Свободные места можно разделить на три типа участков: до первого занятого, между двумя занятыми и после последнего занятого.  \n💡 На краях лучшее место находится максимально далеко от единственного ближайшего занятого места.  \n💡 Между двумя занятыми местами оптимально выбрать место примерно посередине.  \n💡 Достаточно одного прохода по массиву, запоминая индекс предыдущего занятого места.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic int findBestSeatDist(int[] seats) {\n    int lastOccupied = -1;\n    int maxDistance = 0;\n\n    for (int i = 0; i < seats.length; i++) {\n        if (seats[i] != 1) {\n            continue;\n        }\n\n        if (lastOccupied == -1) {\n            // Свободные места до первого занятого.\n            maxDistance = i;\n        } else {\n            // Расстояние между двумя занятыми местами.\n            int distance = (i - lastOccupied) / 2;\n            maxDistance = Math.max(maxDistance, distance);\n        }\n\n        lastOccupied = i;\n    }\n\n    // Свободные места после последнего занятого.\n    maxDistance = Math.max(\n            maxDistance,\n            seats.length - 1 - lastOccupied\n    );\n\n    return maxDistance;\n}\n```\n\nРассмотрим три возможных случая.\n\nЕсли свободные места находятся **до первого занятого**, например:\n\n```text\n[0, 0, 0, 1]\n```\n\nлучше выбрать самое левое место. Расстояние будет:\n\n```text\n3\n```\n\nПоэтому при обнаружении первого занятого места:\n\n```java\nmaxDistance = i;\n```\n\nЕсли свободные места находятся **между двумя занятыми**:\n\n```text\n[1, 0, 0, 0, 1]\n```\n\nрасстояние между индексами занятых мест равно `4`, поэтому максимальное расстояние до ближайшего из них:\n\n```java\n(4 - 0) / 2 = 2\n```\n\nВ коде:\n\n```java\nint distance = (i - lastOccupied) / 2;\n```\n\nНапример:\n\n```text\n[1, 0, 0, 0, 1]\n       ^\n```\n\nлучшее место находится посередине и имеет расстояние `2`.\n\nНаконец, если свободные места находятся **после последнего занятого**:\n\n```text\n[1, 0, 0, 0]\n```\n\nлучше выбрать последнее место:\n\n```java\nseats.length - 1 - lastOccupied\n```\n\nВременная сложность — `O(n)`, поскольку массив просматривается один раз.\n\nДополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "best-seat-distance"

[[tasks]]
  id = 30
  question = "Проверить вертикальную симметрию набора точек"
  answer = "**Условие задачи:**  \nДан массив точек с целочисленными координатами `(x, y)`.\n\nНеобходимо определить, существует ли вертикальная прямая `x = c`, относительно которой весь набор точек симметричен.\n\nДля каждой точки `(x, y)`, не лежащей на оси симметрии, должна существовать зеркальная точка `(2c - x, y)` с такой же кратностью.\n\nДубликаты точек необходимо учитывать.\n\n**Код:**\n\n```java\npublic class SymmetryChecker {\n\n    public static boolean isVertSym(int[][] points) {\n        // TODO\n    }\n}\n```\n\nПримеры:\n\n```text\n[[0, 0], [0, 1], [1, 1], [2, 2], [3, 1], [4, 1], [4, 0]] → true\n\n[[0, 0], [0, 0], [1, 1], [2, 2], [3, 1], [4, 0], [4, 0]] → true\n\n[[0, 0], [0, 0], [1, 1], [2, 2], [3, 1], [4, 0]] → false\n\n[] → true\n\n[[0, 0]] → true\n\n[[0, 0], [10, 0]] → true\n\n[[0, 0], [11, 1]] → false\n\n[[0, 0], [1, 0], [3, 0]] → false\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Если симметрия существует, ось проходит ровно посередине между минимальным и максимальным `x`.  \n💡 Вместо самого `c` удобно хранить значение `2 * c = minX + maxX`.  \n💡 Для каждой точки `(x, y)` зеркальная точка имеет координаты `(minX + maxX - x, y)`.  \n💡 Используй `Map<Point, Integer>`, чтобы учитывать несколько одинаковых точек.  \n💡 Для суммы координат лучше использовать `long`, чтобы избежать переполнения `int`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static boolean isVertSym(int[][] points) {\n    if (points.length <= 1) {\n        return true;\n    }\n\n    int minX = Integer.MAX_VALUE;\n    int maxX = Integer.MIN_VALUE;\n\n    Map<Point, Integer> frequencies = new HashMap<>();\n\n    for (int[] point : points) {\n        int x = point[0];\n        int y = point[1];\n\n        minX = Math.min(minX, x);\n        maxX = Math.max(maxX, x);\n\n        frequencies.merge(new Point(x, y), 1, Integer::sum);\n    }\n\n    long sum = (long) minX + maxX;\n\n    for (Map.Entry<Point, Integer> entry : frequencies.entrySet()) {\n        Point point = entry.getKey();\n\n        long mirrorX = sum - point.x;\n\n        if (mirrorX < Integer.MIN_VALUE\n                || mirrorX > Integer.MAX_VALUE) {\n            return false;\n        }\n\n        Point mirror = new Point((int) mirrorX, point.y);\n\n        if (!Objects.equals(\n                frequencies.get(mirror),\n                entry.getValue()\n        )) {\n            return false;\n        }\n    }\n\n    return true;\n}\n\nprivate static class Point {\n    private final int x;\n    private final int y;\n\n    private Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    @Override\n    public boolean equals(Object obj) {\n        if (this == obj) {\n            return true;\n        }\n\n        if (!(obj instanceof Point)) {\n            return false;\n        }\n\n        Point other = (Point) obj;\n\n        return x == other.x && y == other.y;\n    }\n\n    @Override\n    public int hashCode() {\n        return Objects.hash(x, y);\n    }\n}\n```\n\nЕсли ось симметрии существует, она определяется крайними точками по `x`.\n\nНапример:\n\n```text\nminX = 0\nmaxX = 4\n```\n\nТогда:\n\n```text\n2 * c = minX + maxX = 4\nc = 2\n```\n\nДля точки:\n\n```text\n(0, 1)\n```\n\nзеркальная координата вычисляется как:\n\n```text\nx' = 4 - 0 = 4\n```\n\nпоэтому должна существовать точка:\n\n```text\n(4, 1)\n```\n\nДля точки на самой оси:\n\n```text\n(2, 2)\n```\n\nполучится:\n\n```text\nx' = 4 - 2 = 2\n```\n\nто есть она зеркальна сама себе.\n\nВажно учитывать не только наличие зеркальной точки, но и количество её вхождений. Например:\n\n```text\n(0, 0) — 2 раза\n(4, 0) — 1 раз\n```\n\nне образуют симметричный набор.\n\nПоэтому сравниваются частоты:\n\n```java\nif (!Objects.equals(\n        frequencies.get(mirror),\n        entry.getValue()\n)) {\n    return false;\n}\n```\n\nВременная сложность в среднем — `O(n)`, дополнительная память — `O(k)`, где `k` — количество различных точек.\n\n{{< /details >}}"
  filepath = "vertical-symmetry"

[[tasks]]
  id = 31
  question = "Реализовать потокобезопасный перевод денег без дедлоков"
  answer = "**Условие задачи:**  \nЕсть сервис `MoneyTransferService`, работающий в многопоточной среде.\n\nНеобходимо реализовать метод:\n\n```java\ntransfer(Account from, Account to, BigDecimal amount)\n```\n\nкоторый:\n\n- атомарно списывает деньги со счёта `from` и зачисляет их на счёт `to`;\n    \n- не позволяет счёту `from` уйти в минус;\n    \n- корректно работает при одновременных переводах;\n    \n- не допускает дедлоков;\n    \n- принимает только положительную сумму перевода.\n    \n\n**Код:**\n\n```java\npublic class MoneyTransferService {\n\n    public void transfer(\n            Account from,\n            Account to,\n            BigDecimal amount\n    ) {\n        // TODO\n    }\n}\n\npublic class Account {\n    private final int id;\n    private BigDecimal balance;\n\n    public Account(int id, BigDecimal initial) {\n        this.id = id;\n        this.balance = initial;\n    }\n\n    public int getId() {\n        return id;\n    }\n\n    public BigDecimal getBalance() {\n        return balance;\n    }\n\n    public void debit(BigDecimal amount) {\n        balance = balance.subtract(amount);\n    }\n\n    public void credit(BigDecimal amount) {\n        balance = balance.add(amount);\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Проверка баланса и изменение обоих счетов должны выполняться внутри одной критической секции.  \n💡 Блокировать два счёта нужно всегда в одинаковом порядке.  \n💡 Обычно порядок можно определить по `id`.  \n💡 Если уникальность `id` не гарантирована, одного сравнения по `id` недостаточно — нужен дополнительный порядок для счетов с одинаковыми `id`.  \n💡 Отрицательную или нулевую сумму перевода нужно отклонять.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class MoneyTransferService {\n\n    private static final Object TIE_LOCK = new Object();\n\n    public void transfer(\n            Account from,\n            Account to,\n            BigDecimal amount\n    ) {\n        Objects.requireNonNull(from);\n        Objects.requireNonNull(to);\n        Objects.requireNonNull(amount);\n\n        if (amount.compareTo(BigDecimal.ZERO) <= 0) {\n            throw new IllegalArgumentException(\n                    \"Сумма перевода должна быть положительной\"\n            );\n        }\n\n        if (from == to) {\n            return;\n        }\n\n        if (from.getId() < to.getId()) {\n            transferWithLocks(from, to, from, to, amount);\n            return;\n        }\n\n        if (from.getId() > to.getId()) {\n            transferWithLocks(to, from, from, to, amount);\n            return;\n        }\n\n        int fromHash = System.identityHashCode(from);\n        int toHash = System.identityHashCode(to);\n\n        if (fromHash < toHash) {\n            transferWithLocks(from, to, from, to, amount);\n        } else if (fromHash > toHash) {\n            transferWithLocks(to, from, from, to, amount);\n        } else {\n            synchronized (TIE_LOCK) {\n                transferWithLocks(from, to, from, to, amount);\n            }\n        }\n    }\n\n    private void transferWithLocks(\n            Account first,\n            Account second,\n            Account from,\n            Account to,\n            BigDecimal amount\n    ) {\n        synchronized (first) {\n            synchronized (second) {\n                if (from.getBalance().compareTo(amount) < 0) {\n                    throw new IllegalArgumentException(\n                            \"Недостаточно средств на счёте \" + from.getId()\n                    );\n                }\n\n                from.debit(amount);\n                to.credit(amount);\n            }\n        }\n    }\n}\n```\n\nГлавная проблема при блокировке двух объектов — возможность дедлока.\n\nНапример, два потока выполняют противоположные переводы:\n\n```text\nПоток 1: A → B\nПоток 2: B → A\n```\n\nЕсли первый поток сначала заблокирует `A`, а второй — `B`, оба могут начать ждать друг друга.\n\nПоэтому счета блокируются в едином порядке:\n\n```java\nif (from.getId() < to.getId()) {\n    // сначала from, затем to\n} else {\n    // сначала to, затем from\n}\n```\n\nВнутри обеих блокировок выполняются и проверка баланса, и изменение счетов:\n\n```java\nif (from.getBalance().compareTo(amount) < 0) {\n    throw new IllegalArgumentException(\"Недостаточно средств\");\n}\n\nfrom.debit(amount);\nto.credit(amount);\n```\n\nЭто принципиально важно. Если проверить баланс до получения блокировки, два потока могут одновременно увидеть достаточно средств и оба выполнить списание.\n\nНапример:\n\n```text\nБаланс: 100\n\nПоток 1 хочет списать 80\nПоток 2 хочет списать 80\n```\n\nБез атомарной проверки оба потока могли бы увидеть `100`, после чего баланс ушёл бы в минус.\n\nДополнительная обработка:\n\n```java\nSystem.identityHashCode(account)\n```\n\nнужна для счетов с одинаковыми `id`. Она задаёт стабильный порядок блокировок и для них.\n\nТеоретически `identityHashCode` двух разных объектов также может совпасть. Для такого редкого случая используется общий:\n\n```java\nTIE_LOCK\n```\n\nБлагодаря этому порядок получения блокировок остаётся однозначным и дедлок не возникает.\n\nПроверка:\n\n```java\nif (amount.compareTo(BigDecimal.ZERO) <= 0)\n```\n\nтоже необходима: отрицательный перевод фактически поменял бы направление движения денег и мог бы нарушить инвариант баланса.\n\nСложность одного перевода — `O(1)`, дополнительная память — `O(1)`.\n\nПотокобезопасность такого решения предполагает, что изменение `balance` выполняется только под блокировкой соответствующего `Account`. В реальном коде методы изменения баланса лучше не предоставлять для произвольного внешнего вызова, а инкапсулировать их внутри потокобезопасной модели счёта.\n\n{{< /details >}}"
  filepath = "money-transfer"

[[tasks]]
  id = 32
  question = "Реализовать перевод средств между аккаунтами"
  answer = "**Условие задачи:**  \nЕсть сервис перевода денег между аккаунтами. Все данные хранятся в памяти, обращения к БД и сетевого взаимодействия нет.\n\nНеобходимо реализовать метод:\n\n```java\nvoid transferAmount(Account from, Account to, BigDecimal amount)\n```\n\nкоторый переводит указанную сумму с одного аккаунта на другой.\n\nТребования:\n\n- проверить входные параметры;\n    \n- сумма перевода должна быть положительной;\n    \n- нельзя переводить деньги между одним и тем же аккаунтом;\n    \n- на исходном аккаунте должно быть достаточно средств;\n    \n- баланс не должен терять точность при денежных вычислениях;\n    \n- перевод должен атомарно изменять оба баланса;\n    \n- при конкурентных переводах не должно возникать дедлоков.\n    \n\n**Код:**\n\n```java\nclass Account {\n    // TODO: можно добавлять поля\n}\n\nclass TransferService {\n\n    void transferAmount(\n            Account from,\n            Account to,\n            BigDecimal amount\n    ) {\n        // TODO\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для денежных значений лучше использовать `BigDecimal`, а не `double` или `float`.  \n💡 Проверь `from`, `to` и `amount` на `null`.  \n💡 Сумма должна быть строго больше нуля.  \n💡 Проверка достаточности средств и изменение обоих балансов должны выполняться атомарно.  \n💡 Если сервис вызывается из нескольких потоков, блокируй аккаунты всегда в одном порядке, например по уникальному `id`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nclass Account {\n    private final long id;\n    private BigDecimal balance;\n\n    public Account(long id, BigDecimal initialBalance) {\n        Objects.requireNonNull(initialBalance);\n\n        if (initialBalance.compareTo(BigDecimal.ZERO) < 0) {\n            throw new IllegalArgumentException(\n                    \"Начальный баланс не может быть отрицательным\"\n            );\n        }\n\n        this.id = id;\n        this.balance = initialBalance;\n    }\n\n    public long getId() {\n        return id;\n    }\n\n    public synchronized BigDecimal getBalance() {\n        return balance;\n    }\n\n    synchronized void debit(BigDecimal amount) {\n        balance = balance.subtract(amount);\n    }\n\n    synchronized void credit(BigDecimal amount) {\n        balance = balance.add(amount);\n    }\n}\n```\n\n```java\nclass TransferService {\n\n    public void transferAmount(\n            Account from,\n            Account to,\n            BigDecimal amount\n    ) {\n        Objects.requireNonNull(from, \"Source account must not be null\");\n        Objects.requireNonNull(to, \"Target account must not be null\");\n        Objects.requireNonNull(amount, \"Amount must not be null\");\n\n        if (amount.compareTo(BigDecimal.ZERO) <= 0) {\n            throw new IllegalArgumentException(\n                    \"Amount must be positive\"\n            );\n        }\n\n        if (from == to || from.getId() == to.getId()) {\n            throw new IllegalArgumentException(\n                    \"Cannot transfer to the same account\"\n            );\n        }\n\n        Account first = from.getId() < to.getId() ? from : to;\n        Account second = first == from ? to : from;\n\n        synchronized (first) {\n            synchronized (second) {\n                if (from.getBalance().compareTo(amount) < 0) {\n                    throw new IllegalStateException(\n                            \"Insufficient funds\"\n                    );\n                }\n\n                from.debit(amount);\n                to.credit(amount);\n            }\n        }\n    }\n}\n```\n\nДля суммы используется `BigDecimal`.\n\nИспользовать `double` для денег нежелательно, поскольку двоичное представление чисел с плавающей точкой не может точно представить многие десятичные значения:\n\n```java\n0.1 + 0.2\n```\n\nможет дать значение, отличающееся от точного `0.3`.\n\n`BigDecimal` выполняет десятичные вычисления без такой потери точности:\n\n```java\nBigDecimal amount = new BigDecimal(\"10.50\");\n```\n\nПри создании денежных значений из литералов также лучше использовать строку или `BigDecimal.valueOf()`:\n\n```java\nnew BigDecimal(\"10.50\");\nBigDecimal.valueOf(10.50);\n```\n\nа не:\n\n```java\nnew BigDecimal(10.50);\n```\n\nПеред переводом проверяется, что средств достаточно:\n\n```java\nif (from.getBalance().compareTo(amount) < 0) {\n    throw new IllegalStateException(\"Insufficient funds\");\n}\n```\n\nДля `BigDecimal` значения сравниваются через `compareTo()`, а не через `equals()`, поскольку:\n\n```text\n10.0 и 10.00\n```\n\nчисленно равны, хотя `equals()` считает их различными из-за разного `scale`.\n\nОба аккаунта блокируются в одном порядке:\n\n```java\nAccount first = from.getId() < to.getId() ? from : to;\nAccount second = first == from ? to : from;\n```\n\nНапример, для одновременных переводов:\n\n```text\nAccount 1 → Account 2\nAccount 2 → Account 1\n```\n\nоба потока сначала попытаются получить блокировку аккаунта с меньшим `id`. Это исключает циклическое ожидание и тем самым предотвращает дедлок.\n\nПроверка баланса и обе операции выполняются внутри одной критической секции:\n\n```java\nfrom.debit(amount);\nto.credit(amount);\n```\n\nпоэтому другой перевод не сможет вклиниться между проверкой остатка и списанием.\n\nТакое решение предполагает, что `id` аккаунта уникален и не меняется после создания.\n\nДля фиксированной валюты альтернативой может быть хранение суммы в минимальных денежных единицах, например копейках, через `long`. Но если требуется работать с десятичными денежными значениями непосредственно, `BigDecimal` — наиболее естественный выбор.\n\nВремя выполнения перевода без учёта ожидания блокировок — `O(1)`, дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "transfer-amount"

[[tasks]]
  id = 33
  question = "Сжать подряд идущие одинаковые символы по коэффициенту"
  answer = "**Условие задачи:**  \nДаны строка `text` и целое число `k > 0`.\n\nНеобходимо обработать каждую группу подряд идущих одинаковых символов: каждые `k` символов такой группы заменить одним символом.\n\nНапример:\n\n- при `k = 1` строка не изменяется;\n    \n- `\"aa\"` при `k = 2` превращается в `\"a\"`;\n    \n- `\"aaa\"` при `k = 3` превращается в `\"a\"`;\n    \n- `\"cccc\"` при `k = 2` превращается в `\"cc\"`;\n    \n- если длина группы не делится на `k`, оставшиеся символы сохраняются.\n    \n\n**Код:**\n\n```java\nclass Main {\n    public static void main(String[] args) {\n        String text = \"aabbababaacccdaaad\";\n\n        System.out.println(compress(text, 2));\n        System.out.println(compress(text, 1));\n        System.out.println(compress(text, 3));\n    }\n\n    public static String compress(String text, int k) {\n        // TODO\n    }\n}\n```\n\nПримеры:\n\n```text\ntext = \"aabbababaacccdaaad\", k = 2\n→ \"abababaccdaad\"\n\ntext = \"aabbababaacccdaaad\", k = 1\n→ \"aabbababaacccdaaad\"\n\ntext = \"aabbababaacccdaaad\", k = 3\n→ \"aabbababaacdad\"\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Достаточно один раз пройти по строке, считая длину текущей группы одинаковых символов.  \n💡 Когда символ меняется, нужно добавить в результат сжатую текущую группу.  \n💡 Для группы длины `count` количество символов после сжатия равно `count / k + count % k`.  \n💡 Не забудь отдельно обработать последнюю группу.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static String compress(String text, int k) {\n    Objects.requireNonNull(text, \"text\");\n\n    if (k <= 0) {\n        throw new IllegalArgumentException(\"k должен быть больше 0\");\n    }\n\n    if (text.isEmpty() || k == 1) {\n        return text;\n    }\n\n    StringBuilder result = new StringBuilder(text.length());\n\n    char current = text.charAt(0);\n    int count = 1;\n\n    for (int i = 1; i < text.length(); i++) {\n        char ch = text.charAt(i);\n\n        if (ch == current) {\n            count++;\n        } else {\n            appendCompressed(result, current, count, k);\n            current = ch;\n            count = 1;\n        }\n    }\n\n    appendCompressed(result, current, count, k);\n\n    return result.toString();\n}\n\nprivate static void appendCompressed(\n        StringBuilder result,\n        char ch,\n        int count,\n        int k\n) {\n    int newCount = count / k + count % k;\n\n    for (int i = 0; i < newCount; i++) {\n        result.append(ch);\n    }\n}\n```\n\nДля каждой последовательности одинаковых символов сначала определяется её длина.\n\nНапример, при:\n\n```text\ncount = 7\nk = 3\n```\n\nполучаем две полные группы по три символа и один оставшийся символ:\n\n```text\n7 / 3 = 2\n7 % 3 = 1\n```\n\nСледовательно, после сжатия останется:\n\n```text\n2 + 1 = 3 символа\n```\n\nЭто вычисляется выражением:\n\n```java\nint newCount = count / k + count % k;\n```\n\nДля примера:\n\n```text\n\"cccc\", k = 2\n\ncount = 4\n4 / 2 + 4 % 2 = 2\n\n→ \"cc\"\n```\n\nА для:\n\n```text\n\"aaaa\", k = 3\n\ncount = 4\n4 / 3 + 4 % 3 = 2\n\n→ \"aa\"\n```\n\nПоследнюю группу необходимо обработать после завершения цикла:\n\n```java\nappendCompressed(result, current, count, k);\n```\n\nиначе она не попадёт в результат.\n\nВременная сложность — `O(n)`, где `n` — длина строки. Дополнительная память — `O(n)` для результирующей строки.\n\n{{< /details >}}"
  filepath = "compress-consecutive"

[[tasks]]
  id = 34
  question = "Обеспечить чередование вывода foo и bar"
  answer = "**Условие задачи:**  \nДан класс `FooBar`. Одна и та же его инстанция используется двумя потоками:\n\n- поток A вызывает метод `foo()`;\n    \n- поток B вызывает метод `bar()`.\n    \n\nКаждый метод должен выполнить вывод `n` раз.\n\nНеобходимо синхронизировать потоки так, чтобы строки `foo` и `bar` выводились строго по очереди:\n\n```text\nfoobarfoobar...\n```\n\nВсего последовательность `foobar` должна повториться ровно `n` раз.\n\n**Код:**\n\n```java\nclass FooBar {\n    private final int n;\n\n    public FooBar(int n) {\n        this.n = n;\n    }\n\n    public void foo() throws InterruptedException {\n        for (int i = 0; i < n; i++) {\n            System.out.print(\"foo\");\n        }\n    }\n\n    public void bar() throws InterruptedException {\n        for (int i = 0; i < n; i++) {\n            System.out.print(\"bar\");\n        }\n    }\n}\n```\n\nПримеры:\n\n```text\nn = 1\n→ foobar\n\nn = 2\n→ foobarfoobar\n\nn = 5\n→ foobarfoobarfoobarfoobarfoobar\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Удобно использовать два `Semaphore`.  \n💡 Для `foo` создай семафор с одним разрешением, чтобы этот поток мог начать первым.  \n💡 Для `bar` создай семафор с нулём разрешений, чтобы он сначала ожидал.  \n💡 После вывода `foo` нужно разрешить работу `bar`, а после `bar` — снова разрешить `foo`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nclass FooBar {\n\n    private final int n;\n\n    private final Semaphore fooSemaphore = new Semaphore(1);\n    private final Semaphore barSemaphore = new Semaphore(0);\n\n    public FooBar(int n) {\n        this.n = n;\n    }\n\n    public void foo() throws InterruptedException {\n        for (int i = 0; i < n; i++) {\n            fooSemaphore.acquire();\n\n            System.out.print(\"foo\");\n\n            barSemaphore.release();\n        }\n    }\n\n    public void bar() throws InterruptedException {\n        for (int i = 0; i < n; i++) {\n            barSemaphore.acquire();\n\n            System.out.print(\"bar\");\n\n            fooSemaphore.release();\n        }\n    }\n}\n```\n\nНачальные значения семафоров:\n\n```java\nnew Semaphore(1);\nnew Semaphore(0);\n```\n\nозначают, что `foo()` может начать работу сразу, а `bar()` должен ждать.\n\nПоследовательность для первой итерации выглядит так:\n\n```text\nfooSemaphore = 1\nbarSemaphore = 0\n\nfoo:\nacquire() → 0\nprint(\"foo\")\nbarSemaphore.release() → 1\n\nbar:\nacquire() → 0\nprint(\"bar\")\nfooSemaphore.release() → 1\n```\n\nПосле этого цикл повторяется.\n\nТаким образом, даже если поток `bar` запустится раньше потока `foo`, он остановится на:\n\n```java\nbarSemaphore.acquire();\n```\n\nпоскольку изначально разрешений у `barSemaphore` нет.\n\nДля `n = 3` гарантируется порядок:\n\n```text\nfoo → bar → foo → bar → foo → bar\n```\n\nи результат:\n\n```text\nfoobarfoobarfoobar\n```\n\nМетоды `acquire()` и `release()` обеспечивают необходимую синхронизацию и видимость изменений между потоками.\n\nДля каждой итерации выполняется константное число операций, поэтому общая сложность — `O(n)`. Дополнительная память — `O(1)`.\n\nЕсли один из потоков будет прерван и завершит работу раньше второго, второй поток потенциально может остаться ждать разрешения. Для базовой задачи это обычно не требуется обрабатывать отдельно, но в production-коде стоит предусмотреть общий механизм остановки обоих потоков.\n\n{{< /details >}}"
  filepath = "foobar-alternate"

[[tasks]]
  id = 35
  question = "Найти первого человека по имени"
  answer = "**Условие задачи:**  \nДан класс `Person` с полями `name` и `age`.\n\nНеобходимо реализовать метод `findPersonByName(List<Person> persons, String name)`, который возвращает первого человека из списка с заданным именем.\n\nЕсли человек с таким именем не найден, метод должен вернуть `Optional.empty()`.\n\n**Код:**\n\n```java\nclass Person {\n    private String name;\n    private Integer age;\n\n    public Person(String name, Integer age) {\n        this.name = name;\n        this.age = age;\n    }\n\n    public String getName() {\n        return name;\n    }\n\n    public Integer getAge() {\n        return age;\n    }\n}\n\npublic class PersonService {\n\n    public Optional<Person> findPersonByName(\n            List<Person> persons,\n            String name\n    ) {\n        // TODO\n        return Optional.empty();\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Создай поток из списка через `stream()`.  \n💡 С помощью `filter()` оставь только людей с нужным именем.  \n💡 Для безопасного сравнения строк можно использовать `Objects.equals()`.  \n💡 `findFirst()` вернёт первого найденного человека в виде `Optional<Person>`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic Optional<Person> findPersonByName(\n        List<Person> persons,\n        String name\n) {\n    return persons.stream()\n            .filter(person -> Objects.equals(person.getName(), name))\n            .findFirst();\n}\n```\n\nФильтрация выполняется по имени:\n\n```java\n.filter(person -> Objects.equals(person.getName(), name))\n```\n\n`Objects.equals()` корректно сравнивает значения даже в случае `null`:\n\n```text\nObjects.equals(\"Ivan\", \"Ivan\") → true\nObjects.equals(null, \"Ivan\")   → false\nObjects.equals(null, null)     → true\n```\n\nПосле фильтрации:\n\n```java\n.findFirst()\n```\n\nвозвращает первый подходящий объект как `Optional<Person>`.\n\nЕсли совпадений нет, результатом автоматически будет:\n\n```java\nOptional.empty()\n```\n\nВременная сложность в худшем случае — `O(n)`, дополнительная память — `O(1)` без учёта внутренних объектов Stream API.\n\n{{< /details >}}"
  filepath = "find-person-by-name_1"

[[tasks]]
  id = 36
  question = "Реализовать консольную игру «Крестики-нолики» произвольного размера"
  answer = "**Условие задачи:**  \nНеобходимо реализовать консольную игру «Крестики-нолики» с произвольным размером квадратного поля.\n\nСтруктура программы:\n\n- `Main` — запрашивает размер поля и запускает игру;\n    \n- `Game` — управляет игровым циклом и определяет победу или ничью;\n    \n- `Desk` — хранит состояние игрового поля;\n    \n- `AI` — интерфейс участника игры;\n    \n- `Player` — получает координаты хода от пользователя;\n    \n- `IndianAI` — делает случайный допустимый ход.\n    \n\nИгрок `X` и компьютер `O` ходят по очереди.\n\nПобедой считается заполнение символами игрока целой строки, столбца или одной из двух главных диагоналей.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `Desk` должен самостоятельно знать размер поля — получать его через reflection не нужно.  \n💡 Лучше предоставить методы `getSize()`, `place()`, `hasWon()` и `isFull()`.  \n💡 Участник игры должен уметь сделать ход и сообщить свой символ.  \n💡 `Game` отвечает только за последовательность ходов и завершение игры.  \n💡 Для случайного хода компьютера можно сначала определить количество свободных клеток, а затем выбрать одну из них случайно.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n`AI` задаёт общий контракт для участника игры:\n\n```java\npublic interface AI {\n    void makeMove(Desk desk);\n    char getSymbol();\n}\n```\n\n`Desk` хранит состояние игрового поля:\n\n```java\npublic class Desk {\n\n    private static final char EMPTY = '.';\n\n    private final char[][] field;\n    private final int size;\n\n    private int occupiedCells;\n\n    public Desk(int size) {\n        if (size <= 0) {\n            throw new IllegalArgumentException(\n                    \"Размер поля должен быть больше 0\"\n            );\n        }\n\n        this.size = size;\n        this.field = new char[size][size];\n\n        for (int row = 0; row < size; row++) {\n            Arrays.fill(field[row], EMPTY);\n        }\n    }\n\n    public int getSize() {\n        return size;\n    }\n\n    public boolean isCellEmpty(int row, int col) {\n        return isInside(row, col)\n                && field[row][col] == EMPTY;\n    }\n\n    public boolean place(int row, int col, char symbol) {\n        if (!isCellEmpty(row, col)) {\n            return false;\n        }\n\n        field[row][col] = symbol;\n        occupiedCells++;\n        return true;\n    }\n\n    public boolean isFull() {\n        return occupiedCells == size * size;\n    }\n\n    public boolean hasWon(char symbol) {\n        for (int i = 0; i < size; i++) {\n            if (checkRow(i, symbol)\n                    || checkColumn(i, symbol)) {\n                return true;\n            }\n        }\n\n        return checkMainDiagonal(symbol)\n                || checkSecondaryDiagonal(symbol);\n    }\n\n    private boolean checkRow(int row, char symbol) {\n        for (int col = 0; col < size; col++) {\n            if (field[row][col] != symbol) {\n                return false;\n            }\n        }\n\n        return true;\n    }\n\n    private boolean checkColumn(int col, char symbol) {\n        for (int row = 0; row < size; row++) {\n            if (field[row][col] != symbol) {\n                return false;\n            }\n        }\n\n        return true;\n    }\n\n    private boolean checkMainDiagonal(char symbol) {\n        for (int i = 0; i < size; i++) {\n            if (field[i][i] != symbol) {\n                return false;\n            }\n        }\n\n        return true;\n    }\n\n    private boolean checkSecondaryDiagonal(char symbol) {\n        for (int i = 0; i < size; i++) {\n            if (field[i][size - 1 - i] != symbol) {\n                return false;\n            }\n        }\n\n        return true;\n    }\n\n    private boolean isInside(int row, int col) {\n        return row >= 0 && row < size\n                && col >= 0 && col < size;\n    }\n\n    public void print() {\n        for (char[] row : field) {\n            for (char cell : row) {\n                System.out.print(cell + \" \");\n            }\n\n            System.out.println();\n        }\n\n        System.out.println();\n    }\n}\n```\n\nЖивой игрок получает координаты из консоли:\n\n```java\npublic class Player implements AI {\n\n    private final Scanner scanner;\n    private final char symbol;\n\n    public Player(Scanner scanner, char symbol) {\n        this.scanner = scanner;\n        this.symbol = symbol;\n    }\n\n    @Override\n    public void makeMove(Desk desk) {\n        while (true) {\n            System.out.printf(\n                    \"Ход игрока '%c' (строка и столбец от 1 до %d): \",\n                    symbol,\n                    desk.getSize()\n            );\n\n            int row = scanner.nextInt() - 1;\n            int col = scanner.nextInt() - 1;\n\n            if (desk.place(row, col, symbol)) {\n                return;\n            }\n\n            System.out.println(\n                    \"Некорректный ход: клетка занята или находится за пределами поля.\"\n            );\n        }\n    }\n\n    @Override\n    public char getSymbol() {\n        return symbol;\n    }\n}\n```\n\nКомпьютер выбирает случайную свободную клетку:\n\n```java\npublic class IndianAI implements AI {\n\n    private final char symbol;\n\n    public IndianAI(char symbol) {\n        this.symbol = symbol;\n    }\n\n    @Override\n    public void makeMove(Desk desk) {\n        int emptyCells = desk.getSize() * desk.getSize();\n\n        for (int row = 0; row < desk.getSize(); row++) {\n            for (int col = 0; col < desk.getSize(); col++) {\n                if (!desk.isCellEmpty(row, col)) {\n                    emptyCells--;\n                }\n            }\n        }\n\n        if (emptyCells == 0) {\n            throw new IllegalStateException(\"Свободных клеток нет\");\n        }\n\n        int target = ThreadLocalRandom.current()\n                .nextInt(emptyCells);\n\n        int current = 0;\n\n        for (int row = 0; row < desk.getSize(); row++) {\n            for (int col = 0; col < desk.getSize(); col++) {\n                if (!desk.isCellEmpty(row, col)) {\n                    continue;\n                }\n\n                if (current == target) {\n                    desk.place(row, col, symbol);\n\n                    System.out.printf(\n                            \"Ход компьютера '%c': %d %d%n\",\n                            symbol,\n                            row + 1,\n                            col + 1\n                    );\n\n                    return;\n                }\n\n                current++;\n            }\n        }\n    }\n\n    @Override\n    public char getSymbol() {\n        return symbol;\n    }\n}\n```\n\n`Game` управляет очередностью ходов:\n\n```java\npublic class Game {\n\n    private final Desk desk;\n    private final AI playerX;\n    private final AI playerO;\n\n    public Game(int size, AI playerX, AI playerO) {\n        this.desk = new Desk(size);\n        this.playerX = playerX;\n        this.playerO = playerO;\n    }\n\n    public void play() {\n        desk.print();\n\n        while (true) {\n            if (makeMove(playerX)) {\n                return;\n            }\n\n            if (makeMove(playerO)) {\n                return;\n            }\n        }\n    }\n\n    private boolean makeMove(AI player) {\n        player.makeMove(desk);\n        desk.print();\n\n        if (desk.hasWon(player.getSymbol())) {\n            System.out.println(\n                    \"Победил '\" + player.getSymbol() + \"'!\"\n            );\n            return true;\n        }\n\n        if (desk.isFull()) {\n            System.out.println(\"Ничья!\");\n            return true;\n        }\n\n        return false;\n    }\n}\n```\n\nТочка входа:\n\n```java\npublic class Main {\n\n    public static void main(String[] args) {\n        try (Scanner scanner = new Scanner(System.in)) {\n            System.out.print(\"Введите размер поля: \");\n\n            int size = scanner.nextInt();\n\n            Game game = new Game(\n                    size,\n                    new Player(scanner, 'X'),\n                    new IndianAI('O')\n            );\n\n            game.play();\n        }\n    }\n}\n```\n\nПример запуска:\n\n```text\nВведите размер поля: 3\n\n. . .\n. . .\n. . .\n\nХод игрока 'X' (строка и столбец от 1 до 3): 1 1\n\nX . .\n. . .\n. . .\n\nХод компьютера 'O': 2 2\n\nX . .\n. O .\n. . .\n```\n\n`Desk` полностью инкапсулирует состояние поля: другие классы не получают прямого доступа к массиву.\n\nМетод:\n\n```java\npublic boolean place(int row, int col, char symbol)\n```\n\nодновременно проверяет возможность хода и изменяет поле. Это не позволяет случайно перезаписать уже занятую клетку.\n\nДля проверки победы просматриваются все строки, столбцы и две диагонали. Для поля `N × N` такая проверка работает за `O(N²)`.\n\n`isFull()` работает за `O(1)`, поскольку количество занятых клеток хранится отдельно.\n\nСлучайный ход компьютера занимает `O(N²)` и выбирает одну из свободных клеток без риска бесконечно долго генерировать уже занятые координаты.\n\n{{< /details >}}"
  filepath = "tictactoe"

[[tasks]]
  id = 37
  question = "Объединить два отсортированных итератора"
  answer = "**Условие задачи:**  \nДаны два итератора `a` и `b`. Каждый из них возвращает элементы в порядке возрастания согласно заданному `Comparator`.\n\nНеобходимо реализовать `CollatingIterator<E>`, который объединяет оба источника и возвращает все их элементы в общем отсортированном порядке.\n\nТребования:\n\n- реализовать методы `hasNext()` и `next()`;\n    \n- сохранить все элементы, включая одинаковые;\n    \n- не считывать исходные итераторы целиком в коллекции;\n    \n- использовать `O(1)` дополнительной памяти;\n    \n- предполагается, что элементы не равны `null`.\n    \n\n**Код:**\n\n```java\npublic class CollatingIterator<E> implements Iterator<E> {\n\n    private final Iterator<E> a;\n    private final Iterator<E> b;\n    private final Comparator<E> comparator;\n\n    public CollatingIterator(\n            Iterator<E> a,\n            Iterator<E> b,\n            Comparator<E> comparator\n    ) {\n        this.a = a;\n        this.b = b;\n        this.comparator = comparator;\n    }\n\n    @Override\n    public boolean hasNext() {\n        return false;\n    }\n\n    @Override\n    public E next() {\n        return null;\n    }\n}\n```\n\nПример:\n\n```text\na: 1, 3\nb: 2, 3, 5, 6\n\nРезультат:\n1 → 2 → 3 → 3 → 5 → 6\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Это похоже на этап слияния в Merge Sort.  \n💡 Достаточно хранить по одному заранее считанному элементу из каждого итератора.  \n💡 Если элементы есть в обоих источниках, сравни их и верни меньший.  \n💡 После возврата элемента продвигай только тот итератор, из которого он был взят.  \n💡 Если один источник закончился, продолжай возвращать элементы второго.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class CollatingIterator<E> implements Iterator<E> {\n\n    private final Iterator<E> a;\n    private final Iterator<E> b;\n    private final Comparator<E> comparator;\n\n    private E nextA;\n    private E nextB;\n\n    private boolean hasNextA;\n    private boolean hasNextB;\n\n    public CollatingIterator(\n            Iterator<E> a,\n            Iterator<E> b,\n            Comparator<E> comparator\n    ) {\n        this.a = Objects.requireNonNull(a);\n        this.b = Objects.requireNonNull(b);\n        this.comparator = Objects.requireNonNull(comparator);\n\n        advanceA();\n        advanceB();\n    }\n\n    @Override\n    public boolean hasNext() {\n        return hasNextA || hasNextB;\n    }\n\n    @Override\n    public E next() {\n        if (!hasNext()) {\n            throw new NoSuchElementException();\n        }\n\n        if (!hasNextA) {\n            E result = nextB;\n            advanceB();\n            return result;\n        }\n\n        if (!hasNextB) {\n            E result = nextA;\n            advanceA();\n            return result;\n        }\n\n        if (comparator.compare(nextA, nextB) <= 0) {\n            E result = nextA;\n            advanceA();\n            return result;\n        }\n\n        E result = nextB;\n        advanceB();\n        return result;\n    }\n\n    private void advanceA() {\n        if (a.hasNext()) {\n            nextA = a.next();\n            hasNextA = true;\n        } else {\n            nextA = null;\n            hasNextA = false;\n        }\n    }\n\n    private void advanceB() {\n        if (b.hasNext()) {\n            nextB = b.next();\n            hasNextB = true;\n        } else {\n            nextB = null;\n            hasNextB = false;\n        }\n    }\n}\n```\n\nАлгоритм работает как слияние двух отсортированных последовательностей.\n\nВ памяти постоянно находятся максимум два элемента:\n\n```java\nprivate E nextA;\nprivate E nextB;\n```\n\nНапример, если:\n\n```text\nnextA = 1\nnextB = 2\n```\n\nто возвращается `1`, после чего продвигается только итератор `a`.\n\nПолучаем:\n\n```text\nnextA = 3\nnextB = 2\n```\n\nТеперь возвращается `2` и продвигается только `b`.\n\nЕсли значения равны:\n\n```java\nif (comparator.compare(nextA, nextB) <= 0)\n```\n\nсначала возвращается элемент из `a`, но элемент из `b` остаётся сохранённым и будет возвращён позже. Поэтому дубликаты не теряются.\n\nКогда один итератор заканчивается:\n\n```java\nif (!hasNextA) {\n    E result = nextB;\n    advanceB();\n    return result;\n}\n```\n\nэлементы продолжают последовательно считываться из второго.\n\nЕсли закончились оба источника, `next()` обязан согласно контракту `Iterator` выбросить:\n\n```java\nthrow new NoSuchElementException();\n```\n\nЕсли первый итератор содержит `n` элементов, а второй — `m`, полный обход занимает `O(n + m)` времени.\n\nКаждый отдельный вызов `next()` выполняется за `O(1)`, а дополнительная память — `O(1)`, поскольку независимо от размера входных последовательностей хранится не более двух предварительно считанных элементов.\n\n{{< /details >}}"
  filepath = "collating-iterator"

[[tasks]]
  id = 38
  question = "Вывести дерево в виде иерархии"
  answer = "**Условие задачи:**  \nДан список объектов `Node`. Каждый узел содержит:\n\n- собственный идентификатор `id`;\n    \n- идентификатор родителя `parentId`;\n    \n- список дочерних узлов.\n    \n\nСначала необходимо связать узлы между собой по `parentId`, а затем реализовать метод `printNode()`, который рекурсивно выводит дерево в виде текстовой иерархии.\n\n**Код:**\n\n```java\nclass Node {\n    private final Integer id;\n    private final Integer parentId;\n    private final List<Node> childNode = new ArrayList<>();\n\n    public Node(Integer id, Integer parentId) {\n        this.id = id;\n        this.parentId = parentId;\n    }\n\n    public Integer getId() {\n        return id;\n    }\n\n    public Integer getParentId() {\n        return parentId;\n    }\n\n    public List<Node> getChildNode() {\n        return childNode;\n    }\n}\n\npublic class Test4 {\n\n    public void linkNodes(List<Node> nodes) {\n        Map<Integer, List<Node>> nodesByParent = nodes.stream()\n                .filter(node -> node.getParentId() != null)\n                .collect(Collectors.groupingBy(Node::getParentId));\n\n        nodes.forEach(node ->\n                node.getChildNode().addAll(\n                        nodesByParent.getOrDefault(\n                                node.getId(),\n                                Collections.emptyList()\n                        )\n                )\n        );\n    }\n\n    public String printNode(\n            Node node,\n            String prefix,\n            String childrenPrefix\n    ) {\n        // TODO\n    }\n}\n```\n\nДля данных:\n\n```java\nList<Node> nodes = List.of(\n        new Node(1, null),\n        new Node(2, 1),\n        new Node(3, 1),\n        new Node(4, 3),\n        new Node(5, 3),\n        new Node(6, 5)\n);\n```\n\nожидаемый результат:\n\n```text\n1\n├── 2\n└── 3\n    ├── 4\n    └── 5\n        └── 6\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Текущий узел нужно добавить как `prefix + node.getId()`.  \n💡 Для каждого ребёнка необходимо определить, является ли он последним.  \n💡 Для обычного ребёнка используется `├──`, для последнего — `└──`.  \n💡 Если после узла остаются соседи, для следующего уровня нужно продолжить вертикальную линию `│`.  \n💡 Обход удобно реализовать рекурсивно.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic String printNode(\n        Node node,\n        String prefix,\n        String childrenPrefix\n) {\n    StringBuilder result = new StringBuilder();\n\n    result.append(prefix)\n            .append(node.getId())\n            .append('\\n');\n\n    List<Node> children = node.getChildNode();\n\n    for (int i = 0; i < children.size(); i++) {\n        Node child = children.get(i);\n        boolean isLast = i == children.size() - 1;\n\n        String childPrefix =\n                childrenPrefix\n                        + (isLast ? \"└── \" : \"├── \");\n\n        String nextChildrenPrefix =\n                childrenPrefix\n                        + (isLast ? \"    \" : \"│   \");\n\n        result.append(\n                printNode(\n                        child,\n                        childPrefix,\n                        nextChildrenPrefix\n                )\n        );\n    }\n\n    return result.toString();\n}\n```\n\nВызов для корневого узла:\n\n```java\nlinkNodes(nodes);\n\nSystem.out.print(\n        printNode(nodes.get(0), \"\", \"\")\n);\n```\n\nДля каждого дочернего узла определяется, последний ли он среди соседей:\n\n```java\nboolean isLast = i == children.size() - 1;\n```\n\nЕсли после него есть другие узлы, используется:\n\n```text\n├──\n```\n\nЕсли это последний ребёнок:\n\n```text\n└──\n```\n\nПрефикс для следующих уровней тоже зависит от этого.\n\nДля непоследнего узла:\n\n```java\nchildrenPrefix + \"│   \"\n```\n\nвертикальная линия должна продолжаться, поскольку ниже ещё будут выводиться его соседи.\n\nДля последнего:\n\n```java\nchildrenPrefix + \"    \"\n```\n\nпродолжать вертикальную линию уже не нужно.\n\nНапример, для узла `3`:\n\n```text\n└── 3\n    ├── 4\n    └── 5\n        └── 6\n```\n\nрекурсивный вызов автоматически накапливает необходимые отступы.\n\nКаждый узел посещается один раз, поэтому сам вывод дерева работает за `O(n)`, где `n` — количество узлов. Дополнительная память рекурсии — `O(h)`, где `h` — высота дерева, не считая памяти под результирующую строку.\n\n{{< /details >}}"
  filepath = "print-tree"

[[tasks]]
  id = 39
  question = "Проверить строку на палиндром"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод `isPalindrome(String s)`, который определяет, является ли строка палиндромом.\n\nПри проверке:\n\n- регистр букв не учитывается;\n    \n- пробелы и знаки препинания игнорируются;\n    \n- учитываются только латинские буквы и цифры.\n    \n\n**Код:**\n\n```java\npublic class Task1 {\n\n    public static void main(String[] args) {\n        System.out.println(\n                isPalindrome(\"A man, a plan, a canal: Panama\")\n        ); // true\n\n        System.out.println(\n                isPalindrome(\"I love work in IT\")\n        ); // false\n    }\n\n    public static boolean isPalindrome(String s) {\n        // TODO\n    }\n}\n```\n\nПримеры:\n\n```text\n\"A man, a plan, a canal: Panama\" → true\n\"I love work in IT\"             → false\n\"race a car\"                    → false\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Можно использовать два указателя: один в начале строки, другой — в конце.  \n💡 Пропускай символы, которые не являются буквами или цифрами.  \n💡 Сравнивай символы без учёта регистра.  \n💡 Если найдена несовпадающая пара — сразу возвращай `false`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static boolean isPalindrome(String s) {\n    if (s == null) {\n        return false;\n    }\n\n    int left = 0;\n    int right = s.length() - 1;\n\n    while (left < right) {\n        while (left < right\n                && !Character.isLetterOrDigit(s.charAt(left))) {\n            left++;\n        }\n\n        while (left < right\n                && !Character.isLetterOrDigit(s.charAt(right))) {\n            right--;\n        }\n\n        char leftChar = Character.toLowerCase(s.charAt(left));\n        char rightChar = Character.toLowerCase(s.charAt(right));\n\n        if (leftChar != rightChar) {\n            return false;\n        }\n\n        left++;\n        right--;\n    }\n\n    return true;\n}\n```\n\nИспользуются два указателя:\n\n```java\nint left = 0;\nint right = s.length() - 1;\n```\n\nОни движутся навстречу друг другу.\n\nСимволы, которые не являются буквами или цифрами, пропускаются:\n\n```java\nwhile (left < right\n        && !Character.isLetterOrDigit(s.charAt(left))) {\n    left++;\n}\n```\n\nЗатем символы сравниваются без учёта регистра:\n\n```java\nchar leftChar = Character.toLowerCase(s.charAt(left));\nchar rightChar = Character.toLowerCase(s.charAt(right));\n\nif (leftChar != rightChar) {\n    return false;\n}\n```\n\nДля строки:\n\n```text\nA man, a plan, a canal: Panama\n```\n\nфактически сравнивается последовательность:\n\n```text\namanaplanacanalpanama\n```\n\nОна одинаково читается слева направо и справа налево, поэтому результат — `true`.\n\nТакой подход не создаёт дополнительную очищенную строку и её копию в обратном порядке.\n\nВременная сложность — `O(n)`, дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "palindrome"

[[tasks]]
  id = 40
  question = "Реализовать хранилище с истекающими ключами"
  answer = "**Условие задачи:**  \nНеобходимо реализовать класс, который хранит пары `ключ → значение` с ограниченным временем жизни (`TTL`).\n\nМетоды:\n\n- `set(String key, String value, int duration)` — сохраняет значение на `duration` миллисекунд;\n    \n- если на момент вызова `set()` такой же неистёкший ключ уже существует, вернуть `true`, иначе `false`;\n    \n- повторный `set()` должен заменить значение и заново запустить TTL;\n    \n- `get(String key)` — вернуть значение, если ключ ещё действует, иначе `\"-1\"`;\n    \n- `count()` — вернуть количество неистёкших ключей.\n    \n\nИстёкшие записи могут удаляться лениво — при обращении к хранилищу.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Вместе со значением храни момент его истечения.  \n💡 Для измерения временного интервала лучше использовать `System.nanoTime()`, а не системные часы.  \n💡 Если класс используется конкурентно, операция проверки существующего ключа и его замены должна быть атомарной.  \n💡 Для этого удобно использовать `ConcurrentHashMap.compute()`.  \n💡 При удалении просроченной записи важно не удалить новое значение, которое другой поток уже успел записать по тому же ключу.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class ExpiringMap {\n\n    private static class Entry {\n        private final String value;\n        private final long expiresAt;\n\n        private Entry(String value, long expiresAt) {\n            this.value = value;\n            this.expiresAt = expiresAt;\n        }\n\n        private boolean isExpired(long now) {\n            return now - expiresAt >= 0;\n        }\n    }\n\n    private final ConcurrentHashMap<String, Entry> storage =\n            new ConcurrentHashMap<>();\n\n    public boolean set(String key, String value, int duration) {\n        Objects.requireNonNull(key, \"key\");\n        Objects.requireNonNull(value, \"value\");\n\n        if (duration < 0) {\n            throw new IllegalArgumentException(\n                    \"duration не может быть отрицательным\"\n            );\n        }\n\n        AtomicBoolean existed = new AtomicBoolean(false);\n\n        storage.compute(key, (k, oldEntry) -> {\n            long now = System.nanoTime();\n\n            existed.set(\n                    oldEntry != null\n                            && !oldEntry.isExpired(now)\n            );\n\n            long expiresAt =\n                    now + TimeUnit.MILLISECONDS.toNanos(duration);\n\n            return new Entry(value, expiresAt);\n        });\n\n        return existed.get();\n    }\n\n    public String get(String key) {\n        Objects.requireNonNull(key, \"key\");\n\n        Entry entry = storage.get(key);\n\n        if (entry == null) {\n            return \"-1\";\n        }\n\n        if (entry.isExpired(System.nanoTime())) {\n            storage.remove(key, entry);\n            return \"-1\";\n        }\n\n        return entry.value;\n    }\n\n    public int count() {\n        long now = System.nanoTime();\n        int count = 0;\n\n        for (Map.Entry<String, Entry> mapEntry\n                : storage.entrySet()) {\n\n            Entry entry = mapEntry.getValue();\n\n            if (entry.isExpired(now)) {\n                storage.remove(mapEntry.getKey(), entry);\n            } else {\n                count++;\n            }\n        }\n\n        return count;\n    }\n}\n```\n\nКаждая запись хранит не только значение, но и момент окончания её действия:\n\n```java\nprivate final String value;\nprivate final long expiresAt;\n```\n\nДля TTL используется:\n\n```java\nSystem.nanoTime()\n```\n\nОн подходит для измерения интервалов времени и не зависит от перевода системных часов вперёд или назад.\n\nВ `set()` используется:\n\n```java\nstorage.compute(key, ...)\n```\n\nОперация выполняется атомарно для конкретного ключа. Поэтому два потока не смогут одновременно проверить старое значение и независимо перезаписать его, получив некорректный результат `true`/`false`.\n\nНапример:\n\n```java\nmap.set(\"name\", \"Ivan\", 1000); // false\nmap.set(\"name\", \"Petr\", 1000); // true\n```\n\nВторой вызов возвращает `true`, поскольку на момент обновления ключ ещё существует, но его значение и TTL всё равно заменяются.\n\nПри истечении срока в `get()` используется:\n\n```java\nstorage.remove(key, entry);\n```\n\nа не просто:\n\n```java\nstorage.remove(key);\n```\n\nЭто важно при конкурентном доступе. Если другой поток уже заменил просроченную запись новой, условное удаление не затронет новое значение.\n\nПример:\n\n```java\nExpiringMap map = new ExpiringMap();\n\nSystem.out.println(\n        map.set(\"a\", \"hello\", 1000)\n); // false\n\nSystem.out.println(\n        map.get(\"a\")\n); // hello\n\nSystem.out.println(\n        map.count()\n); // 1\n```\n\nПосле окончания TTL:\n\n```text\nget(\"a\") → \"-1\"\ncount()  → 0\n```\n\n`set()` и `get()` в среднем работают за `O(1)`.\n\n`count()` требует просмотра хранилища, поэтому работает за `O(n)`, где `n` — количество записей.\n\nПри конкурентных изменениях `ConcurrentHashMap` даёт слабосогласованный обход, поэтому `count()` не является атомарным снимком всей карты. Если требуется строго точное значение относительно одновременно выполняющихся `set()` и `get()`, операции придётся дополнительно координировать общей блокировкой.\n\nТакже контракт с `\"-1\"` неоднозначен, если `\"-1\"` является допустимым значением. В реальном API для отсутствующего ключа удобнее возвращать `Optional<String>`.\n\n{{< /details >}}"
  filepath = "expiring-map"

[[tasks]]
  id = 41
  question = "Проверить палиндром в цикле без методов обработки строк"
  answer = "**Условие задачи:**  \nРеализовать функцию `isPalindrome`, которая проверяет, является ли строка палиндромом.\n\nОграничения:\n\n- строку нужно обрабатывать только с помощью циклов\n    \n- нельзя использовать `replace()`, `trim()` и другие методы для предварительной обработки строки\n    \n- нужно игнорировать пробелы\n    \n- сравнение должно быть без учёта регистра\n\n📌 **Пример 1:**  \nВход:  \n`s = \" fly me to the moon \"`\n\nВыход:  \n`false`\n\n📌 **Пример 2:**  \nВход:  \n`s = \" сел в озере березов лес \"`\n\nВыход:  \n`true`\n\n📌 **Пример 3:**  \nВход:  \n`s = \"а роза упала на лапу азора\"`\n\nВыход:  \n`true`\n\n---\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 Используйте два указателя: один с начала, другой с конца строки  \n💡 Пропускайте пробелы, перемещая указатели внутрь строки  \n💡 Сравнивайте символы, игнорируя регистр (Character.toLowerCase())  \n💡 Продолжайте до тех пор, пока указатели не встретятся  \n💡 Проверяйте, что символы совпадают на каждой итерации  \n💡 Обработайте случай, когда строка состоит только из пробелов  \n{{< /details >}}\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class PalindromeChecker {\n    \n    public static boolean isPalindrome(String s) {\n        if (s == null) return false;\n        \n        int left = 0;\n        int right = s.length() - 1;\n        boolean foundValidChars = false;\n        \n        while (left <= right) {\n            // Пропускаем пробелы слева\n            while (left <= right && s.charAt(left) == ' ') {\n                left++;\n            }\n            \n            // Пропускаем пробелы справа\n            while (left <= right && s.charAt(right) == ' ') {\n                right--;\n            }\n            \n            // Если после пропуска пробелов не осталось символов\n            if (left > right) {\n                return foundValidChars;\n            }\n            \n            // Отмечаем, что нашли хотя бы одну пару символов для сравнения\n            foundValidChars = true;\n            \n            // Сравниваем символы (игнорируя регистр)\n            char leftChar = Character.toLowerCase(s.charAt(left));\n            char rightChar = Character.toLowerCase(s.charAt(right));\n            \n            if (leftChar != rightChar) {\n                return false;\n            }\n            \n            // Перемещаем указатели\n            left++;\n            right--;\n        }\n        \n        return true;\n    }\n    \n    public static void main(String[] args) {\n        // Тестовые случаи из задания\n        System.out.println(isPalindrome(\" fly me to the moon \")); // false\n        System.out.println(isPalindrome(\"  сел в   озере   березов лес     \")); // true\n        \n        // Дополнительные тесты\n        System.out.println(isPalindrome(\"а роза упала на лапу азора\")); // true\n        System.out.println(isPalindrome(\"hello world\")); // false\n        System.out.println(isPalindrome(\"a\")); // true\n        System.out.println(isPalindrome(\"   \")); // false (только пробелы)\n        System.out.println(isPalindrome(\"\")); // false (пустая строка)\n    }\n}\n```\n\n**Алгоритм по шагам:**\n\n1. **Инициализация указателей** - `left` с начала (0), `right` с конца (длина - 1)\n2. **Пропуск пробелов** - двигаем указатели мимо пробелов с обеих сторон\n3. **Проверка окончания** - если указатели пересеклись, возвращаем результат\n4. **Сравнение символов** - приводим к нижнему регистру и сравниваем\n5. **Несовпадение** - возвращаем false при первой ошибке\n6. **Движение к центру** - сдвигаем указатели и повторяем\n\n**Особенности решения:**\n- Работает с любым количеством пробелов\n- Игнорирует регистр букв\n- Корректно обрабатывает строки только из пробелов (возвращает false)\n- Эффективно использует память (O(1) дополнительной памяти)\n- Временная сложность O(n)\n\n**Результаты для тестовых случаев:**\n- `\" fly me to the moon \"` → **false** (не палиндром)\n- `\" сел в озере березов лес \"` → **true** (палиндром)\n  {{< /details >}}"
  filepath = "palindrome-loop"

[[tasks]]
  id = 42
  question = "Объединить два списка без дубликатов"
  answer = "**Условие задачи:**  \nНеобходимо объединить два списка целых чисел, исключив повторяющиеся элементы.\n\n**Код:**\n\n```java\npublic List<Integer> collect(List<Integer> lst1, List<Integer> lst2) {\n    // код тут\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для удаления дубликатов можно использовать `Set`.  \n💡 `LinkedHashSet` сохраняет порядок первого появления элементов.  \n💡 Через Stream API можно использовать `Stream.concat()` и `distinct()`.  \n💡 Если элементы должны быть отсортированы, подойдёт `TreeSet`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант с `LinkedHashSet`:\n\n```java\npublic List<Integer> collect(\n        List<Integer> lst1,\n        List<Integer> lst2\n) {\n    Set<Integer> uniqueValues = new LinkedHashSet<>();\n\n    uniqueValues.addAll(lst1);\n    uniqueValues.addAll(lst2);\n\n    return new ArrayList<>(uniqueValues);\n}\n```\n\n`LinkedHashSet` удаляет дубликаты и сохраняет порядок первого появления элементов.\n\nВариант через Stream API:\n\n```java\npublic List<Integer> collect(\n        List<Integer> lst1,\n        List<Integer> lst2\n) {\n    return Stream.concat(\n                    lst1.stream(),\n                    lst2.stream()\n            )\n            .distinct()\n            .collect(Collectors.toList());\n}\n```\n\nОба решения проходят по элементам входных списков и имеют линейную сложность в среднем.\n\n> Для объединения списков без дубликатов можно использовать `LinkedHashSet` или объединить два потока через `Stream.concat()` и вызвать `distinct()`.\n\n{{< /details >}}"
  filepath = "merge-arrays-unique"

