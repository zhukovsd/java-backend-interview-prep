  answer = "Сделать ревью кода\tГеоТехноСофт | 23.09.2025\t0:00:35\tuser-balance-service-review\t\n\n**Условие задачи:**\n\n📌 Дан сервис `UserBalanceService`. Нужно сделать code review: найти проблемы, риски и предложить улучшения.\n\n**Код:**\n\n```java\npublic class UserBalanceService {\n\n    @Autowired\n    UserBalanceRepository repository;\n\n    @Autowired\n    BalanceOperationsRepository balanceOperationsRepository;\n\n    @Autowired\n    CurrencyConvertRestClient currencyConvertRestClient;\n\n    @Autowired\n    NotificationRestClient notificationRestClient;\n\n    @Autowired\n    OperationLogRepository operationLogRepository;\n\n    @Value(\"\"app.settings.currency-default\"\")\n    String defaultCurrency;\n\n    @Transactional\n    public void changeBalance(UUID userId, Double balance, String currency) {\n        if (userId == null || balance == null) {\n            throw new IllegalArgumentException(\n                    \"\"Один или несколько аргументов равны null\"\"\n            );\n        }\n\n        if (currency == null) {\n            currency = defaultCurrency;\n        }\n\n        UserBalance userBalance = repository.getUserBalanceById(userId);\n\n        Double convertedAmount = currencyConvertRestClient.convert(\n                balance,\n                currency,\n                userBalance.getCurrency()\n        );\n\n        userBalance.setBalance(\n                userBalance.getAmount() + convertedAmount\n        );\n\n        try {\n            saveToLog(userId, balance, currency, null, true);\n            repository.save(userBalance);\n        } catch (DataAccessException e) {\n            saveToLog(\n                    userId,\n                    balance,\n                    currency,\n                    e.getMessage(),\n                    false\n            );\n\n            notificationRestClient.notifyErrorBalanceChange(\n                    userId,\n                    balance,\n                    currency\n            );\n\n            throw e;\n        }\n\n        notificationRestClient.notifyBalanceChangeOk(\n                userId,\n                balance,\n                currency\n        );\n    }\n\n    @Transactional\n    void saveToLog(\n            UUID userId,\n            Double balance,\n            String currency,\n            String errorMessage,\n            Boolean ok\n    ) {\n        if (ok) {\n            operationLogRepository.addBalanceChangeOk(\n                    userId,\n                    balance,\n                    currency\n            );\n        } else {\n            operationLogRepository.addBalanceChangeError(\n                    userId,\n                    balance,\n                    errorMessage,\n                    currency\n            );\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}\n**Спойлеры к решению**\n{{< /hint >}}\n\n---\n\n{{< details \"\"Подсказки\"\" close >}}\n💡 Field injection лучше заменить на constructor injection.\n💡 Для денежных значений нужно использовать `BigDecimal`, а не `Double`.\n💡 В `@Value` отсутствует `${...}`.\n💡 Нужно обработать отсутствие баланса пользователя.\n💡 REST-вызов выполняется внутри открытой транзакции.\n💡 Одновременные запросы могут потерять одно из обновлений баланса.\n💡 `@Transactional` на `saveToLog()` не сработает отдельно из-за self-invocation.\n💡 Запись ошибки откатится вместе с основной транзакцией.\n💡 Уведомление об успехе отправляется до фактического commit.\n💡 `BalanceOperationsRepository` нигде не используется.\n{{< /details >}}\n\n---\n\n{{< details \"\"Решение\"\" close >}}\n\nВ коде хорошо то, что есть базовая валидация, транзакция, конвертация валюты, аудит и уведомления.\n\nНо есть несколько важных проблем.\n\n1. **Field injection**\n\n```java\n@Autowired\nUserBalanceRepository repository;\n```\n\nЛучше использовать `private final` поля и constructor injection.\n\n2. **`Double` используется для денег**\n\n```java\nDouble balance\n```\n\n`Double` может давать ошибки точности. Для баланса и валютных операций нужен `BigDecimal`.\n\n3. **Ошибка в `@Value`**\n\n```java\n@Value(\"\"app.settings.currency-default\"\")\n```\n\nТак будет внедрена обычная строка. Правильно:\n\n```java\n@Value(\"\"${app.settings.currency-default}\"\")\n```\n\n4. **Не обработано отсутствие баланса**\n\n```java\nUserBalance userBalance = repository.getUserBalanceById(userId);\n```\n\nЕсли пользователь не найден, дальше возникнет `NullPointerException`. Лучше возвращать `Optional` и выбрасывать понятное исключение.\n\n5. **Внешний вызов внутри транзакции**\n\n```java\ncurrencyConvertRestClient.convert(...)\n```\n\nПока REST-сервис отвечает, транзакция остаётся открытой. Это может привести к долгим транзакциям и исчерпанию пула соединений.\n\n6. **Проблема конкурентного обновления**\n\nДва запроса могут одновременно прочитать один баланс и перезаписать изменения друг друга.\n\nНужна pessimistic-блокировка, optimistic lock через `@Version` или атомарное обновление на уровне БД.\n\n7. **`@Transactional` на `saveToLog()` не создаёт отдельную транзакцию**\n\n```java\nsaveToLog(...);\n```\n\nЭто внутренний вызов метода того же класса, поэтому он не проходит через Spring proxy.\n\nПри ошибке запись лога также откатится вместе с основной транзакцией. Для независимого аудита нужен отдельный сервис с `REQUIRES_NEW`.\n\n8. **Уведомление отправляется до commit**\n\n```java\nnotificationRestClient.notifyBalanceChangeOk(...)\n```\n\nCommit выполняется после выхода из метода. Уведомление может уйти, а транзакция затем откатиться.\n\nУведомления лучше отправлять после commit через событие или outbox.\n\n9. **Ошибка уведомления может скрыть основную ошибку**\n\nЕсли `notifyErrorBalanceChange()` выбросит exception, исходная `DataAccessException` будет потеряна.\n\nОшибки уведомлений нужно обрабатывать отдельно.\n\n10. **Неиспользуемая зависимость**\n\n```java\nBalanceOperationsRepository balanceOperationsRepository;\n```\n\nРепозиторий нигде не используется, поэтому его следует удалить.\n\n---\n\nИсправленный базовый вариант:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class UserBalanceService {\n\n    private final UserBalanceRepository repository;\n    private final CurrencyConvertRestClient currencyConvertRestClient;\n    private final OperationLogService operationLogService;\n    private final NotificationRestClient notificationRestClient;\n\n    @Value(\"\"${app.settings.currency-default}\"\")\n    private String defaultCurrency;\n\n    @Transactional\n    public void changeBalance(\n            UUID userId,\n            BigDecimal amount,\n            String currency\n    ) {\n        if (userId == null || amount == null) {\n            throw new IllegalArgumentException(\n                    \"\"Один или несколько аргументов равны null\"\"\n            );\n        }\n\n        String sourceCurrency =\n                currency == null || currency.isBlank()\n                        ? defaultCurrency\n                        : currency;\n\n        UserBalance userBalance = repository\n                .findByIdForUpdate(userId)\n                .orElseThrow(() ->\n                        new IllegalArgumentException(\n                                \"\"Баланс пользователя не найден\"\"\n                        )\n                );\n\n        BigDecimal convertedAmount =\n                currencyConvertRestClient.convert(\n                        amount,\n                        sourceCurrency,\n                        userBalance.getCurrency()\n                );\n\n        userBalance.setAmount(\n                userBalance.getAmount().add(convertedAmount)\n        );\n\n        repository.save(userBalance);\n\n        operationLogService.saveSuccess(\n                userId,\n                amount,\n                sourceCurrency\n        );\n    }\n}\n```\n\nДля записи ошибок можно использовать отдельный сервис:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OperationLogService {\n\n    private final OperationLogRepository repository;\n\n    @Transactional(propagation = Propagation.REQUIRES_NEW)\n    public void saveError(\n            UUID userId,\n            BigDecimal amount,\n            String currency,\n            String errorMessage\n    ) {\n        repository.addBalanceChangeError(\n                userId,\n                amount,\n                errorMessage,\n                currency\n        );\n    }\n}\n```\n\nНо даже этот вариант не идеален: конвертацию валюты желательно выполнять до начала короткой транзакции, а уведомления отправлять после успешного commit через outbox или событие.\n\n### Что я бы сказал на собеседовании 🎯\n\n> Основные проблемы здесь — field injection, использование `Double` для денег, неправильный `@Value`, внешний REST-вызов внутри транзакции и отсутствие защиты от конкурентного изменения баланса.\n> Также `@Transactional` на `saveToLog()` не создаёт отдельную транзакцию, поэтому лог ошибки может откатиться вместе с основной операцией. Я бы использовал `BigDecimal`, constructor injection, блокировку баланса, отдельный сервис аудита с `REQUIRES_NEW`, а уведомления отправлял после commit.\n\n{{< /details >}}\n"
  filepath = "user-balance-service-review"

