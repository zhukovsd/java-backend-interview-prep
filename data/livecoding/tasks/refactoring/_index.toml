  id = 17
  question = "Провести code review сервиса изменения баланса  "
  answer = "Дан сервис `UserBalanceService`. Нужно сделать code review: найти проблемы, риски и предложить улучшения.\n\n**Код:**\n\n```java\npublic class UserBalanceService {\n\n    @Autowired\n    UserBalanceRepository repository;\n\n    @Autowired\n    BalanceOperationsRepository balanceOperationsRepository;\n\n    @Autowired\n    CurrencyConvertRestClient currencyConvertRestClient;\n\n    @Autowired\n    NotificationRestClient notificationRestClient;\n\n    @Autowired\n    OperationLogRepository operationLogRepository;\n\n    @Value(\"\"\"\"app.settings.currency-default\"\"\"\")\n    String defaultCurrency;\n\n    @Transactional\n    public void changeBalance(UUID userId, Double balance, String currency) {\n        if (userId == null || balance == null) {\n            throw new IllegalArgumentException(\n                    \"\"\"\"Один или несколько аргументов равны null\"\"\"\"\n            );\n        }\n\n        if (currency == null) {\n            currency = defaultCurrency;\n        }\n\n        UserBalance userBalance = repository.getUserBalanceById(userId);\n\n        Double convertedAmount = currencyConvertRestClient.convert(\n                balance,\n                currency,\n                userBalance.getCurrency()\n        );\n\n        userBalance.setBalance(\n                userBalance.getAmount() + convertedAmount\n        );\n\n        try {\n            saveToLog(userId, balance, currency, null, true);\n            repository.save(userBalance);\n        } catch (DataAccessException e) {\n            saveToLog(\n                    userId,\n                    balance,\n                    currency,\n                    e.getMessage(),\n                    false\n            );\n\n            notificationRestClient.notifyErrorBalanceChange(\n                    userId,\n                    balance,\n                    currency\n            );\n\n            throw e;\n        }\n\n        notificationRestClient.notifyBalanceChangeOk(\n                userId,\n                balance,\n                currency\n        );\n    }\n\n    @Transactional\n    void saveToLog(\n            UUID userId,\n            Double balance,\n            String currency,\n            String errorMessage,\n            Boolean ok\n    ) {\n        if (ok) {\n            operationLogRepository.addBalanceChangeOk(\n                    userId,\n                    balance,\n                    currency\n            );\n        } else {\n            operationLogRepository.addBalanceChangeError(\n                    userId,\n                    balance,\n                    errorMessage,\n                    currency\n            );\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для денег лучше использовать `BigDecimal`.  \n💡 Проверь `@Value`, границы транзакции и self-invocation.  \n💡 Два параллельных запроса могут потерять одно из изменений баланса.  \n💡 Внешние REST-вызовы лучше не держать внутри DB-транзакции.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- нет `@Service` или другой явной регистрации класса как Spring-бина;\n    \n- field injection вместо constructor injection;\n    \n- `Double` используется для денег;\n    \n- в `@Value` отсутствует `${...}`;\n    \n- не обработано отсутствие `UserBalance`;\n    \n- `setBalance()` и `getAmount()` выглядят несогласованно;\n    \n- REST-вызов выполняется внутри открытой транзакции;\n    \n- возможен lost update при параллельных изменениях баланса;\n    \n- `@Transactional` на `saveToLog()` не создаёт отдельную транзакцию из-за self-invocation;\n    \n- error log откатится вместе с основной транзакцией;\n    \n- success log вызывается ещё до успешного сохранения;\n    \n- ошибка БД может возникнуть не в `save()`, а только на `flush/commit`, поэтому текущий `catch` поймает не все ошибки сохранения;\n    \n- success notification вызывается до commit;\n    \n- ошибка notification может скрыть исходное исключение;\n    \n- `Boolean ok` здесь не нужен;\n    \n- `BalanceOperationsRepository` не используется.\n    \n\n**Как исправить**\n\nДля зависимостей использовать constructor injection, для денег — `BigDecimal`:\n\n```java\n@Value(\"${app.settings.currency-default}\")\nprivate String defaultCurrency;\n```\n\nВнешнюю конвертацию валюты лучше выполнять **до короткой write-транзакции**.\n\nКонкурентное изменение баланса лучше делать атомарно на уровне БД:\n\n```java\n@Modifying\n@Query(\"\"\"\n        update UserBalance b\n           set b.amount = b.amount + :amount\n         where b.id = :userId\n        \"\"\")\nint addAmount(\n        @Param(\"userId\") UUID userId,\n        @Param(\"amount\") BigDecimal amount\n);\n```\n\nТогда два параллельных запроса не перезапишут результат друг друга.\n\nОсновной сервис можно оставить координатором:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class UserBalanceService {\n\n    private final UserBalanceRepository repository;\n    private final CurrencyConvertRestClient currencyClient;\n    private final BalanceTransactionService balanceService;\n    private final OperationLogService operationLogService;\n    private final NotificationRestClient notificationClient;\n\n    @Value(\"${app.settings.currency-default}\")\n    private String defaultCurrency;\n\n    public void changeBalance(\n            UUID userId,\n            BigDecimal amount,\n            String currency\n    ) {\n        Objects.requireNonNull(userId, \"userId\");\n        Objects.requireNonNull(amount, \"amount\");\n\n        String sourceCurrency =\n                currency == null || currency.isBlank()\n                        ? defaultCurrency\n                        : currency;\n\n        String targetCurrency = repository.findCurrencyById(userId)\n                .orElseThrow(() ->\n                        new EntityNotFoundException(\n                                \"Balance not found: \" + userId\n                        )\n                );\n\n        BigDecimal converted = currencyClient.convert(\n                amount,\n                sourceCurrency,\n                targetCurrency\n        );\n\n        try {\n            balanceService.apply(\n                    userId,\n                    converted,\n                    amount,\n                    sourceCurrency\n            );\n        } catch (DataAccessException e) {\n            operationLogService.saveError(\n                    userId,\n                    amount,\n                    sourceCurrency,\n                    e.getMessage()\n            );\n\n            throw e;\n        }\n\n        notificationClient.notifyBalanceChangeOk(\n                userId,\n                amount,\n                sourceCurrency\n        );\n    }\n}\n```\n\nИзменение баланса и success log выполняются одной короткой транзакцией:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class BalanceTransactionService {\n\n    private final UserBalanceRepository repository;\n    private final OperationLogRepository logRepository;\n\n    @Transactional\n    public void apply(\n            UUID userId,\n            BigDecimal convertedAmount,\n            BigDecimal originalAmount,\n            String currency\n    ) {\n        if (repository.addAmount(userId, convertedAmount) != 1) {\n            throw new EntityNotFoundException(\n                    \"Balance not found: \" + userId\n            );\n        }\n\n        logRepository.addBalanceChangeOk(\n                userId,\n                originalAmount,\n                currency\n        );\n    }\n}\n```\n\nЕсли error log должен сохраниться независимо от rollback, его нужно вынести в отдельный Spring-бин:\n\n```java\n@Transactional(propagation = Propagation.REQUIRES_NEW)\npublic void saveError(...) {\n    repository.addBalanceChangeError(...);\n}\n```\n\nУведомления в более надёжном варианте лучше отправлять после commit через `@TransactionalEventListener(AFTER_COMMIT)` или outbox.\n\n{{< /details >}}"
  filepath = "user-balance-service-review"

[[tasks]]
  id = 18
  question = "Сделать рефакторинг обработки документов"
  answer = "**Условие задачи:**\n\nДан сервис обработки документов разных типов. Нужно выполнить рефакторинг, убрать разрастающийся `switch` и упростить добавление новых форматов.\n\n**Код:**\n\n```java\npublic class RefEx {\n\n    public enum DocumentType {\n        XML,\n        PDF,\n        DOCX\n    }\n\n    public static class Document {\n        String id;\n        DocumentType type;\n        String content;\n    }\n\n    public static class DocumentService {\n\n        public void process(Document[] d) {\n            for (Document i : d) {\n\n                // Общая логика обработки документа\n                switch (i.type) {\n                    case DocumentType.PDF: {\n                        // Специфическая логика для обработки PDF\n                    } break;\n\n                    case DocumentType.DOCX: {\n                        // Специфическая логика для обработки Word\n                    } break;\n\n                    case DocumentType.XML: {\n                        // Специфическая логика для обработки XML\n                    } break;\n                }\n            }\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Имена `d` и `i` не отражают смысл переменных.  \n💡 Нужно проверить массив и его элементы на `null`.  \n💡 При добавлении нового типа придётся изменять `DocumentService`.  \n💡 Специфическую обработку лучше вынести в отдельные классы.  \n💡 Для выбора обработчика можно использовать паттерн Strategy.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- `DocumentService` содержит логику обработки всех форматов;\n    \n- при добавлении нового типа нужно изменять `switch` — нарушается OCP;\n    \n- общая и специфическая логика смешаны;\n    \n- имена `d` и `i` плохо отражают назначение переменных;\n    \n- нет проверки массива, документов и `type` на `null`;\n    \n- для enum в обычном `switch` case следует писать `case PDF`, а не `case DocumentType.PDF`;\n    \n- при большом количестве форматов `switch` будет постоянно разрастаться.\n    \n\nЛучше применить **Strategy** и вынести обработку каждого формата в отдельный класс.\n\n```java\npublic interface DocumentProcessor {\n\n    DocumentType getType();\n\n    void process(Document document);\n}\n```\n\nНапример:\n\n```java\npublic class PdfDocumentProcessor implements DocumentProcessor {\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.PDF;\n    }\n\n    @Override\n    public void process(Document document) {\n        // Специфическая логика обработки PDF\n    }\n}\n```\n\nАналогично создаются `DocxDocumentProcessor` и `XmlDocumentProcessor`.\n\nСам сервис отвечает только за выбор стратегии и общую обработку:\n\n```java\npublic class DocumentService {\n\n    private final Map<DocumentType, DocumentProcessor> processors;\n\n    public DocumentService(\n            Collection<DocumentProcessor> processors\n    ) {\n        this.processors = new EnumMap<>(DocumentType.class);\n\n        for (DocumentProcessor processor : processors) {\n            DocumentProcessor previous =\n                    this.processors.put(\n                            processor.getType(),\n                            processor\n                    );\n\n            if (previous != null) {\n                throw new IllegalArgumentException(\n                        \"Duplicate processor: \"\n                                + processor.getType()\n                );\n            }\n        }\n    }\n\n    public void process(Document[] documents) {\n        if (documents == null) {\n            throw new IllegalArgumentException(\n                    \"Documents must not be null\"\n            );\n        }\n\n        for (Document document : documents) {\n            if (document == null || document.type == null) {\n                throw new IllegalArgumentException(\n                        \"Invalid document\"\n                );\n            }\n\n            // Общая логика обработки документа\n\n            DocumentProcessor processor =\n                    processors.get(document.type);\n\n            if (processor == null) {\n                throw new IllegalArgumentException(\n                        \"Unsupported document type: \"\n                                + document.type\n                );\n            }\n\n            processor.process(document);\n        }\n    }\n}\n```\n\nТеперь для нового формата достаточно добавить новый `DocumentProcessor`. `DocumentService` изменять не требуется.\n\nОсновная идея рефакторинга: **общая логика остаётся в сервисе, а специфическая логика каждого формата переносится в отдельную Strategy**.\n\n{{< /details >}}"
  filepath = "document-service-refactor"

