  id = 10
  question = "Провести рефакторинг класса Cat4"
  answer = "**Условие задачи:**  \nДан класс `Cat4`, в котором есть проблемы с компиляцией, инициализацией полей, многопоточностью и работой с JDBC.\n\nНеобходимо провести code review и исправить класс так, чтобы:\n\n- поля корректно инициализировались;\n    \n- счётчик прыжков был потокобезопасным;\n    \n- создание потоков не происходило через `new Thread()` для каждой операции;\n    \n- работа с профилем была корректна при конкурентном доступе;\n    \n- JDBC-ресурсы гарантированно закрывались;\n    \n- SQL-запрос не был уязвим для SQL Injection;\n    \n- результат запроса корректно обрабатывался.\n    \n\n**Код:**\n\n```java\npublic class Cat4 {\n    private final ConcurrentHashMap<byte[], BigDecimal> CACHE =\n            new ConcurrentHashMap<>();\n\n    public int jumpsCount = 0;\n    private var cat4Profile;\n\n    private final List<Integer> list;\n    private final DataSource dataSource;\n\n    public Cat4(\n            DataSource dataSource,\n            List<? extends Integer> list\n    ) {\n        dataSource = this.dataSource;\n        list = this.list;\n    }\n\n    public void doRandomJump(int maxJumps) {\n        Random rnd = new Random();\n        int jumpsToDo =\n                Math.abs(rnd.nextInt()) % maxJumps;\n\n        for (int i = 0; i < jumpsToDo; i++) {\n            new Thread(() -> {\n                doJump();\n            }).start();\n        }\n    }\n\n    public void setCat4Profile(Cat4Profile cat4Profile) {\n        this.cat4Profile = cat4Profile;\n    }\n\n    public String getCat4Name() {\n        try {\n            return this.cat4Profile.getCatName();\n        } catch (NullPointerException e) {\n            return \"Max\";\n        }\n    }\n\n    public void doJump() {\n        this.jumpsCount++;\n\n        Logger.getLogger(Cat4.class.getName())\n                .fine(\"Jump!\");\n    }\n\n    public void doMeow() {\n        Logger.getLogger(Cat4.class.getName())\n                .fine(\"Meow!\");\n    }\n\n    public BigDecimal doQuery(byte[] parameters)\n            throws SQLException {\n\n        Connection conn = null;\n        Statement stmt = null;\n\n        try {\n            conn = dataSource.getConnection();\n            stmt = conn.createStatement();\n\n            ResultSet resultSet = stmt.executeQuery(\n                    \"select weight from Cat where name = '\"\n                            + new String(parameters)\n                            + \"')\"\n            );\n\n            resultSet.next();\n\n            return resultSet.getBigDecimal(\"weight\");\n        } finally {\n            if (stmt != null) {\n                stmt.close();\n            }\n\n            if (conn != null) {\n                conn.close();\n            }\n        }\n    }\n\n    public int getJumpsCount() {\n        int result = jumpsCount;\n        jumpsCount = 0;\n        return result;\n    }\n\n    public void setJumpsCount() {\n        this.jumpsCount++;\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `var` нельзя использовать для объявления поля класса.  \n💡 В конструкторе присваивания сделаны в обратную сторону.  \n💡 Операция `jumpsCount++` не атомарна.  \n💡 Получение значения счётчика и его сброс тоже должны быть одной атомарной операцией.  \n💡 Не создавай отдельный `Thread` на каждый прыжок — используй `Executor`.  \n💡 `Math.abs(Integer.MIN_VALUE)` остаётся отрицательным.  \n💡 Не следует ловить `NullPointerException` для обычной проверки на `null`.  \n💡 JDBC-запрос нужно выполнять через `PreparedStatement` и `try-with-resources`.  \n💡 Массив `byte[]` плохо подходит в качестве ключа `HashMap`, потому что массивы сравниваются по ссылке.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОдин из вариантов рефакторинга:\n\n```java\npublic class Cat4 {\n\n    private static final Logger LOGGER =\n            Logger.getLogger(Cat4.class.getName());\n\n    private final AtomicInteger jumpsCount =\n            new AtomicInteger();\n\n    private volatile Cat4Profile cat4Profile;\n\n    private final List<Integer> list;\n    private final DataSource dataSource;\n    private final Executor executor;\n\n    public Cat4(\n            DataSource dataSource,\n            List<? extends Integer> list,\n            Executor executor\n    ) {\n        this.dataSource =\n                Objects.requireNonNull(dataSource);\n\n        this.list = List.copyOf(\n                Objects.requireNonNull(list)\n        );\n\n        this.executor =\n                Objects.requireNonNull(executor);\n    }\n\n    public void doRandomJump(int maxJumps) {\n        if (maxJumps <= 0) {\n            throw new IllegalArgumentException(\n                    \"maxJumps должен быть больше 0\"\n            );\n        }\n\n        int jumpsToDo = ThreadLocalRandom.current()\n                .nextInt(maxJumps);\n\n        for (int i = 0; i < jumpsToDo; i++) {\n            executor.execute(this::doJump);\n        }\n    }\n\n    public void setCat4Profile(\n            Cat4Profile cat4Profile\n    ) {\n        this.cat4Profile = cat4Profile;\n    }\n\n    public String getCat4Name() {\n        Cat4Profile profile = cat4Profile;\n\n        return profile == null\n                ? \"Max\"\n                : profile.getCatName();\n    }\n\n    public void doJump() {\n        jumpsCount.incrementAndGet();\n        LOGGER.fine(\"Jump!\");\n    }\n\n    public void doMeow() {\n        LOGGER.fine(\"Meow!\");\n    }\n\n    public BigDecimal doQuery(byte[] parameters)\n            throws SQLException {\n\n        Objects.requireNonNull(\n                parameters,\n                \"parameters\"\n        );\n\n        String name = new String(\n                parameters,\n                StandardCharsets.UTF_8\n        );\n\n        String sql = \"\"\"\n                SELECT weight\n                FROM Cat\n                WHERE name = ?\n                \"\"\";\n\n        try (Connection connection =\n                     dataSource.getConnection();\n             PreparedStatement statement =\n                     connection.prepareStatement(sql)) {\n\n            statement.setString(1, name);\n\n            try (ResultSet resultSet =\n                         statement.executeQuery()) {\n\n                if (!resultSet.next()) {\n                    throw new SQLException(\n                            \"Cat not found: \" + name\n                    );\n                }\n\n                return resultSet.getBigDecimal(\n                        \"weight\"\n                );\n            }\n        }\n    }\n\n    public int getJumpsCount() {\n        return jumpsCount.getAndSet(0);\n    }\n\n    public void incrementJumpsCount() {\n        jumpsCount.incrementAndGet();\n    }\n}\n```\n\nВ конструкторе исходные присваивания были перепутаны:\n\n```java\ndataSource = this.dataSource;\nlist = this.list;\n```\n\nДолжно быть наоборот:\n\n```java\nthis.dataSource = dataSource;\nthis.list = ...;\n```\n\nКроме того, поскольку список передаётся извне, создаётся собственная неизменяемая копия:\n\n```java\nthis.list = List.copyOf(list);\n```\n\nЭто не позволяет вызывающему коду неожиданно изменить внутреннее состояние `Cat4`.\n\n---\n\nПоле:\n\n```java\nprivate var cat4Profile;\n```\n\nне компилируется.\n\n`var` разрешён для локальных переменных, но не для полей класса.\n\nНужен явный тип:\n\n```java\nprivate volatile Cat4Profile cat4Profile;\n```\n\n`volatile` обеспечивает видимость нового значения между потоками.\n\nВ `getCat4Name()` нет необходимости использовать исключение для обычного управления логикой:\n\n```java\ntry {\n    return cat4Profile.getCatName();\n} catch (NullPointerException e) {\n    return \"Max\";\n}\n```\n\nКорректнее явно проверить значение:\n\n```java\nCat4Profile profile = cat4Profile;\n\nreturn profile == null\n        ? \"Max\"\n        : profile.getCatName();\n```\n\nЛокальная переменная также гарантирует, что в рамках метода используется одно прочитанное значение ссылки.\n\n---\n\nСчётчик:\n\n```java\njumpsCount++;\n```\n\nне является атомарной операцией.\n\nФактически выполняются три действия:\n\n```text\nпрочитать значение\n↓\nувеличить\n↓\nзаписать новое значение\n```\n\nДва потока могут прочитать одно значение одновременно, и одно увеличение потеряется.\n\nПоэтому используется:\n\n```java\nprivate final AtomicInteger jumpsCount =\n        new AtomicInteger();\n```\n\nи:\n\n```java\njumpsCount.incrementAndGet();\n```\n\nОсобенно важно исправить:\n\n```java\nint result = jumpsCount;\njumpsCount = 0;\n```\n\nЗдесь между чтением и обнулением другой поток мог выполнить `doJump()`, и его увеличение потерялось.\n\n`AtomicInteger` позволяет выполнить обе операции атомарно:\n\n```java\nreturn jumpsCount.getAndSet(0);\n```\n\n---\n\nСоздавать поток для каждого прыжка:\n\n```java\nnew Thread(this::doJump).start();\n```\n\nплохо.\n\nПри большом количестве вызовов приложение может создать огромное количество нативных потоков и исчерпать ресурсы.\n\nВместо этого используется общий:\n\n```java\nExecutor\n```\n\nа задача передаётся ему:\n\n```java\nexecutor.execute(this::doJump);\n```\n\nРазмер пула потоков и очереди можно контролировать снаружи.\n\n---\n\nКонструкция:\n\n```java\nMath.abs(rnd.nextInt()) % maxJumps\n```\n\nимеет две проблемы.\n\nВо-первых:\n\n```text\nMath.abs(Integer.MIN_VALUE)\n```\n\nпо-прежнему возвращает отрицательное число из-за переполнения `int`.\n\nВо-вторых, при:\n\n```text\nmaxJumps = 0\n```\n\nвозникнет `ArithmeticException`.\n\nКорректнее использовать готовый ограниченный генератор:\n\n```java\nThreadLocalRandom.current()\n        .nextInt(maxJumps);\n```\n\nОн возвращает значение:\n\n```text\n0 <= jumpsToDo < maxJumps\n```\n\nчто сохраняет семантику исходного `% maxJumps`.\n\n---\n\nВ JDBC есть сразу несколько проблем.\n\nКонкатенация:\n\n```java\n\"WHERE name = '\" + name + \"'\"\n```\n\nпозволяет внедрить произвольный SQL через параметр.\n\nПоэтому нужен `PreparedStatement`:\n\n```java\nString sql = \"\"\"\n        SELECT weight\n        FROM Cat\n        WHERE name = ?\n        \"\"\";\n\nPreparedStatement statement =\n        connection.prepareStatement(sql);\n\nstatement.setString(1, name);\n```\n\nКроме того, в исходной строке запроса присутствовала лишняя закрывающая скобка.\n\nВсе JDBC-ресурсы закрываются через `try-with-resources`:\n\n```text\nConnection\nPreparedStatement\nResultSet\n```\n\nдаже если во время выполнения запроса возникает исключение.\n\nТакже нельзя без проверки делать:\n\n```java\nresultSet.next();\nreturn resultSet.getBigDecimal(\"weight\");\n```\n\nЕсли запрос ничего не вернул, `next()` даст `false`.\n\nПоэтому результат проверяется:\n\n```java\nif (!resultSet.next()) {\n    throw new SQLException(\n            \"Cat not found: \" + name\n    );\n}\n```\n\nДля преобразования `byte[]` в строку явно задаётся кодировка:\n\n```java\nnew String(\n        parameters,\n        StandardCharsets.UTF_8\n);\n```\n\nа не используется platform default charset.\n\n---\n\nОтдельная проблема:\n\n```java\nConcurrentHashMap<byte[], BigDecimal>\n```\n\nДаже несмотря на потокобезопасность `ConcurrentHashMap`, `byte[]` — плохой ключ.\n\nНапример:\n\n```java\nbyte[] first = {1, 2};\nbyte[] second = {1, 2};\n\nSystem.out.println(\n        first.equals(second)\n); // false\n```\n\nМассивы используют `equals()` и `hashCode()` из `Object`, поэтому два массива с одинаковым содержимым считаются разными ключами.\n\nКроме того, сам массив изменяемый.\n\nВ данном коде `CACHE` вообще нигде не используется, поэтому его лучше удалить как мёртвое состояние.\n\nЕсли такой кэш действительно нужен, следует использовать неизменяемый ключ с корректными `equals()` и `hashCode()`, например отдельный value object, а не сырой `byte[]`.\n\nОсновные проблемы исходного класса:\n\n- поле с `var` не компилируется;\n    \n- поля конструктора инициализируются в неправильную сторону;\n    \n- внутренний список напрямую связан с внешней коллекцией;\n    \n- `jumpsCount` публичный и непотокобезопасный;\n    \n- `jumpsCount++` приводит к lost update;\n    \n- чтение и сброс счётчика неатомарны;\n    \n- создаётся отдельный поток на каждый прыжок;\n    \n- генерация случайного числа содержит edge cases;\n    \n- `NullPointerException` используется как часть обычной логики;\n    \n- изменение `cat4Profile` между потоками не обеспечивает видимость;\n    \n- Logger каждый раз запрашивается заново;\n    \n- SQL собирается конкатенацией;\n    \n- возможен SQL Injection;\n    \n- SQL содержит синтаксическую ошибку;\n    \n- JDBC-ресурсы управляются вручную;\n    \n- `ResultSet.next()` не проверяется;\n    \n- при преобразовании `byte[]` не задан charset;\n    \n- `byte[]` некорректен как обычный ключ `Map`;\n    \n- `CACHE` и `list` в представленном коде фактически не используются;\n    \n- `setJumpsCount()` имеет неверное имя — метод увеличивает счётчик, поэтому `incrementJumpsCount()` точнее отражает его назначение.\n    \n\n{{< /details >}}"
  filepath = "cat4-fix"

[[tasks]]
  id = 11
  question = "Провести code review и рефакторинг OrderService"
  answer = "**Условие задачи:**  \nДан Spring-сервис обработки заказов.\n\nНеобходимо провести code review и ответить на вопросы:\n\n- как валидировать входящий по REST `OrderDto`;\n    \n- где выполнять проверки на `null`;\n    \n- какие обязанности оставить в `OrderService`;\n    \n- когда откатится транзакция `processOrder()`;\n    \n- как разделить ответственность класса по SRP;\n    \n- какие данные сохранять в БД;\n    \n- какие проблемы возможны при сохранении заказа;\n    \n- что произойдёт при исключении из `saveOrder()`;\n    \n- как корректно уменьшать остатки товаров;\n    \n- будут ли автоматически сформированы методы Spring Data Repository;\n    \n- где писать кастомные запросы;\n    \n- какие ещё архитектурные и технические проблемы есть в коде.\n    \n\n**Код:**\n\n```java\n@Service\npublic class OrderService {\n\n    @Autowired\n    private OrderRepository orderRepository;\n\n    @Autowired\n    private InventoryRepository inventoryRepository;\n\n    @Autowired\n    private NotificationService notificationService;\n\n    @Transactional\n    public void processOrder(Order order) {\n        validateOrder(order);\n\n        calculateTotalPrice(\n                order.getItems(),\n                order.getCustomerType()\n        );\n\n        saveOrder(order);\n        notifyCustomer(order);\n        updateInventory(order);\n    }\n\n    public double calculateTotalPrice(\n            List<OrderItem> items,\n            String customerType\n    ) {\n        double total = items.stream()\n                .mapToDouble(\n                        item -> item.getPrice()\n                                * item.getQuantity()\n                )\n                .sum();\n\n        if (\"VIP\".equals(customerType)) {\n            total *= 0.9;\n        } else if (\"LOYALTY\".equals(customerType)) {\n            total *= 0.85;\n        }\n\n        if (orderRepository.countByCustomerType(\n                customerType\n        ) > 10) {\n            total *= 0.95;\n        }\n\n        return total;\n    }\n\n    private void saveOrder(Order order) {\n        orderRepository.save(order);\n    }\n\n    private void updateInventory(Order order) {\n        order.getItems().forEach(item ->\n                inventoryRepository.decreaseStock(\n                        item.getProductId(),\n                        item.getQuantity()\n                )\n        );\n    }\n}\n\n@Repository\npublic interface OrderRepository\n        extends JpaRepository<Order, Long> {\n\n    int countByCustomerType(String customerType);\n\n    Order findByOrderId(Long id);\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для REST DTO используй Bean Validation: `@NotNull`, `@NotEmpty`, `@Positive`, `@Valid`.  \n💡 Для денег нельзя использовать `double` — лучше `BigDecimal`.  \n💡 Результат `calculateTotalPrice()` сейчас вообще нигде не сохраняется.  \n💡 `@Transactional` откатывает транзакцию по умолчанию при неперехваченном `RuntimeException` или `Error`.  \n💡 Отправка уведомления внутри DB-транзакции создаёт проблему: внешний эффект нельзя откатить вместе с БД.  \n💡 Остаток товара нужно уменьшать атомарно: `UPDATE ... WHERE stock >= quantity`.  \n💡 Spring Data сможет создать derived query только тогда, когда указанные в имени метода свойства действительно существуют в `Order`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВ классе есть несколько функциональных и архитектурных проблем.\n\n**1. Рассчитанная стоимость заказа теряется**\n\nСейчас выполняется:\n\n```java\ncalculateTotalPrice(\n        order.getItems(),\n        order.getCustomerType()\n);\n```\n\nно результат метода игнорируется.\n\nТо есть даже если цена рассчитана правильно, в `Order` она не записывается.\n\nДолжно быть примерно так:\n\n```java\nBigDecimal total =\n        pricingService.calculateTotalPrice(order);\n\norder.setTotalPrice(total);\n```\n\nИ уже после этого заказ сохраняется.\n\n---\n\n**2. Для денег нельзя использовать `double`**\n\nКод:\n\n```java\ndouble total\n```\n\nи коэффициенты:\n\n```java\n0.9\n0.85\n0.95\n```\n\nмогут приводить к ошибкам двоичной арифметики с плавающей точкой.\n\nДля денежных значений лучше использовать:\n\n```java\nBigDecimal\n```\n\nНапример:\n\n```java\nBigDecimal total = items.stream()\n        .map(item ->\n                item.getPrice().multiply(\n                        BigDecimal.valueOf(\n                                item.getQuantity()\n                        )\n                )\n        )\n        .reduce(\n                BigDecimal.ZERO,\n                BigDecimal::add\n        );\n```\n\nЕсли `price` сейчас тоже `double`, его стоит заменить на `BigDecimal`.\n\n---\n\n**3. Как валидировать OrderDto**\n\nВ REST-слое удобно использовать Bean Validation.\n\nНапример:\n\n```java\npublic class OrderDto {\n\n    @NotNull\n    private Long customerId;\n\n    @NotNull\n    private CustomerType customerType;\n\n    @NotEmpty\n    @Valid\n    private List<OrderItemDto> items;\n}\n```\n\nЭлемент заказа:\n\n```java\npublic class OrderItemDto {\n\n    @NotNull\n    private Long productId;\n\n    @NotNull\n    @DecimalMin(value = \"0.01\")\n    private BigDecimal price;\n\n    @Positive\n    private int quantity;\n}\n```\n\nКонтроллер:\n\n```java\n@PostMapping(\"/orders\")\npublic ResponseEntity<Void> create(\n        @Valid @RequestBody OrderDto orderDto\n) {\n    orderService.processOrder(orderDto);\n\n    return ResponseEntity.ok().build();\n}\n```\n\nДля Spring Boot 3 используются аннотации из:\n\n```text\njakarta.validation\n```\n\nТак следует проверять **структурную корректность входного запроса**:\n\n- обязательные поля;\n    \n- пустые коллекции;\n    \n- положительные количества;\n    \n- формат значений.\n    \n\nБизнес-валидация вроде:\n\n```text\nтовар существует\nтовар доступен для продажи\nклиент имеет право оформить заказ\nостатка достаточно\n```\n\nдолжна выполняться уже в бизнес-слое.\n\n---\n\n**4. Где проверять параметры на null**\n\nОсновная проверка входящего REST DTO выполняется на границе приложения:\n\n```java\n@Valid @RequestBody OrderDto dto\n```\n\nНо публичный сервисный метод лучше не делать зависимым исключительно от того, что его всегда вызовет REST-контроллер.\n\nДля критичных параметров допустимо дополнительно защищать контракт:\n\n```java\nObjects.requireNonNull(orderDto, \"orderDto\");\n```\n\nНе следует при этом хаотично дублировать `null`-проверки во всех приватных методах.\n\nОбщий принцип:\n\n```text\nREST boundary\n    → синтаксическая валидация DTO\n\nApplication/Domain layer\n    → бизнес-инварианты\n```\n\n---\n\n**5. Что оставить в OrderService**\n\n`OrderService` разумно оставить application service, то есть координатором сценария:\n\n```text\nпроверить бизнес-правила\n        ↓\nпосчитать стоимость\n        ↓\nуменьшить остатки\n        ↓\nсохранить заказ\n        ↓\nзафиксировать событие о создании заказа\n```\n\nСам `OrderService` не должен знать детали:\n\n- расчёта всех скидок;\n    \n- SQL обновления склада;\n    \n- отправки email/push;\n    \n- сложной бизнес-валидации.\n    \n\n---\n\n**6. Нарушение SRP**\n\nСейчас один класс одновременно:\n\n```text\nвалидирует заказ\n+\nсчитает стоимость\n+\nсчитает скидки\n+\nходит в OrderRepository\n+\nуправляет складом\n+\nотправляет уведомления\n```\n\nЭто несколько причин для изменения одного класса.\n\nМожно разделить ответственность:\n\n```text\nOrderService\n    → orchestration\n\nOrderValidator\n    → бизнес-валидация\n\nPricingService\n    → цена\n\nDiscountPolicy\n    → конкретная скидка\n\nInventoryService\n    → остатки\n\nOrderRepository\n    → persistence\n\nNotification / Outbox\n    → уведомления\n```\n\n---\n\n**7. Скидки также реализованы проблемно**\n\nСейчас:\n\n```java\nif (\"VIP\".equals(customerType)) {\n    ...\n} else if (\"LOYALTY\".equals(customerType)) {\n    ...\n}\n```\n\nПри добавлении нового типа клиента приходится менять существующий метод.\n\nЗдесь хорошо подходит Strategy:\n\n```java\npublic interface DiscountPolicy {\n\n    CustomerType supports();\n\n    BigDecimal apply(\n            BigDecimal price,\n            Customer customer\n    );\n}\n```\n\nНапример:\n\n```text\nVipDiscountPolicy\nLoyaltyDiscountPolicy\nRegularDiscountPolicy\n```\n\n---\n\n**8. Проверка постоянного клиента выглядит логически неверной**\n\nВ коде:\n\n```java\norderRepository.countByCustomerType(customerType)\n```\n\nи далее:\n\n```java\nif (...) > 10 {\n    total *= 0.95;\n}\n```\n\nКомментарий говорит:\n\n```text\nДоп. скидка для постоянных клиентов\n```\n\nНо запрос считает заказы **всех клиентов данного типа**.\n\nНапример, если в системе есть 1000 VIP-заказов разных людей, любой новый VIP сразу получит скидку «за постоянство».\n\nЕсли правило действительно относится к конкретному клиенту, вероятнее нужен запрос вроде:\n\n```java\nlong countByCustomerId(Long customerId);\n```\n\nа ещё лучше учитывать только успешно завершённые заказы:\n\n```java\nlong countByCustomerIdAndStatus(\n        Long customerId,\n        OrderStatus status\n);\n```\n\n---\n\n**9. Когда откатится processOrder()**\n\nПо умолчанию:\n\n```java\n@Transactional\n```\n\nоткатывает транзакцию, если наружу из метода выйдет:\n\n```text\nRuntimeException\nили\nError\n```\n\nНапример:\n\n```java\nthrow new IllegalStateException();\n```\n\nприведёт к rollback.\n\nChecked exception по умолчанию rollback не вызывает.\n\nЕсли нужно:\n\n```java\n@Transactional(rollbackFor = Exception.class)\n```\n\nТакже транзакция должна быть вызвана через Spring proxy. Если `processOrder()` вызывается через:\n\n```java\nthis.processOrder(...)\n```\n\nиз другого метода того же класса, стандартный proxy-based `@Transactional` не сработает.\n\nЕсли исключение поймано:\n\n```java\ntry {\n    ...\n} catch (RuntimeException e) {\n    // ничего\n}\n```\n\nи не проброшено дальше, транзакция обычно продолжит выполнение, если она отдельно не была помечена `rollbackOnly`.\n\n---\n\n**10. Что произойдёт, если saveOrder() выбросит exception**\n\nЕсли:\n\n```java\norderRepository.save(order);\n```\n\nвыбросит неперехваченный `RuntimeException`, например Spring `DataAccessException`, выполнение `processOrder()` прекратится.\n\nТо есть:\n\n```text\nsaveOrder()\n   ↓ exception\n\nnotifyCustomer()   ← уже не вызывается\nupdateInventory()  ← уже не вызывается\n```\n\nТранзакция будет откатываться.\n\nНо с JPA есть важный нюанс.\n\nВызов:\n\n```java\nrepository.save(order);\n```\n\nне всегда означает, что SQL уже отправлен в БД.\n\nHibernate может выполнить реальный `INSERT` только во время:\n\n```text\nflush\nили\ncommit\n```\n\nПоэтому нарушение constraint может обнаружиться **после выполнения следующего кода**.\n\nЭто особенно важно из-за `notifyCustomer()`.\n\n---\n\n**11. notifyCustomer() внутри транзакции опасен**\n\nСейчас последовательность:\n\n```text\nsaveOrder\n↓\nnotifyCustomer\n↓\nupdateInventory\n↓\nCOMMIT\n```\n\nПредставим:\n\n```text\nsaveOrder()          → пока всё нормально\nnotifyCustomer()     → клиенту отправлено \"Заказ создан\"\nupdateInventory()    → exception\ntransaction          → ROLLBACK\n```\n\nВ БД заказа нет, но клиент уже получил уведомление.\n\nВнешний вызов невозможно откатить вместе с JDBC-транзакцией.\n\nДля надёжной системы лучше использовать **Transactional Outbox**:\n\n```text\nDB transaction:\n    сохранить Order\n    изменить Inventory\n    сохранить OutboxEvent\n\nCOMMIT\n\nотдельный worker:\n    читает Outbox\n    отправляет notification\n```\n\nТогда заказ и событие фиксируются атомарно в одной БД.\n\n---\n\n**12. Что уменьшается в updateInventory()**\n\nМетод:\n\n```java\ninventoryRepository.decreaseStock(\n        item.getProductId(),\n        item.getQuantity()\n);\n```\n\nпо названию должен **уменьшать** остаток.\n\nТо есть:\n\n```text\nstock = stock - quantity\n```\n\nЕсли было:\n\n```text\nstock = 10\nquantity = 3\n```\n\nпосле операции ожидается:\n\n```text\nstock = 7\n```\n\n---\n\n**13. Как должен работать decreaseStock()**\n\nПросто сначала прочитать остаток, а потом сохранить новое значение — недостаточно при конкурентных заказах.\n\nНапример:\n\n```text\nstock = 1\n\nOrder A читает 1\nOrder B читает 1\n\nA списывает 1\nB списывает 1\n```\n\nОба могут считать товар доступным.\n\nЛучше выполнить атомарный запрос:\n\n```java\n@Modifying\n@Query(\"\"\"\n        update Inventory i\n           set i.stock = i.stock - :quantity\n         where i.productId = :productId\n           and i.stock >= :quantity\n        \"\"\")\nint decreaseStock(\n        @Param(\"productId\") Long productId,\n        @Param(\"quantity\") int quantity\n);\n```\n\nИ проверить результат:\n\n```java\nint updated = repository.decreaseStock(\n        productId,\n        quantity\n);\n\nif (updated != 1) {\n    throw new OutOfStockException(productId);\n}\n```\n\nТаким образом, БД атомарно проверяет наличие товара и уменьшает остаток.\n\n---\n\n**14. Будет ли работать countByCustomerType()**\n\nМетод:\n\n```java\nint countByCustomerType(String customerType);\n```\n\nможет быть автоматически реализован Spring Data **только если в `Order` существует свойство `customerType`**.\n\nНапример:\n\n```java\nprivate String customerType;\n```\n\nили совместимое поле с соответствующим property accessor.\n\nТогда Spring Data построит derived query самостоятельно.\n\nЕсли такого свойства у `Order` нет, приложение получит ошибку при создании repository bean.\n\nКомпилятор Java такую проблему не обнаружит.\n\nТакже для количества записей естественнее возвращать:\n\n```java\nlong\n```\n\nпоскольку Spring Data `count...` обычно семантически соответствует `long`.\n\n---\n\n**15. Будет ли работать findByOrderId()**\n\nЭто зависит от полей сущности.\n\n```java\nOrder findByOrderId(Long id);\n```\n\nищет property path, соответствующий `orderId`.\n\nЕсли сущность содержит:\n\n```java\nprivate Long orderId;\n```\n\nтакой derived query возможен.\n\nНо если первичный ключ выглядит стандартно:\n\n```java\n@Id\nprivate Long id;\n```\n\nто этот метод лишний.\n\n`JpaRepository` уже предоставляет:\n\n```java\nOptional<Order> findById(Long id);\n```\n\nСледует использовать:\n\n```java\norderRepository.findById(id);\n```\n\nЕсли свойства `orderId` или подходящего property path в `Order` нет, Spring Data не сможет создать запрос и repository может не подняться при старте приложения.\n\n---\n\n**16. Где писать SQL в Repository**\n\nДля стандартных запросов SQL вообще не нужен.\n\nМожно использовать derived query:\n\n```java\nlong countByCustomerId(Long customerId);\n```\n\nSpring Data сформирует запрос самостоятельно.\n\nЕсли нужен собственный JPQL:\n\n```java\n@Query(\"\"\"\n        select count(o)\n        from Order o\n        where o.customer.id = :customerId\n        \"\"\")\nlong countOrders(\n        @Param(\"customerId\") Long customerId\n);\n```\n\nЕсли нужен именно native SQL:\n\n```java\n@Query(\n        value = \"\"\"\n                select count(*)\n                from orders\n                where customer_id = :customerId\n                \"\"\",\n        nativeQuery = true\n)\nlong countOrders(\n        @Param(\"customerId\") Long customerId\n);\n```\n\nДля `UPDATE`/`DELETE` дополнительно нужен:\n\n```java\n@Modifying\n```\n\n---\n\n**17. Что записывать в таблицу**\n\nКонкретная структура `Order` в условии не показана, поэтому полный набор колонок определить нельзя.\n\nНо как минимум сохраняемый заказ должен содержать результат бизнес-расчётов, а не только исходный request.\n\nНапример:\n\n```text\nOrder\n----------------\nid\ncustomer_id\ncustomer_type\ntotal_price\nstatus\ncreated_at\n```\n\nТовары обычно хранят отдельно:\n\n```text\nOrderItem\n----------------\norder_id\nproduct_id\nquantity\nunit_price\n```\n\nКритично то, что вычисленная:\n\n```java\ntotalPrice\n```\n\nдолжна быть записана в `Order`.\n\nСейчас этого не происходит.\n\n---\n\n**18. Какие риски есть при сохранении в БД**\n\nВ production нужно учитывать:\n\n- нарушение `NOT NULL`;\n    \n- нарушение `UNIQUE`;\n    \n- нарушение FK;\n    \n- optimistic locking conflict;\n    \n- deadlock;\n    \n- lock timeout;\n    \n- потерю соединения;\n    \n- превышение connection pool;\n    \n- duplicate request;\n    \n- повторную отправку одного заказа;\n    \n- недостаточный остаток товара;\n    \n- конкурентное изменение остатков;\n    \n- exception на flush/commit, а не непосредственно на `save()`.\n    \n\nДля создания заказа также полезно иметь idempotency key, если вызывающий клиент может повторить HTTP-запрос после timeout.\n\n---\n\n**19. Вариант структуры после рефакторинга**\n\n`OrderService` оставляем координатором use case:\n\n```java\n@Service\npublic class OrderService {\n\n    private final OrderRepository orderRepository;\n    private final OrderValidator orderValidator;\n    private final PricingService pricingService;\n    private final InventoryService inventoryService;\n    private final OutboxService outboxService;\n\n    public OrderService(\n            OrderRepository orderRepository,\n            OrderValidator orderValidator,\n            PricingService pricingService,\n            InventoryService inventoryService,\n            OutboxService outboxService\n    ) {\n        this.orderRepository = orderRepository;\n        this.orderValidator = orderValidator;\n        this.pricingService = pricingService;\n        this.inventoryService = inventoryService;\n        this.outboxService = outboxService;\n    }\n\n    @Transactional\n    public Long processOrder(Order order) {\n        Objects.requireNonNull(order, \"order\");\n\n        orderValidator.validate(order);\n\n        BigDecimal totalPrice =\n                pricingService.calculateTotalPrice(order);\n\n        order.setTotalPrice(totalPrice);\n\n        inventoryService.decreaseStock(\n                order.getItems()\n        );\n\n        Order saved =\n                orderRepository.save(order);\n\n        outboxService.saveOrderCreatedEvent(\n                saved.getId()\n        );\n\n        return saved.getId();\n    }\n}\n```\n\nЕсли `InventoryRepository`, `OrderRepository` и outbox используют одну БД и один transaction manager, то:\n\n```text\nуменьшение stock\n+\nсохранение order\n+\nсохранение outbox event\n```\n\nфиксируются одной транзакцией.\n\nПри ошибке любой из этих операций изменения откатываются вместе.\n\n---\n\n**20. Какие принципы нарушены**\n\nОсновной — **SRP**:\n\n```text\nOrderService знает слишком много и делает слишком много.\n```\n\nТакже нарушается **OCP**:\n\n```java\nif (\"VIP\".equals(...)) {\n    ...\n} else if (\"LOYALTY\".equals(...)) {\n    ...\n}\n```\n\nКаждый новый тип скидки требует изменения метода.\n\nПоэтому скидки естественно вынести в Strategy.\n\nЕсть и нарушение Separation of Concerns: orchestration, pricing, persistence, inventory и notification смешаны в одном классе.\n\nДополнительно стоит исправить:\n\n- field injection → constructor injection;\n    \n- `String customerType` → `enum CustomerType`;\n    \n- `double` → `BigDecimal`;\n    \n- синхронный notification внутри транзакции → outbox;\n    \n- неиспользуемый результат `calculateTotalPrice()`;\n    \n- запрос скидки по `customerType`, если бизнес-правило относится к конкретному клиенту;\n    \n- конкурентное списание остатков.\n    \n\nГлавная целевая структура:\n\n```text\nController\n    │\n    │ @Valid OrderDto\n    ▼\nOrderService\n    │\n    ├── OrderValidator\n    ├── PricingService\n    │      └── DiscountStrategy\n    │\n    ├── InventoryService\n    │\n    ├── OrderRepository\n    │\n    └── Outbox\n             │\n             ▼\n        Notification\n```\n\nТак `OrderService` остаётся координатором бизнес-сценария, а конкретные обязанности разделены между специализированными компонентами.\n\n{{< /details >}}"
  filepath = "order-service-review"

[[tasks]]
  id = 12
  question = "Провести code review сервиса сохранения заказа"
  answer = "**Условие задачи:**  \nДан сервис сохранения заказа.\n\nНеобходимо провести code review и определить:\n\n- корректно ли работает `@Transactional`;\n    \n- правильно ли организована валидация;\n    \n- что произойдёт при исключениях;\n    \n- корректно ли выполняется аудит;\n    \n- какие проблемы есть с Dependency Injection;\n    \n- какие риски возникнут при работе с БД;\n    \n- как разделить ответственность класса;\n    \n- как должна выглядеть исправленная реализация.\n    \n\n**Код:**\n\n```java\npublic class OrderService {\n\n    @Autowired\n    private OrderRepository orderRepository;\n\n    @Inject\n    private AuditRepository auditRepository;\n\n    public void save(Order order)\n            throws OrderValidationException {\n        try {\n            saveOrderInternal(order);\n        } catch (Throwable e) {\n            e.printStackTrace();\n            throw new OrderSaveException(e, order);\n        }\n    }\n\n    @Transactional\n    private void saveOrderInternal(Order order)\n            throws OrderValidationException {\n\n        auditRepository.save(order);\n\n        if (order.getClient().getName() == \"\") {\n            throw new OrderValidationException(\n                    \"Поле клиент не заполнено.\"\n            );\n        }\n\n        orderRepository.save(order);\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `@Transactional` работает через Spring AOP proxy, поэтому аннотация на `private`-методе, вызываемом из того же класса, не создаёт транзакцию.  \n💡 Строки нельзя сравнивать через `==`.  \n💡 До обращения к `order.getClient().getName()` нужно учитывать `null`.  \n💡 `catch (Throwable)` перехватывает даже серьёзные ошибки JVM, которые обычно перехватывать не следует.  \n💡 Checked exception по умолчанию не приводит к rollback Spring-транзакции.  \n💡 Нужно определить семантику аудита: фиксировать только успешные операции или также неуспешные попытки.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВ коде есть несколько существенных проблем.\n\n**1. `@Transactional` фактически не работает**\n\nМетод:\n\n```java\n@Transactional\nprivate void saveOrderInternal(Order order) {\n    ...\n}\n```\n\nвызывается так:\n\n```java\nsaveOrderInternal(order);\n```\n\nто есть непосредственно из того же объекта.\n\nSpring в обычном proxy-based режиме применяет `@Transactional`, когда вызов проходит через Spring-прокси:\n\n```text\nдругой bean\n   ↓\nSpring proxy\n   ↓\n@Transactional method\n```\n\nЗдесь происходит:\n\n```text\nOrderService.save()\n       ↓\nprivate saveOrderInternal()\n```\n\nпоэтому транзакционный interceptor не вызывается.\n\nКроме того, `private`-метод сам по себе не является подходящей точкой для proxy-based транзакционного метода.\n\nАннотацию следует поставить на публичный метод:\n\n```java\n@Transactional\npublic void save(...) {\n    ...\n}\n```\n\n---\n\n**2. Валидация выполняется после записи аудита**\n\nСейчас:\n\n```java\nauditRepository.save(order);\n\nif (...) {\n    throw new OrderValidationException(...);\n}\n```\n\nПолучается логика:\n\n```text\nсначала что-то сохраняем\n↓\nпотом выясняем, что заказ вообще невалидный\n```\n\nЕсли аудит должен фиксировать только успешно принятые заказы, сначала нужно валидировать данные.\n\nЕсли же бизнес-требование состоит в том, чтобы аудитировать **все попытки**, включая невалидные и упавшие, это уже другая семантика: такой аудит часто выполняют отдельно, например в собственной транзакции `REQUIRES_NEW`.\n\n---\n\n**3. Строки сравниваются неправильно**\n\nТак делать нельзя:\n\n```java\norder.getClient().getName() == \"\"\n```\n\n`==` сравнивает ссылки на объекты.\n\nМинимальный вариант:\n\n```java\norder.getClient().getName().isBlank()\n```\n\nНо сначала необходимо проверить всю цепочку на `null`:\n\n```java\nif (order == null\n        || order.getClient() == null\n        || order.getClient().getName() == null\n        || order.getClient().getName().isBlank()) {\n    ...\n}\n```\n\nЛучше вынести это в отдельный валидатор.\n\n---\n\n**4. `catch (Throwable)` слишком широкий**\n\nСейчас:\n\n```java\ncatch (Throwable e)\n```\n\nперехватывает не только обычные исключения, но и `Error`, например:\n\n```text\nOutOfMemoryError\nStackOverflowError\nLinkageError\n```\n\nТакие ошибки обычно не должны превращаться в бизнесовый `OrderSaveException`.\n\nНужно перехватывать ожидаемые исключения, максимум:\n\n```java\ncatch (Exception e)\n```\n\nно и это часто избыточно.\n\n---\n\n**5. OrderValidationException — checked exception**\n\nКласс:\n\n```java\npublic class OrderValidationException\n        extends Exception {\n}\n```\n\nявляется checked exception.\n\nПо умолчанию Spring делает rollback для:\n\n```text\nRuntimeException\nError\n```\n\nно **не для checked exception**.\n\nТо есть если внутри реально работающего `@Transactional`-метода после изменения БД будет выброшен:\n\n```java\nthrow new OrderValidationException(...);\n```\n\nSpring по умолчанию не обязан откатывать транзакцию.\n\nЕсли checked exception необходимо сохранить:\n\n```java\n@Transactional(\n        rollbackFor = OrderValidationException.class\n)\n```\n\nНо ещё проще выполнять валидацию до любых изменений.\n\nДля многих бизнесовых ошибок также используют исключение-наследник `RuntimeException`.\n\n---\n\n**6. Внешний try/catch может повлиять на семантику исключений**\n\nСейчас:\n\n```java\ntry {\n    saveOrderInternal(order);\n} catch (Throwable e) {\n    throw new OrderSaveException(e, order);\n}\n```\n\nПри этом сигнатура:\n\n```java\npublic void save(Order order)\n        throws OrderValidationException\n```\n\nно `OrderValidationException` тоже будет пойман и превращён в `OrderSaveException`.\n\nТо есть вызывающий код фактически не получит заявленный:\n\n```java\nOrderValidationException\n```\n\nЕсли `OrderSaveException` является checked exception, данный код вообще не скомпилируется, пока он не будет добавлен в `throws`.\n\nЕсли это `RuntimeException`, код скомпилируется, но контракт метода всё равно вводит в заблуждение.\n\n---\n\n**7. Нельзя использовать `printStackTrace()`**\n\nВ серверном приложении:\n\n```java\ne.printStackTrace();\n```\n\nследует заменить нормальным логированием:\n\n```java\nlog.error(\n        \"Failed to save order {}\",\n        order != null ? order.getId() : null,\n        e\n);\n```\n\nНо важно не логировать один и тот же exception на каждом слое без необходимости, иначе логи будут дублироваться.\n\n---\n\n**8. Dependency Injection оформлен непоследовательно**\n\nИспользуются одновременно:\n\n```java\n@Autowired\n```\n\nи:\n\n```java\n@Inject\n```\n\nОбе модели могут работать, но смешивать их в одном классе нет смысла.\n\nПредпочтительнее constructor injection:\n\n```java\nprivate final OrderRepository orderRepository;\nprivate final AuditRepository auditRepository;\n\npublic OrderService(\n        OrderRepository orderRepository,\n        AuditRepository auditRepository\n) {\n    this.orderRepository = orderRepository;\n    this.auditRepository = auditRepository;\n}\n```\n\nПреимущества:\n\n- зависимости обязательны;\n    \n- поля можно сделать `final`;\n    \n- класс легче тестировать;\n    \n- объект невозможно создать в частично инициализированном состоянии.\n    \n\n---\n\n**9. `OrderService` должен быть Spring-бином**\n\nВ примере отсутствует:\n\n```java\n@Service\n```\n\nЕсли его действительно нет в исходном приложении, Spring не создаст бин, Dependency Injection и `@Transactional` не заработают.\n\nДолжно быть:\n\n```java\n@Service\npublic class OrderService {\n    ...\n}\n```\n\n---\n\n**10. Что произойдёт, если `orderRepository.save()` выбросит exception**\n\nНапример, Spring Data может выбросить наследника:\n\n```text\nDataAccessException\n```\n\nкоторый является `RuntimeException`.\n\nЕсли `save()` находится внутри реально работающей транзакции и исключение выходит наружу, транзакция будет помечена на rollback.\n\nНо у JPA есть важная особенность:\n\n```java\norderRepository.save(order);\n```\n\nне гарантирует немедленного выполнения SQL.\n\nОшибка БД может возникнуть позже:\n\n```text\nsave()\n↓\n...\n↓\nflush\n↓\nCOMMIT\n↓\nconstraint violation\n```\n\nНапример, нарушение `UNIQUE` или FK может обнаружиться только при flush/commit.\n\n---\n\n**11. Порядок `orderRepository.save()` и `auditRepository.save()` зависит от бизнес-смысла**\n\nЕсли аудит означает:\n\n> «успешно сохранён заказ»\n\nлогично выполнять:\n\n```text\nvalidate\n↓\nsave order\n↓\nsave audit\n↓\ncommit\n```\n\nв одной транзакции.\n\nЕсли оба repository работают с одной транзакционной БД, ошибка на любом шаге откатит оба изменения.\n\nЕсли аудит должен содержать информацию даже о неуспешной попытке, он не должен находиться в той же откатываемой транзакции.\n\nНапример:\n\n```java\n@Transactional(propagation = Propagation.REQUIRES_NEW)\npublic void writeFailedAttempt(...) {\n    ...\n}\n```\n\nможет быть вынесен в **отдельный Spring-бин**, чтобы `REQUIRES_NEW` действительно применился через proxy.\n\n---\n\n**12. `auditRepository.save(order)` нужно проверить по типам**\n\nОпределение `AuditRepository` в условии отсутствует.\n\nЕсли он, например:\n\n```java\nJpaRepository<Audit, Long>\n```\n\nто:\n\n```java\nauditRepository.save(order);\n```\n\nнекорректен по типам — нужно создавать `Audit`.\n\nЕсли же `AuditRepository` действительно работает с `Order`, этот вызов может быть допустим.\n\nБез определения repository однозначно утверждать нельзя.\n\n---\n\nОдин из вариантов рефакторинга:\n\n```java\n@Service\npublic class OrderService {\n\n    private final OrderRepository orderRepository;\n    private final AuditRepository auditRepository;\n    private final OrderValidator orderValidator;\n\n    public OrderService(\n            OrderRepository orderRepository,\n            AuditRepository auditRepository,\n            OrderValidator orderValidator\n    ) {\n        this.orderRepository = orderRepository;\n        this.auditRepository = auditRepository;\n        this.orderValidator = orderValidator;\n    }\n\n    @Transactional\n    public void save(Order order) {\n        orderValidator.validate(order);\n\n        Order savedOrder =\n                orderRepository.save(order);\n\n        auditRepository.save(\n                Audit.orderSaved(savedOrder)\n        );\n    }\n}\n```\n\nВалидацию можно вынести отдельно:\n\n```java\n@Component\npublic class OrderValidator {\n\n    public void validate(Order order) {\n        if (order == null) {\n            throw new OrderValidationException(\n                    \"Заказ не указан\"\n            );\n        }\n\n        if (order.getClient() == null\n                || order.getClient().getName() == null\n                || order.getClient().getName().isBlank()) {\n\n            throw new OrderValidationException(\n                    \"Поле клиент не заполнено\"\n            );\n        }\n    }\n}\n```\n\nЕсли выбрать бизнесовое исключение как unchecked:\n\n```java\npublic class OrderValidationException\n        extends RuntimeException {\n\n    public OrderValidationException(String message) {\n        super(message);\n    }\n}\n```\n\nто при возникновении такого исключения внутри транзакции Spring по умолчанию выполнит rollback.\n\nВ данном варианте оно возникает **до первого изменения БД**, поэтому это дополнительно упрощает семантику.\n\n---\n\nОсновной сценарий становится таким:\n\n```text\nsave(order)\n    │\n    ├── validate\n    │      └── ошибка → никаких записей в БД\n    │\n    ├── save Order\n    │\n    ├── save Audit\n    │\n    └── COMMIT\n```\n\nЕсли сохранение аудита падает:\n\n```text\nsave Order\n    ↓\nsave Audit → RuntimeException\n    ↓\nROLLBACK\n```\n\nто при одной общей транзакции заказ также не сохраняется.\n\n---\n\nОсновные замечания по исходному коду:\n\n- `@Transactional` на приватном self-invoked методе не работает;\n    \n- валидация происходит слишком поздно;\n    \n- строки сравниваются через `==`;\n    \n- отсутствуют проверки `order`, `client`, `name` на `null`;\n    \n- `Throwable` перехватывать не следует;\n    \n- `printStackTrace()` не подходит для сервера;\n    \n- checked `OrderValidationException` имеет другую rollback-семантику;\n    \n- заявленный `OrderValidationException` фактически поглощается общим `catch`;\n    \n- DI-аннотации смешаны;\n    \n- лучше использовать constructor injection;\n    \n- нужно проверить наличие `@Service`;\n    \n- исключение JPA может возникнуть только на flush/commit;\n    \n- семантика аудита должна быть определена явно;\n    \n- сохранение `Order` через `AuditRepository` корректно только при подходящем generic-типе repository;\n    \n- валидацию, persistence и аудит разумно разделить по ответственности.\n    \n\n{{< /details >}}"
  filepath = "order-service-review2"

[[tasks]]
  id = 13
  question = "Сделать рефакторинг сервиса пользователей"
  answer = "**Условие задачи:**  \nДан сервис `UserService`, который создаёт пользователей и связывает их с регионом.\n\nНеобходимо провести code review и исправить проблемы, связанные с:\n\n- созданием и внедрением зависимостей;\n    \n- использованием `ApplicationContext`;\n    \n- транзакциями;\n    \n- ошибками компиляции;\n    \n- стилем и именованием;\n    \n- обработкой списка пользователей;\n    \n- выбором корректной границы транзакции.\n    \n\n**Код:**\n\n```java\nclass UserService {\n\n    private UserRepository repo = new UserRepository();\n    private RegionService regionService;\n\n    public UserService(final ApplicationContext appCtx) {\n        regionService = appCtx.getBean(\n                \"regionService\",\n                RegionService.class\n        );\n    }\n\n    public void processNewUsers(\n            final List<User> users,\n            String regionName\n    ) {\n        // ...\n\n        users = createUsers(users);\n\n        // ...\n\n        users.stream()\n                .foreach(u ->\n                        regionService.updateRegionLink(\n                                u.getId(),\n                                regionName\n                        )\n                );\n    }\n\n    @Transactional\n    public List<User> createUsers(\n            final List<User> users\n    ) {\n        return users.stream()\n                .map(u -> repo.saveUser(u))\n                .collect(Collectors.toList());\n    }\n\n    private User getUser(final int userId) {\n        return repo.getUserById(userId);\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сервис не должен самостоятельно создавать `UserRepository` или доставать зависимости из `ApplicationContext`.  \n💡 Параметр `users` объявлен `final`, поэтому присвоить ему новый список нельзя.  \n💡 В Stream API метод называется `forEach()`, а не `foreach()`.  \n💡 `@Transactional` на `createUsers()` не сработает при обычном внутреннем вызове из `processNewUsers()` через `this`.  \n💡 Нужно определить настоящую транзакционную границу: только создание пользователей или весь сценарий целиком.  \n💡 Если обновление региона — удалённый вызов, одна JDBC-транзакция всё равно не сделает весь процесс атомарным.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВ исходном коде есть как минимум две ошибки компиляции.\n\nПараметр:\n\n```java\nfinal List<User> users\n```\n\nнельзя переназначать:\n\n```java\nusers = createUsers(users);\n```\n\nНужно сохранить результат в отдельную переменную:\n\n```java\nList<User> savedUsers = createUsers(users);\n```\n\nТакже в Stream API нет метода:\n\n```java\nforeach(...)\n```\n\nПравильно:\n\n```java\nforEach(...)\n```\n\n---\n\nГлавная архитектурная проблема — работа с зависимостями.\n\nТак делать не следует:\n\n```java\nprivate UserRepository repo = new UserRepository();\n```\n\nSpring-сервис не должен самостоятельно создавать repository. Кроме того, если `UserRepository` является интерфейсом Spring Data, такой код вообще не скомпилируется.\n\nТакже нежелательно использовать Service Locator:\n\n```java\nappCtx.getBean(\"regionService\", RegionService.class);\n```\n\nЗависимости лучше явно передавать через конструктор:\n\n```java\n@Service\npublic class UserService {\n\n    private final UserRepository userRepository;\n    private final RegionService regionService;\n\n    public UserService(\n            UserRepository userRepository,\n            RegionService regionService\n    ) {\n        this.userRepository = userRepository;\n        this.regionService = regionService;\n    }\n\n    // ...\n}\n```\n\nТеперь зависимости:\n\n- явно видны;\n    \n- обязательны;\n    \n- могут быть `final`;\n    \n- легко подменяются в тестах;\n    \n- создаются и управляются Spring.\n    \n\n---\n\nЕсть важная проблема с транзакцией.\n\nСейчас:\n\n```java\npublic void processNewUsers(...) {\n    createUsers(users);\n}\n\n@Transactional\npublic List<User> createUsers(...) {\n    ...\n}\n```\n\n`createUsers()` вызывается из того же объекта.\n\nПри стандартном proxy-based AOP вызов выглядит так:\n\n```text\nSpring proxy\n    ↓\nprocessNewUsers()\n    ↓\nthis.createUsers()\n```\n\nВнутренний вызов не проходит через proxy ещё раз, поэтому `@Transactional` на `createUsers()` не создаёт ожидаемую транзакцию.\n\nЕсли создание пользователей и обновление региональных связей являются одной локальной бизнес-операцией в одной БД, транзакционной точкой входа логичнее сделать `processNewUsers()`:\n\n```java\n@Service\npublic class UserService {\n\n    private final UserRepository userRepository;\n    private final RegionService regionService;\n\n    public UserService(\n            UserRepository userRepository,\n            RegionService regionService\n    ) {\n        this.userRepository = userRepository;\n        this.regionService = regionService;\n    }\n\n    @Transactional\n    public void processNewUsers(\n            List<User> users,\n            String regionName\n    ) {\n        Objects.requireNonNull(users, \"users\");\n        Objects.requireNonNull(regionName, \"regionName\");\n\n        List<User> savedUsers = createUsers(users);\n\n        savedUsers.forEach(user ->\n                regionService.updateRegionLink(\n                        user.getId(),\n                        regionName\n                )\n        );\n    }\n\n    private List<User> createUsers(\n            List<User> users\n    ) {\n        return users.stream()\n                .map(userRepository::saveUser)\n                .collect(Collectors.toList());\n    }\n\n    private User getUser(int userId) {\n        return userRepository.getUserById(userId);\n    }\n}\n```\n\nТеперь вызов:\n\n```java\nprocessNewUsers(...)\n```\n\nприходит извне через Spring proxy, поэтому транзакция действительно начинается перед выполнением метода.\n\n`createUsers()` становится обычным приватным вспомогательным методом и отдельная `@Transactional` ему не нужна.\n\n---\n\nОднако транзакционную границу нужно выбирать по реальной природе `RegionService`.\n\nЕсли:\n\n```java\nregionService.updateRegionLink(...)\n```\n\nизменяет данные в той же БД и участвует в том же `PlatformTransactionManager`, общая транзакция может быть оправдана:\n\n```text\nсоздать User\n+\nобновить Region\n+\nCOMMIT\n```\n\nПри исключении изменения можно откатить вместе.\n\nЕсли же `RegionService` выполняет HTTP-вызов, отправляет сообщение или работает с независимым хранилищем, JDBC-транзакция не делает весь процесс атомарным.\n\nНапример:\n\n```text\nUser сохранён\n↓\nвнешний RegionService успешно обновлён\n↓\nследующая операция падает\n↓\nлокальная БД делает ROLLBACK\n```\n\nВнешнее изменение уже невозможно откатить обычной `@Transactional`.\n\nВ таком сценарии нужно отдельно проектировать согласованность: например, через событие/outbox, retry и идемпотентность.\n\n---\n\nЕщё один момент — вызов:\n\n```java\nsavedUsers.forEach(user ->\n        regionService.updateRegionLink(\n                user.getId(),\n                regionName\n        )\n);\n```\n\nделает одну операцию на каждого пользователя.\n\nЕсли `users` может быть большим списком и `RegionService` поддерживает batch-операцию, эффективнее использовать что-то вроде:\n\n```java\nregionService.updateRegionLinks(\n        savedUsers,\n        regionName\n);\n```\n\nЭто особенно важно, если каждый вызов приводит к отдельному SQL или сетевому запросу.\n\n---\n\nМетод:\n\n```java\nprivate User getUser(int userId)\n```\n\nв представленном фрагменте нигде не используется.\n\nЕсли он действительно не нужен, его следует удалить.\n\nЕсли это операция публичного API сервиса, тогда `private` некорректен и нужно явно определить контракт, включая поведение при отсутствии пользователя.\n\nНапример, если repository возвращает `Optional`:\n\n```java\npublic User getUser(int userId) {\n    return userRepository.findById(userId)\n            .orElseThrow(() ->\n                    new EntityNotFoundException(\n                            \"User not found: \" + userId\n                    )\n            );\n}\n```\n\nНо изменять видимость только ради самого рефакторинга не нужно — это зависит от назначения метода.\n\n---\n\nИтоговый минимальный вариант, если весь сценарий должен выполняться в одной локальной транзакции:\n\n```java\n@Service\npublic class UserService {\n\n    private final UserRepository userRepository;\n    private final RegionService regionService;\n\n    public UserService(\n            UserRepository userRepository,\n            RegionService regionService\n    ) {\n        this.userRepository = userRepository;\n        this.regionService = regionService;\n    }\n\n    @Transactional\n    public void processNewUsers(\n            List<User> users,\n            String regionName\n    ) {\n        Objects.requireNonNull(users, \"users\");\n        Objects.requireNonNull(regionName, \"regionName\");\n\n        List<User> savedUsers = users.stream()\n                .map(userRepository::saveUser)\n                .collect(Collectors.toList());\n\n        savedUsers.forEach(user ->\n                regionService.updateRegionLink(\n                        user.getId(),\n                        regionName\n                )\n        );\n    }\n}\n```\n\nОсновные проблемы исходного кода:\n\n- repository создаётся вручную вместо DI;\n    \n- используется `ApplicationContext` как Service Locator;\n    \n- зависимости не `final`;\n    \n- отсутствует нормальный constructor injection;\n    \n- `final`-параметр `users` пытаются переназначить;\n    \n- написано `foreach` вместо `forEach`;\n    \n- `@Transactional` на self-invoked `createUsers()` не работает ожидаемым образом;\n    \n- транзакционная граница выбрана неочевидно;\n    \n- возможны многочисленные отдельные вызовы `RegionService`;\n    \n- `getUser()` в представленном коде не используется;\n    \n- имя `repo` менее информативно, чем `userRepository`.\n    \n\nКлючевое исправление — не просто перенести `@Transactional`, а сначала определить, какие операции действительно должны составлять **одну атомарную транзакцию**.\n\n{{< /details >}}"
  filepath = "user-service-refactoring"

[[tasks]]
  id = 14
  question = "Провести code review сервиса создания заказа"
  answer = "**Условие задачи:**  \nДан Spring-сервис создания заказа.\n\nМетод `createOrder()`:\n\n- создаёт заказ со статусом `NEW`;\n    \n- сохраняет его в БД;\n    \n- синхронно вызывает внешний платёжный сервис;\n    \n- в зависимости от результата выставляет `PAID` или `FAILED`;\n    \n- сохраняет новый статус;\n    \n- отправляет событие в Kafka.\n    \n\nНеобходимо провести code review: определить сильные и слабые стороны реализации, возможные проблемы в production и предложить более надёжную архитектуру.\n\n**Код:**\n\n```java\n@Service\npublic class OrderService {\n\n    @Autowired\n    public OrderRepository orderRepository;\n\n    @Autowired\n    public PaymentClient paymentClient;\n\n    @Autowired\n    public KafkaTemplate<String, String> kafkaTemplate;\n\n    public String createOrder(CreateOrderRequest request) {\n\n        Order order = new Order();\n        order.setUserId(request.getUserId());\n        order.setAmount(request.getAmount());\n        order.setStatus(\"NEW\");\n\n        orderRepository.save(order);\n\n        boolean paid = paymentClient.charge(\n                request.getUserId(),\n                request.getAmount()\n        );\n\n        if (paid) {\n            order.setStatus(\"PAID\");\n            orderRepository.save(order);\n\n            kafkaTemplate.send(\n                    \"orders-topic\",\n                    \"Order paid: \" + order.getId()\n            );\n        } else {\n            order.setStatus(\"FAILED\");\n            orderRepository.save(order);\n\n            kafkaTemplate.send(\n                    \"orders-topic\",\n                    \"Order failed: \" + order.getId()\n            );\n        }\n\n        return \"OK\";\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй constructor injection вместо публичных полей с `@Autowired`.  \n💡 Статусы лучше представить через `enum`.  \n💡 Для денежных значений нужен `BigDecimal`.  \n💡 Подумай, что произойдёт, если платёж прошёл, а запись `PAID` в БД упала.  \n💡 Отдельно подумай о сценарии: БД обновилась, но событие в Kafka не отправилось.  \n💡 `@Transactional` вокруг всего метода не делает БД, платёжный сервис и Kafka одной транзакцией.  \n💡 Повторный HTTP-запрос может привести к созданию второго заказа и повторному списанию денег.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nПлюс исходного кода — бизнес-сценарий легко читается:\n\n```text\nсоздать заказ\n→ провести оплату\n→ обновить статус\n→ отправить событие\n```\n\nНо для production в нём есть несколько серьёзных проблем.\n\n**1. Field injection и публичные зависимости**\n\nСейчас:\n\n```java\n@Autowired\npublic OrderRepository orderRepository;\n```\n\nЛучше:\n\n```java\nprivate final OrderRepository orderRepository;\nprivate final PaymentClient paymentClient;\n\npublic OrderService(\n        OrderRepository orderRepository,\n        PaymentClient paymentClient\n) {\n    this.orderRepository = orderRepository;\n    this.paymentClient = paymentClient;\n}\n```\n\nЗависимости не должны быть публичным изменяемым состоянием объекта.\n\n---\n\n**2. Нет валидации входных данных**\n\nНужно проверить как минимум:\n\n- `request != null`;\n    \n- `userId != null`;\n    \n- `amount != null`;\n    \n- `amount > 0`.\n    \n\nДля REST DTO это обычно делается через Bean Validation:\n\n```java\npublic class CreateOrderRequest {\n\n    @NotNull\n    private Long userId;\n\n    @NotNull\n    @DecimalMin(value = \"0.01\")\n    private BigDecimal amount;\n}\n```\n\nи:\n\n```java\n@PostMapping\npublic CreateOrderResponse create(\n        @Valid @RequestBody CreateOrderRequest request\n) {\n    return orderService.createOrder(request);\n}\n```\n\n---\n\n**3. Для денег нельзя использовать `double`**\n\nЕсли `amount` имеет тип `double`, его лучше заменить на:\n\n```java\nBigDecimal\n```\n\nДенежные расчёты через `double` могут накапливать ошибки представления чисел с плавающей точкой.\n\n---\n\n**4. Магические строки статусов**\n\nВместо:\n\n```java\norder.setStatus(\"NEW\");\norder.setStatus(\"PAID\");\norder.setStatus(\"FAILED\");\n```\n\nлучше:\n\n```java\npublic enum OrderStatus {\n    NEW,\n    PAYMENT_PENDING,\n    PAID,\n    PAYMENT_DECLINED,\n    PAYMENT_ERROR\n}\n```\n\nи:\n\n```java\n@Enumerated(EnumType.STRING)\nprivate OrderStatus status;\n```\n\nПри этом полезно различать:\n\n```text\nPAYMENT_DECLINED\n```\n\nи:\n\n```text\nPAYMENT_ERROR\n```\n\n`false` от платёжной системы может означать отказ в оплате, а timeout или HTTP 500 не означают, что платёж точно не состоялся.\n\n---\n\n**5. Главная проблема — несколько независимых систем**\n\nМетод одновременно изменяет:\n\n```text\nPostgreSQL\nPayment Service\nKafka\n```\n\nОбычная:\n\n```java\n@Transactional\n```\n\nне способна сделать эти три операции одной атомарной транзакцией.\n\nНапример:\n\n```text\n1. Order NEW сохранён\n2. paymentClient.charge() успешно списал деньги\n3. обновление Order → PAID упало\n```\n\nПолучаем:\n\n```text\nденьги списаны\nOrder = NEW\n```\n\nЭто уже неконсистентное состояние.\n\n---\n\n**6. Просто добавить @Transactional на createOrder() — не решение**\n\nТакой вариант:\n\n```java\n@Transactional\npublic void createOrder(...) {\n    orderRepository.save(...);\n\n    paymentClient.charge(...);\n\n    ...\n}\n```\n\nне делает вызов платёжного сервиса частью JDBC-транзакции.\n\nЕсли после успешного:\n\n```java\npaymentClient.charge(...)\n```\n\nтранзакция откатится, платёж обратно автоматически не откатится.\n\nКроме того, мы будем держать DB connection и транзакцию открытыми, пока ждём сетевой ответ:\n\n```text\nBEGIN TRANSACTION\n      ↓\nINSERT\n      ↓\nHTTP payment call\n      ↓\nждём сеть...\n      ↓\nUPDATE\n      ↓\nCOMMIT\n```\n\nДля высоконагруженного приложения это нежелательно.\n\n---\n\n**7. Есть проблема DB + Kafka — dual write**\n\nСценарий:\n\n```text\nOrder → PAID\n        ↓\nCOMMIT в БД успешен\n        ↓\nKafka send падает\n```\n\nПолучаем:\n\n```text\nБД: PAID\nKafka: события нет\n```\n\nИ обратная проблема тоже возможна: событие может быть опубликовано, а последующее изменение состояния завершиться ошибкой.\n\nДля связи БД и Kafka обычно используют **Transactional Outbox**.\n\nВ одной DB-транзакции:\n\n```text\nUPDATE order\n+\nINSERT outbox_event\n+\nCOMMIT\n```\n\nПосле этого отдельный publisher читает outbox и отправляет события в Kafka.\n\n---\n\n**8. Outbox не решает проблему платежа**\n\nВажно разделять две проблемы.\n\nOutbox решает:\n\n```text\nDB ↔ Kafka\n```\n\nно не делает атомарными:\n\n```text\nDB ↔ Payment Service\n```\n\nДля платежей обычно нужны:\n\n- идемпотентный payment API;\n    \n- idempotency key;\n    \n- явные состояния заказа;\n    \n- retry;\n    \n- reconciliation;\n    \n- иногда compensation/refund;\n    \n- Saga / state machine для более сложного процесса.\n    \n\n---\n\n**9. Нет идемпотентности**\n\nПредставим:\n\n```text\nКлиент → createOrder()\n              ↓\n          платёж прошёл\n              ↓\n       ответ потерялся по сети\n```\n\nКлиент не знает результата и повторяет запрос:\n\n```text\ncreateOrder()\n```\n\nБез idempotency key можно:\n\n```text\nсоздать второй Order\n+\nсписать деньги второй раз\n```\n\nПоэтому запрос на создание заказа должен иметь уникальный ключ, например:\n\n```java\nprivate String idempotencyKey;\n```\n\nНа уровне БД для него желательно иметь `UNIQUE`.\n\nЭтот же идентификатор либо отдельный `paymentId` следует передавать платёжной системе, если она поддерживает идемпотентные запросы.\n\n---\n\n**10. Возвращать \"OK\" недостаточно**\n\nСейчас метод всегда завершает успешный сценарий так:\n\n```java\nreturn \"OK\";\n```\n\nДаже если:\n\n```java\npaid == false\n```\n\nклиент получает `\"OK\"`.\n\nЛучше вернуть DTO:\n\n```java\npublic record CreateOrderResponse(\n        Long orderId,\n        OrderStatus status\n) {\n}\n```\n\nНапример:\n\n```text\norderId = 123\nstatus = PAYMENT_PENDING\n```\n\nили итоговый статус, если API действительно синхронно ожидает оплату.\n\n---\n\n**11. OrderService делает слишком много**\n\nСейчас он одновременно:\n\n- создаёт `Order`;\n    \n- управляет persistence;\n    \n- вызывает payment service;\n    \n- определяет состояния;\n    \n- публикует Kafka event.\n    \n\nЭто нарушение SRP / Separation of Concerns.\n\nЛучше разделить:\n\n```text\nOrderService\n    → orchestration\n\nOrderRepository\n    → persistence\n\nPaymentService\n    → работа с PaymentClient\n\nOrderTransactionService\n    → локальные DB-транзакции\n\nOutboxService\n    → запись событий\n\nOutboxPublisher\n    → Kafka\n```\n\n---\n\nОдин из вариантов организации сценария:\n\n```java\n@Service\npublic class OrderService {\n\n    private final OrderTransactionService orderTxService;\n    private final PaymentService paymentService;\n\n    public OrderService(\n            OrderTransactionService orderTxService,\n            PaymentService paymentService\n    ) {\n        this.orderTxService = orderTxService;\n        this.paymentService = paymentService;\n    }\n\n    public CreateOrderResponse createOrder(\n            CreateOrderRequest request\n    ) {\n        Order order =\n                orderTxService.createPendingOrder(request);\n\n        try {\n            boolean paid = paymentService.charge(\n                    order.getId(),\n                    request.getUserId(),\n                    request.getAmount()\n            );\n\n            if (paid) {\n                orderTxService.markPaid(order.getId());\n\n                return new CreateOrderResponse(\n                        order.getId(),\n                        OrderStatus.PAID\n                );\n            }\n\n            orderTxService.markDeclined(order.getId());\n\n            return new CreateOrderResponse(\n                    order.getId(),\n                    OrderStatus.PAYMENT_DECLINED\n            );\n\n        } catch (Exception e) {\n            orderTxService.markPaymentError(\n                    order.getId()\n            );\n\n            throw e;\n        }\n    }\n}\n```\n\nЗдесь внешний вызов:\n\n```java\npaymentService.charge(...)\n```\n\nвыполняется **между короткими DB-транзакциями**, а не внутри одной длинной транзакции.\n\n---\n\nТранзакционный компонент:\n\n```java\n@Service\npublic class OrderTransactionService {\n\n    private final OrderRepository orderRepository;\n    private final OutboxRepository outboxRepository;\n\n    public OrderTransactionService(\n            OrderRepository orderRepository,\n            OutboxRepository outboxRepository\n    ) {\n        this.orderRepository = orderRepository;\n        this.outboxRepository = outboxRepository;\n    }\n\n    @Transactional\n    public Order createPendingOrder(\n            CreateOrderRequest request\n    ) {\n        Order order = new Order();\n\n        order.setUserId(request.getUserId());\n        order.setAmount(request.getAmount());\n        order.setStatus(\n                OrderStatus.PAYMENT_PENDING\n        );\n\n        return orderRepository.save(order);\n    }\n\n    @Transactional\n    public void markPaid(Long orderId) {\n        Order order = getOrder(orderId);\n\n        order.setStatus(OrderStatus.PAID);\n\n        outboxRepository.save(\n                OutboxEvent.orderPaid(orderId)\n        );\n    }\n\n    @Transactional\n    public void markDeclined(Long orderId) {\n        Order order = getOrder(orderId);\n\n        order.setStatus(\n                OrderStatus.PAYMENT_DECLINED\n        );\n\n        outboxRepository.save(\n                OutboxEvent.orderPaymentDeclined(orderId)\n        );\n    }\n\n    @Transactional\n    public void markPaymentError(Long orderId) {\n        Order order = getOrder(orderId);\n\n        order.setStatus(\n                OrderStatus.PAYMENT_ERROR\n        );\n\n        outboxRepository.save(\n                OutboxEvent.orderPaymentError(orderId)\n        );\n    }\n\n    private Order getOrder(Long orderId) {\n        return orderRepository.findById(orderId)\n                .orElseThrow(() ->\n                        new EntityNotFoundException(\n                                \"Order not found: \" + orderId\n                        )\n                );\n    }\n}\n```\n\nВнутри `markPaid()` не обязательно явно повторно вызывать:\n\n```java\norderRepository.save(order);\n```\n\nесли `Order` был загружен внутри текущего persistence context.\n\nJPA dirty checking сохранит изменение при flush/commit.\n\n---\n\nДля Kafka схема становится такой:\n\n```text\nmarkPaid()\n    │\n    ├── UPDATE orders\n    │\n    ├── INSERT outbox\n    │\n    └── COMMIT\n              ↓\n       OutboxPublisher\n              ↓\n            Kafka\n```\n\nЕсли Kafka временно недоступна, запись остаётся в outbox и может быть отправлена повторно.\n\nConsumer события тоже желательно делать идемпотентным, потому что delivery обычно проектируют как `at-least-once`.\n\n---\n\nОтдельно нужно продумать неопределённый результат платежа.\n\nНапример:\n\n```text\npaymentClient.charge()\n        ↓\ntimeout\n```\n\nМы не знаем наверняка:\n\n```text\nплатёж не прошёл\n```\n\nили:\n\n```text\nплатёж прошёл,\nно ответ не дошёл\n```\n\nПоэтому автоматически считать такой заказ:\n\n```text\nFAILED\n```\n\nопасно.\n\nЛучше состояние вроде:\n\n```text\nPAYMENT_ERROR\nPAYMENT_UNKNOWN\n```\n\nи последующая сверка статуса платежа по `paymentId`.\n\n---\n\nОсновные проблемы исходного решения:\n\n- public field injection;\n    \n- нет валидации;\n    \n- возможное использование `double` для денег;\n    \n- магические строки статусов;\n    \n- слабый контракт `\"OK\"`;\n    \n- нет обработки исключений `paymentClient`;\n    \n- `false` и техническая ошибка платежа не различаются;\n    \n- нет идемпотентности;\n    \n- возможен двойной платёж при retry;\n    \n- DB и payment service невозможно объединить обычным `@Transactional`;\n    \n- DB-транзакцию не стоит держать во время сетевого вызова;\n    \n- возможна потеря события между DB и Kafka;\n    \n- нужен Transactional Outbox для DB + Kafka;\n    \n- после успешного платежа и ошибки БД нужна стратегия восстановления;\n    \n- класс имеет слишком много ответственностей.\n    \n\nГлавная идея архитектуры:\n\n```text\nRequest\n   ↓\nсоздать PAYMENT_PENDING\n   ↓\nCOMMIT\n   ↓\nидемпотентный Payment API\n   ↓\nPAID / DECLINED / ERROR\n   ↓\nкороткая DB-транзакция:\nstatus + outbox\n   ↓\nCOMMIT\n   ↓\nKafka publisher\n```\n\nТо есть в таком сервисе важнее всего правильно организовать **согласованность между независимыми системами**, а не просто добавить `@Transactional` вокруг `createOrder()`.\n\n{{< /details >}}"
  filepath = "order-service-review3"

