  question = "Сделать рефакторинг сервиса создания заказа"
  answer = "**Условие задачи:**  \nДан `OrderService`, который создаёт заказ, проверяет наличие товаров, уменьшает остатки и применяет промокод.\n\nНеобходимо исправить ошибки, улучшить валидацию, читаемость и корректность работы при конкурентных заказах.\n\n**Код:**\n\n```java\n@Service\npublic class OrderService {\n\n    @Autowired\n    private OrderRepository orderRepository;\n\n    @Autowired\n    private ProductRepository productRepository;\n\n    public Order createOrder(String userId, List<Product> products, String promoCode) {\n        if (products.size() > 0) {\n            double total = 0;\n\n            for (int i = 0; i <= products.size(); i++) {\n                Integer stock = productRepository.findStockById(products.get(i).getId());\n\n                if (stock == null || stock <= 0) {\n                    throw new IllegalStateException(\n                            \"Product out of stock: \" + products.getId()\n                    );\n                }\n            }\n\n            for (int i = 0; i <= products.size(); i++) {\n                total += products.get(i).getPrice();\n                productRepository.updateStockById(products.get(i).getId(), 1);\n            }\n\n            if (promoCode == \"WELCOME10\") {\n                total = total * 0.9;\n            }\n\n            Order order = new Order();\n            order.setUserId(userId);\n            order.setTotal(total);\n            order.setStatus(\"new\");\n\n            System.out.println(\"Created order for user: \" + userId);\n\n            return orderRepository.save(order);\n        }\n\n        return null;\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `i <= products.size()` приводит к `IndexOutOfBoundsException`.  \n💡 `products.getId()` не компилируется.  \n💡 Строки нельзя сравнивать через `==`.  \n💡 Нужна проверка `userId`, `products` и элементов списка.  \n💡 Для денег лучше `BigDecimal`.  \n💡 Проверка остатка и его последующее изменение должны быть атомарными.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновные проблемы:\n\n- field injection вместо constructor injection;\n    \n- `products == null` не проверяется;\n    \n- условие `i <= products.size()` ошибочно;\n    \n- `products.getId()` не существует;\n    \n- `promoCode == \"WELCOME10\"` сравнивает ссылки;\n    \n- `return null` — плохой контракт;\n    \n- `double` нежелателен для денег;\n    \n- `\"new\"` лучше заменить на `enum`;\n    \n- `System.out.println()` лучше заменить логгером;\n    \n- нет транзакции;\n    \n- схема `SELECT stock → UPDATE stock` допускает overselling при параллельных заказах;\n    \n- если `Product` пришёл от клиента, нельзя доверять его `price` — цену следует получать из БД.\n    \n\nДля остатков лучше сделать атомарное обновление:\n\n```java\npublic interface ProductRepository\n        extends JpaRepository<Product, Long> {\n\n    @Modifying\n    @Query(\"\"\"\n            update Product p\n               set p.stock = p.stock - 1\n             where p.id = :productId\n               and p.stock > 0\n            \"\"\")\n    int decreaseStock(@Param(\"productId\") Long productId);\n}\n```\n\nСервис:\n\n```java\n@Service\npublic class OrderService {\n\n    private static final String WELCOME10 = \"WELCOME10\";\n    private static final BigDecimal DISCOUNT =\n            new BigDecimal(\"0.90\");\n\n    private final OrderRepository orderRepository;\n    private final ProductRepository productRepository;\n\n    public OrderService(\n            OrderRepository orderRepository,\n            ProductRepository productRepository\n    ) {\n        this.orderRepository = orderRepository;\n        this.productRepository = productRepository;\n    }\n\n    @Transactional\n    public Order createOrder(\n            String userId,\n            List<Product> products,\n            String promoCode\n    ) {\n        validate(userId, products);\n\n        BigDecimal total = BigDecimal.ZERO;\n\n        for (Product requestedProduct : products) {\n            Long productId = requestedProduct.getId();\n\n            Product product = productRepository.findById(productId)\n                    .orElseThrow(() ->\n                            new IllegalArgumentException(\n                                    \"Product not found: \" + productId\n                            )\n                    );\n\n            if (productRepository.decreaseStock(productId) != 1) {\n                throw new IllegalStateException(\n                        \"Product out of stock: \" + productId\n                );\n            }\n\n            total = total.add(product.getPrice());\n        }\n\n        if (WELCOME10.equals(promoCode)) {\n            total = total.multiply(DISCOUNT);\n        }\n\n        Order order = new Order();\n        order.setUserId(userId);\n        order.setTotal(total);\n        order.setStatus(OrderStatus.NEW);\n\n        return orderRepository.save(order);\n    }\n\n    private void validate(\n            String userId,\n            List<Product> products\n    ) {\n        if (userId == null || userId.isBlank()) {\n            throw new IllegalArgumentException(\n                    \"userId must not be blank\"\n            );\n        }\n\n        if (products == null || products.isEmpty()) {\n            throw new IllegalArgumentException(\n                    \"products must not be empty\"\n            );\n        }\n\n        if (products.stream().anyMatch(\n                p -> p == null || p.getId() == null\n        )) {\n            throw new IllegalArgumentException(\n                    \"product id must not be null\"\n            );\n        }\n    }\n}\n```\n\n`@Transactional` здесь нужен, чтобы уменьшение остатков всех товаров и сохранение заказа были одной операцией: если один товар закончился или `save()` упал, предыдущие изменения остатков откатятся.\n\nПри этом сама конкурентная корректность обеспечивается не `@Transactional`, а условным атомарным:\n\n```sql\nUPDATE product\nSET stock = stock - 1\nWHERE id = ?\n  AND stock > 0\n```\n\nЭто не позволяет двум параллельным заказам списать один последний экземпляр товара.\n\n{{< /details >}}"
  filepath = "order-service-refactor"

