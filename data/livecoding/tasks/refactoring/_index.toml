  id = 21
  question = "Сделать ревью кода AccountResource и BalanceService"
  answer = "**Условие задачи:**  \n📌 Дан код для создания банковских счетов, поиска по номеру счёта и изменения баланса. Нужно провести code review: найти ошибки, риски и предложить улучшения.\n\n**Код:**\n\n```java\n@Data\n@Entity\npublic class Account {\n\n    @Id\n    private Long id;\n\n    private String accountNumber;\n    private String bic;\n    private Double amount;\n}\n\npublic interface AccountRepository\n        extends JpaRepository<Account, Long> {\n\n    List<Account> findByAccountNumber(String accountNumber);\n}\n\n@RestController\n@RequiredArgsConstructor\npublic class AccountResource {\n\n    private final AccountRepository accountRepository;\n    private final BalanceService balanceService;\n\n    @GetMapping(\n            value = \"/accounts/add\",\n            produces = MediaType.APPLICATION_JSON_VALUE\n    )\n    Account add(Account account) {\n        return accountRepository.save(account);\n    }\n\n    @GetMapping(\n            value = \"/accounts/{accountNumber}\",\n            produces = MediaType.APPLICATION_JSON_VALUE\n    )\n    List<Account> findByAccountNumber(\n            @PathVariable(\"accountNumber\") String accountNumber\n    ) {\n        return accountRepository.findByAccountNumber(accountNumber);\n    }\n\n    @PutMapping(\n            value = \"/accounts/{id}/change\",\n            produces = MediaType.APPLICATION_JSON_VALUE\n    )\n    Account changeBalance(\n            @PathVariable(\"id\") Long id,\n            @RequestParam(\"diff\") Double diff\n    ) {\n        return balanceService.change(id, diff);\n    }\n}\n\n@Service\npublic class BalanceService {\n\n    @Autowired\n    AccountRepository accountRepository;\n\n    public Account change(Long id, Double diff) {\n        Account account = accountRepository.getOne(id);\n        account.setAmount(account.getAmount() + diff);\n        return accountRepository.save(account);\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Создание сущности не должно выполняться через `GET`.  \n💡 Не стоит принимать и возвращать JPA entity напрямую.  \n💡 Для денежных значений нужен `BigDecimal`, а не `Double`.  \n💡 Field injection лучше заменить на constructor injection.  \n💡 Изменение баланса должно выполняться в транзакции.  \n💡 `getOne()` устарел и может вернуть ленивую proxy-ссылку.  \n💡 Одновременные запросы могут привести к потере обновления.  \n💡 Нужны валидация, обработка `404` и ограничения на уровне БД.  \n💡 `@Data` на JPA entity может быть опасен.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВ коде хорошо то, что контроллер отделён от сервиса, используется Spring Data JPA и constructor injection в контроллере.\n\nНо есть несколько проблем.\n\n1. **Создание счёта выполняется через `GET`**\n    \n\n```java\n@GetMapping(\"/accounts/add\")\n```\n\n`GET` должен только получать данные. Для создания ресурса нужен `POST`.\n\n2. **Entity используется как входной и выходной DTO**\n    \n\n```java\nAccount add(Account account)\n```\n\nЭто позволяет клиенту передавать внутренние поля сущности и связывает API со структурой базы данных. Лучше использовать отдельные request/response DTO.\n\n3. **`Double` используется для денег**\n    \n\n```java\nprivate Double amount;\n```\n\nДля денежных значений следует использовать `BigDecimal`, чтобы избежать ошибок точности.\n\n4. **Field injection в сервисе**\n    \n\n```java\n@Autowired\nAccountRepository accountRepository;\n```\n\nЛучше использовать `private final` и constructor injection.\n\n5. **Нет транзакции**\n    \n\nИзменение баланса состоит из чтения и записи, поэтому метод должен быть помечен `@Transactional`.\n\n6. **Используется `getOne()`**\n    \n\n```java\naccountRepository.getOne(id);\n```\n\nМетод устарел и возвращает proxy. Лучше использовать `findById()` и выбрасывать понятное исключение, если счёт не найден.\n\n7. **Потеря обновления**\n    \n\nДва параллельных запроса могут прочитать одинаковый баланс и перезаписать изменения друг друга.\n\nДля защиты можно использовать optimistic locking через `@Version`, pessimistic lock или атомарный SQL-запрос.\n\n8. **Нет валидации**\n    \n\nНе проверяются:\n\n- номер счёта;\n    \n- БИК;\n    \n- начальный баланс;\n    \n- `id`;\n    \n- значение `diff`;\n    \n- возможность получить отрицательный баланс.\n    \n\n9. **`@Data` на JPA entity**\n    \n\n`@Data` генерирует `equals()`, `hashCode()` и `toString()` по всем полям. Для JPA entity это может создавать проблемы. Безопаснее использовать `@Getter` и `@Setter`.\n\n---\n\nИсправленный базовый вариант:\n\n```java\n@Entity\n@Table(\n        name = \"accounts\",\n        uniqueConstraints = @UniqueConstraint(\n                columnNames = \"account_number\"\n        )\n)\n@Getter\n@Setter\n@NoArgsConstructor\npublic class Account {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(name = \"account_number\", nullable = false)\n    private String accountNumber;\n\n    @Column(nullable = false)\n    private String bic;\n\n    @Column(nullable = false, precision = 19, scale = 2)\n    private BigDecimal amount;\n\n    @Version\n    private Long version;\n}\n```\n\n```java\npublic interface AccountRepository\n        extends JpaRepository<Account, Long> {\n\n    Optional<Account> findByAccountNumber(String accountNumber);\n}\n```\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class BalanceService {\n\n    private final AccountRepository accountRepository;\n\n    @Transactional\n    public Account change(Long id, BigDecimal diff) {\n        if (id == null || diff == null) {\n            throw new IllegalArgumentException(\n                    \"id and diff must not be null\"\n            );\n        }\n\n        Account account = accountRepository.findById(id)\n                .orElseThrow(() ->\n                        new IllegalArgumentException(\n                                \"Account not found: \" + id\n                        )\n                );\n\n        BigDecimal newAmount = account.getAmount().add(diff);\n\n        if (newAmount.signum() < 0) {\n            throw new IllegalStateException(\n                    \"Account balance cannot be negative\"\n            );\n        }\n\n        account.setAmount(newAmount);\n        return account;\n    }\n}\n```\n\n```java\n@RestController\n@RequestMapping(\"/accounts\")\n@RequiredArgsConstructor\npublic class AccountResource {\n\n    private final AccountRepository accountRepository;\n    private final BalanceService balanceService;\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public Account create(@RequestBody Account account) {\n        return accountRepository.save(account);\n    }\n\n    @GetMapping(\"/{accountNumber}\")\n    public Account findByAccountNumber(\n            @PathVariable String accountNumber\n    ) {\n        return accountRepository\n                .findByAccountNumber(accountNumber)\n                .orElseThrow(() ->\n                        new ResponseStatusException(\n                                HttpStatus.NOT_FOUND,\n                                \"Account not found\"\n                        )\n                );\n    }\n\n    @PatchMapping(\"/{id}/balance\")\n    public Account changeBalance(\n            @PathVariable Long id,\n            @RequestParam BigDecimal diff\n    ) {\n        return balanceService.change(id, diff);\n    }\n}\n```\n\nДаже в этом варианте лучше заменить entity в API на DTO, добавить Bean Validation и глобальный обработчик исключений через `@RestControllerAdvice`.\n\n **Что я бы сказал на собеседовании 🎯**\n\n> Основные проблемы — создание сущности через `GET`, использование JPA entity в API, `Double` для денег, field injection и отсутствие транзакции при изменении баланса. Также есть риск lost update при параллельных запросах. Я бы использовал `POST`, DTO, `BigDecimal`, constructor injection, `@Transactional`, обработку отсутствующего счёта и optimistic locking через `@Version`.\n\n{{< /details >}}"
  filepath = "account-balance-review"

