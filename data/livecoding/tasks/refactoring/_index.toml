  id = 24
  question = "Оптимизировать поиск товаров по фильтру"
  answer = "**Условие задачи:**  \nПользователь интернет-магазина задаёт несколько фильтров для поиска товаров. Метод `find(Filter filter)` сначала выполняет запрос на подсчёт подходящих товаров и только при ненулевом результате загружает сами товары.\n\nМетод вызывается около 200 раз в секунду, при этом примерно в 50% случаев подходящих товаров нет.\n\nНужно провести code review метода и предложить более эффективную реализацию с меньшей нагрузкой на БД.\n\n**Код:**\n\n```java\nclass Service {\n    //200 RPS\n    //50% count = 0\n    \n    public List<Product> find(Filter filter) {\n        int count = repo.count(filter);\n        if(count > 0) {\n            return repo.find(filter);\n        }\n        return new ArrayList<>();\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Подумай, нужен ли предварительный `count()`, если после него всё равно требуется получить товары.  \n💡 Посчитай реальное количество запросов к БД при 200 RPS и 50% пустых результатов.  \n💡 Сам запрос поиска может вернуть пустой список.  \n💡 Для большого количества результатов стоит подумать о пагинации.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- выполняется лишний запрос `count()`;\n    \n- при наличии товаров выполняются два запроса: `COUNT` и `SELECT`;\n    \n- при 200 RPS получается около 300 запросов к БД в секунду вместо 200;\n    \n- между `count()` и `find()` данные могут измениться;\n    \n- создание `new ArrayList<>()` для пустого результата не требуется;\n    \n- при большом количестве найденных товаров отсутствует пагинация;\n    \n- производительность поиска зависит от SQL и индексов по полям фильтрации.\n    \n\n**Как лучше исправить**\n\nЕсли нужен список товаров, предварительный подсчёт вообще не требуется:\n\n```java\nclass Service {\n\n    public List<Product> find(Filter filter) {\n        return repo.find(filter);\n    }\n}\n```\n\nРепозиторий должен вернуть пустой список, если товаров нет. Дополнительная проверка `isEmpty()` тоже не нужна.\n\nПри текущем подходе нагрузка выглядит так:\n\n```text\n200 COUNT-запросов\n+ 100 SELECT-запросов\n= 300 запросов/сек\n```\n\nПосле удаления `count()` останется один запрос на каждый вызов метода — около 200 запросов в секунду.\n\nЕсли результатов может быть много, лучше добавить пагинацию:\n\n```java\npublic Slice<Product> find(\n        Filter filter,\n        Pageable pageable\n) {\n    return repo.find(filter, pageable);\n}\n```\n\nЕсли общее количество найденных товаров не требуется, `Slice` обычно предпочтительнее `Page`, поскольку для `Page` требуется знать общее число результатов и часто выполняется дополнительный `COUNT(*)`.\n\nКэширование можно рассматривать только если одинаковые фильтры часто повторяются и допустима некоторая устарелость данных. Добавлять кэш только потому, что половина запросов возвращает пустой результат, недостаточно.\n\nДля сложных фильтров также нужно проверить фактический SQL и подобрать индексы под наиболее часто используемые условия.\n\nГлавное исправление — **убрать предварительный `count()` и сразу получать товары одним запросом**.\n\n{{< /details >}}"
  filepath = "find-products-review"

[[tasks]]
  id = 25
  question = "Исправить синхронизацию критической секции между потоками"
  answer = "**Условие задачи:**  \nДан сервис, метод которого одновременно вызывается из двух потоков. Часть метода является критической секцией и должна выполняться только одним потоком в каждый момент времени.\n\nНужно провести code review, найти ошибки в запуске потоков и синхронизации, а затем предложить корректный вариант реализации.\n\n**Код:**\n\n```java\nclass Main{\nvoid main(){\n    execute(()->new Service.doSome());\n    execute(()->new Service.doSome());\n}\n}\n\nclass Service{\n    void doSome(){\n        Object obj = new Object();\n        //code\n        synchronized(obj){\n            //code\n        }\n        //code\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для взаимного исключения оба потока должны синхронизироваться на одном и том же объекте.  \n💡 Проверь, где создаётся объект-монитор.  \n💡 Если используется монитор экземпляра сервиса, оба потока должны работать с одним экземпляром `Service`.  \n💡 Проверь синтаксис создания объекта и вызова `doSome()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- `Object obj = new Object()` создаётся при каждом вызове, поэтому потоки получают разные мониторы;\n    \n- критическая секция фактически не защищена от параллельного выполнения;\n    \n- `new Service.doSome()` — некорректный вызов конструктора и метода;\n    \n- если каждый поток создаст собственный `Service`, синхронизация на поле экземпляра или `this` тоже не поможет;\n    \n- блокировать весь `doSome()` необязательно, если защищать нужно только небольшую критическую секцию.\n    \n\n**Как лучше исправить**\n\nСоздать один объект `Service` и один общий монитор внутри него:\n\n```java\nclass Main {\n\n    public static void main(String[] args) {\n        Service service = new Service();\n\n        execute(service::doSome);\n        execute(service::doSome);\n    }\n\n    static void execute(Runnable runnable) {\n        new Thread(runnable).start();\n    }\n}\n\nclass Service {\n\n    private final Object lock = new Object();\n\n    void doSome() {\n        // code\n\n        synchronized (lock) {\n            // critical section\n        }\n\n        // code\n    }\n}\n```\n\nОба потока вызывают метод одного экземпляра `Service`, поэтому используют один и тот же `lock`. В критическую секцию одновременно сможет войти только один поток.\n\nЕсли вся критическая логика вынесена в отдельный метод, можно синхронизироваться на `this`:\n\n```java\nclass Service {\n\n    void doSome() {\n        // code\n        critical();\n        // code\n    }\n\n    private synchronized void critical() {\n        // critical section\n    }\n}\n```\n\nТакой вариант также работает, пока оба потока используют **один экземпляр `Service`**.\n\nВажно: `synchronized` обеспечивает синхронизацию только внутри одной JVM. Если приложение работает в нескольких экземплярах, для общей внешней критической секции потребуется другой механизм — например, блокировка на уровне БД или распределённый lock.\n\n{{< /details >}}"
  filepath = "sync-critical-section"

[[tasks]]
  id = 26
  question = "Отрефакторить in-memory UserService"
  answer = "**Условие задачи:**  \nДан Spring-сервис, который хранит пользователей в памяти приложения и используется одновременно из контроллеров и других сервисов.\n\nНужно провести code review и предложить более безопасную реализацию для работы под нагрузкой: проверить потокобезопасность, контракты методов, работу с изменяемыми объектами и ограничения in-memory хранения.\n\n**Код:**\n\n```java\n@Service\npublic class UserService {\n    private Map<Integer, User> usersCache = new HashMap<>();\n\n    public void addUser(User user) {\n        usersCache.put(user.getId(), user);\n    }\n\n    public User getUser(int id) {\n        return usersCache.get(id);\n    }\n\n    public List<User> getAllUsers() {\n        return new ArrayList<>(usersCache.values());\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `UserService` — singleton, поэтому к коллекции могут одновременно обращаться несколько потоков.  \n💡 Потокобезопасная коллекция ещё не делает потокобезопасными объекты, которые в ней хранятся.  \n💡 Определи поведение при добавлении пользователя с уже существующим `id`.  \n💡 Подумай, что произойдёт с данными после рестарта или при запуске нескольких экземпляров приложения.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- `HashMap` не потокобезопасен для конкурентного чтения и записи;\n    \n- поле хранилища лучше сделать `final`;\n    \n- нет проверки `user` и его `id`;\n    \n- `put()` молча перезаписывает пользователя с тем же `id`;\n    \n- `getUser()` возвращает `null`, если пользователь не найден;\n    \n- если `User` изменяемый, внешний код может изменить объект в обход `UserService`;\n    \n- даже с `ConcurrentHashMap` изменяемый `User` сам по себе не становится потокобезопасным;\n    \n- `getAllUsers()` не гарантирует атомарный снимок состояния при одновременных изменениях;\n    \n- данные теряются при перезапуске приложения;\n    \n- в нескольких экземплярах приложения у каждого будет собственный набор пользователей.\n    \n\n**Как лучше исправить**\n\nЕсли это действительно локальное in-memory хранилище, можно использовать `ConcurrentHashMap` и явно определить поведение при дубликатах:\n\n```java\n@Service\npublic class UserService {\n\n    private final ConcurrentMap<Integer, User> users =\n            new ConcurrentHashMap<>();\n\n    public User create(User user) {\n        validate(user);\n\n        User previous = users.putIfAbsent(\n                user.getId(),\n                user\n        );\n\n        if (previous != null) {\n            throw new IllegalStateException(\n                    \"User already exists: \" + user.getId()\n            );\n        }\n\n        return user;\n    }\n\n    public Optional<User> getUser(int id) {\n        return Optional.ofNullable(users.get(id));\n    }\n\n    public List<User> getAllUsers() {\n        return List.copyOf(users.values());\n    }\n\n    public boolean deleteUser(int id) {\n        return users.remove(id) != null;\n    }\n\n    private void validate(User user) {\n        if (user == null || user.getId() == null) {\n            throw new IllegalArgumentException(\n                    \"User and user.id must not be null\"\n            );\n        }\n    }\n}\n```\n\n`List.copyOf()` защищает сам возвращаемый список от изменений, но не делает элементы внутри него immutable. Поэтому для безопасного API лучше хранить неизменяемые объекты или возвращать DTO-копии.\n\nТакже важно понимать границы решения: `ConcurrentHashMap` подходит для локального кэша или временного хранилища, но не для постоянного хранения пользователей. При рестарте данные исчезнут, а при нескольких pod'ах состояние будет различаться. Для общего состояния нужен внешний storage, например БД или распределённый кэш.\n\n{{< /details >}}"
  filepath = "inmemory-user-service-review"

[[tasks]]
  id = 27
  question = "Разделить внешний HTTP-вызов и транзакцию БД"
  answer = "**Условие задачи:**  \nДан Spring-сервис, который сначала выполняет внешний HTTP-запрос, а затем сохраняет полученный результат в базу данных. Весь метод помечен `@Transactional`.\n\nНужно провести code review: оценить корректность транзакционной границы, обработку ошибок внешнего сервиса и возможные проблемы согласованности между HTTP-вызовом и записью в БД.\n\n**Код:**\n\n```java\n@Service\npublic class RestClient {\n\n    @Transactional\n    public void doWork() {\n        var obj = restTemplate.postForObject(...);\n        dbService.saveObj(obj);\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Не стоит держать транзакцию БД открытой во время сетевого вызова.  \n💡 Транзакция БД не может откатить уже выполненный HTTP-запрос.  \n💡 Для HTTP-клиента нужны таймауты и понятная стратегия обработки ошибок.  \n💡 Если вынести `@Transactional` в другой метод того же класса, вспомни про self-invocation Spring AOP.  \n💡 При retry важно продумать идемпотентность внешней операции.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- транзакция охватывает внешний HTTP-вызов и может оставаться открытой значительно дольше необходимого;\n    \n- скорость транзакции начинает зависеть от внешнего сервиса;\n    \n- сетевой timeout увеличивает время жизни транзакции;\n    \n- транзакция БД не обеспечивает атомарность между БД и внешним HTTP-сервисом;\n    \n- если HTTP-вызов успешен, а сохранение в БД упало, внешний эффект уже нельзя откатить;\n    \n- не показаны connect/read timeout для HTTP-клиента;\n    \n- не определена обработка `4xx`, `5xx`, сетевых ошибок и timeout;\n    \n- без идемпотентности retry для `POST` может повторить внешнюю операцию;\n    \n- `null` или некорректный ответ внешнего сервиса нужно валидировать.\n    \n\n**Как лучше исправить**\n\nВнешний вызов выполнить без транзакции, а транзакцию оставить только на операции с БД.\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class RestClient {\n\n    private final RemoteClient remoteClient;\n    private final DbService dbService;\n\n    public void doWork() {\n        ResponseDto response = remoteClient.call();\n        dbService.saveObj(response);\n    }\n}\n```\n\nТранзакционную границу можно разместить в отдельном Spring-бине:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class DbService {\n\n    private final ObjRepository repository;\n\n    @Transactional\n    public void saveObj(ResponseDto response) {\n        if (response == null) {\n            throw new IllegalArgumentException(\n                    \"Response must not be null\"\n            );\n        }\n\n        repository.save(map(response));\n    }\n}\n```\n\nЭто важно: вариант\n\n```java\npublic void doWork() {\n    ResponseDto response = callRemote();\n    save(response);\n}\n\n@Transactional\nvoid save(ResponseDto response) {\n    ...\n}\n```\n\nв том же классе обычно не даст ожидаемой транзакции, потому что внутренний вызов `save()` обходит Spring proxy.\n\nДля HTTP-клиента обязательно задать разумные connect/read timeout и отдельно обрабатывать сетевые ошибки и HTTP-ошибки.\n\nЕсли внешний `POST` изменяет состояние, нужно учитывать сценарий:\n\n```text\nHTTP успешно выполнен\n        ↓\nсохранение в БД завершилось ошибкой\n        ↓\ndoWork() запускается повторно\n        ↓\nHTTP-операция может выполниться второй раз\n```\n\nПоэтому для повторов нужен идемпотентный контракт внешнего API. Если используется `Idempotency-Key`, один и тот же логический запрос должен повторяться **с тем же ключом** — генерация нового UUID на каждую попытку проблему не решает.\n\nГлавная идея — **не пытаться объединить HTTP и БД одной `@Transactional`: внешний вызов выполняется отдельно, а работа с БД помещается в короткую локальную транзакцию**.\n\n{{< /details >}}"
  filepath = "code-review-transactional-http-call"

[[tasks]]
  id = 28
  question = "Провести ревью PaymentService и исправить перевод между счетами  "
  answer = "**Условие задачи:**  \nДан сервис перевода денег между двумя счетами. Метод должен получить счета из БД, изменить их балансы и отправить уведомления владельцам.\n\nНужно провести code review: найти ошибки компиляции и логики, проверить Dependency Injection и транзакционность операции, а также предложить исправленный вариант с сохранением общей структуры сервиса.\n\n**Код:**\n\n```java\n@Component\npublic class PaymentService{\n\n    @Autowired\n    private ComissionServiceImpl comissionService;\n\n    private NotificationService notificationService = new NotificationServiceImpl();\n\n    @Autowired\n    private AccountRepository accountRepository;\n\n    public void makePayment(AccountDto acc1, AccountDto acc2, Integer moneyAmount){\n        System.out.println(\"\"Start payment\"\");\n        var account1 = accountRepository.findById(acc1.getAccountId());\n        var account2 = accountRepository.findById(acc1.getAccountId());\n        transfer(account1, account2, moneyAmount);\n        notificationService.sendNotification(account1.getAccountId());\n        notificationService.sendNotification(account2.getAccountId());\n        System.out.println(\"\"End payment\"\");\n    }\n\n    @Transactional\n    public void transfer(Account acc1, Account acc2, Integer moneyAmount){\n        account1.setMoneyAmount(account1.getMoneyAmount() - moneyAmount);\n        account2.setMoneyAmount(account2.getMoneyAmount() + moneyAmount);\n    }\n\n}\n\npublic class AccountDto {\n    private UUID accountId;\n    private Integer moneyAmount;\n}\n\n@Entity\n@Table\npublic class Account{\n\n    @Id\n    private UUID accountId;\n    private Integer moneyAmount;\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Проверь, какой тип возвращает `findById()`.  \n💡 Обрати внимание, какой `accountId` используется при загрузке второго счёта.  \n💡 `@Transactional` вызывается через Spring proxy — внутренний вызов метода имеет значение.  \n💡 Для всех зависимостей лучше использовать один способ DI.  \n💡 Подумай, что произойдёт при двух одновременных переводах с одного счёта.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- смешаны field injection и ручное создание зависимости через `new`;\n    \n- сервис зависит от конкретного `ComissionServiceImpl`, а не от интерфейса;\n    \n- `comissionService` вообще не используется;\n    \n- при загрузке второго счёта ошибочно используется `acc1.getAccountId()`;\n    \n- Spring Data `findById()` возвращает `Optional<Account>`, а код работает с результатом как с `Account`;\n    \n- в `transfer()` используются переменные `account1` и `account2`, которых в этом методе нет;\n    \n- `@Transactional` на `transfer()` не сработает при вызове из `makePayment()` того же объекта;\n    \n- нет проверки входных DTO, идентификаторов и суммы;\n    \n- не проверяется достаточность средств;\n    \n- не обработан перевод на тот же счёт;\n    \n- конкурентные переводы могут привести к lost update;\n    \n- уведомления нельзя считать частью транзакции БД: они могут уйти до commit;\n    \n- `System.out.println()` лучше заменить логгером;\n    \n- `AccountDto.moneyAmount` для команды перевода не нужен, если сумма передаётся отдельным параметром.\n    \n\n**Как лучше исправить**\n\nТранзакционную операцию с БД лучше вынести в отдельный сервис. Это одновременно решает проблему self-invocation и позволяет не держать отправку уведомлений внутри транзакции.\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class PaymentService {\n\n    private final PaymentTransactionService transactionService;\n    private final NotificationService notificationService;\n\n    public void makePayment(\n            AccountDto from,\n            AccountDto to,\n            Integer amount\n    ) {\n        if (from == null || to == null\n                || from.getAccountId() == null\n                || to.getAccountId() == null) {\n            throw new IllegalArgumentException(\n                    \"Accounts must be specified\"\n            );\n        }\n\n        if (amount == null || amount <= 0) {\n            throw new IllegalArgumentException(\n                    \"Amount must be positive\"\n            );\n        }\n\n        if (from.getAccountId().equals(to.getAccountId())) {\n            throw new IllegalArgumentException(\n                    \"Accounts must be different\"\n            );\n        }\n\n        transactionService.transfer(\n                from.getAccountId(),\n                to.getAccountId(),\n                amount\n        );\n\n        notificationService.sendNotification(\n                from.getAccountId()\n        );\n        notificationService.sendNotification(\n                to.getAccountId()\n        );\n    }\n}\n```\n\nТранзакционная часть:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class PaymentTransactionService {\n\n    private final AccountRepository accountRepository;\n\n    @Transactional\n    public void transfer(\n            UUID fromId,\n            UUID toId,\n            Integer amount\n    ) {\n        Account from = accountRepository.findById(fromId)\n                .orElseThrow(() ->\n                        new EntityNotFoundException(\n                                \"Account not found: \" + fromId\n                        )\n                );\n\n        Account to = accountRepository.findById(toId)\n                .orElseThrow(() ->\n                        new EntityNotFoundException(\n                                \"Account not found: \" + toId\n                        )\n                );\n\n        if (from.getMoneyAmount() < amount) {\n            throw new IllegalStateException(\n                    \"Insufficient funds\"\n            );\n        }\n\n        from.setMoneyAmount(\n                from.getMoneyAmount() - amount\n        );\n\n        to.setMoneyAmount(\n                to.getMoneyAmount() + amount\n        );\n    }\n}\n```\n\nТак как `Account` загружены внутри транзакции и остаются managed entity, отдельный `save()` обычно не требуется — изменения будут сохранены через dirty checking.\n\nПри реальных конкурентных переводах одной `@Transactional` недостаточно. Два запроса могут одновременно прочитать один баланс и потерять обновление. Для банковского сценария нужна стратегия конкурентного доступа: например, pessimistic locking с одинаковым порядком блокировки счетов либо optimistic locking через `@Version` и retry.\n\nУведомление также лучше отправлять только **после успешного commit** — через `@TransactionalEventListener(AFTER_COMMIT)` или outbox, если требуется надёжная доставка.\n\nДля денежных значений тип должен соответствовать модели хранения: если `Integer` означает минимальные денежные единицы, например копейки, это допустимо; если хранятся дробные суммы, нужен `BigDecimal`.\n\n{{< /details >}}"
  filepath = "payment-service-code-review"

[[tasks]]
  id = 29
  question = "Провести ревью системы расчёта зарплат"
  answer = "**Условие задачи:**  \nДан унаследованный класс `PayrollSystem`, который рассчитывает зарплаты сотрудников. Данные поступают из внешней системы в виде `List<Map<String, Object>>`, и изменить формат входных данных нельзя.\n\nБухгалтерия сообщает о нескольких проблемах: некоторые сотрудники пропадают из отчёта, иногда появляются отрицательные зарплаты, изменения оклада применяются не всегда, денежные суммы имеют слишком много знаков после запятой, а ошибки во входных данных проходят без понятного объяснения.\n\nНужно провести code review, предложить исправления и определить, какие бизнес-требования необходимо уточнить перед изменением поведения системы.\n\n**Код:**\n\n```java\npublic class PayrollSystem {\nstatic List<Map<String, Object>> employees = new ArrayList<>();\n\nstatic {\nMap<String, Object> emp1 = new HashMap<>();\nemp1.put(\"id\", 1);\nemp1.put(\"name\", \"Иванов\");\nemp1.put(\"base_salary\", 40000);\nemp1.put(\"bonus\", 10000);\nemp1.put(\"tax_rate\", 0.13);\nemployees.add(emp1);\n\nMap<String, Object> emp2 = new HashMap<>();\nemp2.put(\"id\", 2);\nemp2.put(\"name\", \"Петрова\");\nemp2.put(\"base_salary\", 50000.54);\nemp2.put(\"bonus\", 6000);\nemp2.put(\"tax_rate\", 0.13);\nemployees.add(emp2);\n\nMap<String, Object> emp3 = new HashMap<>();\nemp3.put(\"id\", 3);\nemp3.put(\"name\", \"Сидоров\");\nemp3.put(\"base_salary\", 30000.25);\nemp3.put(\"bonus\", null);\nemp3.put(\"tax_rate\", 0.13);\nemployees.add(emp3);\n\nMap<String, Object> emp4 = new HashMap<>();\nemp4.put(\"id\", 4);\nemp4.put(\"name\", \"Кузнецов\");\nemp4.put(\"base_salary\", 70000);\nemp4.put(\"bonus\", 20000.30);\nemp4.put(\"tax_rate\", 0.15);\nemployees.add(emp4);\n}\n\nstatic double calculateSalary(Map<String, Object> employee) {\ndouble baseSalary = ((Number) employee.get(\"base_salary\")).doubleValue();\ndouble bonus = ((Number) employee.get(\"bonus\")).doubleValue();\ndouble total = baseSalary + bonus;\ndouble tax = ((Number) employee.get(\"tax_rate\")).doubleValue();\ntotal = total - total * tax;\nreturn total;\n}\n\nstatic List<Map<String, Object>> generatePayroll() {\nList<Map<String, Object>> payroll = new ArrayList<>();\nfor (Map<String, Object> emp : employees) {\ntry {\ndouble netSalary = calculateSalary(emp);\nMap<String, Object> entry = new HashMap<>();\nentry.put(\"name\", emp.get(\"name\"));\nentry.put(\"salary\", netSalary);\npayroll.add(entry);\n} catch (Exception e) {\ncontinue;\n}\n}\nreturn payroll;\n}\n\nstatic void printPayroll() {\nList<Map<String, Object>> payroll = generatePayroll();\nfor (Map<String, Object> p : payroll) {\nSystem.out.println(p.get(\"name\") + \": \" + p.get(\"salary\") + \" руб.\");\n}\n}\n\nstatic void updateBaseSalary(int employeeId, double newSalary) {\nfor (Map<String, Object> emp : employees) {\nif ((int) emp.get(\"id\") == employeeId) {\nemp.put(\"base_salary\", newSalary);\nbreak;\n}\n}\n}\n\npublic static void main(String[] args) {\nSystem.out.println(\"Расчет зарплат:\");\nprintPayroll();\n}\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Посмотри, что происходит с сотрудником при любом исключении во время расчёта.  \n💡 `bonus` уже в примере может быть `null`.  \n💡 `Map<String, Object>` позволяет получить значение неожиданного типа.  \n💡 Для денежных расчётов лучше использовать `BigDecimal`.  \n💡 Подумай, где на самом деле должны храниться изменения оклада.  \n💡 Не все требования к отрицательным суммам и округлению можно определить только по коду.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- `catch (Exception)` полностью скрывает ошибки и просто удаляет сотрудника из ведомости;\n    \n- `bonus == null` приводит к `NullPointerException`;\n    \n- неправильный тип поля приводит к `ClassCastException`;\n    \n- нет явной валидации обязательных полей;\n    \n- для денег используется `double`;\n    \n- отсутствует правило округления;\n    \n- не проверяются отрицательные оклад, бонус и итоговая зарплата;\n    \n- не валидируется диапазон `tax_rate`;\n    \n- `Map<String, Object>` используется во всей бизнес-логике вместо преобразования в типизированную модель;\n    \n- `updateBaseSalary()` меняет только локальный `static`-список;\n    \n- обновление оклада потеряется при повторной загрузке данных из внешнего источника;\n    \n- `static`-хранилище плохо подходит для состояния реальной системы;\n    \n- `printPayroll()` смешивает расчёт и представление результата;\n    \n- ошибка одного сотрудника не должна оставаться полностью незаметной.\n    \n\n**Как лучше исправить**\n\nФормат внешних данных изменить нельзя, поэтому `Map<String, Object>` лучше оставить только на границе системы и сразу преобразовывать в типизированную модель.\n\n```java\nrecord EmployeePayData(\n        Integer id,\n        String name,\n        BigDecimal baseSalary,\n        BigDecimal bonus,\n        BigDecimal taxRate\n) {\n}\n\nrecord PayrollEntry(\n        Integer id,\n        String name,\n        BigDecimal salary,\n        String error\n) {\n}\n```\n\nПреобразование входных данных:\n\n```java\nstatic EmployeePayData mapEmployee(\n        Map<String, Object> raw\n) {\n    Integer id = toInteger(raw.get(\"id\"), \"id\");\n    String name = String.valueOf(raw.get(\"name\"));\n\n    BigDecimal baseSalary =\n            toDecimal(raw.get(\"base_salary\"), \"base_salary\");\n\n    BigDecimal bonus = raw.get(\"bonus\") == null\n            ? BigDecimal.ZERO\n            : toDecimal(raw.get(\"bonus\"), \"bonus\");\n\n    BigDecimal taxRate =\n            toDecimal(raw.get(\"tax_rate\"), \"tax_rate\");\n\n    if (baseSalary.signum() < 0) {\n        throw new IllegalArgumentException(\n                \"base_salary must not be negative\"\n        );\n    }\n\n    if (taxRate.compareTo(BigDecimal.ZERO) < 0\n            || taxRate.compareTo(BigDecimal.ONE) > 0) {\n        throw new IllegalArgumentException(\n                \"tax_rate must be between 0 and 1\"\n        );\n    }\n\n    return new EmployeePayData(\n            id,\n            name,\n            baseSalary,\n            bonus,\n            taxRate\n    );\n}\n\nstatic BigDecimal toDecimal(\n        Object value,\n        String field\n) {\n    if (value == null) {\n        throw new IllegalArgumentException(\n                field + \" must not be null\"\n        );\n    }\n\n    if (value instanceof BigDecimal decimal) {\n        return decimal;\n    }\n\n    if (value instanceof Number number) {\n        return new BigDecimal(number.toString());\n    }\n\n    if (value instanceof String string) {\n        try {\n            return new BigDecimal(string);\n        } catch (NumberFormatException e) {\n            throw new IllegalArgumentException(\n                    \"Invalid value for \" + field,\n                    e\n            );\n        }\n    }\n\n    throw new IllegalArgumentException(\n            \"Invalid type for \" + field\n    );\n}\n```\n\nРасчёт зарплаты:\n\n```java\nstatic BigDecimal calculateSalary(\n        EmployeePayData employee\n) {\n    BigDecimal gross = employee.baseSalary()\n            .add(employee.bonus());\n\n    BigDecimal net = gross.multiply(\n            BigDecimal.ONE.subtract(employee.taxRate())\n    );\n\n    if (net.signum() < 0) {\n        throw new IllegalArgumentException(\n                \"Salary must not be negative\"\n        );\n    }\n\n    return net.setScale(\n            2,\n            RoundingMode.HALF_UP\n    );\n}\n```\n\nОшибку конкретного сотрудника лучше не скрывать:\n\n```java\nstatic List<PayrollEntry> generatePayroll() {\n    List<PayrollEntry> payroll = new ArrayList<>();\n\n    for (Map<String, Object> raw : employees) {\n        Integer id = null;\n        String name = String.valueOf(raw.get(\"name\"));\n\n        try {\n            EmployeePayData employee = mapEmployee(raw);\n            id = employee.id();\n\n            payroll.add(\n                    new PayrollEntry(\n                            id,\n                            employee.name(),\n                            calculateSalary(employee),\n                            null\n                    )\n            );\n        } catch (RuntimeException e) {\n            payroll.add(\n                    new PayrollEntry(\n                            id,\n                            name,\n                            null,\n                            e.getMessage()\n                    )\n            );\n        }\n    }\n\n    return payroll;\n}\n```\n\nТак сотрудник не исчезает из результата: вместо зарплаты можно показать статус ошибки и отдельно записать подробности в лог.\n\n**Что нужно уточнить у бизнеса**\n\n- Что делать с сотрудником с некорректными данными: исключать из ведомости, показывать с ошибкой или останавливать весь расчёт?\n    \n- `bonus == null` означает отсутствие бонуса и `0` или ошибку данных?\n    \n- Может ли бонус быть отрицательным, например как удержание?\n    \n- Допустима ли отрицательная итоговая выплата?\n    \n- Какой диапазон допустим для `tax_rate`?\n    \n- Как именно округлять денежные значения и на каком этапе расчёта?\n    \n- Кто является источником истины для оклада: наша система или внешняя?\n    \n- Должно ли изменение оклада сохраняться постоянно и передаваться обратно во внешнюю систему?\n    \n- Если часть сотрудников рассчиталась с ошибками, считается ли вся ведомость успешно сформированной?\n    \n\nГлавные технические изменения — **не скрывать ошибки, преобразовывать внешние `Map` в типизированные данные и использовать `BigDecimal` для денежных расчётов**. А правила отрицательных выплат, `null`-бонуса, округления и изменения оклада нужно зафиксировать вместе с бизнесом.\n\n{{< /details >}}"
  filepath = "payroll-system-review-and-fix"

[[tasks]]
  id = 30
  question = "Провести ревью получения полисов клиента"
  answer = "**Условие задачи:**  \nДан REST-контроллер, который должен вернуть оплаченные полисы указанного клиента с ограничением на количество результатов.\n\nНужно провести code review: найти ошибки компиляции, проблемы в REST API, Dependency Injection, транзакционности и фильтрации данных, а затем предложить более корректную реализацию.\n\n**Код:**\n\n```java\n@RestController\npublic class ClientController {\n\n    @Value(\"\"policy.limit\"\")\n    private int policyLimit;\n\n    @Autowired\n    private PolicyService policyService;\n\n    @RequestMapping(path = \"\"client/{clientId}/policies\"\", method = RequestMethod.POST)\n    public Response getClientPolicies(@PathVariable(\"\"clientId\"\") String clientId) {\n        List<PolicyDTO> policies = getPolicies().stream()\n            .limit(policyLimit)\n            .filter(p -> p.getClientIds().contains(clientId))\n            .filter(p -> p.isPaid())\n            .toList();\n        return new Response(policies);\n    }\n\n    @Transactional\n    private List<PolicyDTO> getPolicies() {\n        return policyService.getPolicies();\n    }\n\n    @Data\n    @AllArgsConstructor\n    public class Response {\n        private List<PolicyDTO> policies;\n    }\n}\n\n@Data\npublic class PolicyDTO {\n    private String id;\n    private String name;\n    private List<String> clientId;\n    private Boolean isPaid;\n}\n\n@RequiredArgsConstructor\n@Component\npublic class PolicyService {\n    private final PolicyDbRepository repository;\n    /**\n     *  Читает полисы из БД\n     */\n    List<PolicyDTO> getPolicies() {\n        return repository.getPolicies();\n    }\n}\n\npublic interface PolicyDbRepository {\n    List<PolicyDTO> getPolicies();\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Проверь выражение в `@Value` и HTTP-метод для операции чтения.  \n💡 Сравни поля `PolicyDTO` с методами, которые вызываются в Stream.  \n💡 Обрати внимание на порядок `limit()` и `filter()`.  \n💡 `@Transactional` работает через Spring proxy.  \n💡 Лучше не загружать все полисы из БД, если нужен небольшой отфильтрованный набор.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- `@Value(\"policy.limit\")` содержит литерал вместо `${...}`;\n    \n- используется field injection;\n    \n- для чтения данных выбран `POST` вместо `GET`;\n    \n- `@Transactional` стоит на `private`-методе и вызывается внутри того же класса, поэтому через Spring AOP не сработает;\n    \n- сначала выполняется `limit()`, а потом фильтрация — часть подходящих полисов может не попасть в результат;\n    \n- `PolicyDTO` содержит поле `clientId`, но вызывается `getClientIds()` — код не компилируется;\n    \n- для `Boolean isPaid` вызов `isPaid()` также не соответствует обычному Lombok-геттеру;\n    \n- `clientIds` потенциально может быть `null`;\n    \n- контроллер содержит бизнес-логику фильтрации;\n    \n- все полисы загружаются из БД и фильтруются в памяти;\n    \n- без явной сортировки набор первых `policyLimit` записей может быть недетерминированным;\n    \n- `Response` лучше сделать отдельным `record` или `static`-классом;\n    \n- отрицательный `policyLimit` приведёт к ошибке и должен быть исключён конфигурацией/валидацией.\n    \n\n**Как лучше исправить**\n\nКонтроллер должен только принять запрос и передать его сервису:\n\n```java\n@RestController\n@RequiredArgsConstructor\n@RequestMapping(\"/clients\")\npublic class ClientController {\n\n    private final PolicyService policyService;\n\n    @GetMapping(\"/{clientId}/policies\")\n    public Response getClientPolicies(\n            @PathVariable String clientId\n    ) {\n        return new Response(\n                policyService.getClientPolicies(clientId)\n        );\n    }\n\n    public record Response(List<PolicyDTO> policies) {\n    }\n}\n```\n\nDTO лучше привести к именам, которые соответствуют его смыслу:\n\n```java\n@Data\npublic class PolicyDTO {\n\n    private String id;\n    private String name;\n    private List<String> clientIds;\n    private boolean paid;\n}\n```\n\nЛимит и транзакцию перенести в сервис:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class PolicyService {\n\n    private final PolicyDbRepository repository;\n\n    @Value(\"${policy.limit:100}\")\n    private int policyLimit;\n\n    @Transactional(readOnly = true)\n    public List<PolicyDTO> getClientPolicies(\n            String clientId\n    ) {\n        if (clientId == null || clientId.isBlank()) {\n            throw new IllegalArgumentException(\n                    \"clientId must not be blank\"\n            );\n        }\n\n        return repository.getPolicies().stream()\n                .filter(p -> p.getClientIds() != null)\n                .filter(p ->\n                        p.getClientIds().contains(clientId)\n                )\n                .filter(PolicyDTO::isPaid)\n                .limit(policyLimit)\n                .toList();\n    }\n}\n```\n\nНо это всё ещё загружает **все полисы** в память. Лучше сразу фильтровать и ограничивать выборку в БД:\n\n```java\npublic List<PolicyDTO> getClientPolicies(\n        String clientId\n) {\n    return repository.findPaidByClientId(\n            clientId,\n            policyLimit\n    );\n}\n```\n\nРепозиторий должен выполнять запрос примерно по смыслу:\n\n```sql\nSELECT ...\nFROM policy\n...\nWHERE client_id = :clientId\n  AND paid = true\nORDER BY ...\nLIMIT :limit\n```\n\nТак БД сразу вернёт только нужные записи, вместо загрузки всей таблицы и последующей фильтрации в Java.\n\nГлавные исправления — **перенести фильтрацию из контроллера, применять лимит после отбора подходящих записей и по возможности выполнять фильтрацию/лимит непосредственно в БД**.\n\n{{< /details >}}"
  filepath = "client-controller-code-review"

[[tasks]]
  id = 31
  question = "Отрефакторить чтение документов разных форматов  "
  answer = "**Условие задачи:**  \nДан `DocumentService`, который выбирает способ чтения документа в зависимости от его типа: `PDF`, `DOCX` или `XLSX`. Для чтения используется самописный `DocumentReader`.\n\nНужно провести code review: определить сильные и слабые стороны реализации и предложить вариант, который будет проще тестировать и расширять при появлении новых форматов документов.\n\n**Код:**\n\n```java\n@Component\npublic class DocumentService {\n\n    public InputStream readDocument(String type) {\n        DocumentReader reader = new DocumentReader();\n\n        if (type.equals(\"\"PDF\"\")) {\n            return reader.readPdf();\n        } else if (type.equals(\"\"DOCX\"\")) {\n            return reader.readDocx();\n        } else if (type.equals(\"\"XLSX\"\")) {\n            return reader.readXlsx();\n        } else {\n            return null;\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Что произойдёт при `type == null`?  \n💡 `DocumentReader` создаётся через `new`, поэтому его сложно подменить в тестах.  \n💡 Возврат `null` не объясняет причину отсутствия результата.  \n💡 Подумай, сколько мест придётся менять при добавлении нового формата.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- `DocumentReader` создаётся через `new`, поэтому сервис жёстко связан с конкретной реализацией;\n    \n- зависимость невозможно нормально подменить в unit-тесте;\n    \n- при `type == null` вызов `type.equals(...)` приведёт к `NullPointerException`;\n    \n- тип документа задаётся строкой, поэтому возможны опечатки и некорректные значения;\n    \n- для неподдерживаемого типа возвращается `null`;\n    \n- цепочка `if/else` будет разрастаться при добавлении новых форматов;\n    \n- `DocumentService` знает конкретные методы чтения каждого формата, поэтому при расширении приходится изменять сам сервис.\n    \n\n**Что здесь нормально**\n\nДля трёх форматов код простой и легко читается. Также есть единая точка входа для чтения документа. Проблемы появляются прежде всего при тестировании и дальнейшем расширении списка форматов.\n\n**Как лучше исправить**\n\nМинимальный вариант — внедрить `DocumentReader`, использовать `enum` и явно обрабатывать неподдерживаемый тип:\n\n```java\npublic enum DocumentType {\n    PDF,\n    DOCX,\n    XLSX\n}\n```\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class DocumentService {\n\n    private final DocumentReader reader;\n\n    public InputStream readDocument(DocumentType type) {\n        if (type == null) {\n            throw new IllegalArgumentException(\n                    \"Document type must not be null\"\n            );\n        }\n\n        return switch (type) {\n            case PDF -> reader.readPdf();\n            case DOCX -> reader.readDocx();\n            case XLSX -> reader.readXlsx();\n        };\n    }\n}\n```\n\nЭто уже устраняет `new`, строковые значения и `null`-результат.\n\nЕсли форматов будет много и они будут регулярно добавляться, лучше перейти к Strategy.\n\n```java\npublic interface DocumentReader {\n\n    DocumentType getType();\n\n    InputStream read();\n}\n```\n\nОтдельная реализация для каждого формата:\n\n```java\n@Component\npublic class PdfDocumentReader implements DocumentReader {\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.PDF;\n    }\n\n    @Override\n    public InputStream read() {\n        // чтение PDF\n        return ...;\n    }\n}\n```\n\nСервис тогда только выбирает подходящую стратегию:\n\n```java\n@Component\npublic class DocumentService {\n\n    private final Map<DocumentType, DocumentReader> readers;\n\n    public DocumentService(\n            List<DocumentReader> readers\n    ) {\n        this.readers = readers.stream()\n                .collect(Collectors.toMap(\n                        DocumentReader::getType,\n                        Function.identity()\n                ));\n    }\n\n    public InputStream readDocument(DocumentType type) {\n        DocumentReader reader = readers.get(type);\n\n        if (reader == null) {\n            throw new IllegalArgumentException(\n                    \"Unsupported document type: \" + type\n            );\n        }\n\n        return reader.read();\n    }\n}\n```\n\nТеперь при добавлении нового формата достаточно создать новую реализацию `DocumentReader`: код `DocumentService` менять не нужно.\n\nДля небольшого фиксированного набора форматов достаточно варианта с `enum` и `switch`. Strategy имеет смысл, когда форматов становится много или логика их обработки развивается независимо.\n\n{{< /details >}}"
  filepath = "document-service-code-review"

[[tasks]]
  id = 32
  question = "Оптимизировать расчёт статистики по заказам клиентов"
  answer = "**Условие задачи:**  \nДан Spring-сервис, который для активных пользователей рассчитывает статистику по заказам: количество заказов и их общую стоимость, после чего отправляет результат в Kafka.\n\nНужно провести code review: найти проблемы с Dependency Injection, работой с БД, транзакциями и производительностью, а затем предложить более эффективную реализацию, сохранив корректное поведение в том числе для пользователей без заказов.\n\n**Код:**\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class StatService {\n\n    @Autowired\n    private UserRepository userRepository;\n    @Autowired\n    private OrderRepository orderRepository;\n    @Autowired\n    private StatRepository statRepository;\n    @Autowired\n    private KafkaService kafkaService;\n\n    public void calculate() {\n        List<User> users = userRepository.findAll().stream().filter(u -> u.isActive()).collect(Collectors.toList());\n\n        if (!users.isEmpty()) {\n            for(User user : users) {\n                List<Order> orders = orderRepository.findByUser(user.getId());\n\n                if (orders.isEmpty()) {\n                    System.out.println(\"\"У пользователя нет заказов\"\");\n                }\n\n                int totalOrders = 0;\n                int totalCost = 0;\n                for(Order order : orders) {\n                    totalOrders++;\n                    totalCost += order.getCost();\n                }\n\n                save(user.getId(), totalOrders, totalCost);\n            }\n        }\n    }\n@Transactional\nprivate void save(Long userId, int totalOrders, int totalCost) {\n    kafkaService.send(userId, totalOrders, totalCost, Instant.now());\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сейчас сначала загружаются все пользователи, а активные отбираются уже в Java.  \n💡 На каждого пользователя выполняется отдельный запрос заказов — проверь количество запросов при большом числе пользователей.  \n💡 `@Transactional` на `private`-методе, вызываемом из того же класса, не создаст транзакцию через Spring proxy.  \n💡 Обрати внимание на `statRepository`: используется ли он вообще?  \n💡 При оптимизации не потеряй активных пользователей, у которых нет заказов.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- смешаны `@RequiredArgsConstructor` и field injection через `@Autowired`;\n    \n- поля зависимостей не `final`, поэтому `@RequiredArgsConstructor` здесь фактически бесполезен;\n    \n- `statRepository` объявлен, но нигде не используется;\n    \n- загружаются все пользователи, а фильтрация по `active` выполняется в памяти;\n    \n- возникает N+1: после запроса пользователей выполняется отдельный запрос заказов для каждого пользователя;\n    \n- все заказы загружаются в Java только ради `COUNT` и `SUM`;\n    \n- `@Transactional` на `private save()` не сработает через Spring AOP;\n    \n- более того, `save()` ничего не сохраняет в БД — он только отправляет сообщение в Kafka;\n    \n- название `save()` не соответствует фактическому поведению;\n    \n- `System.out.println()` лучше заменить логгером;\n    \n- пустой `if (!users.isEmpty())` не нужен — цикл и так ничего не выполнит для пустого списка;\n    \n- `totalCost` в `int` может быть неподходящим для денежных сумм или больших агрегатов;\n    \n- `Instant.now()` вызывается отдельно для каждого пользователя, хотя статистика может относиться к одному запуску расчёта;\n    \n- в показанном фрагменте отсутствует закрывающая `}` класса `StatService`.\n    \n\n**Как лучше исправить**\n\nГлавная оптимизация — считать статистику сразу в БД, а не загружать пользователей и все их заказы по отдельности.\n\nПри этом важно сохранить текущее поведение: активный пользователь **без заказов тоже получает статистику `0 / 0`**. Поэтому запрос должен использовать `LEFT JOIN`, а не обычный `INNER JOIN`.\n\nНапример, репозиторий может сразу вернуть проекцию:\n\n```java\npublic record UserOrderStat(\n        Long userId,\n        long totalOrders,\n        long totalCost\n) {\n}\n```\n\n```java\npublic interface StatRepository {\n\n    List<UserOrderStat> calculateForActiveUsers();\n}\n```\n\nЗапрос по смыслу:\n\n```sql\nSELECT u.id,\n       COUNT(o.id),\n       COALESCE(SUM(o.cost), 0)\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE u.active = true\nGROUP BY u.id\n```\n\nТогда сервис становится значительно проще:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class StatService {\n\n    private final StatRepository statRepository;\n    private final KafkaService kafkaService;\n\n    public void calculate() {\n        Instant calculatedAt = Instant.now();\n\n        List<UserOrderStat> stats =\n                statRepository.calculateForActiveUsers();\n\n        for (UserOrderStat stat : stats) {\n            kafkaService.send(\n                    stat.userId(),\n                    stat.totalOrders(),\n                    stat.totalCost(),\n                    calculatedAt\n            );\n        }\n    }\n}\n```\n\nТак вместо схемы:\n\n```text\n1 запрос пользователей\n+ N запросов заказов\n```\n\nможно получить статистику одним агрегирующим запросом.\n\n`@Transactional` для простого вызова Kafka здесь не нужен. Если по требованиям статистику нужно одновременно **сохранить в БД и отправить в Kafka**, появляется другая задача: обычная DB-транзакция не делает эти две операции атомарными. Для надёжного сценария лучше сохранять статистику и outbox-запись в одной транзакции, а Kafka отправлять отдельным обработчиком.\n\nДля стоимости стоит выбрать тип согласно модели денег: `long` подходит, если сумма хранится в минимальных денежных единицах, например копейках; для дробных денежных значений обычно используют `BigDecimal`.\n\nГлавное исправление — **перенести фильтрацию и агрегацию в БД, избавиться от N+1 и не использовать фиктивную `@Transactional` вокруг отправки в Kafka**.\n\n{{< /details >}}"
  filepath = "code-review-stat-service"

[[tasks]]
  id = 33
  question = "Отрефакторить doAction() для разных типов транспорта"
  answer = "**Условие задачи:**  \nДан метод `doAction(Object source)`, который формирует строку для объектов `Car`, `Train` и `Jet`.\n\nНужно провести code review: найти проблемы с типизацией и приведением типов, оценить текущую цепочку `if/else` и предложить более безопасный и расширяемый вариант реализации.\n\n**Код:**\n\n```java\npublic class Main {\n\n    private record Car(String engine) { }\n    private record Train(String engine) { }\n    private record Jet (String engine) { }\n\n    private record Book(String author, List<String> names) { }\n\n    public static void main(String[] args) {\n\n        // Задание 1: Проанализировать метод doAction(..), предложить возможный рефакторинг, исправления, оптимизацию.\n        String doIt = doAction(new Jet(\"\"Jet\"\"));\n        System.out.println(doIt);\n        }\n\n        // Например, в данном случае вызов для Jet будет после проверки всех условий (плохо).\n        // Какие могут быть еще проблемы в этом коде ?\n        private static String doAction(Object source) {\n                String doIt = \"\"Just action \"\";\n                if (source instanceof Car car) {\n                        return doIt + car.engine();\n                } else if (source instanceof Train train) {\n                        return doIt + train.engine();\n                } else {\n                        return doIt + ((Jet) source).engine();\n                }\n        }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Метод принимает `Object`, хотя поддерживает только несколько конкретных типов.  \n💡 В последней ветке выполняется приведение к `Jet` без проверки типа.  \n💡 У `Car`, `Train` и `Jet` есть одинаковое поведение — `engine()`. Можно ли выразить его общим контрактом?  \n💡 Сам факт, что `Jet` проверяется последним, здесь практически не является проблемой производительности.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- `doAction()` принимает `Object`, поэтому в него можно передать объект любого типа;\n    \n- последняя ветка предполагает, что любой объект, который не `Car` и не `Train`, обязательно является `Jet`;\n    \n- другой тип приведёт к `ClassCastException`;\n    \n- `null` дойдёт до последней ветки и приведёт к `NullPointerException`;\n    \n- при появлении новых типов цепочку условий придётся расширять;\n    \n- `Car`, `Train` и `Jet` имеют одинаковый метод `engine()`, но общего контракта нет;\n    \n- `Book` к задаче `doAction()` отношения не имеет и создаёт лишний шум.\n    \n\nЗамечание о том, что `Jet` проверяется последним, несущественно: несколько проверок `instanceof` практически не являются проблемой производительности. Основная проблема — дизайн метода и небезопасный `else`.\n\n**Как лучше исправить**\n\nПоскольку для всех трёх типов действие одинаковое, дополнительный `switch` вообще не нужен. Достаточно общего интерфейса:\n\n```java\ninterface Vehicle {\n    String engine();\n}\n\nrecord Car(String engine) implements Vehicle {\n}\n\nrecord Train(String engine) implements Vehicle {\n}\n\nrecord Jet(String engine) implements Vehicle {\n}\n```\n\nТогда метод становится простым и типобезопасным:\n\n```java\nprivate static String doAction(Vehicle source) {\n    if (source == null) {\n        throw new IllegalArgumentException(\n                \"source must not be null\"\n        );\n    }\n\n    return \"Just action \" + source.engine();\n}\n```\n\nТеперь:\n\n- нельзя передать `Book`, `String` или другой неподдерживаемый объект;\n    \n- нет небезопасного cast;\n    \n- нет цепочки `if/else`;\n    \n- новый тип транспорта достаточно реализовать через `Vehicle`, а `doAction()` менять не потребуется.\n    \n\nЕсли же для каждого типа в будущем появится **разная логика**, можно использовать `sealed interface` и pattern matching `switch`. Но в текущем коде это избыточно: все ветки отличаются только способом получить один и тот же `engine()`.\n\nГлавное исправление — **заменить слабый контракт `Object` общим типом и использовать полиморфизм вместо проверки конкретных классов**.\n\n{{< /details >}}"
  filepath = "doaction-code-review"

