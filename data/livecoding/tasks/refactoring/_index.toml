  id = 20
  question = "Сделать рефакторинг обработки документов"
  answer = "📌 Дан сервис обработки документов разных типов. Нужно выполнить рефакторинг, убрать разрастающийся `switch` и упростить добавление новых форматов.\n\n**Код:**\n\n```java\npublic class RefEx {\n\n    public enum DocumentType {\n        XML,\n        PDF,\n        DOCX\n    }\n\n    public static class Document {\n        String id;\n        DocumentType type;\n        String content;\n    }\n\n    public static class DocumentService {\n\n        public void process(Document[] d) {\n            for (Document i : d) {\n\n                // Общая логика обработки документа\n                switch (i.type) {\n                    case DocumentType.PDF: {\n                        // Специфическая логика для обработки PDF\n                    } break;\n\n                    case DocumentType.DOCX: {\n                        // Специфическая логика для обработки Word\n                    } break;\n\n                    case DocumentType.XML: {\n                        // Специфическая логика для обработки XML\n                    } break;\n                }\n            }\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Имена `d` и `i` не отражают смысл переменных.  \n💡 Нужно проверить массив и его элементы на `null`.  \n💡 При добавлении нового типа придётся изменять `DocumentService`.  \n💡 Специфическую обработку лучше вынести в отдельные классы.  \n💡 Для выбора обработчика можно использовать паттерн Strategy.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновная проблема — `DocumentService` знает логику обработки всех форматов.\n\nПри добавлении нового типа придётся изменять `switch`, поэтому нарушается принцип Open/Closed.\n\nМожно вынести обработку каждого формата в отдельный класс:\n\n```java\npublic interface DocumentProcessor {\n\n    DocumentType getType();\n\n    void process(Document document);\n}\n```\n\n```java\npublic class PdfDocumentProcessor implements DocumentProcessor {\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.PDF;\n    }\n\n    @Override\n    public void process(Document document) {\n        // Специфическая логика обработки PDF\n    }\n}\n```\n\n```java\npublic class DocxDocumentProcessor implements DocumentProcessor {\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.DOCX;\n    }\n\n    @Override\n    public void process(Document document) {\n        // Специфическая логика обработки Word\n    }\n}\n```\n\n```java\npublic class XmlDocumentProcessor implements DocumentProcessor {\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.XML;\n    }\n\n    @Override\n    public void process(Document document) {\n        // Специфическая логика обработки XML\n    }\n}\n```\n\nОбновлённый сервис:\n\n```java\nimport java.util.Collection;\nimport java.util.EnumMap;\nimport java.util.Map;\n\npublic class DocumentService {\n\n    private final Map<DocumentType, DocumentProcessor> processors;\n\n    public DocumentService(Collection<DocumentProcessor> processors) {\n        this.processors = new EnumMap<>(DocumentType.class);\n\n        for (DocumentProcessor processor : processors) {\n            this.processors.put(processor.getType(), processor);\n        }\n    }\n\n    public void process(Document[] documents) {\n        if (documents == null) {\n            throw new IllegalArgumentException(\"Documents must not be null\");\n        }\n\n        for (Document document : documents) {\n            if (document == null || document.type == null) {\n                throw new IllegalArgumentException(\"Invalid document\");\n            }\n\n            // Общая логика обработки документа\n\n            DocumentProcessor processor = processors.get(document.type);\n\n            if (processor == null) {\n                throw new IllegalArgumentException(\n                        \"Unsupported document type: \" + document.type\n                );\n            }\n\n            processor.process(document);\n        }\n    }\n}\n```\n\nТеперь для добавления нового формата достаточно создать новый `DocumentProcessor`. Изменять `DocumentService` не потребуется.\n\nТакже в исходном коде в `switch` для enum обычно пишется:\n\n```java\ncase PDF:\n```\n\nа не:\n\n```java\ncase DocumentType.PDF:\n```\n\n> Основная проблема исходного решения — разрастающийся `switch` и смешение общей и специфической логики. Я бы применил Strategy: создал отдельный обработчик для каждого типа документа и выбирал нужную реализацию через `Map<DocumentType, DocumentProcessor>`.\n\n{{< /details >}}"
  filepath = "document-service-refactor"

