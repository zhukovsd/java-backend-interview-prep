[[tasks]]
  id = 1
  question = "Провести рефакторинг PersonService"
  answer = "**Условие задачи:**  \nДан метод `getAdultMaleUsersAverageBMI()`, который:\n\n- самостоятельно открывает соединение с БД;\n    \n- получает совершеннолетних мужчин;\n    \n- создаёт для каждой записи объект `Person`;\n    \n- вычисляет средний BMI;\n    \n- выводит результат в консоль;\n    \n- самостоятельно обрабатывает ошибки.\n    \n\nНеобходимо провести рефакторинг кода: убрать лишние операции, корректно управлять JDBC-ресурсами, обработать граничные случаи и разделить ответственность метода.\n\n**Код:**\n\n```java\npublic class PersonService {\n\n    public void getAdultMaleUsersAverageBMI() {\n        double totalIMT = 0.0;\n        long countOfPerson = 0;\n        double heightInMeters = 0d;\n        double imt = 0d;\n\n        List<Person> adultPersons = new ArrayList<>();\n\n        try {\n            Connection c = DriverManager.getConnection(\n                    \"jdbc:hsqldb:mem:test\",\n                    \"admin\",\n                    \"qwerty54\"\n            );\n\n            Statement s = c.createStatement();\n\n            ResultSet rs = s.executeQuery(\n                    \"SELECT * FROM person \" +\n                    \"WHERE sex = 'male' AND age >= 18\"\n            );\n\n            while (rs.next()) {\n                Person p = new Person();\n\n                p.setId(rs.getLong(\"id\"));\n                p.setSex(rs.getString(\"sex\"));\n                p.setName(rs.getString(\"name\"));\n                p.setAge(rs.getLong(\"age\"));\n                p.setWeight(rs.getLong(\"weight\"));\n                p.setHeight(rs.getLong(\"height\"));\n\n                adultPersons.add(p);\n            }\n\n            for (Person p : adultPersons) {\n                heightInMeters = p.getHeight() / 100d;\n                imt = p.getWeight()\n                        / (heightInMeters * heightInMeters);\n\n                totalIMT += imt;\n            }\n\n            countOfPerson = adultPersons.size();\n        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\n        System.out.println(\n                \"Average imt = \"\n                        + totalIMT / countOfPerson\n        );\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для вычисления BMI нужны только `weight` и `height`, поэтому создавать объекты `Person` необязательно.  \n💡 JDBC-ресурсы следует закрывать через `try-with-resources`.  \n💡 Строку подключения и credentials лучше передавать через `DataSource`, а не хранить в сервисе.  \n💡 Метод лучше возвращает результат, а не занимается выводом в консоль.  \n💡 Нужно обработать ситуацию, когда подходящих людей нет, а также некорректный `height = 0`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОдин из вариантов рефакторинга:\n\n```java\npublic class PersonService {\n\n    private static final String QUERY = \"\"\"\n            SELECT weight, height\n            FROM person\n            WHERE sex = ?\n              AND age >= ?\n            \"\"\";\n\n    private final DataSource dataSource;\n\n    public PersonService(DataSource dataSource) {\n        this.dataSource = dataSource;\n    }\n\n    public OptionalDouble getAdultMaleUsersAverageBMI() {\n        double totalBmi = 0.0;\n        long count = 0;\n\n        try (Connection connection = dataSource.getConnection();\n             PreparedStatement statement =\n                     connection.prepareStatement(QUERY)) {\n\n            statement.setString(1, \"male\");\n            statement.setInt(2, 18);\n\n            try (ResultSet rs = statement.executeQuery()) {\n                while (rs.next()) {\n                    double weight = rs.getDouble(\"weight\");\n                    double heightCm = rs.getDouble(\"height\");\n\n                    if (heightCm <= 0) {\n                        continue;\n                    }\n\n                    double heightMeters = heightCm / 100.0;\n\n                    totalBmi += weight\n                            / (heightMeters * heightMeters);\n\n                    count++;\n                }\n            }\n\n        } catch (SQLException e) {\n            throw new IllegalStateException(\n                    \"Не удалось вычислить средний BMI\",\n                    e\n            );\n        }\n\n        if (count == 0) {\n            return OptionalDouble.empty();\n        }\n\n        return OptionalDouble.of(totalBmi / count);\n    }\n}\n```\n\nИспользование:\n\n```java\npersonService.getAdultMaleUsersAverageBMI()\n        .ifPresentOrElse(\n                bmi -> System.out.printf(\n                        \"Average BMI = %.2f%n\",\n                        bmi\n                ),\n                () -> System.out.println(\n                        \"Подходящие пользователи не найдены\"\n                )\n        );\n```\n\nВ исходном методе выполнялось:\n\n```text\nБД\n ↓\nResultSet\n ↓\nPerson\n ↓\nList<Person>\n ↓\nповторный обход списка\n ↓\nBMI\n```\n\nДля вычисления среднего значения объекты `Person` и промежуточный список не нужны. Достаточно считать два необходимых поля:\n\n```sql\nSELECT weight, height\nFROM person\nWHERE sex = ?\n  AND age >= ?\n```\n\nи сразу обновлять сумму:\n\n```java\ntotalBmi += weight\n        / (heightMeters * heightMeters);\n\ncount++;\n```\n\n`try-with-resources` гарантирует закрытие:\n\n```text\nConnection\nPreparedStatement\nResultSet\n```\n\nв том числе при возникновении исключения.\n\nПолучение соединения вынесено в:\n\n```java\nprivate final DataSource dataSource;\n```\n\nпоэтому сервис больше не содержит внутри себя:\n\n```text\nURL БД\nлогин\nпароль\n```\n\nи его проще конфигурировать и тестировать.\n\nВместо:\n\n```java\ncatch (Exception e) {\n    e.printStackTrace();\n}\n```\n\nперехватывается конкретный `SQLException`. Ошибка не скрывается, а передаётся вызывающему коду как исключение более высокого уровня.\n\nВозвращается:\n\n```java\nOptionalDouble\n```\n\nпоскольку при отсутствии подходящих записей среднего значения не существует. Это также предотвращает деление:\n\n```text\n0 / 0\n```\n\nи получение `NaN`.\n\nМетод теперь отвечает за вычисление среднего BMI, а не за форматирование и вывод результата.\n\nОсновные улучшения:\n\n- убран ненужный `List<Person>`;\n    \n- не создаются лишние объекты `Person`;\n    \n- выбираются только необходимые столбцы;\n    \n- JDBC-ресурсы гарантированно закрываются;\n    \n- конфигурация БД отделена от бизнес-логики;\n    \n- обработан случай отсутствия данных;\n    \n- исключено деление на нулевой рост;\n    \n- ошибка работы с БД не скрывается;\n    \n- вычисление отделено от вывода результата.\n    \n\nВременная сложность — `O(n)`, где `n` — количество найденных записей. Дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "refactor-personservice"

[[tasks]]
  id = 2
  question = "Провести code review и исправить класс Test"
  answer = "**Условие задачи:**  \nНеобходимо провести code review класса `Test`, найти проблемы и предложить исправленную реализацию.\n\nНужно обратить внимание на:\n\n- потокобезопасность;\n    \n- корректное закрытие файловых ресурсов;\n    \n- выбор структуры данных;\n    \n- эффективность формирования строки;\n    \n- безопасное предоставление содержимого списка наружу.\n    \n\n**Код:**\n\n```java\npublic class Test {\n    private List<String> list = new LinkedList<String>();\n\n    public synchronized void addString(String s) {\n        list.add(s);\n    }\n\n    public void addStringsFromFile(String pathToFile) throws IOException {\n        File file = new File(pathToFile);\n        FileInputStream fis = new FileInputStream(file);\n        InputStreamReader isr =\n                new InputStreamReader(fis, StandardCharsets.UTF_8);\n        Scanner scanner = new Scanner(isr);\n\n        String str;\n\n        while (scanner.hasNextLine()) {\n            str = scanner.nextLine();\n\n            if (!str.isBlank()) {\n                addString(str);\n            }\n        }\n    }\n\n    public void removeString(int i) {\n        list.remove(i);\n    }\n\n    public List<String> getList() {\n        return list;\n    }\n\n    public synchronized String formatString() {\n        String s = \"\";\n\n        for (int i = 0; i < list.size(); i++) {\n            s = s + list.get(i);\n        }\n\n        return s;\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Синхронизация должна защищать все операции с общим изменяемым состоянием, а не только часть методов.  \n💡 Возвращать внутренний изменяемый список напрямую нельзя — вызывающий код сможет менять его без синхронизации.  \n💡 Для чтения файла удобно использовать `Files.newBufferedReader()` вместе с `try-with-resources`.  \n💡 Последовательная конкатенация строк через `+` внутри цикла создаёт множество промежуточных объектов.  \n💡 Здесь `ArrayList` подходит лучше `LinkedList`, особенно если список часто обходится целиком.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновные проблемы:\n\n- `addString()` и `formatString()` синхронизированы, а `removeString()` и `getList()` — нет;\n    \n- `getList()` возвращает внутреннюю коллекцию, поэтому её можно изменить в обход любой синхронизации;\n    \n- файловые ресурсы не закрываются;\n    \n- используется слишком низкоуровневая цепочка `FileInputStream → InputStreamReader → Scanner`;\n    \n- конкатенация через `s = s + ...` внутри цикла неэффективна;\n    \n- `LinkedList` здесь не даёт преимуществ;\n    \n- обращение `list.get(i)` для `LinkedList` само по себе стоит `O(i)`, поэтому индексный обход дополнительно ухудшает производительность.\n    \n\nОдин из вариантов рефакторинга:\n\n```java\npublic class Test {\n\n    private final List<String> list = new ArrayList<>();\n    private final Object lock = new Object();\n\n    public void addString(String value) {\n        synchronized (lock) {\n            list.add(value);\n        }\n    }\n\n    public void addStringsFromFile(String pathToFile)\n            throws IOException {\n\n        try (BufferedReader reader = Files.newBufferedReader(\n                Path.of(pathToFile),\n                StandardCharsets.UTF_8\n        )) {\n            String line;\n\n            while ((line = reader.readLine()) != null) {\n                if (!line.isBlank()) {\n                    addString(line);\n                }\n            }\n        }\n    }\n\n    public void removeString(int index) {\n        synchronized (lock) {\n            list.remove(index);\n        }\n    }\n\n    public List<String> getList() {\n        synchronized (lock) {\n            return Collections.unmodifiableList(\n                    new ArrayList<>(list)\n            );\n        }\n    }\n\n    public String formatString() {\n        synchronized (lock) {\n            StringBuilder result = new StringBuilder();\n\n            for (String value : list) {\n                result.append(value);\n            }\n\n            return result.toString();\n        }\n    }\n}\n```\n\nВсе обращения к изменяемому состоянию:\n\n```java\nprivate final List<String> list\n```\n\nтеперь выполняются под одним и тем же приватным монитором:\n\n```java\nprivate final Object lock = new Object();\n```\n\nИспользование отдельного объекта блокировки предпочтительнее синхронизации на самой коллекции: внешний код не получает к нему доступа и не может случайно вмешаться в протокол синхронизации.\n\nВ `getList()` возвращается снимок:\n\n```java\nreturn Collections.unmodifiableList(\n        new ArrayList<>(list)\n);\n```\n\nЭто важно. Вариант:\n\n```java\nCollections.unmodifiableList(list)\n```\n\nзапрещает вызывающему коду изменять список напрямую, но всё равно возвращает представление над исходной изменяемой коллекцией. Её содержимое может параллельно изменяться самим `Test`.\n\nСнимок полностью отделён от внутреннего списка.\n\nДля файла используется:\n\n```java\ntry (BufferedReader reader = Files.newBufferedReader(...))\n```\n\n`try-with-resources` гарантирует закрытие `BufferedReader` даже при возникновении `IOException`.\n\nВ `formatString()` вместо:\n\n```java\ns = s + list.get(i);\n```\n\nиспользуется:\n\n```java\nStringBuilder result = new StringBuilder();\n\nfor (String value : list) {\n    result.append(value);\n}\n```\n\nЭто устраняет создание множества промежуточных строк.\n\nТакже `ArrayList` лучше соответствует текущему сценарию использования: элементы добавляются в конец и список часто обходится целиком.\n\nДля некорректного индекса:\n\n```java\nlist.remove(index);\n```\n\nестественным образом будет выброшен `IndexOutOfBoundsException`. Молча игнорировать неправильный индекс обычно не стоит, если такое поведение явно не требуется контрактом.\n\nПосле рефакторинга:\n\n- доступ к общему состоянию синхронизирован единообразно;\n    \n- внутренний список не утекает наружу;\n    \n- ресурсы закрываются автоматически;\n    \n- убрана лишняя низкоуровневая работа с потоками;\n    \n- формирование строки выполняется эффективно;\n    \n- коллекция выбрана в соответствии с характером операций.\n    \n\n{{< /details >}}"
  filepath = "code-review-fixes"

[[tasks]]
  id = 3
  question = "Оптимизировать построение сообщения об ошибках"
  answer = "**Условие задачи:**  \nДан Spring-компонент, который формирует строковое сообщение со списком ошибок.\n\nНеобходимо исправить проблемы в реализации:\n\n- убрать неэффективную конкатенацию строк внутри цикла;\n    \n- корректно оформить строковые литералы;\n    \n- сохранить исходный формат сообщения.\n    \n\n**Код:**\n\n```java\n@Component\npublic class Task2 {\n\n    public String buildAuditMessage(List<String> errors) {\n        String msg =\n                \"В процессе обработки возникли следующие проблемы: \\n\";\n\n        for (String error : errors) {\n            msg += error + \"\\n\";\n        }\n\n        return msg;\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `String` в Java неизменяемый, поэтому конкатенация через `+=` в цикле создаёт новые объекты.  \n💡 Для последовательного построения строки лучше использовать `StringBuilder`.  \n💡 Добавлять перенос строки можно через `append('\\n')`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\n@Component\npublic class Task2 {\n\n    public String buildAuditMessage(List<String> errors) {\n        StringBuilder message = new StringBuilder(\n                \"В процессе обработки возникли следующие проблемы:\\n\"\n        );\n\n        for (String error : errors) {\n            message.append(error)\n                    .append('\\n');\n        }\n\n        return message.toString();\n    }\n}\n```\n\nВ исходном варианте внутри цикла выполнялась операция:\n\n```java\nmsg += error + \"\\n\";\n```\n\nПоскольку `String` неизменяемый, при каждой такой конкатенации создаётся новая строка и копируется уже накопленное содержимое.\n\n`StringBuilder` изменяет внутренний буфер:\n\n```java\nmessage.append(error)\n        .append('\\n');\n```\n\nпоэтому подходит для построения строки в цикле значительно лучше.\n\nТакже для одиночного символа переноса строки используется:\n\n```java\n'\\n'\n```\n\nа не строка `\"\\n\"`.\n\nВ результате код становится проще и эффективнее.\n\nДля `n` ошибок и суммарной длины результата `L` построение сообщения через `StringBuilder` работает за `O(L)`. При многократной конкатенации через `+=` объём копирования может расти квадратично относительно размера формируемой строки.\n\n{{< /details >}}"
  filepath = "fix-message-building"

[[tasks]]
  id = 4
  question = "Исправить ошибки в Spring Boot приложении"
  answer = "**Условие задачи:**  \nНеобходимо провести рефакторинг Spring Boot приложения и исправить ошибки в структуре и коде.\n\nНужно обратить внимание на:\n\n- расположение классов и пакетов;\n    \n- component scanning Spring Boot;\n    \n- корректные импорты аннотаций;\n    \n- синтаксис `@GetMapping`;\n    \n- корректную регистрацию контроллера в Spring Context.\n    \n\n**Код:**\n\n```java\npackage com.home.app;\n\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\npublic class App {\n\n    public static void main(String[] args) {\n        SpringApplication.run(App.class, args);\n    }\n}\n\npackage com.home.controller;\n\n@Controller\npublic class Controller {\n\n    @GetMapping(\"/\")\n    public String test() {\n        return \"test\";\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 В одном `.java`-файле не может быть нескольких объявлений `package`.  \n💡 `@Controller` находится в `org.springframework.stereotype`.  \n💡 `@GetMapping` находится в `org.springframework.web.bind.annotation`.  \n💡 Обрати внимание, от какого пакета Spring Boot начинает поиск компонентов.  \n💡 Главный класс приложения лучше разместить в общем родительском пакете для остальных компонентов.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nУдобная структура проекта:\n\n```text\ncom.home\n├── App.java\n└── controller\n    └── HomeController.java\n```\n\n`App.java`:\n\n```java\npackage com.home;\n\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\npublic class App {\n\n    public static void main(String[] args) {\n        SpringApplication.run(App.class, args);\n    }\n}\n```\n\n`HomeController.java`:\n\n```java\npackage com.home.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.GetMapping;\n\n@Controller\npublic class HomeController {\n\n    @GetMapping(\"/\")\n    public String test() {\n        return \"test\";\n    }\n}\n```\n\nКаждый файл содержит только одно объявление:\n\n```java\npackage ...\n```\n\nи находится в директории, соответствующей своему пакету.\n\nВажная проблема исходной структуры связана с расположением главного класса:\n\n```text\ncom.home.app.App\ncom.home.controller.Controller\n```\n\n`@SpringBootApplication` включает поиск компонентов начиная с пакета, в котором расположен класс приложения, и его подпакетов.\n\nЕсли `App` находится в:\n\n```text\ncom.home.app\n```\n\nто автоматически сканируются:\n\n```text\ncom.home.app\ncom.home.app.*\n```\n\nНо пакет:\n\n```text\ncom.home.controller\n```\n\nявляется соседним, а не дочерним. Поэтому контроллер может не попасть в Spring Context.\n\nРазмещение `App` в общем корневом пакете:\n\n```text\ncom.home\n```\n\nрешает эту проблему:\n\n```text\ncom.home\n├── App\n└── controller\n    └── HomeController\n```\n\nТеперь `com.home.controller` входит в область component scanning.\n\nТакже должны использоваться правильные импорты:\n\n```java\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.GetMapping;\n```\n\nАннотация маршрута записывается как:\n\n```java\n@GetMapping(\"/\")\n```\n\nМетод:\n\n```java\npublic String test() {\n    return \"test\";\n}\n```\n\nпри использовании `@Controller` возвращает **имя представления** `test`. То есть Spring MVC будет искать соответствующий шаблон, например `test.html`, если подключён шаблонизатор.\n\nЕсли задача состоит именно в том, чтобы по запросу `/` вернуть текст:\n\n```text\ntest\n```\n\nто контроллер можно сделать REST-контроллером:\n\n```java\npackage com.home.controller;\n\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\n@RestController\npublic class HomeController {\n\n    @GetMapping(\"/\")\n    public String test() {\n        return \"test\";\n    }\n}\n```\n\nВ этом случае строка `\"test\"` будет записана непосредственно в HTTP response body.\n\nОсновные исправления:\n\n- классы разделены по отдельным файлам;\n    \n- главный класс перенесён в общий родительский пакет;\n    \n- контроллер попадает в component scanning;\n    \n- добавлены правильные импорты;\n    \n- исправлен синтаксис `@GetMapping`;\n    \n- имя `Controller` заменено на более понятное `HomeController`;\n    \n- уточнена разница между `@Controller` и `@RestController`.\n    \n\n{{< /details >}}"
  filepath = "fix-spring-app-code-errors"

[[tasks]]
  id = 5
  question = "Оптимизировать вычисление числа Фибоначчи"
  answer = "**Условие задачи:**  \nДана рекурсивная реализация функции Фибоначчи:\n\n```java\nint fib(int n) {\n    if (n <= 1) {\n        return n;\n    }\n\n    return fib(n - 1) + fib(n - 2);\n}\n```\n\nНеобходимо провести рефакторинг:\n\n- устранить повторные вычисления;\n    \n- улучшить производительность;\n    \n- корректно обработать отрицательные значения `n`;\n    \n- оценить временную и пространственную сложность решения.\n    \n\nПоследовательность Фибоначчи:\n\n```text\nn: 0, 1, 2, 3, 4, 5, 6, ...\nf: 0, 1, 1, 2, 3, 5, 8, ...\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 В исходной рекурсии одни и те же значения вычисляются много раз.  \n💡 Например, при вычислении `fib(5)` значение `fib(3)` будет вычислено несколько раз.  \n💡 Если рекурсия не является требованием, проще всего заменить её итерацией.  \n💡 Для вычисления очередного числа достаточно хранить только два предыдущих значения.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nПредпочтительный вариант — итеративное решение:\n\n```java\npublic static int fib(int n) {\n    if (n < 0) {\n        throw new IllegalArgumentException(\n                \"n должен быть неотрицательным\"\n        );\n    }\n\n    if (n <= 1) {\n        return n;\n    }\n\n    int previous = 0;\n    int current = 1;\n\n    for (int i = 2; i <= n; i++) {\n        int next = previous + current;\n\n        previous = current;\n        current = next;\n    }\n\n    return current;\n}\n```\n\nНапример:\n\n```java\nSystem.out.println(fib(0));  // 0\nSystem.out.println(fib(1));  // 1\nSystem.out.println(fib(5));  // 5\nSystem.out.println(fib(10)); // 55\n```\n\nВ исходном варианте:\n\n```java\nreturn fib(n - 1) + fib(n - 2);\n```\n\nстроится дерево рекурсивных вызовов, в котором одни и те же значения вычисляются повторно.\n\nНапример:\n\n```text\nfib(5)\n├── fib(4)\n│   ├── fib(3)\n│   └── fib(2)\n└── fib(3)\n```\n\n`fib(3)` уже вычисляется как минимум дважды, а с ростом `n` число повторных вызовов быстро увеличивается.\n\nВременная сложность такой рекурсии экспоненциальная — `O(φⁿ)`, где `φ ≈ 1.618`. Её также часто упрощённо оценивают сверху как `O(2ⁿ)`.\n\nИтеративный вариант выполняет один проход:\n\n```java\nfor (int i = 2; i <= n; i++)\n```\n\nи хранит только два предыдущих значения.\n\nСложность после рефакторинга:\n\n- время — `O(n)`;\n    \n- дополнительная память — `O(1)`.\n    \n\nЕсли требуется сохранить рекурсивный подход, можно использовать мемоизацию:\n\n```java\npublic static int fib(int n) {\n    if (n < 0) {\n        throw new IllegalArgumentException(\n                \"n должен быть неотрицательным\"\n        );\n    }\n\n    Integer[] cache = new Integer[n + 1];\n\n    return fib(n, cache);\n}\n\nprivate static int fib(int n, Integer[] cache) {\n    if (n <= 1) {\n        return n;\n    }\n\n    if (cache[n] != null) {\n        return cache[n];\n    }\n\n    cache[n] = fib(n - 1, cache)\n            + fib(n - 2, cache);\n\n    return cache[n];\n}\n```\n\nУ варианта с мемоизацией:\n\n- время — `O(n)`;\n    \n- память — `O(n)` на кэш и стек рекурсии.\n    \n\nДля обычной задачи итеративная версия проще и экономнее по памяти.\n\nВажно также учитывать диапазон типа `int`: `F(46)` ещё помещается в `int`, а `F(47)` уже приводит к переполнению. Для больших значений следует использовать `long`, а затем при необходимости `BigInteger`.\n\n{{< /details >}}"
  filepath = "fib-refactor"

[[tasks]]
  id = 6
  question = "Провести рефакторинг Spring-сервиса работы с контрактами"
  answer = "**Условие задачи:**  \nДан Spring-сервис, который:\n\n- сохраняет контракты;\n    \n- отправляет событие в Kafka после сохранения;\n    \n- возвращает контракты постранично;\n    \n- кэширует уже полученные страницы.\n    \n\nНеобходимо провести code review, исправить ошибки и улучшить производительность и структуру кода.\n\n**Код:**\n\n```java\n@Service\npublic class ContractService {\n\n    final public static String KT = \"TOPIC\";\n    final public static int ONPAGE = 10;\n\n    public ContractRepository repo;\n    public KafkaTemplate<String, String> kafka;\n    public HashMap<Long, List<Contract>> cache;\n\n    void save(Long a, String b) {\n        Contract x = new Contract(a, b);\n        repo.save(x);\n        kafka.send(KT, \"contract was created\");\n    }\n\n    public List<Contract> getPage(int number) {\n        if (!cache.containsKey(number)) {\n            List<Contract> cs = repo.findAll();\n            List<Contract> r = new ArrayList<>();\n\n            for (int i = 0; i < ONPAGE; i++) {\n                Contract c = cs.get(i + number * ONPAGE);\n                r.add(c);\n            }\n\n            cache.put(number, r);\n        }\n\n        return cache.get(number);\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Обрати внимание на тип ключа `HashMap<Long, ...>` и тип номера страницы `int`.  \n💡 Поля `repo`, `kafka` и `cache` не должны быть публичными.  \n💡 Для получения одной страницы не нужно выполнять `findAll()`.  \n💡 Пагинацию лучше выполнять непосредственно в БД через `Pageable`.  \n💡 После сохранения контракта закэшированные страницы могут устареть.  \n💡 В Spring для такого сценария удобно использовать `@Cacheable` и `@CacheEvict`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВ исходном коде есть несколько важных проблем.\n\nПервая — тип ключа кэша:\n\n```java\nHashMap<Long, List<Contract>> cache;\n```\n\nпри этом номер страницы имеет тип:\n\n```java\nint number\n```\n\nи используется так:\n\n```java\ncache.put(number, r);\n```\n\nДля `Map<Long, ...>` такой вызов некорректен: номер страницы должен иметь тот же тип ключа. В данном случае естественный тип — `Integer`.\n\nКроме того, `cache` вообще не инициализируется, поэтому при обращении к нему возник бы `NullPointerException`.\n\nПрактичный Spring-вариант — не реализовывать кэш вручную, а использовать Spring Cache:\n\n```java\n@Service\npublic class ContractService {\n\n    private static final String TOPIC = \"TOPIC\";\n    private static final int PAGE_SIZE = 10;\n\n    private final ContractRepository repository;\n    private final KafkaTemplate<String, String> kafkaTemplate;\n\n    public ContractService(\n            ContractRepository repository,\n            KafkaTemplate<String, String> kafkaTemplate\n    ) {\n        this.repository = repository;\n        this.kafkaTemplate = kafkaTemplate;\n    }\n\n    @CacheEvict(\n            cacheNames = \"contractPages\",\n            allEntries = true\n    )\n    public void save(Long id, String data) {\n        Objects.requireNonNull(id, \"id\");\n        Objects.requireNonNull(data, \"data\");\n\n        Contract contract = new Contract(id, data);\n\n        repository.save(contract);\n\n        kafkaTemplate.send(\n                TOPIC,\n                \"contract was created\"\n        );\n    }\n\n    @Cacheable(\n            cacheNames = \"contractPages\",\n            key = \"#pageNumber\",\n            sync = true\n    )\n    public List<Contract> getPage(int pageNumber) {\n        if (pageNumber < 0) {\n            throw new IllegalArgumentException(\n                    \"Номер страницы не может быть отрицательным\"\n            );\n        }\n\n        Pageable pageable = PageRequest.of(\n                pageNumber,\n                PAGE_SIZE,\n                Sort.by(\"id\").ascending()\n        );\n\n        return List.copyOf(\n                repository.findAll(pageable).getContent()\n        );\n    }\n}\n```\n\nРепозиторий может выглядеть так:\n\n```java\npublic interface ContractRepository\n        extends JpaRepository<Contract, Long> {\n}\n```\n\nДля работы аннотаций кэширования в приложении должен быть включён Spring Cache, например:\n\n```java\n@Configuration\n@EnableCaching\npublic class CacheConfig {\n}\n```\n\nГлавная проблема с производительностью в исходном `getPage()`:\n\n```java\nList<Contract> cs = repo.findAll();\n```\n\nДопустим, в таблице миллион контрактов, а клиент запрашивает десять.\n\nИсходная реализация делает:\n\n```text\nБД → 1 000 000 записей → приложение → выбираем 10\n```\n\nВместо этого пагинация должна выполняться на стороне БД:\n\n```java\nPageRequest.of(\n        pageNumber,\n        PAGE_SIZE,\n        Sort.by(\"id\").ascending()\n)\n```\n\nТогда из БД загружаются только необходимые записи.\n\nСортировка важна для стабильной пагинации. Без явно заданного порядка БД не обязана возвращать строки каждый раз в одинаковой последовательности.\n\nКэширование выполняется через:\n\n```java\n@Cacheable(\n        cacheNames = \"contractPages\",\n        key = \"#pageNumber\",\n        sync = true\n)\n```\n\nПри первом:\n\n```java\ngetPage(2)\n```\n\nметод обращается к БД и сохраняет результат в кэш.\n\nПри следующем:\n\n```java\ngetPage(2)\n```\n\nрезультат берётся из кэша без выполнения метода.\n\n`sync = true` также позволяет избежать нескольких одновременных загрузок одной и той же отсутствующей страницы при поддержке этой возможности используемым `Cache`-провайдером.\n\nПосле сохранения нового контракта страницы потенциально меняются, поэтому:\n\n```java\n@CacheEvict(\n        cacheNames = \"contractPages\",\n        allEntries = true\n)\n```\n\nочищает кэш.\n\nОчищать только одну страницу небезопасно. При сортировке новый контракт потенциально может сдвинуть элементы и изменить несколько последующих страниц.\n\nКроме того, исходный цикл:\n\n```java\nfor (int i = 0; i < ONPAGE; i++) {\n    Contract c = cs.get(i + number * ONPAGE);\n}\n```\n\nможет выбросить `IndexOutOfBoundsException`, если последняя страница содержит меньше десяти элементов.\n\nSpring Data pagination обрабатывает это автоматически:\n\n```java\nrepository.findAll(pageable).getContent()\n```\n\nДля страницы за пределами существующих данных будет получен пустой список.\n\nОсновные проблемы исходного кода:\n\n- неправильный тип ключа кэша;\n    \n- кэш не инициализирован;\n    \n- публичные изменяемые зависимости;\n    \n- отсутствует constructor injection;\n    \n- `findAll()` загружает всю таблицу ради одной страницы;\n    \n- возможен `IndexOutOfBoundsException`;\n    \n- нет проверки отрицательного номера страницы;\n    \n- нет стабильной сортировки;\n    \n- кэш не инвалидируется после `save()`;\n    \n- обычный `HashMap` не подходит для конкурентного доступа;\n    \n- имена `a`, `b`, `x`, `cs`, `r`, `KT`, `ONPAGE` плохо передают назначение данных.\n    \n\nОтдельный архитектурный вопрос — последовательность:\n\n```java\nrepository.save(contract);\nkafkaTemplate.send(...);\n```\n\nОна сама по себе не гарантирует атомарность между БД и Kafka. Если по требованиям событие обязательно должно соответствовать успешно зафиксированному изменению в БД, обычно рассматривают Transactional Outbox. Но это уже отдельное требование и для базового рефакторинга данного метода не обязательно.\n\n{{< /details >}}"
  filepath = "contract-service"

[[tasks]]
  id = 7
  question = "Исправить SomeServiceImpl и вынести долгий вызов налоговой в асинхронную обработку  "
  answer = "**Условие задачи:**  \nДан высоконагруженный Spring-микросервис, запущенный в Kubernetes в `8` репликах.\n\nСервис выполняет две независимые задачи:\n\n1. `processJobRunning()` раз в час получает из PostgreSQL необработанные возвратные чеки, отправляет событие в аналитику и помечает чек обработанным.\n    \n2. `sendReceipt()` вызывается по HTTP другим микросервисом и отправляет чек во внешнюю налоговую через Feign-клиент. Налоговая может отвечать до `60` секунд, поэтому HTTP-поток не должен ждать её ответа.\n    \n\nНеобходимо провести code review и исправить проблемы с AOP, транзакциями, кэшированием, конкурентным выполнением scheduled-задачи и долгим внешним вызовом.\n\n**Код:**\n\n```java\n@Service\n@AllArgsConstructor\npublic class SomeServiceImpl implements SomeService {\n\n    private final TaxClient taxClient;\n    private final ReceiptDao receiptDao;\n    private final ReceiptTypeDao receiptTypeDao;\n\n    private final ReceiptMapper mapper;\n    private final ReceiptTypeMapper typeMapper;\n    private final RefundReceiptMapper refundReceiptMapper;\n\n    private final SomeService self;\n\n    @Scheduled(cron = \"${cron.expression}\")\n    public void processJobRunning() {\n        List<Receipt> receipts = getRefundReceipts();\n\n        for (Receipt receipt : receipts) {\n            receipt.setProcessed(true);\n\n            eventListener.sendEventToAnalytics(\n                    new SomeEvent(receipt.getId())\n            );\n\n            receiptDao.save(\n                    mapReceipt(mapper.map(receipt))\n            );\n        }\n    }\n\n    @Transactional(readOnly = true)\n    public List<Receipt> getRefundReceipts() {\n        return receiptDao.findAllBySourceAndProcessedFalse(\n                ReceiptSource.REFUND\n        );\n    }\n\n    private Receipt mapReceipt(ReceiptDto receiptDto) {\n        return mapper.map(receiptDto);\n    }\n\n    public void sendReceipt(ReceiptDto receiptDto) {\n        ReceiptSource source =\n                self.getReceiptSource(receiptDto);\n\n        taxClient.sendReceipt(receiptDto, source);\n    }\n\n    @Transactional\n    @Cacheable(\n            value = \"receipt_type\",\n            cacheManager = \"redisCacheManager\"\n    )\n    public ReceiptSource getReceiptSource(\n            ReceiptDto receiptDto\n    ) {\n        Receipt receipt =\n                receiptDao.findById(receiptDto.getId());\n\n        return receipt.getSource();\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `findById()` возвращает `Optional<Receipt>`.  \n💡 Вызов метода с `@Transactional` или `@Cacheable` из того же объекта обходит Spring AOP-прокси.  \n💡 Инъекция собственного интерфейса через конструктор — плохой способ обходить self-invocation и может привести к циклической зависимости.  \n💡 `@Scheduled` выполнится на каждой из восьми реплик — одного `@Scheduled` недостаточно.  \n💡 `@Async` освобождает HTTP-поток, но Feign-вызов всё равно блокирует отдельный worker-thread.  \n💡 Для высоконагруженной системы надёжнее очередь сообщений: Kafka/RabbitMQ + отдельный consumer.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nЗдесь несколько независимых проблем.\n\n**1. `findById()` используется неверно**\n\nSpring Data возвращает:\n\n```java\nOptional<Receipt>\n```\n\nпоэтому запись нужно получать явно:\n\n```java\nreceiptDao.findById(receiptId)\n        .orElseThrow(...);\n```\n\n---\n\n**2. `@Cacheable` и `@Transactional` не работают при self-invocation**\n\nВызов:\n\n```java\nthis.getReceiptSource(...)\n```\n\nне проходит через Spring AOP proxy.\n\nИнъекция:\n\n```java\nprivate final SomeService self;\n```\n\nтоже нежелательна: она создаёт зависимость бина от самого себя и может привести к циклической зависимости.\n\nЛучше вынести получение источника в отдельный Spring-бин:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class ReceiptSourceService {\n\n    private final ReceiptDao receiptDao;\n\n    @Transactional(readOnly = true)\n    @Cacheable(\n            cacheNames = \"receipt_type\",\n            key = \"#receiptId\",\n            cacheManager = \"redisCacheManager\"\n    )\n    public ReceiptSource getReceiptSource(Long receiptId) {\n        return receiptDao.findById(receiptId)\n                .orElseThrow(() ->\n                        new EntityNotFoundException(\n                                \"Receipt not found: \" + receiptId\n                        )\n                )\n                .getSource();\n    }\n}\n```\n\nТеперь вызов идёт между двумя Spring-бинами, поэтому и `@Cacheable`, и `@Transactional` применяются через proxy.\n\nТакже явно задан ключ:\n\n```java\nkey = \"#receiptId\"\n```\n\nВ противном случае Spring использовал бы в качестве ключа весь `ReceiptDto`, что для такого кэша не требуется.\n\n---\n\n**3. Долгий Feign-вызов нельзя выполнять в HTTP-потоке**\n\nМинимальный вариант — вынести его в отдельный бин с `@Async`:\n\n```java\n@Service\n@RequiredArgsConstructor\n@Slf4j\npublic class TaxReceiptSender {\n\n    private final TaxClient taxClient;\n\n    @Async(\"taxExecutor\")\n    public void send(\n            ReceiptDto receipt,\n            ReceiptSource source\n    ) {\n        try {\n            taxClient.sendReceipt(receipt, source);\n        } catch (Exception e) {\n            log.error(\n                    \"Failed to send receipt {} to tax service\",\n                    receipt.getId(),\n                    e\n            );\n\n            throw e;\n        }\n    }\n}\n```\n\nТогда основной сервис выглядит так:\n\n```java\n@Service\n@RequiredArgsConstructor\n@Slf4j\npublic class SomeServiceImpl implements SomeService {\n\n    private final ReceiptDao receiptDao;\n    private final SomeEventListener eventListener;\n    private final ReceiptSourceService receiptSourceService;\n    private final TaxReceiptSender taxReceiptSender;\n\n    @Override\n    public void sendReceipt(ReceiptDto receiptDto) {\n        Objects.requireNonNull(receiptDto, \"receiptDto\");\n        Objects.requireNonNull(receiptDto.getId(), \"receiptDto.id\");\n\n        ReceiptSource source =\n                receiptSourceService.getReceiptSource(\n                        receiptDto.getId()\n                );\n\n        taxReceiptSender.send(receiptDto, source);\n    }\n}\n```\n\n`sendReceipt()` теперь не ждёт до `60` секунд ответа налоговой. Он только ставит задачу на выполнение в `taxExecutor`.\n\nДля `@Async` необходимо включить асинхронность:\n\n```java\n@Configuration\n@EnableAsync\npublic class AsyncConfig {\n\n    @Bean(\"taxExecutor\")\n    public Executor taxExecutor() {\n        ThreadPoolTaskExecutor executor =\n                new ThreadPoolTaskExecutor();\n\n        executor.setCorePoolSize(16);\n        executor.setMaxPoolSize(32);\n        executor.setQueueCapacity(500);\n        executor.setThreadNamePrefix(\"tax-\");\n\n        executor.initialize();\n\n        return executor;\n    }\n}\n```\n\nРазмеры пула и очереди здесь примерные — в реальном сервисе их необходимо выбирать исходя из нагрузки и возможностей налоговой.\n\nВажно: `@Async` **не делает Feign неблокирующим**.\n\nПолучается:\n\n```text\nHTTP thread\n    │\n    ├── submit task\n    │\n    └── быстро освобождается\n\ntaxExecutor thread\n    │\n    └── может ждать Feign до 60 секунд\n```\n\nПоэтому использовать общий executor Spring нельзя — для такого долгого внешнего вызова нужен отдельный ограниченный пул.\n\n---\n\n**4. `@Scheduled` в восьми pod'ах выполнится восемь раз**\n\nЕсли запущено:\n\n```text\npod-1\npod-2\n...\npod-8\n```\n\nто каждый pod независимо вызовет:\n\n```java\n@Scheduled\npublic void processJobRunning()\n```\n\nВ результате один и тот же чек могут одновременно обработать несколько реплик.\n\nДля scheduled-задачи нужен распределённый lock, например через ShedLock с общим хранилищем в PostgreSQL или Redis:\n\n```java\n@Scheduled(cron = \"${cron.expression}\")\n@SchedulerLock(\n        name = \"refund-receipts-job\",\n        lockAtMostFor = \"PT2H\"\n)\npublic void processJobRunning() {\n    List<Receipt> receipts =\n            receiptDao.findAllBySourceAndProcessedFalse(\n                    ReceiptSource.REFUND\n            );\n\n    for (Receipt receipt : receipts) {\n        try {\n            eventListener.sendEventToAnalytics(\n                    new SomeEvent(receipt.getId())\n            );\n\n            receipt.setProcessed(true);\n            receiptDao.save(receipt);\n\n        } catch (Exception e) {\n            log.error(\n                    \"Failed to process receipt {}\",\n                    receipt.getId(),\n                    e\n            );\n        }\n    }\n}\n```\n\nТеперь одновременно job выполняет только одна реплика.\n\nЕсли требуется, наоборот, распределять обработку между всеми pod'ами, вместо глобального lock лучше применять захват записей в PostgreSQL через `FOR UPDATE SKIP LOCKED` или отдельный статус `PROCESSING`.\n\n---\n\n**5. `processed` лучше устанавливать после успешной отправки события**\n\nПоследовательность:\n\n```java\neventListener.sendEventToAnalytics(...);\n\nreceipt.setProcessed(true);\nreceiptDao.save(receipt);\n```\n\nлучше отражает бизнес-смысл: чек считается обработанным только после успешной отправки события.\n\nЕсли отправка события прошла, а сохранение `processed = true` упало, событие может отправиться повторно на следующем запуске.\n\nПо условию событие идемпотентно, поэтому такая семантика `at-least-once` допустима.\n\n---\n\n**6. Лишнее преобразование Receipt → DTO → Receipt**\n\nКонструкция:\n\n```java\nreceiptDao.save(\n        mapReceipt(mapper.map(receipt))\n);\n```\n\nне нужна.\n\nУже имеется объект:\n\n```java\nReceipt receipt\n```\n\nпоэтому достаточно:\n\n```java\nreceiptDao.save(receipt);\n```\n\nПреобразование:\n\n```text\nReceipt\n   ↓\nReceiptDto\n   ↓\nReceipt\n```\n\nтолько создаёт лишние объекты и потенциально может потерять часть данных сущности.\n\n---\n\n**7. `getRefundReceipts()` с `@Transactional` тоже страдал от self-invocation**\n\nВызов:\n\n```java\nprocessJobRunning()\n    ↓\ngetRefundReceipts()\n```\n\nпроисходил внутри того же объекта, поэтому `@Transactional` на `getRefundReceipts()` через Spring AOP не применялся.\n\nВ данном случае отдельный метод вообще необязателен: Spring Data repository самостоятельно выполняет запрос в необходимом repository transaction context.\n\n---\n\n**8. Cron-выражение**\n\nПравильная запись:\n\n```java\n@Scheduled(cron = \"${cron.expression}\")\n```\n\nДля Spring cron обычно содержит шесть полей.\n\nНапример, запуск каждый час в `30:30`:\n\n```text\n30 30 * * * *\n```\n\nа не пятичастное:\n\n```text\n30 30 * * *\n```\n\n---\n\nИтоговый основной сервис:\n\n```java\n@Service\n@RequiredArgsConstructor\n@Slf4j\npublic class SomeServiceImpl implements SomeService {\n\n    private final ReceiptDao receiptDao;\n    private final SomeEventListener eventListener;\n    private final ReceiptSourceService receiptSourceService;\n    private final TaxReceiptSender taxReceiptSender;\n\n    @Scheduled(cron = \"${cron.expression}\")\n    @SchedulerLock(\n            name = \"refund-receipts-job\",\n            lockAtMostFor = \"PT2H\"\n    )\n    public void processJobRunning() {\n        List<Receipt> receipts =\n                receiptDao.findAllBySourceAndProcessedFalse(\n                        ReceiptSource.REFUND\n                );\n\n        for (Receipt receipt : receipts) {\n            try {\n                eventListener.sendEventToAnalytics(\n                        new SomeEvent(receipt.getId())\n                );\n\n                receipt.setProcessed(true);\n                receiptDao.save(receipt);\n\n            } catch (Exception e) {\n                log.error(\n                        \"Failed to process receipt {}\",\n                        receipt.getId(),\n                        e\n                );\n            }\n        }\n    }\n\n    @Override\n    public void sendReceipt(ReceiptDto receiptDto) {\n        Objects.requireNonNull(receiptDto, \"receiptDto\");\n        Objects.requireNonNull(receiptDto.getId(), \"receiptDto.id\");\n\n        ReceiptSource source =\n                receiptSourceService.getReceiptSource(\n                        receiptDto.getId()\n                );\n\n        taxReceiptSender.send(receiptDto, source);\n    }\n}\n```\n\nДля **высоконагруженного production-сервиса** вместо `@Async` предпочтительнее очередь сообщений:\n\n```text\nHTTP request\n    ↓\nsendReceipt()\n    ↓\nKafka / RabbitMQ\n    ↓\nответ вызывающему сервису\n\nconsumer\n    ↓\nTaxClient\n    ↓\nНалоговая\n```\n\nТо есть `sendReceipt()` только публикует команду:\n\n```java\npublic void sendReceipt(ReceiptDto receiptDto) {\n    ReceiptSource source =\n            receiptSourceService.getReceiptSource(\n                    receiptDto.getId()\n            );\n\n    kafkaTemplate.send(\n            \"tax-receipts\",\n            new TaxReceiptCommand(receiptDto, source)\n    );\n}\n```\n\nА отдельный consumer выполняет медленный вызов:\n\n```java\n@KafkaListener(topics = \"tax-receipts\")\npublic void process(TaxReceiptCommand command) {\n    taxClient.sendReceipt(\n            command.receipt(),\n            command.source()\n    );\n}\n```\n\nДля данного сценария это надёжнее `@Async`, потому что:\n\n- запрос не ждёт налоговую;\n    \n- задача не теряется при рестарте pod'а;\n    \n- можно организовать retry;\n    \n- можно использовать DLQ;\n    \n- Kafka обеспечивает backpressure;\n    \n- восемь pod'ов могут параллельно работать как consumer group.\n    \n\nПоэтому `@Async` — нормальное минимальное исправление, а очередь сообщений — предпочтительный вариант для описанного высоконагруженного микросервиса.\n\n{{< /details >}}"
  filepath = "fix-someservice"

[[tasks]]
  id = 8
  question = "Рефакторинг DocumentService с использованием паттерна Strategy"
  answer = "**Условие задачи:**  \nДан `DocumentService`, в котором выбор способа чтения документа жёстко реализован через цепочку `if-else`.\n\nНеобходимо:\n\n- провести code review текущей реализации;\n    \n- выделить её плюсы и минусы;\n    \n- провести рефакторинг с использованием паттерна **Strategy**;\n    \n- сделать добавление новых форматов без изменения `DocumentService`;\n    \n- добавить отдельную стратегию для чтения PDF.\n    \n\n**Код:**\n\n```java\n@Component\npublic class DocumentService {\n\n    public InputStream readDocument(String type) {\n        DocumentReader reader = new DocumentReader();\n\n        if (type.equals(\"PDF\")) {\n            return reader.readPdf();\n        } else if (type.equals(\"DOCX\")) {\n            return reader.readDocx();\n        } else if (type.equals(\"XLSX\")) {\n            return reader.readXlsx();\n        } else {\n            return null;\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Цепочка `if-else` связывает `DocumentService` со всеми поддерживаемыми форматами.  \n💡 При добавлении нового формата приходится изменять существующий сервис — нарушается OCP.  \n💡 `new DocumentReader()` внутри Spring-сервиса ухудшает тестируемость и обходит Dependency Injection.  \n💡 Возврат `null` для неизвестного типа лучше заменить явным исключением.  \n💡 Каждому формату можно предоставить отдельную реализацию общего интерфейса `DocumentReaderStrategy`.  \n💡 Spring умеет автоматически внедрять коллекцию всех реализаций интерфейса.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nУ текущего решения есть один очевидный плюс: для нескольких форматов оно простое и легко читается.\n\nНо по мере роста количества типов появляются проблемы:\n\n- `DocumentService` знает обо всех форматах;\n    \n- каждый новый формат требует изменения `readDocument()`;\n    \n- растёт цепочка `if-else`;\n    \n- `DocumentReader` создаётся через `new`, а не внедряется как зависимость;\n    \n- код сложнее изолированно тестировать;\n    \n- неизвестный формат приводит к `null`, из-за чего ошибка проявится позже.\n    \n\nДля рефакторинга введём общий тип документа:\n\n```java\npublic enum DocumentType {\n    PDF,\n    DOCX,\n    XLSX\n}\n```\n\nИнтерфейс стратегии:\n\n```java\npublic interface DocumentReaderStrategy {\n\n    DocumentType getType();\n\n    InputStream read();\n}\n```\n\nПредположим, существующий `DocumentReader` содержит непосредственно логику чтения и зарегистрирован как Spring-бин:\n\n```java\n@Component\npublic class DocumentReader {\n\n    public InputStream readPdf() {\n        // чтение PDF\n        return null;\n    }\n\n    public InputStream readDocx() {\n        // чтение DOCX\n        return null;\n    }\n\n    public InputStream readXlsx() {\n        // чтение XLSX\n        return null;\n    }\n}\n```\n\nСтратегия для PDF:\n\n```java\n@Component\npublic class PdfDocumentReaderStrategy\n        implements DocumentReaderStrategy {\n\n    private final DocumentReader documentReader;\n\n    public PdfDocumentReaderStrategy(\n            DocumentReader documentReader\n    ) {\n        this.documentReader = documentReader;\n    }\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.PDF;\n    }\n\n    @Override\n    public InputStream read() {\n        return documentReader.readPdf();\n    }\n}\n```\n\nАналогично для DOCX:\n\n```java\n@Component\npublic class DocxDocumentReaderStrategy\n        implements DocumentReaderStrategy {\n\n    private final DocumentReader documentReader;\n\n    public DocxDocumentReaderStrategy(\n            DocumentReader documentReader\n    ) {\n        this.documentReader = documentReader;\n    }\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.DOCX;\n    }\n\n    @Override\n    public InputStream read() {\n        return documentReader.readDocx();\n    }\n}\n```\n\nИ XLSX:\n\n```java\n@Component\npublic class XlsxDocumentReaderStrategy\n        implements DocumentReaderStrategy {\n\n    private final DocumentReader documentReader;\n\n    public XlsxDocumentReaderStrategy(\n            DocumentReader documentReader\n    ) {\n        this.documentReader = documentReader;\n    }\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.XLSX;\n    }\n\n    @Override\n    public InputStream read() {\n        return documentReader.readXlsx();\n    }\n}\n```\n\nТеперь `DocumentService` получает все стратегии от Spring и формирует из них lookup-map:\n\n```java\n@Service\npublic class DocumentService {\n\n    private final Map<DocumentType, DocumentReaderStrategy> strategies;\n\n    public DocumentService(\n            List<DocumentReaderStrategy> strategies\n    ) {\n        Map<DocumentType, DocumentReaderStrategy> strategyMap =\n                new EnumMap<>(DocumentType.class);\n\n        for (DocumentReaderStrategy strategy : strategies) {\n            DocumentReaderStrategy previous =\n                    strategyMap.put(strategy.getType(), strategy);\n\n            if (previous != null) {\n                throw new IllegalStateException(\n                        \"Несколько стратегий для типа \"\n                                + strategy.getType()\n                );\n            }\n        }\n\n        this.strategies = Collections.unmodifiableMap(strategyMap);\n    }\n\n    public InputStream readDocument(String type) {\n        if (type == null || type.isBlank()) {\n            throw new IllegalArgumentException(\n                    \"Тип документа не указан\"\n            );\n        }\n\n        DocumentType documentType;\n\n        try {\n            documentType = DocumentType.valueOf(\n                    type.trim().toUpperCase(Locale.ROOT)\n            );\n        } catch (IllegalArgumentException e) {\n            throw new IllegalArgumentException(\n                    \"Неподдерживаемый тип документа: \" + type,\n                    e\n            );\n        }\n\n        DocumentReaderStrategy strategy =\n                strategies.get(documentType);\n\n        if (strategy == null) {\n            throw new IllegalArgumentException(\n                    \"Нет стратегии для типа: \" + documentType\n            );\n        }\n\n        return strategy.read();\n    }\n}\n```\n\nТеперь выбор реализации выполняется не через:\n\n```java\nif (type.equals(\"PDF\")) {\n    ...\n} else if (type.equals(\"DOCX\")) {\n    ...\n}\n```\n\nа через зарегистрированную стратегию:\n\n```java\nDocumentReaderStrategy strategy =\n        strategies.get(documentType);\n\nreturn strategy.read();\n```\n\nПри добавлении нового формата, например `TXT`, достаточно:\n\n1. добавить тип:\n    \n\n```java\nTXT\n```\n\n2. создать новую стратегию:\n    \n\n```java\n@Component\npublic class TxtDocumentReaderStrategy\n        implements DocumentReaderStrategy {\n\n    @Override\n    public DocumentType getType() {\n        return DocumentType.TXT;\n    }\n\n    @Override\n    public InputStream read() {\n        // чтение TXT\n        return ...;\n    }\n}\n```\n\n`DocumentService` при этом менять не требуется.\n\nЭто и есть основная идея паттерна Strategy:\n\n```text\nDocumentService\n       │\n       ▼\nDocumentReaderStrategy\n       │\n       ├── PdfDocumentReaderStrategy\n       ├── DocxDocumentReaderStrategy\n       └── XlsxDocumentReaderStrategy\n```\n\nSpring автоматически обнаруживает все реализации:\n\n```java\nList<DocumentReaderStrategy> strategies\n```\n\nи передаёт их через constructor injection.\n\nИспользование `Map<DocumentType, DocumentReaderStrategy>` позволяет выбирать стратегию за `O(1)` в среднем и не выполнять линейный поиск по списку при каждом вызове.\n\nОсновные улучшения после рефакторинга:\n\n- устранена цепочка `if-else`;\n    \n- `DocumentService` больше не зависит от конкретных реализаций;\n    \n- соблюдается Open/Closed Principle;\n    \n- зависимости создаются Spring, а не через `new`;\n    \n- новые форматы добавляются отдельными стратегиями;\n    \n- неизвестный формат приводит к понятному исключению, а не к `null`;\n    \n- стратегии легко тестируются отдельно;\n    \n- проверяется ситуация, когда случайно зарегистрированы две стратегии для одного типа.\n    \n\nЕсли `DocumentReader` фактически не содержит общей инфраструктуры, а только методы `readPdf()`, `readDocx()` и `readXlsx()`, его можно вообще убрать и перенести соответствующую логику непосредственно в стратегии. Тогда каждая стратегия будет полностью отвечать за свой формат.\n\n{{< /details >}}"
  filepath = "refactor-document-service"

[[tasks]]
  id = 9
  question = "Исправить BookingService для корректного конкурентного бронирования  "
  answer = "**Условие задачи:**  \nДан Spring-сервис бронирования гостиничных номеров.\n\nУ номера есть два состояния:\n\n- `VACANT` — свободен;\n    \n- `BOOKED` — забронирован.\n    \n\nМетод `bookRoom()` должен забронировать номер за текущим клиентом только в том случае, если номер ещё свободен.\n\nНеобходимо провести code review и объяснить, почему реализация может успешно проходить тесты, но некорректно работать в production при нескольких одновременных запросах.\n\n**Код:**\n\n```java\n@Service\nclass BookingService {\n\n    @Autowired\n    private RoomRepository roomRepository;\n\n    public boolean bookRoom(Integer roomId) {\n        boolean roomBooked = false;\n\n        Room room = roomRepository.findById(roomId);\n\n        if (room.getStatus() == \"VACANT\") {\n            room.setStatus(\"BOOKED\");\n            room.setClientId(SecurityContext.getClientId());\n\n            roomRepository.save(room);\n            roomBooked = true;\n        }\n\n        return roomBooked;\n    }\n}\n\n@Entity\nclass Room {\n\n    @Id\n    private Integer id;\n\n    private String status;\n    private String clientId;\n    private String roomNumber;\n}\n\npublic interface RoomRepository\n        extends JpaRepository<Room, Integer> {\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Главная проблема проявится, когда два запроса одновременно попытаются забронировать один номер.  \n💡 Простого `@Transactional` недостаточно: две транзакции всё равно могут одновременно прочитать `VACANT`.  \n💡 `synchronized` также не решает задачу в нескольких экземплярах приложения.  \n💡 Самый простой вариант — выполнить атомарный `UPDATE ... WHERE status = VACANT` и проверить количество изменённых строк.  \n💡 Статус лучше представить через `enum`, а не через `String`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновная проблема — **race condition**.\n\nПредставим два одновременных запроса:\n\n```text\nКлиент A                     Клиент B\n   │                            │\n   ├─ читает Room              ├─ читает Room\n   │  status = VACANT          │  status = VACANT\n   │                            │\n   ├─ status = BOOKED          ├─ status = BOOKED\n   ├─ clientId = A             ├─ clientId = B\n   │                            │\n   └─ save()                   └─ save()\n```\n\nОба запроса увидели свободный номер и оба считают, что успешно его забронировали.\n\nВ результате последний `UPDATE` перезапишет `clientId` первого клиента.\n\nИменно поэтому проблема может почти не проявляться на тестовом стенде с небольшой нагрузкой, но регулярно возникать в production.\n\n---\n\nОптимальный для данного случая вариант — выполнить проверку статуса и изменение записи **одной атомарной SQL-операцией**.\n\nСначала лучше заменить строковый статус на `enum`:\n\n```java\npublic enum RoomStatus {\n    VACANT,\n    BOOKED\n}\n```\n\nСущность:\n\n```java\n@Entity\npublic class Room {\n\n    @Id\n    private Integer id;\n\n    @Enumerated(EnumType.STRING)\n    private RoomStatus status;\n\n    private String clientId;\n    private String roomNumber;\n}\n```\n\nРепозиторий:\n\n```java\npublic interface RoomRepository\n        extends JpaRepository<Room, Integer> {\n\n    @Modifying\n    @Query(\"\"\"\n            update Room r\n               set r.status = :booked,\n                   r.clientId = :clientId\n             where r.id = :roomId\n               and r.status = :vacant\n            \"\"\")\n    int bookIfVacant(\n            @Param(\"roomId\") Integer roomId,\n            @Param(\"clientId\") String clientId,\n            @Param(\"vacant\") RoomStatus vacant,\n            @Param(\"booked\") RoomStatus booked\n    );\n}\n```\n\nСервис:\n\n```java\n@Service\npublic class BookingService {\n\n    private final RoomRepository roomRepository;\n\n    public BookingService(RoomRepository roomRepository) {\n        this.roomRepository = roomRepository;\n    }\n\n    @Transactional\n    public boolean bookRoom(Integer roomId) {\n        Objects.requireNonNull(roomId, \"roomId\");\n\n        String clientId = SecurityContext.getClientId();\n\n        if (clientId == null || clientId.isBlank()) {\n            throw new IllegalStateException(\n                    \"Не удалось определить клиента\"\n            );\n        }\n\n        int updated = roomRepository.bookIfVacant(\n                roomId,\n                clientId,\n                RoomStatus.VACANT,\n                RoomStatus.BOOKED\n        );\n\n        return updated == 1;\n    }\n}\n```\n\nКлючевая операция фактически сводится к:\n\n```sql\nUPDATE room\nSET status = 'BOOKED',\n    client_id = :clientId\nWHERE id = :roomId\n  AND status = 'VACANT';\n```\n\nЕсли два запроса одновременно пытаются забронировать один номер, успешно изменить строку сможет только один из них.\n\nРезультат будет примерно таким:\n\n```text\nКлиент A:\nUPDATE ... WHERE status = VACANT\n→ updated = 1\n→ true\n\nКлиент B:\nUPDATE ... WHERE status = VACANT\n→ updated = 0\n→ false\n```\n\nТо есть проверка:\n\n```text\nсвободен ли номер?\n```\n\nи действие:\n\n```text\nзабронировать номер\n```\n\nбольше не являются двумя отдельными операциями. Они выполняются атомарно на стороне БД.\n\nЭто особенно важно, если приложение запущено в нескольких pod'ах:\n\n```text\npod-1 ─┐\npod-2 ─┤\npod-3 ─┼── PostgreSQL\n...    │\npod-N ─┘\n```\n\nИспользовать:\n\n```java\nsynchronized\n```\n\nдля решения этой проблемы недостаточно. Он синхронизирует потоки только внутри одного JVM-процесса и никак не защищает от параллельного запроса из другого pod'а.\n\n---\n\nЕсть и другие проблемы в исходном коде.\n\n`JpaRepository.findById()` возвращает:\n\n```java\nOptional<Room>\n```\n\nпоэтому такой код некорректен:\n\n```java\nRoom room = roomRepository.findById(roomId);\n```\n\nПри обычном чтении требовалось бы:\n\n```java\nRoom room = roomRepository.findById(roomId)\n        .orElseThrow(() ->\n                new EntityNotFoundException(\n                        \"Room not found: \" + roomId\n                )\n        );\n```\n\nНо в предложенном варианте предварительное чтение вообще не требуется.\n\nТакже нельзя сравнивать строки так:\n\n```java\nroom.getStatus() == \"VACANT\"\n```\n\n`==` сравнивает ссылки на объекты, а не содержимое строк.\n\nМожно было бы написать:\n\n```java\n\"VACANT\".equals(room.getStatus())\n```\n\nно для конечного набора состояний лучше использовать `enum`.\n\n---\n\nПростое добавление:\n\n```java\n@Transactional\npublic boolean bookRoom(...)\n```\n\n**не решает гонку само по себе**.\n\nПри стандартном уровне изоляции две транзакции могут выполнить:\n\n```text\nT1: SELECT → VACANT\nT2: SELECT → VACANT\n```\n\nи затем обе попытаться изменить запись.\n\nТранзакция обеспечивает атомарность набора операций, но не превращает последовательность `SELECT → проверка → UPDATE` автоматически в взаимное исключение.\n\n---\n\nАльтернативный вариант — пессимистическая блокировка:\n\n```java\n@Lock(LockModeType.PESSIMISTIC_WRITE)\n@Query(\"select r from Room r where r.id = :id\")\nOptional<Room> findByIdForUpdate(\n        @Param(\"id\") Integer id\n);\n```\n\nи затем:\n\n```java\n@Transactional\npublic boolean bookRoom(Integer roomId) {\n    Room room = roomRepository.findByIdForUpdate(roomId)\n            .orElseThrow();\n\n    if (room.getStatus() != RoomStatus.VACANT) {\n        return false;\n    }\n\n    room.setStatus(RoomStatus.BOOKED);\n    room.setClientId(SecurityContext.getClientId());\n\n    return true;\n}\n```\n\nВторая транзакция будет ждать освобождения блокировки первой.\n\nТакой подход корректен, но для простой операции «забронировать, только если свободно» условный `UPDATE` обычно проще и требует меньше работы:\n\n```text\nSELECT + LOCK + UPDATE\n```\n\nпротив:\n\n```text\nUPDATE ... WHERE status = VACANT\n```\n\n---\n\nЕщё один вариант — optimistic locking через:\n\n```java\n@Version\nprivate Long version;\n```\n\nТогда при конкурентном изменении одна из транзакций получит `OptimisticLockException`.\n\nЭто удобно для более сложной бизнес-логики, но для конкретной задачи атомарный conditional update является наиболее прямым решением.\n\nОсновные проблемы исходного кода:\n\n- возможна двойная бронь из-за race condition;\n    \n- `@Transactional` без блокировки не устраняет гонку;\n    \n- `synchronized` не работает между pod'ами;\n    \n- `findById()` возвращает `Optional`;\n    \n- строки сравниваются через `==`;\n    \n- статус лучше хранить как `enum`;\n    \n- используется field injection;\n    \n- выполняются лишние `SELECT` и `save()`, хотя задачу можно решить одним `UPDATE`.\n    \n\nДля данного сценария предпочтительная схема:\n\n```text\nbookRoom()\n    ↓\nUPDATE room\nWHERE id = ?\n  AND status = VACANT\n    ↓\nupdated == 1 → бронь успешна\nupdated == 0 → номер уже занят или отсутствует\n```\n\nОна корректно работает и при нескольких потоках, и при нескольких экземплярах приложения.\n\n{{< /details >}}"
  filepath = "booking-service-refactor"

