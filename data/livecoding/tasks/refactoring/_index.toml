  id = 19
  question = "Сделать ревью AccountResource и BalanceService"
  answer = "**Условие задачи:**  \nДан код для создания банковских счетов, поиска по номеру счёта и изменения баланса. Нужно провести code review: найти ошибки, риски и предложить улучшения.\n\n**Код:**\n\n```java\n@Data\n@Entity\npublic class Account {\n\n    @Id\n    private Long id;\n\n    private String accountNumber;\n    private String bic;\n    private Double amount;\n}\n\npublic interface AccountRepository\n        extends JpaRepository<Account, Long> {\n\n    List<Account> findByAccountNumber(String accountNumber);\n}\n\n@RestController\n@RequiredArgsConstructor\npublic class AccountResource {\n\n    private final AccountRepository accountRepository;\n    private final BalanceService balanceService;\n\n    @GetMapping(\n            value = \"\"\"\"/accounts/add\"\"\"\",\n            produces = MediaType.APPLICATION_JSON_VALUE\n    )\n    Account add(Account account) {\n        return accountRepository.save(account);\n    }\n\n    @GetMapping(\n            value = \"\"\"\"/accounts/{accountNumber}\"\"\"\",\n            produces = MediaType.APPLICATION_JSON_VALUE\n    )\n    List<Account> findByAccountNumber(\n            @PathVariable(\"\"\"\"accountNumber\"\"\"\") String accountNumber\n    ) {\n        return accountRepository.findByAccountNumber(accountNumber);\n    }\n\n    @PutMapping(\n            value = \"\"\"\"/accounts/{id}/change\"\"\"\",\n            produces = MediaType.APPLICATION_JSON_VALUE\n    )\n    Account changeBalance(\n            @PathVariable(\"\"\"\"id\"\"\"\") Long id,\n            @RequestParam(\"\"\"\"diff\"\"\"\") Double diff\n    ) {\n        return balanceService.change(id, diff);\n    }\n}\n\n@Service\npublic class BalanceService {\n\n    @Autowired\n    AccountRepository accountRepository;\n\n    public Account change(Long id, Double diff) {\n        Account account = accountRepository.getOne(id);\n        account.setAmount(account.getAmount() + diff);\n        return accountRepository.save(account);\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Создание ресурса не должно выполняться через `GET`.  \n💡 Для денежных значений нужен `BigDecimal`.  \n💡 Подумай, корректна ли схема `прочитать баланс → изменить → сохранить` при двух одновременных запросах.  \n💡 `getOne()` не подходит для явной обработки отсутствующей записи.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- создание счёта выполняется через `GET`, хотя это изменяющая операция;\n    \n- `Account` напрямую используется как REST request/response;\n    \n- контроллер напрямую вызывает `AccountRepository`;\n    \n- отсутствует валидация входных данных;\n    \n- `Double` используется для денег;\n    \n- изменение баланса через `PUT` с `diff` неидемпотентно;\n    \n- в `BalanceService` используется field injection;\n    \n- нет явной транзакционной границы;\n    \n- `getOne()` устарел и возвращает proxy вместо явной проверки существования записи;\n    \n- возможен lost update при конкурентном изменении одного баланса;\n    \n- не обработана ситуация отсутствующего счёта;\n    \n- не определено поведение при отрицательном балансе;\n    \n- на уровне БД не заданы ограничения для обязательных полей;\n    \n- `@Data` нежелателен для JPA entity из-за автоматически генерируемых `equals()`, `hashCode()` и `toString()`;\n    \n- если `accountNumber` должен быть уникальным, это необходимо гарантировать в БД, а не только кодом.\n    \n\n**Как лучше исправить**\n\nДля создания счёта использовать `POST` и отдельный DTO:\n\n```java\n@PostMapping(\"/accounts\")\n@ResponseStatus(HttpStatus.CREATED)\npublic AccountResponse create(\n        @Valid @RequestBody CreateAccountRequest request\n) {\n    return accountService.create(request);\n}\n```\n\nДля денег использовать `BigDecimal`, а изменение на величину `diff` логичнее оформить через `PATCH` или отдельную команду.\n\nВ сервисе — constructor injection и транзакция:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class BalanceService {\n\n    private final AccountRepository accountRepository;\n\n    @Transactional\n    public Account change(Long id, BigDecimal diff) {\n        Objects.requireNonNull(id, \"id\");\n        Objects.requireNonNull(diff, \"diff\");\n\n        Account account = accountRepository.findById(id)\n                .orElseThrow(() ->\n                        new EntityNotFoundException(\n                                \"Account not found: \" + id\n                        )\n                );\n\n        account.setAmount(\n                account.getAmount().add(diff)\n        );\n\n        return account;\n    }\n}\n```\n\nНо одной `@Transactional` недостаточно для конкурентных запросов. Два потока могут прочитать одинаковый баланс и перезаписать результат друг друга.\n\nДля простой операции изменения суммы лучше выполнить атомарный `UPDATE`:\n\n```java\n@Modifying\n@Query(\"\"\"\n        update Account a\n           set a.amount = a.amount + :diff\n         where a.id = :id\n        \"\"\")\nint changeAmount(\n        @Param(\"id\") Long id,\n        @Param(\"diff\") BigDecimal diff\n);\n```\n\nЕсли отрицательный баланс запрещён, проверку также стоит включить в этот запрос:\n\n```sql\nAND amount + :diff >= 0\n```\n\nТогда проверка и изменение выполняются атомарно на стороне БД.\n\nДля entity стоит использовать `BigDecimal`, добавить необходимые `NOT NULL`/`UNIQUE` ограничения согласно бизнес-требованиям и вместо `@Data` предпочесть `@Getter` / `@Setter`.\n\n{{< /details >}}"
  filepath = "account-balance-review"

