  id = 20
  question = "Сделать ревью потокобезопасного сервиса сохранения заданий и работ  "
  answer = "**Условие задачи:**  \nДан Spring-сервис, который должен сохранять сущности двух типов — `Task` и `Work`. Сервис может вызываться одновременно из REST-контроллера и Kafka listener.\n\nНужно провести code review, проверить корректность многопоточной работы и выполнить рефакторинг так, чтобы сервис безопасно обрабатывал параллельные вызовы и корректно сохранял сущность нужного типа.\n\n**Код:**\n\n```java\n@Component\npublic class MyShinyService {\n\n    @Autowired\n    private final TaskRepository taskRepository;\n\n    @Autowired\n    private final WorkRepository workRepository;\n\n    // for concurrency safety\n    private final Task task;\n\n    @Transactional\n    public synchronized accumulateTask(Task task) {\n        this.task = task;\n    }\n\n    @Transactional\n    public synchronized void saveTask() {\n        System.out.println(\"\"saving process has started\"\");\n\n        String task = \"\"task\"\";\n\n        if (this.task.type == task) {\n            this.taskRepository.save(\n                    new TaskEntity(\n                            UUID.randomUUID(),\n                            this.task.id.toString(),\n                            this.task.name\n                    )\n            );\n        } else {\n            this.workRepository.save(\n                    new WorkEntity(\n                            UUID.randomUUID(),\n                            this.task.id.toString(),\n                            this.task.name\n                    )\n            );\n        }\n\n        System.out.println(\"\"saved\"\");\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Проверь, компилируются ли `final`-поля и `accumulateTask()`.  \n💡 Spring-сервис обычно singleton, поэтому хранить текущую задачу в поле опасно.  \n💡 Два `synchronized`-метода не делают цепочку из двух вызовов атомарной.  \n💡 Для REST и Kafka стоит учитывать повторную обработку одного задания.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- `accumulateTask()` не имеет возвращаемого типа;\n    \n- `taskRepository`, `workRepository` и `task` объявлены `final`, но не инициализируются конструктором;\n    \n- `this.task = task` невозможно для `final`-поля;\n    \n- сервис хранит изменяемое состояние в singleton-бине;\n    \n- `synchronized` защищает каждый метод отдельно, но не всю последовательность `accumulateTask()` → `saveTask()`;\n    \n- `saveTask()` может быть вызван до установки `task`;\n    \n- `synchronized` не защищает между несколькими экземплярами приложения;\n    \n- строки сравниваются через `==`;\n    \n- `@Transactional` на `accumulateTask()` не нужен — там нет работы с БД;\n    \n- field injection лучше заменить constructor injection;\n    \n- строковый тип лучше заменить на `enum`;\n    \n- `System.out.println()` лучше заменить логгером;\n    \n- при Kafka redelivery или REST retry возможны дубликаты.\n    \n\n**Главная проблема — состояние внутри сервиса.**\n\nНапример:\n\n```text\nThread 1: accumulateTask(task1)\nThread 2: accumulateTask(task2)\nThread 1: saveTask()\n```\n\nК моменту `saveTask()` в поле уже находится `task2`. Поэтому безопаснее вообще не хранить текущую задачу в сервисе, а передавать её непосредственно в метод сохранения.\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class MyShinyService {\n\n    private final TaskRepository taskRepository;\n    private final WorkRepository workRepository;\n\n    @Transactional\n    public UUID save(Task task) {\n        validate(task);\n\n        UUID entityId = UUID.randomUUID();\n\n        switch (task.getType()) {\n            case TASK -> taskRepository.save(\n                    new TaskEntity(\n                            entityId,\n                            task.getId().toString(),\n                            task.getName()\n                    )\n            );\n\n            case WORK -> workRepository.save(\n                    new WorkEntity(\n                            entityId,\n                            task.getId().toString(),\n                            task.getName()\n                    )\n            );\n        }\n\n        return entityId;\n    }\n\n    private void validate(Task task) {\n        if (task == null\n                || task.getId() == null\n                || task.getType() == null\n                || task.getName() == null\n                || task.getName().isBlank()) {\n            throw new IllegalArgumentException(\n                    \"Invalid task\"\n            );\n        }\n    }\n}\n```\n\nТип лучше задать явно:\n\n```java\npublic enum TaskType {\n    TASK,\n    WORK\n}\n```\n\nТеперь сервис **stateless**: каждый вызов работает только со своим объектом, поэтому `synchronized` не нужен.\n\nЕсли метод вызывается из Kafka или REST с возможными retry, дополнительно нужна идемпотентность. Например, исходный `task.id` можно хранить с `UNIQUE`-ограничением, чтобы повторная обработка не создавала вторую запись.\n\n{{< /details >}}"
  filepath = "thread-safe-task-work-service-review"

[[tasks]]
  id = 21
  question = "Сделать ревью метода поиска товаров по фильтру"
  answer = "**Условие задачи:**  \nИнтернет-магазин обрабатывает около 200 запросов в секунду. Пользователь задаёт фильтры по цене, рейтингу и другим параметрам, после чего сервис ищет подходящие товары.\n\nПримерно в половине запросов подходящих товаров нет. Нужно провести code review метода и определить, как уменьшить лишнюю нагрузку на БД и улучшить API метода.\n\n**Код:**\n\n```java\nclass ServiceImpl {\n\n    // 200 RPS\n    // 50% -> return new ArrayList<>();\n    ArrayList<Product> find(Filter filter) {\n        int count = productRepo.count(filter);\n\n        if (count > 0) {\n            return productRepo.find(filter);\n        }\n\n        return new ArrayList<>();\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Предварительный `count()` здесь не нужен.  \n💡 Для найденных товаров сейчас выполняются два запроса в БД.  \n💡 Лучше зависеть от `List<Product>`, а не от конкретного `ArrayList`.  \n💡 Для большого каталога стоит подумать о пагинации и индексах.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- перед поиском выполняется лишний `count()`;\n    \n- для непустого результата получается два запроса: `COUNT` + `SELECT`;\n    \n- при 200 RPS и 50% непустых результатов это примерно 300 запросов к БД вместо 200;\n    \n- возвращается конкретный `ArrayList<Product>` вместо интерфейса `List<Product>`;\n    \n- вручную создаётся пустой список, хотя поиск сам может вернуть пустой результат;\n    \n- нет проверки `filter`;\n    \n- при большом количестве результатов отсутствует пагинация;\n    \n- для часто используемых условий фильтрации могут потребоваться подходящие индексы.\n    \n\n**Как лучше исправить**\n\nПредварительный `count()` не нужен — сразу выполняем поиск:\n\n```java\nclass ServiceImpl {\n\n    List<Product> find(Filter filter) {\n        if (filter == null) {\n            throw new IllegalArgumentException(\n                    \"Filter must not be null\"\n            );\n        }\n\n        return productRepo.find(filter);\n    }\n}\n```\n\nЕсли товаров нет, нормальный контракт repository — вернуть пустую коллекцию.\n\nДля большого каталога лучше добавить пагинацию:\n\n```java\nPage<Product> find(\n        Filter filter,\n        Pageable pageable\n) {\n    return productRepo.find(filter, pageable);\n}\n```\n\nЕсли общее количество найденных товаров клиенту не требуется, лучше рассмотреть `Slice<Product>`: тогда не нужен дополнительный запрос для подсчёта общего количества записей.\n\nТакже стоит проверить индексы по наиболее селективным и часто используемым полям фильтрации и ограничить максимальный размер страницы.\n\nГлавное исправление — **не выполнять `COUNT` перед `SELECT`, если данные всё равно нужно получить**.\n\n{{< /details >}}"
  filepath = "product-filter-service-review"

[[tasks]]
  id = 22
  question = "Отрефакторить код регистрации пользователя"
  answer = "**Условие задачи:**  \nДан код регистрации пользователя. В процессе регистрации пользователь сохраняется через DAO, формируется отчёт, отправляется уведомление и пишется лог.\n\nНужно провести code review, найти ошибки компиляции, проблемы с архитектурой и безопасностью, а затем выполнить рефакторинг.\n\n**Код:**\n\n```java\npublic interface UserDao {\n    void save(UserDto userDto);\n}\n```\n\n```java\npublic class UserDaoImplementation implements UserDao {\n\n    @Override\n    public void save(UserDto userDto) {\n        System.out.println(\"Save user.\");\n    }\n}\n```\n\n```java\npublic class UserDaoFastImplementation implements UserDao {\n\n    @Override\n    public void save(UserDto userDto) {\n        System.out.println(\"Save user.\");\n    }\n\n    public void saveFast(String username, String password) {\n        System.out.println(\"Save user optimized.\");\n    }\n}\n```\n\n```java\npublic record UserDto(String username, String password) {\n}\n```\n\n```java\npublic class Main {\n\n    public static void main(String[] args) {\n        var logger = LoggerFactory.getLogger(\"org.example\");\n        var userDao = new UserDaoImplementation();\n        var jsonMapper = new JsonMapper();\n        var notificationService = new EmailNotificationService();\n\n        var registerService = new RegisterUserService(\n                logger,\n                jsonMapper,\n                userDao,\n                notificationService\n        );\n\n        var newUserDto = new UserDto(\n                \"test-username\",\n                \"test-password\"\n        );\n\n        registerService.register(newUserDto);\n    }\n}\n```\n\n```java\npublic class RegisterUserService {\n\n    private final Logger logger;\n    private final JsonMapper jsonMapper;\n    private final UserDao userDao;\n    private final EmailNotificationService emailNotificationService;\n\n    public RegisterUserService(\n            Logger logger,\n            JsonMapper jsonMapper,\n            UserDao userDao,\n            EmailNotificationService emailNotificationService\n    ) {\n        this.logger = logger;\n        this.jsonMapper = jsonMapper;\n        this.userDao = userDao;\n        this.emailNotificationService = emailNotificationService;\n    }\n\n    public void register(UserDto userDto) {\n        logger.info(\n                \"Start registration for user: {}\",\n                userDto.username()\n        );\n\n        if (userDao instanceof UserDaoFastImplementation) {\n            ((UserDaoFastImplementation) userDao).saveFast(\n                    userDto.username(),\n                    userDto.password()\n            );\n        } else {\n            userDao.save(userDto);\n        }\n\n        try {\n            saveReportToFile(userDto);\n        } catch (IOException e) {\n            logger.error(\n                    \"Save report to file for user {} failed!\",\n                    userDto.username()\n            );\n        }\n\n        emailNotificationService.sendEmailNotification();\n\n        logger.info(\n                \"User: {} with password: {}, registered\",\n                userDto.username(),\n                userDto.password()\n        );\n    }\n\n    private void saveReportToFile(UserDto userDto)\n            throws IOException {\n\n        FileOutputStream outputStream =\n                new FileOutputStream(\n                        \"/tmp/registered-users-report.csv\"\n                );\n\n        byte[] strToBytes =\n                jsonMapper.writeValueAsBytes(userDto);\n\n        outputStream.write(strToBytes);\n        outputStream.close();\n    }\n}\n```\n\n```java\npublic final class EmailNotificationService {\n\n    public void sendEmailNotification() {\n        System.out.println(\"Send email notification\");\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Проверь, откуда импортируется `UserDto` в `RegisterUserService`.  \n💡 `RegisterUserService` не должен знать конкретные реализации `UserDao`.  \n💡 Пароль нельзя писать в лог и отчёт.  \n💡 Работу с файлом лучше вынести из сервиса регистрации.  \n💡 Проверь соответствие расширения файла его содержимому и режим открытия файла.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- в `RegisterUserService` указан неправильный импорт `UserDto`: DTO находится в `org.example.dto`;\n    \n- `instanceof UserDaoFastImplementation` нарушает полиморфизм и OCP;\n    \n- `saveFast()` отсутствует в контракте `UserDao`;\n    \n- сервис регистрации одновременно занимается persistence, отчётом, уведомлением и логированием;\n    \n- отсутствует валидация `UserDto`;\n    \n- пароль попадает в лог;\n    \n- пароль попадает в файл вместе с `UserDto`;\n    \n- для реальной регистрации пароль нельзя сохранять в открытом виде;\n    \n- `FileOutputStream` закрывается вручную;\n    \n- файл имеет расширение `.csv`, но записывается JSON;\n    \n- файл перезаписывается при каждой регистрации;\n    \n- ошибка сохранения отчёта фактически только логируется, нужно явно определить допустима ли регистрация без отчёта;\n    \n- `System.out.println()` в DAO и notification лучше заменить нормальной реализацией/логированием.\n    \n\n**Как лучше исправить**\n\nСервис должен работать только с интерфейсом:\n\n```java\npublic interface UserDao {\n    void save(UserDto userDto);\n}\n```\n\nОптимизированная реализация должна переопределять тот же метод:\n\n```java\npublic class UserDaoFastImplementation implements UserDao {\n\n    @Override\n    public void save(UserDto userDto) {\n        System.out.println(\"Save user optimized.\");\n    }\n}\n```\n\nТогда `instanceof` больше не нужен.\n\n```java\npublic class RegisterUserService {\n\n    private final Logger logger;\n    private final UserDao userDao;\n    private final RegistrationReportService reportService;\n    private final EmailNotificationService notificationService;\n\n    public RegisterUserService(\n            Logger logger,\n            UserDao userDao,\n            RegistrationReportService reportService,\n            EmailNotificationService notificationService\n    ) {\n        this.logger = logger;\n        this.userDao = userDao;\n        this.reportService = reportService;\n        this.notificationService = notificationService;\n    }\n\n    public void register(UserDto userDto) {\n        validate(userDto);\n\n        logger.info(\n                \"Start registration for user: {}\",\n                userDto.username()\n        );\n\n        userDao.save(userDto);\n        reportService.save(userDto.username());\n        notificationService.sendEmailNotification();\n\n        logger.info(\n                \"User {} registered\",\n                userDto.username()\n        );\n    }\n\n    private void validate(UserDto userDto) {\n        if (userDto == null\n                || userDto.username() == null\n                || userDto.username().isBlank()\n                || userDto.password() == null\n                || userDto.password().isBlank()) {\n            throw new IllegalArgumentException(\n                    \"Invalid user data\"\n            );\n        }\n    }\n}\n```\n\nОтчёт лучше вынести в отдельный компонент и не сохранять в нём пароль:\n\n```java\npublic class RegistrationReportService {\n\n    private static final Path REPORT =\n            Path.of(\"/tmp/registered-users-report.csv\");\n\n    public void save(String username) {\n        try {\n            Files.writeString(\n                    REPORT,\n                    username + System.lineSeparator(),\n                    StandardOpenOption.CREATE,\n                    StandardOpenOption.APPEND\n            );\n        } catch (IOException e) {\n            throw new IllegalStateException(\n                    \"Unable to save registration report\",\n                    e\n            );\n        }\n    }\n}\n```\n\nДля настоящей системы пароль перед сохранением должен быть захеширован подходящим password encoder. В логах и отчётах пароль хранить нельзя.\n\nГлавная идея рефакторинга: **убрать зависимость от конкретной реализации DAO, разделить обязанности и исключить утечку пароля**.\n\n{{< /details >}}"
  filepath = "user-registration-refactor"

[[tasks]]
  id = 23
  question = "Исправить ошибки в OrderService"
  answer = "**Условие задачи:**  \nДан сервис изменения статуса заказа. Нужно провести code review и исправить ошибки: корректно получать и сохранять заказ, обрабатывать входные данные и статусы, а также правильно отправлять уведомления при завершении или отмене заказа.\n\n**Код:**\n\n```java\npublic class OrderService {\n\n    @Autowired\n    private OrderRepository orderRepository;\n\n    private final NotificationService notificationService;\n\n    @Autowired\n    public OrderService(NotificationService notificationService) {\n        this.notificationService = notificationService;\n    }\n\n    public void updateOrderStatus(Long orderId, String newStatus) {\n        Order order = orderRepository.findById(orderId);\n\n        if (newStatus.equals(\"\"COMPLETED\"\")) {\n            order.setStatus(\"\"COMPLETED\"\");\n            notificationService.notify(\n                    order.getUserId(),\n                    \"\"Your order is completed\"\"\n            );\n        } else if (newStatus.equals(\"\"CANCELLED\"\")) {\n            order.setStatus(\"\"CANCELLED\"\");\n            notificationService.notify(\n                    order.getUserId(),\n                    \"\"Your order is cancelled\"\"\n            );\n        } else if (newStatus.equals(\"\"PENDING\"\")) {\n            order.setStatus(\"\"PENDING\"\");\n            orderRepository.save(order);\n        } else if (newStatus.equals(\"\"IN_PROGRESS\"\")) {\n            order.setStatus(\"\"IN_PROGRESS\"\");\n            orderRepository.save(order);\n        } else {\n            throw new IllegalArgumentException(\n                    \"\"Unsupported status: \"\" + newStatus\n            );\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй один способ Dependency Injection.  \n💡 Проверь результат `findById()`.  \n💡 Статусы лучше представить через `enum`.  \n💡 В некоторых ветках изменённый заказ вообще не сохраняется.  \n💡 Уведомление желательно отправлять только после успешного изменения заказа.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n**Проблемы:**\n\n- смешаны field injection и constructor injection;\n    \n- если `OrderRepository` — Spring Data repository, `findById()` возвращает `Optional<Order>`;\n    \n- нет проверки `orderId` и `newStatus`;\n    \n- при `newStatus == null` возникнет `NullPointerException`;\n    \n- статусы представлены строками;\n    \n- для `COMPLETED` и `CANCELLED` заказ не сохраняется;\n    \n- логика сохранения дублируется по веткам;\n    \n- нет транзакции;\n    \n- уведомление отправляется до гарантированного commit;\n    \n- не проверяются допустимые переходы статусов, например `CANCELLED → COMPLETED`;\n    \n- если класс не зарегистрирован другим способом, ему нужен `@Service`.\n    \n\n**Как лучше исправить**\n\nСделать constructor injection, преобразовать строку в `enum`, один раз изменить и сохранить статус:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n\n    private final OrderRepository orderRepository;\n    private final NotificationService notificationService;\n\n    @Transactional\n    public void updateOrderStatus(\n            Long orderId,\n            String newStatus\n    ) {\n        if (orderId == null) {\n            throw new IllegalArgumentException(\n                    \"orderId must not be null\"\n            );\n        }\n\n        if (newStatus == null || newStatus.isBlank()) {\n            throw new IllegalArgumentException(\n                    \"newStatus must not be blank\"\n            );\n        }\n\n        Order order = orderRepository.findById(orderId)\n                .orElseThrow(() ->\n                        new EntityNotFoundException(\n                                \"Order not found: \" + orderId\n                        )\n                );\n\n        OrderStatus status;\n\n        try {\n            status = OrderStatus.valueOf(\n                    newStatus.trim().toUpperCase(Locale.ROOT)\n            );\n        } catch (IllegalArgumentException e) {\n            throw new IllegalArgumentException(\n                    \"Unsupported status: \" + newStatus\n            );\n        }\n\n        if (order.getStatus() == status) {\n            return;\n        }\n\n        order.setStatus(status);\n        orderRepository.save(order);\n\n        if (status == OrderStatus.COMPLETED) {\n            notificationService.notify(\n                    order.getUserId(),\n                    \"Your order is completed\"\n            );\n        } else if (status == OrderStatus.CANCELLED) {\n            notificationService.notify(\n                    order.getUserId(),\n                    \"Your order is cancelled\"\n            );\n        }\n    }\n}\n```\n\n```java\npublic enum OrderStatus {\n    PENDING,\n    IN_PROGRESS,\n    COMPLETED,\n    CANCELLED\n}\n```\n\nВ реальном сервисе уведомление лучше отправлять **после успешного commit**, например через `@TransactionalEventListener(AFTER_COMMIT)` или outbox.\n\nЕсли у заказа есть бизнес-правила переходов между статусами, их также стоит проверять отдельно, а не разрешать произвольную замену статуса.\n\n{{< /details >}}"
  filepath = "order-service-fix-status"

