  id = 22
  question = "Сделать ревью потокобезопасного сервиса сохранения заданий и работ"
  answer = "**Условие задачи:**  \n📌 Стажёр реализовал потокобезопасный сервис сохранения сущностей «Задание» и «Работа». Вызывающим слоем может быть REST, Kafka или оба варианта. Нужно провести code review и предложить улучшенный вариант.\n\n**Код:**\n\n```java\n@Component\npublic class MyShinyService {\n\n    @Autowired\n    private final TaskRepository taskRepository;\n\n    @Autowired\n    private final WorkRepository workRepository;\n\n    // for concurrency safety\n    private final Task task;\n\n    @Transactional\n    public synchronized accumulateTask(Task task) {\n        this.task = task;\n    }\n\n    @Transactional\n    public synchronized void saveTask() {\n        System.out.println(\"saving process has started\");\n\n        String task = \"task\";\n\n        if (this.task.type == task) {\n            this.taskRepository.save(\n                    new TaskEntity(\n                            UUID.randomUUID(),\n                            this.task.id.toString(),\n                            this.task.name\n                    )\n            );\n        } else {\n            this.workRepository.save(\n                    new WorkEntity(\n                            UUID.randomUUID(),\n                            this.task.id.toString(),\n                            this.task.name\n                    )\n            );\n        }\n\n        System.out.println(\"saved\");\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Код не скомпилируется: у `accumulateTask()` нет возвращаемого типа.  \n💡 Поле `task` объявлено `final`, но позже ему присваивается новое значение.  \n💡 Spring-сервис по умолчанию singleton, поэтому хранить текущую задачу в поле опасно.  \n💡 `synchronized` на двух отдельных методах не делает всю операцию атомарной.  \n💡 Строки нельзя сравнивать через `==`.  \n💡 Field injection лучше заменить на constructor injection.  \n💡 Сервис лучше сделать stateless и передавать задачу прямо в метод сохранения.  \n💡 Для Kafka и REST необходимо продумать идемпотентность.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВ текущем коде есть ошибки компиляции:\n\n```java\npublic synchronized accumulateTask(Task task)\n```\n\nУ метода отсутствует возвращаемый тип.\n\nКроме того, поле объявлено `final`:\n\n```java\nprivate final Task task;\n```\n\nно затем ему присваивается новое значение:\n\n```java\nthis.task = task;\n```\n\nТакой код также не скомпилируется.\n\nГлавная архитектурная проблема — хранение текущей задачи в поле singleton-сервиса.\n\nВозможен сценарий:\n\n```text\nПоток 1 вызвал accumulateTask(task1)\nПоток 2 вызвал accumulateTask(task2)\nПоток 1 вызвал saveTask()\n```\n\nВ результате поток 1 сохранит `task2`, потому что значение общего поля уже было перезаписано.\n\n`synchronized` не решает проблему, поскольку получение и сохранение задачи разделены на два независимых вызова.\n\nТакже строки сравниваются неправильно:\n\n```java\nif (this.task.type == task)\n```\n\nДля строк нужен `equals()`, но тип сущности лучше представить через `enum`.\n\nИсправленный вариант:\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class MyShinyService {\n\n    private final TaskRepository taskRepository;\n    private final WorkRepository workRepository;\n\n    @Transactional\n    public UUID save(Task task) {\n        validate(task);\n\n        UUID entityId = UUID.randomUUID();\n\n        switch (task.getType()) {\n            case TASK -> taskRepository.save(\n                    new TaskEntity(\n                            entityId,\n                            task.getId().toString(),\n                            task.getName()\n                    )\n            );\n\n            case WORK -> workRepository.save(\n                    new WorkEntity(\n                            entityId,\n                            task.getId().toString(),\n                            task.getName()\n                    )\n            );\n\n            default -> throw new IllegalArgumentException(\n                    \"Unsupported task type: \" + task.getType()\n            );\n        }\n\n        return entityId;\n    }\n\n    private void validate(Task task) {\n        if (task == null) {\n            throw new IllegalArgumentException(\"Task must not be null\");\n        }\n\n        if (task.getId() == null) {\n            throw new IllegalArgumentException(\"Task id must not be null\");\n        }\n\n        if (task.getName() == null || task.getName().isBlank()) {\n            throw new IllegalArgumentException(\"Task name must not be blank\");\n        }\n\n        if (task.getType() == null) {\n            throw new IllegalArgumentException(\"Task type must not be null\");\n        }\n    }\n}\n```\n\nТип задачи:\n\n```java\npublic enum TaskType {\n    TASK,\n    WORK\n}\n```\n\nТеперь сервис не хранит изменяемое состояние и поэтому безопасен для параллельных вызовов. REST-контроллер и Kafka listener могут вызывать один и тот же метод:\n\n```java\nservice.save(task);\n```\n\nДополнительно нужно обеспечить идемпотентность. Kafka может повторно доставить сообщение, а REST-клиент — повторить запрос после таймаута.\n\nДля этого исходный `task.id` следует хранить в таблице с уникальным ограничением:\n\n```text\nUNIQUE(source_task_id)\n```\n\nПовторная обработка одного идентификатора не должна создавать новую запись.\n\nВместо:\n\n```java\nSystem.out.println(\"saved\");\n```\n\nследует использовать логгер:\n\n```java\nlog.info(\"Task saved, sourceId={}, type={}\",\n        task.getId(),\n        task.getType());\n```\n\n> Основная проблема — singleton-сервис хранит изменяемое состояние между двумя вызовами. `synchronized` не спасает от перезаписи задачи другим потоком. Я бы сделал сервис stateless, объединил приём и сохранение в один транзакционный метод, заменил строковый тип на `enum` и добавил идемпотентность на уровне базы данных.\n\n{{< /details >}}"
  filepath = "thread-safe-task-work-service-review"

[[tasks]]
  id = 23
  question = "Сделать ревью метода поиска товаров по фильтру"
  answer = "**Условие задачи:**  \n📌 Интернет-магазин обрабатывает около 200 запросов в секунду. Пользователь настраивает фильтры по цене, рейтингу и другим параметрам, после чего метод ищет подходящие товары.\n\nПримерно в 50% случаев результат поиска пустой. Нужно провести code review метода.\n\n**Код:**\n\n```java\nclass ServiceImpl {\n\n    // 200 RPS\n    // 50% -> return new ArrayList<>();\n    ArrayList<Product> find(Filter filter) {\n        int count = productRepo.count(filter);\n\n        if (count > 0) {\n            return productRepo.find(filter);\n        }\n\n        return new ArrayList<>();\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 При наличии товаров выполняются два запроса в базу данных.  \n💡 Предварительный `count()` не нужен — метод поиска сам может вернуть пустой список.  \n💡 Лучше возвращать интерфейс `List<Product>`, а не `ArrayList<Product>`.  \n💡 Для пустого результата можно использовать `List.of()` или результат репозитория.  \n💡 При большом количестве товаров нужна пагинация.  \n💡 Для часто используемых фильтров нужны подходящие индексы в БД.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nГлавная проблема — лишний запрос в базу данных:\n\n```java\nint count = productRepo.count(filter);\n\nif (count > 0) {\n    return productRepo.find(filter);\n}\n```\n\nЕсли товары найдены, сначала выполняется `COUNT`, а затем второй запрос для получения данных.\n\nПри 200 RPS это создаёт лишнюю нагрузку на базу. Предварительная проверка не нужна, потому что репозиторий может сразу вернуть пустой список.\n\nИсправленный вариант:\n\n```java\nclass ServiceImpl {\n\n    public List<Product> find(Filter filter) {\n        if (filter == null) {\n            throw new IllegalArgumentException(\n                    \"Filter must not be null\"\n            );\n        }\n\n        return productRepo.find(filter);\n    }\n}\n```\n\nЕсли репозиторий теоретически может вернуть `null`, что является плохим контрактом, можно защититься:\n\n```java\npublic List<Product> find(Filter filter) {\n    if (filter == null) {\n        throw new IllegalArgumentException(\n                \"Filter must not be null\"\n        );\n    }\n\n    List<Product> products = productRepo.find(filter);\n\n    return products == null\n            ? List.of()\n            : products;\n}\n```\n\nДля большого каталога лучше использовать пагинацию:\n\n```java\npublic Page<Product> find(Filter filter, Pageable pageable) {\n    if (filter == null) {\n        throw new IllegalArgumentException(\n                \"Filter must not be null\"\n        );\n    }\n\n    return productRepo.find(filter, pageable);\n}\n```\n\nЕсли общее количество результатов не требуется, вместо `Page` лучше вернуть `Slice`. Тогда Spring не будет выполнять дополнительный `COUNT(*)`.\n\nТакже стоит проверить:\n\n- наличие индексов по полям фильтрации;\n    \n- ограничение максимального размера страницы;\n    \n- валидацию диапазона цен и рейтинга;\n    \n- отсутствие N+1 при загрузке связанных сущностей;\n    \n- возврат DTO вместо JPA entity.\n    \n\n> Основная проблема — предварительный `count()`, из-за которого для непустого результата выполняются два запроса. Нужно сразу получать список товаров. Для большого каталога следует добавить пагинацию, а если общее количество записей не требуется — использовать `Slice`, чтобы избежать дополнительного `COUNT(*)`.\n\n{{< /details >}}"
  filepath = "product-filter-service-review"

[[tasks]]
  id = 24
  question = "Отрефакторить код регистрации пользователя"
  answer = "**Условие задачи:**  \n📌 Дан код регистрации пользователя. Необходимо провести ревью и выполнить рефакторинг.\n\n**Код:**\n\n```java\npackage org.example.dao;\n\nimport org.example.dto.UserDto;\n\npublic interface UserDao {\n    void save(UserDto userDto);\n}\n```\n\n```java\npackage org.example.dao;\n\nimport org.example.dto.UserDto;\n\npublic class UserDaoImplementation implements UserDao {\n\n    @Override\n    public void save(UserDto userDto) {\n        System.out.println(\"Save user.\");\n    }\n}\n```\n\n```java\npackage org.example.dao;\n\nimport org.example.dto.UserDto;\n\npublic class UserDaoFastImplementation implements UserDao {\n\n    @Override\n    public void save(UserDto userDto) {\n        System.out.println(\"Save user.\");\n    }\n\n    public void saveFast(String username, String password) {\n        System.out.println(\"Save user optimized.\");\n    }\n}\n```\n\n```java\npackage org.example.dto;\n\npublic record UserDto(String username, String password) {\n}\n```\n\n```java\npackage org.example;\n\nimport com.fasterxml.jackson.databind.json.JsonMapper;\nimport org.example.dao.UserDaoImplementation;\nimport org.example.dto.UserDto;\nimport org.example.service.EmailNotificationService;\nimport org.example.service.RegisterUserService;\nimport org.slf4j.LoggerFactory;\n\npublic class Main {\n\n    public static void main(String[] args) {\n        var logger = LoggerFactory.getLogger(\"org.example\");\n        var userDao = new UserDaoImplementation();\n        var jsonMapper = new JsonMapper();\n        var notificationService = new EmailNotificationService();\n\n        var registerService = new RegisterUserService(\n                logger,\n                jsonMapper,\n                userDao,\n                notificationService\n        );\n\n        var newUserDto = new UserDto(\n                \"test-username\",\n                \"test-password\"\n        );\n\n        registerService.register(newUserDto);\n    }\n}\n```\n\n```java\npackage org.example.service;\n\nimport com.fasterxml.jackson.databind.json.JsonMapper;\nimport org.example.dao.UserDao;\nimport org.example.dao.UserDaoFastImplementation;\nimport org.example.dao.UserDto;\nimport org.slf4j.Logger;\n\nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\npublic class RegisterUserService {\n\n    private final Logger logger;\n    private final JsonMapper jsonMapper;\n    private final UserDao userDao;\n    private final EmailNotificationService emailNotificationService;\n\n    public RegisterUserService(\n            Logger logger,\n            JsonMapper jsonMapper,\n            UserDao userDao,\n            EmailNotificationService emailNotificationService\n    ) {\n        this.logger = logger;\n        this.jsonMapper = jsonMapper;\n        this.userDao = userDao;\n        this.emailNotificationService = emailNotificationService;\n    }\n\n    public void register(UserDto userDto) {\n        logger.info(\n                \"Start registration for user: {}\",\n                userDto.username()\n        );\n\n        if (userDao instanceof UserDaoFastImplementation) {\n            ((UserDaoFastImplementation) userDao).saveFast(\n                    userDto.username(),\n                    userDto.password()\n            );\n        } else {\n            userDao.save(userDto);\n        }\n\n        try {\n            saveReportToFile(userDto);\n        } catch (IOException e) {\n            logger.error(\n                    \"Save report to file for user {} failed!\",\n                    userDto.username()\n            );\n        }\n\n        emailNotificationService.sendEmailNotification();\n\n        logger.info(\n                \"User: {} with password: {}, registered\",\n                userDto.username(),\n                userDto.password()\n        );\n    }\n\n    private void saveReportToFile(UserDto userDto)\n            throws IOException {\n\n        FileOutputStream outputStream =\n                new FileOutputStream(\n                        \"/tmp/registered-users-report.csv\"\n                );\n\n        byte[] strToBytes =\n                jsonMapper.writeValueAsBytes(userDto);\n\n        outputStream.write(strToBytes);\n        outputStream.close();\n    }\n}\n```\n\n```java\npackage org.example.service;\n\npublic final class EmailNotificationService {\n\n    public void sendEmailNotification() {\n        System.out.println(\"Send email notification\");\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 В `RegisterUserService` указан неправильный импорт `UserDto`.  \n💡 Сервис не должен проверять реализацию DAO через `instanceof`.  \n💡 Пароль нельзя записывать в логи и отчёты.  \n💡 Работу с файлом лучше вынести в отдельный компонент.  \n💡 Поток нужно закрывать через try-with-resources.  \n💡 Файл имеет расширение CSV, но данные записываются в JSON.  \n💡 При каждом вызове файл перезаписывается.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nПервая ошибка — неправильный импорт:\n\n```java\nimport org.example.dao.UserDto;\n```\n\nПравильно:\n\n```java\nimport org.example.dto.UserDto;\n```\n\nПроверка реализации через `instanceof` нарушает полиморфизм:\n\n```java\nif (userDao instanceof UserDaoFastImplementation) {\n    ...\n}\n```\n\n`RegisterUserService` должен всегда вызывать метод интерфейса:\n\n```java\nuserDao.save(userDto);\n```\n\nБыстрая реализация должна переопределять этот же метод:\n\n```java\npublic class UserDaoFastImplementation implements UserDao {\n\n    @Override\n    public void save(UserDto userDto) {\n        System.out.println(\"Save user optimized.\");\n    }\n}\n```\n\nИсправленный сервис:\n\n```java\npackage org.example.service;\n\nimport org.example.dao.UserDao;\nimport org.example.dto.UserDto;\nimport org.slf4j.Logger;\n\npublic class RegisterUserService {\n\n    private final Logger logger;\n    private final UserDao userDao;\n    private final RegistrationReportService reportService;\n    private final EmailNotificationService notificationService;\n\n    public RegisterUserService(\n            Logger logger,\n            UserDao userDao,\n            RegistrationReportService reportService,\n            EmailNotificationService notificationService\n    ) {\n        this.logger = logger;\n        this.userDao = userDao;\n        this.reportService = reportService;\n        this.notificationService = notificationService;\n    }\n\n    public void register(UserDto userDto) {\n        validate(userDto);\n\n        logger.info(\n                \"Start registration for user: {}\",\n                userDto.username()\n        );\n\n        userDao.save(userDto);\n        reportService.save(userDto.username());\n        notificationService.sendEmailNotification();\n\n        logger.info(\n                \"User {} registered\",\n                userDto.username()\n        );\n    }\n\n    private void validate(UserDto userDto) {\n        if (userDto == null) {\n            throw new IllegalArgumentException(\n                    \"User must not be null\"\n            );\n        }\n\n        if (userDto.username() == null\n                || userDto.username().isBlank()) {\n            throw new IllegalArgumentException(\n                    \"Username must not be blank\"\n            );\n        }\n\n        if (userDto.password() == null\n                || userDto.password().isBlank()) {\n            throw new IllegalArgumentException(\n                    \"Password must not be blank\"\n            );\n        }\n    }\n}\n```\n\nРаботу с отчётом можно вынести в отдельный сервис:\n\n```java\npackage org.example.service;\n\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.StandardOpenOption;\n\npublic class RegistrationReportService {\n\n    private static final Path REPORT_PATH =\n            Path.of(\"/tmp/registered-users-report.csv\");\n\n    public void save(String username) {\n        try {\n            Files.writeString(\n                    REPORT_PATH,\n                    username + System.lineSeparator(),\n                    StandardOpenOption.CREATE,\n                    StandardOpenOption.APPEND\n            );\n        } catch (IOException e) {\n            throw new IllegalStateException(\n                    \"Unable to save registration report\",\n                    e\n            );\n        }\n    }\n}\n```\n\n> Основные проблемы — неправильный импорт, проверка реализации DAO через `instanceof`, смешение нескольких обязанностей и запись пароля в лог. Я бы использовал полиморфизм, вынес создание отчёта в отдельный сервис и исключил пароль из логов и файлов.\n\n{{< /details >}}"
  filepath = "user-registration-refactor"

[[tasks]]
  id = 25
  question = "Исправить ошибки в OrderService"
  answer = "**Условие задачи:**  \nНеобходимо найти и исправить ошибки в коде изменения статуса заказа.\n\n**Код:**\n\n```java\npublic class OrderService {\n\n    @Autowired\n    private OrderRepository orderRepository;\n\n    private final NotificationService notificationService;\n\n    @Autowired\n    public OrderService(NotificationService notificationService) {\n        this.notificationService = notificationService;\n    }\n\n    public void updateOrderStatus(Long orderId, String newStatus) {\n        Order order = orderRepository.findById(orderId);\n\n        if (newStatus.equals(\"COMPLETED\")) {\n            order.setStatus(\"COMPLETED\");\n            notificationService.notify(\n                    order.getUserId(),\n                    \"Your order is completed\"\n            );\n        } else if (newStatus.equals(\"CANCELLED\")) {\n            order.setStatus(\"CANCELLED\");\n            notificationService.notify(\n                    order.getUserId(),\n                    \"Your order is cancelled\"\n            );\n        } else if (newStatus.equals(\"PENDING\")) {\n            order.setStatus(\"PENDING\");\n            orderRepository.save(order);\n        } else if (newStatus.equals(\"IN_PROGRESS\")) {\n            order.setStatus(\"IN_PROGRESS\");\n            orderRepository.save(order);\n        } else {\n            throw new IllegalArgumentException(\n                    \"Unsupported status: \" + newStatus\n            );\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй один стиль DI — constructor injection для всех зависимостей.  \n💡 `findById()` возвращает `Optional`, нужно обработать отсутствие заказа.  \n💡 Проверяй `orderId` и `newStatus` на `null` и пустую строку.  \n💡 Статусы лучше хранить в `enum`, а не в строках.  \n💡 Заказ сохраняется не во всех ветках.  \n💡 Метод изменения статуса должен быть транзакционным.  \n💡 Если статус уже установлен, повторное сохранение не требуется.  \n💡 Уведомление лучше отправлять после успешного сохранения.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВ исходном коде смешаны field injection и constructor injection:\n\n```java\n@Autowired\nprivate OrderRepository orderRepository;\n\nprivate final NotificationService notificationService;\n```\n\nЛучше внедрять обе зависимости через конструктор.\n\nТакже `findById()` в Spring Data возвращает `Optional`, а не объект `Order`.\n\nИсправленный вариант:\n\n```java\n@Service\n@RequiredArgsConstructor\n@Slf4j\npublic class OrderService {\n\n    private final OrderRepository orderRepository;\n    private final NotificationService notificationService;\n\n    @Transactional\n    public void updateOrderStatus(Long orderId, String newStatus) {\n        if (orderId == null) {\n            throw new IllegalArgumentException(\n                    \"orderId must not be null\"\n            );\n        }\n\n        if (newStatus == null || newStatus.isBlank()) {\n            throw new IllegalArgumentException(\n                    \"newStatus must not be null or blank\"\n            );\n        }\n\n        Order order = orderRepository.findById(orderId)\n                .orElseThrow(() ->\n                        new OrderNotFoundException(orderId)\n                );\n\n        OrderStatus targetStatus = parseStatus(newStatus);\n\n        if (targetStatus == order.getStatus()) {\n            log.debug(\n                    \"Status is already {} for orderId={}\",\n                    targetStatus,\n                    orderId\n            );\n            return;\n        }\n\n        order.setStatus(targetStatus);\n        orderRepository.save(order);\n\n        if (targetStatus == OrderStatus.COMPLETED) {\n            notificationService.notify(\n                    order.getUserId(),\n                    \"Your order is completed\"\n            );\n        } else if (targetStatus == OrderStatus.CANCELLED) {\n            notificationService.notify(\n                    order.getUserId(),\n                    \"Your order is cancelled\"\n            );\n        }\n\n        log.info(\n                \"Order {} status changed to {}\",\n                orderId,\n                targetStatus\n        );\n    }\n\n    private OrderStatus parseStatus(String status) {\n        try {\n            return OrderStatus.valueOf(\n                    status.trim().toUpperCase(Locale.ROOT)\n            );\n        } catch (IllegalArgumentException exception) {\n            throw new IllegalArgumentException(\n                    \"Unsupported status: \" + status\n            );\n        }\n    }\n}\n```\n\n```java\npublic enum OrderStatus {\n    PENDING,\n    IN_PROGRESS,\n    COMPLETED,\n    CANCELLED\n}\n```\n\n```java\npublic class OrderNotFoundException extends RuntimeException {\n\n    public OrderNotFoundException(Long orderId) {\n        super(\"Order not found: \" + orderId);\n    }\n}\n```\n\nОсновные изменения:\n\n- все зависимости внедряются через конструктор;\n    \n- обработано отсутствие заказа;\n    \n- строковые статусы заменены на `enum`;\n    \n- заказ сохраняется для каждого нового статуса;\n    \n- добавлена транзакция;\n    \n- повторная установка статуса ничего не делает;\n    \n- пароль и другие чувствительные данные не логируются;\n    \n- ошибки входных параметров обрабатываются явно.\n    \n\nВ реальном проекте уведомления лучше отправлять после commit через `@TransactionalEventListener` или outbox.\n\n{{< /details >}}"
  filepath = "order-service-fix-status"

[[tasks]]
  id = 26
  question = "Продумать тесты для метода calc  "
  answer = "**Условие задачи:**  \nНеобходимо продумать набор тестов для метода `calc(a, b, operation)` на основании документации.\n\n**Код:**\n\n```java\n/*\n * Выполняет одну из операций \"+\", \"-\", \"/\", \"*\"\n * для переданных параметров.\n *\n * В любой непонятной ситуации, в том числе при невозможности\n * разделить нацело, бросается exception.\n */\npublic Integer calc(Integer a, Integer b, String operation);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Проверь успешное выполнение всех четырёх операций.  \n💡 Для деления нужны тесты на деление без остатка, с остатком и на ноль.  \n💡 Проверь каждый аргумент на `null`.  \n💡 Проверь неизвестную операцию, пустую строку и `null`.  \n💡 Добавь тесты с отрицательными числами и нулём.  \n💡 Поведение при переполнении нужно отдельно зафиксировать в контракте.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновные тестовые сценарии:\n\n1. Сложение:\n    \n\n```java\ncalc(2, 3, \"+\") == 5\n```\n\n2. Вычитание:\n    \n\n```java\ncalc(10, 4, \"-\") == 6\n```\n\n3. Умножение:\n    \n\n```java\ncalc(6, 7, \"*\") == 42\n```\n\n4. Деление без остатка:\n    \n\n```java\ncalc(8, 2, \"/\") == 4\n```\n\n5. Деление с остатком:\n    \n\n```java\ncalc(7, 2, \"/\")\n```\n\nОжидается исключение.\n\n6. Деление на ноль:\n    \n\n```java\ncalc(5, 0, \"/\")\n```\n\nОжидается исключение.\n\n7. Неизвестная операция:\n    \n\n```java\ncalc(5, 2, \"%\")\n```\n\nОжидается исключение.\n\n8. Операция равна `null`:\n    \n\n```java\ncalc(5, 2, null)\n```\n\nОжидается исключение.\n\n9. Пустая операция:\n    \n\n```java\ncalc(5, 2, \"\")\n```\n\nОжидается исключение.\n\n10. Первый аргумент равен `null`:\n    \n\n```java\ncalc(null, 2, \"+\")\n```\n\nОжидается исключение.\n\n11. Второй аргумент равен `null`:\n    \n\n```java\ncalc(5, null, \"+\")\n```\n\nОжидается исключение.\n\n12. Работа с отрицательными числами:\n    \n\n```java\ncalc(-3, -7, \"*\") == 21\n```\n\n13. Деление отрицательного числа:\n    \n\n```java\ncalc(-8, 2, \"/\") == -4\n```\n\n14. Операции с нулём:\n    \n\n```java\ncalc(0, 5, \"+\") == 5\ncalc(0, 5, \"*\") == 0\n```\n\nПример тестов на JUnit 5:\n\n```java\nclass CalcServiceTest {\n\n    private final CalcService service = new CalcService();\n\n    @Test\n    void shouldAddNumbers() {\n        assertEquals(5, service.calc(2, 3, \"+\"));\n    }\n\n    @Test\n    void shouldSubtractNumbers() {\n        assertEquals(6, service.calc(10, 4, \"-\"));\n    }\n\n    @Test\n    void shouldMultiplyNumbers() {\n        assertEquals(42, service.calc(6, 7, \"*\"));\n    }\n\n    @Test\n    void shouldDivideWithoutRemainder() {\n        assertEquals(4, service.calc(8, 2, \"/\"));\n    }\n\n    @Test\n    void shouldThrowWhenDivisionHasRemainder() {\n        assertThrows(\n                RuntimeException.class,\n                () -> service.calc(7, 2, \"/\")\n        );\n    }\n\n    @Test\n    void shouldThrowWhenDividingByZero() {\n        assertThrows(\n                RuntimeException.class,\n                () -> service.calc(5, 0, \"/\")\n        );\n    }\n\n    @Test\n    void shouldThrowForUnsupportedOperation() {\n        assertThrows(\n                RuntimeException.class,\n                () -> service.calc(5, 2, \"%\")\n        );\n    }\n\n    @Test\n    void shouldThrowWhenFirstArgumentIsNull() {\n        assertThrows(\n                RuntimeException.class,\n                () -> service.calc(null, 2, \"+\")\n        );\n    }\n\n    @Test\n    void shouldThrowWhenSecondArgumentIsNull() {\n        assertThrows(\n                RuntimeException.class,\n                () -> service.calc(5, null, \"+\")\n        );\n    }\n\n    @Test\n    void shouldThrowWhenOperationIsNull() {\n        assertThrows(\n                RuntimeException.class,\n                () -> service.calc(5, 2, null)\n        );\n    }\n}\n```\n\nТочный тип исключения лучше зафиксировать в документации метода. После этого в тестах вместо `RuntimeException` следует проверять конкретный класс исключения.\n\nДля переполнения также нужен определённый контракт. Например:\n\n```java\ncalc(Integer.MAX_VALUE, 1, \"+\")\n```\n\nМетод может либо допускать стандартное переполнение `Integer`, либо выбрасывать исключение через `Math.addExact()`.\n\n{{< /details >}}"
  filepath = "calc-tests"

