  id = 28
  question = "Code Review: Синхронизация критической секции в двух потоках"
  answer = "🔥 В текущем коде создаётся новый `Object` для синхронизации при каждом вызове `doSome()`, поэтому потоки синхронизируются на **разных** мониторах — критическая секция фактически не защищена. Кроме того, вызов `new Service.doSome()` некорректен по синтаксису, а `main` должен быть `static`.\n\n```java\nclass Main{\nvoid main(){\n    execute(()->new Service.doSome());\n    execute(()->new Service.doSome());\n}\n}\n\nclass Service{\n    void doSome(){\n        Object obj = new Object();\n        //code\n        synchronized(obj){\n            //code\n        }\n        //code\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 Не создавай монитор внутри метода — он будет разным для каждого вызова. Держи общий `lock` в поле экземпляра (или используй `synchronized` на `this`).  \n💡 Запускай оба потока на **одном и том же** экземпляре `Service`, иначе будут разные мониторы.  \n💡 Исправь сигнатуру `main` на `public static void main(String[] args)` и вызовы лямбд (`service::doSome`).  \n{{< /details >}}\n\n{{< details \"Решение (альтернатива с synchronized-методом)\" close >}}\n\n```java\nclass Main {\n    public static void main(String[] args) {\n        Service service = new Service();\n        execute(service::doSome);\n        execute(service::doSome);\n    }\n\n    static void execute(Runnable r) {\n        new Thread(r).start();\n    }\n}\n\nclass Service {\n    void doSome() {\n        // code\n        critical(); // критическая секция вызовом синхронизированного метода\n        // code\n    }\n\n    private synchronized void critical() {\n        // code (критическая секция)\n    }\n}\n```\n\n- Синхронизация на `this` через `synchronized`-метод обеспечивает взаимное исключение между потоками на одном экземпляре.  \n  {{< /details >}}"
  filepath = "sync-critical-section"

[[tasks]]
  id = 29
  question = "Code Review: In-memory UserService: код-ревью и правки"
  answer = "🔥 Нужно быстро запустить хранение пользователей в памяти сервиса, чтобы использовать из контроллеров и других сервисов. Разберём проблемы и улучшим код для продового использования под нагрузкой.\n\n```java\n@Service\npublic class UserService {\n    private Map<Integer, User> usersCache = new HashMap<>();\n\n    public void addUser(User user) {\n        usersCache.put(user.getId(), user);\n    }\n\n    public User getUser(int id) {\n        return usersCache.get(id);\n    }\n\n    public List<User> getAllUsers() {\n        return new ArrayList<>(usersCache.values());\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 Потокобезопасность: `HashMap` не потокобезопасен — возьми `ConcurrentHashMap`.  \n💡 Контракты методов: валидация `user`/`id`, поведение при дубликате (id уже существует).  \n💡 Иммутабельность: если `User` изменяемый, лучше возвращать копии/DTO, чтобы не ломать инварианты.  \n💡 Возвраты: для чтения — `Optional<User>` вместо `null`, для пустых коллекций — `List.of()`.  \n💡 API полнота: часто нужны `create/update/delete`, `exists`, `count`.  \n💡 Производительность: возвращай неизменяемую копию списка без лишних аллокаций.  \n{{< /details >}}\n\n{{< details \"Решение\" close >}}\n\n```java\n@Service\npublic class UserService {\n\n    // Потокобезопасное, финализированное хранилище\n    private final ConcurrentMap<Integer, User> users = new ConcurrentHashMap<>();\n\n    /**\n     * Создаёт пользователя. Бросает исключение, если id уже занят.\n     */\n    public User create(User user) {\n        validateUser(user);\n        User prev = users.putIfAbsent(user.getId(), user);\n        if (prev != null) {\n            throw new IllegalStateException(\"User with id=\" + user.getId() + \" already exists\");\n        }\n        return user;\n    }\n\n    /**\n     * Обновляет или создаёт (upsert) пользователя.\n     */\n    public User upsert(User user) {\n        validateUser(user);\n        users.put(user.getId(), user);\n        return user;\n    }\n\n    /**\n     * Возвращает пользователя по id.\n     */\n    public Optional<User> get(int id) {\n        return Optional.ofNullable(users.get(id));\n    }\n\n    /**\n     * Удаляет пользователя по id. Возвращает true, если удалён.\n     */\n    public boolean delete(int id) {\n        return users.remove(id) != null;\n    }\n\n    /**\n     * Возвращает неизменяемый снимок списка пользователей.\n     * Важно: элементы могут быть изменяемыми, продумай иммутабельность User.\n     */\n    public List<User> getAll() {\n        // Быстрый снимок без лишних копий значений\n        return List.copyOf(users.values());\n    }\n\n    public boolean exists(int id) {\n        return users.containsKey(id);\n    }\n\n    public int count() {\n        return users.size();\n    }\n\n    private static void validateUser(User user) {\n        if (user == null) throw new IllegalArgumentException(\"user must not be null\");\n        if (user.getId() == null) throw new IllegalArgumentException(\"user.id must not be null\");\n    }\n}\n```\n\nДополнительно к улучшениям:\n\n- Если `User` изменяемый (мутабельный), рассмотри вариант: хранить **иммутабельные** копии (например, `record UserDto(...)`) и возвращать их наружу, чтобы внешний код не менял состояние кэша «мимо» сервиса.\n- Для горячего рестарта/отладки можно добавить методы **экспорта/импорта** (JSON снапшот) или периодический дамп на диск.\n- Если id генерируется на стороне сервиса, добавь `AtomicInteger/Long` генератор и `create` без id.\n- Если нужно TTL или лимит памяти — поверх `ConcurrentHashMap` использовать Caffeine (`Cache`) с политиками истечения/выталкивания.\n\n\n{{< /details >}}"
  filepath = "inmemory-user-service-review"

[[tasks]]
  id = 30
  question = "Code Review: @Transactional + внешний HTTP вызов"
  answer = "**Условие задачи:**  \n📌 Есть сервис, который делает внешний HTTP-вызов и сохраняет результат в БД. Нужно провести код-ревью: какие проблемы в этом коде и как их исправить.\n\n**Код:**\n\n```java\n@Service\npublic class RestClient {\n\n    @Transactional\n    public void doWork() {\n        var obj = restTemplate.postForObject(...);\n        dbService.saveObj(obj);\n    }\n}\n```\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 Не держите транзакцию БД во время сетевого запроса — это блокирует ресурсы и увеличивает риск длительных блокировок.  \n💡 Обработайте ошибки/таймауты внешнего вызова (timeouts, retries/circuit breaker, фолбэки).  \n💡 Сделайте `RestTemplate`/клиент биновым и внедряйте через конструктор.  \n💡 Разделите ответственность: внешний вызов отдельно, сохранение — в отдельной транзакции.  \n💡 Продумайте идемпотентность: если внешний вызов прошёл, а транзакция откатилась — возможны дубли/несогласованность.  \n{{< /details >}}\n\n{{< details \"Решение\" close >}}\n\n```java\n@Configuration\nclass HttpClientConfig {\n    @Bean\n    RestTemplate restTemplate() {\n        var factory = new HttpComponentsClientHttpRequestFactory();\n        factory.setConnectTimeout(2_000);\n        factory.setReadTimeout(3_000);\n        return new RestTemplate(factory);\n    }\n}\n\n@Service\n@RequiredArgsConstructor\nclass RestClientService {\n\n    private final RestTemplate restTemplate;\n    private final DbService dbService;\n\n    public void doWork() {\n        // 1) Внешний HTTP-вызов ВНЕ транзакции БД\n        ResponseDto obj = callRemote();\n\n        // 2) Отдельная короткая транзакция только на запись в БД\n        save(obj);\n    }\n\n    private ResponseDto callRemote() {\n        try {\n            // пример: добавьте идемпотентный ключ, если поддерживается провайдером\n            var headers = new HttpHeaders();\n            headers.add(\"Idempotency-Key\", UUID.randomUUID().toString());\n            var request = new HttpEntity<>(buildRequest(), headers);\n\n            return restTemplate.postForObject(\"https://remote/api\", request, ResponseDto.class);\n        } catch (RestClientResponseException ex) {\n            // HTTP 4xx/5xx\n            throw new ExternalServiceException(\"Remote error: \" + ex.getRawStatusCode(), ex);\n        } catch (ResourceAccessException ex) {\n            // таймауты/сети\n            throw new ExternalServiceException(\"Remote timeout/unavailable\", ex);\n        }\n    }\n\n    @Transactional\n    protected void save(ResponseDto obj) {\n        // валидация данных перед сохранением\n        if (obj == null) {\n            throw new IllegalArgumentException(\"Remote response is null\");\n        }\n        dbService.saveObj(obj);\n    }\n\n    private RequestDto buildRequest() {\n        // сконструируйте DTO запроса\n        return new RequestDto(/* ... */);\n    }\n}\n\n/** Пример доменных исключений — не даём \"прятать\" сетевые ошибки как SQL */\nclass ExternalServiceException extends RuntimeException {\n    ExternalServiceException(String msg, Throwable cause) { super(msg, cause); }\n}\n\n/** Пример DbService — транзакция может жить здесь, если хочется инкапсулировать слой */\n@Service\n@RequiredArgsConstructor\nclass DbService {\n    private final ObjRepository repo;\n\n    @Transactional(propagation = Propagation.MANDATORY)\n    public void saveObj(ResponseDto obj) {\n        repo.save(map(obj));\n    }\n\n    private ObjEntity map(ResponseDto dto) {\n        // mapper DTO -> Entity\n        return new ObjEntity(/* ... */);\n    }\n}\n```\n\n**Что исправлено и почему (кратко):**\n\n- 🚫 Убрали длительную БД-транзакцию вокруг сетевого вызова: теперь транзакция короткая и только на `save(...)`.\n\n- 🧯 Добавили таймауты и обработку ошибок для HTTP клиента, чтобы не висеть бесконечно.\n\n- 🧱 Разделили слои и ответственности, внедрение зависимостей — через конструктор.\n\n- 🔁 Продумана идемпотентность (Idempotency-Key) для избежания дублей при повторах.\n\n- ✅ Явные доменные исключения: проще различать сбои внешнего сервиса и БД.\n\n\n{{< /details >}}"
  filepath = "code-review-transactional-http-call"

[[tasks]]
  id = 31
  question = "Code review PaymentService: транзакции, DI и логические баги"
  answer = "**Условие задачи:**  \n📌 Дан сервис `PaymentService`. Нужно:\n\n- провести **code review**,\n\n- указать проблемы,\n\n- показать, **как исправить код** (структуру оставить примерно ту же).\n\n\n**Код:**\n\n```java\n@Component\npublic class PaymentService{\n\n    @Autowired\n    private ComissionServiceImpl comissionService;\n\n    private NotificationService notificationService = new NotificationServiceImpl();\n\n    @Autowired\n    private AccountRepository accountRepository;\n\n    public void makePayment(AccountDto acc1, AccountDto acc2, Integer moneyAmount){\n        System.out.println(\"Start payment\");\n        var account1 = accountRepository.findById(acc1.getAccountId());\n        var account2 = accountRepository.findById(acc1.getAccountId());\n        transfer(account1, account2, moneyAmount);\n        notificationService.sendNotification(account1.getAccountId());\n        notificationService.sendNotification(account2.getAccountId());\n        System.out.println(\"End payment\");\n    }\n\n    @Transactional\n    public void transfer(Account acc1, Account acc2, Integer moneyAmount){\n        account1.setMoneyAmount(account1.getMoneyAmount() - moneyAmount);\n        account2.setMoneyAmount(account2.getMoneyAmount() + moneyAmount);\n    }\n\n}\n\npublic class AccountDto {\n    private UUID accountId;\n    private Integer moneyAmount;\n}\n\n@Entity\n@Table\npublic class Account{\n\n    @Id\n    private UUID accountId;\n    private Integer moneyAmount;\n}\n```\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 Инъекция зависимостей: не используем `new`, лучше **constructor injection** + интерфейсы, а не конкретные классы.  \n💡 `findById` в Spring Data возвращает `Optional<Account>`, а не `Account`. Нужна обработка.  \n💡 Во втором `findById` используется `acc1`, а должно быть `acc2`.  \n💡 В `transfer` параметры называются `acc1/acc2`, но внутри используются `account1/account2` — код не компилируется.  \n💡 `@Transactional` не сработает, если аннотированный метод вызывается **из этого же класса** (self-invocation). Транзакцию нужно ставить на entrypoint (`makePayment`) или вынести `transfer` в отдельный сервис.  \n💡 Логирование лучше делать через `Logger`, а не `System.out.println`.  \n💡 Денежные суммы лучше хранить в `BigDecimal`, но для livecoding можно оставить `Integer` и хотя бы проверить баланс и неотрицательность суммы.  \n{{< /details >}}\n\n{{< details \"Решение\" close >}}\n\nНиже пример исправленного варианта с комментариями:\n\n```java\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\nimport lombok.RequiredArgsConstructor;\n\n@Service\n@RequiredArgsConstructor\npublic class PaymentService {\n\n    private final CommissionService commissionService;    // интерфейс, а не реализация\n    private final NotificationService notificationService;\n    private final AccountRepository accountRepository;\n\n    @Transactional\n    public void makePayment(AccountDto fromDto, AccountDto toDto, Integer amount) {\n        if (amount == null || amount <= 0) {\n            throw new IllegalArgumentException(\"Amount must be positive\");\n        }\n\n        System.out.println(\"Start payment\"); // в реальном коде: логгер\n\n        // 1. Загружаем счета\n        Account from = accountRepository.findById(fromDto.getAccountId())\n                .orElseThrow(() -> new IllegalArgumentException(\"Source account not found\"));\n\n        Account to = accountRepository.findById(toDto.getAccountId())\n                .orElseThrow(() -> new IllegalArgumentException(\"Target account not found\"));\n\n        // 2. Считаем комиссию (если нужна)\n        int commission = commissionService.calculateCommission(amount);\n        int totalDebit = amount + commission;\n\n        if (from.getMoneyAmount() < totalDebit) {\n            throw new IllegalStateException(\"Insufficient funds\");\n        }\n\n        // 3. Переводим деньги (внутри той же транзакции)\n        transfer(from, to, amount, commission);\n\n        // 4. Отправляем уведомления\n        notificationService.sendNotification(from.getAccountId());\n        notificationService.sendNotification(to.getAccountId());\n\n        System.out.println(\"End payment\");\n    }\n\n    // package-private / private: вызывать только внутри текущей транзакции\n    void transfer(Account from, Account to, int amount, int commission) {\n        from.setMoneyAmount(from.getMoneyAmount() - amount - commission);\n        to.setMoneyAmount(to.getMoneyAmount() + amount);\n\n        // Если Account — JPA entity, полученная через repository,\n        // можно не вызывать save(): изменения зафиксируются через dirty checking.\n        // Явный save не повредит, но не обязателен:\n        // accountRepository.save(from);\n        // accountRepository.save(to);\n    }\n}\n```\n\nПример интерфейсов (для полноты картины):\n\n```java\npublic interface CommissionService {\n    int calculateCommission(int amount);\n}\n\npublic interface NotificationService {\n    void sendNotification(UUID accountId);\n}\n```\n\nПример DTO / Entity (минимально, чтобы стало понятно):\n\n```java\npublic class AccountDto {\n    private UUID accountId;\n    private Integer moneyAmount;\n\n    public UUID getAccountId() {\n        return accountId;\n    }\n\n    public Integer getMoneyAmount() {\n        return moneyAmount;\n    }\n\n    // setters/конструктор по необходимости\n}\n\n@Entity\n@Table(name = \"accounts\")\npublic class Account {\n\n    @Id\n    private UUID accountId;\n\n    private Integer moneyAmount;\n\n    public UUID getAccountId() {\n        return accountId;\n    }\n\n    public Integer getMoneyAmount() {\n        return moneyAmount;\n    }\n\n    public void setMoneyAmount(Integer moneyAmount) {\n        this.moneyAmount = moneyAmount;\n    }\n}\n```\n\n**Кратко, какие проблемы были и как исправили:**\n\n1. **Неверная загрузка второго аккаунта**\n\n    ```java\n    var account2 = accountRepository.findById(acc1.getAccountId());\n    ```\n\n   👉 Должно быть `acc2.getAccountId()`.\n\n2. **Игнорирование Optional от `findById`**  \n   👉 Теперь используем `orElseThrow(...)`.\n\n3. **Неработающий `@Transactional`**  \n   👉 Перенесли аннотацию на `makePayment` — entrypoint бизнес-операции.\n\n4. **Поля с `@Autowired` и `new ...`**  \n   👉 Заменено на **constructor injection** через `@RequiredArgsConstructor` + интерфейсы.\n\n5. **Опечатка и привязка к реализации**  \n   👉 `ComissionServiceImpl` → `CommissionService`. Привязываемся к интерфейсу.\n\n6. **Проблемы с именами переменных в `transfer`**  \n   👉 Используем корректные параметры и не обращаемся к несуществующим `account1/account2`.\n\n7. **Отсутствие валидаций и проверки баланса**  \n   👉 Добавлены проверки суммы и достаточности средств.\n\n8. **System.out вместо логгера**  \n   👉 Для продакшена стоит заменить на `Logger`, но для livecoding оставили как есть, с замечанием.\n\n\nТакой вариант уже выглядит адекватным ответом на code review на собеседовании.\n\n{{< /details >}}"
  filepath = "payment-service-code-review"

[[tasks]]
  id = 32
  question = "Code review системы расчёта зарплат + бизнес-вопросы"
  answer = "**Условие задачи:**  \n📌 Есть «наследованный» класс `PayrollSystem`, который считает зарплаты сотрудников.  \nДанные приходят из внешней системы в виде `List<Map<String, Object>>` (мы на них повлиять не можем).\n\nЖалобы бухгалтерии:\n\n1. В отчётах **иногда пропадают сотрудники** (особенно новые).\n\n2. В ведомости **появляются отрицательные суммы зарплат**.\n\n3. При **изменении оклада** система не всегда обновляет данные.\n\n4. В цифрах много **дробных значений** (5234.56789 вместо 5234.57).\n\n5. При ошибке в данных (**текст вместо цифр**) система «зависает» без объяснения.\n\n\nНужно:\n\n- провести code review,\n\n- предложить исправления,\n\n- сформулировать, какие **вопросы задать бизнесу**, чтобы правильно решить проблему.\n\n\n**Текущий код (фрагмент):**\n\n```java\npublic class PayrollSystem {  \nstatic List<Map<String, Object>> employees = new ArrayList<>();  \n  \nstatic {  \nMap<String, Object> emp1 = new HashMap<>();  \nemp1.put(\"id\", 1);  \nemp1.put(\"name\", \"Иванов\");  \nemp1.put(\"base_salary\", 40000);  \nemp1.put(\"bonus\", 10000);  \nemp1.put(\"tax_rate\", 0.13);  \nemployees.add(emp1);  \n  \nMap<String, Object> emp2 = new HashMap<>();  \nemp2.put(\"id\", 2);  \nemp2.put(\"name\", \"Петрова\");  \nemp2.put(\"base_salary\", 50000.54);  \nemp2.put(\"bonus\", 6000);  \nemp2.put(\"tax_rate\", 0.13);  \nemployees.add(emp2);  \n  \nMap<String, Object> emp3 = new HashMap<>();  \nemp3.put(\"id\", 3);  \nemp3.put(\"name\", \"Сидоров\");  \nemp3.put(\"base_salary\", 30000.25);  \nemp3.put(\"bonus\", null);  \nemp3.put(\"tax_rate\", 0.13);  \nemployees.add(emp3);  \n  \nMap<String, Object> emp4 = new HashMap<>();  \nemp4.put(\"id\", 4);  \nemp4.put(\"name\", \"Кузнецов\");  \nemp4.put(\"base_salary\", 70000);  \nemp4.put(\"bonus\", 20000.30);  \nemp4.put(\"tax_rate\", 0.15);  \nemployees.add(emp4);  \n}  \n  \nstatic double calculateSalary(Map<String, Object> employee) {  \ndouble baseSalary = ((Number) employee.get(\"base_salary\")).doubleValue();  \ndouble bonus = ((Number) employee.get(\"bonus\")).doubleValue();  \ndouble total = baseSalary + bonus;  \ndouble tax = ((Number) employee.get(\"tax_rate\")).doubleValue();  \ntotal = total - total * tax;  \nreturn total;  \n}  \n  \nstatic List<Map<String, Object>> generatePayroll() {  \nList<Map<String, Object>> payroll = new ArrayList<>();  \nfor (Map<String, Object> emp : employees) {  \ntry {  \ndouble netSalary = calculateSalary(emp);  \nMap<String, Object> entry = new HashMap<>();  \nentry.put(\"name\", emp.get(\"name\"));  \nentry.put(\"salary\", netSalary);  \npayroll.add(entry);  \n} catch (Exception e) {  \ncontinue;  \n}  \n}  \nreturn payroll;  \n}  \n  \nstatic void printPayroll() {  \nList<Map<String, Object>> payroll = generatePayroll();  \nfor (Map<String, Object> p : payroll) {  \nSystem.out.println(p.get(\"name\") + \": \" + p.get(\"salary\") + \" руб.\");  \n}  \n}  \n  \nstatic void updateBaseSalary(int employeeId, double newSalary) {  \nfor (Map<String, Object> emp : employees) {  \nif ((int) emp.get(\"id\") == employeeId) {  \nemp.put(\"base_salary\", newSalary);  \nbreak;  \n}  \n}  \n}  \n  \npublic static void main(String[] args) {  \nSystem.out.println(\"Расчет зарплат:\");  \nprintPayroll();  \n}  \n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 Пропадающие сотрудники = где-то ловим `Exception` и тихо делаем `continue`. Любая ошибка → сотрудник исчез.  \n💡 `bonus` может быть `null` → `((Number) null)` даёт `NullPointerException`.  \n💡 `Object`-поля позволяют влететь в `ClassCastException` (текст вместо числа). Сейчас это просто глушится.  \n💡 Для денег лучше `BigDecimal` с `setScale(2, RoundingMode.HALF_UP)`.  \n💡 Отрицательная зарплата должна быть **ошибкой данных**, а не тихо проходить.  \n💡 `updateBaseSalary` меняет только in-memory список; при новой загрузке из внешней системы всё откатится.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n **1. Какие проблемы в текущем коде**\n\n1. **Пропадают сотрудники**\n\n    ```java\n    static List<Map<String, Object>> generatePayroll() {\n        ...\n        try {\n            double netSalary = calculateSalary(emp);\n            ...\n            payroll.add(entry);\n        } catch (Exception e) {\n            continue;\n        }\n    }\n    ```\n\n    - Любая ошибка (NPE, ClassCastException, NumberFormat…) → сотрудник просто **пропускается**.\n\n    - Именно поэтому «особенно новые» могут исчезать: у них чаще всего кривые/новые поля.\n\n2. **Отрицательные суммы**\n\n    - Нет никакой валидации входных данных.\n\n    - Если из внешней системы придёт отрицательный `bonus` или завышенный `tax_rate` (например, 1.5), то итог может стать отрицательным — и мы это спокойно выводим в ведомость.\n\n3. **Изменение оклада не всегда обновляется**\n\n    ```java\n    static void updateBaseSalary(int employeeId, double newSalary) {\n        for (Map<String, Object> emp : employees) {\n            if ((int) emp.get(\"id\") == employeeId) {\n                emp.put(\"base_salary\", newSalary);\n                break;\n            }\n        }\n    }\n    ```\n\n   Возможные причины:\n\n    - `employees` — **static in-memory**. Если каждый расчёт запускается заново или данные заново подгружаются из внешней системы, изменения не живут дольше одного запуска.\n\n    - Если у сотрудника некорректные данные после обновления (например, `bonus = null` / `tax_rate = \"0.13%\"` строкой), он попадает в `catch` и **исчезает из отчёта** → бухгалтер говорит «не обновилось».\n\n4. **Слишком много дробных значений**\n\n    - Работает сырая арифметика с `double`: тип не денежный, ошибки округления гарантированы.\n\n    - Нет принудительного `setScale(2)` → формат плавает.\n\n5. **Система зависает при ошибке в данных**\n\n    - Реально она не «зависает», а **тихо глотает ошибки**:\n\n        ```java\n        } catch (Exception e) {\n            continue;\n        }\n        ```\n\n    - В логах ничего нет, в отчёте сотрудник пропал → для бизнеса это выглядит как «зависло/сломалось, непонятно что».\n\n\n---\n\n **2. Улучшенная реализация расчёта (идея и пример кода)**\n\nНе трогаем формат данных от внешней системы (`Map<String, Object>`), но:\n\n- Вводим **типизированный DTO** для внутренней работы.\n\n- Используем `BigDecimal` для денег.\n\n- Явно валидируем данные и логируем ошибки.\n\n\nУсловно:\n\n```java\nimport java.math.BigDecimal;\nimport java.math.RoundingMode;\n\nrecord EmployeePayData(\n        Integer id,\n        String name,\n        BigDecimal baseSalary,\n        BigDecimal bonus,\n        BigDecimal taxRate\n) {}\n\nrecord PayrollEntry(Integer id, String name, BigDecimal netSalary) {}\n\npublic class PayrollSystem {\n\n    // employees как дано во входном коде — не трогаем\n\n    static EmployeePayData mapEmployee(Map<String, Object> raw) {\n        Integer id = (Integer) raw.get(\"id\");\n        String name = (String) raw.get(\"name\");\n\n        BigDecimal base = toMoney(raw.get(\"base_salary\"), \"base_salary\", name, true);\n        BigDecimal bonus = toMoney(raw.get(\"bonus\"), \"bonus\", name, false); // может быть null → 0\n        BigDecimal taxRate = toRate(raw.get(\"tax_rate\"), \"tax_rate\", name);\n\n        return new EmployeePayData(\n                id,\n                name,\n                base,\n                bonus != null ? bonus : BigDecimal.ZERO,\n                taxRate\n        );\n    }\n\n    private static BigDecimal toMoney(Object value, String field, String empName, boolean required) {\n        if (value == null) {\n            if (required) {\n                throw new IllegalArgumentException(\"Поле \" + field + \" обязательно для сотрудника \" + empName);\n            } else {\n                return null;\n            }\n        }\n        if (value instanceof Integer i) {\n            return BigDecimal.valueOf(i);\n        }\n        if (value instanceof Long l) {\n            return BigDecimal.valueOf(l);\n        }\n        if (value instanceof Double d) {\n            return BigDecimal.valueOf(d);\n        }\n        if (value instanceof String s) {\n            return new BigDecimal(s);\n        }\n        throw new IllegalArgumentException(\"Некорректный тип поля \" + field + \" для \" + empName + \": \" + value.getClass());\n    }\n\n    private static BigDecimal toRate(Object value, String field, String empName) {\n        if (value == null) {\n            throw new IllegalArgumentException(\"Ставка налога обязательна для \" + empName);\n        }\n        BigDecimal rate;\n        if (value instanceof Number n) {\n            rate = BigDecimal.valueOf(n.doubleValue());\n        } else if (value instanceof String s) {\n            rate = new BigDecimal(s);\n        } else {\n            throw new IllegalArgumentException(\"Некорректный тип \" + field + \" для \" + empName);\n        }\n        if (rate.compareTo(BigDecimal.ZERO) < 0 || rate.compareTo(BigDecimal.ONE) > 0) {\n            throw new IllegalArgumentException(\"Некорректная ставка налога \" + rate + \" для \" + empName);\n        }\n        return rate;\n    }\n\n    static BigDecimal calculateSalary(EmployeePayData emp) {\n        BigDecimal total = emp.baseSalary().add(emp.bonus());\n        BigDecimal tax = total.multiply(emp.taxRate());\n        BigDecimal net = total.subtract(tax);\n\n        if (net.compareTo(BigDecimal.ZERO) < 0) {\n            throw new IllegalArgumentException(\"Отрицательная ЗП для \" + emp.name() + \": \" + net);\n        }\n\n        return net.setScale(2, RoundingMode.HALF_UP);\n    }\n\n    static List<PayrollEntry> generatePayroll() {\n        List<PayrollEntry> payroll = new ArrayList<>();\n\n        for (Map<String, Object> raw : employees) {\n            String name = (String) raw.get(\"name\");\n            try {\n                EmployeePayData emp = mapEmployee(raw);\n                BigDecimal net = calculateSalary(emp);\n                payroll.add(new PayrollEntry(emp.id(), emp.name(), net));\n            } catch (Exception e) {\n                // тут в реальной системе логируем\n                System.err.println(\"Ошибка при расчете ЗП для \" + name + \": \" + e.getMessage());\n                // возможно, всё равно добавляем запись с статусом \"ошибка\"\n                // payroll.add(new PayrollEntry(empId, name, null));\n            }\n        }\n\n        return payroll;\n    }\n\n    static void printPayroll() {\n        List<PayrollEntry> payroll = generatePayroll();\n        for (PayrollEntry p : payroll) {\n            System.out.println(p.name() + \": \" + p.netSalary() + \" руб.\");\n        }\n    }\n}\n```\n\n**Что это даёт по пунктам жалоб:**\n\n1. Пропадающие сотрудники\n\n    - Теперь сотрудник либо:\n\n        - появляется с посчитанной ЗП,\n\n        - либо попадает в лог с понятной ошибкой (и можно решить на стороне данных).\n\n    - Мы НЕ молча их игнорируем.\n\n2. Отрицательные суммы\n\n    - В `calculateSalary` отрицательная ЗП → **исключение** и явная ошибка, а не тихий бред в отчёте.\n\n3. Обновление оклада\n\n    - Нужно договориться с бизнесом: кто «мастер» данных — внешняя система или наша.\n\n    - Если мы всё-таки обновляем в нашей системе, то:\n\n        - либо изменения должны сохраняться в БД и синхронизироваться с внешней системой,\n\n        - либо `updateBaseSalary` — только временная корректировка на один расчёт (и это должно быть прямо описано бизнесу).\n\n4. Дробные значения\n\n    - `BigDecimal.setScale(2, RoundingMode.HALF_UP)` → всегда две цифры после запятой.\n\n5. «Зависание» при ошибке\n\n    - Мы не глушим исключения, а **логируем**: понятно, чей сотрудник, какое поле, что именно не так.\n\n    - При желании можно возвращать статус «ошибка данных» вплоть до UI.\n\n\n---\n\n **3. Вопросы, которые я бы задал бизнесу / бухгалтерии**\n\nЯ не буду задавать их тебе «вживую» (по условиям системы), но вот список, которые я как разработчик **обязательно бы уточнил** у бизнеса:\n\n1. **Что делать с сотрудником, у которого некорректные данные?**\n\n    - Пропускать сотрудника?\n\n    - Показывать его в отчёте со статусом «Ошибка данных» и пустой ЗП?\n\n    - Ставить ЗП = 0, но подсвечивать проблему?\n\n2. **Кто владелец (мастер) данных по окладу?**\n\n    - Наша система или внешняя?\n\n    - Если оклад изменили в нашей системе, должно ли это изменение улетать обратно во внешнюю систему?\n\n3. **Как бизнес относится к отрицательной зарплате?**\n\n    - Это всегда ошибка данных?\n\n    - Или поддерживаются случаи удержаний/штрафов, когда один расчёт может быть отрицательным? Если да — как это показывать в отчёте?\n\n4. **Требования к округлению денег:**\n\n    - Всегда до двух знаков после запятой?\n\n    - Какой режим округления: `HALF_UP`, `HALF_DOWN`, `HALF_EVEN`?\n\n    - Нужно ли отдельно показывать «грязную» и «чистую» сумму?\n\n5. **Что считать «успешным расчётом» отчёта:**\n\n    - Если у части сотрудников ошибки в данных — считать отчёт построенным или «отчёт с ошибками» и блокировать выгрузку?\n\n    - Нужен ли агрегированный список всех проблем по сотрудникам (для бухгалтера или HR)?\n\n6. **Частота обновления данных / режим работы:**\n\n    - Отчёт строится за один запуск или система живёт постоянно и хранит состояние?\n\n    - Можно ли нам отказаться от `static`-структур и перейти к БД/кэшу?\n\n\n---\n\nТаким ответом ты покрываешь и **техническую часть** (code review / правки), и **бизнесовую** (какие решения нельзя принимать без требований).\n\n{{< /details >}}"
  filepath = "payroll-system-review-and-fix"

[[tasks]]
  id = 33
  question = "Code review ClientController и связанных классов"
  answer = "**Условие задачи:**  \n📌 Дан REST-контроллер, который должен вернуть полисы клиента. Нужно провести code review:\n\n- найти проблемы (как технические, так и логические),\n\n- предложить, как переписать код более корректно.\n\n\n**Код:**\n\n```java\n@RestController\npublic class ClientController {\n\n    @Value(\"policy.limit\")\n    private int policyLimit;\n\n    @Autowired\n    private PolicyService policyService;\n\n    @RequestMapping(path = \"client/{clientId}/policies\", method = RequestMethod.POST)\n    public Response getClientPolicies(@PathVariable(\"clientId\") String clientId) {\n        List<PolicyDTO> policies = getPolicies().stream()\n            .limit(policyLimit)\n            .filter(p -> p.getClientIds().contains(clientId))\n            .filter(p -> p.isPaid())\n            .toList();\n        return new Response(policies);\n    }\n\n    @Transactional\n    private List<PolicyDTO> getPolicies() {\n        return policyService.getPolicies();\n    }\n\n    @Data\n    @AllArgsConstructor\n    public class Response {\n        private List<PolicyDTO> policies;\n    }\n}\n\n@Data\npublic class PolicyDTO {\n    private String id;\n    private String name;\n    private List<String> clientId;\n    private Boolean isPaid;\n}\n\n@RequiredArgsConstructor\n@Component\npublic class PolicyService {\n    private final PolicyDbRepository repository;\n    /**\n     *  Читает полисы из БД\n     */\n    List<PolicyDTO> getPolicies() {\n        return repository.getPolicies();\n    }\n}\n\npublic interface PolicyDbRepository {\n    List<PolicyDTO> getPolicies();\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 `@Value(\"policy.limit\")` — строка, а не property placeholder. Нужно `@Value(\"${policy.limit}\")`.  \n💡 Поля с `@Autowired` → лучше конструкторная инъекция (`@RequiredArgsConstructor`).  \n💡 `@RequestMapping POST` на метод, который фактически **читает** данные — по REST лучше `GET`.  \n💡 В контроллере вызывается `getPolicies()` с `@Transactional`, но метод `private` + self-invocation → транзакция не сработает.  \n💡 `limit(policyLimit)` стоит делать **после** фильтрации, а ещё лучше — на уровне БД.  \n💡 `PolicyDTO`: поле `clientId` (в коде вызывается `getClientIds()`) и `Boolean isPaid` (Lombok сгенерирует `getIsPaid()`, а не `isPaid()`) → не скомпилируется.  \n💡 Внутренний класс `Response` не `static` → держит ссылку на контроллер, хуже для сериализации/тестов.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n### 1. Основные проблемы в текущем коде\n\n1. **Неправильное использование `@Value`**\n\n    ```java\n    @Value(\"policy.limit\")\n    private int policyLimit;\n    ```\n\n   Так ты просто внедряешь строку `\"policy.limit\"` и пытаешься привести к int.  \n   ✅ Нужно:\n\n    ```java\n    @Value(\"${policy.limit:100}\") // 100 — дефолт\n    private int policyLimit;\n    ```\n\n2. **Field injection + `@Autowired`**\n\n    - Поля с `@Autowired` хуже тестируются, нельзя сделать `final`, сложно мокать.  \n      ✅ Лучше: конструкторная инъекция через `@RequiredArgsConstructor` и `final` поля.\n\n3. **Неверный HTTP-метод**\n\n    ```java\n    @RequestMapping(path = \"client/{clientId}/policies\", method = RequestMethod.POST)\n    ```\n\n   Метод фактически читает данные, а не изменяет → по REST должен быть `GET`.  \n   ✅\n\n    ```java\n    @GetMapping(\"/client/{clientId}/policies\")\n    ```\n\n4. **Бесполезная `@Transactional` на `private`-методе**\n\n    ```java\n    @Transactional\n    private List<PolicyDTO> getPolicies() { ... }\n    ```\n\n    - `private`-метод не проксируется Spring'ом, плюс вызов из того же класса → AOP не сработает.\n\n    - Транзакции стоит ставить на **service-слой**, и обычно `readOnly = true` для чтения.\n\n5. **Порядок операций в Stream**\n\n    ```java\n    getPolicies().stream()\n        .limit(policyLimit)\n        .filter(...)\n        .filter(...)\n    ```\n\n    - Сначала режем до `policyLimit`, а потом фильтруем — в итоге можем получить **меньше** элементов, чем ожидает фронт.  \n      ✅ Логичнее: сначала фильтровать, потом `limit`.\n\n\n    Ещё лучше — вообще не тянуть все полисы в память, а фильтровать на уровне БД.\n\n6. **Проблемы в `PolicyDTO`**\n\n    ```java\n    private List<String> clientId;\n    private Boolean isPaid;\n    ```\n\n    - В контроллере вызывается `p.getClientIds()` и `p.isPaid()`, но таких методов Lombok не сгенерирует.\n\n    - Для `Boolean isPaid` Lombok создаст `getIsPaid()`, а не `isPaid()`.  \n      ✅ Лучше:\n\n\n    ```java\n    private List<String> clientIds;\n    private boolean paid; // примитив, без null\n    ```\n    \n    Тогда Lombok сгенерирует `getClientIds()` и `isPaid()`.\n\n7. **Внутренний класс Response не static**\n\n    ```java\n    @Data\n    @AllArgsConstructor\n     public class Response { ... }\n    ```\n\n   Не-static inner class держит ссылку на внешний `ClientController`.  \n   ✅ Сделать `static` или вынести в отдельный класс / `record`.\n\n8. **Фильтрация в контроллере**  \n   Контроллер сейчас:\n\n    - вытаскивает все полисы из БД через сервис,\n\n    - фильтрует,\n\n    - режет по лимиту.\n\n\n    Логика фильтрации — это бизнес-логика, её место в `PolicyService`.\n\n\n---\n\n### 2. Пример исправленной версии\n\n**Контроллер:**\n\n```java\nimport lombok.AllArgsConstructor;\nimport lombok.Data;\nimport lombok.RequiredArgsConstructor;\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.web.bind.annotation.*;\n\nimport java.util.List;\n\n@RestController\n@RequestMapping(\"/client\")\n@RequiredArgsConstructor\npublic class ClientController {\n\n    @Value(\"${policy.limit:100}\")\n    private int policyLimit;\n\n    private final PolicyService policyService;\n\n    @GetMapping(\"/{clientId}/policies\")\n    public Response getClientPolicies(@PathVariable String clientId) {\n        List<PolicyDTO> policies = policyService.getClientPolicies(clientId, policyLimit);\n        return new Response(policies);\n    }\n\n    @Data\n    @AllArgsConstructor\n    public static class Response {\n        private List<PolicyDTO> policies;\n    }\n}\n```\n\n**DTO:**\n\n```java\nimport lombok.Data;\n\nimport java.util.List;\n\n@Data\npublic class PolicyDTO {\n    private String id;\n    private String name;\n    private List<String> clientIds;  // множественное число\n    private boolean paid;            // примитив → isPaid()\n}\n```\n\n**Сервис:**\n\n```java\nimport lombok.RequiredArgsConstructor;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport java.util.List;\nimport java.util.Objects;\n\n@Service\n@RequiredArgsConstructor\npublic class PolicyService {\n\n    private final PolicyDbRepository repository;\n\n    /**\n     * Читает полисы клиента с учётом лимита.\n     * Логику фильтрации держим на уровне сервиса.\n     */\n    @Transactional(readOnly = true)\n    public List<PolicyDTO> getClientPolicies(String clientId, int limit) {\n        return repository.getPolicies().stream()\n                .filter(Objects::nonNull)\n                .filter(p -> p.getClientIds() != null && p.getClientIds().contains(clientId))\n                .filter(PolicyDTO::isPaid)\n                .limit(limit)\n                .toList();\n    }\n}\n```\n\n**Репозиторий (как был):**\n\n```java\npublic interface PolicyDbRepository {\n    List<PolicyDTO> getPolicies();\n}\n```\n\n> На практике лучше сделать методы сразу с фильтрацией в БД, например:  \n> `List<PolicyDTO> findByClientIdAndPaidTrue(String clientId, Pageable pageable);`  \n> чтобы не тащить все полисы в память.\n\n---\n\n### 3. Кратко, что бы я сказал на собесе\n\n- Исправил DI: конструктор, `final` поля.\n\n- Исправил `@Value` и HTTP-метод (POST → GET).\n\n- Убрал бессмысленную `@Transactional` с private/self-invocation, перенёс транзакцию на сервис.\n\n- Починил DTO (имена полей и типы), чтобы `Stream`-логика вообще компилировалась.\n\n- Перенёс бизнес-логику фильтрации из контроллера в сервис.\n\n- Обратил внимание, что лучше фильтровать на уровне БД, а не в памяти.\n\n\n{{< /details >}}"
  filepath = "client-controller-code-review"

[[tasks]]
  id = 34
  question = "Code review: DocumentService и DocumentReader"
  answer = "**Условие задачи:**  \n📌 Дан сервис `DocumentService`, который читает документы разных типов с помощью самописного `DocumentReader`.  \nНужно провести **code review**:\n\n- что в коде **ок**,\n\n- что **не ок**,\n\n- что и **как улучшить**.\n\n\n**Код:**\n\n```java\n@Component\npublic class DocumentService {\n\n    public InputStream readDocument(String type) {\n        DocumentReader reader = new DocumentReader();\n\n        if (type.equals(\"PDF\")) {\n            return reader.readPdf();\n        } else if (type.equals(\"DOCX\")) {\n            return reader.readDocx();\n        } else if (type.equals(\"XLSX\")) {\n            return reader.readXlsx();\n        } else {\n            return null;\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `new DocumentReader()` внутри сервиса — нарушение DI, усложняет тестирование.  \n💡 `type.equals(\"PDF\")` может привести к `NullPointerException`.  \n💡 `else return null` — плохой контракт метода.  \n💡 Условная логика плохо масштабируется (нарушение OCP).  \n💡 Лучше использовать `enum`, `Map` или стратегию.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n### Что в коде **ок** ✅\n\n1. **Простота и читаемость**\n\n    - Логика легко читается: по типу документа выбирается метод чтения.\n\n    - Нет лишних абстракций для маленького примера.\n\n2. **Единая точка входа**\n\n    - Один метод `readDocument` отвечает за чтение документов.\n\n\n---\n\n### Что **не ок** ❌ и почему\n\n1. **Создание `DocumentReader` через `new`**\n\n    ```java\n    DocumentReader reader = new DocumentReader();\n    ```\n\n    - Нарушает Dependency Injection.\n\n    - Нельзя подменить `DocumentReader` в тестах.\n\n    - Если `DocumentReader` станет состоянием или тяжёлым объектом — проблемы.\n\n2. **Возможный `NullPointerException`**\n\n    ```java\n    if (type.equals(\"PDF\")) { ... }\n    ```\n\n    - Если `type == null`, приложение упадёт.\n\n    - Безопаснее: `\"PDF\".equals(type)` или enum.\n\n3. **Возврат `null`**\n\n    ```java\n    else {\n        return null;\n    }\n    ```\n\n    - Плохой контракт метода.\n\n    - Клиент не понимает: это ошибка? тип не поддержан? файл пустой?\n\n4. **String-based типы**\n\n    - `\"PDF\"`, `\"DOCX\"`, `\"XLSX\"` — магические строки.\n\n    - Ошибка в одном символе → баг на проде.\n\n5. **Нарушение Open/Closed Principle (OCP)**\n\n    - Добавление нового формата требует изменения метода и нового `else if`.\n\n    - Код плохо масштабируется.\n\n6. **Отсутствие явной ошибки**\n\n    - Если тип не поддержан, лучше выбросить исключение с понятным сообщением.\n\n\n---\n\n### Как улучшить (минимально)\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class DocumentService {\n\n    private final DocumentReader reader;\n\n    public InputStream readDocument(String type) {\n        if (type == null) {\n            throw new IllegalArgumentException(\"Document type must not be null\");\n        }\n\n        return switch (type) {\n            case \"PDF\"  -> reader.readPdf();\n            case \"DOCX\" -> reader.readDocx();\n            case \"XLSX\" -> reader.readXlsx();\n            default -> throw new IllegalArgumentException(\"Unsupported document type: \" + type);\n        };\n    }\n}\n```\n\n✔️ Уже лучше:\n\n- DI вместо `new`.\n\n- Нет `null`-возврата.\n\n- Явная ошибка.\n\n\n---\n\n### Как сделать **правильно и масштабируемо** ⭐\n\n**1. Enum типов документов**\n\n```java\npublic enum DocumentType {\n    PDF, DOCX, XLSX\n}\n```\n\n**2. Стратегия через Map**\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class DocumentService {\n\n    private final Map<DocumentType, Supplier<InputStream>> readers;\n\n    public InputStream readDocument(DocumentType type) {\n        Supplier<InputStream> reader = readers.get(type);\n        if (reader == null) {\n            throw new IllegalArgumentException(\"Unsupported document type: \" + type);\n        }\n        return reader.get();\n    }\n}\n```\n\n**3. Конфигурация**\n\n```java\n@Configuration\npublic class DocumentConfig {\n\n    @Bean\n    public Map<DocumentType, Supplier<InputStream>> readers(DocumentReader reader) {\n        return Map.of(\n            DocumentType.PDF, reader::readPdf,\n            DocumentType.DOCX, reader::readDocx,\n            DocumentType.XLSX, reader::readXlsx\n        );\n    }\n}\n```\n\n---\n\n### Как это звучит на собеседовании (коротко)\n\n> В текущем коде ок простота, но есть проблемы: `new` вместо DI, `null`-возврат, магические строки и нарушение OCP.  \n> Я бы ввёл `enum` типов и стратегию, чтобы добавление нового формата не требовало переписывания сервиса, а также сделал явный контракт ошибок.\n\nЕсли хочешь — можем упростить ответ под junior/middle или наоборот ужать под **1–2 минуты устного ответа**.\n\n{{< /details >}}"
  filepath = "document-service-code-review"

[[tasks]]
  id = 35
  question = "Code review сервиса подсчёта статистики по заказам клиента"
  answer = "**Условие задачи:**  \n📌 Дан сервис, который собирает статистику по заказам пользователей. Нужно провести code review: что ок, что не ок, и как бы ты исправил.\n\n**Код:**\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class StatService {\n\n    @Autowired\n    private UserRepository userRepository;\n    @Autowired\n    private OrderRepository orderRepository;\n    @Autowired\n    private StatRepository statRepository;\n    @Autowired\n    private KafkaService kafkaService;\n\n    public void calculate() {\n        List<User> users = userRepository.findAll().stream().filter(u -> u.isActive()).collect(Collectors.toList());\n\n        if (!users.isEmpty()) {\n            for(User user : users) {\n                List<Order> orders = orderRepository.findByUser(user.getId());\n\n                if (orders.isEmpty()) {\n                    System.out.println(\"У пользователя нет заказов\");\n                }\n\n                int totalOrders = 0;\n                int totalCost = 0;\n                for(Order order : orders) {\n                    totalOrders++;\n                    totalCost += order.getCost();\n                }\n\n                save(user.getId(), totalOrders, totalCost);\n            }\n        }\n    }\n@Transactional\nprivate void save(Long userId, int totalOrders, int totalCost) {\n    kafkaService.send(userId, totalOrders, totalCost, Instant.now());\n}\n```\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 Нельзя одновременно `@RequiredArgsConstructor` и field injection `@Autowired` — выбери одно (лучше constructor injection).  \n💡 `findAll()` и фильтрация в памяти — плохо для производительности, лучше `findAllByActiveTrue()` или query.  \n💡 N+1 проблема: на каждого пользователя отдельный запрос `findByUser(...)`. Лучше агрегировать на уровне БД.  \n💡 `@Transactional` на `private` методе не сработает (self-invocation).  \n💡 Метод `save` не сохраняет в `statRepository`, а только шлёт в Kafka — название вводит в заблуждение.  \n💡 `System.out.println` → заменить на логгер.  \n💡 Сумма стоимости в `int` может переполниться, деньги лучше `BigDecimal`/`long` (копейки).  \n💡 `Instant.now()` лучше вычислять один раз на запуск/пользователя и передавать явно.  \n{{< /details >}}\n\n{{< details \"Решение\" close >}}\n\n### Что ок\n\n- ✅ Идея разделить «расчёт» и «побочные эффекты» (отправка/сохранение) правильная.\n\n- ✅ Используются репозитории, сервис изолирует бизнес-логику.\n\n\n### Что не ок и почему\n\n1. **DI сломан по стилю**\n\n\n- `@RequiredArgsConstructor` предполагает `final` поля и конструкторную инъекцию.\n\n- Но поля не `final` и размечены `@Autowired` → смешение подходов.\n\n\n✅ Исправить: сделать `final` поля и убрать `@Autowired`.\n\n2. **Плохая выборка пользователей**\n\n\n```java\nuserRepository.findAll().stream().filter(u -> u.isActive())\n```\n\n- тянем всех пользователей из БД, фильтруем в памяти.\n\n\n✅ Исправить: репозиторий должен уметь `findAllByActiveTrue()`.\n\n3. **N+1 запросов**\n\n\n- На каждого пользователя отдельный запрос по заказам → при 100k пользователей будет катастрофа.\n\n\n✅ Исправить: считать статистику агрегирующим SQL:\n\n- `SELECT user_id, COUNT(*), SUM(cost) FROM orders WHERE user_id IN (...) GROUP BY user_id`  \n  или прямо по активным пользователям join-ом.\n\n\n4. **@Transactional на private-методе**\n\n\n- `@Transactional` через прокси.\n\n- `private save()` + вызов из того же класса → транзакция НЕ включится.\n\n\n✅ Исправить:\n\n- либо транзакцию на публичный entrypoint `calculate`,\n\n- либо вынести отправку/сохранение в отдельный бин.\n\n\n5. **Название метода save() неверное**\n\n\n- Он ничего не сохраняет, только шлёт в Kafka.\n\n\n✅ Переименовать в `publishStat(...)` / `sendStat(...)`.\n\n6. **System.out.println**\n\n\n- не логируется нормально, нет уровней, невозможно управлять.\n\n\n✅ Логгер.\n\n7. **Деньги в int**\n\n\n- `totalCost` может переполниться, а деньги нельзя хранить в `int`.\n\n\n✅ `long` (копейки) или `BigDecimal`.\n\n---\n\n### Пример исправленного варианта (с агрегацией в БД)\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class StatService {\n\n    private final UserRepository userRepository;\n    private final OrderRepository orderRepository;\n    private final KafkaService kafkaService;\n\n    public void calculate() {\n        List<Long> activeUserIds = userRepository.findAllActiveIds(); // запросом, не в память всех\n        if (activeUserIds.isEmpty()) return;\n\n        Instant now = Instant.now();\n\n        // агрегируем в БД: userId -> (count, sum)\n        List<UserOrderStat> stats = orderRepository.aggregateStatsByUserIds(activeUserIds);\n\n        // если нужно отправлять и тем, у кого 0 заказов — можно дополнить нулями\n        for (UserOrderStat s : stats) {\n            kafkaService.send(s.userId(), s.totalOrders(), s.totalCost(), now);\n        }\n    }\n\n    // удобная проекция\n    public record UserOrderStat(long userId, int totalOrders, long totalCost) {}\n}\n```\n\n**Что нужно в репозиториях (примерно):**\n\n- `UserRepository.findAllActiveIds()`\n\n- `OrderRepository.aggregateStatsByUserIds(...)`\n\n\n---\n\n### Если транзакция реально нужна\n\nЕсли помимо Kafka надо писать в БД (`statRepository.save(...)`), тогда:\n\n- транзакцию ставим на публичный метод, который делает запись в БД,\n\n- Kafka отправляем после коммита (outbox / transactional event).\n\n\nПример идеи:\n\n- сохранить stat в таблицу outbox в одной транзакции,\n\n- отдельный воркер читает outbox и отправляет в Kafka.\n\n\n{{< /details >}}"
  filepath = "code-review-stat-service"

[[tasks]]
  id = 36
  question = "Code review doAction(): проблемы и рефакторинг"
  answer = "**Условие задачи:**  \n📌 Дан метод `doAction(Object source)`, который возвращает строку в зависимости от типа объекта (`Car`, `Train`, `Jet`). Нужно проанализировать проблемы и предложить улучшения/рефакторинг с кодом.\n\n**Код:**\n\n```java\nimport java.util.List;\nimport java.util.Set;\nimport java.util.function.Predicate;\nimport java.util.function.UnaryOperator;\nimport java.util.stream.Stream;\n\npublic class Main {\n\n    private record Car(String engine) { }\n    private record Train(String engine) { }\n    private record Jet (String engine) { }\n\n    private record Book(String author, List<String> names) { }\n\n    public static void main(String[] args) {\n\n        // Задание 1: Проанализировать метод doAction(..), предложить возможный рефакторинг, исправления, оптимизацию.\n        String doIt = doAction(new Jet(\"Jet\"));\n        System.out.println(doIt);\n        }\n\n        // Например, в данном случае вызов для Jet будет после проверки всех условий (плохо).\n        // Какие могут быть еще проблемы в этом коде ?\n        private static String doAction(Object source) {\n                String doIt = \"Just action \";\n                if (source instanceof Car car) {\n                        return doIt + car.engine();\n                } else if (source instanceof Train train) {\n                        return doIt + train.engine();\n                } else {\n                        return doIt + ((Jet) source).engine();\n                }\n        }\n}\n```\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n{{< details \"Подсказки\" close >}}  \n💡 `else` делает `((Jet) source)` без проверки — если придёт другой тип (или null), будет `ClassCastException` / NPE.  \n💡 Метод принимает `Object` — слабый контракт: непонятно, что допустимо.  \n💡 Лишние импорты (`Set`, `Predicate`, `UnaryOperator`, `Stream`) и лишний `Book` — шум.  \n💡 Замечание про «плохо, что Jet проверяется последним» спорное: обычно это нормально, но проблема масштабируемости реальна (цепочка if/else растёт).  \n💡 Лучше использовать sealed interface + pattern matching switch, либо полиморфизм (общий интерфейс).  \n{{< /details >}}\n\n{{< details \"Решение\" close >}}\n\n### Проблемы в текущем doAction()\n\n1. **Опасный каст в else**  \n   Если `source` не `Jet`, будет `ClassCastException`:\n\n\n```java\nreturn doIt + ((Jet) source).engine();\n```\n\n2. **Нет обработки null**  \n   `source == null` → ветки `instanceof` не сработают → упадём на касте.\n\n3. **Слабый контракт метода**  \n   `Object` позволяет передать что угодно (`Book`, `String`, `Integer`) — метод не защищён.\n\n4. **Немасштабируемость**  \n   С ростом типов будет расти `if/else`, нарушается OCP.\n\n5. **Код-стайл/шум**  \n   Лишние импорты и `Book` не используются → ухудшают читабельность.\n\n\n---\n\n### Вариант 1 (лучший для современного Java): sealed + switch pattern matching\n\n```java\npublic class Main {\n\n    sealed interface Vehicle permits Car, Train, Jet {\n        String engine();\n    }\n\n    record Car(String engine) implements Vehicle {}\n    record Train(String engine) implements Vehicle {}\n    record Jet(String engine) implements Vehicle {}\n\n    private static String doAction(Vehicle source) {\n        String prefix = \"Just action \";\n        return switch (source) {\n            case Car car   -> prefix + car.engine();\n            case Train tr  -> prefix + tr.engine();\n            case Jet jet   -> prefix + jet.engine();\n        };\n    }\n}\n```\n\n✅ Плюсы:\n\n- Нельзя передать «левый» объект — контракт `Vehicle`.\n\n- `switch` исчерпывающий (compiler проверит).\n\n- Нет unsafe cast.\n\n- Легко расширять (добавил тип → компилятор попросит обработать).\n\n\n---\n\n### Вариант 2: оставить Object, но сделать безопасно (если менять сигнатуру нельзя)\n\n```java\nprivate static String doAction(Object source) {\n    if (source == null) {\n        throw new IllegalArgumentException(\"source must not be null\");\n    }\n\n    String prefix = \"Just action \";\n\n    if (source instanceof Car car) {\n        return prefix + car.engine();\n    }\n    if (source instanceof Train train) {\n        return prefix + train.engine();\n    }\n    if (source instanceof Jet jet) {\n        return prefix + jet.engine();\n    }\n\n    throw new IllegalArgumentException(\"Unsupported type: \" + source.getClass().getName());\n}\n```\n\n✅ Плюсы:\n\n- Не падаем `ClassCastException` неожиданно.\n\n- Явная ошибка «тип не поддержан».\n\n\n---\n\n### Мини-рефакторинг по файлу\n\n- Удалить неиспользуемые импорты.\n\n- Удалить `Book`, если не нужен.\n\n- Выровнять скобки в `main` (сейчас есть лишняя `}`).\n\n\n{{< /details >}}"
  filepath = "doaction-code-review"

[[tasks]]
  id = 37
  question = "Провести код-ревью переименования файла"
  answer = "**Условие задачи:**  \nСистема хранит файлы на файловой системе, а их метаданные — в PostgreSQL.\n\nНеобходимо провести код-ревью метода, который переименовывает файл и обновляет его имя в базе данных.\n\n**Код:**\n\n```java\n@Transactional\npublic void process(String oldName, String newName) {\n    Long id = exec(\n            \"select id from file where name='\"\n                    + oldName + \"'\"\n    );\n\n    processFile(oldName, newName);\n\n    exec(\n            \"update file set name=\\\"\"\n                    + newName\n                    + \"\\\" where id = \"\n                    + id\n    );\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `@Transactional` управляет транзакцией базы данных, но не файловой системой.  \n💡 SQL нельзя собирать конкатенацией строк.  \n💡 Переименовывать файл надёжнее по идентификатору, а не по имени.  \n💡 Необходимо проверить новое имя и возможные коллизии.  \n💡 Между чтением записи и её обновлением возможны конкурентные изменения.  \n💡 Для сбоя между операциями нужен откат, повторная обработка или механизм сверки.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновные проблемы:\n\n1. SQL-инъекция из-за конкатенации параметров:\n    \n\n```java\n\"where name='\" + oldName + \"'\"\n```\n\nНужно использовать параметризованные запросы или Spring Data Repository.\n\n2. Аннотация `@Transactional` распространяется только на PostgreSQL. Если файл уже переименован, а обновление базы завершилось ошибкой, файловая система автоматически не откатится.\n    \n3. Поиск по имени ненадёжен. Имя может быть неуникальным или измениться конкурентным запросом. Метод лучше принимать `fileId`.\n    \n4. Необходимо проверять `newName`:\n    \n\n- пустое значение;\n    \n- запрещённые символы;\n    \n- `../`, `/` и `\\`;\n    \n- превышение допустимой длины;\n    \n- существование файла с таким именем.\n    \n\n5. Уникальность имени должна обеспечиваться ограничением в базе данных, например по паре `(directory_id, name)`.\n    \n\nМинимальный вариант с блокировкой записи и компенсацией:\n\n```java\n@Transactional\npublic void rename(long fileId, String newName) {\n    validateFileName(newName);\n\n    FileMetadata file = repository.findByIdForUpdate(fileId)\n            .orElseThrow(() ->\n                    new IllegalArgumentException(\"File not found\")\n            );\n\n    String oldName = file.getName();\n\n    if (oldName.equals(newName)) {\n        return;\n    }\n\n    storage.rename(oldName, newName);\n\n    try {\n        file.setName(newName);\n        repository.saveAndFlush(file);\n    } catch (RuntimeException exception) {\n        try {\n            storage.rename(newName, oldName);\n        } catch (RuntimeException rollbackException) {\n            exception.addSuppressed(rollbackException);\n        }\n\n        throw exception;\n    }\n}\n```\n\nРепозиторий с блокировкой:\n\n```java\npublic interface FileMetadataRepository\n        extends JpaRepository<FileMetadata, Long> {\n\n    @Lock(LockModeType.PESSIMISTIC_WRITE)\n    @Query(\"\"\"\n            select file\n            from FileMetadata file\n            where file.id = :id\n            \"\"\")\n    Optional<FileMetadata> findByIdForUpdate(long id);\n}\n```\n\nТакой вариант уменьшает риск рассинхронизации, но не обеспечивает абсолютную атомарность. Например, процесс может завершиться аварийно после переименования файла, но до обновления базы.\n\nДля production-решения лучше использовать последовательность состояний:\n\n```text\nREADY → RENAMING → READY\n                  ↘ ERROR\n```\n\nЗапрос создаёт операцию переименования в базе. Отдельный обработчик выполняет операцию на файловой системе, поддерживает повторные попытки и после успеха обновляет метаданные.\n\nДополнительно нужна фоновая сверка базы данных и файловой системы, которая обнаруживает и исправляет незавершённые операции.\n\n{{< /details >}}"
  filepath = "file-rename-code-review"
