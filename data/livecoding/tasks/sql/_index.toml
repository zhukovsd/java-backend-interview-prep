category = "SQL"

[[tasks]]
  id = 1
  question = "Найти ID юнитов, проданных на сумму более 1000 рублей после 10:00"
  answer = "**Условие задачи:**  \nДаны таблицы `Unit` и `Sales`.\n\nНеобходимо найти `id` юнитов, сумма продаж которых после `2024-06-03 10:00` превышает `1000` рублей.\n\n**Код:**\n\n```sql\nCREATE TABLE Unit (\n    Id INT PRIMARY KEY,\n    Price DECIMAL(10, 2)\n);\n\nCREATE TABLE Sales (\n    Id INT PRIMARY KEY,\n    Unit_id INT,\n    Sale_time TIMESTAMP,\n    FOREIGN KEY (Unit_id) REFERENCES Unit(Id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини таблицы `Unit` и `Sales` по `Unit.Id = Sales.Unit_id`.  \n💡 Сначала отфильтруй продажи по времени через `WHERE`.  \n💡 Затем сгруппируй продажи по идентификатору юнита.  \n💡 Для фильтрации агрегированного результата используй `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT u.Id\nFROM Unit u\nJOIN Sales s\n    ON s.Unit_id = u.Id\nWHERE s.Sale_time > TIMESTAMP '2024-06-03 10:00:00'\nGROUP BY u.Id\nHAVING SUM(u.Price) > 1000;\n```\n\n`WHERE` оставляет только продажи, совершённые после `10:00`.\n\nПосле этого строки группируются по `u.Id`, а:\n\n```sql\nHAVING SUM(u.Price) > 1000\n```\n\nоставляет только те юниты, общая сумма продаж которых превышает `1000` рублей.\n\n{{< /details >}}"
  filepath = "units-sold-after-time"

[[tasks]]
  id = 2
  question = "Найти пользователей, у которых больше одного автомобиля"
  answer = "**Условие задачи:**  \nДаны таблицы пользователей и автомобилей.\n\nНеобходимо написать SQL-запрос, который выведет пользователей, у которых зарегистрировано больше одного автомобиля.\n\n**Код:**\n\n```sql\nCREATE TABLE users (\n    id INT PRIMARY KEY,\n    name VARCHAR(50)\n);\n\nINSERT INTO users (id, name) VALUES\n(1, 'Ivan'),\n(2, 'Oleg'),\n(3, 'Anna'),\n(4, 'Ivan'),\n(5, 'Ted');\n\nCREATE TABLE car (\n    id INT PRIMARY KEY,\n    model VARCHAR(50),\n    user_id INT,\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n\nINSERT INTO car (id, model, user_id) VALUES\n(4422, 'Opel 1', 1),\n(4523, 'BMW 5', 1),\n(4612, 'VW', 2),\n(4853, 'BMW 6', 3);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини пользователей и автомобили по `users.id = car.user_id`.  \n💡 Сгруппируй результат по пользователю.  \n💡 Количество автомобилей можно определить через `COUNT()`.  \n💡 Для фильтрации результата после группировки используй `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    u.id,\n    u.name,\n    COUNT(c.id) AS car_count\nFROM users u\nJOIN car c\n    ON c.user_id = u.id\nGROUP BY u.id, u.name\nHAVING COUNT(c.id) > 1;\n```\n\n`JOIN` связывает пользователя с его автомобилями, после чего строки группируются по пользователю.\n\nУсловие:\n\n```sql\nHAVING COUNT(c.id) > 1\n```\n\nоставляет только пользователей, у которых больше одного автомобиля.\n\nДля приведённых данных результат будет:\n\n```text\nid | name | car_count\n---------------------\n1  | Ivan | 2\n```\n\nГруппировка выполняется по `id`, а не только по имени, поскольку разные пользователи могут иметь одинаковые имена.\n\n{{< /details >}}"
  filepath = "multiple-cars-users"

[[tasks]]
  id = 3
  question = "Вывести имена студентов и их университетов для студентов на букву C  "
  answer = "**Условие задачи:**  \nДаны таблицы студентов и университетов.\n\nНеобходимо вывести:\n\n- имя студента;\n    \n- название университета, в котором он учится;\n    \n\nтолько для студентов, чьи имена начинаются с буквы `C`.\n\n**Код:**\n\n```sql\nCREATE TABLE universities (\n    id INT PRIMARY KEY,\n    name VARCHAR(100)\n);\n\nCREATE TABLE students (\n    id INT PRIMARY KEY,\n    name VARCHAR(100),\n    university_id INT,\n    FOREIGN KEY (university_id) REFERENCES universities(id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини таблицы `students` и `universities` по `university_id`.  \n💡 Для фильтрации строк по началу значения используй `LIKE`.  \n💡 Шаблон `C%` означает: строка начинается с `C`, после которой может идти любое количество символов.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    s.name AS student_name,\n    u.name AS university_name\nFROM students s\nJOIN universities u\n    ON u.id = s.university_id\nWHERE s.name LIKE 'C%';\n```\n\n`JOIN` связывает каждого студента с его университетом.\n\nУсловие:\n\n```sql\nWHERE s.name LIKE 'C%'\n```\n\nоставляет только студентов, чьи имена начинаются с буквы `C`.\n\nНапример, для студентов:\n\n```text\nChris\nCarl\nAnna\n```\n\nв результат попадут только `Chris` и `Carl` вместе с названиями их университетов.\n\n{{< /details >}}"
  filepath = "students-names-c"

[[tasks]]
  id = 4
  question = "Выбрать профили, у которых больше 10 постов"
  answer = "**Условие задачи:**  \nДаны таблицы профилей, постов и количества подписок.\n\nНеобходимо выбрать профили, у которых опубликовано больше `10` постов.\n\n**Код:**\n\n```sql\nCREATE TABLE profile (\n    id BIGSERIAL PRIMARY KEY,\n    nickname VARCHAR,\n    registered_at TIMESTAMP\n);\n\nCREATE TABLE post (\n    id BIGSERIAL PRIMARY KEY,\n    owner_id BIGINT REFERENCES profile(id),\n    body TEXT,\n    inserted_at TIMESTAMP,\n    likes_count INT\n);\n\nCREATE TABLE subscription_count (\n    profile_id BIGINT REFERENCES profile(id) UNIQUE,\n    followers_count INT,\n    following_count INT\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини `profile` и `post` по `profile.id = post.owner_id`.  \n💡 Сгруппируй записи по профилю.  \n💡 Количество постов можно получить через `COUNT()`.  \n💡 Для фильтрации после группировки используй `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    p.id,\n    p.nickname\nFROM profile p\nJOIN post po\n    ON po.owner_id = p.id\nGROUP BY p.id, p.nickname\nHAVING COUNT(po.id) > 10;\n```\n\n`JOIN` связывает каждый профиль с его постами.\n\nПосле этого строки группируются по профилю, а условие:\n\n```sql\nHAVING COUNT(po.id) > 10\n```\n\nоставляет только профили, у которых опубликовано больше `10` постов.\n\nТаблица `subscription_count` для решения этой задачи не требуется.\n\n{{< /details >}}"
  filepath = "profiles-more-than-10-posts"

[[tasks]]
  id = 5
  question = "Вывести имена работников и их начисления"
  answer = "**Условие задачи:**  \nДаны две таблицы со связью `один-ко-многим`:\n\n- `Persons` — работники;\n    \n- `Payments` — ежемесячные начисления работников.\n    \n\nНеобходимо написать SQL-запрос, который выводит имя работника и сумму каждого его начисления.\n\n**Код:**\n\n```text\nPersons\n\nid | name\n---|------\n1  | Petya\n2  | Vasya\n3  | Kolya\n```\n\n```text\nPayments\n\nid | persons_id | value\n---|------------|------\n1  | 1          | 10\n2  | 1          | 20\n3  | 3          | 15\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Таблицы связаны через `Persons.id = Payments.persons_id`.  \n💡 Для объединения данных используй `JOIN`.  \n💡 Из `Persons` нужно получить `name`, а из `Payments` — `value`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    p.name,\n    pay.value\nFROM Persons p\nJOIN Payments pay\n    ON pay.persons_id = p.id;\n```\n\n`JOIN` связывает каждое начисление с соответствующим работником.\n\nРезультат:\n\n```text\nname  | value\n------|------\nPetya | 10\nPetya | 20\nKolya | 15\n```\n\n`Vasya` в результат не попадёт, поскольку у него нет записей в таблице `Payments`.\n\nЕсли необходимо вывести также работников без начислений, вместо `JOIN` следует использовать `LEFT JOIN`.\n\n{{< /details >}}"
  filepath = "persons-payments"

[[tasks]]
  id = 6
  question = "Найти минимальную и максимальную зарплату по отделам среди работающих сотрудников  "
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `units` — подразделения компании;\n    \n- `employees` — сотрудники.\n    \n\nНеобходимо для каждого подразделения вывести минимальную и максимальную зарплату среди сотрудников, которые не уволены.\n\n**Код:**\n\n```text\nunits\n\nid   INT PRIMARY KEY\nname TEXT\n```\n\n```text\nemployees\n\nid      INT PRIMARY KEY\nunit_id INT REFERENCES units(id)\nsalary  NUMERIC\nfired   BOOLEAN\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини `units` и `employees` по `units.id = employees.unit_id`.  \n💡 Оставь только сотрудников с `fired = FALSE`.  \n💡 Сгруппируй записи по подразделению.  \n💡 Для поиска минимальной и максимальной зарплаты используй `MIN()` и `MAX()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    u.id AS unit_id,\n    u.name AS unit_name,\n    MIN(e.salary) AS min_salary,\n    MAX(e.salary) AS max_salary\nFROM units u\nJOIN employees e\n    ON e.unit_id = u.id\nWHERE e.fired = FALSE\nGROUP BY u.id, u.name;\n```\n\n`WHERE e.fired = FALSE` исключает уволенных сотрудников до выполнения агрегации.\n\nПосле этого записи группируются по подразделениям, а:\n\n```sql\nMIN(e.salary)\nMAX(e.salary)\n```\n\nвозвращают минимальную и максимальную зарплату в каждом отделе.\n\nПодразделения, в которых нет работающих сотрудников, в результат не попадут из-за использования `JOIN`.\n\n{{< /details >}}"
  filepath = "min-max-salary"

[[tasks]]
  id = 7
  question = "Вывести ID классов, в которых нет студентов"
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `student` — студенты;\n    \n- `class` — классы.\n    \n\nНеобходимо вывести `id` классов, в которых нет ни одного студента.\n\nОграничение: нельзя использовать подзапросы.\n\n**Код:**\n\n```text\nstudent\n\nid       INT PRIMARY KEY\nclass_id INT\n```\n\n```text\nclass\n\nid INT PRIMARY KEY\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй `LEFT JOIN`, чтобы сохранить в результате все классы.  \n💡 Если для класса нет соответствующего студента, поля таблицы `student` будут содержать `NULL`.  \n💡 Остаётся отфильтровать такие строки через `WHERE`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT c.id\nFROM class c\nLEFT JOIN student s\n    ON s.class_id = c.id\nWHERE s.id IS NULL;\n```\n\n`LEFT JOIN` возвращает все классы, в том числе те, для которых нет совпадений в таблице `student`.\n\nДля таких классов `s.id` будет равен `NULL`, поэтому условие:\n\n```sql\nWHERE s.id IS NULL\n```\n\nоставляет только классы без студентов.\n\nПодзапросы в решении не используются.\n\n{{< /details >}}"
  filepath = "empty-classes"

[[tasks]]
  id = 8
  question = "Получить ID пользователей, потративших более 1 000 000 рублей  "
  answer = "**Условие задачи:**  \nДана таблица `orders`, содержащая историю всех покупок пользователей.\n\nНеобходимо получить `id` пользователей, которые за всё время совершили покупки на общую сумму более `1 000 000` рублей.\n\nОграничение: нельзя использовать подзапросы.\n\n**Код:**\n\n```text\norders\n\nid      INT PRIMARY KEY\nuser_id INT\namount  NUMERIC\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй покупки по `user_id`.  \n💡 Общую сумму покупок можно получить через `SUM(amount)`.  \n💡 Для фильтрации агрегированного результата используй `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT user_id\nFROM orders\nGROUP BY user_id\nHAVING SUM(amount) > 1000000;\n```\n\n`GROUP BY user_id` объединяет все покупки одного пользователя.\n\nЗатем:\n\n```sql\nSUM(amount)\n```\n\nвычисляет общую сумму его покупок, а условие:\n\n```sql\nHAVING SUM(amount) > 1000000\n```\n\nоставляет только пользователей, потративших более `1 000 000` рублей.\n\nПодзапросы в решении не используются.\n\n{{< /details >}}"
  filepath = "big-spenders"

[[tasks]]
  id = 9
  question = "Найти имена, которые встречаются два и более раз"
  answer = "**Условие задачи:**  \nДана таблица `users`:\n\n```text\nid   NUMBER AUTOINCREMENT UNIQUE\nname VARCHAR\n```\n\nПоле `name` не является уникальным.\n\nНеобходимо вывести имена, которые встречаются в таблице два и более раз.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй записи по полю `name`.  \n💡 Количество записей в каждой группе можно посчитать через `COUNT(*)`.  \n💡 Для фильтрации сгруппированных данных используй `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT name\nFROM users\nGROUP BY name\nHAVING COUNT(*) >= 2;\n```\n\n`GROUP BY name` объединяет строки с одинаковыми именами.\n\nУсловие:\n\n```sql\nHAVING COUNT(*) >= 2\n```\n\nоставляет только те группы, в которых имя встречается минимум два раза.\n\nНапример, для данных:\n\n```text\nid | name\n---|------\n1  | Ivan\n2  | Oleg\n3  | Ivan\n4  | Anna\n5  | Anna\n```\n\nрезультат будет:\n\n```text\nIvan\nAnna\n```\n\n{{< /details >}}"
  filepath = "duplicate-names"

[[tasks]]
  id = 10
  question = "Выбрать клиентов, у которых больше трёх заказов дороже 10  "
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `Customer` — клиенты;\n    \n- `Order` — заказы клиентов.\n    \n\nНеобходимо выбрать всех клиентов, у которых больше трёх заказов с ценой больше `10`.\n\n**Код:**\n\n```text\nCustomer\n\nId\nname\n```\n\n```text\nOrder\n\nId\ncustomer_id\nPrice\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини клиентов и заказы по `Customer.Id = Order.customer_id`.  \n💡 Сначала оставь только заказы с `Price > 10`.  \n💡 Затем сгруппируй данные по клиенту.  \n💡 Для отбора клиентов с более чем тремя такими заказами используй `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    c.Id,\n    c.name\nFROM Customer c\nJOIN \"Order\" o\n    ON o.customer_id = c.Id\nWHERE o.Price > 10\nGROUP BY c.Id, c.name\nHAVING COUNT(o.Id) > 3;\n```\n\nУсловие:\n\n```sql\nWHERE o.Price > 10\n```\n\nоставляет только заказы дороже `10`.\n\nПосле этого записи группируются по клиенту, а:\n\n```sql\nHAVING COUNT(o.Id) > 3\n```\n\nоставляет только клиентов, у которых больше трёх таких заказов.\n\nИмя `Order` может быть зарезервированным словом в СУБД, поэтому на практике таблицу лучше назвать, например, `orders`.\n\n{{< /details >}}"
  filepath = "customers-multiple-orders"

[[tasks]]
  id = 11
  question = "Посчитать пользователей по статусам и найти пропавших пользователей  "
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `User` — пользователи;\n    \n- `Status` — статусы пользователей.\n    \n\nВсего в таблице `User` находится `10` пользователей.\n\nПосле подсчёта получился результат:\n\n```text\nНовый    | 5\nРаботает | 3\n```\n\nНеобходимо написать запрос, который покажет количество пользователей в каждом статусе, и объяснить, почему в результате отображаются только `8` из `10` пользователей.\n\n**Код:**\n\n```text\nUser\n\nid\nname\nstatus_id\n```\n\n```text\nStatus\n\nid\nname\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Обычный `INNER JOIN` возвращает только строки, для которых найдено соответствие в обеих таблицах.  \n💡 Проверь пользователей, у которых `status_id IS NULL`.  \n💡 Чтобы не потерять таких пользователей, используй `LEFT JOIN`.  \n💡 Отсутствующий статус можно вывести отдельной группой через `COALESCE`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nЕсли написать запрос через обычный `JOIN`:\n\n```sql\nSELECT\n    s.name AS status_name,\n    COUNT(u.id) AS user_count\nFROM users u\nJOIN status s\n    ON s.id = u.status_id\nGROUP BY s.id, s.name;\n```\n\nпользователи без статуса в результат не попадут.\n\nНапример, если у двух пользователей:\n\n```text\nstatus_id = NULL\n```\n\nто `INNER JOIN` исключит их, и сумма количества пользователей будет равна `8`.\n\nЧтобы сохранить всех пользователей, нужно использовать `LEFT JOIN`:\n\n```sql\nSELECT\n    COALESCE(s.name, 'Без статуса') AS status_name,\n    COUNT(u.id) AS user_count\nFROM users u\nLEFT JOIN status s\n    ON s.id = u.status_id\nGROUP BY\n    s.id,\n    s.name;\n```\n\nРезультат может выглядеть так:\n\n```text\nstatus_name | user_count\n------------|-----------\nНовый       | 5\nРаботает    | 3\nБез статуса | 2\n```\n\nТаким образом, два пользователя не исчезли из таблицы — они были исключены из результата из-за `INNER JOIN`, поскольку для них не нашлось соответствующего статуса.\n\n{{< /details >}}"
  filepath = "missing-users"

[[tasks]]
  id = 12
  question = "Показать компании, отделы и количество сотрудников в каждом отделе  "
  answer = "**Условие задачи:**  \nДаны три таблицы:\n\n- `company` — компании;\n    \n- `department` — отделы компаний;\n    \n- `employee` — сотрудники отделов.\n    \n\nНеобходимо вывести:\n\n- название компании;\n    \n- название отдела;\n    \n- количество сотрудников в этом отделе.\n    \n\nОтделы без сотрудников также должны присутствовать в результате с количеством `0`.\n\n**Код:**\n\n```sql\nCREATE TABLE company (\n    id BIGINT PRIMARY KEY,\n    name_ VARCHAR NOT NULL\n);\n\nCREATE TABLE department (\n    id BIGINT PRIMARY KEY,\n    name_ VARCHAR NOT NULL,\n    company_id BIGINT NOT NULL,\n    FOREIGN KEY (company_id) REFERENCES company(id)\n);\n\nCREATE TABLE employee (\n    id BIGINT PRIMARY KEY,\n    name_ VARCHAR NOT NULL,\n    department_id BIGINT NOT NULL,\n    FOREIGN KEY (department_id) REFERENCES department(id)\n);\n\nINSERT INTO company (id, name_) VALUES\n(1, 'Company 1'),\n(2, 'Company 2'),\n(3, 'Company 3');\n\nINSERT INTO department (id, name_, company_id) VALUES\n(1, 'Department 1', 1),\n(2, 'Department 2', 1),\n(3, 'Department 3', 2);\n\nINSERT INTO employee (id, name_, department_id) VALUES\n(1, 'Employee 1', 1),\n(2, 'Employee 2', 2),\n(3, 'Employee 3', 3);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини `company` и `department` по `company.id = department.company_id`.  \n💡 Для сотрудников используй `LEFT JOIN`, чтобы не потерять отделы без сотрудников.  \n💡 Количество сотрудников можно посчитать через `COUNT(employee.id)`.  \n💡 Сгруппируй результат по компании и отделу.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    c.name_ AS company_name,\n    d.name_ AS department_name,\n    COUNT(e.id) AS employee_count\nFROM company c\nJOIN department d\n    ON d.company_id = c.id\nLEFT JOIN employee e\n    ON e.department_id = d.id\nGROUP BY\n    c.id,\n    c.name_,\n    d.id,\n    d.name_\nORDER BY\n    c.name_,\n    d.name_;\n```\n\n`JOIN` связывает компании с их отделами.\n\nДля сотрудников используется:\n\n```sql\nLEFT JOIN employee e\n    ON e.department_id = d.id\n```\n\nпоэтому отдел без сотрудников не исчезнет из результата.\n\nВажно считать именно:\n\n```sql\nCOUNT(e.id)\n```\n\nа не `COUNT(*)`: при отсутствии сотрудников `COUNT(e.id)` вернёт `0`.\n\nДля приведённых данных результат будет:\n\n```text\ncompany_name | department_name | employee_count\n-------------|-----------------|---------------\nCompany 1    | Department 1    | 1\nCompany 1    | Department 2    | 1\nCompany 2    | Department 3    | 1\n```\n\nКомпания без отделов в такой результат не попадёт, поскольку вывод строится по отделам.\n\n{{< /details >}}"
  filepath = "company-department-employee-count"

[[tasks]]
  id = 13
  question = "Спроектировать связь пользователя и автомобилей"
  answer = "**Условие задачи:**  \nНеобходимо спроектировать структуру базы данных, в которой:\n\n- один пользователь может владеть несколькими автомобилями;\n    \n- каждый автомобиль принадлежит только одному пользователю.\n    \n\nНужно определить связь между таблицами пользователей и автомобилей.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Такая связь называется `One-to-Many`.  \n💡 Внешний ключ должен находиться на стороне «многие», то есть в таблице автомобилей.  \n💡 Поле `user_id` в таблице автомобилей должно ссылаться на `users.id`.  \n💡 Чтобы получить пользователей вместе с автомобилями, можно использовать `JOIN`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nТаблица пользователей:\n\n```sql\nCREATE TABLE users (\n    id INT PRIMARY KEY,\n    name VARCHAR(50) NOT NULL\n);\n```\n\nТаблица автомобилей:\n\n```sql\nCREATE TABLE cars (\n    id INT PRIMARY KEY,\n    model VARCHAR(50) NOT NULL,\n    user_id INT NOT NULL,\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n```\n\nСвязь выглядит так:\n\n```text\nusers              cars\n\nid  <------------- user_id\n1                    N\n```\n\nОдин пользователь может иметь несколько записей в `cars`, но каждая машина содержит только один `user_id`.\n\nПример данных:\n\n```sql\nINSERT INTO users (id, name) VALUES\n(1, 'Ivan'),\n(2, 'Oleg');\n\nINSERT INTO cars (id, model, user_id) VALUES\n(4422, 'Opel 1', 1),\n(4523, 'BMW 5', 1),\n(4612, 'VW', 2);\n```\n\nПолучить пользователей вместе с их автомобилями:\n\n```sql\nSELECT\n    u.id AS user_id,\n    u.name AS user_name,\n    c.id AS car_id,\n    c.model AS car_model\nFROM users u\nLEFT JOIN cars c\n    ON c.user_id = u.id\nORDER BY u.id;\n```\n\n`LEFT JOIN` позволяет вывести в том числе пользователей, у которых пока нет автомобилей.\n\nТаким образом, связь `One-to-Many` реализуется внешним ключом `cars.user_id`, который ссылается на `users.id`.\n\n{{< /details >}}"
  filepath = "user-car-relationship"

[[tasks]]
  id = 14
  question = "Найти пользователей, у которых больше одного автомобиля  "
  answer = "**Условие задачи:**  \nДаны таблицы пользователей и автомобилей.\n\nНеобходимо вывести имена пользователей, у которых больше одного автомобиля.\n\n**Код:**\n\n```sql\nCREATE TABLE users (\n    id INT PRIMARY KEY,\n    name VARCHAR(50) NOT NULL\n);\n\nINSERT INTO users (id, name) VALUES\n(1, 'Ivan'),\n(2, 'Oleg'),\n(3, 'Anna'),\n(4, 'Ivan'),\n(5, 'Ted');\n\nCREATE TABLE cars (\n    id INT PRIMARY KEY,\n    model VARCHAR(50) NOT NULL,\n    user_id INT NOT NULL,\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n\nINSERT INTO cars (id, model, user_id) VALUES\n(4422, 'Opel 1', 1),\n(4523, 'BMW 5', 2),\n(4612, 'VW', 3),\n(4853, 'BMW 6', 4);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини пользователей и автомобили по `users.id = cars.user_id`.  \n💡 Сгруппируй данные по пользователю.  \n💡 Количество автомобилей можно посчитать через `COUNT()`.  \n💡 Для фильтрации после группировки используй `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT u.name\nFROM users u\nJOIN cars c\n    ON c.user_id = u.id\nGROUP BY u.id, u.name\nHAVING COUNT(c.id) > 1;\n```\n\n`JOIN` связывает каждого пользователя с его автомобилями.\n\nПосле этого записи группируются по пользователю, а условие:\n\n```sql\nHAVING COUNT(c.id) > 1\n```\n\nоставляет только пользователей, у которых больше одного автомобиля.\n\nВажно группировать по `u.id`, а не только по имени, поскольку разные пользователи могут иметь одинаковые имена.\n\nДля приведённых данных запрос вернёт пустой результат, потому что у каждого пользователя сейчас только по одному автомобилю.\n\n{{< /details >}}"
  filepath = "users-multiple-cars"

[[tasks]]
  id = 15
  question = "Найти товары с максимальной ценой в каждой категории"
  answer = "**Условие задачи:**  \nДана таблица `Prices` с товарами, их категориями и ценами.\n\nНеобходимо для каждой категории вывести товар с максимальной ценой:\n\n- `Category` — категория;\n    \n- `Name` — название товара;\n    \n- `Price` — максимальная цена в категории.\n    \n\nЕсли несколько товаров имеют одинаковую максимальную цену, необходимо вывести их все.\n\n**Код:**\n\n```text\nName        | Category            | Price\n------------|---------------------|------\nАпельсин    | Фрукты              | 50\nМандарин    | Фрукты              | 45\nЯблоко      | Фрукты              | 30\nОгурец      | Овощи               | 35\nТомат       | Овощи               | 40\nКартофель   | Овощи               | 25\nМолоко      | Молочные продукты   | 30\nТворог      | Молочные продукты   | 40\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для каждой категории необходимо определить максимальную цену.  \n💡 Можно использовать оконную функцию `MAX() OVER (PARTITION BY ...)`.  \n💡 Затем оставить только товары, цена которых равна максимуму своей категории.  \n💡 Такой подход корректно вернёт несколько товаров, если максимальная цена совпадает.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант с оконной функцией:\n\n```sql\nSELECT\n    Category,\n    Name,\n    Price\nFROM (\n    SELECT\n        Category,\n        Name,\n        Price,\n        MAX(Price) OVER (\n            PARTITION BY Category\n        ) AS max_price\n    FROM Prices\n) p\nWHERE Price = max_price;\n```\n\nОконная функция:\n\n```sql\nMAX(Price) OVER (PARTITION BY Category)\n```\n\nвычисляет максимальную цену отдельно для каждой категории, не объединяя строки в одну.\n\nПосле этого условие:\n\n```sql\nWHERE Price = max_price\n```\n\nоставляет только самые дорогие товары.\n\nДля приведённых данных результат будет:\n\n```text\nCategory            | Name      | Price\n--------------------|-----------|------\nФрукты              | Апельсин  | 50\nОвощи               | Томат     | 40\nМолочные продукты   | Творог    | 40\n```\n\nЕсли в одной категории несколько товаров имеют одинаковую максимальную цену, в результат попадут все такие товары.\n\n{{< /details >}}"
  filepath = "max-price-by-category"

[[tasks]]
  id = 16
  question = "Найти клиентов по ИНН и КПП  "
  answer = "**Условие задачи:**  \nДана таблица `KF_ADAPTER_R_CLIENT`, содержащая информацию о клиентах.\n\nНеобходимо написать SQL-запрос, который найдёт всех клиентов по точному совпадению `inn` и `kpp`.\n\n**Код:**\n\n```sql\nCREATE TABLE KF_ADAPTER_R_CLIENT (\n    id SERIAL PRIMARY KEY,\n    abs_id VARCHAR(255),\n    branch_id VARCHAR(255),\n    abs_branch_id VARCHAR(255),\n    short_name VARCHAR(255),\n    inn VARCHAR(12),\n    kpp VARCHAR(9),\n    sign_count INT,\n    deleted BOOLEAN\n);\n\nCREATE TABLE KF_ADAPTER_R_DELEGATE (\n    id SERIAL PRIMARY KEY,\n    client_id INT,\n    abs_id VARCHAR(255),\n    user_id VARCHAR(255),\n    full_name VARCHAR(255),\n    phone VARCHAR(15),\n    sign_role VARCHAR(50),\n    deleted BOOLEAN,\n    FOREIGN KEY (client_id)\n        REFERENCES KF_ADAPTER_R_CLIENT(id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для фильтрации строк используй `WHERE`.  \n💡 ИНН и КПП нужно проверять одновременно через `AND`.  \n💡 Для точного совпадения используй оператор `=`.  \n💡 Таблица `KF_ADAPTER_R_DELEGATE` для этого запроса не требуется.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT *\nFROM KF_ADAPTER_R_CLIENT\nWHERE inn = '7701234567'\n  AND kpp = '770101001';\n```\n\nУсловие:\n\n```sql\nWHERE inn = '7701234567'\n  AND kpp = '770101001'\n```\n\nоставляет только тех клиентов, у которых одновременно совпадают и ИНН, и КПП.\n\nЕсли значения передаются из приложения, запрос обычно параметризуют:\n\n```sql\nSELECT *\nFROM KF_ADAPTER_R_CLIENT\nWHERE inn = :inn\n  AND kpp = :kpp;\n```\n\nДля поиска по ИНН и КПП достаточно таблицы `KF_ADAPTER_R_CLIENT`, поэтому `JOIN` с `KF_ADAPTER_R_DELEGATE` не нужен.\n\n{{< /details >}}"
  filepath = "find-clients-by-inn-kpp"

[[tasks]]
  id = 17
  question = "Найти делегатов клиента по ИНН и КПП"
  answer = "**Условие задачи:**  \nДаны таблицы клиентов и их делегатов.\n\nНеобходимо по `inn` и `kpp` клиента найти всех связанных с ним делегатов и вывести:\n\n- `full_name` — полное имя;\n    \n- `phone` — номер телефона.\n    \n\n**Код:**\n\n```sql\nCREATE TABLE KF_ADAPTER_R_CLIENT (\n    id SERIAL PRIMARY KEY,\n    abs_id VARCHAR(255),\n    branch_id VARCHAR(255),\n    abs_branch_id VARCHAR(255),\n    short_name VARCHAR(255),\n    inn VARCHAR(12),\n    kpp VARCHAR(9),\n    sign_count INT,\n    deleted BOOLEAN\n);\n\nCREATE TABLE KF_ADAPTER_R_DELEGATE (\n    id SERIAL PRIMARY KEY,\n    client_id INT,\n    abs_id VARCHAR(255),\n    user_id VARCHAR(255),\n    full_name VARCHAR(255),\n    phone VARCHAR(15),\n    sign_role VARCHAR(50),\n    deleted BOOLEAN,\n    FOREIGN KEY (client_id)\n        REFERENCES KF_ADAPTER_R_CLIENT(id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Таблицы связаны по `KF_ADAPTER_R_DELEGATE.client_id = KF_ADAPTER_R_CLIENT.id`.  \n💡 Для объединения используй `JOIN`.  \n💡 Фильтруй клиента по `inn` и `kpp`.  \n💡 Если удалённых делегатов выводить не нужно, добавь `deleted = FALSE`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    d.full_name,\n    d.phone\nFROM KF_ADAPTER_R_DELEGATE d\nJOIN KF_ADAPTER_R_CLIENT c\n    ON c.id = d.client_id\nWHERE c.inn = '7701234567'\n  AND c.kpp = '770101001'\n  AND d.deleted = FALSE;\n```\n\n`JOIN` связывает делегатов с клиентами по `client_id`.\n\nУсловия:\n\n```sql\nc.inn = '7701234567'\nAND c.kpp = '770101001'\n```\n\nвыбирают нужного клиента, а:\n\n```sql\nd.deleted = FALSE\n```\n\nисключает удалённых делегатов.\n\nЕсли запрос вызывается из приложения, значения лучше передавать параметрами:\n\n```sql\nSELECT\n    d.full_name,\n    d.phone\nFROM KF_ADAPTER_R_DELEGATE d\nJOIN KF_ADAPTER_R_CLIENT c\n    ON c.id = d.client_id\nWHERE c.inn = :inn\n  AND c.kpp = :kpp\n  AND d.deleted = FALSE;\n```\n\n{{< /details >}}"
  filepath = "find-delegates-by-inn-kpp"

[[tasks]]
  id = 18
  question = "Найти топ-10 номеров, получивших больше всего SMS"
  answer = "**Условие задачи:**  \nДана таблица `sms` с отправленными сообщениями.\n\nНеобходимо:\n\n- найти номера телефонов, которые получили больше одной SMS;\n    \n- посчитать количество сообщений для каждого номера;\n    \n- отсортировать номера по убыванию количества SMS;\n    \n- вывести только топ-10 номеров.\n    \n\n**Код:**\n\n```text\nsms\n\nid | phone      | message\n---|------------|----------------\n1  | 9876552222 | some message\n2  | 9876552222 | some message\n3  | 9876552234 | another message\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй записи по `phone`.  \n💡 Количество сообщений можно посчитать через `COUNT(*)`.  \n💡 Для фильтрации номеров с более чем одной SMS используй `HAVING`.  \n💡 Для получения самых популярных номеров используй `ORDER BY ... DESC` и `LIMIT 10`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    phone,\n    COUNT(*) AS sms_count\nFROM sms\nGROUP BY phone\nHAVING COUNT(*) > 1\nORDER BY sms_count DESC\nLIMIT 10;\n```\n\n`GROUP BY phone` объединяет все SMS по номеру телефона.\n\nУсловие:\n\n```sql\nHAVING COUNT(*) > 1\n```\n\nоставляет только номера, которые получили больше одного сообщения.\n\nЗатем:\n\n```sql\nORDER BY sms_count DESC\nLIMIT 10\n```\n\nсортирует номера по количеству полученных SMS и оставляет первые 10.\n\n{{< /details >}}"
  filepath = "top-sms-recipients"

[[tasks]]
  id = 19
  question = "Найти пользователей без заказов  "
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `users` — пользователи;\n    \n- `orders` — заказы пользователей.\n    \n\nНеобходимо вывести `id` всех пользователей, у которых нет ни одного заказа.\n\n**Код:**\n\n```text\nusers\n\nid\n```\n\n```text\norders\n\nuserId\norderId\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Можно использовать `LEFT JOIN`, чтобы сохранить всех пользователей.  \n💡 Если заказов у пользователя нет, поля таблицы `orders` будут содержать `NULL`.  \n💡 Альтернативный вариант — проверить отсутствие связанных заказов через `NOT EXISTS`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через `LEFT JOIN`:\n\n```sql\nSELECT u.id\nFROM users u\nLEFT JOIN orders o\n    ON o.userId = u.id\nWHERE o.orderId IS NULL;\n```\n\n`LEFT JOIN` сохраняет всех пользователей. Если у пользователя нет заказов, соответствующая запись из `orders` отсутствует и `o.orderId` будет равен `NULL`.\n\nАльтернативный вариант через `NOT EXISTS`:\n\n```sql\nSELECT u.id\nFROM users u\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM orders o\n    WHERE o.userId = u.id\n);\n```\n\n`NOT EXISTS` проверяет, что для пользователя не существует ни одной строки в таблице `orders`.\n\nОба запроса возвращают пользователей без заказов.\n\n{{< /details >}}"
  filepath = "users-without-orders"

[[tasks]]
  id = 20
  question = "Получить последние N новостей и все их комментарии"
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `news` — новости;\n    \n- `comments` — комментарии к новостям.\n    \n\nНеобходимо одним SQL-запросом получить последние `N` новостей вместе со всеми комментариями к ним.\n\n**Код:**\n\n```text\nnews\n\nid INT AUTO_INCREMENT PRIMARY KEY\n```\n\n```text\ncomments\n\nid      INT AUTO_INCREMENT PRIMARY KEY\nnews_id INT\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала нужно выбрать именно последние `N` новостей.  \n💡 Ограничение `LIMIT` важно применить до соединения с комментариями.  \n💡 После этого выбранные новости можно соединить с `comments` через `LEFT JOIN`.  \n💡 `LEFT JOIN` позволит сохранить новости, у которых нет комментариев.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через CTE:\n\n```sql\nWITH latest_news AS (\n    SELECT *\n    FROM news\n    ORDER BY id DESC\n    LIMIT :n\n)\nSELECT\n    ln.*,\n    c.*\nFROM latest_news ln\nLEFT JOIN comments c\n    ON c.news_id = ln.id\nORDER BY ln.id DESC, c.id;\n```\n\nСначала CTE:\n\n```sql\nSELECT *\nFROM news\nORDER BY id DESC\nLIMIT :n\n```\n\nвыбирает последние `N` новостей.\n\nПосле этого `LEFT JOIN` добавляет к каждой выбранной новости все её комментарии.\n\nВажно применять `LIMIT` именно к новостям до `JOIN`. Если сначала соединить `news` с `comments`, а затем выполнить `LIMIT N`, ограничение будет применено к строкам результата, а не к количеству новостей.\n\nАльтернативный вариант без CTE:\n\n```sql\nSELECT\n    n.*,\n    c.*\nFROM (\n    SELECT *\n    FROM news\n    ORDER BY id DESC\n    LIMIT :n\n) n\nLEFT JOIN comments c\n    ON c.news_id = n.id\nORDER BY n.id DESC, c.id;\n```\n\nОба варианта возвращают последние `N` новостей и все связанные с ними комментарии.\n\n{{< /details >}}"
  filepath = "n-last-news-with-comments"

[[tasks]]
  id = 21
  question = "Выгрузить все новости с комментариями при большом объёме данных  "
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `news` — новости;\n    \n- `comments` — комментарии к новостям.\n    \n\nНеобходимо выгрузить все новости вместе со всеми их комментариями при большом объёме данных, не загружая весь результат целиком в память.\n\nНовости без комментариев также должны попадать в результат.\n\n**Код:**\n\n```text\nnews\n\nid INT AUTO_INCREMENT PRIMARY KEY\n```\n\n```text\ncomments\n\nid      INT AUTO_INCREMENT PRIMARY KEY\nnews_id INT REFERENCES news(id)\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй `LEFT JOIN`, чтобы сохранить новости без комментариев.  \n💡 При большом объёме данных лучше читать новости порциями.  \n💡 `LIMIT/OFFSET` на результате после `JOIN` может разбить комментарии одной новости между страницами.  \n💡 Лучше сначала выбрать очередную порцию новостей, а затем присоединить к ним все комментарии.  \n💡 Для больших таблиц предпочтительна keyset pagination по `id`, а не большой `OFFSET`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nДля первой порции можно выбрать ограниченное количество новостей и только после этого присоединить комментарии:\n\n```sql\nWITH news_batch AS (\n    SELECT *\n    FROM news\n    ORDER BY id\n    LIMIT :batch_size\n)\nSELECT\n    n.*,\n    c.*\nFROM news_batch n\nLEFT JOIN comments c\n    ON c.news_id = n.id\nORDER BY n.id, c.id;\n```\n\nДля следующих порций лучше использовать последний обработанный `id`:\n\n```sql\nWITH news_batch AS (\n    SELECT *\n    FROM news\n    WHERE id > :last_news_id\n    ORDER BY id\n    LIMIT :batch_size\n)\nSELECT\n    n.*,\n    c.*\nFROM news_batch n\nLEFT JOIN comments c\n    ON c.news_id = n.id\nORDER BY n.id, c.id;\n```\n\nНапример:\n\n```text\nbatch_size   = 1000\nlast_news_id = 15000\n```\n\nследующая порция будет содержать до `1000` новостей с `id > 15000` и все комментарии к этим новостям.\n\nВажно ограничивать количество именно новостей до выполнения `JOIN`.\n\nТакой вариант:\n\n```sql\nSELECT n.*, c.*\nFROM news n\nLEFT JOIN comments c\n    ON c.news_id = n.id\nORDER BY n.id\nLIMIT 1000 OFFSET 1000;\n```\n\nограничивает количество строк уже после соединения. Если у одной новости много комментариев, её данные могут оказаться разделены между несколькими страницами.\n\nДля производительности также полезен индекс:\n\n```sql\nCREATE INDEX idx_comments_news_id\n    ON comments(news_id);\n```\n\nПри последовательной обработке всех порций можно выгрузить весь набор данных, не удерживая все новости и комментарии одновременно в памяти.\n\n{{< /details >}}"
  filepath = "export-news-with-comments"

[[tasks]]
  id = 22
  question = "Найти топ-3 посетителей по количеству визитов"
  answer = "**Условие задачи:**  \nДана таблица `visits`:\n\n```text\nvisits\n\nvisit_id\nvisitor_name\ntimestamp\n```\n\nНеобходимо вывести трёх посетителей с наибольшим количеством визитов.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй записи по `visitor_name`.  \n💡 Количество визитов можно посчитать через `COUNT(*)`.  \n💡 Отсортируй результат по убыванию количества визитов.  \n💡 Ограничь результат тремя строками через `LIMIT 3`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nСамый простой вариант:\n\n```sql\nSELECT\n    visitor_name,\n    COUNT(*) AS visit_count\nFROM visits\nGROUP BY visitor_name\nORDER BY visit_count DESC\nLIMIT 3;\n```\n\n`GROUP BY visitor_name` объединяет все визиты одного посетителя.\n\n```sql\nCOUNT(*) AS visit_count\n```\n\nсчитает количество визитов, а:\n\n```sql\nORDER BY visit_count DESC\nLIMIT 3\n```\n\nоставляет трёх посетителей с максимальным количеством посещений.\n\nЕсли нужно корректно учитывать одинаковое количество визитов и вывести всех посетителей, разделивших первые три места, можно использовать `DENSE_RANK()`:\n\n```sql\nWITH visitor_stats AS (\n    SELECT\n        visitor_name,\n        COUNT(*) AS visit_count\n    FROM visits\n    GROUP BY visitor_name\n),\nranked AS (\n    SELECT\n        visitor_name,\n        visit_count,\n        DENSE_RANK() OVER (\n            ORDER BY visit_count DESC\n        ) AS place\n    FROM visitor_stats\n)\nSELECT\n    visitor_name,\n    visit_count\nFROM ranked\nWHERE place <= 3\nORDER BY visit_count DESC;\n```\n\nВ первом варианте результат содержит ровно три строки. Во втором могут быть дополнительные строки, если несколько посетителей имеют одинаковое количество визитов на одном из первых трёх мест.\n\n{{< /details >}}"
  filepath = "top-3-visitors-by-visit-count"

[[tasks]]
  id = 23
  question = "Вывести названия и цены услуг, проданных с 1 января 2021 в течение недели  "
  answer = "**Условие задачи:**  \nЕсть таблицы:\n\n- `Services(id, name, cost, price, group_id)` — услуги;\n    \n- `Groups(id, name)` — группы услуг;\n    \n- `Orders(id, datetime, srv_id)` — продажи услуг.\n    \n\nНеобходимо вывести название и розничную цену (`price`) всех услуг, которые продавались с `1 января 2021` и в течение следующей недели.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини `Orders` и `Services` по `Orders.srv_id = Services.id`.  \n💡 Отфильтруй продажи по полю `datetime`.  \n💡 Для `TIMESTAMP` удобнее использовать полуоткрытый диапазон дат.  \n💡 Если услуга продавалась несколько раз, используй `DISTINCT`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT DISTINCT\n    s.name,\n    s.price\nFROM Services s\nJOIN Orders o\n    ON o.srv_id = s.id\nWHERE o.datetime >= '2021-01-01'\n  AND o.datetime < '2021-01-09';\n```\n\nДиапазон:\n\n```sql\no.datetime >= '2021-01-01'\nAND o.datetime < '2021-01-09'\n```\n\nвключает все продажи с начала `1 января` до конца `8 января`.\n\n`DISTINCT` исключает повторения, если одна услуга продавалась несколько раз.\n\nТаблица `Groups` в этом запросе не требуется.\n\n{{< /details >}}"
  filepath = "services-january-2021-week"

[[tasks]]
  id = 24
  question = "Вывести группы без услуг"
  answer = "**Условие задачи:**  \nЕсть таблицы:\n\n- `Services(id, name, cost, price, group_id)` — услуги;\n    \n- `Groups(id, name)` — группы услуг.\n    \n\nНеобходимо вывести названия групп, в которых нет ни одной услуги.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй `LEFT JOIN`, чтобы сохранить все группы.  \n💡 Для групп без услуг поля таблицы `Services` будут равны `NULL`.  \n💡 Альтернативный вариант — использовать `NOT EXISTS`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через `LEFT JOIN`:\n\n```sql\nSELECT g.name\nFROM Groups g\nLEFT JOIN Services s\n    ON s.group_id = g.id\nWHERE s.id IS NULL;\n```\n\n`LEFT JOIN` сохраняет все группы, а условие:\n\n```sql\nWHERE s.id IS NULL\n```\n\nоставляет только те, для которых не найдено ни одной услуги.\n\nАльтернативный вариант через `NOT EXISTS`:\n\n```sql\nSELECT g.name\nFROM Groups g\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM Services s\n    WHERE s.group_id = g.id\n);\n```\n\nОба варианта корректно возвращают группы без услуг.\n\n{{< /details >}}"
  filepath = "groups-without-services"

[[tasks]]
  id = 25
  question = "Спроектировать таблицы для авторов и книг со связью многие-ко-многим  "
  answer = "**Условие задачи:**  \nЕсть две сущности:\n\n- `Authors` — авторы;\n    \n- `Books` — книги.\n    \n\nОдин автор может написать несколько книг, и у одной книги может быть несколько авторов.\n\nНеобходимо спроектировать структуру таблиц для связи `many-to-many`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Связь `many-to-many` реализуется через отдельную таблицу связей.  \n💡 В ней достаточно хранить `author_id` и `book_id`.  \n💡 Пара `(author_id, book_id)` должна быть уникальной.  \n💡 Оба поля должны быть внешними ключами на основные таблицы.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nТаблица авторов:\n\n```sql\nCREATE TABLE authors (\n    id SERIAL PRIMARY KEY,\n    name VARCHAR(255) NOT NULL\n);\n```\n\nТаблица книг:\n\n```sql\nCREATE TABLE books (\n    id SERIAL PRIMARY KEY,\n    title VARCHAR(255) NOT NULL\n);\n```\n\nТаблица связи:\n\n```sql\nCREATE TABLE author_book (\n    author_id INT NOT NULL,\n    book_id INT NOT NULL,\n\n    PRIMARY KEY (author_id, book_id),\n\n    FOREIGN KEY (author_id)\n        REFERENCES authors(id),\n\n    FOREIGN KEY (book_id)\n        REFERENCES books(id)\n);\n```\n\nСвязь выглядит так:\n\n```text\nauthors        author_book        books\n\nid  <-------- author_id\n                 book_id -------> id\n```\n\nКаждая строка в `author_book` означает связь одного автора с одной книгой.\n\nСоставной первичный ключ:\n\n```sql\nPRIMARY KEY (author_id, book_id)\n```\n\nне позволяет создать одну и ту же связь между автором и книгой несколько раз.\n\n{{< /details >}}"
  filepath = "authors-books"

[[tasks]]
  id = 26
  question = "Найти рыб с суммарным уловом на дату меньше заданного значения  "
  answer = "**Условие задачи:**  \nЕсть таблицы:\n\n- `fish(id, name)` — виды рыб;\n    \n- `catch(id, fish_id, dt, quantity)` — данные об улове.\n    \n\nНеобходимо вывести названия рыб, для которых суммарный улов на дату `d` меньше значения `n`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Отфильтруй записи по дате `d`.  \n💡 Суммарный улов можно посчитать через `SUM(quantity)`.  \n💡 Для фильтрации агрегированного результата используй `HAVING`.  \n💡 Если рыба, которую в этот день вообще не ловили, тоже должна считаться как улов `0`, понадобится `LEFT JOIN` и `COALESCE`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nЕсли учитывать только рыб, у которых были записи об улове на указанную дату:\n\n```sql\nSELECT f.name\nFROM fish f\nJOIN catch c\n    ON c.fish_id = f.id\nWHERE c.dt = :d\nGROUP BY f.id, f.name\nHAVING SUM(c.quantity) < :n;\n```\n\n`WHERE` оставляет уловы только за нужную дату, после чего `SUM(c.quantity)` считает их суммарное количество для каждой рыбы.\n\nЕсли нужно учитывать также рыб, которых в эту дату вообще не ловили, их суммарный улов следует считать равным `0`:\n\n```sql\nSELECT\n    f.name\nFROM fish f\nLEFT JOIN catch c\n    ON c.fish_id = f.id\n   AND c.dt = :d\nGROUP BY f.id, f.name\nHAVING COALESCE(SUM(c.quantity), 0) < :n;\n```\n\nВажно условие по дате разместить в `ON`, а не в `WHERE`. Иначе строки рыб без улова будут исключены после `LEFT JOIN`.\n\n`COALESCE` преобразует `NULL`, полученный для рыб без записей об улове, в `0`.\n\n{{< /details >}}"
  filepath = "fish-with-catch-less-than"

[[tasks]]
  id = 27
  question = "Найти пользователей без поездок"
  answer = "**Условие задачи:**  \nЕсть таблицы:\n\n```sql\nCREATE TABLE users (\n    id INT8 PRIMARY KEY,\n    name TEXT,\n    email TEXT\n);\n\nCREATE TABLE trips (\n    id INT8 PRIMARY KEY,\n    scooter INT8,\n    user_id INT8,\n    started_at TIMESTAMPTZ,\n    finished_at TIMESTAMPTZ\n);\n\nCREATE TABLE pauses (\n    id INT8 PRIMARY KEY,\n    trip_id INT8,\n    started_at TIMESTAMPTZ,\n    finished_at TIMESTAMPTZ\n);\n```\n\nНеобходимо вывести `id` всех пользователей, у которых нет ни одной поездки в таблице `trips`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Можно использовать `LEFT JOIN`, чтобы сохранить всех пользователей.  \n💡 Если у пользователя нет поездок, соответствующая запись из `trips` будет отсутствовать.  \n💡 Альтернативный вариант — проверить отсутствие поездок через `NOT EXISTS`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через `LEFT JOIN`:\n\n```sql\nSELECT u.id\nFROM users u\nLEFT JOIN trips t\n    ON t.user_id = u.id\nWHERE t.id IS NULL;\n```\n\n`LEFT JOIN` сохраняет всех пользователей. Для пользователей без поездок поля таблицы `trips` будут равны `NULL`, поэтому условие:\n\n```sql\nWHERE t.id IS NULL\n```\n\nоставляет только их.\n\nАльтернативный вариант через `NOT EXISTS`:\n\n```sql\nSELECT u.id\nFROM users u\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM trips t\n    WHERE t.user_id = u.id\n);\n```\n\nОба варианта корректно возвращают пользователей, у которых нет ни одной поездки.\n\nТаблица `pauses` для решения этой задачи не требуется.\n\n{{< /details >}}"
  filepath = "users-without-trips"

[[tasks]]
  id = 28
  question = "Найти имена, встречающиеся более 5 раз"
  answer = "**Условие задачи:**  \nЕсть таблица PostgreSQL:\n\n```sql\nstudents (\n    name TEXT,\n    \"group\" TEXT,\n    cource BIGINT\n)\n```\n\nНеобходимо вывести имена `name`, которые встречаются в таблице более 5 раз.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй записи по `name`.  \n💡 Количество строк в каждой группе можно посчитать через `COUNT(*)`.  \n💡 Для фильтрации сгруппированных данных используй `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT name\nFROM students\nGROUP BY name\nHAVING COUNT(*) > 5;\n```\n\n`GROUP BY name` объединяет строки с одинаковыми именами.\n\nУсловие:\n\n```sql\nHAVING COUNT(*) > 5\n```\n\nоставляет только те имена, которые встречаются в таблице более пяти раз.\n\nЕсли нужно также вывести количество повторений:\n\n```sql\nSELECT\n    name,\n    COUNT(*) AS name_count\nFROM students\nGROUP BY name\nHAVING COUNT(*) > 5;\n```\n\nПоля `\"group\"` и `cource` для решения этой задачи не требуются.\n\n{{< /details >}}"
  filepath = "names-occurring-more-than-5"

[[tasks]]
  id = 29
  question = "Найти самое часто встречающееся значение"
  answer = "**Условие задачи:**  \nЕсть таблица с колонками `key` и `value`:\n\n```text\nkey | value\n----|------\n1   | sdfs\n2   | dsfg\n3   | sdfs\n```\n\nНеобходимо найти значение `value`, которое встречается чаще всего.\n\nЕсли несколько значений имеют одинаковую максимальную частоту, вывести их все.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала сгруппируй строки по `value` и посчитай количество вхождений через `COUNT(*)`.  \n💡 Затем нужно определить значения с максимальным количеством повторений.  \n💡 Если возможны одинаковые максимальные значения, простой `LIMIT 1` вернёт только одно из них.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант с оконной функцией:\n\n```sql\nSELECT value\nFROM (\n    SELECT\n        value,\n        RANK() OVER (\n            ORDER BY COUNT(*) DESC\n        ) AS rnk\n    FROM your_table\n    GROUP BY value\n) t\nWHERE rnk = 1;\n```\n\nСначала:\n\n```sql\nGROUP BY value\n```\n\nгруппирует одинаковые значения, а `COUNT(*)` определяет количество их вхождений.\n\n`RANK()` присваивает ранг в порядке убывания количества повторений. Значения с максимальной частотой получают ранг `1`.\n\nДля приведённых данных результат:\n\n```text\nsdfs\n```\n\nЕсли по условию достаточно вернуть только одно самое частое значение, можно использовать более простой запрос:\n\n```sql\nSELECT value\nFROM your_table\nGROUP BY value\nORDER BY COUNT(*) DESC\nLIMIT 1;\n```\n\nНо при одинаковой максимальной частоте такой вариант вернёт только одно из подходящих значений.\n\n{{< /details >}}"
  filepath = "most-frequent-value"

[[tasks]]
  id = 30
  question = "Выбрать первые 5 записей"
  answer = "**Условие задачи:**  \nЕсть таблица с колонками `key` и `value`:\n\n```text\nkey | value\n----|------\n1   | sdfs\n2   | dsfg\n3   | sdfs\n... | ...\n```\n\nНеобходимо выбрать первые 5 записей из таблицы.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 В PostgreSQL и MySQL для ограничения количества строк используется `LIMIT`.  \n💡 Если под «первыми» подразумеваются записи с минимальным `key`, необходимо явно задать сортировку через `ORDER BY`.  \n💡 Без `ORDER BY` СУБД не гарантирует порядок возвращаемых строк.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nЕсли нужны первые 5 записей по возрастанию `key`:\n\n```sql\nSELECT *\nFROM your_table\nORDER BY key\nLIMIT 5;\n```\n\n`ORDER BY key` задаёт порядок записей, а:\n\n```sql\nLIMIT 5\n```\n\nоставляет первые пять строк результата.\n\nЕсли порядок не имеет значения, достаточно:\n\n```sql\nSELECT *\nFROM your_table\nLIMIT 5;\n```\n\nНо без `ORDER BY` нельзя гарантировать, какие именно пять записей вернёт база данных.\n\nДля SQL Server аналогичный запрос выглядит так:\n\n```sql\nSELECT TOP 5 *\nFROM your_table\nORDER BY key;\n```\n\n{{< /details >}}"
  filepath = "select-top-5"

[[tasks]]
  id = 31
  question = "Получить розовые машины и посчитать машины по цветам"
  answer = "**Условие задачи:**  \nДаны таблицы `colors` и `cars`.\n\nНеобходимо:\n\n1. вывести все машины розового цвета;\n    \n2. посчитать количество машин для каждого цвета.\n    \n\n**Код:**\n\n```sql\nCREATE TABLE colors (\n    id INT NOT NULL PRIMARY KEY,\n    name VARCHAR(50),\n    UNIQUE(name)\n);\n\nCREATE TABLE cars (\n    id INT NOT NULL PRIMARY KEY,\n    name VARCHAR(50),\n    color_id INT,\n    FOREIGN KEY (color_id) REFERENCES colors(id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для получения машин определённого цвета соедини `cars` и `colors` через `JOIN`.  \n💡 Для фильтрации используй `WHERE colors.name = 'pink'`.  \n💡 Для подсчёта машин используй `COUNT()` и `GROUP BY`.  \n💡 Если нужно показать даже цвета без машин, используй `LEFT JOIN`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nМашины розового цвета:\n\n```sql\nSELECT car.name AS car_name\nFROM cars car\nJOIN colors color\n    ON car.color_id = color.id\nWHERE color.name = 'pink';\n```\n\nКоличество машин для каждого цвета:\n\n```sql\nSELECT\n    color.name AS color,\n    COUNT(car.id) AS car_count\nFROM colors color\nLEFT JOIN cars car\n    ON car.color_id = color.id\nGROUP BY color.id, color.name\nORDER BY color.name;\n```\n\n`LEFT JOIN` позволяет сохранить в результате цвета, для которых пока нет ни одной машины.\n\nВажно использовать:\n\n```sql\nCOUNT(car.id)\n```\n\nа не `COUNT(*)`, потому что для цвета без машин `LEFT JOIN` создаст строку с `NULL` в полях таблицы `cars`. В этом случае `COUNT(car.id)` корректно вернёт `0`.\n\n{{< /details >}}"
  filepath = "pink-cars-and-color-count"

[[tasks]]
  id = 32
  question = "Получить отделы с числом сотрудников и сотрудников с зарплатой выше руководителя"
  answer = "**Условие задачи:**  \nДаны таблицы `department` и `employee`.\n\nНеобходимо:\n\n1. вывести все отделы в алфавитном порядке и количество сотрудников в каждом отделе;\n    \n2. вывести сотрудников, зарплата которых выше зарплаты их непосредственного руководителя.\n    \n\n**Код:**\n\n```sql\nCREATE TABLE department (\n    id INTEGER NOT NULL,\n    name VARCHAR(128) NOT NULL,\n    PRIMARY KEY (id)\n);\n\nCREATE TABLE employee (\n    id INTEGER NOT NULL,\n    department_id INTEGER NOT NULL,\n    manager_id INTEGER,\n    name VARCHAR(128) NOT NULL,\n    salary DECIMAL NOT NULL,\n    PRIMARY KEY (id),\n    FOREIGN KEY (department_id) REFERENCES department(id),\n    FOREIGN KEY (manager_id) REFERENCES employee(id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для подсчёта сотрудников соедини `department` и `employee` через `LEFT JOIN`.  \n💡 Используй `COUNT(employee.id)`, чтобы отдел без сотрудников получил значение `0`.  \n💡 Для сравнения сотрудника с руководителем сделай self join таблицы `employee`.  \n💡 Связь с руководителем задаётся через `employee.manager_id = manager.id`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОтделы и количество сотрудников:\n\n```sql\nSELECT\n    d.name AS department_name,\n    COUNT(e.id) AS employee_count\nFROM department d\nLEFT JOIN employee e\n    ON e.department_id = d.id\nGROUP BY d.id, d.name\nORDER BY d.name;\n```\n\n`LEFT JOIN` позволяет вывести даже отделы, в которых нет сотрудников.\n\nСотрудники с зарплатой выше зарплаты руководителя:\n\n```sql\nSELECT\n    e.name AS employee_name,\n    e.salary AS employee_salary,\n    m.name AS manager_name,\n    m.salary AS manager_salary\nFROM employee e\nJOIN employee m\n    ON e.manager_id = m.id\nWHERE e.salary > m.salary;\n```\n\nЗдесь таблица `employee` соединяется сама с собой:\n\n```text\ne — сотрудник\nm — его непосредственный руководитель\n```\n\nУ сотрудников без руководителя `manager_id` равен `NULL`, поэтому они не попадут во второй результат.\n\n{{< /details >}}"
  filepath = "departments-and-high-salary-employees"

[[tasks]]
  id = 33
  question = "Найти строки, подходящие хотя бы под один шаблон"
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `t1(str)` — содержит строки;\n    \n- `t2(mask)` — содержит шаблоны для `LIKE`.\n    \n\nНеобходимо выбрать все строки из `t1`, которые соответствуют хотя бы одному шаблону из `t2`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сравни строку и шаблон через `LIKE`.  \n💡 Для условия «существует хотя бы один подходящий шаблон» удобно использовать `EXISTS`.  \n💡 При использовании `JOIN` одна строка может попасть в результат несколько раз.  \n💡 В таком случае потребуется `DISTINCT`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nПредпочтительный вариант через `EXISTS`:\n\n```sql\nSELECT t1.str\nFROM t1\nWHERE EXISTS (\n    SELECT 1\n    FROM t2\n    WHERE t1.str LIKE t2.mask\n);\n```\n\n`EXISTS` проверяет, существует ли хотя бы один шаблон, которому соответствует текущая строка.\n\nАльтернативный вариант через `JOIN`:\n\n```sql\nSELECT DISTINCT t1.str\nFROM t1\nJOIN t2\n    ON t1.str LIKE t2.mask;\n```\n\n`DISTINCT` нужен, потому что одна строка из `t1` может соответствовать нескольким шаблонам из `t2`.\n\nДля условия «соответствует хотя бы одному шаблону» вариант с `EXISTS` обычно лучше отражает смысл запроса и не создаёт дубликаты из-за соединения.\n\n{{< /details >}}"
  filepath = "match-strings-with-masks"

[[tasks]]
  id = 34
  question = "Найти пользователей с несколькими покупками за день  "
  answer = "**Условие задачи:**  \nДана таблица `T1(date, user_id)` с информацией о покупках пользователей.\n\nНеобходимо найти случаи, когда один пользователь совершил более одной покупки в один и тот же день, и вывести пары:\n\n```text\n(date, user_id)\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй записи одновременно по дате и пользователю.  \n💡 Для подсчёта покупок используй `COUNT(*)`.  \n💡 Условия на агрегированные значения задаются через `HAVING`.  \n💡 Оставь только группы, где количество покупок больше одной.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновной вариант через `GROUP BY` и `HAVING`:\n\n```sql\nSELECT\n    date,\n    user_id\nFROM T1\nGROUP BY\n    date,\n    user_id\nHAVING COUNT(*) > 1;\n```\n\nСначала записи группируются по пользователю и дате:\n\n```sql\nGROUP BY date, user_id\n```\n\nЗатем остаются только группы, содержащие более одной покупки:\n\n```sql\nHAVING COUNT(*) > 1\n```\n\nАльтернативный вариант через оконную функцию:\n\n```sql\nSELECT DISTINCT\n    date,\n    user_id\nFROM (\n    SELECT\n        date,\n        user_id,\n        COUNT(*) OVER (\n            PARTITION BY date, user_id\n        ) AS purchase_count\n    FROM T1\n) t\nWHERE purchase_count > 1;\n```\n\nЕсли поле `date` на самом деле хранит дату и время (`TIMESTAMP`), то для группировки именно по дням необходимо сначала получить дату, например в PostgreSQL:\n\n```sql\nSELECT\n    date::date AS purchase_date,\n    user_id\nFROM T1\nGROUP BY\n    date::date,\n    user_id\nHAVING COUNT(*) > 1;\n```\n\n{{< /details >}}"
  filepath = "multiple-purchases-per-day"

[[tasks]]
  id = 35
  question = "Найти пользователей с взаимной подпиской"
  answer = "**Условие задачи:**  \nДана таблица подписок пользователей:\n\n```text\nuser_id | follower_id\n--------+------------\n1       | 5\n1       | 4\n2       | 3\n3       | 2\n5       | 1\n```\n\nНеобходимо найти пары пользователей, которые подписаны друг на друга.\n\nКаждую пару нужно вывести только один раз.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини таблицу саму с собой.  \n💡 Для взаимной подписки должна существовать обратная запись.  \n💡 Условие будет выглядеть как `a.user_id = b.follower_id` и `a.follower_id = b.user_id`.  \n💡 Чтобы не получать одновременно `(1, 5)` и `(5, 1)`, можно оставить только строки, где `user_id < follower_id`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через self join:\n\n```sql\nSELECT DISTINCT\n    f1.user_id,\n    f1.follower_id\nFROM follows f1\nJOIN follows f2\n    ON f1.user_id = f2.follower_id\n   AND f1.follower_id = f2.user_id\nWHERE f1.user_id < f1.follower_id;\n```\n\nДля исходных данных результат будет:\n\n```text\nuser_id | follower_id\n--------+------------\n1       | 5\n2       | 3\n```\n\nУсловие соединения проверяет наличие обратной подписки:\n\n```sql\nf1.user_id = f2.follower_id\nAND f1.follower_id = f2.user_id\n```\n\nУсловие:\n\n```sql\nf1.user_id < f1.follower_id\n```\n\nоставляет каждую взаимную пару только в одном направлении.\n\nАльтернативный вариант через `EXISTS`:\n\n```sql\nSELECT DISTINCT\n    f1.user_id,\n    f1.follower_id\nFROM follows f1\nWHERE f1.user_id < f1.follower_id\n  AND EXISTS (\n      SELECT 1\n      FROM follows f2\n      WHERE f2.user_id = f1.follower_id\n        AND f2.follower_id = f1.user_id\n  );\n```\n\n`DISTINCT` полезен, если таблица потенциально может содержать повторяющиеся записи о подписках.\n\n{{< /details >}}"
  filepath = "mutual-followers"

[[tasks]]
  id = 36
  question = "Найти папки с AVI-файлами или без файлов"
  answer = "**Условие задачи:**  \nДаны таблицы `folder` и `file`.\n\nНеобходимо вывести названия папок, которые удовлетворяют хотя бы одному условию:\n\n- содержат хотя бы один файл с расширением `.avi`;\n    \n- не содержат ни одного файла.\n    \n\n**Код:**\n\n```sql\nCREATE TABLE folder (\n    id uuid PRIMARY KEY,\n    name text NOT NULL\n);\n\nCREATE TABLE file (\n    id uuid PRIMARY KEY,\n    name text NOT NULL,\n    folder_id uuid NOT NULL,\n    CONSTRAINT fk__file__folder_id\n        FOREIGN KEY (folder_id) REFERENCES folder(id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для условия «есть хотя бы один AVI-файл» удобно использовать `EXISTS`.  \n💡 Для пустой папки можно проверить отсутствие любых файлов через `NOT EXISTS`.  \n💡 Альтернативный вариант — `LEFT JOIN` с проверкой `file.id IS NULL`.  \n💡 При использовании `JOIN` может потребоваться `DISTINCT`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через `EXISTS` и `NOT EXISTS`:\n\n```sql\nSELECT f.name\nFROM folder f\nWHERE EXISTS (\n    SELECT 1\n    FROM file fi\n    WHERE fi.folder_id = f.id\n      AND fi.name LIKE '%.avi'\n)\nOR NOT EXISTS (\n    SELECT 1\n    FROM file fi\n    WHERE fi.folder_id = f.id\n);\n```\n\nПервая часть проверяет, есть ли в папке хотя бы один AVI-файл:\n\n```sql\nEXISTS (\n    SELECT 1\n    FROM file fi\n    WHERE fi.folder_id = f.id\n      AND fi.name LIKE '%.avi'\n)\n```\n\nВторая часть выбирает папки, в которых вообще нет файлов:\n\n```sql\nNOT EXISTS (\n    SELECT 1\n    FROM file fi\n    WHERE fi.folder_id = f.id\n)\n```\n\nАльтернативный вариант через `LEFT JOIN`:\n\n```sql\nSELECT DISTINCT f.name\nFROM folder f\nLEFT JOIN file fi\n    ON fi.folder_id = f.id\nWHERE fi.name LIKE '%.avi'\n   OR fi.id IS NULL;\n```\n\n`LEFT JOIN` сохраняет пустые папки, а `DISTINCT` убирает повторения, если в одной папке находится несколько AVI-файлов.\n\n{{< /details >}}"
  filepath = "folders-with-avi-or-empty"

[[tasks]]
  id = 37
  question = "Получить все отделы с количеством сотрудников"
  answer = "**Условие задачи:**  \nДаны таблицы:\n\n- `dep(id, name)` — отделы;\n    \n- `emp(id, id_dep, fio)` — сотрудники, где `id_dep` ссылается на `dep.id`.\n    \n\nНеобходимо вывести все отделы и количество сотрудников в каждом из них.\n\nЕсли в отделе нет сотрудников, нужно вывести `0`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй `LEFT JOIN`, чтобы сохранить отделы без сотрудников.  \n💡 Для подсчёта используй `COUNT(e.id)`, а не `COUNT(*)`.  \n💡 Группируй по идентификатору и названию отдела.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    d.name AS department,\n    COUNT(e.id) AS employee_count\nFROM dep d\nLEFT JOIN emp e\n    ON e.id_dep = d.id\nGROUP BY\n    d.id,\n    d.name\nORDER BY\n    d.name;\n```\n\n`LEFT JOIN` оставляет в результате все отделы, даже если связанных сотрудников нет.\n\nДля пустого отдела поля `emp` будут равны `NULL`, поэтому:\n\n```sql\nCOUNT(e.id)\n```\n\nвернёт `0`.\n\nГруппировка выполняется по `d.id` и `d.name`, чтобы отделы с одинаковыми названиями, но разными идентификаторами не объединились в одну группу.\n\n{{< /details >}}"
  filepath = "department-employee-count"

[[tasks]]
  id = 38
  question = "Устранить дубликаты email из-за разного регистра"
  answer = "**Условие задачи:**  \nДана таблица `client_service`:\n\n- `client_id` — идентификатор клиента;\n    \n- `employee_email` — email сотрудника.\n    \n\nОдин и тот же email может быть записан в разном регистре:\n\n```text\nUser@domain.com\nuser@domain.com\n```\n\nНеобходимо устранить дублирование и запретить появление таких записей в дальнейшем.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для сравнения email без учёта регистра используй `LOWER()`.  \n💡 Уникальность должна проверяться для пары `client_id + email`.  \n💡 Сначала нужно удалить существующие дубликаты.  \n💡 После очистки можно создать уникальный индекс по `LOWER(employee_email)`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nПолучить данные без дубликатов:\n\n```sql\nSELECT DISTINCT\n    client_id,\n    LOWER(employee_email) AS employee_email\nFROM client_service;\n```\n\nДля PostgreSQL существующие дубликаты можно удалить так:\n\n```sql\nDELETE FROM client_service cs1\nUSING client_service cs2\nWHERE cs1.client_id = cs2.client_id\n  AND LOWER(cs1.employee_email) = LOWER(cs2.employee_email)\n  AND cs1.ctid > cs2.ctid;\n```\n\nПосле этого можно нормализовать существующие email:\n\n```sql\nUPDATE client_service\nSET employee_email = LOWER(employee_email);\n```\n\nИ запретить появление дублей в дальнейшем:\n\n```sql\nCREATE UNIQUE INDEX ux_client_service_client_email\n    ON client_service (\n        client_id,\n        LOWER(employee_email)\n    );\n```\n\nТеперь для одного клиента записи:\n\n```text\nUser@domain.com\nuser@domain.com\nUSER@DOMAIN.COM\n```\n\nбудут считаться одним и тем же email.\n\nУникальный индекс создаётся после удаления существующих дублей, иначе его создание завершится ошибкой.\n\n{{< /details >}}"
  filepath = "deduplicate-client-email"

[[tasks]]
  id = 39
  question = "Переписать LEFT JOIN без использования LEFT JOIN"
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `t1(A)`;\n    \n- `t2(B)`.\n    \n\nИсходный запрос:\n\n```sql\nSELECT *\nFROM t1\nLEFT OUTER JOIN t2\n    ON t1.A = t2.B;\n```\n\nНеобходимо получить эквивалентный результат без использования `LEFT OUTER JOIN`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Результат `LEFT JOIN` можно разделить на две части.  \n💡 Первая часть — строки, для которых найдено совпадение через `INNER JOIN`.  \n💡 Вторая часть — строки из `t1`, для которых совпадений в `t2` нет.  \n💡 Для поиска отсутствующих строк удобно использовать `NOT EXISTS`.  \n💡 Объедини результаты через `UNION ALL`, чтобы сохранить дубликаты.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    t1.A,\n    t2.B\nFROM t1\nJOIN t2\n    ON t1.A = t2.B\n\nUNION ALL\n\nSELECT\n    t1.A,\n    NULL AS B\nFROM t1\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM t2\n    WHERE t2.B = t1.A\n);\n```\n\nПервая часть возвращает все совпавшие строки:\n\n```sql\nSELECT\n    t1.A,\n    t2.B\nFROM t1\nJOIN t2\n    ON t1.A = t2.B;\n```\n\nВторая часть возвращает строки из `t1`, для которых соответствующей строки в `t2` нет:\n\n```sql\nSELECT\n    t1.A,\n    NULL AS B\nFROM t1\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM t2\n    WHERE t2.B = t1.A\n);\n```\n\nИспользуется именно `UNION ALL`, а не `UNION`, поскольку `LEFT JOIN` сохраняет дубликаты.\n\nВариант через `NOT IN` в общем случае не является эквивалентным:\n\n```sql\nWHERE t1.A NOT IN (\n    SELECT t2.B\n    FROM t2\n)\n```\n\nОн некорректно работает при наличии `NULL`, поэтому для точного аналога `LEFT JOIN` лучше использовать `NOT EXISTS`.\n\n{{< /details >}}"
  filepath = "leftjoin-equivalent"

[[tasks]]
  id = 40
  question = "Найти второй по величине оклад"
  answer = "**Условие задачи:**  \nДана таблица `Employee(id, email, salary)`.\n\nНеобходимо получить второй по величине **уникальный** оклад сотрудника.\n\nЕсли максимальный оклад встречается у нескольких сотрудников, он всё равно считается одним значением.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Можно найти максимальный оклад, который меньше максимального оклада в таблице.  \n💡 Другой вариант — использовать `DENSE_RANK()` по убыванию зарплаты.  \n💡 Повторяющиеся значения зарплаты должны иметь одинаковый ранг.  \n💡 Значения `NULL` лучше исключить из поиска.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через подзапрос:\n\n```sql\nSELECT MAX(salary) AS second_highest_salary\nFROM Employee\nWHERE salary < (\n    SELECT MAX(salary)\n    FROM Employee\n);\n```\n\nСначала определяется максимальный оклад, затем выбирается максимальное значение среди всех окладов, которые меньше него.\n\nВариант через `DENSE_RANK()`:\n\n```sql\nSELECT salary AS second_highest_salary\nFROM (\n    SELECT\n        salary,\n        DENSE_RANK() OVER (\n            ORDER BY salary DESC\n        ) AS salary_rank\n    FROM (\n        SELECT DISTINCT salary\n        FROM Employee\n        WHERE salary IS NOT NULL\n    ) salaries\n) ranked\nWHERE salary_rank = 2;\n```\n\n`DENSE_RANK()` присваивает одинаковым зарплатам один и тот же ранг без пропусков:\n\n```text\n100000 → 1\n100000 → 1\n90000  → 2\n80000  → 3\n```\n\nЕсли второго уникального оклада нет, оба варианта вернут отсутствие значения: первый — `NULL`, второй — пустой результат.\n\n{{< /details >}}"
  filepath = "second-highest-salary"

[[tasks]]
  id = 41
  question = "Найти повторяющиеся email  "
  answer = "**Условие задачи:**  \nДана таблица `Employee(id, email, salary)`.\n\nНеобходимо найти все `email`, которые встречаются в таблице более одного раза.\n\nПример:\n\n```text\nemail\n-----\na\nb\nc\na\n```\n\nРезультат:\n\n```text\na\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй строки по `email`.  \n💡 Для каждой группы посчитай количество записей через `COUNT(*)`.  \n💡 Для фильтрации агрегированных данных используй `HAVING`.  \n💡 Оставь только группы, в которых количество записей больше одного.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновной вариант через `GROUP BY` и `HAVING`:\n\n```sql\nSELECT email\nFROM Employee\nGROUP BY email\nHAVING COUNT(*) > 1;\n```\n\nСначала строки группируются по адресу электронной почты:\n\n```sql\nGROUP BY email\n```\n\nЗатем остаются только те группы, в которых найдено больше одной записи:\n\n```sql\nHAVING COUNT(*) > 1\n```\n\nЕсли также нужно увидеть количество повторений:\n\n```sql\nSELECT\n    email,\n    COUNT(*) AS email_count\nFROM Employee\nGROUP BY email\nHAVING COUNT(*) > 1;\n```\n\nАльтернативный вариант через оконную функцию:\n\n```sql\nSELECT DISTINCT email\nFROM (\n    SELECT\n        email,\n        COUNT(*) OVER (\n            PARTITION BY email\n        ) AS email_count\n    FROM Employee\n) e\nWHERE email_count > 1;\n```\n\nЕсли `NULL` в поле `email` не должен считаться дубликатом, нужно дополнительно исключить такие строки через `WHERE email IS NOT NULL`.\n\n{{< /details >}}"
  filepath = "duplicated-emails"

[[tasks]]
  id = 42
  question = "Посчитать сотрудников с одинаковой зарплатой в каждом департаменте"
  answer = "**Условие задачи:**  \nДаны таблицы `department` и `employee`.\n\nНеобходимо для каждого департамента и каждой встречающейся в нём зарплаты вывести количество сотрудников, получающих эту зарплату.\n\n**Код:**\n\n```sql\nCREATE TABLE department (\n    id BIGSERIAL PRIMARY KEY,\n    name VARCHAR(255) NOT NULL\n);\n\nCREATE TABLE employee (\n    id BIGSERIAL,\n    surname VARCHAR(255) NOT NULL,\n    name VARCHAR(255) NOT NULL,\n    salary BIGINT NOT NULL,\n    department_id BIGINT NOT NULL REFERENCES department(id)\n);\n```\n\nПример результата:\n\n```text\ndep_name   | salary | employee_count\n-----------+--------+---------------\nDep_name_1 | 1000   | 3\nDep_name_1 | 2000   | 4\nDep_name_2 | 2000   | 30\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини сотрудников с департаментами по `department_id`.  \n💡 Группировать нужно одновременно по департаменту и зарплате.  \n💡 Для подсчёта сотрудников используй `COUNT(*)`.  \n💡 Учитывай `department.id`, чтобы департаменты с одинаковыми названиями не объединились.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    d.name AS dep_name,\n    e.salary,\n    COUNT(*) AS employee_count\nFROM department d\nJOIN employee e\n    ON e.department_id = d.id\nGROUP BY\n    d.id,\n    d.name,\n    e.salary\nORDER BY\n    d.name,\n    e.salary;\n```\n\nСначала сотрудники соединяются со своими департаментами:\n\n```sql\ne.department_id = d.id\n```\n\nЗатем записи группируются по департаменту и зарплате:\n\n```sql\nGROUP BY\n    d.id,\n    d.name,\n    e.salary\n```\n\n`COUNT(*)` возвращает количество сотрудников внутри каждой такой группы.\n\nНапример, если в одном департаменте три сотрудника получают `1000`, а четыре сотрудника получают `2000`, результат будет содержать две отдельные строки.\n\nВариант через оконную функцию:\n\n```sql\nSELECT DISTINCT\n    d.name AS dep_name,\n    e.salary,\n    COUNT(*) OVER (\n        PARTITION BY e.department_id, e.salary\n    ) AS employee_count\nFROM employee e\nJOIN department d\n    ON d.id = e.department_id\nORDER BY\n    dep_name,\n    salary;\n```\n\nДля этой задачи вариант с `GROUP BY` проще и естественнее, поскольку требуется получить одну строку на каждую пару «департамент — зарплата».\n\n{{< /details >}}"
  filepath = "salary-count-per-department"

[[tasks]]
  id = 43
  question = "Получить статистику по каждому отделу"
  answer = "**Условие задачи:**  \nДаны таблицы:\n\n- `Employees(EmployeeID, Name, DepartmentID, Salary)`;\n    \n- `Departments(DepartmentID, DepartmentName)`.\n    \n\nНеобходимо для каждого отдела вывести:\n\n- название отдела;\n    \n- количество сотрудников;\n    \n- среднюю зарплату, округлённую до двух знаков;\n    \n- максимальную зарплату;\n    \n- минимальную зарплату.\n    \n\nРезультат нужно отсортировать по количеству сотрудников по убыванию.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй `LEFT JOIN`, чтобы сохранить отделы без сотрудников.  \n💡 Для подсчёта сотрудников используй `COUNT(EmployeeID)`, а не `COUNT(*)`.  \n💡 Среднюю, максимальную и минимальную зарплату можно получить через `AVG()`, `MAX()` и `MIN()`.  \n💡 Среднюю зарплату округли через `ROUND(..., 2)`.  \n💡 Группируй по идентификатору и названию отдела.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    d.DepartmentName AS department_name,\n    COUNT(e.EmployeeID) AS employee_count,\n    ROUND(AVG(e.Salary), 2) AS average_salary,\n    MAX(e.Salary) AS max_salary,\n    MIN(e.Salary) AS min_salary\nFROM Departments d\nLEFT JOIN Employees e\n    ON e.DepartmentID = d.DepartmentID\nGROUP BY\n    d.DepartmentID,\n    d.DepartmentName\nORDER BY\n    employee_count DESC;\n```\n\n`LEFT JOIN` позволяет включить в результат отделы, в которых нет сотрудников.\n\nДля таких отделов:\n\n```text\nemployee_count = 0\naverage_salary = NULL\nmax_salary = NULL\nmin_salary = NULL\n```\n\nИспользуется:\n\n```sql\nCOUNT(e.EmployeeID)\n```\n\nа не `COUNT(*)`, потому что при `LEFT JOIN` для пустого отдела всё равно будет сформирована строка, но поля сотрудника будут равны `NULL`.\n\nГруппировка выполняется также по `DepartmentID`, чтобы отделы с одинаковыми названиями не объединились в одну группу.\n\n{{< /details >}}"
  filepath = "department-stats"

[[tasks]]
  id = 44
  question = "Оптимизировать медленный SQL-запрос  "
  answer = "**Условие задачи:**  \nДаны таблицы `customers` и `orders`.\n\n**Код:**\n\n```sql\nCREATE TABLE customers (\n    customer_id NUMERIC(15) PRIMARY KEY,\n    name VARCHAR(100),\n    email VARCHAR(100) UNIQUE,\n    registration_date TIMESTAMP,\n    premium_member BOOLEAN\n);\n\nCREATE TABLE orders (\n    order_id NUMERIC(15) PRIMARY KEY,\n    customer_id NUMERIC(15) REFERENCES customers(customer_id),\n    order_date TIMESTAMP,\n    total_amount DECIMAL(12, 2),\n    status VARCHAR(20)\n);\n```\n\nМедленно выполняется запрос:\n\n```sql\nSELECT\n    c.name,\n    c.email,\n    o.order_id,\n    o.order_date,\n    o.total_amount\nFROM customers c\nJOIN orders o\n    ON c.customer_id = o.customer_id\nWHERE o.status = 'Processing'\n  AND c.premium_member = TRUE\nORDER BY o.order_date DESC;\n```\n\nНеобходимо предложить способы его оптимизации.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала посмотри реальный план выполнения через `EXPLAIN ANALYZE`.  \n💡 Основная фильтрация выполняется по `orders.status` и `customers.premium_member`.  \n💡 Также используются `customer_id` для `JOIN` и `order_date` для сортировки.  \n💡 Подбирай индексы под фильтрацию, соединение и сортировку.  \n💡 Наличие `Seq Scan` само по себе не означает проблему — на больших выборках он может быть оптимальным.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nСам запрос переписывать необязательно — его логика уже достаточно простая. В первую очередь нужно проверить план выполнения:\n\n```sql\nEXPLAIN ANALYZE\nSELECT\n    c.name,\n    c.email,\n    o.order_id,\n    o.order_date,\n    o.total_amount\nFROM customers c\nJOIN orders o\n    ON c.customer_id = o.customer_id\nWHERE o.status = 'Processing'\n  AND c.premium_member = TRUE\nORDER BY o.order_date DESC;\n```\n\nДля таблицы `orders` полезен составной индекс:\n\n```sql\nCREATE INDEX idx_orders_status_date_customer\n    ON orders (\n        status,\n        order_date DESC,\n        customer_id\n    );\n```\n\nОн помогает:\n\n- отфильтровать строки по `status`;\n    \n- получить строки в порядке `order_date DESC`;\n    \n- использовать `customer_id` для соединения с `customers`.\n    \n\nВ PostgreSQL, если запрос почти всегда ищет именно статус `Processing`, можно создать более компактный частичный индекс:\n\n```sql\nCREATE INDEX idx_orders_processing_date_customer\n    ON orders (\n        order_date DESC,\n        customer_id\n    )\n    WHERE status = 'Processing';\n```\n\nДля премиум-клиентов также можно использовать частичный индекс:\n\n```sql\nCREATE INDEX idx_customers_premium\n    ON customers (customer_id)\n    WHERE premium_member = TRUE;\n```\n\nПри этом `customer_id` уже является `PRIMARY KEY`, поэтому отдельный индекс на него создавать не нужно.\n\nПосле создания индексов необходимо повторно проверить план:\n\n```sql\nEXPLAIN ANALYZE\nSELECT\n    c.name,\n    c.email,\n    o.order_id,\n    o.order_date,\n    o.total_amount\nFROM customers c\nJOIN orders o\n    ON c.customer_id = o.customer_id\nWHERE o.status = 'Processing'\n  AND c.premium_member = TRUE\nORDER BY o.order_date DESC;\n```\n\nВажно смотреть не только на `Seq Scan` или `Index Scan`, а на фактическое время выполнения, количество обработанных строк, способ соединения и наличие отдельной сортировки.\n\nДля PostgreSQL также полезно обновить статистику:\n\n```sql\nANALYZE customers;\nANALYZE orders;\n```\n\nЕсли запрос выполняется очень часто, а данные подходят для некоторой задержки обновления, можно дополнительно рассмотреть материализованное представление. Но начинать оптимизацию следует с `EXPLAIN ANALYZE` и подходящих индексов.\n\n{{< /details >}}"
  filepath = "refactor-slow-query"

[[tasks]]
  id = 45
  question = "Найти сотрудников с максимальной зарплатой в каждом департаменте"
  answer = "**Условие задачи:**  \nДаны таблицы `departments` и `employees`.\n\nНеобходимо для каждого департамента вывести сотрудников, получающих максимальную зарплату в своём департаменте:\n\n- название департамента;\n    \n- имя сотрудника;\n    \n- зарплату.\n    \n\nЕсли несколько сотрудников получают одинаковую максимальную зарплату, нужно вывести их всех.\n\n**Код:**\n\n```sql\nCREATE TABLE departments (\n    id INT PRIMARY KEY,\n    name VARCHAR(100)\n);\n\nCREATE TABLE employees (\n    id INT PRIMARY KEY,\n    name VARCHAR(100),\n    department_id INT REFERENCES departments(id),\n    salary NUMERIC(10, 2)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй оконную функцию `RANK()` или `DENSE_RANK()`.  \n💡 Раздели сотрудников по `department_id` через `PARTITION BY`.  \n💡 Внутри каждого департамента отсортируй сотрудников по `salary DESC`.  \n💡 Сотрудники с максимальной зарплатой получат ранг `1`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через оконную функцию:\n\n```sql\nWITH ranked_employees AS (\n    SELECT\n        d.name AS department,\n        e.name AS employee,\n        e.salary,\n        RANK() OVER (\n            PARTITION BY e.department_id\n            ORDER BY e.salary DESC\n        ) AS salary_rank\n    FROM employees e\n    JOIN departments d\n        ON d.id = e.department_id\n)\nSELECT\n    department,\n    employee,\n    salary\nFROM ranked_employees\nWHERE salary_rank = 1\nORDER BY department, employee;\n```\n\nОконная функция:\n\n```sql\nRANK() OVER (\n    PARTITION BY e.department_id\n    ORDER BY e.salary DESC\n)\n```\n\nотдельно ранжирует сотрудников внутри каждого департамента.\n\nСотрудники с максимальной зарплатой получают ранг `1`.\n\nНапример:\n\n```text\ndepartment | employee | salary\n-----------+----------+-------\nIT         | Alex     | 200000\nIT         | Ivan     | 200000\nHR         | Anna     | 150000\n```\n\nЕсли в одном департаменте несколько сотрудников имеют одинаковую максимальную зарплату, `RANK()` вернёт всех таких сотрудников.\n\n{{< /details >}}"
  filepath = "top-employee-per-department"

[[tasks]]
  id = 46
  question = "Спроектировать хранение товаров и остатков по магазинам"
  answer = "**Условие задачи:**  \nНеобходимо спроектировать структуру таблиц для сети магазинов, чтобы можно было получить:\n\n1. товары, которые есть в конкретном магазине;\n    \n2. магазины, в которых есть конкретный товар;\n    \n3. общее количество каждого товара по всем магазинам;\n    \n4. товары, отсутствующие в конкретном магазине.\n    \n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Магазины и товары связаны отношением «многие ко многим».  \n💡 Для связи нужна промежуточная таблица с количеством товара.  \n💡 Пара `(store_id, product_id)` должна быть уникальной.  \n💡 Для поиска товара по всем магазинам пригодится отдельный индекс по `product_id`.  \n💡 Отсутствующим можно считать товар с `quantity = 0` или без записи в таблице остатков.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nСтруктура таблиц:\n\n```sql\nCREATE TABLE store (\n    id BIGSERIAL PRIMARY KEY,\n    name TEXT NOT NULL\n);\n\nCREATE TABLE product (\n    id BIGSERIAL PRIMARY KEY,\n    name TEXT NOT NULL,\n    sku TEXT NOT NULL UNIQUE,\n    description TEXT\n);\n\nCREATE TABLE store_inventory (\n    store_id BIGINT NOT NULL\n        REFERENCES store(id),\n    product_id BIGINT NOT NULL\n        REFERENCES product(id),\n    quantity INTEGER NOT NULL\n        CHECK (quantity >= 0),\n\n    PRIMARY KEY (store_id, product_id)\n);\n```\n\nДля запросов по товару полезно добавить индекс:\n\n```sql\nCREATE INDEX idx_store_inventory_product\n    ON store_inventory (product_id, store_id);\n```\n\nТовары, которые есть в конкретном магазине:\n\n```sql\nSELECT\n    p.name,\n    si.quantity\nFROM store_inventory si\nJOIN product p\n    ON p.id = si.product_id\nWHERE si.store_id = 1\n  AND si.quantity > 0;\n```\n\nМагазины, в которых есть конкретный товар:\n\n```sql\nSELECT\n    s.name,\n    si.quantity\nFROM store_inventory si\nJOIN store s\n    ON s.id = si.store_id\nWHERE si.product_id = 2\n  AND si.quantity > 0;\n```\n\nОбщее количество каждого товара по всем магазинам:\n\n```sql\nSELECT\n    p.id,\n    p.name,\n    COALESCE(SUM(si.quantity), 0) AS total_quantity\nFROM product p\nLEFT JOIN store_inventory si\n    ON si.product_id = p.id\nGROUP BY\n    p.id,\n    p.name;\n```\n\nТовары, отсутствующие в конкретном магазине:\n\n```sql\nSELECT\n    p.id,\n    p.name\nFROM product p\nLEFT JOIN store_inventory si\n    ON si.product_id = p.id\n   AND si.store_id = 1\nWHERE COALESCE(si.quantity, 0) = 0;\n```\n\nСвязь:\n\n```text\nstore 1 ─── N store_inventory N ─── 1 product\n```\n\nТаблица `store_inventory` хранит остаток конкретного товара в конкретном магазине. Составной первичный ключ не позволяет создать две записи для одной пары «магазин — товар».\n\n{{< /details >}}"
  filepath = "design-product-inventory"

[[tasks]]
  id = 47
  question = "Посчитать выручку каждого продавца"
  answer = "**Условие задачи:**  \nДаны таблицы `Salespersons`, `Customers` и `Orders`.\n\nНеобходимо вывести:\n\n- идентификатор каждого продавца;\n    \n- общую сумму заказов его клиентов.\n    \n\nВ результате должны присутствовать все продавцы, включая тех, у кого нет заказов. Для таких продавцов сумма должна быть равна `0`.\n\nРезультат нужно отсортировать по `id` продавца.\n\n**Код:**\n\n```sql\nCREATE TABLE Salespersons (\n    id SERIAL PRIMARY KEY,\n    name VARCHAR(20)\n);\n\nCREATE TABLE Customers (\n    id SERIAL PRIMARY KEY,\n    salesperson_id INT\n);\n\nCREATE TABLE Orders (\n    id SERIAL PRIMARY KEY,\n    customer_id INT,\n    price INT\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Начинай выборку с таблицы `Salespersons`, чтобы сохранить всех продавцов.  \n💡 Соедини продавцов с клиентами, а клиентов — с заказами через `LEFT JOIN`.  \n💡 Для подсчёта выручки используй `SUM(o.price)`.  \n💡 Для продавцов без заказов `SUM()` вернёт `NULL`, поэтому используй `COALESCE()`.  \n💡 Группируй результат по продавцу и отсортируй по его `id`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    s.id AS salesperson_id,\n    COALESCE(SUM(o.price), 0) AS total_earned\nFROM Salespersons s\nLEFT JOIN Customers c\n    ON c.salesperson_id = s.id\nLEFT JOIN Orders o\n    ON o.customer_id = c.id\nGROUP BY s.id\nORDER BY s.id;\n```\n\nПервый `LEFT JOIN` сохраняет продавцов, у которых нет клиентов:\n\n```sql\nLEFT JOIN Customers c\n    ON c.salesperson_id = s.id\n```\n\nВторой `LEFT JOIN` сохраняет клиентов, у которых нет заказов:\n\n```sql\nLEFT JOIN Orders o\n    ON o.customer_id = c.id\n```\n\nПосле этого `SUM(o.price)` подсчитывает общую стоимость всех заказов клиентов конкретного продавца.\n\nДля продавца без заказов результат `SUM()` будет равен `NULL`, поэтому:\n\n```sql\nCOALESCE(SUM(o.price), 0)\n```\n\nзаменяет его на `0`.\n\n{{< /details >}}"
  filepath = "salespersons-revenue"

[[tasks]]
  id = 48
  question = "Получить последнюю запись для каждого col2"
  answer = "**Условие задачи:**  \nДана таблица `table1`:\n\n- `col1` — первичный ключ;\n    \n- `col2` — неуникальный идентификатор, связанный с другой таблицей;\n    \n- `col3` — сумма;\n    \n- `col4` — дата изменения записи.\n    \n\nНеобходимо для каждого уникального значения `col2` вернуть только одну самую свежую запись по `col4`.\n\n**Код:**\n\n```text\ntable1\n\ncol1 — primary key\ncol2 — secondary / foreign key\ncol3 — amount\ncol4 — change date\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Раздели строки на группы по `col2`.  \n💡 Внутри каждой группы отсортируй записи по `col4 DESC`.  \n💡 Присвой строкам номера через `ROW_NUMBER()`.  \n💡 Затем оставь только строки с номером `1`.  \n💡 Если даты совпадают, добавь дополнительную сортировку по первичному ключу для однозначного результата.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nУниверсальный вариант через оконную функцию:\n\n```sql\nSELECT\n    col1,\n    col2,\n    col3,\n    col4\nFROM (\n    SELECT\n        t.*,\n        ROW_NUMBER() OVER (\n            PARTITION BY col2\n            ORDER BY col4 DESC, col1 DESC\n        ) AS rn\n    FROM table1 t\n) t\nWHERE rn = 1;\n```\n\n`PARTITION BY col2` создаёт отдельную группу для каждого значения `col2`.\n\n```sql\nORDER BY col4 DESC, col1 DESC\n```\n\nставит самую свежую запись первой. `col1` используется как дополнительный критерий, если несколько записей имеют одинаковую дату.\n\nПосле этого:\n\n```sql\nWHERE rn = 1\n```\n\nоставляет ровно одну запись для каждого `col2`.\n\nДля PostgreSQL можно использовать более короткий вариант:\n\n```sql\nSELECT DISTINCT ON (col2)\n    col1,\n    col2,\n    col3,\n    col4\nFROM table1\nORDER BY\n    col2,\n    col4 DESC,\n    col1 DESC;\n```\n\nДля ускорения такого запроса в PostgreSQL можно создать индекс:\n\n```sql\nCREATE INDEX idx_table1_col2_col4\n    ON table1 (col2, col4 DESC, col1 DESC);\n```\n\n{{< /details >}}"
  filepath = "latest-by-foreign-key"

[[tasks]]
  id = 49
  question = "Найти минимальную и максимальную зарплату по отделам"
  answer = "**Условие задачи:**  \nДаны таблицы:\n\n- `units(id, name)` — подразделения компании;\n    \n- `employees(id, unit_id, salary, fired)` — сотрудники.\n    \n\nНеобходимо для каждого `unit_id` получить минимальную и максимальную зарплату среди неуволенных сотрудников.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала оставь только неуволенных сотрудников.  \n💡 Сгруппируй записи по `unit_id`.  \n💡 Для поиска зарплат используй `MIN()` и `MAX()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    unit_id,\n    MIN(salary) AS min_salary,\n    MAX(salary) AS max_salary\nFROM employees\nWHERE fired = false\nGROUP BY unit_id;\n```\n\nУсловие:\n\n```sql\nWHERE fired = false\n```\n\nисключает уволенных сотрудников.\n\nПосле группировки по `unit_id` агрегатные функции вычисляют минимальную и максимальную зарплату отдельно для каждого подразделения.\n\nЕсли дополнительно требуется название подразделения:\n\n```sql\nSELECT\n    u.id AS unit_id,\n    u.name AS unit_name,\n    MIN(e.salary) AS min_salary,\n    MAX(e.salary) AS max_salary\nFROM units u\nJOIN employees e\n    ON e.unit_id = u.id\nWHERE e.fired = false\nGROUP BY\n    u.id,\n    u.name;\n```\n\n{{< /details >}}"
  filepath = "min-max-salary-by-unit_2"

[[tasks]]
  id = 50
  question = "Удалить дублирующиеся email, оставив одну запись"
  answer = "**Условие задачи:**  \nДана таблица `emails(id, email)`, в которой один и тот же email может встречаться несколько раз.\n\nНеобходимо удалить дубликаты и оставить только одну запись для каждого уникального email.\n\n**Код:**\n\n```sql\nCREATE TABLE emails (\n    id INT,\n    email VARCHAR(30)\n);\n\nINSERT INTO emails(id, email)\nVALUES\n    (1, 'aa@yandex.ru'),\n    (2, 'bb@yandex.ru'),\n    (3, 'aa@yandex.ru');\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала пронумеруй строки внутри каждой группы одинаковых `email`.  \n💡 Для этого удобно использовать `ROW_NUMBER()`.  \n💡 Первую строку в каждой группе нужно оставить, остальные удалить.  \n💡 В PostgreSQL для однозначного удаления конкретной строки можно использовать `ctid`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВ PostgreSQL можно использовать `ROW_NUMBER()` вместе с `ctid`:\n\n```sql\nWITH duplicates AS (\n    SELECT\n        ctid,\n        ROW_NUMBER() OVER (\n            PARTITION BY email\n            ORDER BY id\n        ) AS rn\n    FROM emails\n)\nDELETE FROM emails\nWHERE ctid IN (\n    SELECT ctid\n    FROM duplicates\n    WHERE rn > 1\n);\n```\n\n`ROW_NUMBER()` нумерует записи отдельно для каждого email:\n\n```text\nemail         | rn\n--------------+---\naa@yandex.ru  | 1\naa@yandex.ru  | 2\nbb@yandex.ru  | 1\n```\n\nУдаляются только строки с:\n\n```sql\nrn > 1\n```\n\nВ результате останется:\n\n```text\nid | email\n---+-------------\n1  | aa@yandex.ru\n2  | bb@yandex.ru\n```\n\nЕсли `id` гарантированно уникален, запрос можно написать проще:\n\n```sql\nWITH duplicates AS (\n    SELECT\n        id,\n        ROW_NUMBER() OVER (\n            PARTITION BY email\n            ORDER BY id\n        ) AS rn\n    FROM emails\n)\nDELETE FROM emails\nWHERE id IN (\n    SELECT id\n    FROM duplicates\n    WHERE rn > 1\n);\n```\n\nПосле удаления дублей имеет смысл добавить ограничение, чтобы они больше не появлялись:\n\n```sql\nALTER TABLE emails\nADD CONSTRAINT uq_emails_email UNIQUE (email);\n```\n\n{{< /details >}}"
  filepath = "delete-duplicates-emails"

[[tasks]]
  id = 51
  question = "Подобрать индекс для медленного запроса"
  answer = "**Условие задачи:**  \nВ приложении медленно выполняется запрос:\n\n```sql\nSELECT id, name\nFROM users\nWHERE name = 'Artem'\n  AND create_date = '2024-10-28'\n  AND status = 'ACTIVE';\n```\n\nНеобходимо определить, какой индекс стоит добавить для ускорения этого запроса.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Запрос фильтрует строки одновременно по трём колонкам.  \n💡 Для такого запроса обычно подходит составной индекс по колонкам из `WHERE`.  \n💡 Все три условия используют сравнение по равенству, поэтому для данного конкретного запроса порядок этих колонок в индексе обычно не является критичным.  \n💡 Порядок становится важнее, если этот же индекс должен использоваться и другими запросами только по части колонок.  \n💡 После создания индекса проверь план выполнения через `EXPLAIN ANALYZE`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nДля данного запроса можно создать составной индекс:\n\n```sql\nCREATE INDEX idx_users_name_create_date_status\n    ON users (name, create_date, status);\n```\n\nОн соответствует условиям фильтрации:\n\n```sql\nWHERE name = 'Artem'\n  AND create_date = '2024-10-28'\n  AND status = 'ACTIVE'\n```\n\nи позволяет СУБД искать подходящие строки по индексу вместо полного просмотра таблицы, если использование индекса действительно выгодно для имеющихся данных.\n\nПоскольку во всех трёх условиях используется `=`, для именно этого запроса варианты:\n\n```sql\n(name, create_date, status)\n```\n\nи, например:\n\n```sql\n(create_date, status, name)\n```\n\nмогут одинаково эффективно ограничивать выборку по всем трём колонкам.\n\nВыбирать порядок только по правилу «самая селективная колонка всегда первая» не обязательно. Порядок особенно важен, если индекс должен поддерживать также запросы по его левому префиксу. Например, индекс:\n\n```sql\nCREATE INDEX idx_users_name_create_date_status\n    ON users (name, create_date, status);\n```\n\nможет быть полезен и для запросов только по `name` или по `name` вместе с `create_date`.\n\nПосле создания индекса следует проверить реальный план:\n\n```sql\nEXPLAIN ANALYZE\nSELECT id, name\nFROM users\nWHERE name = 'Artem'\n  AND create_date = '2024-10-28'\n  AND status = 'ACTIVE';\n```\n\nПри этом наличие `Seq Scan` само по себе не означает проблему: если таблица небольшая или условию соответствует значительная часть строк, полный просмотр таблицы может оказаться дешевле использования индекса.\n\n{{< /details >}}"
  filepath = "add-index-for-slow-query"

[[tasks]]
  id = 52
  question = "Найти сотрудников с зарплатой выше, чем у руководителя"
  answer = "**Условие задачи:**  \nДана таблица `EMPLOYEE(ID, NAME, SALARY, DEPARTMENT_ID, CHIEF_ID)`.\n\nНеобходимо вывести сотрудников, чья зарплата выше зарплаты их непосредственного руководителя.\n\nПоле `CHIEF_ID` содержит `ID` руководителя сотрудника.\n\n**Код:**\n\n```sql\nCREATE TABLE EMPLOYEE (\n    ID INT,\n    NAME VARCHAR(256),\n    SALARY INT,\n    DEPARTMENT_ID INT,\n    CHIEF_ID INT\n);\n\n-- Пример данных\n-- ID | NAME      | SALARY | DEPARTMENT_ID | CHIEF_ID\n-- ---+-----------+--------+---------------+---------\n-- 1  | Иванов    | 150    | 1             | NULL\n-- 2  | Петров    | 250    | 1             | 1\n-- 3  | Сидоров   | 550    | 1             | 1\n-- 4  | Медведев  | 350    | 2             | 6\n-- 5  | Соколов   | 350    | 2             | 6\n-- 6  | Рыбников  | 150    | 2             | NULL\n-- 7  | Арбузов   | 450    | 3             | NULL\n-- 8  | Орехов    | 650    | 3             | 7\n-- 9  | Дынин     | 50     | 3             | 7\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй `self join`: соедини таблицу `EMPLOYEE` саму с собой.  \n💡 Один алиас будет представлять сотрудника, второй — его руководителя.  \n💡 Связь между ними задаётся условием `e.CHIEF_ID = c.ID`.  \n💡 После соединения сравни зарплаты сотрудника и руководителя.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    e.NAME AS employee_name,\n    e.SALARY AS employee_salary,\n    c.NAME AS chief_name,\n    c.SALARY AS chief_salary\nFROM EMPLOYEE e\nJOIN EMPLOYEE c\n    ON c.ID = e.CHIEF_ID\nWHERE e.SALARY > c.SALARY;\n```\n\nТаблица соединяется сама с собой:\n\n```sql\nJOIN EMPLOYEE c\n    ON c.ID = e.CHIEF_ID\n```\n\n`e` представляет сотрудника, а `c` — его непосредственного руководителя.\n\nПосле этого остаются только сотрудники, чья зарплата выше зарплаты руководителя:\n\n```sql\nWHERE e.SALARY > c.SALARY\n```\n\nДля приведённых данных результат будет таким:\n\n```text\nemployee_name | employee_salary | chief_name | chief_salary\n--------------+-----------------+------------+-------------\nПетров        | 250             | Иванов     | 150\nСидоров       | 550             | Иванов     | 150\nМедведев      | 350             | Рыбников   | 150\nСоколов       | 350             | Рыбников   | 150\nОрехов        | 650             | Арбузов    | 450\n```\n\nСотрудники с `CHIEF_ID = NULL` автоматически не попадут в результат, поскольку для них не найдётся строка руководителя при `INNER JOIN`.\n\n{{< /details >}}"
  filepath = "employees-higher-salary-than-chief"

[[tasks]]
  id = 53
  question = "Найти отделы, где не больше трёх сотрудников"
  answer = "**Условие задачи:**  \nДана таблица `EMPLOYEE(ID, NAME, SALARY, DEPARTMENT_ID, CHIEF_ID)`.\n\nНеобходимо вывести идентификаторы отделов, в которых работает не более трёх сотрудников.\n\n**Код:**\n\n```sql\nCREATE TABLE EMPLOYEE (\n    ID INT,\n    NAME VARCHAR(256),\n    SALARY INT,\n    DEPARTMENT_ID INT,\n    CHIEF_ID INT\n);\n\n-- Пример данных:\n-- ID | NAME      | SALARY | DEPARTMENT_ID | CHIEF_ID\n-- ---+-----------+--------+---------------+---------\n-- 1  | Иванов    | 150    | 1             | NULL\n-- 2  | Петров    | 250    | 1             | 1\n-- 3  | Сидоров   | 550    | 1             | 1\n-- 4  | Медведев  | 350    | 2             | 6\n-- 5  | Соколов   | 350    | 2             | 6\n-- 6  | Рыбников  | 150    | 2             | NULL\n-- 7  | Арбузов   | 450    | 3             | NULL\n-- 8  | Орехов    | 650    | 3             | 7\n-- 9  | Дынин     | 50     | 3             | 7\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй сотрудников по `DEPARTMENT_ID`.  \n💡 Для каждой группы посчитай количество строк через `COUNT(*)`.  \n💡 Условия на результат агрегирования задаются через `HAVING`, а не `WHERE`.  \n💡 Оставь группы, где количество сотрудников не превышает трёх.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    DEPARTMENT_ID\nFROM EMPLOYEE\nWHERE DEPARTMENT_ID IS NOT NULL\nGROUP BY DEPARTMENT_ID\nHAVING COUNT(*) <= 3\nORDER BY DEPARTMENT_ID;\n```\n\nСначала сотрудники группируются по отделам:\n\n```sql\nGROUP BY DEPARTMENT_ID\n```\n\nПосле этого `COUNT(*)` подсчитывает количество сотрудников в каждом отделе, а:\n\n```sql\nHAVING COUNT(*) <= 3\n```\n\nоставляет только отделы, где работает не больше трёх человек.\n\nДля приведённых данных результат:\n\n```text\ndepartment_id\n-------------\n1\n2\n3\n```\n\nВо всех трёх отделах работает ровно по три сотрудника.\n\nТак как в условии дана только таблица `EMPLOYEE`, запрос может вернуть только отделы, в которых есть хотя бы один сотрудник. Чтобы также получить отделы с нулём сотрудников, потребовалась бы отдельная таблица отделов и `LEFT JOIN`.\n\n{{< /details >}}"
  filepath = "departments-with-few-employees"

[[tasks]]
  id = 54
  question = "Найти дублирующиеся email среди клиентов-мужчин"
  answer = "**Условие задачи:**  \nВ таблице `customers` необходимо найти дублирующиеся значения поля `email`, учитывая только клиентов с `gender = 'male'`.\n\nНужно вывести:\n\n- `email`;\n    \n- `cnt` — количество записей с этим email.\n    \n\nВ результат должны попасть только email, встречающиеся более одного раза.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала отфильтруй только записи с `gender = 'male'`.  \n💡 Сгруппируй оставшиеся строки по `email`.  \n💡 Для каждой группы посчитай количество записей через `COUNT(*)`.  \n💡 Условия на результат группировки задаются через `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    email,\n    COUNT(*) AS cnt\nFROM customers\nWHERE gender = 'male'\nGROUP BY email\nHAVING COUNT(*) > 1;\n```\n\nУсловие:\n\n```sql\nWHERE gender = 'male'\n```\n\nограничивает выборку клиентами-мужчинами.\n\nЗатем:\n\n```sql\nGROUP BY email\n```\n\nобъединяет строки с одинаковыми email, а:\n\n```sql\nHAVING COUNT(*) > 1\n```\n\nоставляет только те адреса, которые встречаются более одного раза.\n\nЕсли `email` может быть `NULL` и такие значения не должны считаться дублями, можно добавить:\n\n```sql\nWHERE gender = 'male'\n  AND email IS NOT NULL\n```\n\n{{< /details >}}"
  filepath = "find-email-duplicates"

[[tasks]]
  id = 55
  question = "Показать пример использования HAVING  "
  answer = "**Условие задачи:**  \nДана таблица `Employees` с колонками:\n\n- `employee_name`;\n    \n- `salary`;\n    \n- `department_id`.\n    \n\nНеобходимо привести пример SQL-запроса с использованием `HAVING`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `WHERE` фильтрует отдельные строки до группировки.  \n💡 `HAVING` используется для фильтрации результатов группировки.  \n💡 Обычно `HAVING` применяется вместе с агрегатными функциями: `COUNT()`, `SUM()`, `AVG()`, `MIN()`, `MAX()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nНапример, выведем отделы, в которых средняя зарплата сотрудников больше `50000`:\n\n```sql\nSELECT\n    department_id,\n    COUNT(*) AS employee_count,\n    AVG(salary) AS average_salary\nFROM Employees\nGROUP BY department_id\nHAVING AVG(salary) > 50000;\n```\n\nСначала сотрудники группируются по отделам:\n\n```sql\nGROUP BY department_id\n```\n\nДля каждой группы вычисляются количество сотрудников и средняя зарплата:\n\n```sql\nCOUNT(*)\nAVG(salary)\n```\n\nЗатем:\n\n```sql\nHAVING AVG(salary) > 50000\n```\n\nоставляет только те отделы, в которых средняя зарплата превышает `50000`.\n\nГлавное отличие:\n\n```text\nWHERE  — фильтрует строки до GROUP BY\nHAVING — фильтрует группы после GROUP BY\n```\n\n{{< /details >}}"
  filepath = "having-example"

[[tasks]]
  id = 56
  question = "Найти минимальную и максимальную зарплату по отделам среди неуволенных сотрудников  "
  answer = "**Условие задачи:**  \nДаны таблицы `units` и `employees`.\n\nНеобходимо для каждого отдела вывести:\n\n- ID отдела;\n    \n- минимальную зарплату;\n    \n- максимальную зарплату\n    \n\nсреди сотрудников, у которых `fired = false`.\n\n**Код:**\n\n```text\nunits:\n  id int PK\n  name text\n\nemployees:\n  id int PK\n  unit_id int FK → units.id\n  salary numeric\n  fired boolean\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для основного решения таблица `units` не требуется: нужный `unit_id` уже находится в `employees`.  \n💡 Сначала оставь только неуволенных сотрудников через `WHERE fired = false`.  \n💡 Сгруппируй сотрудников по `unit_id`.  \n💡 Для зарплат используй агрегатные функции `MIN()` и `MAX()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    unit_id,\n    MIN(salary) AS min_salary,\n    MAX(salary) AS max_salary\nFROM employees\nWHERE fired = false\nGROUP BY unit_id;\n```\n\nУсловие:\n\n```sql\nWHERE fired = false\n```\n\nоставляет только неуволенных сотрудников.\n\nЗатем:\n\n```sql\nGROUP BY unit_id\n```\n\nразбивает их по отделам, а `MIN()` и `MAX()` вычисляют минимальную и максимальную зарплату внутри каждого отдела.\n\nЕсли требуется вывести **все отделы**, включая те, в которых нет неуволенных сотрудников, можно использовать `LEFT JOIN`:\n\n```sql\nSELECT\n    u.id AS unit_id,\n    MIN(e.salary) AS min_salary,\n    MAX(e.salary) AS max_salary\nFROM units u\nLEFT JOIN employees e\n    ON e.unit_id = u.id\n   AND e.fired = false\nGROUP BY u.id;\n```\n\nВ этом случае для отдела без неуволенных сотрудников `min_salary` и `max_salary` будут равны `NULL`.\n\n{{< /details >}}"
  filepath = "min-max-salary-active-employees"

[[tasks]]
  id = 57
  question = "Показать разницу между WHERE и HAVING"
  answer = "**Условие задачи:**  \nНеобходимо привести реалистичный SQL-пример, в котором одновременно используются `WHERE` и `HAVING`, и показать разницу между ними.\n\n`WHERE` должен фильтровать отдельные строки до группировки, а `HAVING` — получившиеся группы после `GROUP BY`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `WHERE` применяется до `GROUP BY` и отбрасывает отдельные строки.  \n💡 `HAVING` применяется к уже сформированным группам.  \n💡 Например, можно учитывать только активных сотрудников, а затем оставить отделы с высокой средней зарплатой и достаточным количеством сотрудников.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nПредположим, есть таблица `employees` с колонками `department_id`, `salary` и `status`.\n\n```sql\nSELECT\n    department_id,\n    AVG(salary) AS avg_salary,\n    COUNT(*) AS employee_count\nFROM employees\nWHERE status = 'ACTIVE'\nGROUP BY department_id\nHAVING AVG(salary) > 50000\n   AND COUNT(*) >= 3;\n```\n\nУсловие:\n\n```sql\nWHERE status = 'ACTIVE'\n```\n\nсрабатывает **до группировки** и оставляет только активных сотрудников.\n\nЗатем:\n\n```sql\nGROUP BY department_id\n```\n\nобъединяет оставшиеся строки по отделам.\n\nПосле вычисления агрегатов:\n\n```sql\nHAVING AVG(salary) > 50000\n   AND COUNT(*) >= 3\n```\n\nоставляет только те отделы, где среди активных сотрудников:\n\n- средняя зарплата превышает `50000`;\n    \n- количество сотрудников не меньше трёх.\n    \n\nГлавное отличие:\n\n```text\nWHERE  — фильтрует строки до GROUP BY\nHAVING — фильтрует группы после GROUP BY\n```\n\nИменно поэтому условие по обычному полю `status` естественно задавать через `WHERE`, а условия по `AVG()` и `COUNT()` — через `HAVING`.\n\n{{< /details >}}"
  filepath = "having-vs-where-example"

[[tasks]]
  id = 58
  question = "Посчитать сотрудников по отделам и найти отделы с четырьмя и более высокооплачиваемыми сотрудниками  "
  answer = "Даны таблицы `departments` и `employees`.\n\nНеобходимо написать два SQL-запроса:\n\n1. Посчитать количество сотрудников в каждом отделе.\n    \n2. Найти отделы, в которых работает больше трёх сотрудников с зарплатой выше `100000`.\n    \n\n**Код:**\n\n```sql\nCREATE TABLE departments (\n    id INT PRIMARY KEY,\n    name VARCHAR(100) NOT NULL\n);\n\nCREATE TABLE employees (\n    id INT PRIMARY KEY,\n    name VARCHAR(100) NOT NULL,\n    department_id INT REFERENCES departments(id),\n    salary INT NOT NULL\n);\n\nINSERT INTO departments (id, name) VALUES\n    (1, 'Отдел ИТ'),\n    (2, 'Отдел ИБ'),\n    (3, 'HR');\n\nINSERT INTO employees (id, name, department_id, salary) VALUES\n    (1, 'Иван Петров', 1, 120000),\n    (2, 'Елена Сидорова', 1, 110000),\n    (3, 'Алексей Иванов', 1, 105000),\n    (4, 'Мария Кузнецова', 1, 95000),\n    (5, 'Дмитрий Смирнов', 2, 150000),\n    (6, 'Ольга Васильева', 2, 130000),\n    (7, 'Сергей Миронов', 2, 80000),\n    (8, 'Анна Жукова', 3, 115000),\n    (9, 'Павел Белов', 3, 125000),\n    (10, 'Наталья Воробьева', 3, 140000),\n    (11, 'Артем Громов', 3, 98000),\n    (12, 'Виктория Орлова', 1, 108000);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для подсчёта сотрудников сгруппируй данные по отделам.  \n💡 Если нужно сохранить отделы без сотрудников, начинай запрос с `departments` и используй `LEFT JOIN`.  \n💡 При `LEFT JOIN` считай `COUNT(e.id)`, а не `COUNT(*)`.  \n💡 Во второй задаче сначала отфильтруй сотрудников с `salary > 100000`, затем сгруппируй их по отделам.  \n💡 Условие на количество сотрудников после группировки задаётся через `HAVING COUNT(*) > 3`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n1. Количество сотрудников в каждом отделе:\n    \n\n```sql\nSELECT\n    d.id AS department_id,\n    d.name AS department_name,\n    COUNT(e.id) AS employee_count\nFROM departments d\nLEFT JOIN employees e\n    ON e.department_id = d.id\nGROUP BY\n    d.id,\n    d.name\nORDER BY d.id;\n```\n\n`LEFT JOIN` позволяет вывести даже отделы без сотрудников. Для такого отдела `COUNT(e.id)` вернёт `0`.\n\nДля приведённых данных:\n\n```text\ndepartment_id | department_name | employee_count\n--------------+-----------------+---------------\n1             | Отдел ИТ        | 5\n2             | Отдел ИБ        | 3\n3             | HR              | 4\n```\n\n2. Отделы, где больше трёх сотрудников получают зарплату выше `100000`:\n    \n\n```sql\nSELECT\n    d.id AS department_id,\n    d.name AS department_name,\n    COUNT(*) AS high_paid_count\nFROM departments d\nJOIN employees e\n    ON e.department_id = d.id\nWHERE e.salary > 100000\nGROUP BY\n    d.id,\n    d.name\nHAVING COUNT(*) > 3\nORDER BY d.id;\n```\n\nСначала:\n\n```sql\nWHERE e.salary > 100000\n```\n\nоставляет только сотрудников с зарплатой выше `100000`.\n\nПосле группировки условие:\n\n```sql\nHAVING COUNT(*) > 3\n```\n\nоставляет только отделы, где таких сотрудников больше трёх.\n\nДля приведённых данных условию соответствует только `Отдел ИТ`: в нём четыре сотрудника получают зарплату выше `100000`.\n\n{{< /details >}}"
  filepath = "departments-employees-aggregation"

[[tasks]]
  id = 59
  question = "Спроектировать таблицу для иерархического справочника организаций"
  answer = "**Условие задачи:**  \nНеобходимо спроектировать структуру БД для иерархического справочника подразделений.\n\nСтруктура может иметь произвольную глубину, например:\n\n```text\nТН - Технологии\n  Управление ИБ\n    Отдел разработки решений ИБ\n      Бюро разработки\n      Бюро эксплуатации\n  Управление ИТ\n    Отдел ИТ\n    Отдел архитектуры\n\nТН - Дальний восток\n  РНУ\n    НПС 1\n    НПС 2\n```\n\nНужно определить:\n\n- достаточно ли одной таблицы;\n    \n- как хранить связь между родительским и дочерним подразделением;\n    \n- какие основные поля понадобятся.\n    \n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для дерева произвольной глубины удобно использовать модель `Adjacency List`.  \n💡 Каждая строка представляет один узел дерева и содержит ссылку `parent_id` на родительский узел.  \n💡 У корневых элементов `parent_id = NULL`.  \n💡 Необязательно создавать отдельные таблицы для управлений, отделов, бюро и других уровней.  \n💡 Для быстрого поиска непосредственных потомков полезен индекс по `parent_id`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nДля такого справочника обычно достаточно **одной таблицы**, которая ссылается сама на себя через `parent_id`.\n\n```sql\nCREATE TABLE org_unit (\n    id BIGSERIAL PRIMARY KEY,\n    parent_id BIGINT REFERENCES org_unit(id),\n    name VARCHAR(255) NOT NULL,\n    type VARCHAR(50),\n    code VARCHAR(50),\n    sort_order INT NOT NULL DEFAULT 0,\n    is_active BOOLEAN NOT NULL DEFAULT TRUE,\n    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\n    CHECK (parent_id IS NULL OR parent_id <> id)\n);\n```\n\nДля поиска дочерних подразделений стоит добавить индекс:\n\n```sql\nCREATE INDEX idx_org_unit_parent_id\n    ON org_unit (parent_id);\n```\n\nПример хранения дерева:\n\n```text\nid | parent_id | name                        | type\n---+-----------+-----------------------------+-----------\n1  | NULL      | ТН - Технологии             | HOLDING\n2  | 1         | Управление ИБ               | MANAGEMENT\n3  | 2         | Отдел разработки решений ИБ | DEPARTMENT\n4  | 3         | Бюро разработки             | BUREAU\n5  | 3         | Бюро эксплуатации           | BUREAU\n6  | 1         | Управление ИТ               | MANAGEMENT\n7  | 6         | Отдел ИТ                    | DEPARTMENT\n8  | 6         | Отдел архитектуры           | DEPARTMENT\n9  | NULL      | ТН - Дальний восток         | HOLDING\n10 | 9         | РНУ                         | MANAGEMENT\n11 | 10        | НПС 1                       | NPS\n12 | 10        | НПС 2                       | NPS\n```\n\nНапример, чтобы получить непосредственных потомков узла:\n\n```sql\nSELECT\n    id,\n    name,\n    type\nFROM org_unit\nWHERE parent_id = 1\nORDER BY sort_order, name;\n```\n\nДля получения всего поддерева можно использовать рекурсивный CTE:\n\n```sql\nWITH RECURSIVE tree AS (\n    SELECT\n        id,\n        parent_id,\n        name,\n        type,\n        0 AS depth\n    FROM org_unit\n    WHERE id = 1\n\n    UNION ALL\n\n    SELECT\n        child.id,\n        child.parent_id,\n        child.name,\n        child.type,\n        tree.depth + 1\n    FROM org_unit child\n    JOIN tree\n        ON child.parent_id = tree.id\n)\nSELECT *\nFROM tree\nORDER BY depth, id;\n```\n\nХранить `level` в самой таблице обычно необязательно: глубину узла можно вычислить при обходе дерева. Отдельное поле `level` имеет смысл добавлять только как денормализованное значение, если это действительно требуется для производительности.\n\nЕсли в одной БД нужно хранить несколько независимых организаций как отдельные бизнес-сущности, можно дополнительно создать таблицу `organization` и добавить в `org_unit` поле `organization_id`.\n\nОсновная идея схемы:\n\n```text\norg_unit\n   │\n   ├── id\n   ├── parent_id ──→ org_unit.id\n   ├── name\n   ├── type\n   └── ...\n```\n\nТакая модель позволяет добавлять новые уровни иерархии без изменения структуры таблиц.\n\n{{< /details >}}"
  filepath = "org-directory-schema"

[[tasks]]
  id = 60
  question = "Спроектировать схему БД для состава изделия (BOM)  "
  answer = "**Условие задачи:**  \nНеобходимо спроектировать схему БД для хранения состава изделия — BOM (`Bill of Materials`).\n\nПример структуры:\n\n```text\nДатчик\n  Корпус — 1 шт\n    Винт — 8 шт\n  Винт — 4 шт\n```\n\nНеобходимо:\n\n- хранить единый справочник изделий и деталей;\n    \n- хранить связи «изделие → компонент»;\n    \n- указывать количество компонента, необходимое для сборки;\n    \n- поддерживать вложенную структуру произвольной глубины;\n    \n- позволять одной и той же детали использоваться в разных изделиях и на разных уровнях.\n    \n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Раздели нормативно-справочную информацию и структуру изделия.  \n💡 В таблице `items` храни сами изделия и детали.  \n💡 В таблице `bom` храни связь «родительское изделие → компонент» и количество.  \n💡 Уровень вложенности хранить необязательно — его можно определить при рекурсивном обходе BOM.  \n💡 Одна и та же запись из `items` может встречаться во множестве строк `bom`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nДля базовой модели достаточно двух таблиц:\n\n```sql\nCREATE TABLE items (\n    id BIGSERIAL PRIMARY KEY,\n    name VARCHAR(255) NOT NULL,\n    item_code VARCHAR(50) UNIQUE,\n    item_type VARCHAR(50),\n    unit VARCHAR(20) NOT NULL DEFAULT 'шт',\n    is_active BOOLEAN NOT NULL DEFAULT TRUE\n);\n\nCREATE TABLE bom (\n    id BIGSERIAL PRIMARY KEY,\n    parent_item_id BIGINT NOT NULL\n        REFERENCES items(id),\n    component_item_id BIGINT NOT NULL\n        REFERENCES items(id),\n    quantity NUMERIC(12, 3) NOT NULL\n        CHECK (quantity > 0),\n    position INT,\n\n    CHECK (parent_item_id <> component_item_id)\n);\n```\n\n`items` — единый справочник номенклатуры:\n\n```text\nid | name    | item_type\n---+---------+----------\n1  | Датчик  | ASSEMBLY\n2  | Корпус  | ASSEMBLY\n3  | Винт    | PART\n```\n\n`bom` описывает непосредственный состав каждого изделия:\n\n```text\nid | parent_item_id | component_item_id | quantity\n---+----------------+-------------------+---------\n1  | 1              | 2                 | 1\n2  | 1              | 3                 | 4\n3  | 2              | 3                 | 8\n```\n\nНапример:\n\n```sql\nINSERT INTO bom (\n    parent_item_id,\n    component_item_id,\n    quantity,\n    position\n)\nVALUES\n    (1, 2, 1, 1), -- Датчик -> Корпус: 1 шт\n    (1, 3, 4, 2), -- Датчик -> Винт: 4 шт\n    (2, 3, 8, 1); -- Корпус -> Винт: 8 шт\n```\n\nОдна и та же деталь `Винт` хранится в `items` только один раз, но может использоваться в разных строках `bom` с разным количеством.\n\nСвязи выглядят так:\n\n```text\nitems\n  1 Датчик\n       │\n       ├── 1 × Корпус ─── 8 × Винт\n       │\n       └── 4 × Винт\n```\n\nПоле `level` хранить в `bom` обычно не нужно. Уровень зависит не от самой связи, а от пути, по которому мы пришли к компоненту, и вычисляется при рекурсивном обходе.\n\nНапример, получить всё дерево изделия в PostgreSQL можно через рекурсивный CTE:\n\n```sql\nWITH RECURSIVE product_tree AS (\n    SELECT\n        b.parent_item_id,\n        b.component_item_id,\n        b.quantity,\n        1 AS depth\n    FROM bom b\n    WHERE b.parent_item_id = 1\n\n    UNION ALL\n\n    SELECT\n        b.parent_item_id,\n        b.component_item_id,\n        pt.quantity * b.quantity,\n        pt.depth + 1\n    FROM bom b\n    JOIN product_tree pt\n        ON b.parent_item_id = pt.component_item_id\n)\nSELECT\n    i.id,\n    i.name,\n    pt.quantity,\n    pt.depth\nFROM product_tree pt\nJOIN items i\n    ON i.id = pt.component_item_id;\n```\n\nДля быстрого поиска компонентов и обратного поиска изделий, в которых используется деталь, полезны индексы:\n\n```sql\nCREATE INDEX idx_bom_parent\n    ON bom (parent_item_id);\n\nCREATE INDEX idx_bom_component\n    ON bom (component_item_id);\n```\n\nИтого:\n\n```text\nitems 1 ─── N bom N ─── 1 items\n        parent      component\n```\n\n`items` отвечает на вопрос «что это за изделие или деталь», а `bom` — «из каких компонентов и в каком количестве оно состоит».\n\n{{< /details >}}"
  filepath = "bom-products-schema"

[[tasks]]
  id = 61
  question = "Найти пользователей, которые летали только эконом-классом  "
  answer = "**Условие задачи:**  \nДана таблица `tickets` с информацией о билетах пользователей.\n\nНеобходимо вывести уникальные `user_id` пользователей, у которых **все билеты имеют класс `ECONOMY`**.\n\nЕсли у пользователя есть хотя бы один билет другого класса, например `BUSINESS`, такой пользователь не должен попасть в результат.\n\n**Данные:**\n\n```text\nticket_id | user_id | ticket_type | price\n----------+---------+-------------+------\n110       | 500     | ECONOMY     | 10000\n220       | 600     | BUSINESS    | 35000\n330       | 600     | ECONOMY     | 15000\n440       | 750     | ECONOMY     | 12000\n550       | 800     | BUSINESS    | 40000\n660       | 750     | ECONOMY     | 5000\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй билеты по `user_id`.  \n💡 Посчитай общее количество билетов пользователя.  \n💡 Отдельно посчитай количество билетов класса `ECONOMY`.  \n💡 Пользователь подходит, только если эти два количества равны.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновной вариант через `GROUP BY` и `HAVING`:\n\n```sql\nSELECT\n    user_id\nFROM tickets\nGROUP BY user_id\nHAVING COUNT(*) =\n       COUNT(CASE\n                 WHEN ticket_type = 'ECONOMY' THEN 1\n             END);\n```\n\nДля каждого пользователя:\n\n```sql\nCOUNT(*)\n```\n\nсчитает все его билеты, а:\n\n```sql\nCOUNT(CASE\n          WHEN ticket_type = 'ECONOMY' THEN 1\n      END)\n```\n\nсчитает только билеты класса `ECONOMY`.\n\nЕсли значения равны, значит у пользователя нет билетов другого класса.\n\nАльтернативный вариант через `NOT EXISTS`:\n\n```sql\nSELECT DISTINCT\n    t.user_id\nFROM tickets t\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM tickets other\n    WHERE other.user_id = t.user_id\n      AND (\n          other.ticket_type <> 'ECONOMY'\n          OR other.ticket_type IS NULL\n      )\n);\n```\n\nЗдесь из результата исключается пользователь, если у него существует хотя бы один билет, который не является `ECONOMY`.\n\nДля приведённых данных результат:\n\n```text\nuser_id\n-------\n500\n750\n```\n\nПользователь `600` не подходит, поскольку у него есть билет `BUSINESS`, а пользователь `800` вообще не имеет билетов `ECONOMY`.\n\n{{< /details >}}"
  filepath = "users-only-economy"

[[tasks]]
  id = 62
  question = "Найти минимальную и максимальную зарплату по отделам среди неуволенных сотрудников  "
  answer = "**Условие задачи:**  \nДаны таблицы:\n\n- `units` — подразделения компании;\n    \n- `employees` — сотрудники компании.\n    \n\nНеобходимо для каждого подразделения, в котором есть неуволенные сотрудники, вывести:\n\n- `unit_id`;\n    \n- минимальную зарплату — `min_salary`;\n    \n- максимальную зарплату — `max_salary`.\n    \n\nУчитывать нужно только сотрудников с `fired = false`.\n\n**Код:**\n\n```text\nunits:\n  id       -- primary key\n  name     -- название подразделения\n\nemployees:\n  id       -- primary key\n  unit_id  -- foreign key -> units.id\n  salary   -- зарплата\n  fired    -- флаг увольнения (true / false)\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала оставь только сотрудников с `fired = false`.  \n💡 Затем сгруппируй их по `unit_id`.  \n💡 Для поиска минимальной и максимальной зарплаты используй `MIN()` и `MAX()`.  \n💡 Если нужен только `unit_id`, соединение с таблицей `units` не требуется.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    unit_id,\n    MIN(salary) AS min_salary,\n    MAX(salary) AS max_salary\nFROM employees\nWHERE fired = false\nGROUP BY unit_id;\n```\n\nУсловие:\n\n```sql\nWHERE fired = false\n```\n\nисключает уволенных сотрудников до выполнения группировки.\n\nЗатем:\n\n```sql\nGROUP BY unit_id\n```\n\nформирует отдельную группу для каждого подразделения, а `MIN()` и `MAX()` вычисляют минимальную и максимальную зарплату внутри этой группы.\n\nЕсли дополнительно нужно вывести название подразделения:\n\n```sql\nSELECT\n    u.id AS unit_id,\n    u.name AS unit_name,\n    MIN(e.salary) AS min_salary,\n    MAX(e.salary) AS max_salary\nFROM units u\nJOIN employees e\n    ON e.unit_id = u.id\n   AND e.fired = false\nGROUP BY\n    u.id,\n    u.name;\n```\n\nЕсли необходимо показывать также подразделения, в которых нет неуволенных сотрудников, вместо `JOIN` следует использовать `LEFT JOIN`. Для таких подразделений `min_salary` и `max_salary` будут равны `NULL`.\n\n{{< /details >}}"
  filepath = "min-max-salary-by-unit-active"

[[tasks]]
  id = 63
  question = "Найти департаменты без сотрудников"
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `Department(id, name)` — департаменты;\n    \n- `Employee(id, salary, department_id)` — сотрудники.\n    \n\nНеобходимо вывести все департаменты, в которых нет ни одного сотрудника.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Удобно использовать `NOT EXISTS`: для каждого департамента проверить отсутствие связанных сотрудников.  \n💡 Альтернативный вариант — `LEFT JOIN` с последующей проверкой, что соответствующая строка сотрудника не найдена.  \n💡 `INNER JOIN` здесь не подходит, поскольку он исключит департаменты без сотрудников.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновной вариант через `NOT EXISTS`:\n\n```sql\nSELECT\n    d.id,\n    d.name\nFROM Department d\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM Employee e\n    WHERE e.department_id = d.id\n);\n```\n\nДля каждого департамента подзапрос ищет хотя бы одного связанного сотрудника:\n\n```sql\nWHERE e.department_id = d.id\n```\n\n`NOT EXISTS` оставляет только те департаменты, для которых такой сотрудник не найден.\n\nАльтернативный вариант через `LEFT JOIN`:\n\n```sql\nSELECT\n    d.id,\n    d.name\nFROM Department d\nLEFT JOIN Employee e\n    ON e.department_id = d.id\nWHERE e.department_id IS NULL;\n```\n\n`LEFT JOIN` сохраняет все департаменты. Если сотрудников в департаменте нет, соответствующей строки из `Employee` не будет, поэтому поля этой таблицы окажутся `NULL`.\n\nОба варианта решают задачу, но `NOT EXISTS` особенно хорошо отражает её смысл: выбрать департаменты, для которых не существует ни одного сотрудника.\n\n{{< /details >}}\n"
  filepath = "departments-without-employees"

[[tasks]]
  id = 64
  question = "Найти отделы со средней зарплатой выше 90"
  answer = "**Условие задачи:**  \nДаны таблицы `department` и `employee`.\n\nНеобходимо вывести отделы, в которых средняя зарплата сотрудников больше `90`.\n\nДля каждого такого отдела нужно показать:\n\n- название отдела;\n    \n- количество сотрудников.\n    \n\nРезультат отсортировать по названию отдела в алфавитном порядке.\n\n**Код:**\n\n```sql\nCREATE TABLE department (\n    id INTEGER NOT NULL,\n    name VARCHAR(128) NOT NULL,\n    PRIMARY KEY (id)\n);\n\nCREATE TABLE employee (\n    id INTEGER NOT NULL,\n    department_id INTEGER NOT NULL,\n    manager_id INTEGER,\n    name VARCHAR(128) NOT NULL,\n    salary DECIMAL NOT NULL,\n    PRIMARY KEY (id),\n    FOREIGN KEY (department_id) REFERENCES department(id),\n    FOREIGN KEY (manager_id) REFERENCES employee(id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини сотрудников с отделами по `department_id`.  \n💡 Сгруппируй данные по отделу.  \n💡 Для количества сотрудников используй `COUNT()`.  \n💡 Условие на среднюю зарплату после группировки задаётся через `HAVING`.  \n💡 Для алфавитной сортировки используй `ORDER BY d.name`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    d.name AS department_name,\n    COUNT(e.id) AS employee_count\nFROM department d\nJOIN employee e\n    ON e.department_id = d.id\nGROUP BY\n    d.id,\n    d.name\nHAVING AVG(e.salary) > 90\nORDER BY d.name;\n```\n\nСначала сотрудники соединяются со своими отделами:\n\n```sql\nJOIN employee e\n    ON e.department_id = d.id\n```\n\nЗатем строки группируются по отделам:\n\n```sql\nGROUP BY\n    d.id,\n    d.name\n```\n\nУсловие:\n\n```sql\nHAVING AVG(e.salary) > 90\n```\n\nоставляет только те отделы, где средняя зарплата сотрудников больше `90`.\n\nПосле этого:\n\n```sql\nORDER BY d.name\n```\n\nсортирует результат по названию отдела в алфавитном порядке.\n\nОбычный `JOIN` здесь подходит, поскольку отдел без сотрудников не имеет средней зарплаты и не может удовлетворить условию `AVG(salary) > 90`.\n\n{{< /details >}}"
  filepath = "departments-avg-salary-gt-90"

[[tasks]]
  id = 65
  question = "Найти департаменты с количеством сотрудников больше трёх  "
  answer = "**Условие задачи:**  \nДаны таблицы `department` и `users`.\n\nНеобходимо вывести департаменты, в которых работает больше трёх сотрудников.\n\nДля каждого такого департамента вывести:\n\n- `department_id`;\n    \n- название департамента;\n    \n- количество сотрудников.\n    \n\n**Код:**\n\n```sql\nCREATE TABLE department (\n    department_id BIGINT PRIMARY KEY,\n    department_name VARCHAR(255)\n);\n\nCREATE TABLE users (\n    user_id BIGINT PRIMARY KEY,\n    full_name VARCHAR(255),\n    department_id BIGINT,\n    CONSTRAINT fk_department\n        FOREIGN KEY (department_id)\n        REFERENCES department(department_id)\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини сотрудников с департаментами по `department_id`.  \n💡 Сгруппируй строки по департаменту.  \n💡 Для подсчёта сотрудников используй `COUNT()`.  \n💡 Условие на количество строк после группировки задаётся через `HAVING`, а не `WHERE`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    d.department_id,\n    d.department_name,\n    COUNT(u.user_id) AS employee_count\nFROM department d\nJOIN users u\n    ON u.department_id = d.department_id\nGROUP BY\n    d.department_id,\n    d.department_name\nHAVING COUNT(u.user_id) > 3;\n```\n\nСначала сотрудники соединяются со своими департаментами:\n\n```sql\nJOIN users u\n    ON u.department_id = d.department_id\n```\n\nПосле этого строки группируются по департаментам:\n\n```sql\nGROUP BY\n    d.department_id,\n    d.department_name\n```\n\n`COUNT(u.user_id)` считает сотрудников в каждом департаменте, а:\n\n```sql\nHAVING COUNT(u.user_id) > 3\n```\n\nоставляет только те департаменты, где работает больше трёх человек.\n\nОбычный `JOIN` здесь подходит, поскольку департаменты без сотрудников в любом случае не удовлетворяют условию `COUNT > 3`.\n\n{{< /details >}}"
  filepath = "departments-more-than-three-users"

[[tasks]]
  id = 66
  question = "Найти профили с количеством постов больше десяти  "
  answer = "**Условие задачи:**  \nДаны таблицы `profile`, `post` и `subscription_count`.\n\nНеобходимо написать SQL-запрос, который выберет профили, у которых опубликовано больше 10 постов.\n\n**Код:**\n\n```sql\nCREATE TABLE profile (\n    id BIGSERIAL PRIMARY KEY,\n    nickname VARCHAR,\n    register_at TIMESTAMP\n);\n\nCREATE TABLE post (\n    id BIGSERIAL PRIMARY KEY,\n    owner_id BIGINT REFERENCES profile(id),\n    body TEXT,\n    inserted_at TIMESTAMP,\n    likes_count INT\n);\n\nCREATE TABLE subscription_count (\n    profile_id BIGINT REFERENCES profile(id) UNIQUE,\n    followers_count INT,\n    following_count INT\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Свяжи профили с постами по `profile.id = post.owner_id`.  \n💡 Сгруппируй записи по профилю.  \n💡 Для подсчёта постов используй `COUNT()`.  \n💡 Условие на количество постов после группировки задаётся через `HAVING`.  \n💡 Таблица `subscription_count` для решения этой задачи не требуется.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    p.id,\n    p.nickname,\n    p.register_at\nFROM profile p\nJOIN post po\n    ON po.owner_id = p.id\nGROUP BY\n    p.id,\n    p.nickname,\n    p.register_at\nHAVING COUNT(po.id) > 10;\n```\n\nСначала профиль соединяется с его постами:\n\n```sql\nJOIN post po\n    ON po.owner_id = p.id\n```\n\nЗатем записи группируются по профилю, а:\n\n```sql\nHAVING COUNT(po.id) > 10\n```\n\nоставляет только профили, у которых больше десяти постов.\n\nЕсли дополнительно нужно вывести количество постов:\n\n```sql\nSELECT\n    p.id,\n    p.nickname,\n    p.register_at,\n    COUNT(po.id) AS post_count\nFROM profile p\nJOIN post po\n    ON po.owner_id = p.id\nGROUP BY\n    p.id,\n    p.nickname,\n    p.register_at\nHAVING COUNT(po.id) > 10;\n```\n\n{{< /details >}}"
  filepath = "profiles-with-more-than-10-posts"

[[tasks]]
  id = 67
  question = "Выбрать сотрудников с начислениями и найти сотрудников с суммой выплат больше 15  "
  answer = "**Условие задачи:**  \nДаны две таблицы:\n\n- `Persons` — список сотрудников;\n    \n- `Payments` — зарплатные начисления сотрудников.\n    \n\nСвязь между таблицами — один ко многим: у одного сотрудника может быть несколько начислений или не быть ни одного.\n\nПример данных:\n\n```text\nPersons\n\nid | name\n---+------\n1  | Petya\n2  | Vasya\n3  | Kolya\n\n\nPayments\n\nid | person_id | value\n---+-----------+------\n1  | 1         | 10\n2  | 1         | 20\n3  | 3         | 15\n```\n\nНеобходимо:\n\n1. Вывести всех сотрудников вместе с их зарплатными начислениями.\n    \n2. Вывести сотрудников, у которых общая сумма начислений больше `15`.\n    \n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 В первой части начинай запрос с `Persons` и используй `LEFT JOIN`, чтобы не потерять сотрудников без начислений.  \n💡 Во второй части сгруппируй начисления по сотруднику.  \n💡 Для подсчёта общей суммы используй `SUM()`.  \n💡 Условие на результат агрегирования задаётся через `HAVING`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n1. Все сотрудники вместе с их начислениями:\n    \n\n```sql\nSELECT\n    p.id,\n    p.name,\n    pay.id AS payment_id,\n    pay.value\nFROM Persons p\nLEFT JOIN Payments pay\n    ON pay.person_id = p.id\nORDER BY p.id, pay.id;\n```\n\nИспользуется `LEFT JOIN`, поэтому в результат попадёт даже сотрудник, у которого пока нет ни одного начисления. Для такого сотрудника поля из `Payments` будут `NULL`.\n\nДля приведённых данных результат будет выглядеть так:\n\n```text\nid | name  | payment_id | value\n---+-------+------------+------\n1  | Petya | 1          | 10\n1  | Petya | 2          | 20\n2  | Vasya | NULL       | NULL\n3  | Kolya | 3          | 15\n```\n\n2. Сотрудники, у которых сумма начислений больше `15`:\n    \n\n```sql\nSELECT\n    p.id,\n    p.name,\n    SUM(pay.value) AS total_payments\nFROM Persons p\nJOIN Payments pay\n    ON pay.person_id = p.id\nGROUP BY\n    p.id,\n    p.name\nHAVING SUM(pay.value) > 15;\n```\n\nСначала начисления группируются по сотруднику, после чего:\n\n```sql\nSUM(pay.value)\n```\n\nвычисляет их общую сумму, а:\n\n```sql\nHAVING SUM(pay.value) > 15\n```\n\nоставляет только сотрудников, у которых она строго больше `15`.\n\nДля приведённых данных в результат попадёт только:\n\n```text\nid | name  | total_payments\n---+-------+---------------\n1  | Petya | 30\n```\n\n`Kolya` не попадает в результат, потому что его сумма начислений равна `15`, а по условию требуется значение строго больше `15`.\n\n{{< /details >}}"
  filepath = "sql-employees-payments-sum"

[[tasks]]
  id = 68
  question = "Посчитать общую сумму продаж по каждому продавцу  "
  answer = "**Условие задачи:**  \nДаны таблицы `Salespersons`, `Customers` и `Orders`.\n\nНеобходимо написать SQL-запрос, который:\n\n- выводит идентификаторы всех продавцов;\n    \n- считает общую сумму заказов клиентов каждого продавца;\n    \n- включает продавцов, у которых нет клиентов или заказов;\n    \n- для продавцов без заказов возвращает сумму `0`;\n    \n- сортирует результат по `id` продавца.\n    \n\n**Код:**\n\n```sql\nCREATE TABLE Salespersons (\n    id SERIAL PRIMARY KEY,\n    name VARCHAR(20)\n);\n\nCREATE TABLE Customers (\n    id SERIAL PRIMARY KEY,\n    salesperson_id INT\n);\n\nCREATE TABLE Orders (\n    id SERIAL PRIMARY KEY,\n    customer_id INT,\n    price INT\n);\n\nTRUNCATE Orders;\n\nINSERT INTO Orders (customer_id, price)\nVALUES\n    (8, 2480),\n    (6, 654),\n    (13, 2938),\n    (4, 2071),\n    (4, 2412),\n    (1, 236),\n    (17, 2514),\n    (18, 849),\n    (7, 925),\n    (10, 93),\n    (14, 449),\n    (15, 923),\n    (14, 160),\n    (1, 1978),\n    (14, 2903),\n    (13, 2093),\n    (14, 2429),\n    (12, 1058),\n    (18, 2342),\n    (19, 484),\n    (4, 1040),\n    (14, 2346),\n    (19, 239),\n    (14, 2253),\n    (20, 510),\n    (12, 497),\n    (6, 1638),\n    (9, 1088),\n    (6, 1766),\n    (2, 1548);\n\nINSERT INTO Salespersons (name)\nVALUES\n    ('Stephanie'),\n    ('Rebecca'),\n    ('Deborah'),\n    ('Jordan'),\n    ('Veronica'),\n    ('Marisa'),\n    ('Deanna'),\n    ('Emma'),\n    ('Julie'),\n    ('Maria');\n\nINSERT INTO Customers (salesperson_id)\nVALUES\n    (5),\n    (4),\n    (8),\n    (10),\n    (3),\n    (1),\n    (6),\n    (2),\n    (1),\n    (4),\n    (4),\n    (5),\n    (8),\n    (8),\n    (10),\n    (5),\n    (3),\n    (1),\n    (6),\n    (3);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Начинай запрос с `Salespersons`, чтобы сохранить всех продавцов.  \n💡 Соедини продавцов с клиентами, а клиентов — с заказами.  \n💡 Используй `LEFT JOIN`, чтобы не потерять продавцов без клиентов или заказов.  \n💡 Общую сумму посчитай через `SUM(o.price)`.  \n💡 Для продавцов без заказов `SUM()` вернёт `NULL`, поэтому используй `COALESCE()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    s.id AS salesperson_id,\n    COALESCE(SUM(o.price), 0) AS total_sales\nFROM Salespersons s\nLEFT JOIN Customers c\n    ON c.salesperson_id = s.id\nLEFT JOIN Orders o\n    ON o.customer_id = c.id\nGROUP BY s.id\nORDER BY s.id;\n```\n\nСначала продавцы соединяются со своими клиентами:\n\n```sql\nLEFT JOIN Customers c\n    ON c.salesperson_id = s.id\n```\n\nЗатем клиенты соединяются со своими заказами:\n\n```sql\nLEFT JOIN Orders o\n    ON o.customer_id = c.id\n```\n\n`LEFT JOIN` нужен на обоих этапах, чтобы в результате остались даже продавцы, у которых нет клиентов или у клиентов нет заказов.\n\nОбщая сумма продаж рассчитывается через:\n\n```sql\nSUM(o.price)\n```\n\nДля продавца без заказов `SUM()` вернёт `NULL`, поэтому:\n\n```sql\nCOALESCE(SUM(o.price), 0)\n```\n\nзаменяет его на `0`.\n\nПосле группировки по продавцу:\n\n```sql\nGROUP BY s.id\n```\n\nкаждая строка результата соответствует одному продавцу, а:\n\n```sql\nORDER BY s.id\n```\n\nсортирует результат по его идентификатору.\n\n{{< /details >}}"
  filepath = "salesperson-total-sales-sql"

[[tasks]]
  id = 69
  question = "Найти учеников с одинаковыми именем и фамилией  "
  answer = "**Условие задачи:**  \nДана таблица `Students`, содержащая данные об учениках.\n\nНеобходимо найти учеников, у которых одновременно совпадают:\n\n- `name`;\n    \n- `surname`.\n    \n\nДля каждой такой пары нужно вывести:\n\n- имя;\n    \n- фамилию;\n    \n- количество повторений.\n    \n\nВ результат должны попасть только те пары `name` и `surname`, которые встречаются более одного раза.\n\n**Код:**\n\n```sql\n-- Нужно найти учеников, у которых одинаковые name и surname,\n-- и вывести имя, фамилию и количество повторений.\n```\n\nПример:\n\n```text\nStudents:\n('Иван', 'Иванов')\n('Петр', 'Петров')\n('Иван', 'Иванов')\n```\n\nРезультат:\n\n```text\nname | surname | repeat_count\n-----+---------+-------------\nИван | Иванов  | 2\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй записи одновременно по `name` и `surname`.  \n💡 Для каждой группы посчитай количество строк через `COUNT(*)`.  \n💡 Условие на количество записей после группировки задаётся через `HAVING`.  \n💡 Оставь только группы, где количество больше одного.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    name,\n    surname,\n    COUNT(*) AS repeat_count\nFROM Students\nGROUP BY\n    name,\n    surname\nHAVING COUNT(*) > 1\nORDER BY\n    surname,\n    name;\n```\n\nГруппировка:\n\n```sql\nGROUP BY\n    name,\n    surname\n```\n\nобъединяет учеников с одинаковыми именем и фамилией.\n\nЗатем:\n\n```sql\nCOUNT(*)\n```\n\nподсчитывает количество записей в каждой группе, а:\n\n```sql\nHAVING COUNT(*) > 1\n```\n\nоставляет только повторяющиеся пары.\n\nНапример, если в таблице три раза встречается `('Анна', 'Смирнова')`, результат будет:\n\n```text\nname | surname  | repeat_count\n-----+----------+-------------\nАнна | Смирнова | 3\n```\n\n{{< /details >}}"
  filepath = "find-duplicate-students-by-name"

[[tasks]]
  id = 70
  question = "Оптимизировать частый запрос заказов пользователя  "
  answer = "**Условие задачи:**  \nВ системе часто выполняется запрос к таблице `orders`. При его выполнении наблюдается высокая нагрузка на диск.\n\nНеобходимо объяснить, как оптимизировать запрос и уменьшить количество операций чтения.\n\n**Код:**\n\n```sql\nSELECT\n    status,\n    created_at\nFROM orders\nWHERE user_id = :userId\n  AND created_at >= now() - interval '30 days'\nORDER BY created_at DESC\nLIMIT 20;\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Индекс должен учитывать одновременно фильтрацию по `user_id`, диапазон по `created_at` и сортировку по дате.  \n💡 Здесь подходит составной индекс `(user_id, created_at DESC)`.  \n💡 Благодаря `LIMIT 20` СУБД сможет остановить чтение после нахождения первых подходящих строк.  \n💡 В PostgreSQL можно добавить `status` через `INCLUDE`, чтобы создать покрывающий индекс.  \n💡 Реальный эффект нужно проверить через `EXPLAIN (ANALYZE, BUFFERS)`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОсновная оптимизация — создать составной индекс:\n\n```sql\nCREATE INDEX idx_orders_user_created_at\n    ON orders (user_id, created_at DESC);\n```\n\nТакой индекс хорошо соответствует запросу:\n\n```text\nuser_id = ...         → точное условие\ncreated_at >= ...     → диапазон\nORDER BY created_at   → порядок внутри user_id\nLIMIT 20              → нужны только первые 20 строк\n```\n\nСУБД может быстро найти записи конкретного пользователя и читать их начиная с самых свежих, вместо сканирования большого количества строк и отдельной сортировки.\n\nДля PostgreSQL можно сделать покрывающий индекс:\n\n```sql\nCREATE INDEX idx_orders_user_created_at_cover\n    ON orders (user_id, created_at DESC)\n    INCLUDE (status);\n```\n\nВсе данные, необходимые запросу, тогда находятся в индексе:\n\n- `user_id`;\n    \n- `created_at`;\n    \n- `status`.\n    \n\nЭто создаёт возможность для `Index Only Scan`, то есть чтения результата непосредственно из индекса без обращения к основной таблице.\n\nОднако `Index Only Scan` не гарантирован: в PostgreSQL он также зависит от состояния visibility map и активности изменений в таблице.\n\nПроверять результат оптимизации лучше так:\n\n```sql\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT\n    status,\n    created_at\nFROM orders\nWHERE user_id = :userId\n  AND created_at >= now() - interval '30 days'\nORDER BY created_at DESC\nLIMIT 20;\n```\n\nСтоит обратить внимание на:\n\n- `Index Scan` или `Index Only Scan`;\n    \n- отсутствие лишней операции `Sort`;\n    \n- количество прочитанных страниц (`shared read`);\n    \n- фактическое количество обработанных строк;\n    \n- время выполнения.\n    \n\nЕсли таблица очень большая, дополнительно можно рассмотреть партиционирование по `created_at`, особенно если большинство запросов работают только с ограниченным диапазоном дат. Но начинать оптимизацию следует именно с подходящего составного индекса и проверки плана выполнения.\n\n{{< /details >}}"
  filepath = "orders-recent-by-user-optimization"

[[tasks]]
  id = 71
  question = "Найти вторых пилотов, летавших в New York в августе 2023  "
  answer = "**Условие задачи:**  \nДаны таблицы `pilots`, `planes` и `flights`.\n\nНеобходимо вывести имена пилотов, которые в качестве **второго пилота** летали в `New York` в августе 2023 года.\n\nРезультат должен содержать только поле `name`, без дубликатов.\n\nВ описании таблицы `flights` отсутствует поле `second_pilot_id`, хотя оно используется в условии задачи. Будем считать, что это поле есть и ссылается на `pilots.pilot_id`.\n\n**Код:**\n\n```text\npilots\n- pilot_id (PK)\n- name\n- age\n\nplanes\n- plane_id (PK)\n- plane_name\n- capacity\n- cargo_flag\n\nflights\n- flight_id (PK)\n- flight_date (DATE)\n- plane_id -> planes.plane_id\n- first_pilot_id -> pilots.pilot_id\n- second_pilot_id -> pilots.pilot_id\n- destination\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Соедини `flights` с `pilots` по `second_pilot_id`.  \n💡 Отфильтруй рейсы с `destination = 'New York'`.  \n💡 Для августа 2023 удобно использовать полуинтервал дат: от `2023-08-01` включительно до `2023-09-01` не включительно.  \n💡 Чтобы один пилот не выводился несколько раз, используй `DISTINCT`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT DISTINCT\n    p.name\nFROM flights f\nJOIN pilots p\n    ON p.pilot_id = f.second_pilot_id\nWHERE f.destination = 'New York'\n  AND f.flight_date >= DATE '2023-08-01'\n  AND f.flight_date < DATE '2023-09-01';\n```\n\nСоединение:\n\n```sql\nJOIN pilots p\n    ON p.pilot_id = f.second_pilot_id\n```\n\nпозволяет получить данные именно о втором пилоте каждого рейса.\n\nДиапазон:\n\n```sql\nf.flight_date >= DATE '2023-08-01'\nAND f.flight_date < DATE '2023-09-01'\n```\n\nвыбирает все рейсы за август 2023 года.\n\n`DISTINCT` нужен, чтобы пилот, совершивший несколько подходящих рейсов, появился в результате только один раз.\n\nТаблица `planes` для решения этой задачи не требуется, поскольку никаких условий по самолёту в запросе нет.\n\n{{< /details >}}"
  filepath = "second-pilot-new-york-sql"

[[tasks]]
  id = 72
  question = "Получить среднюю сумму транзакций по счетам клиентов  "
  answer = "**Условие задачи:**  \nДаны таблицы `Customer`, `Account` и `Fin_Transaction`.\n\nНеобходимо вывести:\n\n- имя клиента;\n    \n- описание его лицевого счёта;\n    \n- среднюю сумму транзакций по этому счёту.\n    \n\nПри этом:\n\n- у клиента может не быть ни одного счёта;\n    \n- у счёта может не быть ни одной транзакции.\n    \n\n**Код:**\n\n```text\nCustomer\n-----------------\nId\nName\nAddress\n\nAccount\n-----------------\nId\nAcc_Number\nDescription\nCustomer_Id\n\nFin_Transaction\n-----------------\nId\nTransactDate\nAmount\nAccount_Id\nDescription\n```\n\nСвязи между таблицами:\n\n```text\nAccount.Customer_Id → Customer.Id\nFin_Transaction.Account_Id → Account.Id\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Начинай запрос с таблицы `Customer`, чтобы сохранить всех клиентов.  \n💡 Используй `LEFT JOIN` с `Account`, чтобы не потерять клиентов без счетов.  \n💡 Соединение с `Fin_Transaction` также должно быть через `LEFT JOIN`, чтобы сохранить счета без транзакций.  \n💡 Среднюю сумму вычисли через `AVG()`.  \n💡 Группируй также по идентификаторам клиента и счёта, чтобы записи с одинаковыми именами или описаниями не объединялись.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    c.Name AS customer_name,\n    a.Description AS account_description,\n    AVG(ft.Amount) AS average_transaction_amount\nFROM Customer c\nLEFT JOIN Account a\n    ON a.Customer_Id = c.Id\nLEFT JOIN Fin_Transaction ft\n    ON ft.Account_Id = a.Id\nGROUP BY\n    c.Id,\n    c.Name,\n    a.Id,\n    a.Description;\n```\n\nПервый `LEFT JOIN`:\n\n```sql\nLEFT JOIN Account a\n    ON a.Customer_Id = c.Id\n```\n\nсохраняет в результате клиента, даже если у него нет ни одного счёта.\n\nВторой `LEFT JOIN`:\n\n```sql\nLEFT JOIN Fin_Transaction ft\n    ON ft.Account_Id = a.Id\n```\n\nсохраняет счёт, даже если по нему ещё не было транзакций.\n\nСредняя сумма рассчитывается через:\n\n```sql\nAVG(ft.Amount)\n```\n\nЕсли у счёта нет транзакций, `AVG()` вернёт `NULL`.\n\nГруппировка выполняется отдельно для каждого клиента и каждого счёта:\n\n```sql\nGROUP BY\n    c.Id,\n    c.Name,\n    a.Id,\n    a.Description\n```\n\nЭто не позволяет объединить разных клиентов с одинаковыми именами или разные счета с одинаковыми описаниями.\n\nДля клиента без счетов в результате будет одна строка, где `account_description` и `average_transaction_amount` равны `NULL`.\n\n{{< /details >}}"
  filepath = "customer-account-average-transaction"

[[tasks]]
  id = 73
  question = "Найти сотрудников с максимальной зарплатой в каждом отделе  "
  answer = "**Условие задачи:**  \nДаны таблицы `Department` и `Employee`.\n\nНеобходимо вывести `id` и `name` сотрудников, которые получают максимальную зарплату в своём отделе.\n\nЕсли несколько сотрудников в одном отделе получают одинаковую максимальную зарплату, нужно вывести их всех.\n\n**Код:**\n\n```text\nDepartment\n-----------------\nid\nname\n\nEmployee\n-----------------\nid\ndepartment_id\nname\nsalary\n```\n\nСвязь между таблицами:\n\n```text\nEmployee.department_id → Department.id\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Максимальную зарплату нужно вычислить отдельно для каждого `department_id`.  \n💡 Удобно использовать оконную функцию `MAX() OVER (PARTITION BY ...)`.  \n💡 Затем сравни зарплату сотрудника с максимальной зарплатой его отдела.  \n💡 Таблица `Department` не требуется, поскольку нужно вывести только данные сотрудников.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через оконную функцию:\n\n```sql\nSELECT\n    id,\n    name\nFROM (\n    SELECT\n        id,\n        name,\n        salary,\n        MAX(salary) OVER (\n            PARTITION BY department_id\n        ) AS max_salary\n    FROM Employee\n) e\nWHERE salary = max_salary;\n```\n\nВыражение:\n\n```sql\nMAX(salary) OVER (\n    PARTITION BY department_id\n)\n```\n\nвычисляет максимальную зарплату отдельно внутри каждого отдела, не объединяя строки сотрудников.\n\nПосле этого условие:\n\n```sql\nWHERE salary = max_salary\n```\n\nоставляет только сотрудников, чья зарплата равна максимальной зарплате их отдела.\n\nЕсли максимальную зарплату получают несколько сотрудников, запрос вернёт их всех.\n\nАльтернативный вариант через коррелированный подзапрос:\n\n```sql\nSELECT\n    e.id,\n    e.name\nFROM Employee e\nWHERE e.salary = (\n    SELECT MAX(e2.salary)\n    FROM Employee e2\n    WHERE e2.department_id = e.department_id\n);\n```\n\nВ обоих вариантах таблица `Department` не нужна, поскольку `department_id` уже хранится в `Employee`, а название отдела выводить не требуется.\n\n{{< /details >}}"
  filepath = "employees-max-salary-by-department"

[[tasks]]
  id = 74
  question = "Вывести максимальный возраст для каждого имени  "
  answer = "**Условие задачи:**  \nДана таблица `Person` с полями:\n\n- `name`;\n    \n- `age`.\n    \n\nНеобходимо для каждого имени вывести максимальный возраст.\n\n**Код:**\n\n```text\nPerson\n-----------------\nname\nage\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй строки по `name`.  \n💡 Для поиска максимального возраста внутри каждой группы используй `MAX(age)`.  \n💡 Поле `name` должно присутствовать в `GROUP BY`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    name,\n    MAX(age) AS max_age\nFROM Person\nGROUP BY name;\n```\n\n`GROUP BY name` объединяет строки с одинаковыми именами, а:\n\n```sql\nMAX(age)\n```\n\nвозвращает максимальный возраст внутри каждой группы.\n\nНапример, для данных:\n\n```text\nname | age\n-----+----\nIvan | 20\nIvan | 35\nPetr | 25\nPetr | 40\n```\n\nрезультат будет:\n\n```text\nname | max_age\n-----+--------\nIvan | 35\nPetr | 40\n```\n\n{{< /details >}}"
  filepath = "person-max-age-by-name"

[[tasks]]
  id = 75
  question = "Найти дублирующиеся комбинации имени и возраста  "
  answer = "**Условие задачи:**  \nДана таблица `Person` с полями:\n\n- `name`;\n    \n- `age`.\n    \n\nНеобходимо вывести комбинации `name` и `age`, которые встречаются в таблице более одного раза.\n\nДля каждой такой комбинации также нужно вывести количество повторений.\n\n**Код:**\n\n```text\nPerson\n-----------------\nname\nage\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй строки одновременно по `name` и `age`.  \n💡 Для каждой группы посчитай количество строк через `COUNT(*)`.  \n💡 Для фильтрации результатов группировки используй `HAVING`.  \n💡 Дубликатом считается комбинация, которая встречается больше одного раза.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```sql\nSELECT\n    name,\n    age,\n    COUNT(*) AS duplicate_count\nFROM Person\nGROUP BY\n    name,\n    age\nHAVING COUNT(*) > 1;\n```\n\nГруппировка:\n\n```sql\nGROUP BY\n    name,\n    age\n```\n\nобъединяет строки с одинаковой парой значений `name` и `age`.\n\nЗатем:\n\n```sql\nHAVING COUNT(*) > 1\n```\n\nоставляет только те группы, которые встречаются более одного раза.\n\nНапример, для данных:\n\n```text\nname | age\n-----+----\nIvan | 20\nIvan | 20\nIvan | 30\nPetr | 25\nPetr | 25\n```\n\nрезультат будет:\n\n```text\nname | age | duplicate_count\n-----+-----+----------------\nIvan | 20  | 2\nPetr | 25  | 2\n```\n\n{{< /details >}}"
  filepath = "person-name-age-duplicates"

[[tasks]]
  id = 76
  question = "Оптимизировать запрос к большой таблице orders  "
  answer = "**Условие задачи:**  \nВ PostgreSQL есть таблица `orders`, содержащая миллионы записей.\n\nЗапрос:\n\n- фильтрует заказы по `status`;\n    \n- выбирает записи за заданный диапазон дат;\n    \n- сортирует их по `created_at` в порядке убывания;\n    \n- возвращает первые 100 строк.\n    \n\nНеобходимо определить причину медленной работы запроса и предложить оптимизацию.\n\n**Код:**\n\n```sql\nCREATE TABLE orders (\n    id SERIAL PRIMARY KEY,\n    user_id INT NOT NULL,\n    status VARCHAR(50) NOT NULL,\n    created_at TIMESTAMP NOT NULL,\n    total_amount DECIMAL(10, 2) NOT NULL\n);\n```\n\n```sql\nSELECT *\nFROM orders\nWHERE status = 'COMPLETED'\n  AND created_at BETWEEN '2024-01-01' AND '2024-01-31'\nORDER BY created_at DESC\nLIMIT 100;\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для начала проверь план выполнения через `EXPLAIN (ANALYZE, BUFFERS)`.  \n💡 Индекс должен учитывать точное условие по `status` и диапазон по `created_at`.  \n💡 Составной индекс `(status, created_at DESC)` также помогает получить строки сразу в нужном порядке.  \n💡 Для диапазона по `TIMESTAMP` лучше использовать полуоткрытый интервал: `>=` начало периода и `<` начало следующего периода.  \n💡 Если запросы почти всегда выполняются только для `status = 'COMPLETED'`, можно рассмотреть частичный индекс.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nДля такого запроса подходит составной индекс:\n\n```sql\nCREATE INDEX idx_orders_status_created_at\n    ON orders (status, created_at DESC);\n```\n\nВ индексе сначала идёт `status`, по которому используется точное сравнение:\n\n```sql\nstatus = 'COMPLETED'\n```\n\nПосле него расположен `created_at`, по которому одновременно выполняются диапазонная фильтрация и сортировка:\n\n```sql\ncreated_at >= ...\ncreated_at < ...\nORDER BY created_at DESC\n```\n\nБлагодаря этому PostgreSQL может читать подходящие строки уже в нужном порядке и остановиться после получения первых `100` записей.\n\nСам запрос лучше записать через полуоткрытый диапазон:\n\n```sql\nSELECT *\nFROM orders\nWHERE status = 'COMPLETED'\n  AND created_at >= TIMESTAMP '2024-01-01'\n  AND created_at < TIMESTAMP '2024-02-01'\nORDER BY created_at DESC\nLIMIT 100;\n```\n\nИсходное условие:\n\n```sql\ncreated_at BETWEEN '2024-01-01' AND '2024-01-31'\n```\n\nдля поля `TIMESTAMP` эквивалентно верхней границе около:\n\n```text\n2024-01-31 00:00:00\n```\n\nпоэтому записи позднее полуночи 31 января не попадут в результат.\n\nЕсли запросы часто выполняются именно для `COMPLETED`, можно использовать более компактный частичный индекс:\n\n```sql\nCREATE INDEX idx_orders_completed_created_at\n    ON orders (created_at DESC)\n    WHERE status = 'COMPLETED';\n```\n\nОн содержит только завершённые заказы и поэтому может занимать меньше места и требовать меньше чтений.\n\nПроверить результат оптимизации можно так:\n\n```sql\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT *\nFROM orders\nWHERE status = 'COMPLETED'\n  AND created_at >= TIMESTAMP '2024-01-01'\n  AND created_at < TIMESTAMP '2024-02-01'\nORDER BY created_at DESC\nLIMIT 100;\n```\n\nВ плане стоит проверить:\n\n- используется ли `Index Scan`;\n    \n- отсутствует ли лишняя операция `Sort`;\n    \n- сколько строк реально просматривается до получения `LIMIT 100`;\n    \n- сколько страниц пришлось прочитать с диска.\n    \n\nОсновная оптимизация для этого запроса — индекс `(status, created_at DESC)` либо частичный индекс по `created_at` для `status = 'COMPLETED'`.\n\n{{< /details >}}"
  filepath = "orders-query-index-optimization"
