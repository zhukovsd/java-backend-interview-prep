  id = 19
  question = "Автоматически регистрировать и запускать все реализации Robot  "
  answer = "**Условие задачи:**  \nЕсть несколько Spring-компонентов с роботами. Каждый робот умеет выполнять свою работу через метод `startWork()`.\n\nСейчас `RobotProcessing` напрямую зависит от конкретных классов `Robot1`, `Robot2`, `Robot3`. При добавлении нового робота приходится изменять `RobotProcessing`.\n\nНеобходимо изменить решение так, чтобы:\n\n- все роботы реализовывали общий интерфейс;\n    \n- Spring автоматически находил все реализации этого интерфейса;\n    \n- `RobotProcessing` получал их как коллекцию бинов;\n    \n- при добавлении нового робота `RobotProcessing` не требовал изменений.\n    \n\n**Код:**\n\n```java\n@Component\npublic class Robot1 {\n    public void startWork() {\n        // помыть полы\n    }\n}\n\n@Component\npublic class Robot2 {\n    public void startWork() {\n        // почистить стены\n    }\n}\n\n@Component\npublic class Robot3 {\n    public void startWork() {\n        // играет в футбол\n    }\n}\n\n@Service\npublic class RobotProcessing {\n\n    @Autowired\n    private Robot1 r1;\n\n    @Autowired\n    private Robot2 r2;\n\n    @Autowired\n    private Robot3 r3;\n\n    public void startAllRobots() {\n        r1.startWork();\n        r2.startWork();\n        r3.startWork();\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Введи общий интерфейс `Robot` с методом `startWork()`.  \n💡 Пусть каждый робот реализует этот интерфейс и остаётся Spring-бином.  \n💡 Spring умеет автоматически внедрять `List<Robot>` со всеми найденными реализациями.  \n💡 Используй constructor injection вместо внедрения зависимостей напрямую в поля.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic interface Robot {\n    void startWork();\n}\n```\n\n```java\n@Component\npublic class Robot1 implements Robot {\n\n    @Override\n    public void startWork() {\n        System.out.println(\"Robot1 моет полы\");\n    }\n}\n```\n\n```java\n@Component\npublic class Robot2 implements Robot {\n\n    @Override\n    public void startWork() {\n        System.out.println(\"Robot2 чистит стены\");\n    }\n}\n```\n\n```java\n@Component\npublic class Robot3 implements Robot {\n\n    @Override\n    public void startWork() {\n        System.out.println(\"Robot3 играет в футбол\");\n    }\n}\n```\n\n```java\n@Service\npublic class RobotProcessing {\n\n    private final List<Robot> robots;\n\n    public RobotProcessing(List<Robot> robots) {\n        this.robots = robots;\n    }\n\n    public void startAllRobots() {\n        robots.forEach(Robot::startWork);\n    }\n}\n```\n\nSpring при создании `RobotProcessing` найдёт все бины, реализующие интерфейс:\n\n```java\nRobot\n```\n\nи автоматически передаст их в:\n\n```java\nList<Robot> robots\n```\n\nПоэтому `RobotProcessing` больше не зависит от конкретных реализаций:\n\n```text\nRobot1\nRobot2\nRobot3\n```\n\nЧтобы добавить нового робота, достаточно создать ещё один бин:\n\n```java\n@Component\npublic class Robot4 implements Robot {\n\n    @Override\n    public void startWork() {\n        System.out.println(\"Robot4 поливает цветы\");\n    }\n}\n```\n\nМенять `RobotProcessing` после этого не потребуется.\n\nАннотация `@Autowired` на единственном конструкторе не обязательна: Spring автоматически использует его для внедрения зависимостей.\n\nЕсли порядок запуска роботов важен, его можно задать через `@Order`:\n\n```java\n@Component\n@Order(1)\npublic class Robot1 implements Robot {\n    // ...\n}\n```\n\nSpring учтёт этот порядок при формировании `List<Robot>`.\n\nТакое решение соответствует принципу Open/Closed: новые реализации `Robot` можно добавлять без изменения класса, который их запускает.\n\n{{< /details >}}"
  filepath = "spring-auto-robot"
