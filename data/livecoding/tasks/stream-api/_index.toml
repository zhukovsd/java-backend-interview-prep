[[tasks]]
  id = 1
  question = "Получить уникальные имена активных элементов"
  answer = "**Условие задачи:**  \nДан список объектов `Item`.\n\nНеобходимо с помощью Stream API получить коллекцию уникальных имён (`Item.name`) только тех элементов, у которых `active = true`.\n\n**Код:**\n\n```java\n@Getter\n@Setter\nclass Item {\n    private final Long id;\n    private String name;\n    private boolean active;\n\n    public Item(Long id) {\n        this.id = id;\n    }\n}\n\nList<Item> items = ...;\n\nCollection<String> result = items.stream()...;\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Через `filter()` оставь только активные элементы.  \n💡 Через `map()` преобразуй `Item` в его имя.  \n💡 Для получения уникальных значений собери результат в `Set`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nCollection<String> result = items.stream()\n        .filter(Item::isActive)\n        .map(Item::getName)\n        .collect(Collectors.toSet());\n```\n\nСначала:\n\n```java\n.filter(Item::isActive)\n```\n\nоставляет только элементы с `active = true`.\n\nЗатем:\n\n```java\n.map(Item::getName)\n```\n\nпреобразует каждый `Item` в его имя.\n\nНаконец:\n\n```java\n.collect(Collectors.toSet())\n```\n\nсобирает имена в `Set`, поэтому повторяющиеся значения автоматически исключаются.\n\nЕсли порядок элементов важен, можно собрать результат в `LinkedHashSet`:\n\n```java\nCollection<String> result = items.stream()\n        .filter(Item::isActive)\n        .map(Item::getName)\n        .collect(Collectors.toCollection(LinkedHashSet::new));\n```\n\nВременная сложность в среднем — `O(n)`, дополнительная память — `O(k)`, где `k` — количество уникальных имён активных элементов.\n\n{{< /details >}}\n"
  filepath = "unique-active-item-names"

[[tasks]]
  id = 2
  question = "Упростить вложенные лямбда-выражения"
  answer = "**Условие задачи:**  \nДан код, который ищет пользователей с правом редактирования.\n\nНеобходимо:\n\n- разобраться, что делает метод `findEditors()`;\n    \n- улучшить читаемость кода;\n    \n- уменьшить сложность вложенных лямбда-выражений.\n    \n\n**Код:**\n\n```java\npublic class AvoidComplexLambdas {\n    private final Set<User> users = new HashSet<>();\n\n    public Set<User> findEditors() {\n        return users.stream()\n                .filter(u -> u.getRoles().stream()\n                        .anyMatch(r -> r.getPermissions().contains(Permission.EDIT)))\n                .collect(Collectors.toSet());\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Метод оставляет пользователей, у которых хотя бы одна роль содержит разрешение `EDIT`.  \n💡 Основная проблема читаемости — вложенная логика внутри `filter()`.  \n💡 Её можно вынести в отдельный метод с говорящим названием.  \n💡 После этого в `filter()` можно использовать ссылку на метод.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nМетод ищет пользователей, у которых есть хотя бы одна роль с разрешением `Permission.EDIT`.\n\nВложенную проверку лучше вынести в отдельный метод:\n\n```java\npublic class AvoidComplexLambdas {\n    private final Set<User> users = new HashSet<>();\n\n    public Set<User> findEditors() {\n        return users.stream()\n                .filter(this::hasEditPermission)\n                .collect(Collectors.toSet());\n    }\n\n    private boolean hasEditPermission(User user) {\n        return user.getRoles().stream()\n                .anyMatch(role ->\n                        role.getPermissions().contains(Permission.EDIT));\n    }\n}\n```\n\nТеперь основной метод читается практически как описание бизнес-логики:\n\n```java\n.filter(this::hasEditPermission)\n```\n\nОтдельный метод:\n\n```java\nprivate boolean hasEditPermission(User user)\n```\n\nскрывает детали обхода ролей и явно сообщает, что именно проверяется.\n\nТакой рефакторинг:\n\n- уменьшает вложенность;\n    \n- делает `findEditors()` проще для чтения;\n    \n- позволяет отдельно тестировать проверку наличия разрешения;\n    \n- упрощает изменение логики проверки в будущем.\n    \n\n{{< /details >}}"
  filepath = "avoid-complex-lambdas"

[[tasks]]
  id = 3
  question = "Найти сотрудника по табельному номеру"
  answer = "**Условие задачи:**  \nДан класс `Empl` с полями `tabNomer` и `fio`.\n\nНеобходимо реализовать метод `getEmployee`, который:\n\n- принимает список сотрудников `List<Empl>`;\n    \n- принимает табельный номер `tabNomer`;\n    \n- находит первого сотрудника с таким табельным номером;\n    \n- возвращает результат в виде `Optional<Empl>`.\n    \n\n**Код:**\n\n```java\npublic class Empl {\n    private String tabNomer;\n    private String fio;\n\n    public Empl(String tabNomer, String fio) {\n        this.tabNomer = tabNomer;\n        this.fio = fio;\n    }\n\n    public String getTabNomer() {\n        return tabNomer;\n    }\n\n    public String getFio() {\n        return fio;\n    }\n}\n\npublic class EmplService {\n    public Optional<Empl> getEmployee(List<Empl> empls, String tabNomer) {\n        // TODO\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Создай поток из списка сотрудников через `stream()`.  \n💡 Через `filter()` оставь сотрудников с нужным табельным номером.  \n💡 Метод `findFirst()` вернёт первый найденный элемент в виде `Optional`.  \n💡 Для безопасного сравнения значений можно использовать `Objects.equals()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class EmplService {\n\n    public Optional<Empl> getEmployee(List<Empl> empls, String tabNomer) {\n        return empls.stream()\n                .filter(employee ->\n                        Objects.equals(employee.getTabNomer(), tabNomer))\n                .findFirst();\n    }\n}\n```\n\nСначала:\n\n```java\nempls.stream()\n```\n\nсоздаёт поток сотрудников.\n\nЗатем:\n\n```java\n.filter(employee ->\n        Objects.equals(employee.getTabNomer(), tabNomer))\n```\n\nоставляет только сотрудников с нужным табельным номером.\n\n`Objects.equals()` корректно сравнивает значения даже в случае, если один из табельных номеров равен `null`.\n\nВ конце:\n\n```java\n.findFirst()\n```\n\nвозвращает первого подходящего сотрудника как `Optional<Empl>`. Если такой сотрудник не найден, результатом будет `Optional.empty()`.\n\nВременная сложность — `O(n)` в худшем случае, дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "get-employee-by-tabnomer"

[[tasks]]
  id = 4
  question = "Отфильтровать и отсортировать фамилии"
  answer = "**Условие задачи:**  \nДан список строк, содержащих полные ФИО в формате «фамилия имя отчество».\n\nНеобходимо с помощью Stream API:\n\n- получить фамилию из каждой строки;\n    \n- оставить только фамилии длиной больше 3 символов;\n    \n- отсортировать фамилии в алфавитном порядке;\n    \n- собрать результат в список.\n    \n\n**Код:**\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        var fios = List.of(\n            \"Петров Петр Петрович\",\n            \"Иванов Иван Иванович\",\n            \"Алексеев Алексей Алексеевич\",\n            \"Васильев Василий Васильевич\",\n            \"Сидоров Сидор Сидорович\",\n            \"Николаев Николай Николаевич\",\n            \"Андреев Андрей Андреевич\"\n        );\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Через `map()` преобразуй каждое ФИО в фамилию.  \n💡 Фамилия — первая часть строки.  \n💡 Через `filter()` оставь фамилии длиной больше 3 символов.  \n💡 `sorted()` выполняет сортировку строк в естественном порядке.  \n💡 `toList()` собирает результат в список.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nList<String> result = fios.stream()\n        .map(fio -> fio.split(\"\\\\s+\")[0])\n        .filter(surname -> surname.length() > 3)\n        .sorted()\n        .toList();\n```\n\nСначала:\n\n```java\n.map(fio -> fio.split(\"\\\\s+\")[0])\n```\n\nразбивает ФИО по пробельным символам и берёт первую часть — фамилию.\n\nЗатем:\n\n```java\n.filter(surname -> surname.length() > 3)\n```\n\nоставляет только фамилии длиной больше трёх символов.\n\nПосле этого:\n\n```java\n.sorted()\n```\n\nсортирует фамилии в естественном порядке строк.\n\nДля приведённых данных результат будет:\n\n```text\n[Алексеев, Андреев, Васильев, Иванов, Николаев, Петров, Сидоров]\n```\n\nЕсли используется Java до версии 16, вместо `toList()` можно использовать:\n\n```java\n.collect(Collectors.toList());\n```\n\nВременная сложность определяется сортировкой — `O(n log n)`, дополнительная память — `O(n)`.\n\n{{< /details >}}"
  filepath = "filter-sort-surnames"

[[tasks]]
  id = 5
  question = "Палиндром с помощью Stream API"
  answer = "**Условие задачи:**  \nНеобходимо написать метод, который проверяет, является ли строка палиндромом.\n\nТребования:\n\n- использовать Stream API;\n    \n- проверку выполнить одним стримом;\n    \n- не учитывать регистр;\n    \n- игнорировать все символы, кроме букв и цифр.\n    \n\nПримеры:\n\n```text\n\"A man, a plan, a canal: Panama\" → true\n\"I love work in IT\"              → false\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сначала нормализуй строку: убери символы, которые не являются буквами или цифрами, и приведи текст к нижнему регистру.  \n💡 Достаточно проверить только первую половину строки.  \n💡 Для каждого индекса `i` сравни символ с позиции `i` с симметричным символом `length - 1 - i`.  \n💡 Используй `IntStream.range()` и `allMatch()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static boolean isPalindrome(String s) {\n    String normalized = s\n            .replaceAll(\"[^\\\\p{L}\\\\p{N}]\", \"\")\n            .toLowerCase(Locale.ROOT);\n\n    return IntStream.range(0, normalized.length() / 2)\n            .allMatch(i ->\n                    normalized.charAt(i)\n                            == normalized.charAt(normalized.length() - 1 - i));\n}\n```\n\nСначала строка нормализуется:\n\n```java\n.replaceAll(\"[^\\\\p{L}\\\\p{N}]\", \"\")\n.toLowerCase(Locale.ROOT)\n```\n\n`\\p{L}` обозначает любую Unicode-букву, а `\\p{N}` — любую Unicode-цифру. Поэтому решение работает не только с латиницей, но и, например, с кириллицей.\n\nДалее:\n\n```java\nIntStream.range(0, normalized.length() / 2)\n```\n\nсоздаёт индексы только для первой половины строки.\n\nДля каждого индекса сравниваются симметричные символы:\n\n```java\nnormalized.charAt(i)\n        == normalized.charAt(normalized.length() - 1 - i)\n```\n\n`allMatch()` вернёт `true`, только если совпали все пары.\n\nНапример:\n\n```java\nSystem.out.println(\n        isPalindrome(\"A man, a plan, a canal: Panama\")\n); // true\n\nSystem.out.println(\n        isPalindrome(\"I love work in IT\")\n); // false\n```\n\nВременная сложность — `O(n)`, дополнительная память для нормализованной строки — `O(n)`.\n\n{{< /details >}}"
  filepath = "palindrome-stream"

[[tasks]]
  id = 6
  question = "Получить удвоенные нечётные числа"
  answer = "**Условие задачи:**  \nДан массив натуральных чисел от `0` до `100`.\n\nНеобходимо с помощью Stream API:\n\n- оставить только нечётные числа;\n    \n- умножить каждое из них на `2`;\n    \n- собрать результат в коллекцию.\n    \n\nПример:\n\n```text\nВход:  [0, 1, 2, 3, 4, 5]\nВыход: [2, 6, 10]\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для создания потока из массива `int[]` используй `Arrays.stream()`.  \n💡 Нечётные числа можно определить через `number % 2 != 0`.  \n💡 Для удвоения каждого числа используй `map()`.  \n💡 `boxed()` преобразует `IntStream` в поток `Integer`, который можно собрать в `List<Integer>`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nint[] numbers = {0, 1, 2, 3, 4, 5};\n\nList<Integer> result = Arrays.stream(numbers)\n        .filter(number -> number % 2 != 0)\n        .map(number -> number * 2)\n        .boxed()\n        .collect(Collectors.toList());\n```\n\nСначала:\n\n```java\nArrays.stream(numbers)\n```\n\nсоздаёт `IntStream` из исходного массива.\n\nЗатем:\n\n```java\n.filter(number -> number % 2 != 0)\n```\n\nоставляет только нечётные числа.\n\nПосле этого:\n\n```java\n.map(number -> number * 2)\n```\n\nудваивает каждое из них.\n\n`boxed()` преобразует значения типа `int` в `Integer`, после чего результат собирается в список.\n\nДля массива:\n\n```text\n[0, 1, 2, 3, 4, 5]\n```\n\nполучим:\n\n```text\n[2, 6, 10]\n```\n\nВременная сложность — `O(n)`, дополнительная память — `O(k)`, где `k` — количество нечётных элементов.\n\n{{< /details >}}"
  filepath = "odd-doubled"

[[tasks]]
  id = 7
  question = "Получить уникальные значения со всех складов"
  answer = "**Условие задачи:**  \nДана карта складов `Map<String, List<String>> storage`, где:\n\n- ключ — название склада;\n    \n- значение — список номеров, находящихся на этом складе.\n    \n\nНеобходимо с помощью Stream API получить все уникальные номера со всех складов.\n\n**Код:**\n\n```java\nMap<String, List<String>> storage = new HashMap<>();\n\nstorage.put(\"s1\", Arrays.asList(\"555-1123\", \"555-3389\"));\nstorage.put(\"s2\", Arrays.asList(\"555-1123\", \"555-5264\"));\nstorage.put(\"s3\", Arrays.asList(\"555-6654\", \"555-3242\"));\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Через `storage.values()` получи списки значений всех складов.  \n💡 С помощью `flatMap()` объедини несколько списков в один поток строк.  \n💡 Для получения уникальных значений можно собрать результат в `Set`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nSet<String> uniqueNumbers = storage.values().stream()\n        .flatMap(List::stream)\n        .collect(Collectors.toSet());\n```\n\nСначала:\n\n```java\nstorage.values().stream()\n```\n\nсоздаёт поток списков:\n\n```text\nStream<List<String>>\n```\n\nЗатем:\n\n```java\n.flatMap(List::stream)\n```\n\nразворачивает их в один поток номеров:\n\n```text\nStream<String>\n```\n\nПосле этого:\n\n```java\n.collect(Collectors.toSet())\n```\n\nсобирает значения в `Set`, который автоматически исключает дубликаты.\n\nЕсли нужно сразу вывести уникальные номера, можно использовать `distinct()`:\n\n```java\nstorage.values().stream()\n        .flatMap(List::stream)\n        .distinct()\n        .forEach(System.out::println);\n```\n\nДля приведённых данных будут получены значения:\n\n```text\n555-1123\n555-3389\n555-5264\n555-6654\n555-3242\n```\n\nПорядок вывода не гарантирован, поскольку исходная карта — `HashMap`.\n\nВременная сложность в среднем — `O(n)`, дополнительная память — `O(k)`, где `k` — количество уникальных значений.\n\n{{< /details >}}"
  filepath = "unique-values-in-storages"

[[tasks]]
  id = 8
  question = "Вывести города и получить уникальные названия"
  answer = "**Условие задачи:**  \nДан список объектов `City`.\n\nНеобходимо:\n\n1. пройти по коллекции и вывести названия всех городов;\n    \n2. с помощью Stream API получить уникальную коллекцию строк с названиями городов.\n    \n\n**Код:**\n\n```java\npublic class Main {\n\n    public static void main(String[] args) {\n        List<City> cities = getCity();\n        // Код сюда\n    }\n\n    private static List<City> getCity() {\n        return List.of(\n                new City(\"msk\"),\n                new City(\"msk\"),\n                new City(\"spb\"),\n                new City(\"ekb\")\n        );\n    }\n\n    public static class City {\n        private final String name;\n\n        public City(String name) {\n            this.name = name;\n        }\n\n        public String getName() {\n            return name;\n        }\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для вывода элементов можно использовать `forEach()`.  \n💡 Через `map(City::getName)` преобразуй объекты `City` в строки.  \n💡 Для получения уникальной коллекции удобно использовать `Set`.  \n💡 Если важно сохранить порядок появления городов, используй `LinkedHashSet`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static void main(String[] args) {\n    List<City> cities = getCity();\n\n    // 1. Вывести названия всех городов\n    cities.stream()\n            .map(City::getName)\n            .forEach(System.out::println);\n\n    // 2. Получить уникальные названия с сохранением порядка\n    Set<String> uniqueNames = cities.stream()\n            .map(City::getName)\n            .collect(Collectors.toCollection(LinkedHashSet::new));\n\n    System.out.println(\"Уникальные города:\");\n    uniqueNames.forEach(System.out::println);\n}\n```\n\nСначала:\n\n```java\n.map(City::getName)\n```\n\nпреобразует поток объектов `City` в поток названий городов.\n\nВо второй части результат собирается в:\n\n```java\nCollectors.toCollection(LinkedHashSet::new)\n```\n\n`LinkedHashSet` одновременно:\n\n- удаляет дубликаты;\n    \n- сохраняет порядок первого появления элементов.\n    \n\nДля исходных данных вывод будет таким:\n\n```text\nmsk\nmsk\nspb\nekb\nУникальные города:\nmsk\nspb\nekb\n```\n\nДополнительный вызов `distinct()` перед сбором в `Set` не требуется, поскольку множество уже обеспечивает уникальность.\n\nВременная сложность в среднем — `O(n)`, дополнительная память — `O(k)`, где `k` — количество уникальных названий городов.\n\n{{< /details >}}"
  filepath = "unique-cities-streams"

[[tasks]]
  id = 9
  question = "Найти человека по имени"
  answer = "**Условие задачи:**  \nДан класс `Person` с полями `name` и `age`.\n\nНеобходимо реализовать метод, который:\n\n- принимает список `List<Person>`;\n    \n- ищет человека по имени;\n    \n- возвращает первого найденного человека в виде `Optional<Person>`;\n    \n- использует Stream API.\n    \n\n**Код:**\n\n```java\nclass Person {\n    String name;\n    Integer age;\n}\n\nOptional<Person> findPersonByName(List<Person> persons, String name) {\n    // ...\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Создай поток из списка через `stream()`.  \n💡 Через `filter()` оставь только людей с нужным именем.  \n💡 Для безопасного сравнения строк можно использовать `Objects.equals()`.  \n💡 `findFirst()` вернёт первый подходящий элемент в виде `Optional<Person>`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nOptional<Person> findPersonByName(List<Person> persons, String name) {\n    return persons.stream()\n            .filter(person -> Objects.equals(person.name, name))\n            .findFirst();\n}\n```\n\nУсловие:\n\n```java\n.filter(person -> Objects.equals(person.name, name))\n```\n\nоставляет только людей с нужным именем.\n\n`Objects.equals()` корректно сравнивает значения даже в случае, если одно или оба имени равны `null`.\n\nЗатем:\n\n```java\n.findFirst()\n```\n\nвозвращает первого найденного человека как `Optional<Person>`. Если подходящего человека нет, результатом будет `Optional.empty()`.\n\nВременная сложность — `O(n)` в худшем случае, дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "find-person-by-name-stream"

[[tasks]]
  id = 10
  question = "Сгруппировать названия книг по авторам"
  answer = "**Условие задачи:**  \nДана коллекция объектов `Book`, где:\n\n- `author` — имя автора;\n    \n- `names` — список названий книг.\n    \n\nНеобходимо:\n\n1. получить `Map<String, List<String>>`, где ключ — автор, а значение — список всех названий его книг;\n    \n2. дополнительно получить для каждого автора только уникальные названия книг.\n    \n\n**Код:**\n\n```java\npublic class Main {\n\n    private record Book(String author, List<String> names) {\n    }\n\n    public static void main(String[] args) {\n        Set<Book> books = Set.of(\n                new Book(\"Author1\", List.of(\"Name1\")),\n                new Book(\"Author1\", List.of(\"Name2\")),\n                new Book(\"Author2\", List.of(\"Name3\")),\n                new Book(\"Author2\", List.of(\"Name4\", \"Name3\")),\n                new Book(\"Author3\", List.of(\"Name5\"))\n        );\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Сгруппируй объекты по `author` через `Collectors.groupingBy()`.  \n💡 У каждого `Book` хранится список названий, поэтому вложенные списки нужно развернуть.  \n💡 Для этого можно использовать `Collectors.flatMapping()`.  \n💡 Для обычного результата собирай названия в `List`, а для уникального — в `Set`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n1. Список названий книг по каждому автору:\n    \n\n```java\nMap<String, List<String>> booksByAuthor = books.stream()\n        .collect(Collectors.groupingBy(\n                Book::author,\n                Collectors.flatMapping(\n                        book -> book.names().stream(),\n                        Collectors.toList()\n                )\n        ));\n```\n\n`groupingBy()` группирует объекты `Book` по автору:\n\n```java\nBook::author\n```\n\nА `flatMapping()` разворачивает все списки `names` внутри одной группы в единый поток названий:\n\n```java\nbook -> book.names().stream()\n```\n\nДля приведённых данных результат будет содержать:\n\n```text\nAuthor1 -> [Name1, Name2]\nAuthor2 -> [Name3, Name4, Name3]\nAuthor3 -> [Name5]\n```\n\n2. Уникальные названия книг по каждому автору:\n    \n\n```java\nMap<String, Set<String>> uniqueBooksByAuthor = books.stream()\n        .collect(Collectors.groupingBy(\n                Book::author,\n                Collectors.flatMapping(\n                        book -> book.names().stream(),\n                        Collectors.toSet()\n                )\n        ));\n```\n\nТеперь названия собираются в `Set`, поэтому повторяющиеся значения исключаются:\n\n```text\nAuthor1 -> [Name1, Name2]\nAuthor2 -> [Name3, Name4]\nAuthor3 -> [Name5]\n```\n\nЕсли используется Java 8, где `Collectors.flatMapping()` ещё нет, ту же задачу можно решить через `toMap()`:\n\n```java\nMap<String, List<String>> booksByAuthor = books.stream()\n        .collect(Collectors.toMap(\n                Book::author,\n                book -> new ArrayList<>(book.names()),\n                (left, right) -> {\n                    left.addAll(right);\n                    return left;\n                }\n        ));\n```\n\nВременная сложность — `O(m)`, где `m` — общее количество названий книг во всех объектах `Book`. Дополнительная память также зависит от количества собранных названий.\n\n{{< /details >}}"
  filepath = "books-by-author-streams"

[[tasks]]
  id = 11
  question = "Вывести каждый второй символ строки в обратном порядке  "
  answer = "**Условие задачи:**  \nДана строка.\n\nНеобходимо с помощью Stream API:\n\n- обходить строку в обратном порядке;\n    \n- брать каждый второй символ, начиная с последнего;\n    \n- не использовать `reverse()`;\n    \n- не создавать дополнительные внешние структуры данных;\n    \n- выполнить обработку одним stream-конвейером.\n    \n\n**Код:**\n\n```java\nString s = \"Spring Boot!\";\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Удобно стримить не сами символы, а их индексы.  \n💡 Начни с последнего индекса строки и двигайся назад с шагом `2`.  \n💡 По индексу получай символ через `charAt()`.  \n💡 Для формирования результата используй `Collectors.joining()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант для Java 9+:\n\n```java\nString result = IntStream.iterate(\n                s.length() - 1,\n                i -> i >= 0,\n                i -> i - 2\n        )\n        .mapToObj(i -> String.valueOf(s.charAt(i)))\n        .collect(Collectors.joining());\n\nSystem.out.println(result);\n```\n\nДля строки:\n\n```text\nSpring Boot!\n```\n\nиндексы будут обходиться так:\n\n```text\n11, 9, 7, 5, 3, 1\n```\n\nПоэтому результат:\n\n```text\n!oBgip\n```\n\nЗдесь строка физически не разворачивается. Stream сразу идёт с конца строки с шагом `2`.\n\nЕсли нужна совместимость с Java 8, можно использовать `IntStream.range()`:\n\n```java\nString result = IntStream.range(0, s.length() / 2)\n        .map(i -> s.length() - 1 - i * 2)\n        .mapToObj(i -> String.valueOf(s.charAt(i)))\n        .collect(Collectors.joining());\n```\n\nВременная сложность — `O(n)`, дополнительная память помимо результирующей строки — `O(1)`.\n\nВажно: здесь под «каждым вторым» понимаются последний символ, затем через один, то есть позиции `1, 3, 5...` в уже развёрнутой последовательности. Если требуется именно второй, четвёртый, шестой символ развёрнутой строки, стартовый индекс нужно сместить на один.\n\n{{< /details >}}"
  filepath = "reverse-every-second-char"

[[tasks]]
  id = 12
  question = "Отфильтровать и сгруппировать имена по длине"
  answer = "**Условие задачи:**  \nДан список имён пользователей.\n\nНеобходимо с помощью Stream API:\n\n- оставить только имена, начинающиеся с буквы `А`;\n    \n- сгруппировать их по длине;\n    \n- вернуть результат в виде `Map<Integer, List<String>>`, где:\n    \n    - ключ — длина имени;\n        \n    - значение — список имён такой длины.\n        \n\n**Код:**\n\n```java\npublic class Main {\n\n    public static void main(String[] args) {\n        List<String> names = List.of(\n                \"Анна\",\n                \"Александр\",\n                \"Андрей\",\n                \"Антон\",\n                \"Борис\",\n                \"Богдан\",\n                \"Мария\",\n                \"Максим\",\n                \"Артём\"\n        );\n\n        System.out.println(processNames(names));\n    }\n\n    public static Map<Integer, List<String>> processNames(List<String> names) {\n        return null;\n    }\n}\n```\n\nОжидаемый результат:\n\n```text\n{4=[Анна], 5=[Антон, Артём], 6=[Андрей], 9=[Александр]}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Создай поток через `stream()`.  \n💡 Через `filter()` оставь только строки, начинающиеся с `\"А\"`.  \n💡 Для группировки используй `Collectors.groupingBy()`.  \n💡 Ключом группы будет длина строки — `String::length`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static Map<Integer, List<String>> processNames(List<String> names) {\n    return names.stream()\n            .filter(name -> name.startsWith(\"А\"))\n            .collect(Collectors.groupingBy(String::length));\n}\n```\n\nСначала:\n\n```java\n.filter(name -> name.startsWith(\"А\"))\n```\n\nоставляет только имена, начинающиеся с буквы `А`.\n\nЗатем:\n\n```java\n.collect(Collectors.groupingBy(String::length))\n```\n\nгруппирует имена по их длине.\n\nДля исходных данных группы будут такими:\n\n```text\n4 -> [Анна]\n5 -> [Антон, Артём]\n6 -> [Андрей]\n9 -> [Александр]\n```\n\nТип результата:\n\n```java\nMap<Integer, List<String>>\n```\n\nВременная сложность — `O(n)`, дополнительная память — `O(n)` для результата.\n\n{{< /details >}}"
  filepath = "group-names"

[[tasks]]
  id = 13
  question = "Получить список без первых и последних трёх элементов  "
  answer = "**Условие задачи:**  \nДан `List<String>` произвольной длины.\n\nНеобходимо с помощью одного Stream API-конвейера получить новый список:\n\n- без первых трёх элементов;\n    \n- без последних трёх элементов.\n    \n\nЕсли в исходном списке шесть элементов или меньше, результат должен быть пустым.\n\n**Код:**\n\n```java\nList<String> list = List.of(\n        \"a\", \"b\", \"c\", \"d\", \"e\",\n        \"f\", \"g\", \"h\", \"i\", \"j\"\n);\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Первые три элемента можно пропустить через `skip(3)`.  \n💡 После этого нужно оставить только `list.size() - 6` элементов.  \n💡 Для ограничения количества элементов используй `limit()`.  \n💡 Для коротких списков количество элементов нужно ограничить снизу нулём.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nList<String> result = list.stream()\n        .skip(3)\n        .limit(Math.max(0, list.size() - 6L))\n        .toList();\n```\n\nСначала:\n\n```java\n.skip(3)\n```\n\nпропускает первые три элемента.\n\nПосле удаления трёх элементов с начала и трёх с конца в результате должно остаться:\n\n```java\nlist.size() - 6\n```\n\nэлементов.\n\nПоэтому:\n\n```java\n.limit(Math.max(0, list.size() - 6L))\n```\n\nоставляет только необходимую часть списка.\n\nДля исходных данных:\n\n```text\n[a, b, c, d, e, f, g, h, i, j]\n```\n\nрезультат:\n\n```text\n[d, e, f, g]\n```\n\nЕсли размер списка `<= 6`, `Math.max()` передаст в `limit()` значение `0`, и результатом будет пустой список.\n\nЕсли используется Java до версии 16:\n\n```java\nList<String> result = list.stream()\n        .skip(3)\n        .limit(Math.max(0, list.size() - 6L))\n        .collect(Collectors.toList());\n```\n\nВременная сложность — `O(n)`, дополнительная память — `O(n)` для результата.\n\n{{< /details >}}"
  filepath = "skip-limit"

[[tasks]]
  id = 14
  question = "Найти средний возраст мужчин в списке  "
  answer = "**Условие задачи:**  \nДан список объектов `Person` с полями:\n\n- `name`;\n    \n- `age`;\n    \n- `sex`.\n    \n\nНеобходимо с помощью Stream API найти средний возраст всех мужчин из списка.\n\nЕсли мужчин в списке нет, результат должен быть пустым `OptionalDouble`.\n\n**Код:**\n\n```java\nList<Person> persons = Arrays.asList(\n        new Person(\"Alice\", 25, \"female\"),\n        new Person(\"Bob\", 30, \"male\"),\n        new Person(\"Eve\", 35, \"female\"),\n        new Person(\"Jack\", 28, \"male\")\n);\n```\n\nПример результата:\n\n```text\n29.0\n```\n\nЕсли мужчин нет:\n\n```text\nOptionalDouble.empty\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Через `filter()` оставь только мужчин.  \n💡 Через `mapToInt()` преобразуй поток `Person` в поток возрастов.  \n💡 Метод `average()` возвращает `OptionalDouble`.  \n💡 `OptionalDouble` позволяет корректно обработать случай, когда подходящих элементов нет.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nOptionalDouble averageAgeOfMales = persons.stream()\n        .filter(person -> \"male\".equalsIgnoreCase(person.getSex()))\n        .mapToInt(Person::getAge)\n        .average();\n```\n\nСначала:\n\n```java\n.filter(person -> \"male\".equalsIgnoreCase(person.getSex()))\n```\n\nоставляет только мужчин.\n\nВызов `equalsIgnoreCase()` выполняется у строкового литерала `\"male\"`, поэтому код не выбросит `NullPointerException`, если `person.getSex()` вернёт `null`.\n\nЗатем:\n\n```java\n.mapToInt(Person::getAge)\n```\n\nпреобразует объекты `Person` в их возраст, а:\n\n```java\n.average()\n```\n\nвычисляет среднее значение и возвращает `OptionalDouble`.\n\nДля возрастов `30` и `28` результат:\n\n```text\n29.0\n```\n\nЕсли мужчин в списке нет, `average()` вернёт:\n\n```text\nOptionalDouble.empty\n```\n\nЕсли по условию обязательно требуется получить именно `double`, можно задать значение для случая отсутствия мужчин:\n\n```java\ndouble averageAgeOfMales = persons.stream()\n        .filter(person -> \"male\".equalsIgnoreCase(person.getSex()))\n        .mapToInt(Person::getAge)\n        .average()\n        .orElse(0.0);\n```\n\nНо если отсутствие мужчин должно отличаться от реального среднего возраста `0`, предпочтительнее сохранить `OptionalDouble`.\n\nВременная сложность — `O(n)`, дополнительная память — `O(1)`.\n\n{{< /details >}}"
  filepath = "average-age-males"

[[tasks]]
  id = 15
  question = "Реализовать стратегию фильтрации заказов с помощью лямбд"
  answer = "**Условие задачи:**  \nДан класс `Order` с полями:\n\n- `price` — стоимость заказа;\n    \n- `date` — дата заказа;\n    \n- `status` — статус заказа.\n    \n\nНеобходимо реализовать универсальную фильтрацию списка заказов по разным критериям:\n\n- по цене;\n    \n- по дате;\n    \n- по статусу;\n    \n- по комбинации нескольких условий.\n    \n\nСтратегию фильтрации нужно передавать в виде лямбда-выражения. При добавлении нового критерия метод фильтрации изменяться не должен.\n\n**Код:**\n\n```java\npublic class Order {\n    private final BigDecimal price;\n    private final LocalDate date;\n    private final String status;\n\n    public Order(BigDecimal price, LocalDate date, String status) {\n        this.price = price;\n        this.date = date;\n        this.status = status;\n    }\n\n    public BigDecimal getPrice() {\n        return price;\n    }\n\n    public LocalDate getDate() {\n        return date;\n    }\n\n    public String getStatus() {\n        return status;\n    }\n}\n\npublic class OrderService {\n\n    public static List<Order> filterOrders(\n            List<Order> orders,\n            Predicate<Order> filterStrategy\n    ) {\n        // TODO\n        return null;\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `Predicate<Order>` представляет функцию, которая принимает `Order` и возвращает `boolean`.  \n💡 Конкретную стратегию можно передать непосредственно лямбда-выражением.  \n💡 Метод `filterOrders()` не должен знать, по какому именно признаку выполняется фильтрация.  \n💡 Несколько условий можно объединять через `Predicate.and()` и `Predicate.or()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nМетод фильтрации принимает `Predicate<Order>` и применяет его ко всем заказам:\n\n```java\npublic class OrderService {\n\n    public static List<Order> filterOrders(\n            List<Order> orders,\n            Predicate<Order> filterStrategy\n    ) {\n        return orders.stream()\n                .filter(filterStrategy)\n                .collect(Collectors.toList());\n    }\n}\n```\n\nТеперь конкретное условие передаётся снаружи.\n\nФильтрация по цене:\n\n```java\nList<Order> expensiveOrders = OrderService.filterOrders(\n        orders,\n        order -> order.getPrice()\n                .compareTo(new BigDecimal(\"200.00\")) > 0\n);\n```\n\nФильтрация по дате:\n\n```java\nList<Order> recentOrders = OrderService.filterOrders(\n        orders,\n        order -> order.getDate()\n                .isAfter(LocalDate.of(2023, 1, 15))\n);\n```\n\nФильтрация по статусу:\n\n```java\nList<Order> newOrders = OrderService.filterOrders(\n        orders,\n        order -> \"NEW\".equalsIgnoreCase(order.getStatus())\n);\n```\n\nМожно также создавать отдельные стратегии и комбинировать их:\n\n```java\nPredicate<Order> delivered =\n        order -> \"DELIVERED\".equalsIgnoreCase(order.getStatus());\n\nPredicate<Order> afterFebruary =\n        order -> order.getDate().isAfter(LocalDate.of(2023, 2, 1));\n\nList<Order> result = OrderService.filterOrders(\n        orders,\n        delivered.and(afterFebruary)\n);\n```\n\nОсновной метод:\n\n```java\nfilterOrders(List<Order> orders, Predicate<Order> filterStrategy)\n```\n\nостаётся неизменным при появлении новых условий. Меняется только передаваемый `Predicate<Order>`.\n\nТаким образом, лямбда выступает в роли конкретной стратегии, а `OrderService` работает с общей абстракцией `Predicate<Order>`.\n\nВременная сложность фильтрации — `O(n)`, дополнительная память — `O(k)` для результирующего списка из `k` подходящих заказов.\n\n{{< /details >}}"
  filepath = "order-filter-strategy"

