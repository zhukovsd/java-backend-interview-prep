  id = 16
  question = "Удалить элементы списка с нечётными индексами"
  answer = "**Условие задачи:**  \nДан список строк `inList`.\n\nНеобходимо с помощью Stream API получить новый список, содержащий только элементы с чётными индексами:\n\n```text\n0, 2, 4, 6, ...\n```\n\nТо есть элементы с нечётными индексами нужно исключить.\n\n**Код:**\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        List<String> inList = List.of(\n                \"a\", \"b\", \"c\", \"d\", \"e\", \"g\"\n        );\n\n        List<String> outList = inList /* do something */;\n\n        System.out.println(outList); // [a, c, e]\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 В обычном `Stream<String>` индекс элемента недоступен напрямую.  \n💡 Поэтому можно создать поток индексов через `IntStream.range()`.  \n💡 Оставь только чётные индексы через `filter()`.  \n💡 Затем преобразуй каждый индекс обратно в элемент списка через `inList.get(i)`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nList<String> outList = IntStream.range(0, inList.size())\n        .filter(i -> i % 2 == 0)\n        .mapToObj(inList::get)\n        .collect(Collectors.toList());\n```\n\nСначала:\n\n```java\nIntStream.range(0, inList.size())\n```\n\nсоздаёт последовательность индексов:\n\n```text\n0, 1, 2, 3, 4, 5\n```\n\nЗатем:\n\n```java\n.filter(i -> i % 2 == 0)\n```\n\nоставляет только чётные индексы:\n\n```text\n0, 2, 4\n```\n\nПосле этого:\n\n```java\n.mapToObj(inList::get)\n```\n\nпреобразует индексы обратно в элементы списка.\n\nДля исходных данных результат будет:\n\n```text\n[a, c, e]\n```\n\nЕсли используется Java 16+, можно записать короче:\n\n```java\nList<String> outList = IntStream.range(0, inList.size())\n        .filter(i -> i % 2 == 0)\n        .mapToObj(inList::get)\n        .toList();\n```\n\nДля списков с быстрым доступом по индексу, например `ArrayList` или `List.of(...)`, временная сложность — `O(n)`, дополнительная память — `O(n)` для результирующего списка.\n\n{{< /details >}}"
  filepath = "filter-even-index"

[[tasks]]
  id = 17
  question = "Получить теги книг выбранных авторов"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод, который получает список авторов и идентификаторы выбранных авторов, а затем возвращает все теги их книг.\n\n**Код:**\n\n```java\npublic class Ex {\n\n    public static class Tag {\n        String name;\n\n        public Tag(String name) {\n            this.name = name;\n        }\n    }\n\n    public static class Book {\n        String name;\n        List<Tag> tags;\n\n        public Book(String name, List<Tag> tags) {\n            this.name = name;\n            this.tags = tags;\n        }\n    }\n\n    public static class Author {\n        String id;\n        String name;\n        List<Book> books;\n\n        public Author(\n                String id,\n                String name,\n                List<Book> books\n        ) {\n            this.id = id;\n            this.name = name;\n            this.books = books;\n        }\n    }\n\n    public static List<Tag> getTagsOfAuthorsBooks(\n            List<Author> authors,\n            List<String> searchAuthorIds\n    ) {\n        // код тут\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Преобразуй идентификаторы авторов в `Set` для быстрого поиска.  \n💡 Сначала отфильтруй авторов по полю `id`.  \n💡 С помощью `flatMap()` разверни список авторов в поток книг.  \n💡 Затем вторым `flatMap()` получи теги всех книг.  \n💡 Обработай возможные значения `null`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic static List<Tag> getTagsOfAuthorsBooks(\n        List<Author> authors,\n        List<String> searchAuthorIds\n) {\n    if (authors == null || searchAuthorIds == null) {\n        return List.of();\n    }\n\n    Set<String> authorIds = new HashSet<>(searchAuthorIds);\n\n    return authors.stream()\n            .filter(Objects::nonNull)\n            .filter(author -> authorIds.contains(author.id))\n            .filter(author -> author.books != null)\n            .flatMap(author -> author.books.stream())\n            .filter(Objects::nonNull)\n            .filter(book -> book.tags != null)\n            .flatMap(book -> book.tags.stream())\n            .filter(Objects::nonNull)\n            .toList();\n}\n```\n\nСначала выбираются авторы с подходящими идентификаторами, затем вложенные коллекции последовательно разворачиваются:\n\n```text\nавторы → книги → теги\n```\n\nПреобразование идентификаторов в `HashSet` позволяет проверять наличие идентификатора в среднем за `O(1)`.\n\nПовторяющиеся теги сохраняются. Если нужно вернуть только уникальные теги, необходимо определить правило их сравнения и добавить `distinct()`.\n\n{{< /details >}}"
  filepath = "author-books-tags-search"

[[tasks]]
  id = 18
  question = "Подсчитать вхождения слова в тексте"
  answer = "**Условие задачи:**  \nНеобходимо реализовать метод, который подсчитывает, сколько раз указанное слово встречается в тексте.\n\nСлова в тексте уже очищены от знаков препинания. Сравнение выполняется с учётом регистра.\n\n**Код:**\n\n```java\nint getWordCount(String word, String text) {\n    // код тут\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Раздели текст на слова с помощью `split(\"\\\\s+\")`.  \n💡 Преобразуй массив слов в поток через `Arrays.stream()`.  \n💡 Оставь совпадающие слова с помощью `filter()`.  \n💡 Для подсчёта элементов используй `count()`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\nint getWordCount(String word, String text) {\n    if (word == null || word.trim().isEmpty()\n            || text == null || text.trim().isEmpty()) {\n        return 0;\n    }\n\n    return (int) Arrays.stream(text.trim().split(\"\\\\s+\"))\n            .filter(word::equals)\n            .count();\n}\n```\n\nПример использования:\n\n```java\nint count = getWordCount(\n        \"java\",\n        \"java spring java sql java\"\n);\n\nSystem.out.println(count);\n```\n\nРезультат:\n\n```text\n3\n```\n\nМетод разделяет текст по одному или нескольким пробельным символам, оставляет слова, равные искомому, и подсчитывает количество совпадений.\n\nВременная сложность — `O(n)`, где `n` — длина текста.\n\n{{< /details >}}"
  filepath = "word-count-stream-api"

