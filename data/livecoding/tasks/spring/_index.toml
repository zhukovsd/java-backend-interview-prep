  id = 1
  question = "Спроектировать и реализовать REST API для управления пользователем"
  answer = "**Условие задачи:**  \nНеобходимо спроектировать REST API для управления пользователями.\n\nAPI должно поддерживать:\n\n- создание пользователя;\n    \n- получение пользователя по `id`;\n    \n- получение списка пользователей;\n    \n- обновление пользователя;\n    \n- удаление пользователя.\n    \n\nДанные можно хранить в памяти.\n\n**Код:**\n\n```java\npublic class User {\n\n    private Long id;\n    private String name;\n    private String email;\n    private Integer age;\n\n    // getters / setters / constructors\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Используй `@RestController` и HTTP-методы `POST`, `GET`, `PUT`, `DELETE`.  \n💡 Логику работы с пользователями вынеси в `@Service`.  \n💡 Для хранения в памяти подойдёт `ConcurrentHashMap`.  \n💡 Для генерации идентификаторов можно использовать `AtomicLong`.  \n💡 Для входных данных удобно использовать отдельный DTO с валидацией.  \n💡 Если пользователь не найден, возвращай `404 Not Found`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nDTO для входных данных:\n\n```java\npublic record UserRequest(\n        @NotBlank String name,\n        @NotBlank @Email String email,\n        @Min(0) Integer age\n) {\n}\n```\n\nМодель:\n\n```java\npublic record User(\n        Long id,\n        String name,\n        String email,\n        Integer age\n) {\n}\n```\n\nСервис:\n\n```java\n@Service\npublic class UserService {\n\n    private final Map<Long, User> users =\n            new ConcurrentHashMap<>();\n\n    private final AtomicLong idGenerator =\n            new AtomicLong();\n\n    public User create(UserRequest request) {\n        long id = idGenerator.incrementAndGet();\n\n        User user = new User(\n                id,\n                request.name(),\n                request.email(),\n                request.age()\n        );\n\n        users.put(id, user);\n\n        return user;\n    }\n\n    public User getById(long id) {\n        User user = users.get(id);\n\n        if (user == null) {\n            throw new NoSuchElementException(\n                    \"User not found: \" + id\n            );\n        }\n\n        return user;\n    }\n\n    public List<User> getAll() {\n        return users.values().stream()\n                .sorted(Comparator.comparing(User::id))\n                .toList();\n    }\n\n    public User update(\n            long id,\n            UserRequest request\n    ) {\n        if (!users.containsKey(id)) {\n            throw new NoSuchElementException(\n                    \"User not found: \" + id\n            );\n        }\n\n        User updated = new User(\n                id,\n                request.name(),\n                request.email(),\n                request.age()\n        );\n\n        users.put(id, updated);\n\n        return updated;\n    }\n\n    public void delete(long id) {\n        if (users.remove(id) == null) {\n            throw new NoSuchElementException(\n                    \"User not found: \" + id\n            );\n        }\n    }\n}\n```\n\nКонтроллер:\n\n```java\n@RestController\n@RequestMapping(\"/api/users\")\npublic class UserController {\n\n    private final UserService userService;\n\n    public UserController(UserService userService) {\n        this.userService = userService;\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public User create(\n            @Valid @RequestBody UserRequest request\n    ) {\n        return userService.create(request);\n    }\n\n    @GetMapping(\"/{id}\")\n    public User getById(\n            @PathVariable long id\n    ) {\n        return userService.getById(id);\n    }\n\n    @GetMapping\n    public List<User> getAll() {\n        return userService.getAll();\n    }\n\n    @PutMapping(\"/{id}\")\n    public User update(\n            @PathVariable long id,\n            @Valid @RequestBody UserRequest request\n    ) {\n        return userService.update(id, request);\n    }\n\n    @DeleteMapping(\"/{id}\")\n    @ResponseStatus(HttpStatus.NO_CONTENT)\n    public void delete(\n            @PathVariable long id\n    ) {\n        userService.delete(id);\n    }\n}\n```\n\nОбработка `404`:\n\n```java\n@RestControllerAdvice\npublic class ApiExceptionHandler {\n\n    @ExceptionHandler(NoSuchElementException.class)\n    @ResponseStatus(HttpStatus.NOT_FOUND)\n    public String handleNotFound(\n            NoSuchElementException exception\n    ) {\n        return exception.getMessage();\n    }\n}\n```\n\nПолучившийся API:\n\n```text\nPOST   /api/users\nGET    /api/users/{id}\nGET    /api/users\nPUT    /api/users/{id}\nDELETE /api/users/{id}\n```\n\nДля реального приложения хранилище в памяти можно заменить на `JpaRepository`, не меняя контракт контроллера.\n\n{{< /details >}}"
  filepath = "api-user-management"

[[tasks]]
  id = 2
  question = "Реализовать сервис токенов с ограничением количества использований"
  answer = "**Условие задачи:**  \nНеобходимо реализовать сервис для работы с токенами.\n\nТребования:\n\n- сервис должен генерировать токен;\n    \n- каждый токен можно использовать ограниченное количество раз;\n    \n- при успешном использовании количество оставшихся попыток уменьшается;\n    \n- после исчерпания лимита токен становится недействительным;\n    \n- сервис должен корректно работать при одновременных обращениях нескольких потоков.\n    \n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для хранения токенов можно использовать `ConcurrentHashMap`.  \n💡 Для генерации токена подойдёт `UUID`.  \n💡 Проверка лимита и его уменьшение должны выполняться атомарно.  \n💡 Для этого удобно использовать `AtomicInteger`.  \n💡 После исчерпания лимита токен можно удалить из хранилища.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\n@Service\npublic class TokenService {\n\n    private static final int MAX_USES = 5;\n\n    private final Map<String, AtomicInteger> tokens =\n            new ConcurrentHashMap<>();\n\n    public String generateToken() {\n        String token = UUID.randomUUID().toString();\n\n        tokens.put(\n                token,\n                new AtomicInteger(MAX_USES)\n        );\n\n        return token;\n    }\n\n    public boolean useToken(String token) {\n        if (token == null) {\n            return false;\n        }\n\n        AtomicBoolean used = new AtomicBoolean(false);\n\n        tokens.computeIfPresent(token, (key, remainingUses) -> {\n            int current = remainingUses.get();\n\n            if (current <= 0) {\n                return null;\n            }\n\n            int remaining = remainingUses.decrementAndGet();\n            used.set(true);\n\n            return remaining == 0\n                    ? null\n                    : remainingUses;\n        });\n\n        return used.get();\n    }\n\n    public int getRemainingUses(String token) {\n        AtomicInteger remainingUses = tokens.get(token);\n\n        return remainingUses == null\n                ? 0\n                : remainingUses.get();\n    }\n}\n```\n\nДля каждого токена хранится количество оставшихся использований:\n\n```text\ntoken → remainingUses\n```\n\nМетод `computeIfPresent()` выполняет изменение значения для конкретного ключа атомарно относительно операций с этим ключом.\n\nПосле последнего успешного использования запись удаляется из `Map`, поэтому последующие вызовы `useToken()` вернут `false`.\n\nПример:\n\n```java\nString token = tokenService.generateToken();\n\nSystem.out.println(tokenService.useToken(token)); // true\nSystem.out.println(tokenService.getRemainingUses(token)); // 4\n```\n\nПосле пяти успешных использований:\n\n```java\nSystem.out.println(tokenService.useToken(token)); // false\nSystem.out.println(tokenService.getRemainingUses(token)); // 0\n```\n\nДля распределённого приложения, где запущено несколько экземпляров сервиса, состояние токенов нужно хранить во внешнем хранилище, например Redis, а уменьшение счётчика выполнять атомарной операцией.\n\n{{< /details >}}"
  filepath = "token-limited-usage"

[[tasks]]
  id = 3
  question = "Спроектировать и реализовать REST API для управления договорами"
  answer = "**Условие задачи:**  \nНеобходимо спроектировать и реализовать REST API для работы с договорами.\n\nAPI должно поддерживать:\n\n- создание нового договора;\n    \n- получение договора по его уникальному номеру.\n    \n\n**Код:**\n\n```java\npublic class Contract {\n\n    private Long id;\n    private String number;\n    private String clientId;\n    private String status;\n    private Instant createdAt;\n\n    // getters / setters / constructors\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для создания договора используй `POST /api/contracts`.  \n💡 Для получения по номеру — `GET /api/contracts/{number}`.  \n💡 Входные данные лучше принимать через отдельный DTO.  \n💡 Номер договора должен быть уникальным.  \n💡 Для отсутствующего договора возвращай `404`, для дубликата номера — `409`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nDTO для создания договора:\n\n```java\npublic record ContractCreateDto(\n        @NotBlank String number,\n        @NotBlank String clientId\n) {\n}\n```\n\nDTO ответа:\n\n```java\npublic record ContractResponseDto(\n        Long id,\n        String number,\n        String clientId,\n        String status,\n        Instant createdAt\n) {\n}\n```\n\nСервис с хранением данных в памяти:\n\n```java\n@Service\npublic class ContractService {\n\n    private final Map<String, Contract> contracts =\n            new ConcurrentHashMap<>();\n\n    private final AtomicLong idGenerator =\n            new AtomicLong();\n\n    public Contract create(ContractCreateDto request) {\n        Contract contract = new Contract(\n                idGenerator.incrementAndGet(),\n                request.number(),\n                request.clientId(),\n                \"NEW\",\n                Instant.now()\n        );\n\n        Contract existing = contracts.putIfAbsent(\n                contract.getNumber(),\n                contract\n        );\n\n        if (existing != null) {\n            throw new ContractAlreadyExistsException(\n                    request.number()\n            );\n        }\n\n        return contract;\n    }\n\n    public Contract getByNumber(String number) {\n        Contract contract = contracts.get(number);\n\n        if (contract == null) {\n            throw new ContractNotFoundException(number);\n        }\n\n        return contract;\n    }\n}\n```\n\nКонтроллер:\n\n```java\n@RestController\n@RequestMapping(\"/api/contracts\")\npublic class ContractController {\n\n    private final ContractService contractService;\n\n    public ContractController(\n            ContractService contractService\n    ) {\n        this.contractService = contractService;\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public ContractResponseDto create(\n            @Valid @RequestBody ContractCreateDto request\n    ) {\n        return toResponse(\n                contractService.create(request)\n        );\n    }\n\n    @GetMapping(\"/{number}\")\n    public ContractResponseDto getByNumber(\n            @PathVariable String number\n    ) {\n        return toResponse(\n                contractService.getByNumber(number)\n        );\n    }\n\n    private ContractResponseDto toResponse(\n            Contract contract\n    ) {\n        return new ContractResponseDto(\n                contract.getId(),\n                contract.getNumber(),\n                contract.getClientId(),\n                contract.getStatus(),\n                contract.getCreatedAt()\n        );\n    }\n}\n```\n\nОбработка ошибок:\n\n```java\n@RestControllerAdvice\npublic class ContractExceptionHandler {\n\n    @ExceptionHandler(ContractNotFoundException.class)\n    @ResponseStatus(HttpStatus.NOT_FOUND)\n    public String handleNotFound(\n            ContractNotFoundException exception\n    ) {\n        return exception.getMessage();\n    }\n\n    @ExceptionHandler(ContractAlreadyExistsException.class)\n    @ResponseStatus(HttpStatus.CONFLICT)\n    public String handleConflict(\n            ContractAlreadyExistsException exception\n    ) {\n        return exception.getMessage();\n    }\n}\n```\n\nПолучившийся API:\n\n```text\nPOST /api/contracts\nGET  /api/contracts/{number}\n```\n\nСоздание договора возвращает `201 Created`, получение существующего договора — `200 OK`, отсутствие договора — `404 Not Found`, попытка создать договор с уже существующим номером — `409 Conflict`.\n\nПри использовании PostgreSQL уникальность номера дополнительно должна обеспечиваться `UNIQUE`-ограничением в базе данных.\n\n{{< /details >}}"
  filepath = "http-post-contract"

[[tasks]]
  id = 4
  question = "Реализовать REST API для поиска обуви с фильтрацией"
  answer = "**Условие задачи:**  \nНеобходимо реализовать REST API с эндпоинтом:\n\n```text\nPOST /api/v1/search\n```\n\nЭндпоинт принимает параметры фильтрации и возвращает подходящую обувь.\n\nУсловия поиска:\n\n- сапоги — цвет красный или зелёный, цена от `5000` до `20000`;\n    \n- туфли — цена меньше `10000`.\n    \n\nПример запроса:\n\n```json\n{\n  \"type\": \"сапоги\",\n  \"color\": [\"красный\", \"зелёный\"],\n  \"minPrice\": 5000,\n  \"maxPrice\": 20000\n}\n```\n\nПример ответа:\n\n```json\n[\n  {\n    \"type\": \"сапоги\",\n    \"color\": \"красный\",\n    \"price\": 15000,\n    \"url\": \"https://example.com/shoe1\"\n  }\n]\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Создай сущность `Shoe` и DTO для запроса и ответа.  \n💡 Для динамических фильтров удобно использовать `Specification`.  \n💡 Репозиторий можно расширить через `JpaSpecificationExecutor`.  \n💡 Каждый переданный фильтр добавляй только тогда, когда он не равен `null`.  \n💡 Контроллер должен принимать JSON через `@RequestBody`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nСущность:\n\n```java\n@Entity\n@Table(name = \"shoes\")\npublic class Shoe {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    private String type;\n    private String color;\n    private BigDecimal price;\n    private String url;\n\n    // getters / setters\n}\n```\n\nDTO:\n\n```java\npublic record ShoeSearchRequest(\n        String type,\n        List<String> colors,\n        BigDecimal minPrice,\n        BigDecimal maxPrice\n) {\n}\n```\n\n```java\npublic record ShoeResponse(\n        String type,\n        String color,\n        BigDecimal price,\n        String url\n) {\n}\n```\n\nРепозиторий:\n\n```java\npublic interface ShoeRepository\n        extends JpaRepository<Shoe, Long>,\n        JpaSpecificationExecutor<Shoe> {\n}\n```\n\nСервис:\n\n```java\n@Service\npublic class ShoeService {\n\n    private final ShoeRepository shoeRepository;\n\n    public ShoeService(ShoeRepository shoeRepository) {\n        this.shoeRepository = shoeRepository;\n    }\n\n    public List<ShoeResponse> search(\n            ShoeSearchRequest request\n    ) {\n        Specification<Shoe> specification =\n                Specification.where(null);\n\n        if (request.type() != null) {\n            specification = specification.and(\n                    (root, query, cb) ->\n                            cb.equal(root.get(\"type\"), request.type())\n            );\n        }\n\n        if (request.colors() != null\n                && !request.colors().isEmpty()) {\n            specification = specification.and(\n                    (root, query, cb) ->\n                            root.get(\"color\").in(request.colors())\n            );\n        }\n\n        if (request.minPrice() != null) {\n            specification = specification.and(\n                    (root, query, cb) ->\n                            cb.greaterThanOrEqualTo(\n                                    root.get(\"price\"),\n                                    request.minPrice()\n                            )\n            );\n        }\n\n        if (request.maxPrice() != null) {\n            specification = specification.and(\n                    (root, query, cb) ->\n                            cb.lessThanOrEqualTo(\n                                    root.get(\"price\"),\n                                    request.maxPrice()\n                            )\n            );\n        }\n\n        return shoeRepository.findAll(specification)\n                .stream()\n                .map(this::toResponse)\n                .toList();\n    }\n\n    private ShoeResponse toResponse(Shoe shoe) {\n        return new ShoeResponse(\n                shoe.getType(),\n                shoe.getColor(),\n                shoe.getPrice(),\n                shoe.getUrl()\n        );\n    }\n}\n```\n\nКонтроллер:\n\n```java\n@RestController\n@RequestMapping(\"/api/v1\")\npublic class ShoeController {\n\n    private final ShoeService shoeService;\n\n    public ShoeController(ShoeService shoeService) {\n        this.shoeService = shoeService;\n    }\n\n    @PostMapping(\"/search\")\n    public List<ShoeResponse> search(\n            @RequestBody ShoeSearchRequest request\n    ) {\n        return shoeService.search(request);\n    }\n}\n```\n\n`Specification` позволяет динамически формировать запрос только из тех фильтров, которые действительно переданы клиентом.\n\nДля денежных значений используется `BigDecimal`, а не `Double`, чтобы избежать ошибок представления чисел с плавающей точкой.\n\n{{< /details >}}"
  filepath = "shoes-service"

[[tasks]]
  id = 5
  question = "Спроектировать и реализовать REST API для сущностей \"Книги\" и \"Авторы\""
  answer = "**Условие задачи:**  \nНеобходимо спроектировать REST API для работы с книгами и авторами.\n\nВ базе данных используются таблицы:\n\n```text\nbooks\nauthors\nbooks_authors\n```\n\nДля книг необходимо реализовать:\n\n- получение всех книг;\n    \n- получение книги по `id`;\n    \n- создание книги;\n    \n- обновление книги;\n    \n- удаление книги.\n    \n\nТакже нужно описать API в формате:\n\n```text\nGET /some/path 200;\n```\n\nСвязь между книгами и авторами — `Many-to-Many`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для книг и авторов создай отдельные JPA-сущности.  \n💡 Связь можно описать через `@ManyToMany` и таблицу `books_authors`.  \n💡 В REST API лучше использовать DTO, а не возвращать JPA-сущности напрямую.  \n💡 При создании и обновлении книги получай авторов по переданным `authorIds`.  \n💡 Для создания возвращай `201 Created`, для удаления — `204 No Content`.  \n💡 Если книга не найдена — возвращай `404 Not Found`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nREST API:\n\n```text\nGET    /api/books       200;\nGET    /api/books/{id}  200;\nPOST   /api/books       201;\nPUT    /api/books/{id}  200;\nDELETE /api/books/{id}  204;\n```\n\nСущность автора:\n\n```java\n@Entity\n@Table(name = \"authors\")\npublic class AuthorEntity {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    private String name;\n\n    // getters / setters\n}\n```\n\nСущность книги:\n\n```java\n@Entity\n@Table(name = \"books\")\npublic class BookEntity {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    private String title;\n\n    private Integer publishYear;\n\n    @ManyToMany\n    @JoinTable(\n            name = \"books_authors\",\n            joinColumns = @JoinColumn(name = \"book_id\"),\n            inverseJoinColumns = @JoinColumn(name = \"author_id\")\n    )\n    private Set<AuthorEntity> authors = new HashSet<>();\n\n    // getters / setters\n}\n```\n\nDTO для создания и обновления:\n\n```java\npublic record BookRequestDto(\n        @NotBlank String title,\n        @NotNull Integer publishYear,\n        @NotNull Set<Long> authorIds\n) {\n}\n```\n\nDTO ответа:\n\n```java\npublic record BookResponseDto(\n        Long id,\n        String title,\n        Integer publishYear,\n        Set<Long> authorIds\n) {\n}\n```\n\nРепозитории:\n\n```java\npublic interface BookRepository\n        extends JpaRepository<BookEntity, Long> {\n}\n```\n\n```java\npublic interface AuthorRepository\n        extends JpaRepository<AuthorEntity, Long> {\n}\n```\n\nСервис:\n\n```java\n@Service\n@Transactional\npublic class BookService {\n\n    private final BookRepository bookRepository;\n    private final AuthorRepository authorRepository;\n\n    public BookService(\n            BookRepository bookRepository,\n            AuthorRepository authorRepository\n    ) {\n        this.bookRepository = bookRepository;\n        this.authorRepository = authorRepository;\n    }\n\n    @Transactional(readOnly = true)\n    public List<BookResponseDto> getAll() {\n        return bookRepository.findAll()\n                .stream()\n                .map(this::toResponse)\n                .toList();\n    }\n\n    @Transactional(readOnly = true)\n    public BookResponseDto getById(long id) {\n        return toResponse(findBook(id));\n    }\n\n    public BookResponseDto create(BookRequestDto request) {\n        BookEntity book = new BookEntity();\n\n        book.setTitle(request.title());\n        book.setPublishYear(request.publishYear());\n        book.setAuthors(findAuthors(request.authorIds()));\n\n        return toResponse(bookRepository.save(book));\n    }\n\n    public BookResponseDto update(\n            long id,\n            BookRequestDto request\n    ) {\n        BookEntity book = findBook(id);\n\n        book.setTitle(request.title());\n        book.setPublishYear(request.publishYear());\n        book.setAuthors(findAuthors(request.authorIds()));\n\n        return toResponse(book);\n    }\n\n    public void delete(long id) {\n        BookEntity book = findBook(id);\n        bookRepository.delete(book);\n    }\n\n    private BookEntity findBook(long id) {\n        return bookRepository.findById(id)\n                .orElseThrow(() ->\n                        new NoSuchElementException(\n                                \"Book not found: \" + id\n                        )\n                );\n    }\n\n    private Set<AuthorEntity> findAuthors(\n            Set<Long> authorIds\n    ) {\n        List<AuthorEntity> authors =\n                authorRepository.findAllById(authorIds);\n\n        if (authors.size() != authorIds.size()) {\n            throw new NoSuchElementException(\n                    \"One or more authors not found\"\n            );\n        }\n\n        return new HashSet<>(authors);\n    }\n\n    private BookResponseDto toResponse(BookEntity book) {\n        Set<Long> authorIds = book.getAuthors()\n                .stream()\n                .map(AuthorEntity::getId)\n                .collect(Collectors.toSet());\n\n        return new BookResponseDto(\n                book.getId(),\n                book.getTitle(),\n                book.getPublishYear(),\n                authorIds\n        );\n    }\n}\n```\n\nКонтроллер:\n\n```java\n@RestController\n@RequestMapping(\"/api/books\")\npublic class BookController {\n\n    private final BookService bookService;\n\n    public BookController(BookService bookService) {\n        this.bookService = bookService;\n    }\n\n    @GetMapping\n    public List<BookResponseDto> getAll() {\n        return bookService.getAll();\n    }\n\n    @GetMapping(\"/{id}\")\n    public BookResponseDto getById(\n            @PathVariable long id\n    ) {\n        return bookService.getById(id);\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public BookResponseDto create(\n            @Valid @RequestBody BookRequestDto request\n    ) {\n        return bookService.create(request);\n    }\n\n    @PutMapping(\"/{id}\")\n    public BookResponseDto update(\n            @PathVariable long id,\n            @Valid @RequestBody BookRequestDto request\n    ) {\n        return bookService.update(id, request);\n    }\n\n    @DeleteMapping(\"/{id}\")\n    @ResponseStatus(HttpStatus.NO_CONTENT)\n    public void delete(\n            @PathVariable long id\n    ) {\n        bookService.delete(id);\n    }\n}\n```\n\nОбработка `404`:\n\n```java\n@RestControllerAdvice\npublic class ApiExceptionHandler {\n\n    @ExceptionHandler(NoSuchElementException.class)\n    @ResponseStatus(HttpStatus.NOT_FOUND)\n    public String handleNotFound(\n            NoSuchElementException exception\n    ) {\n        return exception.getMessage();\n    }\n}\n```\n\nПри создании и обновлении книги список `authorIds` преобразуется в набор сущностей `AuthorEntity`, а Hibernate самостоятельно поддерживает записи в таблице `books_authors`.\n\nДля операций, изменяющих книгу и её связи с авторами, используется одна транзакция.\n\n{{< /details >}}"
  filepath = "crud-books"

[[tasks]]
  id = 6
  question = "Переименовать JSON-поле с сохранением обратной совместимости"
  answer = "**Условие задачи:**  \nНеобходимо изменить название поля в JSON с `title` на `name`, сохранив обратную совместимость.\n\nСтарые клиенты должны продолжать отправлять:\n\n```json\n{\n  \"title\": \"...\"\n}\n```\n\nНовые клиенты должны использовать:\n\n```json\n{\n  \"name\": \"...\"\n}\n```\n\nПри сериализации ответа необходимо использовать новое название `name`.\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Новое основное имя поля можно задать через `@JsonProperty`.  \n💡 Старое имя можно оставить для десериализации через `@JsonAlias`.  \n💡 `@JsonAlias` влияет на чтение JSON, но не меняет имя поля при сериализации.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic class BookDto {\n\n    @JsonProperty(\"name\")\n    @JsonAlias(\"title\")\n    private String name;\n\n    public String getName() {\n        return name;\n    }\n\n    public void setName(String name) {\n        this.name = name;\n    }\n}\n```\n\nТеперь оба входных варианта будут корректно десериализованы:\n\n```json\n{\n  \"name\": \"Clean Code\"\n}\n```\n\nи:\n\n```json\n{\n  \"title\": \"Clean Code\"\n}\n```\n\nВ обоих случаях значение попадёт в поле:\n\n```java\nprivate String name;\n```\n\nПри сериализации объекта наружу Jackson будет использовать новое имя:\n\n```json\n{\n  \"name\": \"Clean Code\"\n}\n```\n\nТаким образом, `@JsonProperty(\"name\")` задаёт актуальное имя поля, а `@JsonAlias(\"title\")` позволяет временно поддерживать старый контракт API.\n\n{{< /details >}}"
  filepath = "rename-attribute"

[[tasks]]
  id = 7
  question = "Реализовать расширяемый сервис отправки уведомлений"
  answer = "**Условие задачи:**  \nНеобходимо реализовать сервис `Notificator`, который отправляет сообщение через несколько внешних сервисов, например Email и SMS.\n\nПри добавлении нового канала уведомлений код `Notificator` не должен изменяться.\n\n**Код:**\n\n```java\npublic class EmailNotificationService {\n\n    public void sendEmail(String message) {\n        System.out.println(\"Send from email service\");\n        System.out.println(message);\n    }\n}\n\npublic class SmsNotificationService {\n\n    public void sendSms(String message) {\n        System.out.println(\"Send from sms service\");\n        System.out.println(message);\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Введи общий интерфейс для всех каналов уведомлений.  \n💡 Внешние библиотеки можно обернуть адаптерами.  \n💡 Spring умеет внедрять сразу `List` всех бинов одного интерфейса.  \n💡 Внешние сервисы также нужно зарегистрировать как Spring-бины.  \n💡 Для добавления нового канала достаточно создать новую реализацию интерфейса.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nОбщий интерфейс:\n\n```java\npublic interface NotificationService {\n\n    void send(String message);\n}\n```\n\nАдаптер для Email:\n\n```java\n@Service\npublic class EmailNotificationAdapter\n        implements NotificationService {\n\n    private final EmailNotificationService emailService;\n\n    public EmailNotificationAdapter(\n            EmailNotificationService emailService\n    ) {\n        this.emailService = emailService;\n    }\n\n    @Override\n    public void send(String message) {\n        emailService.sendEmail(message);\n    }\n}\n```\n\nАдаптер для SMS:\n\n```java\n@Service\npublic class SmsNotificationAdapter\n        implements NotificationService {\n\n    private final SmsNotificationService smsService;\n\n    public SmsNotificationAdapter(\n            SmsNotificationService smsService\n    ) {\n        this.smsService = smsService;\n    }\n\n    @Override\n    public void send(String message) {\n        smsService.sendSms(message);\n    }\n}\n```\n\nРегистрация классов внешних библиотек:\n\n```java\n@Configuration\npublic class NotificationConfiguration {\n\n    @Bean\n    public EmailNotificationService emailNotificationService() {\n        return new EmailNotificationService();\n    }\n\n    @Bean\n    public SmsNotificationService smsNotificationService() {\n        return new SmsNotificationService();\n    }\n}\n```\n\nСервис отправки уведомлений:\n\n```java\n@Service\npublic class Notificator {\n\n    private final List<NotificationService> channels;\n\n    public Notificator(\n            List<NotificationService> channels\n    ) {\n        this.channels = channels;\n    }\n\n    public void notifyAll(String message) {\n        for (NotificationService channel : channels) {\n            channel.send(message);\n        }\n    }\n}\n```\n\nSpring автоматически передаст в `List<NotificationService>` все зарегистрированные реализации интерфейса.\n\nЧтобы добавить новый канал, например Telegram, достаточно создать новый адаптер:\n\n```java\n@Service\npublic class TelegramNotificationAdapter\n        implements NotificationService {\n\n    @Override\n    public void send(String message) {\n        // отправка сообщения\n    }\n}\n```\n\nИзменять `Notificator` при этом не потребуется.\n\nЗдесь используется паттерн Adapter для приведения разных внешних API к общему интерфейсу и соблюдается принцип Open/Closed: систему можно расширять новыми каналами без изменения основной логики.\n\n{{< /details >}}"
  filepath = "notification-service"

[[tasks]]
  id = 8
  question = "Обеспечить выполнение метода в новой транзакции через Spring-прокси"
  answer = "**Условие задачи:**  \nДан сервис с двумя транзакционными методами. Метод `methodB()` должен выполняться в отдельной транзакции с `Propagation.REQUIRES_NEW`.\n\nПри прямом вызове `methodB()` из `methodA()` вызов не проходит через Spring-прокси, поэтому новая транзакция не создаётся.\n\n**Код:**\n\n```java\n@Service\npublic class TransactionService {\n\n    @Transactional\n    public void methodA() {\n        methodB();\n    }\n\n    @Transactional(\n            propagation = Propagation.REQUIRES_NEW\n    )\n    public void methodB() {\n        // some logic\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `@Transactional` в стандартном proxy-режиме применяется при вызове через Spring-прокси.  \n💡 Вызов `this.methodB()` является self-invocation и обходит прокси.  \n💡 Можно получить прокси текущего объекта через `AopContext`.  \n💡 Другой вариант — внедрить прокси самого сервиса через `@Lazy`.  \n💡 Для `AopContext.currentProxy()` необходимо включить `exposeProxy = true`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nВариант через `AopContext`:\n\n```java\n@Service\npublic class TransactionService {\n\n    @Transactional\n    public void methodA() {\n        TransactionService proxy =\n                (TransactionService) AopContext.currentProxy();\n\n        proxy.methodB();\n    }\n\n    @Transactional(\n            propagation = Propagation.REQUIRES_NEW\n    )\n    public void methodB() {\n        // выполнение в новой транзакции\n    }\n}\n```\n\nДля доступа к текущему прокси необходимо включить его публикацию:\n\n```java\n@Configuration\n@EnableTransactionManagement\n@EnableAspectJAutoProxy(exposeProxy = true)\npublic class AppConfig {\n}\n```\n\nТеперь вызов:\n\n```java\nproxy.methodB();\n```\n\nпроходит через Spring AOP, поэтому `REQUIRES_NEW` срабатывает.\n\nТранзакция `methodA()` временно приостанавливается, создаётся новая транзакция для `methodB()`, а после её завершения продолжается первая транзакция.\n\nАльтернативный вариант — self-injection:\n\n```java\n@Service\npublic class TransactionService {\n\n    private final TransactionService self;\n\n    public TransactionService(\n            @Lazy TransactionService self\n    ) {\n        this.self = self;\n    }\n\n    @Transactional\n    public void methodA() {\n        self.methodB();\n    }\n\n    @Transactional(\n            propagation = Propagation.REQUIRES_NEW\n    )\n    public void methodB() {\n        // выполнение в новой транзакции\n    }\n}\n```\n\nЗдесь `self` содержит ссылку на Spring-прокси, поэтому вызов `methodB()` также перехватывается транзакционным interceptor.\n\nНа практике ещё более простым вариантом часто является вынесение `methodB()` в отдельный Spring-сервис и вызов его через внедрённый бин.\n\n{{< /details >}}"
  filepath = "transaction-proxy"

[[tasks]]
  id = 9
  question = "Получить ID сущностей через Spring Data JPA  "
  answer = "**Условие задачи:**  \nВ репозитории `HeavyDataRepository` необходимо реализовать метод, который возвращает список только идентификаторов сущностей `HeavyData`, не загружая объекты целиком.\n\n**Код:**\n\n```java\npublic interface HeavyDataRepository\n        extends JpaRepository<HeavyData, Integer> {\n\n    List<Integer> getHeavyDataIds();\n\n    List<HeavyData> findAllByIsActive(Boolean isActive);\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Для выборки отдельных полей можно использовать `@Query`.  \n💡 В JPQL нужно обращаться к сущности и её полям, а не к таблице.  \n💡 Запрос `select h.id from HeavyData h` загрузит только значения `id`.  \n💡 Возвращаемый тип должен соответствовать типу поля `id`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\npublic interface HeavyDataRepository\n        extends JpaRepository<HeavyData, Integer> {\n\n    @Query(\"select h.id from HeavyData h\")\n    List<Integer> getHeavyDataIds();\n\n    List<HeavyData> findAllByIsActive(Boolean isActive);\n}\n```\n\nJPQL-запрос:\n\n```java\n@Query(\"select h.id from HeavyData h\")\n```\n\nвыбирает только поле `id`, поэтому Hibernate не создаёт и не загружает целиком объекты `HeavyData`.\n\nЕсли необходимо использовать нативный SQL:\n\n```java\n@Query(\n        value = \"select id from heavy_data\",\n        nativeQuery = true\n)\nList<Integer> getHeavyDataIds();\n```\n\nДля JPQL используется имя сущности `HeavyData`, а для нативного SQL — реальное имя таблицы в базе данных.\n\n{{< /details >}}"
  filepath = "heavydata-repo"

[[tasks]]
  id = 10
  question = "Обеспечить создание транзакции при внутреннем вызове через self-inject"
  answer = "**Условие задачи:**  \nДан Spring-сервис с двумя методами: `a()` и `b()`.\n\nМетод `a()` помечен `@Transactional`, а из метода `b()` выполняется внутренний вызов `a()`.\n\nНеобходимо определить, сколько транзакций будет создано при внешнем вызове `b()`, и исправить код с помощью self-injection так, чтобы `a()` вызывался через Spring-прокси.\n\n**Код:**\n\n```java\n@Service\nclass SomeService {\n\n    @Transactional\n    public void a() {\n    }\n\n    public void b() {\n        a();\n    }\n}\n```\n\nВызов:\n\n```java\nsomeService.b();\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Метод `b()` не помечен `@Transactional`.  \n💡 Вызов `a()` внутри того же объекта является self-invocation.  \n💡 Такой вызов не проходит через Spring-прокси.  \n💡 Нужно получить прокси текущего сервиса и вызвать `a()` через него.  \n💡 При self-injection удобно использовать `@Lazy`, чтобы избежать циклической зависимости при создании бина.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nПри обычном вызове:\n\n```java\nsomeService.b();\n```\n\nбудет создано **0 транзакций**.\n\nМетод `b()` сам не является транзакционным, а вызов:\n\n```java\na();\n```\n\nфактически выполняется как:\n\n```java\nthis.a();\n```\n\nОн не проходит через Spring-прокси, поэтому `@Transactional` на `a()` не срабатывает.\n\nВариант с self-injection:\n\n```java\n@Service\npublic class SomeService {\n\n    private final SomeService self;\n\n    public SomeService(\n            @Lazy SomeService self\n    ) {\n        this.self = self;\n    }\n\n    @Transactional\n    public void a() {\n        // работа в транзакции\n    }\n\n    public void b() {\n        self.a();\n    }\n}\n```\n\nТеперь вызов:\n\n```java\nself.a();\n```\n\nпроходит через Spring-прокси. Аннотация `@Transactional` перехватывается транзакционным interceptor, и для метода `a()` создаётся транзакция.\n\nВ результате при вызове:\n\n```java\nsomeService.b();\n```\n\nбудет создана **1 транзакция** — для метода `a()`.\n\n{{< /details >}}"
  filepath = "self-injection"

[[tasks]]
  id = 11
  question = "Собрать DTO экрана корзины в BFF"
  answer = "**Условие задачи:**  \nНеобходимо реализовать BFF-сервис для экрана корзины.\n\nСервис должен получить корзину пользователя и рекомендации из двух внешних сервисов, объединить данные и вернуть единый DTO для клиентского приложения.\n\n**Код:**\n\n```java\n@FeignClient(\n        name = \"cart-service\",\n        url = \"http://shopping-cart\"\n)\npublic interface ShoppingCartServiceClient {\n\n    @GetMapping(\"/api/v1/shopping-cart\")\n    CartDto getClientCart();\n}\n\n@FeignClient(\n        name = \"recommendations-service\",\n        url = \"http://recommendations\"\n)\npublic interface RecommendationsServiceClient {\n\n    @GetMapping(\"/api/v1/recommendations\")\n    List<RecommendationDto> getClientRecommendations();\n}\n\npublic record ClientCartScreenDto(\n        CartDto cart,\n        List<RecommendationDto> recommendations\n) {\n}\n\n@Service\npublic class ClientCartScreenService {\n\n    public ClientCartScreenDto getScreenData() {\n        // код тут\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Внедри оба Feign-клиента через конструктор.  \n💡 Получи корзину с помощью `getClientCart()`.  \n💡 Получи рекомендации с помощью `getClientRecommendations()`.  \n💡 Объедини результаты в `ClientCartScreenDto`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\n```java\n@Service\npublic class ClientCartScreenService {\n\n    private final ShoppingCartServiceClient cartClient;\n    private final RecommendationsServiceClient recommendationsClient;\n\n    public ClientCartScreenService(\n            ShoppingCartServiceClient cartClient,\n            RecommendationsServiceClient recommendationsClient\n    ) {\n        this.cartClient = cartClient;\n        this.recommendationsClient = recommendationsClient;\n    }\n\n    public ClientCartScreenDto getScreenData() {\n        CartDto cart = cartClient.getClientCart();\n\n        List<RecommendationDto> recommendations =\n                recommendationsClient.getClientRecommendations();\n\n        return new ClientCartScreenDto(cart, recommendations);\n    }\n}\n```\n\nBFF вызывает два внешних сервиса и формирует DTO со всеми данными, необходимыми для отображения экрана корзины.\n\n{{< /details >}}"
  filepath = "bff-cart-screen-dto"

[[tasks]]
  id = 12
  question = "Ускорить BFF параллельными вызовами"
  answer = "**Условие задачи:**  \nBFF обращается к двум внешним сервисам:\n\n- `cart-service` отвечает примерно за 0.7 секунды;\n    \n- `recommendations-service` отвечает примерно за 0.5 секунды.\n    \n\nПри последовательном выполнении запрос занимает около 1.2 секунды. Необходимо выполнять вызовы параллельно и возвращать ответ менее чем за одну секунду.\n\n**Код:**\n\n```java\n@FeignClient(\n        name = \"cart-service\",\n        url = \"http://shopping-cart\"\n)\npublic interface ShoppingCartServiceClient {\n\n    @GetMapping(\"/api/v1/shopping-cart\")\n    CartDto getClientCart();\n}\n\n@FeignClient(\n        name = \"recommendations-service\",\n        url = \"http://recommendations\"\n)\npublic interface RecommendationsServiceClient {\n\n    @GetMapping(\"/api/v1/recommendations\")\n    List<RecommendationDto> getClientRecommendations();\n}\n\npublic record ClientCartScreenDto(\n        CartDto cart,\n        List<RecommendationDto> recommendations\n) {\n}\n\n@Service\npublic class ClientCartScreenService {\n\n    public ClientCartScreenDto getScreenData() {\n        // код тут\n    }\n}\n```\n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Запусти оба запроса до ожидания результата.  \n💡 Для параллельного выполнения можно использовать `CompletableFuture`.  \n💡 Для блокирующих Feign-вызовов используй отдельный пул потоков.  \n💡 Установи тайм-ауты, не превышающие общий SLA.  \n💡 При ошибке сервиса рекомендаций можно вернуть пустой список.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nСоздадим отдельный пул потоков для блокирующих запросов:\n\n```java\n@Configuration\npublic class BffExecutorConfig {\n\n    @Bean(\"bffExecutor\")\n    public Executor bffExecutor() {\n        ThreadPoolTaskExecutor executor =\n                new ThreadPoolTaskExecutor();\n\n        executor.setCorePoolSize(10);\n        executor.setMaxPoolSize(20);\n        executor.setQueueCapacity(100);\n        executor.setThreadNamePrefix(\"bff-\");\n        executor.initialize();\n\n        return executor;\n    }\n}\n```\n\nРеализация сервиса:\n\n```java\n@Service\npublic class ClientCartScreenService {\n\n    private final ShoppingCartServiceClient cartClient;\n    private final RecommendationsServiceClient recommendationsClient;\n    private final Executor executor;\n\n    public ClientCartScreenService(\n            ShoppingCartServiceClient cartClient,\n            RecommendationsServiceClient recommendationsClient,\n            @Qualifier(\"bffExecutor\") Executor executor\n    ) {\n        this.cartClient = cartClient;\n        this.recommendationsClient = recommendationsClient;\n        this.executor = executor;\n    }\n\n    public ClientCartScreenDto getScreenData() {\n        CompletableFuture<CartDto> cartFuture =\n                CompletableFuture.supplyAsync(\n                                cartClient::getClientCart,\n                                executor\n                        )\n                        .orTimeout(\n                                900,\n                                TimeUnit.MILLISECONDS\n                        );\n\n        CompletableFuture<List<RecommendationDto>>\n                recommendationsFuture =\n                CompletableFuture.supplyAsync(\n                                recommendationsClient\n                                        ::getClientRecommendations,\n                                executor\n                        )\n                        .completeOnTimeout(\n                                List.of(),\n                                700,\n                                TimeUnit.MILLISECONDS\n                        )\n                        .exceptionally(error -> List.of());\n\n        CartDto cart = cartFuture.join();\n\n        List<RecommendationDto> recommendations =\n                recommendationsFuture.join();\n\n        return new ClientCartScreenDto(\n                cart,\n                recommendations\n        );\n    }\n}\n```\n\nОба запроса запускаются до вызова `join()`, поэтому выполняются параллельно. Общее время ответа будет примерно равно времени самого медленного запроса, а не сумме времени двух запросов.\n\nКорзина является обязательной частью экрана, поэтому ошибка её получения прерывает выполнение. Рекомендации являются дополнительными данными: при ошибке или превышении тайм-аута возвращается пустой список.\n\nДля Feign-клиентов также необходимо настроить сетевые `connect timeout` и `read timeout`. Тайм-аут `CompletableFuture` ограничивает ожидание результата, но не гарантирует остановку самого HTTP-запроса.\n\n{{< /details >}}"
  filepath = "bff-parallel-cart-and-recommendations"

[[tasks]]
  id = 13
  question = "Получить все записи из таблицы Demands"
  answer = "**Условие задачи:**  \nВ базе данных есть таблица `demands`. Необходимо реализовать REST-эндпоинт, который вернёт все записи из этой таблицы.\n\n```text\nDemands\n+----+-------+--------+\n| id | name  | status |\n+----+-------+--------+\n| 1  | name1 | GOOD   |\n| 2  | name2 |        |\n| 3  | name3 |        |\n| 4  | name4 |        |\n+----+-------+--------+\n```\n\nНужно реализовать минимальный набор компонентов:\n\n- JPA-сущность;\n    \n- репозиторий;\n    \n- REST-контроллер.\n    \n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 Пометь класс `Demand` аннотациями `@Entity` и `@Table`.  \n💡 Репозиторий можно унаследовать от `JpaRepository<Demand, Long>`.  \n💡 Метод `findAll()` уже определён в `JpaRepository`.  \n💡 В контроллере создай обработчик `GET /api/v1/demands`.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nСущность:\n\n```java\n@Entity\n@Table(name = \"demands\")\npublic class Demand {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    private String name;\n\n    private String status;\n\n    protected Demand() {\n    }\n\n    public Demand(String name, String status) {\n        this.name = name;\n        this.status = status;\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public String getName() {\n        return name;\n    }\n\n    public String getStatus() {\n        return status;\n    }\n}\n```\n\nРепозиторий:\n\n```java\npublic interface DemandRepository\n        extends JpaRepository<Demand, Long> {\n}\n```\n\nКонтроллер:\n\n```java\n@RestController\n@RequestMapping(\"/api/v1/demands\")\npublic class DemandController {\n\n    private final DemandRepository demandRepository;\n\n    public DemandController(\n            DemandRepository demandRepository\n    ) {\n        this.demandRepository = demandRepository;\n    }\n\n    @GetMapping\n    public List<Demand> getAllDemands() {\n        return demandRepository.findAll();\n    }\n}\n```\n\nЗапрос:\n\n```http\nGET /api/v1/demands\n```\n\nПример ответа:\n\n```json\n[\n  {\n    \"id\": 1,\n    \"name\": \"name1\",\n    \"status\": \"GOOD\"\n  },\n  {\n    \"id\": 2,\n    \"name\": \"name2\",\n    \"status\": \"\"\n  }\n]\n```\n\nМетод `findAll()` выполняет получение всех строк таблицы и возвращает их в виде списка.\n\n{{< /details >}}"
  filepath = "rest-get-all-demands"

[[tasks]]
  id = 14
  question = "Разобраться с транзакциями при self-invocation"
  answer = "**Условие задачи:**  \nДан сервис с двумя транзакционными методами:\n\n```java\n@Service\nclass SomeService {\n\n    @Transactional(\n            propagation = Propagation.REQUIRES_NEW\n    )\n    public void a() {\n    }\n\n    @Transactional\n    public void b() {\n        a();\n    }\n}\n```\n\nМетод `b()` вызывается через Spring-бин:\n\n```java\nsomeService.b();\n```\n\nНеобходимо ответить:\n\n1. Сколько транзакций будет создано?\n    \n2. Почему `REQUIRES_NEW` на методе `a()` не срабатывает?\n    \n3. Как сделать так, чтобы метод `a()` выполнялся в новой транзакции?\n    \n\n---\n\n{{< hint warning >}}  \n**Спойлеры к решению**  \n{{< /hint >}}\n\n---\n\n{{< details \"Подсказки\" close >}}  \n💡 `@Transactional` обычно работает через Spring AOP-прокси.  \n💡 Внешний вызов метода бина проходит через прокси.  \n💡 Внутренний вызов метода того же объекта называется self-invocation.  \n💡 Вызов `a()` внутри `b()` фактически выполняется как `this.a()`.  \n💡 Надёжнее всего вынести `a()` в отдельный Spring-бин.  \n{{< /details >}}\n\n---\n\n{{< details \"Решение\" close >}}\n\nПри вызове `b()` будет создана одна транзакция.\n\nВнешний вызов `b()` проходит через Spring-прокси, поэтому аннотация `@Transactional` срабатывает и открывает транзакцию.\n\nВызов `a()` происходит внутри того же объекта:\n\n```java\npublic void b() {\n    this.a();\n}\n```\n\nТакой вызов не проходит через прокси. Поэтому настройки `Propagation.REQUIRES_NEW` не применяются, а метод `a()` выполняется внутри транзакции метода `b()`.\n\nПредпочтительный вариант — вынести метод `a()` в отдельный сервис:\n\n```java\n@Service\npublic class AService {\n\n    @Transactional(\n            propagation = Propagation.REQUIRES_NEW\n    )\n    public void a() {\n        // код\n    }\n}\n```\n\n```java\n@Service\npublic class SomeService {\n\n    private final AService aService;\n\n    public SomeService(AService aService) {\n        this.aService = aService;\n    }\n\n    @Transactional\n    public void b() {\n        aService.a();\n    }\n}\n```\n\nТеперь вызов `aService.a()` проходит через прокси другого Spring-бина.\n\nВ результате:\n\n1. для `b()` создаётся первая транзакция;\n    \n2. перед выполнением `a()` первая транзакция приостанавливается;\n    \n3. для `a()` создаётся новая независимая транзакция;\n    \n4. после завершения `a()` продолжается транзакция метода `b()`.\n    \n\nАльтернативный вариант — вызвать метод через прокси текущего сервиса:\n\n```java\n@Service\npublic class SomeService {\n\n    private final SomeService self;\n\n    public SomeService(\n            @Lazy SomeService self\n    ) {\n        this.self = self;\n    }\n\n    @Transactional(\n            propagation = Propagation.REQUIRES_NEW\n    )\n    public void a() {\n        // код\n    }\n\n    @Transactional\n    public void b() {\n        self.a();\n    }\n}\n```\n\nТакой подход работает, но усложняет структуру класса. Обычно отдельный сервис является более понятным решением.\n\n{{< /details >}}"
  filepath = "transactions-self-invocation"
