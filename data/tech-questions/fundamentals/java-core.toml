  question = "Что такое абстрактные классы?"
  answer = "Абстрактный класс - это класс, который не может быть инстанциирован (нельзя создать экземпляр этого класса). Используется для того, чтобы выделить общую логику (абстракцию) и переиспользовать в наследниках.\n\n**Может ли быть абстрактный класс без абстрактных методов?**\nДа, может\n\n**Могут ли быть конструкторы у абстрактных классов? Для чего они нужны?**\nДа, могут, если они нужны для наследников"
