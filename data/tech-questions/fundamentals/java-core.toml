  question = "Integer pool"
  answer = "`Integer.valueOf(int)` кэширует объекты для значений от **−128 до 127 включительно**. Реализация может кэшировать и другие значения. В HotSpot верхнюю границу можно увеличить. `IntegerCache` — внутренняя реализация кэша объектов.\n\nДля boxing спецификация языка гарантирует совпадение ссылок для одинаковых значений `int` в этом диапазоне, если значения получены из константных выражений. Для сравнения значений двух `Integer` используют `equals()` или распаковку и числовое сравнение, когда оба значения заведомо ненулевые."
