[[questions]]
  id = 30
  question = "Что такое интерфейсы?"
  answer = "\nИнтерфейс описывает контракт. Класс может реализовать несколько интерфейсов.\n\n**Какие модификаторы по умолчанию имеют поля и методы интерфейсов?**\n\nПоле интерфейса неявно `public static final`. Метод без тела, объявленный без специальных модификаторов, неявно `public abstract`. С Java 8 есть `default`- и `static`-методы с реализацией, с Java 9 также разрешены `private`-методы с телом.\n\n**Может ли один интерфейс наследоваться от другого? От двух других?**\n\nДа. Интерфейс может указать несколько базовых интерфейсов через `extends`, если их контракты совместимы.\n\n**Зачем нужны интерфейсы-маркеры?**\n\nМаркер без собственных методов обозначает свойство типа. Например, `Serializable` используется стандартной сериализацией, а `Cloneable` влияет на работу `Object.clone()` и сам метод `clone()` не объявляет. Маркер можно проверять через `instanceof` или использовать как ограничение типа.\n\n**Плюсы и минусы дефолтных методов**\n\n`default` даёт общую реализацию и позволяет добавлять поведение в интерфейс. Если два независимых интерфейса дают один и тот же метод по умолчанию, класс должен явно разрешить конфликт.\n\n**Плюсы и минусы множественной имплементации**\n\nКласс может реализовать несколько контрактов. При конфликтующих объявлениях нужно проверить совместимость сигнатур и выбрать реализацию. Например:\n\n```java\ninterface A { default String name() { return \"A\"; } }\ninterface B { default String name() { return \"B\"; } }\n\nclass C implements A, B {\n    @Override\n    public String name() {\n        return A.super.name();\n    }\n}\n```\n"
  popularity = 2.41

