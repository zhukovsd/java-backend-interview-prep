[[questions]]
  id = 7
  question = "Плюсы и минусы Java?"
  answer = "**Плюсы Java** — переносимость байт-кода между совместимыми JVM, статическая типизация, автоматическое управление памятью, развитая экосистема и инструменты многопоточности.\n\n**Компромиссы** — запуск и прогрев JVM, расход памяти и возможные паузы GC. Их влияние зависит от приложения, JVM и выбранного сборщика.\n\nВстроенная CORBA удалена в JDK 11, а Security Manager окончательно отключён в JDK 24. Условия использования проверяют для конкретного дистрибутива и версии JDK."
  popularity = 0.0

[[questions]]
  id = 8
  question = "JVM, JRE, JDK, JIT"
  answer = "- **JVM** исполняет байт-код и управляет выполнением Java-программы.\n- **JRE** — среда выполнения, то есть JVM и библиотеки, нужные программе при запуске. Начиная с Java 11 Oracle перестала отдельно поставлять JRE. Формат поставки зависит от дистрибутива.\n- **JDK** содержит среду выполнения и инструменты разработки, например `javac`, `javadoc` и `jlink`. С помощью `jlink` можно собрать модульный образ среды с нужными модулями.\n- **JIT** компилирует байт-код в машинный код во время выполнения. HotSpot использует данные профилирования для оптимизации часто исполняемых участков.\n"
  popularity = 3.01

[[questions]]
  id = 9
  question = "Что такое байт-код?"
  answer = "Байт-код - это набор инструкций, исполняемый JVM, получаются из исходного кода путём компиляции."
  popularity = 0.9

[[questions]]
  id = 10
  question = "Что такое сборщик мусора (garbage collector)?"
  answer = "**Сборщик мусора** освобождает память объектов, которые больше не достижимы для приложения. Он может работать частично параллельно с приложением. Конкретный алгоритм определяет компромисс между пропускной способностью, паузами и расходом ресурсов.\n\n| Версия OpenJDK | Что изменилось |\n|---|---|\n| 8 | На серверных конфигурациях HotSpot обычно по умолчанию использовался Parallel GC |\n| 9 | G1 стал сборщиком по умолчанию для серверных конфигураций |\n| 11 | ZGC появился как экспериментальный |\n| 12 | Shenandoah появился как экспериментальный в mainline OpenJDK |\n| 14 | CMS удалён |\n| 15 | ZGC и Shenandoah переведены в production |\n| 21 | Добавлен Generational ZGC |\n| 23 | Поколенческий режим ZGC стал режимом по умолчанию |\n| 24 | Непоколенческий режим ZGC удалён |\n\n**Когда использовать другие GC?**\n\nG1 подходит для многих серверных приложений. Parallel GC стоит рассмотреть, если важна пропускная способность и допустимы более длинные паузы. ZGC и Shenandoah ориентированы на короткие паузы. Serial GC подходит для небольшой кучи или среды с ограниченными ресурсами. Сравнивать варианты нужно на своей нагрузке и в той сборке JDK, которая будет использоваться.\n"
  popularity = 7.83

[[questions]]
  id = 11
  question = "Как работает GC?"
  answer = "Сборщик определяет достижимость от корней GC, например от активных ссылок потоков. Недостижимые объекты могут быть собраны. В зависимости от алгоритма сборка может включать маркировку, освобождение памяти, эвакуацию живых объектов или уплотнение. Не все сборщики используют одинаковые фазы.\nПоколенческий сборщик делит объекты на молодое и старшее поколения, опираясь на то, что большинство объектов живут недолго. Исторический PermGen в HotSpot хранил служебные данные классов и с Java 8 заменён Metaspace.\n"
  popularity = 12.95

[[questions]]
  id = 12
  question = "Какие виды GC знаешь?"
  answer = "- **Serial GC** — простой однопоточный сборщик мусора, который хорошо подходит для маленьких приложений и небольшого объёма памяти.\n- **Parallel GC (Throughput GC)** — многопоточный сборщик, который делает упор на максимальную производительность приложения.\n- **CMS (Concurrent Mark Sweep)** — сборщик с низкими паузами, который пытался выполнять часть работы параллельно с приложением, но сейчас считается устаревшим.\n- **G1 GC (Garbage First)** — универсальный сборщик, который балансирует между скоростью работы и предсказуемыми паузами.\n- **ZGC** — современный сборщик для приложений, где важны ультранизкие паузы, обычно в пределах миллисекунд.\n- **Shenandoah** — low-latency сборщик, похожий по назначению на ZGC, тоже старается минимизировать паузы приложения.\n- **Epsilon GC** — специальный сборщик, который вообще не освобождает память и используется в основном для тестов и бенчмарков."
  popularity = 6.63

[[questions]]
  id = 13
  question = "Области памяти Java. Stack и heap. Что это такое?"
  answer = "{{< figure src=\"/java-backend-interview-prep/jvm_memory_structure.png\" title=\"\" >}}\n\n- **Heap** — общая для потоков область объектов и массивов. Управляется GC. Базовая модель JVMS не требует фиксированного деления кучи на поколения.\n- **Стек JVM** — у каждого потока свой стек кадров вызова. Кадр содержит локальные переменные и стек операндов. Локальная переменная может хранить ссылку на объект из heap. JIT может устранять выделение некоторых объектов.\n- **Method area** — логическая область данных классов в JVMS. В HotSpot метаданные классов размещаются преимущественно в Metaspace (нативная память), скомпилированный машинный код — в Code Cache, значения статических полей находятся в объекте-классе в heap. Metaspace можно ограничить через `-XX:MaxMetaspaceSize`.\n- **PC register** хранит позицию текущей Java-инструкции потока. **Native method stacks** используются для нативных вызовов, если реализация их поддерживает.\n\n**Как работают Survivor?** В сборщиках HotSpot с классическими двумя Survivor-областями роли from и to меняются при сборках. Объект может копироваться между ними и при достижении порога возраста или при нехватке места переходить в старшее поколение. У других сборщиков разметка кучи может отличаться.\n\n"
  popularity = 15.96

[[questions]]
  id = 14
  question = "Типы данных в Java"
  answer = "В Java есть примитивные и ссылочные типы данных.\n\n**Примитивные типы данных:**\n- byte (0) (8 бит)\n- short (0) (16 бит)\n- int (0) (32 бит)\n- long (0L) (64 бит)\n- float (0.0f) (32 бит)\n- double (0.0d) (64 бит)\n- char (\\u0000) (16 бит)\n- boolean (false) (зависит от JVM)\n\n"
  popularity = 0.9

[[questions]]
  id = 15
  question = "Что такое класс-обертка?"
  answer = "Классы-обёртки, например `Integer`, `Boolean`, `Double`, представляют значения примитивов как объекты. Они неизменяемы и используются, например, в коллекциях и обобщённых типах. Переменная ссылочного типа может содержать `null`. Если выполнить автораспаковку такой ссылки, JVM выбросит `NullPointerException`. У обёрток есть служебные методы и константы, например `Integer.parseInt()` и `Integer.MAX_VALUE`.\n"
  popularity = 2.41

[[questions]]
  id = 16
  question = "Автоупаковка и автораспаковка"
  answer = "Автоупаковка (autoboxing) - примитивный тип -> класс-обёртка\n```java\nint x = 10;  \nInteger obj = x;\n```\n\nАвтораспаковка (unboxing) -  класс-обёртка -> примитивный тип\n```java\nInteger obj = 10;  \nint x = obj;\n```"
  popularity = 0.3

[[questions]]
  id = 17
  question = "Строки/String в Java? Из чего состоит? Нюансы"
  answer = "`String` — неизменяемая последовательность символов. `==` проверяет, ссылаются ли две переменные на один объект. `equals()` сравнивает содержимое строк.\n\nВ OpenJDK с Java 9 механизм Compact Strings хранит данные в закрытом `byte[]` и использует признак кодировки `coder`. Если все символы помещаются в Latin‑1, хватает одного байта на символ. В остальных случаях используется внутреннее представление UTF‑16. Это деталь реализации OpenJDK.\n\nНеизменяемость обеспечивается всем контрактом класса. `String` нельзя наследовать, внутренний массив не выдаётся вызывающему коду, а операции вроде `replace()` возвращают результат без изменения исходной строки.\n"
  popularity = 6.63

[[questions]]
  id = 18
  question = "Что такое пул строк/String pool?"
  answer = "Пул строк — это особая область кучи (heap), где хранятся объекты строк. Служит в первую очередь для оптимизации работы со строковыми литералами. При объявлении литерала (строки в двойных кавычках) в пуле происходит поиск этой строки:\n- Если такой строки в пуле нет ⇒ создается строка, возвращается ссылка\n- Если есть ⇒ возвращается ссылка найденной строки  \n\nСтроки, созданные с помощью `new String()` не помещаются в пул строк и хранятся в куче как остальные объекты.\n\n---\n***Что делает метод intern() в классе String?***\n- Помещает строку в пул строк\n\n"
  popularity = 7.23

[[questions]]
  id = 19
  question = "Почему не рекомендуется изменять строки в цикле?"
  answer = "Строка является неизменной и финализированной в Java, поэтому все наши манипуляции со строкой всегда будут создавать новую строку. Манипуляции со строками ресурсоемкие, поэтому Java обеспечивает два полезных класса для манипуляций со строками – **StringBuffer** и **StringBuilder**.\n\n"
  popularity = 0.3

[[questions]]
