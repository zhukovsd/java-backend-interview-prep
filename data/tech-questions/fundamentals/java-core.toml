[[questions]]
  id = 39
  question = "Какие виды загрузчиков классов ты знаешь?"
  answer = "В Java 9+ есть три встроенных загрузчика классов.\n\n- **Bootstrap** встроен в JVM. Он определяет классы ключевых модулей, в том числе `java.base`. Для `Object.class.getClassLoader()` API возвращает `null`.\n- **Platform** загружает часть классов платформы и видит также классы, загруженные Bootstrap.\n- **Application** по умолчанию является системным загрузчиком. Он загружает классы приложения из classpath и модулей приложения.\n\nСобственный загрузчик можно создать на основе `ClassLoader`. В Java 8 использовались Extension ClassLoader, `rt.jar` и каталог расширений `jre/lib/ext`. Начиная с Java 9 вместо Extension используется Platform ClassLoader. `rt.jar` и механизм расширений удалены."
  popularity = 0.3

[[questions]]
  id = 40
  question = "Record-ы с Java 17. Для чего и зачем?"
  answer = "`record` — компактное объявление класса для хранения данных. Records появились как preview в Java 14 и стали стандартной возможностью в **Java 16**.\n\nКомпилятор предоставляет канонический конструктор, аксессоры компонентов, `equals()`, `hashCode()` и `toString()`, если соответствующие объявления не заданы явно. Поля компонентов `private final`. Если компонент ссылается на изменяемый объект, состояние этого объекта всё ещё может изменяться.\n\n```java\nrecord Point(int x, int y) {}\n\nclass Example {\n    public static void main(String[] args) {\n        Point point = new Point(1, 2);\n        System.out.println(point.x()); // 1\n    }\n}\n```"
  popularity = 1.81

