[[questions]]
  id = 23
  question = "Что такое конструктор?"
  answer = "Конструктор инициализирует новый экземпляр. Его имя совпадает с именем класса и у него нет возвращаемого типа. Если класс не объявляет ни одного конструктора, компилятор обычного класса добавляет конструктор по умолчанию без параметров. Явно объявленный конструктор без аргументов и конструктор по умолчанию различаются по способу появления.\n\n**Для чего нужны приватные конструкторы?** Он ограничивает создание экземпляров, например при использовании фабрики, у утилитного класса или Singleton. Потокобезопасный простой Singleton можно объявить как `enum Singleton { INSTANCE }`. Проверка `instance == null` без синхронизации в ленивом варианте не обеспечивает один экземпляр.\n\n**Чем отличаются конструктор по умолчанию, конструктор копирования и конструктор с параметрами?** Первый добавляет компилятор при отсутствии других. Конструктор копирования вы объявляете сами и выбираете, что копировать. Конструктор с параметрами получает данные для инициализации.\n"
  popularity = 1.51

[[questions]]
  id = 24
  question = "Какие есть модификаторы доступа? Какие применимы к классам?"
  answer = "- `private` - доступ только из класса, в котором объявлен\n- `default` - компонент доступен для любого другого класса в том же пакете\n- `protected` - компонент доступен всем классам внутри пакета, а так же всем классам-наследникам вне пакета\n- `public` - доступ к компоненту из любой точки программы\n\n{{< figure src=\"/java-backend-interview-prep/java_access_modifiers.png\" title=\"\" >}}\n\n`protected` и `private` в контексте классов применимы только к внутренним (вложенным), потому что в других `protected` классах нет смысла - `default` видимость делает то же самое, а к `private` внешнему классу нельзя было бы обратиться из любого другого класса."
  popularity = 3.01

[[questions]]
  id = 25
  question = "Что означает static?"
  answer = "- `static` переменная - переменная, принадлежащая классу, а не объекту\n- `static` класс - вложенный класс, который может обращаться только к статическим полям класса-обертки\n- `static` метод - метод, принадлежащий классу, а не объекту. Статические методы обращаются только к другим статическим методам и переменным\n\n---\n***Может ли статический метод быть переопределен?***\n\nНельзя переопределять статические методы.\nЕсли объявить такой же метод в классе-наследнике, то мы лишь «спрячем» метод суперкласса вместо переопределения. Это называется сокрытие методов.\n\n> *Прим.* Перегружать можно, переопределять нет. В случае со статическими методами это не переопределение (overriding), а сокрытие (hiding).\n\n---\n***Могут ли нестатические методы перегружать статические?***\n\nДа. В итоге получится два разных метода. \nСтатический будет принадлежать классу и будет доступен через его имя, а нестатический будет принадлежать конкретному объекту и доступен через вызов метода этого объекта.\n\n---\n***Могут ли классы быть статическими?***\n\nДа, вложенные классы\n\n"
  popularity = 4.52

[[questions]]
  id = 26
  question = "Можно ли сузить уровень доступа или тип возвращаемого значения при переопределении метода?"
