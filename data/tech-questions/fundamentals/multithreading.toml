[[questions]]
  id = 30
  question = "Что такое happens-before?"
  answer = "**Happens-before** — отношение Java Memory Model, которое задаёт гарантии видимости. Основные правила:\n- Действия одного потока упорядочены в смысле program order.\n- Освобождение монитора предшествует последующему захвату того же монитора.\n- Запись в `volatile` предшествует последующему чтению того же поля.\n- Вызов `Thread.start()` предшествует действиям запущенного потока.\n- Действия потока предшествуют успешному возврату другого потока из `join()` после его завершения.\nОтношение транзитивно. Реализация может переставлять операции, если наблюдаемый результат остаётся допустимым.\n"
  popularity = 3.31

[[questions]]
  id = 31
  question = "ForkJoinPool vs FixedThreadPool"
  answer = "`ForkJoinPool` подходит для рекурсивно делимых задач. Рабочие потоки могут забирать задачи у других рабочих потоков. `Executors.newFixedThreadPool(n)` предназначен для общего выполнения задач с фиксированным числом рабочих потоков и общей очередью.\n**Пример Fork/Join.** Диапазон полуоткрытый `[from, to)`. В базовом случае каждый элемент суммируется один раз.\n\n```java\nclass SumTask extends java.util.concurrent.RecursiveTask<Integer> {\n    private final int[] values;\n    private final int from;\n    private final int to;\n\n    SumTask(int[] values, int from, int to) {\n        this.values = values;\n        this.from = from;\n        this.to = to;\n    }\n\n    @Override\n    protected Integer compute() {\n        if (to - from <= 2) {\n            int sum = 0;\n            for (int i = from; i < to; i++) {\n                sum += values[i];\n            }\n            return sum;\n        }\n        int mid = from + (to - from) / 2;\n        SumTask left = new SumTask(values, from, mid);\n        left.fork();\n        int right = new SumTask(values, mid, to).compute();\n        return left.join() + right;\n    }\n}\n```\nВызов `ForkJoinPool.commonPool().invoke(new SumTask(new int[]{1, 2, 3}, 0, 3))` возвращает `6`. В рабочем коде порог деления подбирают по замерам."
  popularity = 1.2
