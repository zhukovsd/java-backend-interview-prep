[[questions]]
  id = 1
  question = "Что такое многопоточность?"
  answer = "Возможность программы выполнять несколько блоков одновременно\n\n---\n**Что такое поток?**\nПоток (thread) - это независимая единица исполнения инструкций в рамках одной программы. Потоки позволяют выполнять несколько задач одновременно, используя возможности многоядерных процессоров\n\n**Основные характеристики потока**:\n1. Поток выполняется в рамках одного процесса и использует его память\n2. У каждого потока есть своё выполнение\n3. Имеет доступ к общей памяти\n\n**Зачем нужны потоки?**\nПотоки нужны для реализации многозадачности, то есть выполнения нескольких операций одновременно. Это особенно полезно для:\n1. увеличения производительности на многоядерных процессорах\n2. улучшения отзывчивости программ (например, в GUI приложения можно выполнять долгие операции в фоновом потоке, чтобы интерфейс не зависал)\n3. асинхронной обработки (например, чтение/запись файлов, работа с сетью)\n"
  popularity = 2.11

[[questions]]
  id = 2
  question = "Чем процесс отличается от потока?"
  answer = "**Процесс** - независимый экземпляр выполняемой программы со своими выделенными системой ресурсами\n**Поток (Thread/нить)** - способ выполнения процесса, определяющий последовательность исполнения кода в процессе. Поток всегда создаётся в контексте какого-либо процесса"
  popularity = 3.31

[[questions]]
  id = 3
  question = "Чем Thread отличается от Runnable? Когда использовать Thread, а когда Runnable?"
  answer = "**Thread** - класс, представляющий собой надстройку над физическим потоком/нитью. Используется, когда нужно управлять непосредственно состоянием потока\n**Runnable** - функциональный интерфейс, реализации которого представляют собой абстракцию над задачей (код, набор инструкций), которая может быть выполнена внутри потока. Используется как задача для исполнения, может быть передана нескольким потокам, более гибок\n"
  popularity = 0.3

[[questions]]
  id = 4
  question = "Что такое монитор? Как реализован в Java?"
  answer = "Монитор — связанный с Java-объектом реентерабельный механизм взаимного исключения. `synchronized (obj)` заставляет конкурирующие участки кода ждать, если они тоже захватывают монитор `obj`. Несинхронизированный доступ к полям этим автоматически не защищён. Освобождение монитора происходит до последующего захвата того же монитора в смысле happens-before.\n"
  popularity = 1.51

[[questions]]
  id = 5
  question = "Что такое синхронизация? Какие способы синхронизации существуют в Java?"
  answer = "Синхронизация координирует доступ потоков к общему состоянию. Для этого используют мониторы `synchronized`, явные блокировки `Lock`, атомарные операции и средства координации вроде `Semaphore`.\n\n---\n**Как работают synchronized, wait и notify?**\n\nУ экземплярного синхронизированного метода монитор — `this`, у статического — объект класса, у блока — заданный объект. Для `wait()`, `notify()` и `notifyAll()` текущий поток должен владеть именно этим монитором, иначе возникает `IllegalMonitorStateException`.\n\n```java\nsynchronized (lock) {\n    while (!ready) {\n        lock.wait();\n    }\n}\n```\nОбновление `ready` и вызов `lock.notifyAll()` выполняются под тем же монитором. `wait()` освобождает монитор и захватывает его перед возвратом. Условие проверяют в цикле из-за ложных пробуждений и изменения состояния другими потоками. `InterruptedException` обрабатывают или пробрасывают согласно контракту метода.\n\n---\n**Что делает Thread.join()?**\n\nТекущий поток ждёт завершения того потока, на котором вызван `join()`.\n"
  popularity = 14.46

[[questions]]
  id = 6
  question = "Что такое FutureTask?"
  answer = "`Future` - это интерфейс, отражающий результат асинхронного выполнения задачи, предоставляет методы для работы с асинхронными результатами. Используется в комбинации с `ExecutorService` или другими асинхронными API\n\n`FutureTask` - это базовая реализация интерфейса `Future`. Позволяет выполнять задачу асинхронно, а затем получить её результат или обработать исключения. Если задача ещё не закончена, попытка получить результат приостановит (заблокирует) выполнение, пока задача не завершится\nРеализует интерфейс `RunnableFuture`, который объединяет функциональность интерфейсов `Runnable` и `Future`\n"
  popularity = 2.11

[[questions]]
  id = 7
  question = "Что такое CompletableFuture?"
  answer = "`CompletableFuture<T>` реализует `Future<T>` и `CompletionStage<T>`. Он хранит будущий результат и позволяет строить цепочки через `thenApply`, `thenCompose`, `thenCombine` и `allOf`.\n\n| Тип | Что даёт | Как работает отмена |\n|---|---|---|\n| `Future<T>` | Контракт получения результата через `get()` и отмены через `cancel()` | Зависит от реализации |\n| `FutureTask<T>` | Реализует `Runnable` и `Future`, поэтому его можно передать исполнителю | `cancel(true)` может попытаться прервать выполняющий поток |\n| `CompletableFuture<T>` | Композиция, обработка ошибок и получение результата через `get()` или `join()` | Если ещё не завершён, `cancel()` завершает его с `CancellationException`. Параметр `mayInterruptIfRunning` не прерывает вычисление |\n\n`get()` и `join()` могут ждать готовности результата. Чтобы инициировать асинхронное вычисление, можно использовать `supplyAsync()` с подходящим `Executor`.\n"
  popularity = 5.72

[[questions]]
  id = 8
  question = "Что такое ExecutorService?"
  answer = "`ExecutorService` принимает задачи и позволяет управлять жизненным циклом исполнителя. Он может использовать пул потоков, но интерфейсом пул не требуется.\n\n- `execute(Runnable)` запускает задачу без `Future`. `submit(Runnable/Callable)` возвращает `Future`, через который можно дождаться результата, получить исключение или запросить отмену.\n- Для фиксированной конкуренции используют фиксированный пул, для последовательной обработки — один рабочий поток, для запуска по расписанию — `ScheduledExecutorService`.\n- `shutdown()` прекращает приём новых задач и даёт ранее принятым завершиться. `awaitTermination()` ждёт завершения в пределах таймаута. `shutdownNow()` пытается остановить выполняемые задачи и возвращает те, что ещё не стартовали.\n\nУ `Executors.newFixedThreadPool()` очередь не ограничена. При устойчивой перегрузке она может расти. Если нужна граница, используют `ThreadPoolExecutor` с ограниченной очередью и выбранной политикой отказа.\n"
  popularity = 7.53

[[questions]]
  id = 9
  question = "Как работать с коллекциями в многопоточном программировании?"
  answer = "- Превратить обычную коллекцию в синхронизированную, с помощью Collections.synchronized()\n    `List<String> list = Collections.synchronizedList(new ArrayList<>())`\n- Использование Concurrent-коллекций\n    - `CopyOnWriteArrayList`, `CopyOnWriteArraySet`\n    - Неблокирующие хеш-таблицы (`ConcurrentHashMap`, `ConcurrentSkipListMap`, ConcurrentSkipListSet`)`\n    - Неблокирующие очереди (`ConcurrentLinkedQueue` и `ConcurrentLinkedDeque`)\n\n**Почему мы должны использовать потокобезопасные коллекции?**\nКогда несколько потоков одновременно обращаются к одной и той же коллекции, возможно возникновение **состояния гонки (race condition)**, приводящих к следующим проблемам:\n1. **искажение данных** - одновременная модификация может нарушить целостность данных\n2. **исключения** - например, `ConcurrentModificationException`, когда один поток перебирает коллекцию, а другой изменяет её структуру\n3. **непредсказуемое поведение** - результат работы программы становится нестабильным\n\n**CopyOnWriteCollections. Что это? Как происходит запись?**\nЭто потокобезопасные коллекции (`CopyOnWriteArrayList`, `CopyOnWriteArraySet`). Как происходит запись:\n- При добавлении элемента создается копия всей коллекции с добавленным изменением\n- После завершения операции, оригинальная коллекция заменяется на новую копию, а все другие потоки продолжают работать со старой версией, пока новая не станет доступной\n_Прим.: стоит использовать, когда в программе много операций чтения_\n\n**ConcurrentHashMap. Что это? Как происходит запись?**\nЭто потокобезопасная реализация хеш-таблицы. Как происходит запись:\n- хеширование ключа - сначала вычисляется хеш-код ключа, что бы определить, в какой бакет хеш-таблицы попадет этот элемент\n- блокировка бакета - блокируется только тот бакет, в который будет добавлен элемент (если бакет пустой, то применяется CAS-вставка без блокировки)\n- добавление элемента - элемент добавляется, блокировка с бакета снимается\n\n_Прим_.: _на самом деле блокируется не бакет (т.к. это вообще абстракция), а первый его элемент_\n_Прим.2: до Java 8 ConcurrentHashMap делил внутреннюю таблицу на сегменты (Segment[]). Каждый сегмент представлял собой небольшую хэш-таблицу с отдельной блокировкой (ReentrantLock). Когда поток записывал данные, блокировался только сегмент, содержащий нужный ключ. Это позволяло нескольким потокам одновременно работать с разными сегментами. Устаревший механизм сегментов усложнял архитектуру и ограничивал параллелизм, поэтому был упразднён._\n"
  popularity = 4.82

[[questions]]
  id = 10
  question = "SynchronizedCollections. Что это? За счет чего достигается потокобезопасность?"
  answer = "`Collections.synchronizedList(...)` и `Collections.synchronizedMap(...)` синхронизируют отдельные операции на общем мьютексе. При итерации надо вручную синхронизироваться на возвращённой обёртке. Составные операции вроде «проверить, затем добавить» требуют отдельного решения. `ConcurrentHashMap` и `CopyOnWriteArrayList` — другие потокобезопасные реализации с собственной семантикой операций и итераторов.\n"
  popularity = 0.0

[[questions]]
  id = 11
  question = "Что такое Deadlock"
  answer = "Это ситуация, когда два или более потока блокируются навсегда, ожидая ресурсы, которые уже захвачены другими потоками (**Thread A** ожидает **Thread B**, а **Thread B** ожидает **Thread A**)\n"
  popularity = 8.73

[[questions]]
  id = 12
  question = "Что такое Livelock"
  answer = "Несколько потоков попадают в зацикленность при попытке получения каких-либо ресурсов. При этом их состояние постоянно изменяется (два человека постоянно пытаются уступить друг другу дорогу. Каждый раз когда один делает шаг в сторону, другой делает то же самое)\n"
  popularity = 2.41

[[questions]]
  id = 13
  question = "Что такое Race condition"
  answer = "Это ситуация, при которой результат выполнения программы зависит от порядка выполнения потоков. Возникает, когда несколько потоков одновременно обращаются к общим ресурсам, и результат работы зависит от того, какой поток первым выполнит операции\n"
  popularity = 6.02

[[questions]]
  id = 14
  question = "Atomic vs Volatile. Что это и когда использовать?"
  answer = "`volatile` даёт гарантии видимости и порядка по Java Memory Model. Запись в `volatile`-поле происходит *happens-before* каждого последующего чтения этого поля. Это также позволяет безопасно публиковать данные, записанные перед изменением флага.\n\nАтомарные классы дают операции чтения с обновлением как одно действие. Например, `AtomicInteger.incrementAndGet()` атомарен, а `volatile int count; count++` включает чтение и отдельную запись, между которыми может вмешаться другой поток.\n\n---\n**Когда что использовать?**\n\n- `volatile` подходит для флага остановки или публикации ссылки на готовый неизменяемый объект.\n- `AtomicInteger` или `AtomicReference` подходят для атомарного изменения одной переменной.\n- Когда нужно поддерживать общее условие между несколькими полями, часто удобнее использовать одну блокировку.\n"
  popularity = 3.92

[[questions]]
  id = 15
  question = "Зачем нужны atomic"
  answer = "Классы из пакета `java.util.concurrent.atomic` (например, `AtomicInteger`, `AtomicLong`, `AtomicReference`) обеспечивают **безопасные операции над переменными в многопоточной среде** без явной синхронизации.  \nОни полезны для:\n\n1. **Неатомарных операций над примитивами** (инкремент, декремент, сравнение и замена) с гарантией атомарности.\n2. **Оптимизации производительности** — вместо блокировок используется низкоуровневая атомарность через аппаратные команды процессора.\n\n"
  popularity = 11.14

[[questions]]
  id = 16
  question = "Зачем нужны volatile"
  answer = "`volatile` используют для передачи изменений между потоками с гарантиями Java Memory Model. Запись в поле `volatile` предшествует последующему чтению того же поля в смысле *happens-before*. Например, один поток может установить `volatile boolean stopped`, а другой — проверить этот флаг.\n\nОперации вроде `count++` остаются составными. Для них используют атомарные операции или синхронизацию."
  popularity = 14.16

[[questions]]
  id = 17
  question = "Какие бывают состояния у потока?"
  answer = "{{< figure src=\"/java-backend-interview-prep/thread_life_cycle.png\" title=\"Multithreading\" >}}\n\n`Thread.State` включает `NEW` (ещё не запущен), `RUNNABLE` (может выполняться или выполняется), `BLOCKED` (ждёт монитор), `WAITING` (ждёт без тайм-аута), `TIMED_WAITING` (ждёт до тайм-аута) и `TERMINATED` (завершён). Эти состояния JVM не нужно отождествлять один к одному с состояниями потока ОС.\n"
  popularity = 0.9

[[questions]]
  id = 18
  question = "Collections.synchronizedMap vs ConcurrentHashMap"
  answer = "\n|Характеристика|`Collections.synchronizedMap`|`ConcurrentHashMap`|\n|---|---|---|\n|Блокировка|Один общий монитор на всю карту: каждый метод обёрнут в `synchronized`.|Java 8+: блокируется отдельная корзина (CAS для пустой корзины, `synchronized` на её первом узле). До Java 8 — блокировка по сегментам.|\n|Чтение|Выполняется под общей блокировкой.|Обычно без блокировок; поля узлов используют `volatile`.|\n|Производительность|Медленнее при конкуренции: в каждый момент с картой работает только один поток.|Выше при конкуренции: потоки, работающие с разными корзинами, меньше мешают друг другу.|\n|Итерация|Обход нужно синхронизировать вручную (`synchronized (map)`), иначе возможен `ConcurrentModificationException`.|Итераторы `weakly consistent`: не бросают `ConcurrentModificationException`, но могут не отражать изменения, сделанные во время обхода.|\n|Составные операции|Требуют ручной синхронизации для обеспечения атомарности.|Поддерживает атомарные методы `putIfAbsent`, `computeIfAbsent`, `compute`, `merge`.|\n|`null`|Разрешён, если его поддерживает обёрнутая `Map`.|Запрещён для ключей и значений (`NullPointerException`).|\n|`size()`|Возвращает точное количество элементов на момент вызова.|При параллельных изменениях результат может быть неточным.|\n|Применение|Когда нужна потокобезопасная обёртка над конкретной реализацией (`LinkedHashMap`, `TreeMap`).|Для многопоточного доступа с высокой конкуренцией.|"
  popularity = 2.41

[[questions]]
  id = 19
  question = "Какими способами можем запустить несколько потоков в Java приложении? Как запустить поток в Java?"
  answer = "В Java существует несколько способов запустить поток:\n\n**Наследование от класса Thread**\nКласс `Thread` уже реализует интерфейс `Runnable`. Мы можем наследоваться от него и переопределить метод `run()`\n```java\npublic class MyThread extends Thread {\n    @Override\n    public void run() {\n        System.out.println(\"Thread is running\");\n    }\n\n    public static void main(String[] args) {\n        MyThread thread = new MyThread();\n        thread.start(); // Запуск потока\n    }\n}\n```\n\n**Реализация интерфейса `Runnable`**\nСоздаётся класс, реализующий интерфейс `Runnable`. Затем объект этого класса передаётся в конструктор `Thread`\n```java\npublic class MyRunnable implements Runnable {\n    @Override\n    public void run() {\n        System.out.println(\"Runnable is running\");\n    }\n\n    public static void main(String[] args) {\n        Thread thread = new Thread(new MyRunnable());\n        thread.start(); // Запуск потока\n    }\n}\n```\n\n**Использование анонимного класса или лямбда-выражения**\nЧасто используется для краткости, если код в потоке небольшой\n```java\npublic class Main {\n    public static void main(String[] args) {\n        Thread thread = new Thread(() -> System.out.println(\"Lambda thread is running\"));\n        thread.start(); // Запуск потока\n    }\n}\n```\n\n**Использование интерфейса Callable**\n`Callable` возвращает результат и может выбрасывать исключения. Для выполнения требуется `ExecutorService`\n```java\npublic class CallableExample {\n    public static void main(String[] args) throws Exception {\n        ExecutorService executor = Executors.newSingleThreadExecutor();\n        Callable<String> task = () -> \"Callable result\";\n\n        Future<String> future = executor.submit(task);\n        System.out.println(future.get()); // Получение результата\n\n        executor.shutdown();\n    }\n}\n```\n"
  popularity = 7.53

[[questions]]
  id = 20
  question = "Что за интерфейсы Runnable и Callable? В чем между ними отличия?"
  answer = "\n| **Характеристика**    | **`Runnable`**                             | **`Callable`**                           |\n| --------------------- | ------------------------------------------ | ---------------------------------------- |\n| Метод                 | `void run()`                               | `V call()`                               |\n| Возвращаемое значение | Отсутствует                                | Результат типа `V`                       |\n| Обработка исключений  | Исключения необходимо обрабатывать вручную | Может выбрасывать проверяемые исключения |\n| Использование         | Используется с `Thread` или `Executor`     | Используется с `Executor`                |\n"
  popularity = 3.61

[[questions]]
  id = 21
  question = "Расскажи про пакет concurrent"
  answer = "`java.util.concurrent` содержит исполнители и пулы (`ExecutorService`), результаты асинхронных задач (`Future`, `CompletableFuture`), concurrent-коллекции (`ConcurrentHashMap`, `BlockingQueue`, `CopyOnWriteArrayList`), атомарные классы и блокировки. Для координации потоков применяют `Semaphore`, `CountDownLatch`, `CyclicBarrier` и `Phaser`. Для каждой структуры отдельно проверяют гарантии атомарности, блокировки и итерации.\n"
  popularity = 1.51

[[questions]]
  id = 22
  question = "Способы решения задач для многопоточного доступа"
  answer = "1. **Синхронизация (`synchronized`)** Использование синхронизированных методов или блоков для контроля доступа к общим ресурсам.\n2. **Использование `Lock`** - более гибкий контроль, чем `synchronized`, позволяет разблокировать вручную\n3. **Потокобезопасные коллекции**\n4. **Синхронизаторы**\n    - использование `CountDownLatch` для ожидания завершения потоков\n    - использование `Semaphore` для ограничения одновременного доступа\n5. **Atomic-классы** - обеспечивают атомарные операции над переменными\n6. **Пул потоков** - управление многопоточностью через `ExecutorService` позволяет избежать избыточного создания потоков\n"
