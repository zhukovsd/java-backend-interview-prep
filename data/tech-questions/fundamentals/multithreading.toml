[[questions]]
  id = 24
  question = "Что такое CAS операции? (Compare And Swap)"
  answer = "CAS атомарно сравнивает текущее значение с ожидаемым и при совпадении записывает новое. Например, `counter.compareAndSet(0, 1)` возвращает `true` при обновлении и `false` при несовпадении. Если нужно гарантировать выполнение изменения, вызывающий код может перечитать значение и повторить CAS. При конкуренции возможны повторы и проблема ABA. Для счётчика обычно проще взять `incrementAndGet()`."
  popularity = 3.01

[[questions]]
  id = 25
  question = "Асинхронность vs многопоточность"
  answer = "\n| **Критерий**              | **Асинхронность**                                                                  | **Многопоточность**                                 |\n| ------------------------- | ---------------------------------------------------------------------------------- | --------------------------------------------------- |\n| **Определение**           | Способ выполнения задач без блокировки текущего потока                             | Одновременное выполнение задач в нескольких потоках |\n| **Использование потоков** | Поток может не использоваться, задачи выполняются позже                            | Всегда использует несколько потоков                 |\n| **Пример**                | Асинхронное чтение файла: выполнение задачи продолжается при готовности результата | Вычисления на нескольких потоках одновременно       |\n| **Области применения**    | Сетевые запросы, работа с I/O (например, базы данных)                              | Распараллеливание вычислительных задач              |\n"
