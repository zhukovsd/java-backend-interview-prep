[[questions]]
  id = 26
  question = "Зачем нужны пулы потоков?"
  answer = "**Пулы потоков (Thread Pools)** — это группа потоков, которые переиспользуются для выполнения задач. Они предоставляются классом `Executors` и реализуют интерфейс `ExecutorService`\n\n**Основные причины использования:**\n1. **Управление ресурсами:**\n    - избегают создания большого количества потоков, которые могут привести к недостатку памяти\n    - ограничивают максимальное количество одновременно выполняемых потоков\n2. **Повышение производительности** - потоки переиспользуются, что уменьшает затраты на их создание и уничтожение\n3. **Контроль задач** - позволяют планировать задачи, добавлять их в очередь или ограничивать выполнение\n\n```java\nExecutorService executor = Executors.newFixedThreadPool(2);\nexecutor.submit(() -> System.out.println(\"Task 1\"));\nexecutor.submit(() -> System.out.println(\"Task 2\"));\nexecutor.shutdown();\n```\n"
  popularity = 0.9

[[questions]]
  id = 27
  question = "Что значит потокобезопасность?"
  answer = "**Потокобезопасность** означает, что объект или метод корректно работает при одновременном доступе из нескольких потоков.\nБез потокобезопасности возможны race conditions, что приводит к некорректной работе программы.\n"
  popularity = 0.9

[[questions]]
  id = 28
  question = "Области памяти в многопоточности?"
  answer = "В Java память разделена на несколько областей, которые управляются JVM и могут влиять на многопоточное программирование. Основные из них:\n1. **Heap (куча)** - общая память для всех потоков, здесь хранятся объекты\n2. **Stack (стек потока)** - отдельная область для каждого потока, где хранятся локальные переменные и вызовы методов а также ссылки на обьекты\n3. **Метаспейс (Metaspace)** - область для хранения информации о классах\n\n---\n**Как связаны память и многопоточность?**\n\nJava Memory Model определяет правила видимости и упорядочивания действий. Рабочая память потока здесь является моделью рассуждения, а не отдельной областью JVM. Два конфликтующих обращения к одной переменной, из которых хотя бы одно — запись, образуют гонку данных, если между ними нет отношения *happens-before*.\n\n---\n**Как избежать гонки?**\n\nДля доступа к общему состоянию используют один и тот же монитор или `Lock`, атомарные типы и потокобезопасные структуры. `volatile` подходит для публикации значения и видимости флага, но для составного изменения вроде `count++` нужна атомарная операция или блокировка.\n"
  popularity = 1.81

