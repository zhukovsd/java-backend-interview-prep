[category]
  id = 5
  title = "Исключения"
  popularity = 28.01

[[questions]]
  id = 1
  question = "Расскажите про иерархию исключений"
  answer = "{{< figure src=\"/java-backend-interview-prep/exception_hierarchy.png\" title=\"Exceptions\" >}}\n\n`Throwable` — общий базовый тип. Его основные ветви — `Error` и `Exception`. `RuntimeException` является подтипом `Exception`. `RuntimeException`, `Error` и их подтипы — unchecked. Остальные типы исключений, которые могут быть выброшены, компилятор требует обработать или объявить.\n"
  popularity = 11.75

[[questions]]
  id = 2
  question = "Что такое Error и Exception?"
  answer = "Exception - это исключения выполнения программы\nError - ошибки JVM, программисту не стоит обрабатывать их через try-catch"
  popularity = 4.52

[[questions]]
  id = 3
  question = "Расскажите про обрабатываемые и необрабатываемые исключения"
  answer = "Проверяемые (checked) исключения обязаны быть явно обработаны до компиляции (Exception и некоторые наследники)\nНепроверяемые (unchecked) не требуют явной обработки (Error, RuntimeException)\n"
  popularity = 11.75

[[questions]]
  id = 4
  question = "О чем говорит ключевое слово throws?"
  answer = "Ключевое слово `throws` говорит о том, что метод может выбросить исключение указанных типов. Передаёт обработку исключения вышестоящему методу."
  popularity = 1.51

[[questions]]
  id = 5
  question = "Как создать собственное («пользовательское») исключение?"
  answer = "Наследоваться от RuntimeException (рекомендуется, но можно и от Exception), переопределить методы при необходимости"
  popularity = 3.61

[[questions]]
  id = 6
  question = "Расскажите про механизм обработки исключений в java (Try-catch-finally)"
  answer = "Блок **try** - блок, содержащий код, который может выбросить исключение при выполнении\nБлок **catch** - блок, “ловящий” выброшенные в **try** исключения при соответствии его типа с ожидаемым\nБлок **finally** - блок, выполняющийся после блоков **try** и **catch** вне зависимости от того, было ли выброшено исключение. Например, чтобы освободить какой-то ресурс"
  popularity = 6.33

[[questions]]
  id = 7
  question = "Возможно ли использование блока try-finally (без catch)?"
  answer = "Да, в таком случае после `try` выполнится `finally`"
  popularity = 0.3

[[questions]]
  id = 8
  question = "Может ли один блок catch отлавливать сразу несколько исключений?"
  answer = "Да. Начиная с Java 7 можно перечислить несколько типов через `|`:\n\n```java\ntry {\n    readConfig();\n} catch (IOException | IllegalArgumentException e) {\n    System.err.println(e.getMessage());\n}\n```\n\nНи один из перечисленных типов не должен быть подтипом другого. Например, нельзя одновременно указать `IOException` и `FileNotFoundException`. Параметр исключения в таком `catch` неявно `final`.\n"
  popularity = 0.6

[[questions]]
  id = 9
  question = "Всегда ли выполняется блок finally? Существуют ли ситуации, когда блок finally не будет выполнен?"
  answer = "`finally` обычно выполняется при выходе из `try` или `catch`, в том числе при `return` и при выбрасывании исключения.\n\nОн может не выполниться, если JVM остановлена через `System.exit()` или `Runtime.halt()`, процесс принудительно завершён или аварийно остановлен. Если код зациклился или оказался в дедлоке и так и не покинул `try`, выполнение тоже не дойдёт до `finally`.\n"
  popularity = 3.31

[[questions]]
  id = 10
  question = "В каком порядке следует обрабатывать исключения в catch блоках?"
  answer = "От наследника к родителю (от более специфичных к общему). В противоположном случае до наследников невозможно добраться, т.к. родительское исключение будет перехватывать всё"
  popularity = 1.51

[[questions]]
  id = 11
  question = "Что такое механизм try-with-resources?"
  answer = "`try-with-resources` автоматически вызывает `close()` у ненулевых ресурсов, объявленных в `try (...)`, при выходе из блока. Ресурс должен реализовывать `AutoCloseable`. Например, `java.io.Closeable` расширяет этот интерфейс, а `BufferedReader` реализует `Closeable`.\n\nЕсли ресурсов несколько, они закрываются в обратном порядке. Если исключение возникло и в теле, и при закрытии, исключение из `close()` доступно через `getSuppressed()` у основного исключения.\n"
  popularity = 4.82

[[questions]]
  id = 12
  question = "Ошибка OutOfMemoryError. Поймать утечку памяти и пофиксить"
  answer = "Ошибка `OutOfMemoryError` возникает, когда JVM не может выделить достаточно памяти для выполнения программы. Это может быть связано с утечками памяти, неправильной конфигурацией или большим объемом данных. Вот пошаговый процесс, как выявить и устранить причину:\n1. Сделать дамп памяти\n2. Проанализировать дамп, найти причины утечек. Типичные источники:\n    - неосвобождённые ресурсы\n    - переполненные коллекции\n    - статические ссылки (в т.ч. статические коллекции)\n    - неотписавшиеся слушатели\n3. Устранить причины\n"
  popularity = 8.13

[[questions]]
  id = 13
  question = "@SneakyThrows в Lombok"
  answer = "`@SneakyThrows` позволяет пробросить checked-исключение без объявления в `throws`. Объект исключения и его тип сохраняются. Например, `IOException` останется `IOException`. Для обычного публичного API лучше явно объявить исключение или преобразовать его с понятной семантикой, чтобы вызывающий код знал контракт.\n"
  popularity = 0.6

[[questions]]
  id = 14
  question = "StackOverflowError vs OutOfMemoryError"
  answer = "`StackOverflowError` означает исчерпание стека потока, часто из-за слишком глубокой рекурсии. `-Xss` задаёт размер стека в HotSpot. Обычно сначала проверяют рекурсию и условие её завершения. \n\n  \n`OutOfMemoryError` означает, что JVM не может выделить нужный ресурс памяти. Сообщение помогает различить, например, `Java heap space`, `Metaspace`, `GC overhead limit exceeded`, исчерпание памяти для прямых буферов или невозможность создать нативный поток. `-Xmx` задаёт максимум Java heap. Значение по умолчанию зависит от настроек и доступной JVM памяти, в том числе лимитов контейнера. Перед увеличением размера стоит проверить причину, например проанализировать heap dump.\n"
  popularity = 1.81
