[[questions]]
  id = 1
  question = "Что такое дженерики? Для чего нужны?"
  answer = "Дженерики - это параметризованные типы в Java\n- Что это? Позволяют создавать классы, интерфейсы и методы с типами, заданными как параметры\n- Зачем нужны? Позволяют использовать один класс для разных типов данных (`List<String>`, `List<Integer>`)\n\nНабор [рекомендаций](https://docs.oracle.com/javase/tutorial/java/generics/types.html) от Oracle о том, когда какие обозначения лучше использовать в дженериках:\n- **E** - element, для элементов параметризованных коллекций;\n- **K** - key, для ключей map-структур;\n- **V** - value, для значений map-структур;\n- **N** - number, для чисел;\n- **T** - type, для обозначения типа параметра в произвольных классах;\n- **S, U, V** и так далее - применяются, когда в дженерик-классе несколько параметров."
  popularity = 6.93

[[questions]]
  id = 2
  question = "Что такое сырые типы?"
  answer = "**Raw type** — использование обобщённого класса или интерфейса без аргумента типа, например `List` вместо `List<String>`. Такой синтаксис оставлен для совместимости со старым кодом. Он отключает часть проверок компилятора. Например, через сырой `List` можно записать число в список строк, после чего чтение как `String` приведёт к `ClassCastException`.\n\nКогда тип элементов неизвестен, стоит использовать `List<?>`. Компилятор сохранит проверку типов и не даст добавить туда произвольный ненулевой объект."
  popularity = 0.0

[[questions]]
  id = 3
  question = "Что такое вайлдкард"
  answer = "**Wildcard** (`?`) обозначает неизвестный аргумент типа.\n\n- `List<?>` — список элементов неизвестного типа. Читать элемент можно как `Object`.\n- `List<? extends Number>` — список `Number` или какого-то его подтипа. Читать можно как `Number`, добавлять произвольный `Number` нельзя.\n- `List<? super Integer>` — список `Integer` или одного из его надтипов. В него можно добавить `Integer`, читать гарантированно можно только как `Object`.\n\nПрактическое правило PECS: `extends` для источника значений, `super` для их получателя."
  popularity = 0.6

[[questions]]
  id = 4
  question = "Расскажите про принцип PECS"
  answer = "**PECS** — *Producer Extends, Consumer Super*. Из `List<? extends Number>` можно читать `Number`, но нельзя безопасно добавлять произвольный `Number`. В `List<? super Integer>` можно добавлять `Integer`, но при чтении гарантирован только `Object`. Если нужны чтение и запись одного конкретного типа, используют `List<T>`. Для перестановки элементов в `List<?>` общий метод может захватить неизвестный тип через приватный метод с параметром `<T>`.\n"
  popularity = 4.22

[[questions]]
  id = 5
  question = "Расскажите про класс Optional"
  answer = "Optional - класс-обертка. Он помогает избежать ошибок, связанных с null\n\n**Что делает `Optional.flatMap()`?**\n`Optional.flatMap()` используется для работы с вложенными объектами `Optional`, помогая избежать двойной обёртки, т.е. убирает вложенность: превращает  `Optional<Optional<T>>` в `Optional<T>`\n```java\nOptional<String> getNestedValue(Optional<Optional<String>> nestedOpt) {\n    return nestedOpt.flatMap(opt -> opt);\n}\n```\nИспользовать `map`, если функция возвращает нужный вам объект, или `flatMap`, если функция возвращает `Optional` объект\n"
  popularity = 4.22

[[questions]]
  id = 6
  question = "Что такое стирание типов (Type Erasure) в Java Generics"
  answer = "JVM не хранит информацию о параметризованных типах в рантайме. Все операции с дженериками преобразуются в операции с “сырыми типами” (raw types) на этапе компиляции (стирание типов)\n\n---\n**Что такое стирание типов?**\n\nType erasure заменяет параметры типов их верхней границей или `Object` при отсутствии границы. Компилятор при необходимости вставляет приведения и bridge-методы. Например, `List<String>` и `List<Integer>` имеют один класс во время выполнения, поэтому `instanceof List<String>` недопустим.\n\n---\n**Generics. Можно ли получить тип в рантайме?**\n\nИз обычного экземпляра `new ArrayList<String>()` тип элемента не выводится. Рефлексия может прочитать параметры объявлений, если они записаны в метаданных, например через `Field.getGenericType()`. `TypeToken` использует эту возможность, сохраняя параметр в объявлении анонимного подкласса."
  popularity = 3.31
