[[questions]]
  id = 1
  question = "Расскажите как выглядит иерархия коллекций"
  answer = "{{< figure src=\"/java-backend-interview-prep/collections_hierarchy.png\" title=\"\" >}}\n\n`Collection` расширяет `Iterable`. Основные ветви — `List`, `Set` и `Queue`, а `Deque` — двусторонняя очередь. `Map` находится в отдельной ветви.\n\n```text\nIterable\n└── Collection\n    ├── List      (ArrayList, LinkedList)\n    ├── Set       (HashSet, TreeSet)\n    └── Queue\n        └── Deque (ArrayDeque, LinkedList)\n\nMap              (HashMap, TreeMap)\n```\n\nНачиная с Java 21, `SequencedCollection` задаёт доступ к первому и последнему элементам для коллекций с определённым порядком обхода. Его расширяют, например, `List` и `Deque`. Методы `Iterable` — `iterator()`, `forEach()` и `spliterator()`."
  popularity = 22.59

