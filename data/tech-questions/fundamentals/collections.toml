[[questions]]
  id = 18
  question = "Процесс добавления объекта в HashMap"
  answer = "1. `HashMap` вычисляет внутренний хеш ключа и индекс корзины. Если таблица ещё не выделена, она создаётся.\n2. В пустую корзину сразу добавляется новый узел. В занятой корзине `HashMap` ищет совпадение в списке или красно-чёрном дереве.\n3. При совпадении хешей сверяются ссылки через `==`, затем ключи через `equals()`, если нужно. Если ключ найден, `put` заменяет значение и возвращает старое. Иначе добавляется новая запись.\n4. После добавления в длинную цепочку OpenJDK может преобразовать корзину в дерево из `HashMap.TreeNode`. При ёмкости меньше **64** вместо этого расширяется таблица. Обычное расширение также происходит, когда после вставки `size > threshold`."
  popularity = 10.84

[[questions]]
  id = 19
  question = "Будет ли работать HashMap, если все добавляемые ключи будут иметь одинаковый hashCode()?"
  answer = "Да. При корректном контракте `equals()` и `hashCode()` HashMap различит неравные ключи даже с одинаковым хешем. Все такие ключи окажутся в одной корзине, поэтому поиск может замедлиться.\n\nВ OpenJDK длинная корзина может стать деревом при достаточной ёмкости таблицы. При одинаковых хешах эффективность поиска также зависит от того, можно ли упорядочить ключи для обхода дерева."
  popularity = 12.35

