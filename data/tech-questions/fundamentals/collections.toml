  question = "Deque - сложность операций"
  answer = "Сложность операций `Deque` зависит от реализации. У `ArrayDeque` добавление и удаление на обоих концах амортизированно занимают `O(1)`. При расширении внутреннего массива отдельная вставка может занять `O(n)`. Просмотр головы или хвоста занимает `O(1)`, а `contains()` и удаление конкретного значения — `O(n)`.\n"
