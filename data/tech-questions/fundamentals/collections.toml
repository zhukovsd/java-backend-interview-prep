[[questions]]
  id = 40
  question = "HashTable - что это такое?"
  answer = "**HashTable** - это реализация структуры данных хэш-таблицы в Java, которая позволяет хранить пары ключ-значение. Она принадлежит пакету `java.util` и была введена в ранних версиях Java.\n1. **Потокобезопасность** - методы синхронизированы, поэтому она подходит для многопоточных сред. Однако это снижает производительность по сравнению с несинхронизированными коллекциями, такими как `HashMap`\n2. **Запрещены `null` ключи и значения** - попытка использовать `null` вызовет исключение `NullPointerException`\n3. **Считается устаревшей**, ибо существуют более эффективные современные альтернативы, такие как `ConcurrentHashMap`\n"
  popularity = 0.9

[[questions]]
