  question = "Что такое Queue?"
  answer = "`Queue<E>` — интерфейс коллекции для элементов, ожидающих обработки. Основные операции — `offer()` для добавления, `poll()` для извлечения головы и `peek()` для просмотра головы. При пустой очереди `poll()` и `peek()` возвращают `null`.\n\nМногие реализации, например `ArrayDeque` при использовании как очередь, работают по FIFO. `PriorityQueue` выдаёт элементы по естественному порядку или по переданному компаратору.\n"
