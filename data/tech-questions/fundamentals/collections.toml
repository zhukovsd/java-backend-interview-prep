[[questions]]
  id = 3
  question = "ArrayList. Какая размерность массива по умолчанию?"
  answer = "У нового `ArrayList<>()` размер равен **0**. В OpenJDK массив для элементов выделяется лениво. После первого обычного `add()` его ёмкость 10, а размер списка 1.\n\n**Можно ли задать начальную ёмкость или размер списка?**\n\nКонструктор с числом задаёт ёмкость. Размер увеличивается при добавлении элементов.\n"
  popularity = 0.3

[[questions]]
  id = 4
  question = "ArrayList. Что происходит под капотом при добавлении/удалении элемента в начало/середину/конец списка?"
  answer = "**Добавление в конец списка:**  \n1. Проверяется достаточно ли места для добавления нового элемента. Если достаточно, то переходим к п. 2, если нет:\n    - Создается новый массив размером в 1.5 раза больше\n    - Копируются все элементы из старого массива\n2. Новый элемент добавляется в конец\n\n**Добавление в начало/середину списка:**\n1. Проверяется, достаточно ли места для добавления нового элемента. Если достаточно, переходим к п. 2, если нет:\n    - Создается новый массив размером в 1.5 раза больше\n    - Копируются все элементы из старого массива\n2. Все элементы, начиная с нужного индекса, сдвигаются на один вправо, элемент с нужным индексом перезаписывается новым значением\n\nОписанные операции копирования и сдвига элементов осуществляются функцией `System.arraycopy()`. Т.е. в случае добавления в конец списка `System.arraycopy()` будет вызвана 0 или 1 раз, в случае добавления в начало/середину — 1 или 2 раза\n\nАналогично при удалении:\n- из начала/середины списка - смещение правой (относительно удаляемого элемента) части массива влево на 1\n- с конца - только очищение ячейки"
  popularity = 4.52

[[questions]]
  id = 5
  question = "ArrayList - сложность операций"
  answer = "**Сложность добавления элемента в начало/середину/конец списка?**\n\n|Место добавления|Средняя сложность|Худшая сложность|Пояснение|\n|---|---|---|---|\n|**Начало списка**|`O(n)`|`O(n)`|Все элементы сдвигаются вправо для освобождения места|\n|**Середина списка**|`O(n)`|`O(n)`|Элементы после точки вставки сдвигаются вправо|\n|**Конец списка**|`O(1)`|`O(n)`|Амортизированная сложность `O(1)`, но если массив переполняется, требуется перераспределение|\n\n**Сложность удаления элемента в начале/середине/конце списка?**\n\n| Место удаления      | Средняя сложность | Худшая сложность | Пояснение                                                                             |\n| ------------------- | ----------------- | ---------------- | ------------------------------------------------------------------------------------- |\n| **Начало списка**   | `O(n)`            | `O(n)`           | Все элементы сдвигаются влево для заполнения освободившегося места                    |\n| **Середина списка** | `O(n)`            | `O(n)`           | Элементы после удалённого элемента сдвигаются влево                                   |\n| **Конец списка**    | `O(1)`            | `O(1)`           | Удаление последнего элемента происходит мгновенно без необходимости сдвигать элементы |\n\n**Сложность доступа по индексу и значению?**\n\n|Операция|Средняя сложность|Худшая сложность|Пояснение|\n|---|---|---|---|\n|**Доступ по индексу**|`O(1)`|`O(1)`|Прямой доступ к элементам массива за константное время благодаря индексации|\n|**Поиск по значению**|`O(n)`|`O(n)`|Линейный поиск, так как элементы не отсортированы и требуется перебор всех значений|\n\n**Сложность по времени `ArrayList.contains()`**\nO(n), где n - количество элементов, `contains()` выполняет линейный поиск, сравнивая элементы по порядку.\n"
  popularity = 4.22

[[questions]]
