[[questions]]
  id = 14
  question = "Что такое HashMap?"
  answer = "`HashMap` хранит пары ключ–значение в хеш-таблице. При хорошем распределении ключей `get()` и `put()` в среднем занимают `O(1)`. Допускаются один `null`-ключ и несколько `null`-значений. Порядок обхода не гарантирован.\n\nВ OpenJDK 8+ длинная корзина может превратиться в дерево. Для этого ёмкость таблицы должна быть не меньше **64**. При меньшей ёмкости при попытке преобразования таблица расширяется. Пороговые константы относятся к реализации OpenJDK, а точные условия зависят от операции."
  popularity = 8.43

[[questions]]
  id = 15
  question = "Внутреннее устройство HashMap"
  answer = "В OpenJDK `HashMap` хранит записи в массиве корзин. Для ненулевого ключа внутренний хеш вычисляется как `h ^ (h >>> 16)`, где `h = key.hashCode()`. Для `null` внутренний хеш равен нулю. Индекс корзины — `(capacity - 1) & hash`. Ёмкость таблицы является степенью двойки.\n\nУ `new HashMap<>()` таблица выделяется при первой вставке. Начальная ёмкость — **16**, коэффициент загрузки — **0,75**, поэтому первый порог расширения — **12**. При `size > threshold` таблица обычно удваивается. Другой повод для расширения — попытка превратить длинную корзину в дерево при ёмкости менее **64**.\n\n---\n***Сколько изначально бакетов создается?***\n\n По умолчанию - **16**\n\n---\n***В каком случае количество бакетов увеличивается?***\n\n- При попытке преобразовать список в дерево в таблице размером менее 64 бакетов\n    \n- Когда превышен порог загрузки (`size > threshold`).\n    \n\n`threshold` вычисляется по формуле:\n\n```text\nthreshold = capacity * loadFactor\n```\n\nгде `capacity` — это текущий размер таблицы бакетов, а `loadFactor` — это коэффициент загрузки (по умолчанию 0.75, то есть 75% от общего размера таблицы).\n\nВ таких случаях создается новая таблица размером в 2 раза больше текущего.\n\n---\n***Чтобы определить номер бакета есть формула. Какие в ней переменные?***\n\n```java\nbucketIndex = (hash & (capacity - 1));\n\n```\n\n1. **`hash`** — хэш-код ключа, который возвращает метод `key.hashCode()`.\n2. **`capacity`** — текущая ёмкость таблицы (всегда степень двойки, например, 16, 32).\n3. **`bucketIndex`** — индекс бакета, в котором будет храниться элемент.\n\nОперация побитового `&` (AND) используется вместо `%`, так как она быстрее и эффективнее для степеней двойки.\n\n\n"
  popularity = 15.96

