[[questions]]
  id = 35
  question = "Какая коллекция реализует дисциплину обслуживания LIFO? FIFO?"
  answer = "`ArrayDeque` подходит для обеих дисциплин:\n\n- **FIFO** — добавлять в хвост через `offerLast()`, извлекать из головы через `pollFirst()`.\n- **LIFO** — добавлять и извлекать с одного конца через `push()` и `pop()`.\n\nДля нового кода, где нужен стек, обычно выбирают `Deque`. `Stack` — старый класс и тоже реализует LIFO.\n"
  popularity = 1.2

