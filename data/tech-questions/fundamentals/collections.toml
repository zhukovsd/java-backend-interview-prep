[[questions]]
  id = 14
  question = "Что такое HashMap?"
  answer = "`HashMap` хранит пары ключ–значение в хеш-таблице. При хорошем распределении ключей `get()` и `put()` в среднем занимают `O(1)`. Допускаются один `null`-ключ и несколько `null`-значений. Порядок обхода не гарантирован.\n\nВ OpenJDK 8+ длинная корзина может превратиться в дерево. Для этого ёмкость таблицы должна быть не меньше **64**. При меньшей ёмкости при попытке преобразования таблица расширяется. Пороговые константы относятся к реализации OpenJDK, а точные условия зависят от операции."
  popularity = 8.43

[[questions]]
  id = 15
  question = "Внутреннее устройство HashMap"
  answer = "В OpenJDK HashMap хранит записи в массиве корзин.\n\n**Сколько изначально бакетов создаётся?** У нового `HashMap<>()` массив ещё не выделен. При первой вставке стандартная начальная ёмкость — 16, коэффициент загрузки — 0,75 и первый порог роста — 12.\n\n**В каком случае количество бакетов увеличивается?** Обычно при `size > threshold` ёмкость удваивается. Если при вставке длинную цепочку пытаются превратить в дерево, а ёмкость меньше 64, реализация расширяет таблицу.\n\n**Как вычисляется номер бакета и что означает каждая переменная в формуле?** Ёмкость таблицы является степенью двойки. Для ненулевого ключа `h = key.hashCode()`, внутренний `hash = h ^ (h >>> 16)`, индекс — `(capacity - 1) & hash`. Для `null` внутренний хеш равен нулю.\n"
  popularity = 15.96

[[questions]]
  id = 16
  question = "Что такое бакет? Внутреннее устройство бакета"
  answer = "**Корзина** — позиция во внутренней таблице HashMap, куда могут попасть несколько пар ключ–значение. Разные хеши тоже могут дать один индекс корзины. Чтобы найти нужную запись, HashMap проверяет хеш и равенство ключей.\n\nВ OpenJDK корзина может содержать список узлов или дерево. Превращение длинной корзины в дерево возможно при ёмкости таблицы от 64. При меньшей ёмкости реализация сначала расширяет таблицу."
