[[questions]]
  id = 32
  question = "Что такое Deque?"
  answer = "Deque (Double-Ended Queue) - это интерфейс в Java, представляющий собой двунаправленную очередь (”дек”). Это означает, что элементы могут быть добавлены или удалены как с начала, так и с конца очереди. Таким образом, Deque может работать как очередь (**FIFO**) и как стек (**LIFO**).\n\n**Что значит двунаправленный?**\nДвунаправленный (или двухсторонний) в контексте Deque означает, что элементы можно добавлять и удалять с обеих сторон очереди\n"
  popularity = 0.3

