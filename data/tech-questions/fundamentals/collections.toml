  question = "HashMap - сложность операций"
  answer = "| Операция | Сложность |\n|---|---|\n| `get`, `containsKey`, `remove` | В среднем `O(1)` при хорошем распределении хешей |\n| `put` | Амортизированно `O(1)` при хорошем распределении. Отдельная вставка с расширением — `O(n)`. |\n| `containsValue` и итерация | В худшем случае `O(capacity + size)`, поскольку обходятся корзины и записи |\n\nПри множестве коллизий поиск может стать линейным. Дерево в корзине ускоряет поиск, если хеш или порядок сравнимых ключей позволяет выбрать нужную ветку."
