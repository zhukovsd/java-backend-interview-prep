  question = "Реализации интерфейса Map. Почему интерфейс Map выделен отдельно?"
  answer = "`Map` хранит пары ключ–значение и образует отдельную иерархию. Для обхода предоставляет `keySet()`, `values()` и `entrySet()`.\n\n| Реализация | Особенность |\n|---|---|\n| `HashMap` | Хеш-таблица без гарантии порядка |\n| `LinkedHashMap` | Порядок вставки или доступа, в зависимости от конфигурации |\n| `TreeMap` | Ключи в порядке сравнения |\n| `ConcurrentHashMap` | Потокобезопасные операции, слабо согласованные итераторы |\n| `WeakHashMap` | Слабые ссылки на ключи, записи могут удаляться после сборки ключей |\n"
