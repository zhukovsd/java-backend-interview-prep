[[questions]]
  id = 37
  question = "Как с собой связаны Iterable и foreach?"
  answer = "Enhanced `for` работает с массивами и с `Iterable`. Для `Iterable` используется итератор, для массивов компилятор организует проход по индексам.\n\n**Если мы будем итерироваться по коллекции, можем ли удалить элемент?** \n---\n\nЕсли итератор поддерживает удаление, вызывайте `iterator.remove()` после `next()`. Если нужен только фильтр, можно отдельно вызвать `removeIf()`. Структурное изменение обычной коллекции через саму коллекцию во время обхода может вызвать `ConcurrentModificationException`, но fail-fast не является гарантией.\n\n```java\nList<String> items = new ArrayList<>(List.of(\"a\", \"b\", \"c\"));\nfor (Iterator<String> it = items.iterator(); it.hasNext(); ) {\n    if (\"b\".equals(it.next())) {\n        it.remove();\n    }\n}\n```\n\n**Виды итераторов. Fail-fast и concurrent.** \n---\n\nFail-fast-итератор обычной коллекции старается обнаружить неожиданное структурное изменение. Это диагностика ошибок, а не гарантия исключения. У ConcurrentHashMap итератор слабо согласованный, а CopyOnWriteArrayList обходит снимок. Название «fail-safe» не является общим контрактом Java.\n"
  popularity = 1.81

