  question = "Будет ли работать HashSet, если все добавляемые элементы будут иметь одинаковый hashCode()?"
  answer = "Да. Одинаковый `hashCode()` у разных элементов допустим, а равенство определяется с учётом `equals()`. Если `equals()` считает элементы равными, второй не добавится.\n\nВ `HashSet` OpenJDK элементы хранятся как ключи `HashMap`. При одинаковых хешах все они попадают в одну корзину. Длинная цепочка при достаточной ёмкости таблицы может стать деревом. При одинаковых хешах и отсутствии порядка, по которому можно выбрать ветвь, поиск даже в таком дереве может остаться линейным.\n"
  popularity = 0.6

[[questions]]
  id = 28
  question = "Что такое TreeSet? Внутреннее устройство"
  answer = "`TreeSet` — множество, которое хранит элементы в порядке сортировки. OpenJDK реализует его через `NavigableMap`, обычно `TreeMap`. Элементы становятся ключами. Если результат сравнения с уже имеющимся элементом равен нулю, `add()` вернёт `false` и элемент не заменится. Для согласованности с контрактом `Set` порядок сравнения должен быть согласован с `equals()`. Основные операции — `O(log n)`.\n"
  popularity = 3.31

[[questions]]
