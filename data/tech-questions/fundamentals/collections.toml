[[questions]]
  id = 7
  question = "LinkedList. Что происходит под капотом при добавлении/удалении элемента в начало/середину/конец списка?"
  answer = "У LinkedList есть внутренний статический класс `Node`, символизирующий элемент списка, а также поля `first` и `last`, в которых хранятся первый и последний элементы (узлы/ноды). У каждого элемент есть ссылка на предыдущий элемент (`prev`) и следующий (`next`). При добавлении элемента ссылки переприсваиваются."
  popularity = 3.31

[[questions]]
  id = 8
  question = "LinkedList - сложность операций"
  answer = "В LinkedList элементы фактически представляют собой звенья одной цепи. У каждого элемента помимо тех данных, которые он хранит, имеется ссылка на предыдущий и следующий элемент. По этим ссылкам можно переходить от одного элемента к другому.\n\n**LinkedList. Какая скорость добавления элемента в начало/середину/конец списка?**\n\n|Место добавления|Средняя сложность|Худшая сложность|Пояснение|\n|---|---|---|---|\n|**Начало списка**|`O(1)`|`O(1)`|Новый узел добавляется перед первым, переназначаются ссылки|\n|**Середина списка**|`O(n)`|`O(n)`|Требуется пройти список до нужного узла, после чего выполняется вставка|\n|**Конец списка**|`O(1)`|`O(1)`|Новый узел добавляется после последнего, переназначаются ссылки|\n\n**LinkedList. Какая скорость удаления элемента в начале/середине/конце списка?**\n\n|Место удаления|Средняя сложность|Худшая сложность|Пояснение|\n|---|---|---|---|\n|**Начало списка**|`O(1)`|`O(1)`|Удаление первого узла выполняется мгновенно, ссылки переназначаются|\n|**Середина списка**|`O(n)`|`O(n)`|Требуется пройти список до нужного узла, после чего выполняется удаление|\n|**Конец списка**|`O(1)`|`O(1)`|Удаление последнего узла выполняется мгновенно, если есть доступ к последнему элементу|\n\n**LinkedList. Какая скорость доступа по индексу и значению**\n\n| Тип доступа                       | Средняя сложность | Худшая сложность | Пояснение                                                             |\n| --------------------------------- | ----------------- | ---------------- | --------------------------------------------------------------------- |\n| **Доступ по первому элементу**    | `O(1)`            | `O(1)`           | Первый элемент хранится в ссылке `first`, доступ к нему мгновенный.    |\n| **Доступ по последнему элементу** | `O(1)`            | `O(1)`           | Последний элемент хранится в ссылке `last`, доступ к нему мгновенный. |\n| **Доступ по индексу**             | `O(n)`            | `O(n)`           | Линейный обход от начала или конца до нужного индекса.                |\n| **Доступ по значению**            | `O(n)`            | `O(n)`           | Линейный перебор всех элементов до нахождения искомого значения.      |\n"
  popularity = 3.01

[[questions]]
  id = 9
  question = "ArrayList vs LinkedList"
  answer = "`ArrayList` хранит ссылки в массиве, а `LinkedList` — в узлах двусвязного списка. Узлы требуют дополнительной памяти, а последовательный обход массива обычно лучше использует кеш процессора.\n\n| Операция | ArrayList | LinkedList |\n|---|---|---|\n| Доступ по индексу | `O(1)` | `O(n)` |\n| Добавление в конец | Амортизированно `O(1)` | `O(1)` |\n| Вставка или удаление в начале | `O(n)`, сдвиг | `O(1)` |\n| Вставка или удаление в середине по индексу | `O(n)`, сдвиг | `O(n)`, поиск позиции |\n| Вставка или удаление в уже найденной позиции через `ListIterator` | `O(n)`, сдвиг | `O(1)` |\n\nДля списка общего назначения обычно выбирают `ArrayList`, для очереди или стека — `ArrayDeque`.\n\n**Где какой использовать?**\n\nДоступ по индексу и большинство обычных сценариев хорошо подходят для ArrayList. Особый случай LinkedList — частые правки в уже найденной позиции либо операции на концах.\n"
  popularity = 16.57

[[questions]]
  id = 10
  question = "Какая скорость вставки в ArrayList и LinkedList"
  answer = "Для ArrayList: при вставке в конец списка амортизированная временная сложность составляет O(1) (время увеличивается до O(n) только в редких случаях при переполнении и копировании массива). При вставке в начало или середину сложность равна O(n) из-за необходимости сдвигать (копировать) элементы массива вправо.\n\nДля LinkedList: при вставке в начало или конец списка временная сложность константная — O(1), так как коллекция хранит прямые ссылки на первый и последний узлы. При вставке в середину сложность составляет O(n), что обусловлено необходимостью последовательного поиска (перебора) нужного места для вставки, хотя сама перепривязка ссылок выполняется за O(1)."
  popularity = 3.31

[[questions]]
  id = 11
  question = "Что такое TreeMap?"
  answer = "`TreeMap` — реализация `NavigableMap` на основе красно-чёрного дерева. Она хранит ключи в естественном порядке либо использует переданный `Comparator`. Основные операции `get()`, `put()`, `remove()` и `containsKey()` имеют гарантированную сложность `O(log n)`.\n\nДва ключа соответствуют одной записи, если результат сравнения равен нулю. Чтобы соблюдать общий контракт `Map`, порядок ключей должен быть согласован с `equals()`."
  popularity = 3.01

