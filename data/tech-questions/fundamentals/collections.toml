  question = "Arrays.asList() and List.of()"
  answer = "`Arrays.asList(array)` возвращает список фиксированного размера, связанный с массивом. `set()` меняет элемент в списке и массиве. `add()` и `remove()` не поддерживаются. `List.of(...)` возвращает немодифицируемый список, который не принимает `null`. Сами объекты-элементы могут быть изменяемыми. Если нужен независимый изменяемый список, подходит `new ArrayList<>(Arrays.asList(array))`.\n"
