[[questions]]
  id = 1
  question = "Плюсы и минусы брокеров сообщений"
  answer = "**Плюсы** — асинхронность, меньшая связанность сервисов, буферизация нагрузки и возможность обрабатывать сообщения параллельно.\n\n**Издержки** — дополнительная инфраструктура, задержка, мониторинг и обработка повторных доставок. Чтобы повторная доставка не повторяла побочный эффект, обработчик проектируют идемпотентным.\n\nНадёжность зависит от хранения и репликации данных, подтверждений от брокера и потребителя, политики retention и конфигурации клиента.\n"
  popularity = 2.41

[[questions]]
  id = 2
  question = "Разница между Kafka и RabbitMQ"
  answer = "| Критерий | Kafka | RabbitMQ |\n|---|---|---|\n| Модель | Распределённый журнал с топиками и партициями | Exchanges маршрутизируют сообщения в очереди |\n| Получение | Consumer запрашивает записи и управляет своей позицией | При подписке брокер доставляет сообщения потребителю |\n| Хранение | Политика хранения или compaction действуют независимо от прочтения | В обычной очереди сообщение удаляется после подтверждения. RabbitMQ Streams поддерживают повторное чтение. |\n| Типичные задачи | Потоки событий и интеграции с повторным чтением | Очереди задач и гибкая маршрутизация |\n\nСкорость и задержка зависят от нагрузки, размера сообщений и настроек подтверждений и репликации.\n"
  popularity = 9.04

[[questions]]
  id = 3
  question = "Что такое топик в Kafka?"
  answer = "Топик в Kafka - Topic — именованный поток записей, логически разделённый на partitions. Каждая partition представляет собой упорядоченный append-only log"
  popularity = 5.42

[[questions]]
  id = 4
  question = "Что такое Producer и что такое Consumer?"
  answer = "**Producer** — клиент, который публикует records в Kafka topics.\n\n**Consumer** — клиент, который читает records из Kafka topics.\n\n**Что даст увеличение количества consumers?**\nЕсли consumers находятся в одной Consumer Group, partitions распределяются между ними. Это позволяет обрабатывать разные partitions параллельно.\n\nВ рамках обычной Consumer Group одна partition одновременно назначается не более чем одному consumer.\n\nНапример, topic содержит 4 partitions:\n- 1 consumer → читает 4 partitions\n- 2 consumers → примерно по 2 partitions\n- 4 consumers → каждому по 1 partition\n- 5 consumers → один consumer останется без partition и будет простаивать\n\nPartitions распределяются согласно выбранной стратегии assignment, например `RangeAssignor`, `RoundRobinAssignor`, `StickyAssignor` или `CooperativeStickyAssignor`.\n\n**Round Robin не является универсальной стратегией по умолчанию.**"
  popularity = 1.51

[[questions]]
  id = 5
  question = "Что такое partition в Kafka?"
  answer = "**Партиция** — упорядоченная часть топика. Каждая запись имеет offset внутри партиции. Потребители читают журнал независимо, а правила retention или compaction определяют удаление записей.\n\n---\n**На что делится partition?**\n\nНа уровне брокера журнал хранится в сегментах. Логически приложение читает записи с ключом, значением, timestamp, заголовками и offset. Партиция остаётся единицей распределения и порядка. Между партициями общий порядок Kafka не гарантирует.\n"
  popularity = 9.04

[[questions]]
  id = 6
  question = "Распределение сообщений. Как сообщения распределяются по партициям?"
  answer = "Producer может указать партицию явно. Иначе её выбирает встроенная стратегия или пользовательский `Partitioner`.\n\nВ Java producer Kafka 4.0 встроенная стратегия обычно хеширует байты сериализованного ключа. Одинаковые байты попадут в одну партицию при неизменном числе партиций и той же стратегии. Явный выбор партиции или `partitioner.ignore.keys=true` меняют это поведение.\n\nДля записи без ключа по умолчанию используется sticky-распределение. Несколько записей отправляются в одну партицию, чтобы сформировать батч. Смена партиции связана с порогом `batch.size`. Round robin можно настроить отдельно.\n"
  popularity = 10.54

[[questions]]
  id = 7
  question = "Гарантии доставки в Kafka"
  answer = "- **At most once** — запись может быть пропущена, повторной обработки нет. Пример: consumer фиксирует позицию до обработки и падает после фиксации.\n- **At least once** — запись доставляется хотя бы один раз, возможны повторы. Пример: позиция фиксируется после обработки, и consumer падает до фиксации.\n- **Exactly once** — повтор попытки не приводит к повторному наблюдаемому результату в пределах выбранной схемы.\n\nВ схеме **Kafka → обработка → Kafka** producer фиксирует выходные записи и входные offsets в одной транзакции. У обработчика выключен `enable.auto.commit`. Читатели результата используют `read_committed`. Обработчик также использует `read_committed`, если читает транзакционный вход.\n\nДля внешней БД нужен отдельный способ согласовать запись результата с прогрессом или сделать запись идемпотентной и фиксировать прогресс после её успеха.\n"
  popularity = 12.35

[[questions]]
  id = 8
  question = "Какие существуют паттерны работы с очередями?"
  answer = "- **Point-to-Point (P2P)** - один продюсер, один потребитель. Сообщение читается одним потребителем и удаляется из очереди\n- **Publish-Subscribe (Pub/Sub)** - один продюсер отправляет сообщение нескольким подписчикам через обменники\n- **Work Queue** - несколько потребителей обрабатывают сообщения из одной очереди, распределяя нагрузку\n- **Dead Letter Queue (DLQ)** - очередь для сообщений, которые не удалось обработать\n- **Priority Queue** - сообщения обрабатываются в зависимости от их приоритета\n"
  popularity = 0.3

[[questions]]
  id = 9
  question = "Основные компоненты Kafka?"
  answer = "Apache Kafka - это распределённая система обработки потоков, состоящая из нескольких ключевых компонентов\n- **Producer** (производитель) - отправляет данные в Kafka\n- **Consumer** (потребитель) - получает данные из Kafka\n- **Topic** (топик) - логическая сущность, разделяющая данные на каналы\n- **Partitions** (партиции) - разделы топика, которые разделяют данные для их распределенного хранения и параллельной обработки. Партиции дают возможность хранить данные на разных брокерах\n- **Broker** (брокер) - сервер, ответственный за хранение данных в Kafka\n- **Consumer Group** (группа потребителей) - объединение консьюмеров, которые параллельно обрабатывают данные одного топика. Каждый консьюмер в группе обрабатывает разные партиции топика, что улучшает параллельность и производительность\n- **Controller** - один из брокеров, который управляет метаданными кластера и отвечает за перераспределение партиций в случае отказа\n- **ZooKeeper** - координатор, служит для управления и координации брокеров, поддержания метаданных системы. В новых версиях Kafka (с 3.7) вместо него используется KRaft (Kafka Raft). С версии 4.0 Zookeper удалён\n"
  popularity = 12.05

[[questions]]
  id = 10
  question = "Kafka. Consumer Group"
  answer = "Consumer Group - это механизм для группировки консьюмеров, работающих с одним топиком, для:\n- распределения нагрузки - партиции разделяются между консьюмерами группы, каждый читает данные только из своих партиций\n- гибкости - можно увеличивать количество консьюмеров в группе для ускорения обработки данных\n"
  popularity = 8.13

[[questions]]
  id = 11
  question = "Из чего состоит Kafka кластер?"
  answer = "Kafka-кластер — это распределенная система для передачи, хранения и обработки сообщений. Его основные компоненты:\n\n| Компонент                     | Описание                                                                                                                                        |\n| ----------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Брокеры (Brokers)**         | Серверы, которые хранят данные и обрабатывают запросы производителей (producers) и потребителей (consumers). Каждый брокер имеет уникальный ID. |\n| **Топики (Topics)**           | Логические категории для сообщений. Сообщения внутри топика распределены по разделам (partitions).                                              |\n| **Разделы (Partitions)**      | Логическое деление топика для масштабируемости. Сообщения в разделе упорядочены, между разделами порядок не гарантируется.                      |\n| **Реплики (Replicas)**        | Копии разделов, хранящиеся на других брокерах для отказоустойчивости.                                                                           |\n| **Контроллер (Controller)**   | Один из брокеров, который управляет метаданными кластера и отвечает за перераспределение разделов в случае отказа.                              |\n| **Производители (Producers)** | Клиенты, которые публикуют сообщения в топики.                                                                                                  |\n| **Потребители (Consumers)**   | Клиенты, которые читают сообщения из топиков, обрабатывая данные в зависимости от задачи.                                                       |\n| **Consumer Group**            | Группа потребителей, которые совместно обрабатывают сообщения из одного топика, разделяя нагрузку.                                              |\n| **Zookeeper / KRaft**         | Сервис координации для управления метаданными кластера и состоянием брокеров (Zookeeper заменяется на KRaft в новых версиях Kafka).             |\n\n"
  popularity = 0.6

[[questions]]
  id = 12
  question = "Брокеры сообщений vs Rest"
  answer = "\n| **Характеристика**      | **Брокеры сообщений (Kafka, RabbitMQ)**                       | **REST API**                                    |\n| ----------------------- | ------------------------------------------------------------- | ----------------------------------------------- |\n| **Модель коммуникации** | Асинхронная (очереди, топики)                                 | Синхронная (запрос-ответ)                       |\n| **Скорость передачи**   | Высокая, оптимизирована для работы с большими объемами данных | Зависят от производительности HTTP сервера      |\n| **Надежность доставки** | Поддерживает подтверждение (ACK), ретрансляцию сообщений      | Обычно не предоставляет механизмов ретрансляции |\n| **Масштабируемость**    | Высокая, благодаря горизонтальному масштабированию брокеров   | Требует отдельных решений для масштабирования   |\n| **Обработка данных**    | Гибкая, подходит для потоковой обработки данных               | Подходит для CRUD-операций                      |\n| **Сложность настройки** | Требует установки и управления инфраструктурой                | Легче развернуть, использует стандартный HTTP   |\n"
  popularity = 5.42

[[questions]]
  id = 13
  question = "Pull и push модели, в чём разница?"
  answer = "**Pull-модель (”вытягивание”)** - клиент запрашивает данные у сервера (или брокера). Пример - консьюмеры в Kafka запрашивают данные у брокеров\n**Преимущества:**\n- клиент контролирует скорость обработки, что особенно важно при высокой нагрузке.\n- легко обрабатывать данные на уровне клиента\n**Недостатки:**\n- может возникнуть задержка, если клиент редко запрашивает данные\n- требует постоянного запроса данных\n\n**Push (”проталкивание”)** - сервер отправляет данные клиенту по мере их поступления.\nПример: WebSocket, Firebase Cloud Messaging.\n**Преимущества:**\n- меньшая задержка - данные сразу отправляются клиенту\n- удобно для реального времени (например, уведомления)\n**Недостатки:**\n- клиент может быть перегружен большим потоком данных\n- контроль над потоком находится на сервере\n"
  popularity = 0.6

[[questions]]
  id = 14
  question = "Как гарантировать в Kafka идемпотентность, чтобы не было задвоений и потерь сообщений?"
  answer = "Идемпотентный producer (`enable.idempotence=true`) защищает от дублей при автоматических повторах отправки. Брокер использует идентификатор producer и номера последовательности. Если приложение дважды отправит одно бизнес-событие отдельными вызовами, могут появиться две записи.\n\nДолговечность записи зависит от `acks`, `min.insync.replicas` и числа реплик. Ошибку отправки приложение должно обработать. Consumer может повторно получить сообщение после сбоя, поэтому для защиты внешнего побочного эффекта применяют идемпотентность, например уникальный ID события в БД.\n"
  popularity = 3.92

[[questions]]
  id = 15
  question = "Как в Kafka гарантируется последовательность сообщений?"
  answer = "Сообщения в одной партиции записываются последовательно. Kafka гарантирует, что потребитель получит их в том же порядке, в котором они были записаны.\nKafka не гарантирует порядок сообщений между разными партициями топика, так как каждый раздел обрабатывается независимо\n\n"
  popularity = 3.31

[[questions]]
  id = 16
  question = "Что сделать, чтобы сообщения попадали в одну партицию?"
  answer = "Чтобы записи попали в одну партицию, можно явно указывать её номер, использовать один и тот же сериализованный ключ со стабильной конфигурацией или задать топику одну партицию. Увеличение числа партиций может изменить соответствие ключей номерам.\n\n```java\nproducer.send(new ProducerRecord<>(\"topic\", 0, key, value));\n```\nЕсли нужен пользовательский алгоритм, реализуют `Partitioner` и регистрируют именно этот класс в Java producer. Например, для Spring Boot:\n\n```yaml\nspring:\n  kafka:\n    producer:\n      properties:\n        \"[partitioner.class]\": com.example.CustomPartitioner\n```\nУказанный класс должен существовать в classpath. `RoundRobinPartitioner` распределяет записи по партициям и для этой цели не подходит.\n"
  popularity = 0.6

[[questions]]
  id = 17
  question = "Как работает Round Robin?"
  answer = "**Round Robin** - это стратегия распределения данных, при которой сообщения равномерно отправляются в разные разделы топика\n\n**Логика:**\n1) Производитель отправляет первое сообщение в первую доступную партицию\n2) Следующее сообщение отправляется в следующую партицию, и так далее\n3) После достижения последнего раздела цикл повторяется с первой партиции\n\n**Пример:**\nТопик имеет 3 партиции:\n```\nPartition 0: Msg1, Msg4\nPartition 1: Msg2, Msg5\nPartition 2: Msg3, Msg6\n```\n"
  popularity = 0.3

[[questions]]
  id = 18
  question = "Acknowledgment в Kafka"
  answer = "Acknowledgment (acks) - это механизм подтверждения записи сообщения в Kafka. Производитель получает подтверждение от брокера после записи сообщения\n\n`acks` определяет, какого подтверждения ждёт producer.\n\n- `acks=0` — producer не ждёт подтверждения от брокера.\n- `acks=1` — достаточно подтверждения лидера партиции. При его сбое до репликации запись может быть потеряна.\n- `acks=all` — нужны подтверждения от реплик, входящих в текущий ISR, включая лидера. Если число синхронных реплик меньше `min.insync.replicas`, запись с таким режимом не подтверждается успешно.\n\nНапример, при трёх репликах, `min.insync.replicas=2` и `acks=all` запись возможна при двух синхронных репликах. При одной брокер отклоняет попытку записи. Producer может повторить попытку, если позволяет его конфигурация.\n"
  popularity = 0.6

[[questions]]
  id = 19
  question = "Смещение (offset) в Kafka"
  answer = "**Offset** — позиция записи внутри партиции. Текущая позиция consumer показывает, откуда продолжится чтение. Зафиксированный offset группы показывает, откуда она начнёт после перезапуска или перераспределения партиций. Kafka хранит групповые offsets в `__consumer_offsets`.\n\nПри ручном управлении после успешной обработки можно зафиксировать позицию через `commitSync()`. Если передаёте offsets явно, указывайте следующую позицию для каждой партиции, а не offset последней обработанной записи. Автокоммит сам по себе не подтверждает завершение бизнес-операции.\n"
  popularity = 2.71

[[questions]]
  id = 20
  question = "Повторное чтение данных из Kafka"
  answer = "1. **Сбросить offset Consumer Group** — можно сбросить offset назад и прочитать сообщения повторно.\n    \n\n```bash\nkafka-consumer-groups --bootstrap-server localhost:9092 \\\n--group my-group \\\n--topic my-topic \\\n--reset-offsets --to-earliest --execute\n```\n\n2. **Использовать новую Consumer Group** — у новой группы нет сохранённого offset, поэтому можно начать чтение с начала с помощью:\n    \n\n```yaml\nspring:\n  kafka:\n    consumer:\n      group-id: new-group\n      auto-offset-reset: earliest\n```\n\n3. **Читать с конкретного offset**\n    \n\n```java\nconsumer.seek(\n    new TopicPartition(\"test-topic\", 0),\n    42\n);\n```\n\nВажно: `enable.auto.commit=false` только отключает автоматическое сохранение offset и само по себе не означает повторное чтение сообщений.\n"
  popularity = 0.6

[[questions]]
  id = 21
  question = "DLQ topic?"
  answer = "**DLQ** — отдельный топик для записей, которые приложение не смогло обработать после применимых повторов.\n\n---\n**Зачем нужен DLQ?**\n\nОн сохраняет исходную запись и сведения об ошибке, чтобы выяснить причину и при необходимости повторить обработку. Остальные записи можно обслуживать дальше согласно политике приложения.\n\n---\n**Как настроить DLQ?**\n\n- В Spring Kafka `DefaultErrorHandler` задаёт правила повторов и классификацию исключений. `DeadLetterPublishingRecoverer` публикует невосстановимую запись в выбранный топик. Для ошибок десериализации можно использовать `ErrorHandlingDeserializer`.\n- В собственном consumer приложение публикует запись в DLQ. Если политика разрешает пропустить её, коммитить соответствующий offset следует после подтверждения публикации. Повторная доставка зависит от порядка этих действий и обработки сбоев.\n- В Kafka Connect есть своя поддержка DLQ для подходящих коннекторов. Она настраивается отдельно от обычного consumer.\n"
  popularity = 1.2
