[[questions]]
  id = 1
  question = "REST"
  answer = "REST (Representational State Transfer) - это архитектурный стиль для построения WEB-API. Описывает, как клиент и сервер должны взаимодействовать через протокол HTTP"
  popularity = 6.63

[[questions]]
  id = 2
  question = "RESTful и RESTless"
  answer = "RESTful строго следует принципам REST, используя стандартные методы HTTP и чётко структурированные URL, а RESTless нарушает эти принципы, делая взаимодействие менее стандартным и более гибким"
  popularity = 2.11

[[questions]]
  id = 3
  question = "REST vs SOAP"
  answer = "SOAP и REST - это два разных подхода к разработке API. Подход SOAP отличается высокой степенью структурированности и использует формат данных XML. REST более гибкий и позволяет приложениям обмениваться данными в нескольких форматах\n\n_Примечание: на данный момент SOAP считается устаревшим подходом, используется только на легаси проектах_\n"
  popularity = 1.51

[[questions]]
  id = 4
  question = "В каких ситуациях допустимо использование RESTless"
  answer = "Использование RESTless допустимо:\n- в небольшом приложение, где строгие принципы REST не критичны\n- если существующая система уже использует другой подход и переделка будет слишком сложной\n"
  popularity = 0.0

[[questions]]
  id = 5
  question = "REST vs RPC. Как выбрать что лучше подходит?"
  answer = "Для работы с данными обычно используют REST.\nДля работы с действиями, операциями (logout, login, signin) RPC будет смотреться лучше.\n\nRPC все описывает глаголами, а REST - существительными\n"
  popularity = 3.61

[[questions]]
  id = 6
  question = "Назовите 6 принципов REST API"
  answer = "1. **Клиент–сервер.** Клиент и сервер разделяют обязанности и могут развиваться независимо.\n2. **Stateless.** Каждый запрос несёт данные, необходимые для обработки. Сервер хранит состояние ресурсов, а обработка запроса не требует сохранённого сервером состояния клиентской сессии.\n3. **Кэшируемость.** Ответ явно или неявно определяет, может ли его повторно использовать клиент или промежуточный кэш. В HTTP для этого есть, например, `Cache-Control`.\n4. **Единообразный интерфейс.** У ресурсов есть идентификаторы, с ресурсами работают через представления, сообщения самодостаточны, а ссылки в представлениях подсказывают доступные действия (HATEOAS). Общая семантика HTTP-методов помогает реализовать этот интерфейс.\n5. **Слои.** Клиенту не требуется знать, взаимодействует ли он с исходным сервером, прокси или шлюзом.\n6. **Код по требованию.** Сервер может отправить исполняемый код, например скрипт. Это необязательное ограничение REST.\n"
  popularity = 1.2

[[questions]]
  id = 7
  question = "Идемпотентный метод"
  answer = "HTTP-метод идемпотентен, если последовательность одинаковых запросов имеет на сервере тот же предполагаемый эффект, что один запрос. Например, первый `DELETE` может вернуть `204`, второй — `404`, а ресурс в обоих случаях остаётся удалённым. `GET`, `HEAD`, `OPTIONS`, `PUT` и `DELETE` по семантике идемпотентны. `POST` и `PATCH` такой гарантии по умолчанию не дают, хотя API может обеспечить её, например с ключом идемпотентности.\n"
  popularity = 2.71

[[questions]]
  id = 8
  question = "Основные HTTP методы"
  answer = "- GET - получение ресурса\n- POST - создание нового ресурса\n- PUT - полное обновление ресурса или создание, если его нет\n- PATCH - частичное обновление ресурса\n- DELETE - удаление ресурса\n- HEAD - получение заголовка ресурса\n- OPTIONS - узнать доступные методы для ресурса"
  popularity = 7.23

[[questions]]
  id = 9
  question = "Статусы ответов"
  answer = "- 1xx - информационные\n- 2xx - успешные\n- 3xx - перенаправления\n- 4xx - клиентские ошибки\n- 5xx - серверные ошибки"
  popularity = 2.41

[[questions]]
  id = 10
  question = "GET vs POST"
  answer = "| | GET | POST |\n|---|---|---|\n| Семантика | Запрос представления ресурса | Обработка переданных данных согласно правилам ресурса |\n| Безопасный метод HTTP | Да, предполагаемый эффект — чтение | Нет общей гарантии |\n| Идемпотентность | Да | Нет общей гарантии |\n| Кэширование | Обычно поддерживается при подходящих заголовках | Возможно при явной свежести и выполнении условий HTTP, используется реже |\n\n---\n**Почему для конфиденциальных данных обычно выбирают POST?**\n\nURL может попасть в историю браузера и журналы, поэтому секреты обычно передают в теле. Тело тоже могут логировать. Для защиты данных в пути используют HTTPS при любом HTTP-методе. Ограничения длины URI и тела зависят от реализации и настроек.\n\n---\n**Можем ли всегда использовать только POST и не работать с GET?**\n\nТехнически да. Тогда клиенты и посредники теряют стандартные гарантии безопасного чтения, подходящие повторные запросы и обычную работу кэша.\n\n---\n**Можем ли с помощью GET создать ресурс? Есть ли технические ограничения?**\n\nСервер технически может так сделать. Но это нарушит семантику безопасного метода, и ресурс может случайно создаться при предварительной загрузке или повторе.\n\n---\n**Почему в GET обычно не используют тело запроса?**\n\nHTTP не задаёт общей семантики для тела GET. Клиенту следует отправлять его только напрямую серверу, который заранее объявил поддержку такого запроса. Посредники могут отклонить его. Обычные фильтры передают в параметрах URL.\n"
  popularity = 4.82

[[questions]]
  id = 11
  question = "Разница HTTP и HTTPs"
  answer = "**HTTPS** — HTTP через защищённое соединение с TLS. TLS защищает содержимое запроса и ответа от чтения и изменения в пути. Клиент проверяет сертификат и имя сервера, чтобы аутентифицировать сервер. Порт по умолчанию для HTTPS — 443, для HTTP — 80.\n"
  popularity = 2.11

[[questions]]
  id = 12
  question = "Из чего состоит HTTP запрос"
  answer = "\n| **Часть**                       | **Описание**                                                                                                                         |\n| ------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------ |\n| Стартовая строка (Request Line) | Содержит метод запроса, URL-адрес и версию протокола HTTP.<br>Пример: `GET /index.html HTTP/1.1`                                     |\n| Заголовки (Headers)             | Метаданные о запросе: тип содержимого, длина, информация об авторизации и многое другое.<br>Пример: `Content-Type: application/json` |\n| Пустая строка                   | Разделяет заголовки и тело запроса                                                                                                   |\n| Тело запроса (Body)             | Непосредственно данные, которые передаются серверу (например, JSON, XML, файл). Присутствует не всегда                               |\n"
  popularity = 1.81

[[questions]]
  id = 13
  question = "Какие методы авторизации существуют для HTTP протокола?"
  answer = "\n| **Метод**                 | **Описание**                                                                                                           | **Особенности**                                                                                |\n| ------------------------- | ---------------------------------------------------------------------------------------------------------------------- | ---------------------------------------------------------------------------------------------- |\n| **Basic Authentication**  | Клиент отправляет логин и пароль, закодированные в Base64, в заголовке<br>`Authorization: Basic <encoded_credentials>` | Уязвим для перехвата без использования HTTPS. Рекомендуется использовать в сочетании с SSL/TLS |\n| **Bearer Token**          | Клиент отправляет токен в заголовке<br>`Authorization: Bearer <token>`                                                 | Используется с OAuth2 и JWT. Удобен для работы с API                                           |\n| **Digest Authentication** | Сервер отправляет клиенту nonce (одноразовый токен), который клиент использует для хеширования своих учетных данных    | Устаревший метод, сложен в реализации, менее популярен                                         |\n| **OAuth 2.0**             | Механизм авторизации через сторонние сервисы. Клиент получает токен доступа от сервера авторизации.                    | Расширяемый, позволяет использовать сторонние приложения (например, Google, Facebook)          |\n| **API Key**               | Клиент отправляет ключ API в заголовке, URL или параметре запроса                                                      | Прост, но менее безопасен. Требует защищенной передачи (HTTPS)                                 |\n| **Session-based**         | Клиент сохраняет идентификатор сессии в cookie, а сервер проверяет сессию по базе данных                               | Широко используется в веб-приложениях, требует управления серверной сессией                    |\n| **Custom Authentication** | Использование кастомных токенов или механизмов авторизации                                                             | Гибкость, но требует больше усилий для реализации и обеспечения безопасности                   |\n| **Mutual TLS**            | Двусторонняя аутентификация с использованием сертификатов TLS                                                          | Высокий уровень безопасности, сложен в настройке                                               |\n"
  popularity = 0.3

[[questions]]
  id = 14
  question = "Из чего состоит JSON Web Token?"
  answer = "JWT (JSON Web Token) - это стандартный способ передачи информации в компактном формате (JSON) с подписью для обеспечения его целостности и подлинности. Используется для авторизации, передачи данных между клиентом и сервером\n\n**Из чего состоит JWT?**\nJWT состоит из трех частей, разделенных точками (`.`):\n```\n<Header>.<Payload>.<Signature>\n```\n\n1. **Header (заголовок)** - содержит метаинформацию о токене:\n    - Алгоритм подписи (например, HMAC SHA256, RSA).\n    - Тип токена (`JWT`)\n    Пример:\n    ```json\n    {\n      \"alg\": \"HS256\",\n      \"typ\": \"JWT\"\n    }\n    ```\n2. **Payload (полезная нагрузка)** - содержит данные (как правило о пользователе) - клеймы, которые нужно передать. Может включать:\n    - **зарезервированные клеймы:** - стандартные поля, такие как `iss` (издатель), `exp` (время истечения), `sub` (субъект) и некоторые другие\n    - **пользовательские клеймы** - любые данные, такие как роль пользователя, идентификатор и т.д.\n    Пример:\n    ```json\n    {\n      \"sub\": \"1234567890\",\n      \"name\": \"John Doe\",\n      \"admin\": true\n    }\n    ```\n3. **Signature (подпись)** - нужна для подписи токена, чтобы можно было проверить его подлинность. Формируется с использованием заголовка, полезной нагрузки и секретного ключа (или приватного ключа в случае асимметричного алгоритма подписи)\n    Пример формулы:\n    ```\n    HMACSHA256(\n      base64UrlEncode(header) + \".\" + base64UrlEncode(payload),\n      secret\n    )\n    \n    ```\n\nПример JWT:\n```\neyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c\n\n```\n1. Header - `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9`\n2. Payload - `eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9`\n3. Signature - `SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c`\n"
  popularity = 0.9

[[questions]]
  id = 15
  question = "Какие протоколы уровня приложений?"
  answer = "Протоколы уровня приложений - это 7-й уровень модели OSI, который отвечает за взаимодействие приложений по сети\n\n**Основные протоколы:**\n- **HTTP, HTTPS** - передача данных в вебе\n- **FTP, SFTP** - передача файлов\n- **SMTP, POP3, IMAP** - почтовые протоколы\n- **WebSockets** - двусторонняя связь в реальном времени\n- **DNS** - преобразование доменов в IP\n- **MQTT** - обмен сообщениями в IoT\n- **gRPC** - бинарный протокол для микросервисов\n\n**Примеры использования**\n- Браузер (Chrome, Firefox) - HTTP/HTTPS\n- Почтовый клиент (Outlook, Gmail) - IMAP/SMTP\n- FTP-клиент (FileZilla) - FTP/SFTP\n"
  popularity = 0.3

[[questions]]
  id = 16
  question = "Что такое HTTP?"
  answer = "HTTP — протокол прикладного уровня с семантикой запросов, ответов, методов, заголовков и кодов статуса. Сами запросы независимы, а состояние приложения можно поддерживать, например, через cookie и серверные сессии. HTTP/1.1 использует текстовый формат стартовых строк и заголовков поверх TCP. HTTP/2 использует двоичные кадры, обычно поверх TLS/TCP. HTTP/3 передаёт HTTP через QUIC поверх UDP. HTTPS защищает соединение.\n"
  popularity = 0.9

[[questions]]
  id = 17
  question = "За что отвечают Cookie/куки?"
  answer = "Cookie - это небольшой файл с данными, который браузер сохраняет от имени веб-сайта. Они передаются между клиентом и сервером через заголовки HTTP\n\n**Основные задачи Cookie**\n- **Аутентификация** - хранение сессии пользователя (`JSESSIONID`, `session_token`)\n- **Персонализация** - запоминание настроек (язык, тема сайта)\n- **Трекинг и аналитика** - сбор данных о пользователях (Google Analytics)\n- **Сохранение корзины** - хранение товаров в интернет-магазине\n\n**Как работает Cookie?**\n1. Сервер отправляет Cookie клиенту (браузеру)\n```\nSet-Cookie: session_id=abc123; HttpOnly; Secure; Max-Age=3600\n```\n2. Клиент сохраняет Cookie и отправляет их при каждом запросе\n```\nCookie: session_id=abc123\n```\n3. Сервер проверяет Cookie и принимает решение (например, авторизация)\n\n\n**Виды Cookie**\n\n|**Тип Cookie**|**Описание**|\n|---|---|\n|**Session Cookie**|Удаляются после закрытия браузера|\n|**Persistent Cookie**|Хранятся определенное время (`Max-Age`, `Expires`)|\n|**HttpOnly Cookie**|Доступны только серверу (JS не может прочитать)|\n|**Secure Cookie**|Отправляются только по HTTPS|\n|**SameSite Cookie**|Защита от CSRF (можно ограничить передачу)|\n\n**Пример Set-Cookie с атрибутами**\n```\nSet-Cookie: user=Alice; Expires=Wed, 21 Oct 2025 07:28:00 GMT; Secure; HttpOnly; SameSite=Strict\n```\n"
  popularity = 0.6

[[questions]]
  id = 18
  question = "Отличия POST, PUT, PATCH"
  answer = "| Метод | Семантика | Идемпотентность |\n|---|---|---|\n| `POST` | Ресурс обрабатывает переданные данные по своим правилам. Например, `POST /users` создаёт пользователя | HTTP её не обещает. API может явно поддерживать ключ идемпотентности |\n| `PUT` | Создаёт или заменяет состояние ресурса по указанному URI. Например, `PUT /users/123` | Повтор одинакового запроса имеет тот же предполагаемый эффект, даже если статус ответа изменится |\n| `PATCH` | Применяет изменения, описанные в документе обновления. Например, задаёт новый email | Зависит от операции. Установка фиксированного email может быть идемпотентной, а добавление записи в историю — нет |\n\nФормат тела `PATCH` определяет `Content-Type`, например JSON Patch или JSON Merge Patch."
  popularity = 3.31
