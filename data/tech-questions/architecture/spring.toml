[[questions]]
  id = 24
  question = "Блокировка по умолчанию в Spring"
  answer = "`@Transactional` задаёт границы и настройки транзакции. Автоматическая оптимистическая проверка появляется при настройке версионирования сущности. При обычном обновлении сущности с `@Version` JPA проверяет версию и обнаруживает конкурентное изменение. Для пессимистической блокировки можно явно запросить `LockModeType.PESSIMISTIC_WRITE` или использовать `SELECT ... FOR UPDATE`.\n\nСама СУБД использует блокировки при изменении строк согласно своим правилам. Прямой bulk update через JPQL или Criteria обходит обычную проверку `@Version` для каждой сущности."
  popularity = 0.3

[[questions]]
  id = 25
  question = "@Transactional. Как работает?"
  answer = "Spring в прокси-режиме перехватывает вызов транзакционного метода и передаёт работу менеджеру транзакций. Он создаёт транзакцию или присоединяется к текущей по правилам propagation, а после вызова фиксирует изменения или применяет правила отката.\n\n---\n**Что можно пометить аннотацией @Transactional?**\n\nНа методе или на классе как настройку по умолчанию для методов, которые может перехватить прокси. Интерфейсный прокси перехватывает публичные методы интерфейса. Классовый прокси в Spring 6+ также может поддерживать `protected` и пакетную видимость. `private` метод и прямой вызов внутри того же бина не перехватываются.\n\n---\n**Какой propagation по умолчанию?**\n\n`REQUIRED`. Участвует в существующей транзакции или создаёт новую.\n\n---\n**Какие способы управления транзакциями в Spring вы знаете?**\n\nДекларативный `@Transactional` и программные `TransactionTemplate` или `PlatformTransactionManager`.\n"
  popularity = 25.6

[[questions]]
  id = 26
  question = "Какие есть атрибуты у @Transactional?"
  answer = "| Атрибут | Назначение и значение по умолчанию |\n|---|---|\n| `propagation` | `REQUIRED`. Участвовать в имеющейся транзакции или создать новую. |\n| `isolation` | `DEFAULT`. Использовать изоляцию, заданную менеджером или ресурсом. |\n| `readOnly` | `false`. Значение `true` передаёт менеджеру и ресурсу подсказку о чтении. Возможность записи зависит от реализации. |\n| `timeout`, `timeoutString` | Тайм-аут новой транзакции в секундах. Значение по умолчанию берётся из настроек менеджера или ресурса. `timeoutString` позволяет передать значение строкой. |\n| `rollbackFor`, `noRollbackFor` | Правила отката по типам исключений. |\n| `rollbackForClassName`, `noRollbackForClassName` | Правила по шаблонам имён исключений. |\n| `transactionManager`, `value` | Синонимы для выбора менеджера транзакций по имени или квалификатору. |\n| `label` | Метки для интерпретации менеджером транзакций. |\n\n`isolation` и `timeout` применяются при создании новой транзакции. При присоединении к существующей действуют её настройки.\n"
  popularity = 4.22

[[questions]]
  id = 27
  question = "Атрибут propagation у @Transactional"
  answer = "| Propagation | Поведение |\n|---|---|\n| `REQUIRED` | Участвует в текущей транзакции или создаёт новую. |\n| `SUPPORTS` | Участвует в текущей транзакции при её наличии, иначе выполняется без транзакции. |\n| `MANDATORY` | Требует текущую транзакцию, иначе выбрасывает исключение. |\n| `REQUIRES_NEW` | Создаёт независимую физическую транзакцию. Текущая приостанавливается, если она есть и менеджер поддерживает приостановку. |\n| `NOT_SUPPORTED` | Выполняется без транзакции. Текущая приостанавливается при её наличии. |\n| `NEVER` | Требует отсутствия текущей транзакции, иначе выбрасывает исключение. |\n| `NESTED` | При наличии текущей транзакции использует точку сохранения, если менеджер и ресурс это поддерживают. Без текущей транзакции создаёт новую. |\n\nФиксация или откат `REQUIRES_NEW` отделены от внешней транзакции. Исключение, вышедшее из внутреннего метода, всё равно может вызвать откат внешней по её правилам. При `NESTED` внешний откат отменяет и работу, выполненную после точки сохранения.\n"
  popularity = 8.73

[[questions]]
  id = 28
  question = "@Transaction Что будет если вызвать метод из метода в одном классе при различных сценариях"
  answer = "Прямой вызов `this.inner()` внутри того же Spring-бина обходит прокси. Если снаружи нет транзакции, аннотация внутреннего метода её не создаст. Если внешняя транзакция уже есть, вызов продолжится в ней. `REQUIRES_NEW` внутреннего метода при прямом вызове не применяется.\n\n---\n**Как исправить?**\n\nВынести внутренний метод в отдельный бин и вызвать его через Spring-прокси.\n\n```java\n@Service\nclass InnerService {\n    @Transactional(propagation = Propagation.REQUIRES_NEW)\n    public void inner() {\n        // Работа с БД\n    }\n}\n\n@Service\n@RequiredArgsConstructor\nclass OuterService {\n    private final InnerService innerService;\n\n    public void outer() {\n        innerService.inner();\n    }\n}\n```\nАльтернатива — `TransactionTemplate` с нужным propagation. Self-injection требует вызова действительно через прокси. Прямая циклическая зависимость через конструктор отличается от внедрения через `@Lazy`, когда ссылка разрешается позже.\n"
  popularity = 15.06

[[questions]]
  id = 29
  question = "Как гарантировать корректное обновление и сохранение изменений в сущностях, полученных в методе с @Transactional"
  answer = "Hibernate отслеживает изменения управляемой сущности в persistence context. `flush` синхронизирует изменения с БД, а успешный `commit` фиксирует их. Например, после загрузки сущности в транзакционном сервисе можно изменить её поле без отдельного `save()`.\n\nНовый объект делают управляемым через `persist()`. У detached-объекта изменения сами по себе не отслеживаются. `merge()` копирует его состояние в управляемый экземпляр и возвращает этот экземпляр. Режим чтения, настройки flush и откат влияют на результат.\n"
  popularity = 1.2

[[questions]]
  id = 30
  question = "@Transactional и Исключения"
  answer = "| Сценарий | Что делает Spring по умолчанию |\n|---|---|\n| Из транзакционного метода выходит `RuntimeException` или `Error` | Откатывает транзакцию |\n| Из метода выходит checked exception | Само исключение не запускает откат. Можно настроить `rollbackFor`. |\n| Исключение обработано внутри метода | Spring видит нормальное завершение. Если транзакция уже помечена `rollback-only`, она всё равно откатится. |\n\nНапример, внутренний транзакционный метод с `REQUIRED` пометил общую транзакцию на откат. Перехват исключения во внешнем методе не снимет эту отметку, а попытка коммита может привести к `UnexpectedRollbackException`. В Spring 6.2+ правило по умолчанию можно изменить через `rollbackOn = ALL_EXCEPTIONS`.\n"
  popularity = 2.71

[[questions]]
