[[questions]]
  id = 33
  question = "Spring Criteria API"
  answer = "**JPA Criteria API** позволяет программно создавать запросы и добавлять условия по мере необходимости. В Spring Data JPA условия Criteria можно оформлять как `Specification` и применять через `JpaSpecificationExecutor`.\n\n```java\nCriteriaBuilder cb = em.getCriteriaBuilder();\nCriteriaQuery<Employee> query = cb.createQuery(Employee.class);\nRoot<Employee> employee = query.from(Employee.class);\nquery.select(employee).where(cb.equal(employee.get(Employee_.name), name));\nList<Employee> result = em.createQuery(query).getResultList();\n```\n\n`Employee_.name` берётся из статической метамодели и позволяет проверять имя и тип Java-атрибута при компиляции. Вариант `employee.get(\"name\")` проверяется при выполнении."
  popularity = 2.71

[[questions]]
  id = 34
  question = "@Scheduled"
  answer = "`@Scheduled` запускает метод по расписанию. Для обработки аннотации в конфигурации обычно включают `@EnableScheduling`.\n\n- `fixedRate` — заданный период между запланированными запусками.\n- `fixedDelay` — пауза после окончания предыдущего запуска.\n- `cron` — расписание по календарю. Часовой пояс можно указать через `zone`.\n\nЕсли планировщик не настроен, Spring Framework может использовать локальный однопоточный планировщик. Пул при необходимости настраивают через `TaskScheduler`. Если приложение запущено в нескольких репликах, каждая запускает свою копию задачи. Если нужен один запуск на кластер, используют внешний планировщик, блокировку или разделение работы.\n"
  popularity = 3.01

[[questions]]
  id = 35
  question = "Понятие Controller и Servlet в Java. Это одно и то же? Если разное, в чем отличия?"
  answer = "Понятия сервлета и контроллера принадлежат разным концепциям, хотя оба используются для обработки HTTP-запросов в Java веб-приложениях.\n\n**Servlet** - это Java-класс, который обрабатывает HTTP-запросы (HTTP GET, POST и т.д.) и возвращает HTTP-ответы. Он является основой для создания серверных приложений в Java\n\n**Controller** - это часть архитектуры MVC (Model-View-Controller). В контексте Java это обычно класс, аннотированный, например, `@Controller` в Spring MVC, который обрабатывает HTTP-запросы и управляет их маршрутизацией\n\nКонтроллер **абстрагирует разработчика от низкоуровневых деталей** (например, работы с HTTP-запросами и ответами), позволяя сосредоточиться на бизнес-логике\n\n**Основные отличия Servlet и Controller**\n\n| **Критерий**           | **Servlet**                                                                 | **Controller**                                             |\n| ---------------------- | --------------------------------------------------------------------------- | ---------------------------------------------------------- |\n| **Область применения** | Низкоуровневая обработка HTTP-запросов                                      | Высокоуровневый компонент архитектуры MVC                  |\n| **Ручная работа**      | Требуется больше ручной работы для маршрутизации и обработки данных         | Маршрутизация и обработка запросов автоматизированы        |\n| **Инструменты**        | Использует контейнер сервлетов (например, Tomcat)                           | Использует веб-фреймворки (например, Spring MVC)           |\n| **Гибкость**           | Полный контроль над HTTP-запросами и ответами                               | Сосредоточен на бизнес-логике, делегируя детали фреймворку |\n| **Уровень абстракции** | Низкий: работа напрямую с `HttpServletRequest` и  <br>`HttpServletResponse` | Высокий: аннотации и абстрагирование низкоуровневой логики |\n| **Пример**             | `HttpServlet`, `GenericServlet`                                             | `@Controller` в Spring, `@RestController`                  |\n"
  popularity = 0.9

[[questions]]
  id = 36
  question = "Что такое объект Filter? В какой момент вызывается?"
  answer = "`Filter` - это интерфейс из Java Servlet API, который позволяет перехватывать и изменять HTTP-запросы и ответы. Фильтры часто используются для задач, которые необходимо выполнить до или после обработки запроса в сервлете (или контроллере в случае Spring), например:\n- Аутентификация и авторизация\n- Логирование запросов\n- Сжатие ответов\n- Кэширование\n- Добавление или изменение заголовков запросов и ответов\n\n**Когда вызывается фильтр?**\nHTTP Request -> Filter chain -> DispatcherServlet -> Controller -> ... ->Response -> Filters\n\nФильтры вызываются **до** попадания HTTP-запроса в DispatcherServlet (и тем более контроллера) и **после** возвращения ответа от него\n- До контроллера - обрабатывают входящий HTTP-запрос\n- После - могут изменить HTTP-ответ перед отправкой клиенту\n\nЧаще всего для кастомных фильтров используется расширение класса `OncePerRequestFilter`\n"
  popularity = 0.6

[[questions]]
  id = 37
  question = "Что такое ApplicationContext? Как работает под капотом"
  answer = "**`ApplicationContext`** — это центральный интерфейс контейнера Spring, который управляет жизненным циклом бинов, их зависимостями и предоставляет дополнительные возможности для разработки приложений. Это расширение интерфейса **`BeanFactory`**, добавляющее множество дополнительных функций, таких как обработка событий, поддержка интернационализации и интеграция с AOP.\n\n **Основные функции ApplicationContext**\n\n1. **Управление бин-компонентами:**\n    - Автоматическое создание, связывание и уничтожение бинов.\n2. **Инжекция зависимостей:**\n    - Поддерживает механизмы Dependency Injection (DI).\n3. **Обработка событий:**\n    - Поддерживает публикацию и прослушивание событий (например, ContextRefreshedEvent).\n4. **Интернационализация:**\n    - Предоставляет механизмы для работы с сообщениями и локалями.\n5. **Интеграция с AOP:**\n    - Позволяет внедрять аспекты в приложение.\n\n\n```java\nimport org.springframework.context.ApplicationContext;\nimport org.springframework.context.annotation.AnnotationConfigApplicationContext;\n\npublic class MyApp {\n    public static void main(String[] args) {\n        ApplicationContext context = new AnnotationConfigApplicationContext(AppConfig.class);\n        MyBean myBean = context.getBean(MyBean.class);\n        myBean.doSomething();\n    }\n}\n\n```\n\n``` text\nчитает конфигурацию\n↓\nрегистрирует BeanDefinition\n↓\nсоздаёт и настраивает бины\n↓\nоборачивает в proxy\n↓\nуправляет их жизнью\n```\n\n---\n***Расскажи про разницу между ApplicationContext и BeanFactory***\n\n**`BeanFactory`** — это базовый контейнер Spring для управления объектами (бинами).  \nОн отвечает за инициализацию, связывание и предоставление бинов по запросу.  \nОднако **`BeanFactory`** менее функционален, чем **`ApplicationContext`**, так как предоставляет только базовые возможности управления бинами.\n\n```java\nimport org.springframework.beans.factory.xml.XmlBeanFactory;\nimport org.springframework.core.io.ClassPathResource;\n\npublic class MyApp {\n    public static void main(String[] args) {\n        BeanFactory factory = new XmlBeanFactory(new ClassPathResource(\"beans.xml\"));\n        MyBean myBean = (MyBean) factory.getBean(\"myBean\");\n        myBean.doSomething();\n    }\n}\n\n```\n\n- **ApplicationContext** — более мощный и функциональный контейнер, подходящий для полноценных приложений.\n- **BeanFactory** — легковесный контейнер, используется редко и преимущественно в ограниченных задачах или для оптимизации ресурсов.\n\n **Различия между ApplicationContext и BeanFactory**\n\n| Критерий                            | ApplicationContext                                                                  | BeanFactory                                               |\n| ----------------------------------- | ----------------------------------------------------------------------------------- | --------------------------------------------------------- |\n| **Область применения**              | Полноценный контейнер для разработки современных приложений.                        | Базовый контейнер для управления бинами.                  |\n| **Загрузка бинов**                  | Загружает все бины при инициализации контекста (eager loading).                     | Загружает бины по запросу (lazy loading).                 |\n| **Поддержка событий**               | Поддерживает публикацию и обработку событий (ApplicationEvent).                     | Не поддерживает события.                                  |\n| **Интернационализация**             | Встроенная поддержка интернационализации (I18N).                                    | Отсутствует.                                              |\n| **Интеграция с AOP**                | Поддержка AOP для внедрения аспектов.                                               | Ограниченная интеграция с AOP.                            |\n| **Преимущество производительности** | Менее производителен при большом количестве бинов (загрузка всех бинов при старте). | Производителен, так как загружает бины только по запросу. |\n| **Поддержка аннотаций**             | Полная поддержка аннотаций (например, `@Component`, `@Autowired`).                  | Ограниченная поддержка.                                   |\n| **Расширенные возможности**         | Поддержка профилей, автоконфигурации, REST и других функций.                        | Только базовая работа с бинами.                           |\n\n\n **Когда использовать**\n\n| Ситуация                                     | ApplicationContext     | BeanFactory |\n| -------------------------------------------- | ---------------------- | ----------- |\n| Полноценное приложение                       | Да                     | Нет         |\n| Требуется работа с событиями                 | Да                     | Нет         |\n| Экономия памяти при большом количестве бинов | Нет                    | Да          |\n| Тестовые приложения                          | Возможен, но избыточен | Да          |\n\n---\n\n***Можно поднять несколько контекстов?***\n\nДа, в Spring можно создать несколько контекстов. Это может быть полезно для разделения конфигурации, областей ответственности или работы с вложенными контекстами.\n\n **Примеры использования нескольких контекстов**\n\n **1. Вложенные контексты**\n\nМожно создать основной (parent) и дочерний (child) контексты. Основной контекст может предоставлять бины, доступные дочерним контекстам, но не наоборот.\n\n**Пример:**\n\n```java\nApplicationContext parentContext = new AnnotationConfigApplicationContext(ParentConfig.class);\nAnnotationConfigApplicationContext childContext = new AnnotationConfigApplicationContext();\nchildContext.setParent(parentContext);\nchildContext.register(ChildConfig.class);\nchildContext.refresh();\n```\n\n **2. Несколько независимых контекстов**\n\nЕсли контексты не связаны друг с другом, они не делятся бинами и настройками.\n\n**Пример:**\n\n```java\nApplicationContext context1 = new AnnotationConfigApplicationContext(AppConfig1.class);\nApplicationContext context2 = new AnnotationConfigApplicationContext(AppConfig2.class);\n```\n\n **Преимущества использования нескольких контекстов**\n\n- Разделение конфигурации между модулями приложения.\n- Изоляция модулей для тестирования.\n- Улучшение модульности и читаемости кода.\n\n **Недостатки**\n\n- Увеличенная сложность управления.\n- Возможные конфликты бинов между контекстами.\n\n"
  popularity = 5.42

[[questions]]
  id = 38
  question = "Зачем нужны аннотации @RequestParam и @PathVariable?"
  answer = "Эти аннотации используются в Spring MVC для извлечения параметров из HTTP-запросов. Они применяются в методах контроллера\n\n`@RequestParam(name)` позволяет извлечь из запроса параметр с именем `name`\n```java\n@GetMapping(\"/api/users\")\npublic String getUser(@RequestParam String name, @RequestParam(defaultValue = \"0\") int page) {\n    return \"Name: \" + name + \", Page: \" + page;\n}\n```\n\n`@PathVariable` извлекает путь-параметр указанный в маппинге в параметр метода\n```java\n@GetMapping(\"/api/users/{id}\")\npublic String getUserById(@PathVariable int id) {\n    return \"User ID: \" + id;\n}\n```\n"
  popularity = 0.6

[[questions]]
  id = 39
  question = "@ConfigurationProperties? ConfigurationProperties vs Value"
  answer = "`@ConfigurationProperties` связывает группу свойств с типизированным объектом по префиксу. Поддерживает вложенные значения, преобразование типов и валидацию с `@Validated`. Класс регистрируют, например, через `@ConfigurationPropertiesScan` или `@EnableConfigurationProperties`. Также возможна регистрация mutable класса как компонента.\n\n`@Value` удобно для отдельного значения: `@Value(\"${app.timeout:30}\")`. Оно поддерживает placeholders и SpEL. Для связанных параметров предпочтительнее `@ConfigurationProperties`.\n\n---\n**Когда использовать?**\n\nДля отдельного значения или выражения подойдёт `@Value`. Для группы связанных свойств, валидации и типизированной конфигурации выбирают `@ConfigurationProperties`.\n"
  popularity = 0.9

[[questions]]
  id = 40
  question = "@Value. Что это?"
  answer = "`@Value` сообщает Spring, какое значение подставить в поле, параметр или сеттер управляемого объекта. `${app.name}` разрешается из окружения, а `#{...}` вычисляет SpEL-выражение. Контейнер при необходимости преобразует значение к типу точки внедрения. Для самого значения регистрировать отдельный бин не требуется.\n"
  popularity = 0.9

[[questions]]
  id = 41
  question = "Как работает DispatcherServlet?"
  answer = "`DispatcherServlet` — фронт-контроллер Spring MVC. Он получает запрос, через `HandlerMapping` ищет обработчик, а через `HandlerAdapter` вызывает его. Перехватчики могут работать до и после вызова, а исключения обрабатывают `HandlerExceptionResolver`. Если обработчик вернул имя представления, `ViewResolver` находит объект `View`. При `@ResponseBody` или `@RestController` результат обычно пишет `HttpMessageConverter`, например сериализует объект в JSON.\n\n\n{{< figure src=\"/java-backend-interview-prep/dispatcher_servlet.png\" title=\"\" >}}"
  popularity = 2.11

[[questions]]
  id = 42
  question = "Варианты обработки Exceptions в Spring"
  answer = "**1. Методы с аннотацией `@ExceptionHandler` в контроллере**\n- используются для обработки исключений на уровне контроллера\n- позволяют привязать обработку конкретных исключений к определённому методу в контроллере\n```java\n@RestController\npublic class MyController {\n                ...\n\n    @ExceptionHandler(IllegalArgumentException.class)\n    public ResponseEntity<String> handleIllegalArgument(IllegalArgumentException e) {\n        return ResponseEntity.badRequest().body(\"Error: \" + e.getMessage());\n    }\n}\n```\n\n**2. Методы с аннотацией `@ExceptionHandler` в `@ControllerAdvice`** для централизованной глобальной обработки исключений\n```java\n@ControllerAdvice\npublic class GlobalExceptionHandler {\n\n    @ExceptionHandler(IllegalArgumentException.class)\n    public ResponseEntity<String> handleIllegalArgument(IllegalArgumentException e) {\n        return ResponseEntity.badRequest().body(\"Global Error: \" + e.getMessage());\n    }\n}\n```\n\n**3. ResponseStatusException** позволяет выбрасывать исключения с указанием HTTP-статуса и сообщения\n```java\n@GetMapping(\"/error\")\npublic void error() {\n    throw new ResponseStatusException(HttpStatus.NOT_FOUND, \"Resource not found\");\n}\n```\n\n**4. @ResponseStatus на классе исключения**\n```java\n@ResponseStatus(HttpStatus.NOT_FOUND)\npublic class ResourceNotFoundException extends RuntimeException {\n    public ResourceNotFoundException(String message) {\n        super(message);\n    }\n}\n\n@GetMapping(\"/resource\")\npublic void getResource() {\n    throw new ResourceNotFoundException(\"Resource not found\");\n}\n```\n\n**5. HandlerExceptionResolver**\n- низкоуровневый подход для полного контроля над обработкой исключений.\n- требует реализации интерфейса `HandlerExceptionResolver`\n```java\n@Component\npublic class CustomExceptionResolver implements HandlerExceptionResolver {\n\n    @Override\n    public ModelAndView resolveException(HttpServletRequest request, HttpServletResponse response, Object handler, Exception ex) {\n        try {\n            response.sendError(HttpServletResponse.SC_BAD_REQUEST, ex.getMessage());\n        } catch (IOException e) {\n            e.printStackTrace();\n        }\n        return new ModelAndView();\n    }\n}\n```\n\n**6. RestTemplate и WebClient**\nДля обработки ошибок при выполнении REST-запросов можно использовать кастомные обработчики ошибок, такие как `ResponseErrorHandler` для `RestTemplate`\n```java\nRestTemplate restTemplate = new RestTemplate();\nrestTemplate.setErrorHandler(new DefaultResponseErrorHandler() {\n    @Override\n    public void handleError(ClientHttpResponse response) throws IOException {\n        // Обработка ошибки\n    }\n});\n```\n\n---\n***Как транзакционная логика обрабатывает исключения?***\n\n\nSpring использует транзакционный менеджер для обработки транзакций. Исключения в транзакционной логике влияют на коммит или откат (rollback) транзакции.\n\n **Основные принципы обработки исключений в транзакциях:**\n\n1. **Rollback для `RuntimeException` и `Error`:**\n    \n    - По умолчанию, Spring откатывает транзакцию при возникновении `RuntimeException` или `Error`.\n    - Исключения типа `Checked Exception` (например, `SQLException`) **не приводят к откату транзакции**, если это явно не указано.\n2. **Настройка rollback:** Можно указать, какие исключения должны приводить к откату.\n    \n\n**Пример:**\n\n```java\n@Transactional(rollbackFor = Exception.class)\npublic void performTransaction() throws Exception {\n    // Если выбрасывается Exception, транзакция откатывается\n    throw new Exception(\"Transaction failed\");\n}\n```\n\n3. **Сохранение состояния после исключения:** Если транзакция откатывается, изменения, внесённые в базу данных в рамках транзакции, не сохраняются.\n    \n4. **Работа с `@Transactional`:**\n    \n    - Если транзакция завершается с ошибкой, контейнер Spring вызывает метод `rollback` у используемого транзакционного менеджера.\n    - Для методов `private` или вызовов внутри того же класса обработка транзакций может не сработать.\n\n**Пример:**\n\n```java\n@Transactional\npublic void process() {\n    try {\n        performAction();\n    } catch (Exception e) {\n        // Исключение обработано, транзакция откатывается\n        throw e;\n    }\n}\n\nprivate void performAction() {\n    // Действия, которые вызывают исключение\n    throw new RuntimeException(\"Error in action\");\n}\n```\n\n **Основные проблемы и решения:**\n\n|Проблема|Решение|\n|---|---|\n|Внутренний вызов метода с `@Transactional`.|Использовать прокси или вызывать метод через другой бин.|\n|Исключение `Checked Exception` не приводит к rollback.|Указать `rollbackFor` в аннотации `@Transactional`.|\n|Повторное использование транзакции.|Указать параметр `propagation`, например, `Propagation.REQUIRES_NEW` для открытия новой транзакции.|\n\n"
  popularity = 1.2

[[questions]]
  id = 43
  question = "@Configuration. Является Configuration компонентом? Какую доп логику Configuration реализует?"
  answer = "Аннотация `@Configuration` является специализированным компонентом Spring. Она указывает, что класс используется для конфигурации приложения, включая создание бинов. Обрабатывается аналогично аннотации `@Component`\n\n**Дополнительная логика, реализуемая @Configuration**\n**1. Определение бинов (@Bean)** - классы с `@Configuration` позволяют определять методы, помеченные как `@Bean`, которые возвращают бины\n```java\n@Configuration\npublic class AppConfig {\n\n    @Bean\n    public MyService myService() {\n        return new MyService();\n    }\n}\n```\n\n**2. Поддержка прокси (proxyBeanMethods = true)** - по умолчанию Spring оборачивает класс с `@Configuration` в прокси для обеспечения корректного создания и управления зависимостями. Это позволяет ссылаться на один и тот же экземпляр бина\n```java\n@Configuration\npublic class AppConfig {\n\n    @Bean\n    public ServiceA serviceA() {\n        return new ServiceA(serviceB());\n    }\n\n    @Bean\n    public ServiceB serviceB() {\n        return new ServiceB();\n    }\n}\n```\nПри вызове `serviceB()` внутри метода `serviceA()` контейнер Spring возвращает тот же экземпляр `ServiceB`\n\n**3. Логика для импорта конфигурации** - класс с `@Configuration` может импортировать другие классы конфигурации через `@Import`\n```java\n@Configuration\n@Import(AnotherConfig.class)\npublic class AppConfig {}\n```\n\n** 4. Поддержка дополнительных аннотаций** - в классах с `@Configuration` можно использовать такие аннотации, как `@ComponentScan`, `@PropertySource`, и другие\n\n**`@Configuration` vs `@Component`**\nАннотации `@Configuration` и `@Component` в Spring используются для регистрации бинов в контейнере, но они имеют разные цели и поведение\n\n|**Критерий**|`@Configuration`|`@Component`|\n|---|---|---|\n|**Назначение**|Используется для создания конфигурационных классов и бинов|Используется для обозначения обычного Spring-компонента|\n|**Создание бинов**|Определяет бины через методы с аннотацией `@Bean`|Бины создаются автоматически (через сканирование классов)|\n|**Прокси (proxyBeanMethods)**|По умолчанию `true`, что обеспечивает singleton для бинов|Прокси не используется|\n|**Семантика**|Обозначает, что класс содержит настройки для приложения|Описывает логический компонент приложения|\n|**Импорт конфигураций**|Поддерживает `@Import` для подключения других конфигураций|Не поддерживает|\n|**Использование вместе с @Bean**|Методы с `@Bean` гарантируют создание одного экземпляра (singleton)|Методы с `@Bean` вызываются напрямую стандартным способом|\n|**Где использовать**|В конфигурационных классах для определения настроек и бинов|В служебных классах, сервисах, репозиториях и т.д.|\n"
  popularity = 1.2

[[questions]]
  id = 44
  question = "@PostConstruct"
  answer = "Метод, помеченный аннотацией `@PostConstruct` определяется спрингом как `init`-метод для бина, который должен быть выполнен после того, как бин был полностью создан и его зависимости внедрены. Этот метод вызывается один раз для каждого экземпляра бина\n\n**Сколько `@PostConstruct` можно задекларировать в бине?**\nСогласно спецификации, в одном классе должен быть только один метод, помеченный `@PostConstruct`. Однако у одного бина может быть несколько `@PostConstruct`-методов, если они объявлены в разных классах иерархии наследования. Spring вызовет такие методы при инициализации бина.\n\n"
  popularity = 2.41

[[questions]]
  id = 45
  question = "Dependency management в Spring boot"
  answer = "В Spring Boot используется механизм Maven или Gradle для автоматического добавления, обновления и совместимости библиотек\n1. **Spring Boot Starter Dependencies** - группы зависимостей, которые включают всё необходимое для работы с определённым функционалом\n2. **Spring Boot Dependency Management:**\n    - использует BOM (Bill of Materials) для управления версиями зависимостей\n    - версии зависимостей определяются в родительском POM (`spring-boot-dependencies`), что гарантирует их совместимость\n    ```xml\n    <parent>\n        <groupId>org.springframework.boot</groupId>\n        <artifactId>spring-boot-starter-parent</artifactId>\n        <version>3.0.0</version>\n    </parent>\n    ```\n\t- в Gradle для этого используется плагин `io.spring.dependency-management`\n3. **Профили зависимостей** - можно включать зависимости в зависимости от среды выполнения (например, dev, test, prod) с помощью профилей Maven\n4. **Явное указание зависимости** - Spring Boot позволяет переопределить версию зависимости, если требуется особая\n"
  popularity = 0.3

[[questions]]
  id = 46
  question = "Spring Security, как хранить пароль пользователя?"
  answer = "Пароли хранят в виде результатов адаптивной функции хеширования с солью.\n\n---\n**Как хранить пароль в Spring Security?**\n\nЗарегистрируйте бин `PasswordEncoder`, например `new BCryptPasswordEncoder()`. Сохраните результат `passwordEncoder.encode(rawPassword)` и при входе проверьте `passwordEncoder.matches(rawPassword, storedHash)`. `DelegatingPasswordEncoder` позволяет хранить идентификатор алгоритма вместе с хешем.\n\n---\n**Чем различаются алгоритмы?**\n\nBCrypt имеет настраиваемый фактор стоимости. Argon2, в частности Argon2id, является memory-hard и настраивает затраты памяти, число проходов и параллелизм. Параметры выбирают по измерениям на сервере. Соль обычно хранится вместе с результатом, пароль в открытом виде не сохраняют.\n\n---\n**Почему BCrypt?**\n\nОн автоматически добавляет соль и позволяет настроить вычислительную стоимость. При выборе следует учитывать ограничение BCrypt в 72 байта входа. Лимит относится к байтам, поэтому число символов зависит от кодировки.\n"
  popularity = 0.6

[[questions]]
  id = 47
  question = "Spring Profiles как с ними работать?"
  answer = "Профили включают наборы конфигурации и бинов.\n\n---\n**Как установить профиль?**\n\nВ Spring Boot профиль задают через `spring.profiles.active`, например аргументом `--spring.profiles.active=dev`.\n\n---\n**Как создать разные настройки для профилей?**\n\nСвойства окружения можно положить в `application-dev.yml`.\n`@Profile(\"dev\")` регистрирует соответствующий бин при активном `dev`. Бин с `@Profile(\"prod\")` появляется при активном `prod`. Несколько профилей могут действовать вместе. Для условия «dev не активен» можно задать `@Profile(\"!dev\")`. Если профиль не задан, Spring использует профиль по умолчанию.\n"
  popularity = 1.51

[[questions]]
  id = 48
  question = "Виды proxy в Spring"
  answer = "\nSpring использует динамическое проксирование для создания AOP-обёрток над бинами.\n\n|**Тип Proxy**|**Описание**|**Как создается?**|\n|---|---|---|\n|**JDK Dynamic Proxy**|Использует `java.lang.reflect.Proxy`|Создаёт proxy, реализующий интерфейсы|\n|**CGLIB Proxy**|Использует `org.springframework.cglib.proxy`|Создаёт подкласс целевого класса|\n\nAspectJ не является отдельным типом proxy. Это отдельный механизм AOP, использующий bytecode weaving.\n\n**JDK Dynamic Proxy (`java.lang.reflect.Proxy`)**\n\n- Используется для объектов, реализующих интерфейсы.\n    \n- Создает proxy-класс, который реализует интерфейсы целевого объекта.\n    \n\n```java\npublic interface Service {\n    void doWork();\n}\n\npublic class ServiceImpl implements Service {\n    public void doWork() {\n        ...\n    }\n}\n```\n\nСоздание динамического proxy вручную:\n\n```java\nService target = new ServiceImpl();\n\nService proxy = (Service) Proxy.newProxyInstance(\n    Service.class.getClassLoader(),\n    new Class[]{Service.class},\n    (proxyObj, method, args) -> {\n        System.out.println(\"Логирование перед вызовом метода...\");\n        return method.invoke(target, args);\n    }\n);\n\nproxy.doWork();\n```\n\n**CGLIB Proxy (`org.springframework.cglib.proxy`)**\n\n- Используется для проксирования классов.\n    \n- Создает подкласс оригинального класса.\n    \n- Может использоваться даже если класс реализует интерфейс, если class-based proxy включён явно.\n    \n\n```java\nclass UserService {}\n\nclass UserService$$SpringCGLIB extends UserService {}\n```\n\nСоздание CGLIB-proxy вручную:\n\n```java\nEnhancer enhancer = new Enhancer();\nenhancer.setSuperclass(ServiceImpl.class);\n\nenhancer.setCallback((MethodInterceptor) (obj, method, args, proxy) -> {\n    System.out.println(\"Логирование перед вызовом метода...\");\n    return proxy.invokeSuper(obj, args);\n});\n\nServiceImpl proxy = (ServiceImpl) enhancer.create();\nproxy.doWork();\n```\n\nНельзя проксировать:\n\n- `final` классы\n    \n- `final` методы\n    \n- `private` методы\n    \n\n**CGLIB vs Dynamic Proxy**\n\n|**Функция**|**JDK Dynamic Proxy**|**CGLIB Proxy**|\n|---|---|---|\n|**Где работает?**|Через интерфейсы|Через наследование от класса|\n|**Как создается?**|`java.lang.reflect.Proxy`|`org.springframework.cglib.proxy.Enhancer`|\n|**Принцип работы**|Proxy реализует интерфейсы|Proxy является подклассом целевого класса|\n|**Ограничения**|Проксируются вызовы через интерфейсы|Нельзя проксировать `final` класс, `final` и `private` методы|\n\nРазница в производительности между JDK Dynamic Proxy и CGLIB обычно несущественна и не является основным критерием выбора.\n\nHibernate и Mockito используют Byte Buddy для генерации и изменения классов во время выполнения. Spring AOP использует JDK Dynamic Proxy и CGLIB.\n\n**Какое proxy по умолчанию в Spring Framework?**\n\nЕсли проксируемый бин реализует интерфейс, по умолчанию используется JDK Dynamic Proxy. Если интерфейса нет — CGLIB.\n\n**Когда используется CGLIB?**\n\n- Если класс не реализует интерфейс\n    \n- Если class-based proxy включён явно:\n    \n    - `@EnableAspectJAutoProxy(proxyTargetClass = true)`\n        \n    - `spring.aop.proxy-target-class=true`\n        \n\nВажно: в Spring Boot для AOP по умолчанию используется class-based proxy (CGLIB), так как `spring.aop.proxy-target-class=true`.\n"
  popularity = 5.42

[[questions]]
  id = 49
  question = "@Lookup"
  answer = "`@Lookup` - это аннотация в Spring, позволяющая в `singleton`-бине получать новый экземпляр `prototype`-бина при каждом вызове метода. Без `@Lookup` при внедрении `prototype`-бина в `singleton` он создаётся только один раз.\n\n**Как это работает**\n1. Помечаешь метод в singleton-классе аннотацией `@Lookup`\n2. Spring динамически переопределяет этот метод (через CGLIB)\n3. При каждом вызове метода Spring запрашивает новый `prototype`-бин из контекста.\n\n```java\n@Component\n@Scope(\"prototype\")\npublic class PrototypeBean {\n    public void doSomething() {\n        System.out.println(\"PrototypeBean: \" + this);\n    }\n}\n\n@Component\npublic abstract class SingletonBean {\n\n    public void process() {\n        // Каждый раз получаем новый экземпляр PrototypeBean\n        PrototypeBean prototypeBean = getPrototypeBean();\n        prototypeBean.doSomething();\n    }\n\n    @Lookup\n    protected abstract PrototypeBean getPrototypeBean();\n}\n```\n\n**Зачем нужно?**\n- Когда в `singleton`-бине надо часто создавать `prototype`-объекты\n- Чтобы не использовать вручную `ApplicationContext.getBean()`\n- Для избежания утечек памяти (прототипы не живут вечно внутри синглтона)\n"
  popularity = 2.41

[[questions]]
  id = 50
  question = "Как работает BeanPostProcessor. Почему есть before и after initialization"
  answer = "`BeanPostProcessor` позволяет обработать уже созданный экземпляр бина при его инициализации.\n\n---\n**Зачем два метода — before и after?**\n\n`postProcessBeforeInitialization` вызывается перед `afterPropertiesSet()` и пользовательским init-методом. Он позволяет подготовить бин к инициализации. `@PostConstruct` тоже вызывается в фазе before одним из постпроцессоров, поэтому его порядок относительно собственного постпроцессора зависит от их порядка.\n\n`postProcessAfterInitialization` вызывается после init-методов. Он может, например, вернуть прокси вместо исходного экземпляра. `BeanFactoryPostProcessor` работает раньше, с определениями бинов.\n"
  popularity = 2.41

[[questions]]
  id = 51
  question = "@Lazy"
  answer = "`@Lazy` - аннотация Spring, которая позволяет\n- откладывать создание бина до момента его первого использования вместо загрузки при старте контекста\n- откладывать внедрение зависимости \n\nМожет быть применена:\n- на уровне объявления класса-бина\n- на уровне метода `@Bean`\n- на уровне точки внедрения\n\n---\n**Как это работает под капотом**\n\n- При ленивой инициализации Spring создаёт не сам объект, а прокси (proxy).\n- Прокси удерживает ссылку на фабрику бинов и при первом вызове любого метода **инициализирует реальный объект** и делегирует вызов ему.\n- В случае `@Lazy` над точкой внедрения бин инициализируется сразу, но внедрение происходит позже\n\nМожно применить `@Lazy` для всего приложения сразу, тогда все бины будут инициализироваться лениво\n```\nspring.main.lazy-initialization=true\n```\n"
  popularity = 3.31

[[questions]]
  id = 52
  question = "@ControllerAdvice"
  answer = "Аннотация для вынесения общей логики аспектов, применяемой ко всем контроллерам.\n\n**Основные задачи**\n- глобальная обработка ошибок (`@ExceptionHandler`)\n- общие данные для всех контроллеров (`@ModelAttribute`)\n- общие биндеры (валидация, конвертация) через `@InitBinder`\n\nОсобенности\n- по умолчанию работает для всех контроллеров, можно ограничить область (`basePackages`, `assignableTypes`)\n- Для REST-API используют `@RestControllerAdvice` (автоматически добавляет `@ResponseBody`)\n"
  popularity = 3.92

[[questions]]
  id = 53
  question = "Как устроен Spring Security"
  answer = "Spring Security разделяет аутентификацию и авторизацию. В Servlet-приложении `DelegatingFilterProxy` передаёт запрос `FilterChainProxy`, который выбирает первую подходящую `SecurityFilterChain`. Фильтр аутентификации извлекает учётные данные, а `AuthenticationManager` обычно передаёт проверку `AuthenticationProvider`. Успешный результат попадает в `SecurityContext`, после чего авторизация проверяет доступ к ресурсу. WebFlux использует реактивную цепочку и контекст.\n"
  popularity = 2.41
