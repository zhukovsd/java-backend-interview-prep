[[questions]]
  id = 18
  question = "Парадигма AOP"
  answer = "**AOP** выносит сквозную логику, например транзакции или логирование, из бизнес-методов. **Аспект** объединяет такую логику. **Advice** — действие до, после или вокруг вызова. **Join point** — точка применения. В Spring AOP это выполнение метода. **Pointcut** — правило выбора подходящих методов.\n\nSpring AOP применяет advice через прокси. JDK-прокси работают через интерфейс, CGLIB создаёт подкласс. При прямом вызове другого метода через `this` прокси не участвует. AspectJ может вплетать аспекты в байт-код, поэтому его модель шире прокси Spring.\n"
