  question = "@Async"
  answer = "`@Async` передаёт выполнение метода исполнителю. В типичной конфигурации аннотацию включают через `@EnableAsync`. Прямой вызов из того же бина в прокси-режиме выполняется без перехвата. Метод может возвращать `void`, `Future` или `CompletableFuture`.\n\nПри отсутствии подходящего исполнителя Spring Framework использует `SimpleAsyncTaskExecutor`. Spring Boot может автоматически настроить `ThreadPoolTaskExecutor` или исполнитель с виртуальными потоками, в зависимости от версии и конфигурации. Конкретный bean можно выбрать через `@Async(\"executorName\")`."
