[[questions]]
  id = 1
  question = "Зачем мы используем Spring? Почему его так любят?"
  answer = "Spring Framework помогает собирать компоненты приложения и управлять их зависимостями. Контейнер создаёт сервисы и репозитории, внедряет их друг в друга. Spring также даёт веб- и транзакционную инфраструктуру.\n\nНапример, контроллер получает сервис через конструктор, а сервис выполняет операцию с БД внутри транзакции. Spring Boot дополняет Spring Framework автоконфигурацией и стартерами и сокращает объём ручной настройки.\n"
  popularity = 12.35

[[questions]]
  id = 2
  question = "Inversion of Control"
  answer = "**Inversion of Control** — принцип, при котором управление созданием, связыванием и жизненным циклом компонентов передано контейнеру. \n\n**Dependency Injection** — способ реализовать IoC в Spring.\n\nНапример, `OrderService` объявляет `OrderRepository` в конструкторе. Spring создаёт или находит бин репозитория и передаёт его сервису. Сам сервис обращается к переданной зависимости.\n"
  popularity = 9.64

[[questions]]
  id = 3
  question = "Dependency Injection"
  answer = "Dependency Injection (внедрение зависимостей) - механизм предоставления объекту его зависимостей извне (вместо того, чтобы объект создавал их самостоятельно). DI упрощает управление зависимостями и делает код более модульным, тестируемым и легко расширяемым\n\n**Dependency Injection vs dependency lookup**\n\n| **Критерий**              | **Dependency Injection**                                         | **Dependency Lookup**                                     |\n| ------------------------- | ---------------------------------------------------------------- | --------------------------------------------------------- |\n| **Суть**                  | Зависимости предоставляются извне (контейнером или фреймворком)  | Объект сам запрашивает зависимости (чаще из контекста)    |\n| **Простота тестирования** | Легче тестировать, зависимости можно заменять mock-объектами     | Требует мокирования контекста или фабрики для тестов      |\n| **Уровень контроля**      | Контейнер управляет зависимостями, объект их не создаёт          | Объект сам решает, как получить зависимости               |\n| **Пример**                | Spring внедряет зависимость через аннотации или XML-конфигурацию | Вручную вызов метода<br>`ApplicationContext.getBean(...)` |\n\nАннотация @Lookup над методом позволяет использовать Dependency Lookup\n```java\n@Lookup\npublic WeatherService getWeatherServiceBean() {\n\treturn null;\n}\n```\n\nПод капотом спринг делает\n```java\n@Lookup\npublic WeatherService getWeatherServiceBean(){\n\treturn applicationbContext.getBean(WeatherService.class);\n}\n```\n\n**Когда пригодится способ внедрения через setter?**\n- Опциональные зависимости - зависимость не обязательна для работы объекта и используется только в некоторых сценариях\n- Динамическое изменение зависимостей - когда требуется сменить зависимость во время выполнения программы\n- Библиотеки или старый код - для интеграции с кодом, где нельзя контролировать процесс создания объектов\n"
  popularity = 10.84

[[questions]]
  id = 4
  question = "Какие способы внедрения зависимостей знаешь?"
  answer = "- Через конструктор\n- Через сеттер\n- Через поле\n\n| **Способ**             | **Описание**                                                               | **Плюсы**                                                                                     | **Минусы**                                                                                                                                                   | **Примеры использования**                                    |\n| ---------------------- | -------------------------------------------------------------------------- | --------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------ | ------------------------------------------------------------ |\n| **Через конструктор**  | Зависимости передаются при создании объекта                                | - Гарантия неизменяемости  - Обязательные зависимости явно видны  <br>- Высокая тестируемость | - Неудобно для большого числа зависимостей  <br>- Не подходит для опциональных зависимостей                                                                  | Когда зависимости обязательны и не изменяются после создания |\n| **Через setter**       | Зависимости устанавливаются с помощью метода после создания объекта        | - Подходит для опциональных зависимостей  <br>- Зависимости можно изменять в runtime          | - Возможна ситуация, когда объект используется без установленной зависимости (NPE)  <br>- Менее явный                                                        | Когда зависимости опциональны или могут изменяться           |\n| **Через поля (field)** | Зависимости внедряются напрямую в поля объекта, обычно с помощью аннотаций | - Минимум кода  - Простота при использовании фреймворков (Spring, CDI)                        | - Возможна ситуация, когда объект используется без установленной зависимости (NPE)  <br>- Сложнее тестировать  <br>- Нарушение принципа явности зависимостей | Быстрое внедрение в Spring через `@Autowired`                |\n"
  popularity = 14.16

[[questions]]
  id = 5
  question = "Почему лучше использовать конструктор?"
  answer = "- Неизменяемость - зависимости устанавливаются один раз при создании объекта, и их невозможно изменить (через final поля)\n- Обязательность зависимостей - устанавливает чёткое требование, что объект не может существовать без переданных зависимостей\n- Тестируемость - проще создавать mock-объекты для тестов\n- Явность - видно, какие зависимости требуются для работы объекта\n"
  popularity = 11.75

[[questions]]
  id = 6
  question = "@Autowired"
  answer = "`@Autowired` сообщает Spring, что нужно внедрить зависимость. Аннотацию можно использовать на конструкторе, методе или поле. Если у бина только один конструктор, аннотация на нём обычно не нужна.\n\nСначала Spring ищет подходящие бины по типу. Если кандидатов несколько, приоритет можно задать через `@Primary` или сузить выбор через `@Qualifier`. Внедрение через конструктор удобно для обязательных зависимостей и позволяет объявить поля `final`.\n"
  popularity = 4.22

[[questions]]
  id = 7
  question = "@Qualifier vs @Primary"
  answer = "Аннотация @Primary указывает предпочтительный бин, который Spring выберет по умолчанию среди нескольких кандидатов одного типа.\n\nАннотация @Qualifier позволяет явно указать, какой именно бин нужно внедрить.\n\n| **Аннотация** | **Описание**                                            | **Когда использовать**                                              | **Место указания**                                                                                   |\n| ------------- | ------------------------------------------------------- | ------------------------------------------------------------------- | ---------------------------------------------------------------------------------------------------- |\n| `@Primary`    | Указывает бин по умолчанию при выборе среди нескольких  | Когда нужен бин, который используется чаще всего                    | В месте объявления бина                                                                              |\n| `@Qualifier`  | Явно указывает, какой бин использовать среди нескольких | Когда нужно внедрить конкретный бин, несмотря на наличие `@Primary` | В месте внедрения бина |\n"
  popularity = 11.75

[[questions]]
  id = 8
  question = "Что такое Bean?"
  answer = "Bean в Spring - это объект, управляемый контейнером Spring IoC. Это основной строительный блок приложения, который регистрируется и конфигурируется контейнером\n\n---\n\n**Аннотация @Bean**\n\nАннотация `@Bean` используется для указания метода, который возвращает объект (бин) и эти бины в дальнейшем можно внедрять в другие компоненты. Используется для явного объявления бина в Java-конфигурации (в классе, помеченном как `@Configuration`)\n\nТакже для определения бинов можно использовать методы по умолчанию. Это позволяет создавать конфигурации бинов путем реализации интерфейсов с определениями бинов\n```java\npublic interface BaseConfig {\n    @Bean\n    default TransferServiceImpl transferService() {\n        return new TransferServiceImpl();\n    }\n}\n@Configuration\npublic class AppConfig implements BaseConfig {\n}\n```\n\n---\n\n **Что такое BeanDefinition?**\n\nBeanDefinition - это метаданные (описание бина), указывающие на то, как должен быть создан, сконфигурирован и управляем конкретный бин\nОн содержит:\n- Класс бина\n- Его скоуп\n- Зависимости\n- Методы инициализации и уничтожения\n\n---\n\n**Как Spring создает бины?**\n\n- **Чтение конфигурации** - Spring считывает конфигурацию из `@Configuration`, XML или аннотаций на классах\n- **Создание BeanDefinition** - на основе конфигурации Spring формирует **BeanDefinition** для каждого бина\n- **Инициализация бина:**\n    - вызывается конструктор или фабричный метод\n    - выполняется внедрение зависимостей (через конструктор, поля или сеттеры)\n- **Настройка бина** - постобработка через `BeanPostProcessor` (например, для работы с `@PostConstruct`)\n- **Добавление в контейнер** - готовый бин помещается в `ApplicationContext`\n\n---\n\n**Как конфигурируется бин?**\n\n1. Аннотации (`@Bean`, `@Component`, `@Value`, `@Scope`)\n2. XML-конфигурация\n3. Java-код (в классе с `@Configuration`)\n4. Средства типа `@PostConstruct` и `@PreDestroy` для управления жизненным циклом\n\n---\n\n**Можно вставить Bean в статическое поле?**\n\nНет, Spring не поддерживает внедрение зависимостей в статические поля напрямую. Решение - использовать сеттер или вызвать контекст через `ApplicationContext`\n\n---\n\n**Как сделать ленивую инициализацию бина?**\n\nИспользуйте аннотацию `@Lazy`\n"
  popularity = 9.64

[[questions]]
  id = 9
  question = "Скоуп бинов. Web скоуп"
  answer = "- Singleton\n    - Для каждого бина создается только один экземпляр на весь контекст приложения и переиспользуется везде, где он требуется\n    - Используется по-умолчанию\n    - Жизненный цикл бина начинается при загрузке контекста, и заканчивается при его завершении\n- Prototype\n    - Каждый раз, когда запрашивается бин, создается новый экземпляр\n    - Бины со скоупом `prototype` не уничтожаются Spring, так как они выходят из под его контроля сразу после создания\n    - НЕ ХРАНЯТСЯ в контексте Spring-а\n- Web скоуп:\n\t- request - cоздаётся один экземпляр бина на каждый HTTP-запрос\n\t- session - cоздаётся один экземпляр бина на каждую HTTP-сессию\n\t- application - cоздаётся один экземпляр бина на весь `ServletContext` (аналогично синглтону, но для веб-приложения)\n\t- websocket - cоздаётся один экземпляр бина на каждую WebSocket-сессию\n\n\n**Как создать свой Скоуп**\n1. Реализовать интерфейс Scope\n```java\npublic class CustomScope implements Scope {\n    private Map<String, Object> beans = new HashMap<>();\n\n    @Override\n    public Object get(String name, ObjectFactory<?> objectFactory) {\n        return beans.computeIfAbsent(name, k -> objectFactory.getObject());\n    }\n\n    @Override\n    public Object remove(String name) {\n        return beans.remove(name);\n    }\n    // другие методы...\n}\n```\n\n2. Зарегистрировать его в контексте:\n```java\n@Bean\npublic static CustomScopeConfigurer customScopeConfigurer() {\n    CustomScopeConfigurer configurer = new CustomScopeConfigurer();\n    configurer.addScope(\"customScope\", new CustomScope());\n    return configurer;\n}\n```\n"
  popularity = 24.7

[[questions]]
  id = 10
  question = "Как обеспечить, чтобы при внедрении бина со скоупом prototype в singleton-бин каждый вызов получал новый экземпляр?"
  answer = "При прямом внедрении prototype-бина в singleton зависимость обычно разрешается один раз при создании singleton. Чтобы получать новые экземпляры, есть три варианта.\n\n1. **`ObjectProvider<T>` или `ObjectFactory<T>`.** Вызовите `getObject()` один раз на операцию. Все вызовы на возвращённом экземпляре используют его состояние.\n2. **`@Lookup`.** Spring переопределяет lookup-метод бина. Каждый вызов такого метода получает целевой prototype из контейнера. В операции результат можно сохранить в локальной переменной.\n3. **Scoped proxy.** В singleton внедряется прокси. Для prototype он получает новый объект на каждый вызов метода через прокси. `proxy.prepare()` и `proxy.run()` могут попасть в разные экземпляры. Если шагам нужно общее состояние, используйте один экземпляр, полученный из `ObjectProvider` или `@Lookup`.\n\n```java\nvoid doWork() {\n    Worker worker = workers.getObject();\n    worker.prepare();\n    worker.run();\n}\n```\n\n**Подводные камни**\n\nЕсли подходящих бинов несколько, выбор можно уточнить через `@Qualifier`. Классовый прокси не может перехватить `final` и `private` методы. Для prototype Spring не вызывает автоматически callbacks уничтожения, поэтому освобождение его ресурсов нужно организовать отдельно. Живую ссылку на Spring-прокси не стоит закладывать в формат сериализации объекта.\n"
  popularity = 5.72

[[questions]]
  id = 11
  question = "Жизненный цикл Bean. Вопросы связанные с классами, входящими в жизненный цикл бина"
  answer = "Spring управляет созданием, инициализацией и уничтожением бинов в рамках контейнера IoC. Этот жизненный цикл можно разделить на несколько этапов\n\n{{< figure src=\"/java-backend-interview-prep/spring_bean_lifecycle.png\" title=\"\" >}}\n\n1. **Парсинг конфигураций, сканирование аннотаций и создание BeanDefinition**\n    Spring (BeanDefinitionReader) ищет классы, которые помечены аннотациями, указывающими на то, что они являются бинами (или содержат таковые). Эти аннотации включают:\n    `@Component`, `@Service`, `@Repository`, `@Controller`, `@Configuration`\n    Spring сканирует классы в пакетах, указанных в аннотации `@ComponentScan`, или в пакете, где находится класс с аннотацией `@SpringBootApplication`. Найденные классы парсятся, и для них создаются BeanDefinition\n    `BeanDefinition` - это специальный интерфейс, через который можно получить доступ к метаданным будущего бина. В зависимости от конфигурации будет использоваться тот или иной механизм парсинга конфигурации. Все они складываются в `ConcurrentHashMap`, в которой ключ - имя бина, а объект сам `BeanDefinition`. При старте приложения в IoC контейнер попадут бины, которые имеют скоуп синглтон, а остальные создадутся тогда, когда они нужны. Сначала регистрируются все `@Configuration` для дальнейшего парсинга\n\n2. **Настройка созданных BeanDefinition** \n   Есть возможность повлиять на бины до их создания. Для этого существует интерфейс `BeanFactoryPostProcessor`, реализовав который, получаем доступ к созданным `BeanDefinition` и можем их изменить при помощи метода `postProcessBeanFactory`.\n\n3. **Создание экземпляра бинов** \n   Сначала из мапы c `BeanDefinition`-ами достаются бины, необходимые для настройки других бинов, а потом остальные (рекурсивное разрешение зависимостей). Созданием занимается `BeanFactory` (вызывает конструкторы), но можно и делегировать это фабрике, реализующей интерфейс `FactoryBean`\n\n4. **Внедрение зависимостей (через поля и сеттеры)**\n5. **Настройка созданных бинов** \n   Бины уже созданы, их можно донастроить. Интерфейс `BeanPostProcessor` позволяет вклиниться в процесс настройки бинов до того, как они попадут в контейнер. Контекст автоматически обнаруживает бины реализующие этот интерфейс и помечает их. Есть два метода\n    - `postProcessBeforeInitialization` вызывается до init метода\n    - `postProcessAfterInitialization` - после\n        \n    Сначала сработает метод `postProcessBeforeInitialization()` всех имеющихся `BeanPostProcessor`-ов. Затем, при наличии, будет вызван `init`-метод.\n    В спринге если какой-то из `BeanPostProcessor` что-то меняет в классе (в т.ч. добавляет проксирование), он должен делать это на этапе после `init`. Следовательно, `init` всегда работает на оригинальный метод до проксирования.\n        В конце бины пройдут через `postProcessAfterInitialization()`.\n        \n        _Примечание: если бин имплементирует_ `InitializingBean`_, то Spring вызовет метод_ `afterPropertiesSet()` _перед init-методом. Интерфейс не рекомендуется к использованию как устаревший_\n    \n6. **Бины созданы** На этом этапе их можно получить с помощью метода `ApplicationContext.getBean()`\n    \n7. **Закрытие контекста** \n   Когда контекст закрывается, бин уничтожается. Если в бине есть `@PreDestroy` метод, то перед уничтожением бина он вызовется. Если в `@Bean` определён метод destroyMethod, то будет вызван и он\n"
  popularity = 20.18

