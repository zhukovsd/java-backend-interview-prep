[[questions]]
  id = 1
  question = "Инструменты для отладки приложения, течет память, все замирает - Visual VM, JMap, профилировщики"
  answer = "Для диагностики сначала выбирают тип проблемы. При утечке смотрят динамику heap и GC, затем снимают heap dump через `jcmd` и анализируют его в VisualVM или Eclipse MAT. При зависании собирают thread dump и ищут блокировки или зависшие обращения. При высокой нагрузке на CPU используют профилировщик, например JFR с анализом записи в JDK Mission Control. VisualVM в современных JDK устанавливают отдельно. В старых сборках Oracle JDK 8 он поставлялся вместе с JDK.\n"
  popularity = 1.81

[[questions]]
  id = 2
  question = "Определение сложности алгоритма"
  answer = "**Сложность алгоритма** — это мера того, **как быстро алгоритм выполняется** или **сколько ресурсов использует** (в основном время и память) в зависимости от размера входных данных.\n\nГоворят двумя типами:\n\n1. **Временная сложность** – сколько шагов выполняет алгоритм.\n2. **Пространственная сложность** – сколько памяти использует алгоритм.\n\n\n🔹 **Как измеряют сложность**\n\nСчитают **количество операций** в зависимости от размера входа `n`.\n\n- Если операций линейно зависит от n → **O(n)**\n- Если операций квадратично → **O(n²)**\n- Если константно → **O(1)**\n\n\nПримеры из жизни:\n\n1. **O(1) — константная**\n\n    - Снять деньги с банкомата. Неважно, сколько у тебя счетов, операция всегда одна.\n\n2. **O(n) — линейная**\n\n    - Проверить каждое письмо в почтовом ящике. Чем больше писем, тем дольше.\n\n3. **O(n²) — квадратичная**\n\n    - Найти все пары друзей среди n человек. Количество проверок растёт как n × n.\n\n4. **O(log n) — логарифмическая**\n\n    - Поиск книги в отсортированной библиотеке методом деления пополам."
  popularity = 2.71

[[questions]]
  id = 3
  question = "Для чего нужно O большое в алгоритмах? (Что такое сложность в алгоритме)"
  answer = "`O(f(n))` означает, что для достаточно больших `n` расход ограничен сверху константой, умноженной на `f(n)`. Оценка может относиться к среднему, худшему или амортизированному случаю, поэтому его называют явно.\nНапример, доступ по индексу массива — `O(1)`, бинарный поиск — `O(log n)`, полный проход — `O(n)`, сортировка слиянием — `O(n log n)`, а простая сортировка пузырьком — `O(n²)` в худшем случае. QuickSort в среднем занимает `O(n log n)`, но в худшем случае может занять `O(n²)`.\n\n---\n**Зачем нужно O большое?**\n\nЧтобы сравнивать скорость роста затрат при больших входах, независимо от постоянных коэффициентов.\n\n---\n**Почему бинарный поиск быстрее?**\n\nВ отсортированном массиве одно сравнение отбрасывает примерно половину оставшихся вариантов, поэтому число сравнений растёт логарифмически.\n"
  popularity = 3.92

[[questions]]
  id = 4
  question = "Какой подход к неймингу методов позволяет ясно и однозначно отражать их функциональность, например, для методов, которые выполняют поиск с сортировкой, очистку кэша или расчёт с сохранением данных и возвратом статуса?"
  answer = "Имя метода должно описывать действие и важные условия. Примеры: `findUsersByStatus`, `findUsersOrderedByDate`, `invalidateUserCache`. Существенные побочные эффекты должны быть видны из имени и контракта. Если одно имя пытается перечислить много действий, проверьте, можно ли разделить ответственности.\n\n**CQS** помогает отличать запросы, которые читают, от команд, которые меняют состояние."
  popularity = 0.6

[[questions]]
  id = 5
  question = "Как выявлять и устранять узкие места производительности в REST-сервисах и микросервисных архитектурах, когда рост нагрузки (например, увеличение трафика или обращений к БД) приводит к значительно более долгой обработке запросов, чем ожидается, и какие стратегии оптимизации (в том числе архитектурные изменения и масштабирование) могут помочь достичь требуемых временных рамок отклика?"
  answer = "| Этап / Категория                              | Инструмент / Приём                                       | Описание                                                     | Преимущества                                              |\n| --------------------------------------------- | -------------------------------------------------------- | ------------------------------------------------------------ | --------------------------------------------------------- |\n| **1. Мониторинг и выявление**                 | APM (Datadog, NewRelic)                                  | Сбор метрик CPU, памяти, времени ответов                     | Быстрый обзор состояния сервисов                          |\n|                                               | Распределённое трассирование (Jaeger, Zipkin)            | Спаны HTTP/DB/MSG показывают «долгие» участки                | Видимость сквозного вызова                                |\n|                                               | Профилирование (YourKit, VisualVM)                       | CPU-/Memory-профили, hot-методы                              | Глубокий анализ «горячего» кода                           |\n|                                               | Нагрузочное тестирование (JMeter, Gatling)               | Эмуляция роста трафика, поиск точки деградации               | Позволяет планировать масштабирование                     |\n| **2. Локальная оптимизация**                  | Оптимизация кода                                         | Устранение горячих циклов, рекомпозиция алгоритмов           | Снижение CPU- и latency-потребления                       |\n|                                               | Оптимизация БД (EXPLAIN, индексы)                        | Быстрые SQL, правильные индексы, разбиение тяжёлых запросов  | Существенное ускорение обращения к данным                 |\n|                                               | Кэширование (HTTP, Redis, Caffeine)                      | Кеширование повторяющихся запросов/вычислений                | Снижение нагрузки на БД и бизнес-логику                   |\n|                                               | Connection pooling (HikariCP, пул потоков)               | Эффективное переиспользование соединений и потоков           | Меньше задержек на установку соединений                   |\n| **3. Архитектурные и масштабируемые решения** | Асинхронность и очереди (Kafka, RabbitMQ, `@Async`)      | Отделение тяжёлых задач в фоновые процессы                   | Стабильная работа под пиками, не блокирует HTTP-потоки    |\n|                                               | CQRS                                                     | Разделение операций чтения и записи на разные сервисы/модели | Оптимизация под разные нагрузки (write vs read)           |\n|                                               | Резилиентность (Circuit Breaker, Bulkhead, Rate Limiter) | Защита от лавины ошибок и перегрузки                         | Повышение устойчивости сервисов                           |\n|                                               | Горизонтальное масштабирование (Kubernetes HPA, ELB)     | Автоскейлинг по метрикам нагрузки                            | Автоматическое добавление ресурсов                        |\n|                                               | Репликация и шардинг БД                                  | Чтение с реплик, запись на primary; горизонтальный шардинг   | Снижение нагрузки на одну БД, рост пропускной способности |\n|                                               | Выделение тяжёлых подсистем в отдельные сервисы          | Отдельные микросервисы для отчётов, ML, загрузки файлов      | Независимое масштабирование и деплой                      |\n\n"
  popularity = 1.2

[[questions]]
  id = 6
  question = "Обычное программирование vs реактивщина"
  answer = "Императивный код описывает последовательность действий, например цикл с накоплением суммы. Такой код может быть как синхронным, так и асинхронным.\n\nВ реактивном подходе программа описывает обработку потока значений оператором вроде `map`, `filter` или `flatMap`. Reactive Streams поддерживает обратное давление: подписчик сообщает, сколько элементов готов принять.\n\nНеблокирующее выполнение зависит от SDK и операций внутри цепочки. Блокирующий вызов остаётся блокирующим, даже если его поместить в `Mono`.\n\nРеактивные средства полезны для композиции большого числа I/O-операций. Выбор зависит от библиотек, нагрузки и сложности сопровождения."
  popularity = 2.11

[[questions]]
  id = 7
  question = "Для чего нужен Reflection?"
  answer = "Reflection в Java — это мощный механизм, позволяющий «заглянуть» внутрь классов и объектов во время выполнения программы, а также динамически создавать экземпляры, вызывать методы и получать/изменять значения полей без знания их имён на этапе компиляции.\n\n**Зачем нужен Reflection**\n\n1. **Фреймворки и библиотеки**  \n   Многие фреймворки (Spring, Hibernate, JUnit) используют Reflection, чтобы автоматически сканировать классы, создавать бины, внедрять зависимости, вызывать аннотированные методы и пр.\n\n2. **Плагины и модули**  \n   Позволяет загружать и использовать «плагины» (классы), которые не были изначально видны в вашем коде. Вы можете динамически подгружать JAR‑ы, находить в них нужные классы и вызывать в них методы.\n\n3. **Инструменты и утилиты**  \n   Инструменты для тестирования, сериализации/десериализации (Jackson, Gson), мэпперы (MyBatis) применяют Reflection, чтобы автоматически обойти поля объектов и сопоставить их с JSON, XML или строкой SQL.\n\n4. **Диагностика и отладка**  \n   Позволяет в режиме отладки или логирования читать приватные поля или вызывать приватные методы, чтобы узнать состояние объекта или выполнить какой‑то скрытый код.\n\n\n\n**Пример использования**\n\n```java\npublic class Person {\n    private String name;\n    private int age;\n\n    private void greet(String prefix) {\n        System.out.println(prefix + \", меня зовут \" + name + \", мне \" + age + \" лет\");\n    }\n}\n\n// ------------------------\n\nClass<?> clazz = Class.forName(\"com.example.Person\");\nObject person = clazz.getConstructor().newInstance();\n\n// Устанавливаем поля name и age\nField nameField = clazz.getDeclaredField(\"name\");\nnameField.setAccessible(true);\nnameField.set(person, \"Алексей\");\n\nField ageField = clazz.getDeclaredField(\"age\");\nageField.setAccessible(true);\nageField.set(person, 30);\n\n// Вызываем приватный метод greet\nMethod greet = clazz.getDeclaredMethod(\"greet\", String.class);\ngreet.setAccessible(true);\ngreet.invoke(person, \"Привет\");\n```\n\nВ этом примере мы:\n\n1. Загружаем класс `Person` по имени.\n2. Создаём его экземпляр без прямого вызова конструктора.\n3. Меняем приватные поля `name` и `age`.\n4. Вызываем приватный метод `greet`.\n\n"
  popularity = 4.52

[[questions]]
  id = 8
  question = "Что такое идемпотентность?"
  answer = "Операция **идемпотентна**, если многократное выполнение с теми же входными данными оказывает на состояние системы тот же предполагаемый эффект, что и один вызов.\n\nНапример, после одного или нескольких `DELETE /users/42` пользователь отсутствует. При этом первый ответ может быть `204`, а следующий — `404`."
  popularity = 4.22
