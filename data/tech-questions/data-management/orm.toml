  question = "Почему мы не можем использовать final классы в качестве Entity?"
  answer = "Потому что Hibernate делает прокси через наследование от класса-entity, `final` прямо этому препятствует.\n"
  popularity = 0.3

[[questions]]
  id = 7
  question = "Что такое Proxy и для чего используется?"
  answer = "**Прокси Hibernate** — объект-заместитель, который позволяет отложить загрузку состояния сущности. Например, обращение к незагруженному свойству через геттер может выполнить SQL. Доступ к идентификатору часто возможен без инициализации.\n\n`EntityManager.getReference()` возвращает ссылку на сущность, состояние которой может быть загружено позднее. Это может быть уже управляемый объект или ссылка с отложенной загрузкой. Конкретный механизм зависит от провайдера и настроек, в том числе от bytecode enhancement.\n"
  popularity = 8.73

[[questions]]
  id = 8
  question = "FetchType"
  answer = "`LAZY` - вместо таких полей будут вставляться прокси, а сами они будут подгружаться при первом доступе к ним\n`EAGER` (жадный) - связанные сущности загружаются сразу вместе с основной сущностью\n\n`@OneToMany` `@ManyToMany` по-умолчанию применяется `FetchType.LAZY`\n`@ManyToOne` `@OneToOne` по-умолчанию применяется `FetchType.EAGER`\n"
  popularity = 2.41

[[questions]]
  id = 9
  question = "Жизненный цикл сущности"
  answer = "В Hibernate сущность может находиться в одном из четырех состояний:\n- Transient\n- Persistent\n- Detached\n- Removed\n\n{{< figure src=\"/java-backend-interview-prep/hibernate_entity_life_cycle.png\" title=\"\" >}}\n\n**Transient (Переходное состояние) (new)**\nСущность только что создана с помощью оператора new, но еще не сохранена в базе данных\n```java\nUser user = new User(); // объект пока не связан с БД\nuser.setName(\"John\");\n```\n\n**Persistent/managed (Постоянное состояние) (save, persist, update, get)**\nКогда объект сохранён в базе данных через EntityManager или Session, он становится постоянным. В этом состоянии Hibernate следит за объектом. Любые изменения в объекте автоматически синхронизируются с базой данных\n```java\nSession session = sessionFactory.openSession();\nsession.beginTransaction();\nsession.save(user); // объект теперь в состоянии persistent\n```\n\n**Detached (Отсоединённое состояние) (session closed)**\nКогда сессия закрыта, объект переходит в состояние detached. Он по-прежнему связан с данными в базе, но больше не синхронизируются с ней\n```java\nsession.close(); //  объект можно использовать, но изменения не будут сохранены в бд\n```\n\n**Removed (Удалённое состояние) (delete(obj))**\nКогда сущность удалена из базы данных она переходит в состояние removed. В этом состоянии объект по-прежнему существует в памяти, но уже удален из базы данных\n```java\nsession.delete();\n```\n\n"
  popularity = 4.82

[[questions]]
  id = 10
  question = "Кэширование"
  answer = "**Кэш 1-го уровня**\n- Этот кэш всегда включен и работает на уровне `Session` (у каждой сессии свой кэш и нельзя получить доступ к нему из другой сессии)\n- В кэше хранятся только сущности, у которых состояние `persistent`\n- Отслеживаемые сущности (`persistent`) хранятся в мапе, где ключ - ID сущности, а значение - сами объекты-сущности\n- При повторных запросах Hibernate использует кэшированные данные вместо выполнения нового запроса к базе данных\n- При закрытии сессии кэш удаляется\n\n**Кэш 2-го уровня**\n- Это дополнительный кэш, который надо включать вручную\n- Работает на уровне `SessionFactory`\n- Используется для кэширования данных между сессиями, что позволяет повторно использовать данные, уже загруженные из базы данных\n- После закрытия `SessionFactory` весь кэш, связанный с ним, удаляется\n\n**Кэш 3-го уровня**\n- Кэширует результаты запросов на уровне SQL-запросов (кэширует результаты выборки)\n"
  popularity = 6.63

[[questions]]
  id = 11
  question = "HQL и JPQL"
  answer = "**JPQL (Java Persistence Query Language)** - это объектно-ориентированный язык запросов спецификации JPA, который поддерживается всеми реализациями, очень похож на SQL, но вместо имён таблиц используются имена сущностей\n**HQL (Hibernate Query Language)** - реализация JPQL от Hibernate\n"
  popularity = 0.6

[[questions]]
  id = 12
  question = "EntityManager + EntityManagerFactory / SessionFactory + session"
  answer = "**EntityManager** - менеджер сущностей, определяется спецификацией JPA, **Session** от Hibernate - вариант его реализации\n**EntityManagerFactory** - фабрика менеджеров JPA, **SessionFactory** - реализация от Hibernate\n"
  popularity = 1.81

[[questions]]
  id = 13
  question = "Проблема N + 1. Способы решения проблемы"
  answer = "**N+1** — один запрос получает N сущностей, затем их связи загружаются отдельными запросами. Например, сначала читаются пользователи, затем для каждого — его заказы. Так может произойти и с `LAZY`, и с `EAGER`.\n\n- `SELECT u FROM User u LEFT JOIN FETCH u.orders` загружает пользователей и заказы одним запросом, включая пользователей без заказов. В Hibernate 6 дубликаты корневых сущностей от fetch join удаляются автоматически.\n- `@EntityGraph(attributePaths = \"orders\")` задаёт, какие связи загрузить для конкретного метода репозитория. Фактический SQL проверяют по логам.\n- `@BatchSize(size = 50)` на коллекции позволяет догружать заказы группами до 50 **пользователей**. Для 100 владельцев это может дать две догрузки.\n- `@Fetch(FetchMode.SUBSELECT)` догружает коллекции для группы владельцев запросом на основе исходной выборки. DTO-проекция подходит, когда нужны лишь выбранные данные."
  popularity = 20.78

[[questions]]
  id = 14
  question = "Что такое Entity Graph?"
  answer = "**Entity graph** задаёт, какие атрибуты и связи загрузить в конкретной операции. Его можно описать через `@NamedEntityGraph`, создать динамически в JPA или указать через `@EntityGraph` в Spring Data.\n\n- `fetchgraph` трактует атрибуты вне графа как `LAZY`.\n- `loadgraph` оставляет для них обычные настройки маппинга.\n\n```java\nvar graph = em.createEntityGraph(User.class);\ngraph.addAttributeNodes(\"orders\");\n\nUser user = em.find(User.class, id,\n    Map.of(\"jakarta.persistence.loadgraph\", graph));\n```\n\nПровайдер обязан загрузить указанные данные и может загрузить дополнительные. Один SQL-запрос с JOIN не гарантируется."
  popularity = 3.31

[[questions]]
  id = 15
  question = "Statement, Prepared statement, Callable statement"
  answer = "- `Statement` выполняет переданную SQL-строку.\n- `PreparedStatement` расширяет `Statement` и позволяет связать параметры `?` с данными. Один объект можно использовать для повторного выполнения с разными значениями.\n- `CallableStatement` расширяет `PreparedStatement` и используется для вызова хранимых процедур, в том числе с выходными параметрами.\n\nЗащиту обеспечивает передача пользовательских значений как параметров. Подготовка на сервере и повторное использование плана зависят от драйвера и СУБД.\n"
  popularity = 2.11

[[questions]]
  id = 16
  question = "Связи между таблицами в ORM"
  answer = "1. OneToOne - один экземпляр сущности может быть связан не больше чем с одним экземпляром другой сущности\n2. OneToMany - одна сущность может ссылаться ко многим сущностям\n3. ManyToOne - несколько сущностей может ссылаться к одной сущности\n4. ManyToMany - много сущностей могут относится ко многим сущностям. \n   - **Bidirectional** (с использованием MappedBy) - ссылка на связь устанавливается у всех сущностей, т.е. в сущности 1 будет ссылка на сущность 2 и наоборот. Сущность 1 будет владельцем этой связи (важно при каскадном удалении) \n   - **Unidirectional** - ссылка на связь устанавливается только у одной стороны\n\n**Как реализована связь OneToMany?**\nОдному объекту одной сущности соответствует множество объектов другой сущности\n```java\n@Entity\npublic class Department {\n    @Id @GeneratedValue\n    private Long id;\n\n    @OneToMany(mappedBy = \"department\", cascade = CascadeType.ALL)\n    private List<Employee> employees;\n}\n\n@Entity\npublic class Employee {\n    @Id @GeneratedValue\n    private Long id;\n\n    @ManyToOne\n    private Department department;\n}\n```\n\n**Как реализована связь ManyToOne?**\nМножеству объектов одной сущности соответствует один объект другой сущности\n```java\n@Entity\npublic class Employee {\n    @Id @GeneratedValue\n    private Long id;\n\n    @ManyToOne\n    @JoinColumn(name = \"department_id\")\n    private Department department;\n}\n\n@Entity\npublic class Department {\n    @Id @GeneratedValue\n    private Long id;\n}\n```\n\n**Как реализована связь ManyToMany?**\nДля реализации такого вида связи создается промежуточная таблица для хранения идентификаторов обеих сущностей\n\n**Пример**: учителя могут преподавать несколько предметов, каждый предмет может преподаваться несколькими преподавателями\n```java\n@Entity\npublic class Student {\n    @Id @GeneratedValue\n    private Long id;\n\n    @ManyToMany\n    @JoinTable(\n        name = \"student_course\",\n        joinColumns = @JoinColumn(name = \"student_id\"),\n        inverseJoinColumns = @JoinColumn(name = \"course_id\")\n    )\n    private List<Course> courses;\n}\n\n@Entity\npublic class Course {\n    @Id @GeneratedValue\n    private Long id;\n\n    @ManyToMany(mappedBy = \"courses\")\n    private List<Student> students;\n}\n```\n\n|**Тип связи**|**Суть**|**Пример отношений**|**Особенности**|**Реализация в базе данных**|\n|---|---|---|---|---|\n|OneToOne|Один к одному|Паспорт и владелец|Каждая сущность связана с одной другой сущностью|Один из объектов содержит внешний ключ|\n|OneToMany|Один ко многим|Департамент и сотрудники|Один объект связан с несколькими объектами другой сущности|Один внешний ключ на стороне “многих”|\n|ManyToOne|Многие к одному|Сотрудники и департамент|Обратное отношение к `OneToMany`|Внешний ключ на стороне “многих”|\n|ManyToMany|Многие ко многим|Студенты и курсы|Множеству объектов одной сущности соответствует множество другой|Промежуточная таблица|\n\n**OneToMany: разница между List и Set**\n\n|**Характеристика**|`List`|`Set`|\n|---|---|---|\n|Уникальность|Допускает дубликаты|Гарантирует уникальность элементов|\n|Порядок|Сохраняет порядок добавления|Не гарантирует порядок|\n|Производительность|Медленнее при проверке наличия|Быстрее при проверке наличия|\n|Используемая реализация|`ArrayList` или `LinkedList`|Обычно `HashSet` или `TreeSet`|\n\n**Что такое `Cascade`?**\n`Cascade` в JPA определяет, что делать с зависимыми объектами при изменении основного объекта.\n\n**Пример:**\n```java\n@Entity\nclass Parent {\n    @Id @GeneratedValue\n    private Long id;\n\n    @OneToMany(mappedBy = \"parent\", cascade = CascadeType.ALL)\n    private List<Child> children;\n}\n\n@Entity\nclass Child {\n    @Id @GeneratedValue\n    private Long id;\n\n    @ManyToOne\n    @JoinColumn(name = \"parent_id\")\n    private Parent parent;\n}\n```\nЕсли удалить `Parent`, то все `Child` объекты тоже удалятся.\n\n|**Тип**|**Описание**|\n|---|---|\n|`ALL`|Применяет все виды каскада (`PERSIST`, `REMOVE`, `MERGE`, `REFRESH`, `DETACH`)|\n|`PERSIST`|Автоматически сохраняет зависимые сущности|\n|`REMOVE`|Удаляет зависимые сущности|\n|`MERGE`|Обновляет зависимые сущности|\n|`REFRESH`|Перезаписывает зависимые сущности из БД|\n|`DETACH`|Удаляет зависимые сущности из контекста (но не из БД)|\n\n**Плюсы:**\n- Упрощает работу с зависимыми объектами\n- Автоматизирует `save()` и `delete()`\n- Уменьшает количество `EntityManager` вызовов\n\n**Минусы:**\n- Может неожиданно удалить важные данные (`REMOVE` без проверки)\n- `ALL` может привести к непредвиденным каскадным операциям\n- Может нагружать базу данных, если слишком много зависимостей\n"
  popularity = 3.01

[[questions]]
  id = 17
  question = "LazyInitializationException"
  answer = "Это происходит, когда объект был загружен с ленивой загрузкой, но его данные пытаются быть использованы после закрытия сессии\n\n```java\npublic void printAuthorBooks(Long authorId) {\n    Session session = sessionFactory.openSession();\n    Author author = session.get(Author.class, authorId);\n    session.close();\n\n    // Попытка доступа к ленивой коллекции после закрытия сессии\n    System.out.println(author.getBooks());  // Может вызвать LazyInitializationException\n}\n```\n\nКак решить?\n- JOIN FETCH. Это способ сказать Hibernate загрузить связанные данные вместе с основными (типа обычного JOIN-а)\n- Использовать EntityGraph. Указываем, какие данные загружать в конкретных запросах, не изменяя сущности (как в случае с жадной загрузкой)\n"
  popularity = 5.12

[[questions]]
  id = 18
  question = "Что такое SQL-инъекция?"
  answer = "**SQL-инъекция** возникает, когда пользовательский ввод может изменить структуру запроса. Для значений используют привязку параметров.\n\n- В JDBC и переносимом native SQL через JPA используются позиционные `?`.\n- В JPQL используются именованные параметры вроде `:name` или позиционные вроде `?1`.\n- Имена таблиц, столбцов и направления сортировки выбирают из заранее заданных вариантов, поскольку такие части запроса не передаются как значения параметров.\n\nВ Hibernate и других ORM защита также зависит от того, как сформирован запрос и как переданы значения.\n"
  popularity = 1.2

[[questions]]
  id = 19
  question = "Проблемы JOIN FETCH"
  answer = "`JOIN FETCH` коллекции может вернуть несколько строк SQL для одного родителя, по одной на каждый элемент связи. При одновременной загрузке нескольких коллекций число строк может перемножаться. Hibernate также может выбросить `MultipleBagFetchException` при одновременном fetch нескольких bag-коллекций.\n\nВ Hibernate 6 дубликаты корневых сущностей от fetch join удаляются при формировании Java-результата. Выбор `Set` для коллекции не сокращает число строк SQL.\n\nДля пагинации сначала выбирают страницу ID корневых сущностей со стабильной сортировкой. Затем отдельным запросом загружают нужные связи этих сущностей и восстанавливают порядок страницы. В Hibernate полезно включить `hibernate.query.fail_on_pagination_over_collection_fetch`, чтобы заметить пагинацию, которая иначе может выполняться в памяти."
  popularity = 0.6

[[questions]]
  id = 20
  question = "Логи в Hibernate"
  answer = "- SQL-запросы: категория `org.hibernate.SQL` на уровне `DEBUG`.\n- Значения параметров в Hibernate 6: `org.hibernate.orm.jdbc.bind` на уровне `TRACE`.\n- В Hibernate 5 использовалась, например, категория `org.hibernate.type.descriptor.sql.BasicBinder`.\n\nВ Spring Boot, например, используют `logging.level.org.hibernate.SQL=DEBUG`. Значения параметров могут содержать конфиденциальные данные, поэтому подробное логирование включают только на нужное время."
  popularity = 0.3

[[questions]]
  id = 21
  question = "Аннотация @Query, что это такое?"
  answer = "Аннотация `@Query` - аннотация из Spring Data JPA, устанавливающаяся над методом репозитория (JpaRepository), - позволяет писать JPQL или SQL запрос.\n\n**JPQL-запросы** (Java Persistence Query Language)\n```java\npublic interface UserRepository extends JpaRepository<User, Long> {\n\n    // Использование JPQL для выборки данных\n    @Query(\"SELECT u FROM User u WHERE u.name = :name\")\n    List<User> findByName(@Param(\"name\") String name);\n}\n```\n\n**Native SQL-запросы**\n```java\npublic interface UserRepository extends JpaRepository<User, Long> {\n\n    // Использование SQL-запроса\n    @Query(value = \"SELECT * FROM users WHERE name = :name\", nativeQuery = true)\n    List<User> findByNameNative(@Param(\"name\") String name);\n}\n```\n\n**Параметры в запросах**\n```java\n@Query(\"SELECT u FROM User u WHERE u.name = :name\")\nList<User> findByName(@Param(\"name\") String name);\n```\n"
  popularity = 1.81

[[questions]]
  id = 22
  question = "Как Hibernate генерирует SQL запросы?"
  answer = "Hibernate использует маппинг сущностей, полей и связей, чтобы сопоставлять Java-модель с таблицами. SQL генерируется для операций над сущностями и для запросов из JPQL, HQL или Criteria API. Диалект задаёт особенности синтаксиса и возможностей СУБД. Native SQL задаёт сам разработчик.\n\nПри загрузке связей Hibernate учитывает `FetchType`, параметры запроса, fetch join и entity graphs. Стратегия загрузки влияет на момент получения данных и на число запросов."
  popularity = 0.3

[[questions]]
  id = 23
  question = "Hibernate. Что хранится в Persistence Context? Сколько времени объект хранится в Persistence Context?"
  answer = "**Persistence Context** (контекст персистентности) - это механизм Hibernate, который управляет состоянием сущностей (entities) в рамках сессии (Session). Он отслеживает изменения в сущностях и синхронизирует их с базой данных. Persistence Context можно рассматривать как кэш первого уровня, который существует на протяжении жизни сессии.\n\nВ Persistence Context хранятся:\n1. **Управляемые сущности (Managed Entities)**:\n    - это объекты, которые были загружены в текущую сессию (например, с помощью `session.get()`, `session.load()`, или через запросы `HQL`, `Criteria API`)\n    - Hibernate отслеживает изменения в этих объектах и автоматически синхронизирует их с базой данных при коммите транзакции\n2. **Сущности, добавленные для сохранения**:\n    - объекты, которые были добавлены в Persistence Context с помощью `session.save()`, `session.persist()`, или `session.update()`\n3. **Сущности, помеченные на удаление**:\n    - объекты, которые были помечены на удаление с помощью `session.delete()`\n4. **Снимки состояния (Snapshots)**:\n    - Hibernate сохраняет снимки состояния сущностей на момент их загрузки. Эти снимки используются для определения изменений в объектах и генерации соответствующих SQL-запросов при синхронизации с базой данных\n5. **Идентификаторы сущностей**:\n    - Persistence Context хранит идентификаторы (ID) всех управляемых сущностей, чтобы быстро находить их в кэше\n\n**Сколько времени объект хранится в Psersistence Context?**\n- До окончания сессии\n- До явного удаления (`evict` или `clear`)\n- До того, как объект переходит в состояние `detached`\n"
  popularity = 2.11

[[questions]]
  id = 24
  question = "Hibernate и Lombok"
  answer = "**Проблема аннотации `@Data` в Hibernate**\n`@Data` генерирует:  \n - геттеры и сеттеры\n - `toString()`  \n - `equals()` и `hashCode()`\n\n **Проблема `toString()`**\nЕсли в entity с `@Data` есть `@OneToMany(fetch = FetchType.LAZY)`, то Hibernate создаст прокси-объект, а Lombok генерирует `toString()` с участием всех полей, что приводит к `LazyInitializationException`\n```java\n@Entity\n@Data\npublic class User {\n    @Id @GeneratedValue\n    private Long id;\n    private String name;\n\n    @OneToMany(mappedBy = \"user\", fetch = FetchType.LAZY)\n    private List<Order> orders;\n}\n\nUser user = session.get(User.class, 1L);\nSystem.out.println(user); // ❌ LazyInitializationException\n```\n\n**Решение:**  \nИспользовать `@ToString.Exclude`\n```java\n@Entity\n@Data\npublic class User {\n    @Id @GeneratedValue\n    private Long id;\n    private String name;\n\n    @OneToMany(mappedBy = \"user\", fetch = FetchType.LAZY)\n    @ToString.Exclude\n    @EqualsAndHashCode.Exclude\n    private List<Order> orders;\n}\n```\n\n **Проблема с `equals()` и `hashCode()`**\nLombok генерирует эти методы с участием всех полей, в том числе `@OneToMany`, что может привести к бесконечной рекурсии\n\n**Решение:** \nИспользовать `@EqualsAndHashCode(onlyExplicitlyIncluded = true)` или `@EqualsAndHashCode.Exclude`\n```java\n@Entity\n@Data\n@EqualsAndHashCode(onlyExplicitlyIncluded = true)\npublic class User {\n    @Id @GeneratedValue\n    @EqualsAndHashCode.Include\n    private Long id;\n\n    private String name;\n\n    @OneToMany(mappedBy = \"user\", fetch = FetchType.LAZY)\n    @ToString.Exclude\n    private List<Order> orders;\n}\n```"
  popularity = 1.51

