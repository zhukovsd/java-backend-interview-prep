[[questions]]
  id = 1
  question = "Что такое Hibernate, JPA, JDBC, ORM?"
  answer = " **ORM (Object-Relational Mapping)** - концепция преобразования сущностей реляционной базы данных в объекты и обратно (применительно к объектно-ориентированным языкам программирования)\n  **JPA (Java Persistence API)** - спецификация, описывающая концепцию ORM для Java\n  **Hibernate** - одна из реализаций JPA\n  **JDBC (Java DataBase Connectivity)** - стандарт взаимодействия Java-приложения и базы данных\n"
  popularity = 6.63

[[questions]]
  id = 2
  question = "Плюсы и минусы ORM"
  answer = "**Плюсы:**\n- **Ускорение разработки приложения**\n- **Удобство разработки:**\n    - позволяет бизнес методам обращаться не к БД, а к Java классам\n    - cущности основаны на бизнес-задачах, а не на структуре БД\n- **Переносимость** - ORM может работать с различными СУДБ, что делает его более переносимым, чем SQL\n- **Управление транзакциями**\n\n**Минусы:**\n- **Сложность в освоении** - парадигма ORM нетривиальна и может быть контринтуитивна для новых разработчиков, имеющих опыт с SQL\n- **Потенциальная потеря производительности** - автоматическая генерация SQL-запросов может быть менее оптимальной, чем ручное написание запросов\n- **Плохо справляется со сложными запросы** - ORM плохо справляется с очень сложными SQL-запросами, такими как сложные агрегатные функции или многоуровневые JOIN’ы\n"
  popularity = 3.61

[[questions]]
  id = 3
  question = "Как создать Entity и что это такое?"
  answer = "Сущность — управляемый JPA класс с идентичностью. Его обозначают `@Entity` или описывают в XML. В Jakarta Persistence 3.2 он может быть верхнеуровневым или статическим вложенным классом. Нужен публичный или защищённый конструктор без аргументов. Класс и его персистентные методы и поля подчиняются ограничениям спецификации, в частности на `final`. Доступ может идти через поля или свойства. Идентификатор можно задать через `@Id`, `@EmbeddedId` либо составной ключ с `@IdClass`. Одна сущность не обязана соответствовать ровно одной таблице."
  popularity = 2.11

[[questions]]
  id = 4
  question = "Может ли Entity наследоваться от не-Entity классов?"
  answer = "Да. Обычный Java-суперкласс может содержать общие методы и служебное состояние, но его собственные поля автоматически не отображаются как состояние сущности. Если нужны наследуемые поля маппинга, используйте `@MappedSuperclass`. У такого класса нет самостоятельного набора сущностей и его нельзя выбирать как корневую сущность JPQL."
  popularity = 0.0

[[questions]]
  id = 5
  question = "Может ли Entity наследоваться от других Entity классов?"
  answer = "Да. Сущность может наследоваться от другой сущности. Стратегию отображения выбирают у корня через `@Inheritance`. При отсутствии явной настройки по умолчанию используется `SINGLE_TABLE`. Запрос по базовой сущности обычно полиморфный и включает экземпляры её подтипов. Сравнение стратегий — в №26."
  popularity = 0.0

[[questions]]
  id = 6
  question = "Почему мы не можем использовать final классы в качестве Entity?"
  answer = "Потому что Hibernate делает прокси через наследование от класса-entity, `final` прямо этому препятствует.\n"
  popularity = 0.3

[[questions]]
  id = 7
  question = "Что такое Proxy и для чего используется?"
  answer = "**Прокси Hibernate** — объект-заместитель, который позволяет отложить загрузку состояния сущности. Например, обращение к незагруженному свойству через геттер может выполнить SQL. Доступ к идентификатору часто возможен без инициализации.\n\n`EntityManager.getReference()` возвращает ссылку на сущность, состояние которой может быть загружено позднее. Это может быть уже управляемый объект или ссылка с отложенной загрузкой. Конкретный механизм зависит от провайдера и настроек, в том числе от bytecode enhancement.\n"
  popularity = 8.73

[[questions]]
  id = 8
  question = "FetchType"
  answer = "`LAZY` - вместо таких полей будут вставляться прокси, а сами они будут подгружаться при первом доступе к ним\n`EAGER` (жадный) - связанные сущности загружаются сразу вместе с основной сущностью\n\n`@OneToMany` `@ManyToMany` по-умолчанию применяется `FetchType.LAZY`\n`@ManyToOne` `@OneToOne` по-умолчанию применяется `FetchType.EAGER`\n"
  popularity = 2.41

[[questions]]
  id = 9
  question = "Жизненный цикл сущности"
  answer = "\n{{< figure src=\"/java-backend-interview-prep/hibernate_entity_life_cycle.png\" title=\"\" >}}\n\n| Состояние | Что означает |\n|---|---|\n| **New / transient** | Экземпляр создан, контекстом не управляется |\n| **Managed** | Экземпляр находится в контексте. Изменения синхронизируются при `flush` по правилам контекста |\n| **Detached** | Экземпляр раньше был управляемым, но больше с контекстом не связан, например после `detach()` или закрытия контекста |\n| **Removed** | Экземпляр помечен на удаление через `remove()`. SQL обычно выполняется при `flush` |\n\n`persist()` делает новый экземпляр управляемым. `find()` возвращает управляемую сущность, если она найдена. `merge()` копирует состояние переданного объекта в управляемый экземпляр и возвращает его. Исходный detached-объект от этого не становится управляемым.\n\n```java\n// В активной транзакции\nUser user = new User();\nem.persist(user);                 // managed\nem.flush();\nem.detach(user);                  // detached\nUser managed = em.merge(user);    // результат managed\nem.remove(managed);               // removed\n```\n"
  popularity = 4.82

[[questions]]
  id = 10
  question = "Кэширование"
  answer = "- **Первый уровень** — persistence context одного `EntityManager/Session`. В нём хранится тождество управляемых сущностей. Повторный `find()` по тому же ID обычно использует уже загруженный объект. JPQL обычно всё равно обращается к БД для определения результата.\n- **Второй уровень** — необязательный общий кэш для сессий одного `SessionFactory`. Настраивается провайдер и области кэширования.\n- **Кэш запросов** — отдельная необязательная функция Hibernate. Он переиспользует результаты конкретного запроса с его параметрами. При настройке нужно учитывать инвалидирование и характер нагрузки.\n"
  popularity = 6.63

[[questions]]
  id = 11
  question = "HQL и JPQL"
  answer = "**JPQL** — стандартный язык Jakarta Persistence. Он обращается к сущностям, их полям и связям. \n\n**HQL** — язык запросов Hibernate. В Hibernate 6 JPQL является подмножеством HQL. Дополнительные возможности HQL удобны в проектах на Hibernate, а для переносимости между провайдерами лучше ограничиться стандартом JPQL.\n"
  popularity = 0.6

[[questions]]
  id = 12
  question = "EntityManager + EntityManagerFactory / SessionFactory + session"
  answer = "**EntityManager** - менеджер сущностей, определяется спецификацией JPA, **Session** от Hibernate - вариант его реализации\n**EntityManagerFactory** - фабрика менеджеров JPA, **SessionFactory** - реализация от Hibernate\n"
  popularity = 1.81

[[questions]]
  id = 13
  question = "Проблема N + 1. Способы решения проблемы"
  answer = "**N+1** — один запрос получает N сущностей, затем их связи загружаются отдельными запросами. Например, сначала читаются пользователи, затем для каждого — его заказы. Так может произойти и с `LAZY`, и с `EAGER`.\n\n- `SELECT u FROM User u LEFT JOIN FETCH u.orders` загружает пользователей и заказы одним запросом, включая пользователей без заказов. В Hibernate 6 дубликаты корневых сущностей от fetch join удаляются автоматически.\n- `@EntityGraph(attributePaths = \"orders\")` задаёт, какие связи загрузить для конкретного метода репозитория. Фактический SQL проверяют по логам.\n- `@BatchSize(size = 50)` на коллекции позволяет догружать заказы группами до 50 **пользователей**. Для 100 владельцев это может дать две догрузки.\n- `@Fetch(FetchMode.SUBSELECT)` догружает коллекции для группы владельцев запросом на основе исходной выборки. DTO-проекция подходит, когда нужны лишь выбранные данные."
  popularity = 20.78

[[questions]]
  id = 14
  question = "Что такое Entity Graph?"
  answer = "**Entity graph** задаёт, какие атрибуты и связи загрузить в конкретной операции. Его можно описать через `@NamedEntityGraph`, создать динамически в JPA или указать через `@EntityGraph` в Spring Data.\n\n- `fetchgraph` трактует атрибуты вне графа как `LAZY`.\n- `loadgraph` оставляет для них обычные настройки маппинга.\n\n```java\nvar graph = em.createEntityGraph(User.class);\ngraph.addAttributeNodes(\"orders\");\n\nUser user = em.find(User.class, id,\n    Map.of(\"jakarta.persistence.loadgraph\", graph));\n```\n\nПровайдер обязан загрузить указанные данные и может загрузить дополнительные. Один SQL-запрос с JOIN не гарантируется."
  popularity = 3.31

[[questions]]
  id = 15
  question = "Statement, Prepared statement, Callable statement"
  answer = "- `Statement` выполняет переданную SQL-строку.\n- `PreparedStatement` расширяет `Statement` и позволяет связать параметры `?` с данными. Один объект можно использовать для повторного выполнения с разными значениями.\n- `CallableStatement` расширяет `PreparedStatement` и используется для вызова хранимых процедур, в том числе с выходными параметрами.\n\nЗащиту обеспечивает передача пользовательских значений как параметров. Подготовка на сервере и повторное использование плана зависят от драйвера и СУБД.\n"
  popularity = 2.11

[[questions]]
  id = 16
  question = "Связи между таблицами в ORM"
  answer = "| Связь | Типичное отображение |\n|---|---|\n| `@OneToOne` | FK с уникальностью или общий первичный ключ |\n| `@OneToMany` / `@ManyToOne` | FK со стороны «многие» |\n| `@ManyToMany` | Таблица связи с двумя FK |\n\n---\n**Как реализована связь OneToMany?**\n\nОдин отдел может содержать много сотрудников. В двусторонней связи поле `Department.employees` объявляют с `@OneToMany(mappedBy = \"department\")`. Параметр `mappedBy` указывает на поле владельца связи в `Employee`.\n\n---\n**Как реализована связь ManyToOne?**\n\nНа стороне сотрудника поле `Employee.department` объявляют с `@ManyToOne` и `@JoinColumn(name = \"department_id\")`. Внешний ключ хранится в таблице сотрудников. При изменении двусторонней связи в Java следует согласованно обновлять обе стороны.\n\n---\n**Как реализована связь ManyToMany?**\n\nНапример, у студентов есть курсы, а у курсов — студенты. Владелец объявляет `@ManyToMany` и при необходимости `@JoinTable`. Обратная сторона использует `mappedBy`. Если у самой связи есть поля, например дата записи, лучше отобразить её отдельной сущностью.\n\n---\n**Чем различаются List и Set?**\n\n`Set` выражает уникальность элементов на уровне Java. Если порядок `List` нужно хранить в БД, используют `@OrderColumn`. Для сортировки при чтении можно использовать `@OrderBy`.\n\n---\n**Что такое Cascade?**\n\nОн распространяет операции JPA (`PERSIST`, `MERGE`, `REMOVE`, `REFRESH`, `DETACH`), а `ALL` включает их все. Каскад и владеющая сторона независимы. Каскад JPA отличается от `ON DELETE CASCADE` в схеме БД.\n"
  popularity = 3.01

[[questions]]
  id = 17
  question = "LazyInitializationException"
  answer = "Это происходит, когда объект был загружен с ленивой загрузкой, но его данные пытаются быть использованы после закрытия сессии\n\n```java\npublic void printAuthorBooks(Long authorId) {\n    Session session = sessionFactory.openSession();\n    Author author = session.get(Author.class, authorId);\n    session.close();\n\n    // Попытка доступа к ленивой коллекции после закрытия сессии\n    System.out.println(author.getBooks());  // Может вызвать LazyInitializationException\n}\n```\n\nКак решить?\n- JOIN FETCH. Это способ сказать Hibernate загрузить связанные данные вместе с основными (типа обычного JOIN-а)\n- Использовать EntityGraph. Указываем, какие данные загружать в конкретных запросах, не изменяя сущности (как в случае с жадной загрузкой)\n"
  popularity = 5.12

[[questions]]
  id = 18
  question = "Что такое SQL-инъекция?"
  answer = "**SQL-инъекция** возникает, когда пользовательский ввод может изменить структуру запроса. Для значений используют привязку параметров.\n\n- В JDBC и переносимом native SQL через JPA используются позиционные `?`.\n- В JPQL используются именованные параметры вроде `:name` или позиционные вроде `?1`.\n- Имена таблиц, столбцов и направления сортировки выбирают из заранее заданных вариантов, поскольку такие части запроса не передаются как значения параметров.\n\nВ Hibernate и других ORM защита также зависит от того, как сформирован запрос и как переданы значения.\n"
  popularity = 1.2

[[questions]]
  id = 19
  question = "Проблемы JOIN FETCH"
  answer = "`JOIN FETCH` коллекции может вернуть несколько строк SQL для одного родителя, по одной на каждый элемент связи. При одновременной загрузке нескольких коллекций число строк может перемножаться. Hibernate также может выбросить `MultipleBagFetchException` при одновременном fetch нескольких bag-коллекций.\n\nВ Hibernate 6 дубликаты корневых сущностей от fetch join удаляются при формировании Java-результата. Выбор `Set` для коллекции не сокращает число строк SQL.\n\nДля пагинации сначала выбирают страницу ID корневых сущностей со стабильной сортировкой. Затем отдельным запросом загружают нужные связи этих сущностей и восстанавливают порядок страницы. В Hibernate полезно включить `hibernate.query.fail_on_pagination_over_collection_fetch`, чтобы заметить пагинацию, которая иначе может выполняться в памяти."
  popularity = 0.6

[[questions]]
  id = 20
  question = "Логи в Hibernate"
  answer = "- SQL-запросы: категория `org.hibernate.SQL` на уровне `DEBUG`.\n- Значения параметров в Hibernate 6: `org.hibernate.orm.jdbc.bind` на уровне `TRACE`.\n- В Hibernate 5 использовалась, например, категория `org.hibernate.type.descriptor.sql.BasicBinder`.\n\nВ Spring Boot, например, используют `logging.level.org.hibernate.SQL=DEBUG`. Значения параметров могут содержать конфиденциальные данные, поэтому подробное логирование включают только на нужное время."
  popularity = 0.3

[[questions]]
  id = 21
  question = "Аннотация @Query, что это такое?"
  answer = "Аннотация `@Query` - аннотация из Spring Data JPA, устанавливающаяся над методом репозитория (JpaRepository), - позволяет писать JPQL или SQL запрос.\n\n**JPQL-запросы** (Java Persistence Query Language)\n```java\npublic interface UserRepository extends JpaRepository<User, Long> {\n\n    // Использование JPQL для выборки данных\n    @Query(\"SELECT u FROM User u WHERE u.name = :name\")\n    List<User> findByName(@Param(\"name\") String name);\n}\n```\n\n**Native SQL-запросы**\n```java\npublic interface UserRepository extends JpaRepository<User, Long> {\n\n    // Использование SQL-запроса\n    @Query(value = \"SELECT * FROM users WHERE name = :name\", nativeQuery = true)\n    List<User> findByNameNative(@Param(\"name\") String name);\n}\n```\n\n**Параметры в запросах**\n```java\n@Query(\"SELECT u FROM User u WHERE u.name = :name\")\nList<User> findByName(@Param(\"name\") String name);\n```\n"
  popularity = 1.81

[[questions]]
  id = 22
  question = "Как Hibernate генерирует SQL запросы?"
  answer = "Hibernate использует маппинг сущностей, полей и связей, чтобы сопоставлять Java-модель с таблицами. SQL генерируется для операций над сущностями и для запросов из JPQL, HQL или Criteria API. Диалект задаёт особенности синтаксиса и возможностей СУБД. Native SQL задаёт сам разработчик.\n\nПри загрузке связей Hibernate учитывает `FetchType`, параметры запроса, fetch join и entity graphs. Стратегия загрузки влияет на момент получения данных и на число запросов."
  popularity = 0.3

[[questions]]
  id = 23
  question = "Hibernate. Что хранится в Persistence Context? Сколько времени объект хранится в Persistence Context?"
  answer = "**Persistence Context** — набор сущностей, которыми управляет `EntityManager`. В одном контексте одному типу и идентификатору соответствует один управляемый экземпляр. Поэтому его называют кэшем первого уровня.\n\nВ контексте хранятся управляемые экземпляры и данные, необходимые для отслеживания изменений и синхронизации с БД. Hibernate может хранить снимок загруженного состояния для dirty checking. `find()` загружает сущность или берёт её из контекста, `getReference()` может вернуть ссылку без немедленной загрузки, `persist()` регистрирует новую сущность, `remove()` помечает управляемую сущность на удаление. `merge()` переносит состояние в управляемый экземпляр и возвращает его.\n\n---\n**Сколько времени объект хранится в Persistence Context?**\n\nПока им управляет этот контекст. `detach()` отсоединяет одну сущность, `clear()` отсоединяет все, закрытие `EntityManager` завершает контекст. Контекст, привязанный к транзакции, обычно прекращает управлять объектами по её завершении. Расширенный контекст может переживать несколько транзакций. `flush()` синхронизирует изменения с БД, сохраняя сам контекст.\n"
  popularity = 2.11

[[questions]]
  id = 24
  question = "Hibernate и Lombok"
  answer = "`@Data` включает автогенерацию `toString`, `equals` и `hashCode`. Для сущностей это может случайно загрузить ленивые связи, привести к рекурсии в двунаправленной ассоциации или нарушить работу хеш-коллекций при изменении значимых полей.\n\n---\n**Что делать?**\n\nИспользовать Lombok выборочно, например `@Getter` и `@Setter`. В `toString` не включать связи. Сравнение строить на подходящей стабильной идентичности и учитывать прокси и момент появления сгенерированного ID. Поля коллекций и изменяемое состояние обычно исключают. Для JPA сохраняют публичный или защищённый конструктор без аргументов.\n"
  popularity = 1.51

[[questions]]
  id = 25
  question = "Как JPA делает запросы?"
  answer = "Spring Data JPA предоставляет базовые методы репозитория, строит запросы по именам методов и поддерживает Query by Example через `QueryByExampleExecutor`. Дополнительно можно объявить JPQL через `@Query` или native SQL через `@Query(value = \"...\", nativeQuery = true)`. Для native-запроса указывают совместимый SQL и сопоставление результата.\n"
  popularity = 0.6

[[questions]]
  id = 26
  question = "Стратегии наследования в Hibernate"
  answer = "| Стратегия | Хранение | Компромисс |\n|---|---|---|\n| `SINGLE_TABLE` | Одна таблица всей иерархии и дискриминатор | Простые полиморфные запросы, столбцы отдельных подтипов часто допускают NULL |\n| `JOINED` | Общие поля в таблице базового класса, собственные поля в таблице подкласса с тем же PK и FK | Нормализованная схема, при чтении нужны JOIN |\n| `TABLE_PER_CLASS` | Таблица каждого конкретного класса содержит собственные и унаследованные поля | Нет JOIN для чтения одного конкретного типа, полиморфный запрос может использовать UNION |\n\nНапример, для `Vehicle` с полем `brand` и `Car` с полем `seats` стратегия `TABLE_PER_CLASS` хранит оба поля в таблице `car`. При `JOINED` `brand` находится в `vehicle`, а `seats` — в `car`. Стратегию задают на корневой сущности через `@Inheritance`.\n"
