[[questions]]
  id = 1
  question = "NoSQL типы БД"
  answer = "\n| Модель | Пример | Типичное применение |\n|---|---|---|\n| Документная | MongoDB | Документы с вложенной структурой, например каталоги |\n| Ключ–значение | Redis | Кэш, счётчики, сессии |\n| Wide-column | Cassandra, HBase | Распределённое хранение с доступом по ключу строки или партиции. Схему часто проектируют под нужные запросы |\n| Поисковый индекс | Elasticsearch | Полнотекстовый поиск и анализ журналов |\n| Графовая | Neo4j | Задачи, где важны связи между объектами |\n\nWide-column — модель данных. Колоночные аналитические базы вроде ClickHouse организуют чтение по столбцам для сканирования и агрегаций большого числа строк.\n"
  popularity = 1.81

[[questions]]
  id = 2
  question = "Для чего используется Redis?"
  answer = "Redis — быстрое хранилище структур данных, обычно работающее в памяти. Помимо строк поддерживает хеши, списки, множества, упорядоченные множества и Streams.\n\nТипичные задачи — кэш с TTL, сессии, счётчики, ограничение частоты запросов и рейтинги. Pub/Sub доставляет сообщения активным подписчикам. Streams позволяют хранить сообщения и читать их группами потребителей. Сохранение на диск можно настроить через снимки RDB и журнал AOF. Для распределённых блокировок нужно отдельно оценивать требования к сроку аренды и поведению при сбоях.\n"
  popularity = 3.61

[[questions]]
  id = 3
  question = "Что такое Кэш?"
  answer = "Кэш хранит копии данных для быстрого повторного чтения. Используют TTL, ограничение объёма и правила инвалидирования.\n- **Cache-aside** — приложение проверяет кэш, при промахе читает БД и заполняет кэш. После записи в БД оно обновляет или инвалидирует запись кэша.\n- **Read-through** — при промахе кэш сам обращается к источнику через настроенный загрузчик.\n- **Write-through** — слой кэширования синхронно записывает в основное хранилище.\n- **Write-behind** — запись в основное хранилище происходит асинхронно. Нужно учитывать риск задержки или потери неподтверждённой записи.\n\nНапример, первый запрос читает пользователя из БД и кладёт результат в Redis. Следующие читают Redis. После изменения пользователя приложение инвалидирует соответствующий ключ."
  popularity = 0.6
