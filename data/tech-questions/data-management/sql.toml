  question = "Расскажи про ключевое слово DISTINCT?"
  answer = "`DISTINCT` - это ключевое слово SQL, служащее для выбора только уникальных записей, т.е. устраняет дублирующиеся строки из результата запроса\n"
  popularity = 0.9

[[questions]]
  id = 28
  question = "Что такое табличные выражения?"
  answer = "Обобщённое табличное выражение или **CTE (Common Table Expressions)** - это именованный временный результирующий набор данных, к которому можно обращаться в последующих запросах. Реализовано через ключевое слово WITH\n\n```sql\nWITH recent_sales AS (\n    SELECT * \n    FROM sales \n    WHERE sale_date > '2023-01-01'\n)\nSELECT * FROM recent_sales WHERE amount > 1000\n```\nВременная таблица `recent_sales` доступна только внутри текущего запроса\n\nCTE могут быть материализованными и нематериализованными. По умолчанию это решает планировщик на основании анализа использования CTE в последующих запросах. Но можно явно указать этот параметр\n```sql\nWITH recent_sales AS [NOT] MATERIALIZED (\n    SELECT * \n    FROM sales \n    WHERE sale_date > '2023-01-01'\n)\n```\n"
  popularity = 0.3

[[questions]]
  id = 29
  question = "Для чего используется Database Connection Pool? (Hikari) Исчерпание connection pool"
  answer = "Database Connection Pool - это пул подключений к базе данных, который управляет ограниченным числом соединений, чтобы уменьшить нагрузку на сервер базы данных и повысить производительность. Hikari - один из самых популярных Connection Pool\n\n**Почему нужен пул?**\n- Уменьшает накладные расходы на создание/закрытие соединений\n- Повышает производительность многопоточных приложений\n\nТак как открытие и закрытие подключений к базе данных - дорогостоящая операция, то выгоднее держать пул из открытых подключений, и выдавать их по запросу. Долго простаивающие подключения закрываются.\n\nБолее того, ограничение кол-ва подключений в пуле позволяет исключить перегрузку базы данных множественными подключениями. При отсутствии свободных подключений желающий обратиться к БД обязан ждать освобождения одного из подключений пула.\n\n**Исчерпание Connection Pool** происходит, когда приложению требуется больше соединений, чем разрешено пулом. Возможные причины:\n- утечка соединений (не закрываются после использования)\n- неправильная настройка `maxPoolSize`\n- избыточная нагрузка на приложение\n\nРешения:\n1. Закрывать соединения через `try-with-resources`\n2. Увеличить `maxPoolSize`, если это оправданно\n"
  popularity = 2.41

[[questions]]
  id = 30
  question = "Блокировки и локи. Оптимистичная и Пессимистичная"
  answer = "Блокировки (или локи) в базе данных - это механизм, управляющий конкурентным доступом к данным, чтобы избежать конфликтов и ошибок. Есть два типа блокировок\n\n**Оптимистическая блокировка** - при завершении транзакции сверяется текущая версия данных и версия, полученная в начале транзакции. Если они не совпадают, то транзакция откатывается. Подразумевает, что конфликты будут происходить нечасто\n```sql\nSELECT version \nFROM orders \nWHERE id = 1;\n\n-- Обновляем, если версия не изменилась\nUPDATE orders\nSET status = 'processed', version = version + 1\nWHERE id = 1 AND version = 5;\n```\n\n**Пессимистическая блокировка** - при начале транзакции изменяемые данные блокируются для всех остальных, пока текущая транзакция не закончится\n```sql\nSELECT *\nFROM orders\nWHERE id = 1 \nFOR UPDATE;\n```\n\n**Сравнение**\n\n| **Характеристика**   | **Оптимистичные локи**         | **Пессимистичные локи**   |\n| -------------------- | ------------------------------ | ------------------------- |\n| Конфликты            | Редкие                         | Частые                    |\n| Механизм             | Проверка версии данных         | Блокировка ресурса        |\n| Производительность   | Выше при редких конфликтах     | Ниже из-за блокировок     |\n| Обработка конфликтов | Требует доп. кода              | Не требуется              |\n| Применимость         | Чтение превалирует над записью | Высококонкурентная запись |\n"
  popularity = 18.07

[[questions]]
  id = 31
  question = "БД. Constraint. Какие существуют?"
  answer = "**Constraint (ограничение)** — это правило, накладываемое на столбцы или таблицы, чтобы обеспечить целостность и корректность данных\n\n| **Ограничение**               | **Описание**                                                                                                                              | **Применимость**                |\n| ----------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------- |\n| NOT NULL                      | Поле обязательно для заполнения                                                                                                           | Идентификаторы, ключевые данные |\n| UNIQUE                        | Значения в поле уникальны                                                                                                                 | Email, username                 |\n| PRIMARY KEY                   | Уникально идентифицирует строку                                                                                                           | Основной идентификатор записи   |\n| FOREIGN KEY                   | Обеспечивает целостность связи между таблицами                                                                                            | Таблицы с зависимыми данными    |\n| CHECK                         | Устанавливает условия для значений                                                                                                        | Бизнес-правила                  |\n| DEFAULT                       | Значение по умолчанию                                                                                                                     | Даты, статусы                   |\n| EXCLUSION  <br>(для постгрес) | Обобщённый случай уникальности, позволяет писать кастомные условия для сравнения двух столбцов, которые должны соблюдаться при добавлении |                                 |\n\nПример EXCLUDE\n```sql\nCREATE TABLE reservations  \n(  \n        id serial PRIMARY KEY,  \n        room_id INTEGER,  \n        booking_status TEXT,  \n        start_date TIMESTAMP,  \n        end_date TIMESTAMP,  \n        EXCLUDE USING GIST (TSRANGE(start_date, end_date) WITH &&)  \n);\n```\nУсловие EXCLUDE USING GIST создаёт ограничение исключения, которое гарантирует отсутствие конфликтующих бронирований на один и тот же период. Условие TSRANGE(start_date, end_date) WITH && проверяет, пересекаются ли диапазоны дат.\n"
  popularity = 1.81

[[questions]]
  id = 32
  question = "Primary Key"
  answer = "**Primary Key (PK)** - это уникальный идентификатор записи в таблице. Без него сложно эффективно работать с данными, особенно в больших таблицах\n1. **Гарантия уникальности** - обеспечивает, что ни одна запись не будет полностью дублироваться, а значит может быть безошибочно идентифицирована\n2. **Связь между таблицами** - используется как основа для создания внешних ключей (FK)\n3. **Ускорение поиска** - PK автоматически индексируется, что ускоряет выборку данных\n\n**PK индексирован?**\nДа, Primary Key **автоматически индексируется** базой данных. Этот индекс включает UNIQUE и NOT NULL ограничения\n- Ускоряет поиск, сортировку и фильтрацию по PK\n- Гарантирует уникальность значений в столбце PK\n"
  popularity = 2.11

[[questions]]
  id = 33
  question = "DELETE vs TRUNCATE"
  answer = "- DELETE — оператор DML, удаляет строки по условию WHERE (без WHERE — все строки). Удаление выполняется построчно с использованием MVCC, изменения записываются в WAL. Срабатывают триггеры ON DELETE. Не блокирует обычное чтение таблицы. Место на диске сразу не освобождается: VACUUM делает его доступным для повторного использования, а VACUUM FULL может вернуть его ОС. Не сбрасывает последовательности. При массовом удалении обычно медленнее TRUNCATE. Можно откатить через ROLLBACK до фиксации транзакции.\n\n- TRUNCATE — команда быстрой очистки таблицы, удаляет все строки без возможности указать WHERE. Не обрабатывает каждую строку отдельно, поэтому обычно значительно быстрее DELETE при массовом удалении и сразу освобождает занимаемое таблицей дисковое пространство. Изменения журналируются в WAL, но не для каждой удаляемой строки. Получает блокировку ACCESS EXCLUSIVE, блокирующую в том числе чтение таблицы другими транзакциями. Триггеры ON DELETE не срабатывают, но срабатывают ON TRUNCATE. При наличии внешних ключей необходимо включить ссылающиеся таблицы в команду или использовать CASCADE. По умолчанию последовательности не сбрасываются (CONTINUE IDENTITY), для сброса используется RESTART IDENTITY. В PostgreSQL операция транзакционная: её можно откатить через ROLLBACK до COMMIT.\n\n"
