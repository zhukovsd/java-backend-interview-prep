[[questions]]
  id = 1
  question = "Что такое транзакции?"
  answer = "Транзакция - это набор логически связанных запросов, выполняемых атомарно (либо выполняются все - commit транзакции, либо откат всего - rollback)\n"
  popularity = 9.64

[[questions]]
  id = 2
  question = "Расскажите про ACID"
  answer = "ACID - это набор свойств, гарантирующих надёжность транзакции:\n- **A**tomicity (атомарность/неделимость операций) - все операции внутри транзакции либо выполняются полностью, либо не выполняются совсем\n- **C**onsistency (согласованность данных) - после транзакции данные соблюдают все правила целостности (правила целостности определяются бизнес-логикой)\n- **I**solation (изоляция) - во время выполнения транзакции параллельные транзакции не должны оказывать влияние на ее результат\n- **D**urability (долговечность/живучесть) - гарантирует, что закоммиченные изменения не могут быть потеряны ни при каких сбоях (поломка сервера, отключение электроэнергии и т.д.)\n"
  popularity = 12.65

[[questions]]
  id = 3
  question = "Проблемы параллельных транзакций"
  answer = "- **Грязное чтение** — транзакция видит незафиксированные изменения другой транзакции.\n- **Неповторяющееся чтение** — повторное чтение той же строки показывает изменённое значение.\n- **Фантомное чтение** — повторный запрос с тем же условием возвращает другой набор подходящих строк.\n- **Потерянное обновление** — одна запись затирает результат другой, например если оба клиента прочитали старое значение и записали предварительно вычисленный результат.\n\nMVCC позволяет работать с версиями строк. В PostgreSQL обычный `SELECT` при `READ COMMITTED` получает снимок на начало каждого запроса. При `REPEATABLE READ` снимок задаётся первым оператором, который не управляет транзакцией, и используется до её завершения.\n\nДля счётчика подходит атомарный `UPDATE accounts SET balance = balance + 10 WHERE id = 1`. Если требуется прочитать и проверить состояние, можно взять `SELECT ... FOR UPDATE` в той же транзакции или обновлять строку с условием по её ожидаемой версии и проверять число затронутых строк. В PostgreSQL на `REPEATABLE READ` конфликт конкурентного обновления может потребовать повтора всей транзакции."
  popularity = 9.94

[[questions]]
  id = 4
  question = "Уровни изолированности (read uncommitted, read committed, repeatable read, serializable)"
  answer = "От менее строгого к наиболее строгому:\n\n1. **Read Uncommitted (чтение незафиксированных данных)** — транзакция может читать изменения других транзакций до их фиксации. Допускает грязное чтение (Dirty Read).\n    \n2. **Read Committed (чтение зафиксированных данных)** — транзакция читает только зафиксированные данные. Исключает грязное чтение, но допускает неповторяющееся чтение (Non-Repeatable Read) и фантомное чтение (Phantom Read).\n    \n3. **Repeatable Read (повторяемое чтение)** — обеспечивает стабильность повторного чтения данных в рамках транзакции. Исключает грязное и неповторяющееся чтение. Возможность фантомного чтения и других аномалий зависит от реализации СУБД.\n    \n4. **Serializable (сериализуемость)** — самый строгий уровень. Результат параллельного выполнения транзакций эквивалентен некоторому последовательному выполнению. Предотвращает аномалии сериализации, но может увеличивать накладные расходы и требовать повторного выполнения транзакций.\n    \n\n**Уровни по умолчанию**\n\n- **MySQL (InnoDB)** — `REPEATABLE READ`.\n    \n- **PostgreSQL** — `READ COMMITTED`.\n    \n\nОсобенности PostgreSQL:\n\n- `READ UNCOMMITTED` фактически работает как `READ COMMITTED`.\n    \n- `REPEATABLE READ` также предотвращает фантомное чтение.\n    \n\n**Влияние на производительность**\n\n|Уровень|Производительность|\n|---|---|\n|Read Uncommitted|Минимальные гарантии изоляции, но не обязательно самый быстрый|\n|Read Committed|Обычно хороший баланс конкурентности и согласованности|\n|Repeatable Read|Более строгая изоляция; возможны дополнительные конфликты|\n|Serializable|Максимальные гарантии, но возможны дополнительные проверки, блокировки и повторы транзакций|\n\n"
  popularity = 23.8

[[questions]]
  id = 5
  question = "Виды JOIN. Как работает каждый JOIN?"
  answer = "Оператор, позволяющий связать данные из двух таблиц. Бывают:\n- **(INNER) JOIN** - выдаст общее для левой и правой таблицы (может быть заменён WHERE)\n- **LEFT (OUTER) JOIN** - выдаст все значения с левой таблицы и все подходящие с правой\n- **RIGHT (OUTER) JOIN** - выдаст все значения с правой таблицы и все подходящие с левой\n- **FULL (OUTER) JOIN** - выдаст все записи, которые присутствуют в таблицах\n- **CROSS JOIN** - создаст декартово произведение двух таблиц (если в первой таблице 5 строк, а во второй 3, то вернет 5 x 3 = 15)\n- **NATURAL JOIN** - объединяет таблицы по столбцам с одинаковыми именами, если значения в этих столбцах совпадают\n- **SELF JOIN** - соединяет таблицу с самой собой\n"
  popularity = 12.95

[[questions]]
  id = 6
  question = "Индексы в SQL. Что это?"
  answer = "**Индекс** — структура, которая помогает СУБД быстрее находить строки. Некоторые индексы также помогают выполнять сортировку. За это приходится платить дополнительным местом на диске и обслуживанием индекса при изменении данных.\n\n---\n**В индексе ссылка на данные или в самом индексе кешируем данные?**\n\nВ PostgreSQL листья B-tree хранят значения ключей и ссылки на версии строк в таблице. Через `INCLUDE` можно добавить столбцы, которые нужны запросу для вывода и не входят в ключ индекса.\n\n```sql\nCREATE INDEX idx_products_price ON products (price) INCLUDE (name);\n\nSELECT price, name FROM products WHERE price > 50;\n```\n\nТакой индекс покрывает запрос. PostgreSQL может выбрать `Index Only Scan`. Удастся ли пропустить чтение страниц таблицы, зависит от карты видимости (*visibility map*).\n\nВ MySQL/InnoDB сами строки хранятся в кластерном индексе. Если объявлен первичный ключ, он становится ключом этого индекса. Вторичные индексы хранят свои ключевые поля и ключ кластерного индекса.\n\n---\n**Какие индексы по умолчанию в разных СУБД?**\n\nВ PostgreSQL обычный `CREATE INDEX` создаёт B-tree, если не указать другой метод через `USING`. В MySQL/InnoDB обычные индексы тоже используют B-tree. Для отдельных задач есть другие структуры, например пространственные индексы.\n\n**Сравнение сложности поиска**\n\nПри `N` строках и `K` совпадениях можно ориентироваться на такую упрощённую оценку.\n\n| Способ | Оценка | Когда подходит |\n|---|---|---|\n| Полное сканирование | `O(N)` | Мало строк или запрос читает большую часть таблицы |\n| B-tree | `O(log N + K)` | Поиск по равенству или диапазону |\n| Hash | В среднем `O(1 + K)` при хорошем распределении хешей | Поиск по равенству |\n\nЭто оценка числа операций. Время в СУБД зависит и от того, какие страницы придётся читать.\n\n---\n**Как добавить новый индекс в большую, активно используемую таблицу в продакшене, не блокируя доступ и не приостанавливая работу приложения, и какие стратегии можно применить для минимизации влияния на систему?**\n\nВ PostgreSQL `CREATE INDEX CONCURRENTLY` позволяет продолжать обычные операции записи во время построения индекса. Команду запускают вне блока транзакции. В MySQL/InnoDB для поддерживаемых операций можно задать `ALGORITHM=INPLACE, LOCK=NONE` в `ALTER TABLE`. `gh-ost` — инструмент миграции схемы MySQL.\n\nПостроение индекса нагружает базу даже при доступной записи. Для большой таблицы лучше выбрать период низкой нагрузки. В PostgreSQL прогресс можно смотреть в `pg_stat_progress_create_index`.\n\n---\n**Как определить, какой индекс будет использован в запросе с фильтрацией по столбцу с низкой селективностью (например, пол), и как селективность влияет на эффективность индексов?**\n\n`EXPLAIN` покажет план и название выбранного индекса, если он используется. Для запроса на чтение `EXPLAIN (ANALYZE, BUFFERS)` дополнительно покажет фактическое число строк и обращения к буферам. Если фильтр возвращает большую часть таблицы, СУБД может выбрать полное сканирование (`Seq Scan`).\n\nВажно, как часто встречается конкретное значение. Например, даже при двух статусах индекс по `status` может помочь найти редкий `FAILED`. В PostgreSQL `pg_stats.n_distinct` оценивает число разных значений, а `most_common_vals` и `most_common_freqs` показывают частые значения и их доли.\n"
  popularity = 19.28

[[questions]]
  id = 7
  question = "Почему когда много индексов, это плохо?"
  answer = "- Усложнение работы планировщика - СУБД может не выбрать лучший индекс для запроса, если их слишком много. Некоторые индексы могут быть избыточными, что не только не ускоряет запросы, но и увеличивает нагрузку на систему\n- Утилизация места на жёстком диске - индексы занимают дополнительное место на диске пропорционально объёму данных и кол-ву выбранных столбцов\n- Увеличение времени записи - при вставке, обновлении или удалении данных индексы нужно обновлять, что замедляет операции записи\n- Усложнение управления - управление большим количеством индексов становится сложным, включая их отслеживание и обслуживании\n"
  popularity = 6.93

[[questions]]
  id = 8
  question = "Плюсы и минусы индексов"
  answer = "**Плюсы:**\n- Улучшают производительность для select и сортировки по определенным полям\n\n**Минусы:**\n- Ухудшается производительность, когда нужно вставлять, обновлять или удалять данные\n- Требуется дополнительное место и чем больше/длиннее ключ - тем больше размер индекса\n"
  popularity = 8.73

[[questions]]
  id = 9
  question = "Какие виды индексов знаешь?"
  answer = "Индексы различают по структуре, назначению и способу хранения данных.\n\n| Вид | Для чего подходит |\n|---|---|\n| **B-tree** | Поиск по равенству и диапазонам, сортировка. В PostgreSQL это метод по умолчанию. |\n| **Hash** | Поиск по равенству. Уникальность значений не требуется. |\n| **GIN** | Инвертированный индекс в PostgreSQL. Подходит, например, для полнотекстового поиска и некоторых запросов по массивам и `jsonb`. |\n| **GiST** | В PostgreSQL применяется, например, для поиска по геометрическим объектам и диапазонам. |\n| **BRIN** | Компактный индекс по блокам в PostgreSQL. Полезен для больших таблиц, где значения коррелируют с физическим порядком строк. |\n| **Bitmap** | Битовый индекс. Применяется, например, в аналитических системах на Oracle. |\n\nИндекс также может быть **составным** из нескольких столбцов, **уникальным**, **частичным** с условием `WHERE` или **по выражению**, например `lower(email)`. **Покрывающий индекс** содержит все данные, нужные конкретному запросу. Один индекс может сочетать несколько таких свойств.\n\nВ InnoDB строки таблицы хранятся в **кластерном индексе**, а **вторичные индексы** используют его ключ для поиска строки. MySQL также поддерживает индексы по префиксу некоторых строковых столбцов.\n"
  popularity = 13.55

[[questions]]
  id = 10
  question = "Как правильно выбрать индекс?"
  answer = "Индекс выбирают под конкретный запрос. Смотрят на условия `WHERE` и `JOIN`, сортировку `ORDER BY`, долю подходящих строк и частоту выполнения запроса.\n\n- Для равенства, диапазонов и сортировки обычно начинают с **B-tree**.\n- В составном B-tree важен порядок столбцов. Например, индекс `(user_id, created_at)` подходит для запроса `WHERE user_id = 42 ORDER BY created_at DESC LIMIT 20`.\n- Для специальных операций используют подходящий метод. Например, в PostgreSQL GIN подходит для полнотекстового поиска и некоторых запросов по `jsonb`, а GiST — для ряда пространственных запросов.\n- Если запросы регулярно выбирают небольшую подгруппу строк, можно рассмотреть **частичный индекс**. Например, индексировать только заказы со статусом `FAILED`, если фильтр запроса включает это условие.\n\nПроверяют план через `EXPLAIN`, а для запроса на чтение можно использовать `EXPLAIN (ANALYZE, BUFFERS)` и посмотреть, как он реально выполняется. При выборе учитывают и стоимость записи. Каждый дополнительный индекс занимает место и требует обслуживания.\n"
  popularity = 5.12

[[questions]]
  id = 11
  question = "Нормализация и денормализация. Перечислите формы"
  answer = "Нормализация - это процесс преобразования отношений базы данных к виду без избыточной информации. Избыточность - это ситуация, когда одни и те же данные хранятся в базе в нескольких местах. Нормализация проходит через несколько форм:\n- **1NF** (1-я нормальная форма). Одна ячейка - одно значение.\n- **2NF** (2-я нормальная форма). Все не ключевые колонки зависят от всего ключа.\n- **3NF** (3-я нормальная форма). Все не ключевые колонки не зависят друг от друга.\n\nДенормализация - процесс обратный нормализации. Обычно это необходимо для повышения производительности и скорости извлечения данных, за счет увеличения избыточности данных (влечёт уменьшение сложности запросов)\n"
  popularity = 7.53

[[questions]]
  id = 12
  question = "Foreign Key"
  answer = "**Внешний ключ (Foreign Key, FK)** — ограничение ссылочной целостности. Оно проверяет, что значение в одном или нескольких столбцах соответствует строке с первичным или другим подходящим уникальным ключом.\n\n```sql\nCREATE TABLE users (\n    id INT PRIMARY KEY\n);\n\nCREATE TABLE orders (\n    order_id INT PRIMARY KEY,\n    user_id INT,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n);\n```\n\nВ примере ненулевой `orders.user_id` должен соответствовать существующему `users.id`. При удалении пользователя `ON DELETE CASCADE` удалит его заказы.\n\n---\n**Foreign Key может быть составным?**\n\nДа. Например, `FOREIGN KEY (tenant_id, user_id) REFERENCES users(tenant_id, id)`, если пара `(tenant_id, id)` является первичным или подходящим уникальным ключом в `users`.\n\n| Свойство | Primary Key | Foreign Key |\n|---|---|---|\n| Назначение | Однозначно определяет строку | Проверяет наличие строки, на которую ссылаются |\n| Уникальность | Обязательна | Значения могут повторяться |\n| `NULL` | Запрещён | Возможен, если ограничения это допускают |\n| Количество | Один на таблицу, может быть составным | В таблице может быть несколько |\n\nЕсли на значение первичного ключа никто не ссылается, его можно изменить без `CASCADE` при соблюдении остальных ограничений. Если ссылки есть, поведение определяет правило внешнего ключа. `ON UPDATE CASCADE` обновляет значения в ссылающихся строках, а `ON DELETE CASCADE` удаляет эти строки при удалении родительской записи. Если в PostgreSQL `ON UPDATE` не указан, действует `NO ACTION`. После проверки ограничения ссылающиеся строки должны по-прежнему указывать на существующий ключ.\n"
  popularity = 3.01

[[questions]]
  id = 13
  question = "Чем WHERE отличается от HAVING? Можем ли мы их использовать в одном запросе?"
  answer = "`WHERE` фильтрует строки до группировки, `HAVING` — группы после агрегирования. Их можно использовать в одном запросе.\n\n```sql\nSELECT department_id, COUNT(*) AS employees\nFROM employee\nWHERE active = true\nGROUP BY department_id\nHAVING COUNT(*) >= 5;\n```\nЕсли `GROUP BY` отсутствует, `HAVING` может фильтровать одну общую группу."
  popularity = 8.13

[[questions]]
  id = 14
  question = "Чем отличается MySQL от PostgreSQL?"
  answer = "| Критерий | PostgreSQL | MySQL с InnoDB |\n|---|---|---|\n| Изоляция по умолчанию | `READ COMMITTED` | `REPEATABLE READ` |\n| Хранение строк и индексов | Строки лежат отдельно от индексов | Строки находятся в кластерном индексе |\n| Изменение схемы и индексов | Например, `CREATE INDEX CONCURRENTLY` | Онлайн-режим DDL зависит от конкретной операции |\n\nСравнение скорости требует одинаковой схемы, представительных данных и измерения конкретных запросов. При выборе также учитывают совместимость SQL, инструменты и условия эксплуатации."
  popularity = 0.0

[[questions]]
  id = 15
  question = "Оптимизация запросов. Какие существуют инструменты?"
  answer = "- **EXPLAIN** - показывает теоретический план выполнения запроса, что позволяет увидеть, как СУБД **планирует** извлекать данные\n- **EXPLAIN ANALYZE** - выполняет запрос и показывает **реальный план выполнения**, включая затраченные ресурсы (время, память)\n- **Indexes** - индексы ускоряют доступ к данным, особенно при использовании в условиях WHERE\n- **pg_stat_statements** (для PostgreSQL) - модуль для сбора статистики выполнения запросов\n\n**SQL-запрос у тебя в норме, но выполнение всё равно долгое. Твои действия?**\n- **Оптимизация плана выполнения** - воспользоваться EXPLAIN и EXPLAIN ANALYZE для анализа плана выполнения запроса и поиска проблемных мест\n- **Использование индексов** - проверить, правильно ли используются существующие индексы. При необходимости создать или изменить текущие\n- **Рефакторинг запроса** - изменить структуру запроса, если есть более эффективный способ получить те же данные. Например, объединение нескольких подзапросов или использование более простых JOIN\n- **Ресурсные ограничения** - проверить отсутствие ограничений по железу (нехватка CPU, памяти, диска)\n"
  popularity = 23.49

[[questions]]
  id = 16
  question = "EXPLAIN vs EXPLAIN ANALYZE"
  answer = "`EXPLAIN` в PostgreSQL показывает выбранный план без выполнения оператора. В плане видны способы сканирования, соединения, сортировки, оценка строк и стоимость.\n\n---\n**Как работает EXPLAIN ANALYZE и на что смотреть?**\n\nКоманда фактически выполняет оператор. Сравните оценку `rows` с фактическим числом строк, посмотрите на `actual time` и `loops`. При нескольких циклах строки и время узла показываются в среднем на цикл. `BUFFERS` добавляет сведения о работе с буферами.\n\n```sql\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT * FROM employees WHERE salary > 100000;\n```\n\nУ `INSERT`, `UPDATE` и `DELETE` фактически меняются данные. Можно выполнить диагностику в транзакции и откатить её, но нетранзакционные эффекты, например выдача номера `nextval()`, останутся.\n"
  popularity = 9.34

[[questions]]
  id = 17
  question = "Инструмент для сбора статистики в PostgreSQL"
  answer = "В PostgreSQL используется встроенный модуль pg_stat_statements для сбора статистики по запросам. Сохраняет информацию о запросах, частоте и времени их выполнения, а также сколько ресурсов потребляют\n"
  popularity = 0.3

[[questions]]
  id = 18
  question = "Что такое селективность?"
  answer = "Для условия запроса селективность можно выразить долей строк, которые проходят фильтр. Чем меньше эта доля, тем сильнее фильтр сужает выборку. Условие `status = 'rare'` может отбирать мало строк даже у столбца с двумя возможными значениями.\n\nПланировщик оценивает число совпадений по статистике распределения. Фактическое число строк и выбор плана проверяют через `EXPLAIN ANALYZE`. Выгода от индекса зависит также от стоимости чтения и устройства запроса."
  popularity = 2.71

[[questions]]
  id = 19
  question = "Ключевое слово LATERAL"
  answer = "LATERAL позволяет использовать данные из каждой строки внешней таблицы в подзапросе (аналог “для каждой строки”)\n\n**Пример:**\nДопустим, у нас есть таблица `users` и мы хотим для каждого пользователя взять его последние 3 транзакции из таблицы `transactions`\n```sql\nSELECT u.id, u.name, t.*\nFROM users u,\nLATERAL (\n  SELECT *\n  FROM transactions t\n  WHERE t.user_id = u.id\n  ORDER BY t.date DESC\n  LIMIT 3\n) t;\n```\n- Для каждой строки таблицы `users` выполняется подзапрос с ограничением (`LIMIT 3`)\n- Без `LATERAL` подзапрос не мог бы ссылаться на внешнюю таблицу `u`\n"
  popularity = 0.3

[[questions]]
  id = 20
  question = "Оконные функции. PARTITION BY"
  answer = "Оконная функция вычисляет результат для каждой строки, сохраняя строки исходной выборки. В `OVER (...)`:\n\n- `PARTITION BY` делит строки на группы.\n- `ORDER BY` задаёт порядок внутри группы для расчёта.\n- Рамка (`ROWS`, `RANGE`, в PostgreSQL также `GROUPS`) задаёт, какие строки текущей группы увидит функция, если она учитывает рамку.\n\n`ROWS` считает позиции строк. `RANGE` опирается на значения сортировки. Границы могут быть `UNBOUNDED PRECEDING`, `UNBOUNDED FOLLOWING`, `CURRENT ROW` или смещением. При наличии `ORDER BY` рамка PostgreSQL по умолчанию — `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`. Она включает все строки с таким же значением сортировки, как у текущей. Без оконного `ORDER BY` рамка по умолчанию включает всю партицию.\n\n```sql\nSELECT region, salesperson, sales,\n       SUM(sales) OVER (PARTITION BY region) AS total_region_sales,\n       RANK() OVER (PARTITION BY region ORDER BY sales DESC) AS rank_in_region\nFROM sales;\n```\n\n`SUM` здесь показывает итог по региону у каждой строки. `RANK` ранжирует внутри региона, оставляя пропуски после равных рангов.\n\n\n{{< figure src=\"/java-backend-interview-prep/window_functions_sql.png\" title=\"\" >}}\n\n"
  popularity = 2.41

[[questions]]
  id = 21
  question = "cube, rollup, groupBy"
  answer = "{{< figure src=\"/java-backend-interview-prep/cube_rollup_groupby_sql.png\" title=\"\" >}}\n\n**CUBE**\nСоздаёт все возможные комбинации группировок.\n```sql\nSELECT region, product, SUM(sales)\nFROM sales\nGROUP BY CUBE(region, product);\n```\nРезультат:\n- Группировка по `region, product`\n- Группировка только по `region`\n- Группировка только по `product`\n- Общая сумма по всем продажам\n\n**ROLLUP**\nСоздаёт иерархические уровни группировки (сверху вниз)\n```sql\nSELECT region, product, SUM(sales)\nFROM sales\nGROUP BY ROLLUP(region, product);\n```\nРезультат:\n- Группировка по `region, product`\n- Группировка только по `region`\n- Общая сумма по всем продажам\n\n**GROUPING SETS**\nЯвно указывает на комбинации группировки\n```sql\nSELECT region, product, SUM(sales)\nFROM sales\nGROUP BY GROUPING SETS ((region, product), (region), ());\n```\nРезультат идентичен `ROLLUP`, но группы можно задать произвольно\n\n**`GROUP BY`** используется для группировки строк по определённым столбцам и применения агрегатных функций к каждой группе. Это позволяет выполнять расчёты по группам данных, например, подсчёт суммы, среднего значения и т.д.\n\n**Пример:**\nЕсть таблица `sales` с колонками `region` и `revenue`. Чтобы найти суммарный доход по каждому региону:\n```sql\nSELECT region, SUM(revenue) AS total_revenue\nFROM sales\nGROUP BY region;\n```\n- `region` - группирующий столбец\n- `SUM(revenue)` вычисляется для каждой группы\n\nЕсли не использовать `GROUP BY`, SQL будет рассматривать все строки как одну группу\n"
  popularity = 0.6

[[questions]]
  id = 22
  question = "Хранимые процедуры"
  answer = "Хранимая процедура — именованная программа в СУБД. Она принимает параметры, может выполнять несколько операторов и возвращать значения через выходные параметры. В PostgreSQL процедуру вызывают `CALL`, а функцию используют, например, в `SELECT`. В PostgreSQL управление транзакцией внутри процедуры возможно при соблюдении условий вызова. Хранимый код может уменьшить число сетевых обращений, но ускорение зависит от задачи.\n\n```sql\nCREATE PROCEDURE give_bonus(IN employee_id int, IN amount numeric)\nLANGUAGE SQL\nAS $$\n    UPDATE employees SET salary = salary + amount WHERE id = employee_id;\n$$;\n\nCALL give_bonus(101, 100.00);\n```\n"
  popularity = 1.81

[[questions]]
  id = 23
  question = "Как работает Serializable?"
  answer = "`SERIALIZABLE` гарантирует, что результат успешно завершившихся параллельных транзакций эквивалентен некоторому последовательному порядку их выполнения.\n\nВ PostgreSQL этот уровень использует тот же принцип снимка, что и `REPEATABLE READ`, и дополнительно отслеживает зависимости между чтениями и записями. Если результат нельзя согласовать ни с одним последовательным порядком, одна из транзакций может получить ошибку сериализации с SQLSTATE `40001`. Приложение повторяет **всю транзакцию**, начиная с первого чтения.\n\n**Пример с двумя сессиями**\n\nВ таблице `doctors(id, on_call)` два врача с `id` 1 и 2, оба дежурят (`on_call = true`). Правило приложения — снимать врача с дежурства можно, только если сейчас дежурят хотя бы двое.\n\n| Шаг | Сессия A | Сессия B |\n|---|---|---|\n| 1 | `BEGIN ISOLATION LEVEL SERIALIZABLE` | `BEGIN ISOLATION LEVEL SERIALIZABLE` |\n| 2 | `SELECT count(*) FROM doctors WHERE on_call` → 2 | `SELECT count(*) FROM doctors WHERE on_call` → 2 |\n| 3 | `UPDATE doctors SET on_call = false WHERE id = 1` | `UPDATE doctors SET on_call = false WHERE id = 2` |\n| 4 | `COMMIT` | `COMMIT` |\n\nОбе сессии должны завершить шаг 2 до начала шага 3. При `REPEATABLE READ` в PostgreSQL обе транзакции могут успешно завершиться и оставить смену без дежурных. При `SERIALIZABLE` PostgreSQL отклонит одну транзакцию. При повторе она увидит, что остался один дежурный, и не выполнит обновление.\n"
  popularity = 0.9

[[questions]]
  id = 24
  question = "View, materialized view. Разница между обычным и материализованным представлением?"
  answer = "Обычное `VIEW` хранит определение запроса. При чтении PostgreSQL выполняет запрос к исходным данным. `MATERIALIZED VIEW` хранит результат запроса как данные, с которыми можно работать отдельно. По нему можно создать индексы. Данные могут устаревать, пока не выполнить `REFRESH MATERIALIZED VIEW`."
  popularity = 4.52

[[questions]]
  id = 25
  question = "C помощью SQL блокировка строки? - SELECT FOR UPDATE"
  answer = "**`SELECT FOR UPDATE`** используется для блокировки строк в таблице, участвующих в запросе до окончания транзакции, чтобы предотвратить их изменение другими транзакциями\n```sql\nBEGIN;\n\n-- Блокировка строки с id = 1\nSELECT * FROM accounts\nWHERE id = 1\nFOR UPDATE;\n\n-- Делаем обновление\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 1;\n\nCOMMIT;\n```\n- В данном случае, строка с `id = 1` заблокирована для других транзакций, пока текущая не завершится\n- Если другая транзакция попытается заблокировать ту же строку, она будет ожидать завершения текущей транзакции\n"
  popularity = 5.42

[[questions]]
  id = 26
  question = "UNION vs UNION ALL"
  answer = "`UNION` и `UNION ALL` объединяют результаты двух или более запросов. Разница в том, что `UNION` осуществляет поиск и исключение дублирующихся строк, а `UNION ALL` - нет. В следствие этого `UNION` может работать медленнее. Оба оператора требуют, чтобы количество и типы столбцов в объединяемых выборках совпадали\n```sql\nSELECT city FROM customers\nUNION [ALL]\nSELECT city FROM suppliers;\n```\n\nЕсли оба запроса возвращают `city = 'New York'`, то в результате `UNION` эта строка появится только один раз. В случае `UNION ALL` - дважды\n"
  popularity = 2.11

[[questions]]
  id = 27
  question = "Расскажи про ключевое слово DISTINCT?"
  answer = "`SELECT DISTINCT` убирает повторяющиеся комбинации значений по всем столбцам из `SELECT`. Например, `SELECT DISTINCT city, country FROM customers` вернёт по одной строке на пару «город — страна».\n\nВ PostgreSQL `DISTINCT ON` оставляет первую строку в каждой группе. Например, `SELECT DISTINCT ON (user_id) user_id, created_at FROM events ORDER BY user_id, created_at DESC, id DESC` выбирает самое позднее событие пользователя. `ORDER BY` определяет, какую строку считать первой."
  popularity = 0.9

[[questions]]
  id = 28
  question = "Что такое табличные выражения?"
  answer = "Обобщённое табличное выражение или **CTE (Common Table Expressions)** - это именованный временный результирующий набор данных, к которому можно обращаться в последующих запросах. Реализовано через ключевое слово WITH\n\n```sql\nWITH recent_sales AS (\n    SELECT * \n    FROM sales \n    WHERE sale_date > '2023-01-01'\n)\nSELECT * FROM recent_sales WHERE amount > 1000\n```\nВременная таблица `recent_sales` доступна только внутри текущего запроса\n\nCTE могут быть материализованными и нематериализованными. По умолчанию это решает планировщик на основании анализа использования CTE в последующих запросах. Но можно явно указать этот параметр\n```sql\nWITH recent_sales AS [NOT] MATERIALIZED (\n    SELECT * \n    FROM sales \n    WHERE sale_date > '2023-01-01'\n)\n```\n"
  popularity = 0.3

[[questions]]
  id = 29
  question = "Для чего используется Database Connection Pool? (Hikari) Исчерпание connection pool"
  answer = "Пул переиспользует открытые подключения и ограничивает число одновременных подключений к БД. В HikariCP верхняя граница — `maximumPoolSize`, в Spring Boot — `spring.datasource.hikari.maximum-pool-size`.\n\n---\n**Почему нужен пул?**\n\nПолучить существующее соединение дешевле, чем каждый раз устанавливать его заново. Вызов `close()` у полученного соединения обычно возвращает его в пул.\n\n---\n**Что делать, если пул исчерпан?**\n\nHikari ждёт до `connectionTimeout`, затем выдаёт ошибку. Проверяют утечки, долгие запросы и транзакции, блокировки, число ожидающих клиентов и возможности БД. Соединения закрывают корректно, например через `try-with-resources`. Пул увеличивают только после оценки нагрузки на БД.\n"
  popularity = 2.41

[[questions]]
  id = 30
  question = "Блокировки и локи. Оптимистичная и Пессимистичная"
  answer = "**Оптимистический подход** проверяет отсутствие конфликта в момент записи. Например, выполняют `UPDATE ... WHERE id = ? AND version = ?` с увеличением версии и проверяют число затронутых строк. При конфликте операцию пересчитывают или сообщают об ошибке.\n\n**Пессимистический подход** заранее берёт блокировку нужной строки, например через `SELECT ... FOR UPDATE`. Она обычно удерживается до окончания транзакции. В PostgreSQL такая блокировка препятствует конфликтующим изменениям и другим блокирующим операциям, но обычные чтения могут использовать MVCC. Выбор зависит от конкуренции и стоимости повтора.\n"
  popularity = 18.07

[[questions]]
  id = 31
  question = "БД. Constraint. Какие существуют?"
  answer = "Ограничения обеспечивают целостность данных. `NOT NULL` требует значение, `UNIQUE` задаёт уникальность, `PRIMARY KEY` идентифицирует строку, `FOREIGN KEY` проверяет ссылку, а `CHECK` задаёт условие для строки. В PostgreSQL `EXCLUDE` запрещает пары строк, для которых все указанные сравнения дают `true`.\n**Пример EXCLUDE.** Запрещаем пересечения бронирований только в одной комнате.\n\n```sql\nCREATE EXTENSION IF NOT EXISTS btree_gist;\n\nCREATE TABLE bookings (\n    room_id integer NOT NULL,\n    start_at timestamp NOT NULL,\n    end_at timestamp NOT NULL,\n    CHECK (start_at < end_at),\n    EXCLUDE USING gist (\n        room_id WITH =,\n        tsrange(start_at, end_at, '[)') WITH &&\n    )\n);\n```\nСравнение комнаты использует равенство, а сравнение времени — пересечение. Граница `[)` разрешает следующему бронированию начаться ровно в момент окончания предыдущего.\n"
  popularity = 1.81

[[questions]]
  id = 32
  question = "Primary Key"
  answer = "**Primary Key (PK)** - это уникальный идентификатор записи в таблице. Без него сложно эффективно работать с данными, особенно в больших таблицах\n1. **Гарантия уникальности** - обеспечивает, что ни одна запись не будет полностью дублироваться, а значит может быть безошибочно идентифицирована\n2. **Связь между таблицами** - используется как основа для создания внешних ключей (FK)\n3. **Ускорение поиска** - PK автоматически индексируется, что ускоряет выборку данных\n\n**PK индексирован?**\nДа, Primary Key **автоматически индексируется** базой данных. Этот индекс включает UNIQUE и NOT NULL ограничения\n- Ускоряет поиск, сортировку и фильтрацию по PK\n- Гарантирует уникальность значений в столбце PK\n"
  popularity = 2.11

[[questions]]
  id = 33
  question = "DELETE vs TRUNCATE"
  answer = "- DELETE — оператор DML, удаляет строки по условию WHERE (без WHERE — все строки). Удаление выполняется построчно с использованием MVCC, изменения записываются в WAL. Срабатывают триггеры ON DELETE. Не блокирует обычное чтение таблицы. Место на диске сразу не освобождается: VACUUM делает его доступным для повторного использования, а VACUUM FULL может вернуть его ОС. Не сбрасывает последовательности. При массовом удалении обычно медленнее TRUNCATE. Можно откатить через ROLLBACK до фиксации транзакции.\n\n- TRUNCATE — команда быстрой очистки таблицы, удаляет все строки без возможности указать WHERE. Не обрабатывает каждую строку отдельно, поэтому обычно значительно быстрее DELETE при массовом удалении и сразу освобождает занимаемое таблицей дисковое пространство. Изменения журналируются в WAL, но не для каждой удаляемой строки. Получает блокировку ACCESS EXCLUSIVE, блокирующую в том числе чтение таблицы другими транзакциями. Триггеры ON DELETE не срабатывают, но срабатывают ON TRUNCATE. При наличии внешних ключей необходимо включить ссылающиеся таблицы в команду или использовать CASCADE. По умолчанию последовательности не сбрасываются (CONTINUE IDENTITY), для сброса используется RESTART IDENTITY. В PostgreSQL операция транзакционная: её можно откатить через ROLLBACK до COMMIT.\n\n"
  popularity = 1.2
