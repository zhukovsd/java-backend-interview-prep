[[questions]]
  id = 1
  question = "Виды БД и для чего их лучше использовать?"
  answer = "| Класс | Примеры | Типичные задачи |\n|---|---|---|\n| Реляционные | PostgreSQL, MySQL | Связанные сущности, транзакции, ограничения |\n| Документные | MongoDB, CouchDB | Документы, вложенные структуры |\n| Ключ–значение | Redis | Кэш, сессии, быстрый доступ по ключу |\n| Поисковые | Elasticsearch | Полнотекстовый поиск, логи |\n| Wide-column | Cassandra, HBase | Масштабируемые операции по заранее определённым ключам и шаблонам доступа |\n| Колоночные аналитические | ClickHouse | Агрегации по большим наборам данных |\n| Графовые | Neo4j | Запросы по связям |\n| Временных рядов | InfluxDB, TimescaleDB | Метрики и временные данные |"
  popularity = 2.41

[[questions]]
  id = 2
  question = "Масштабирование. Как решить нехватку места на сервере?"
  answer = "При нехватке диска сначала определяют, что растёт: таблицы, индексы, WAL, временные файлы или резервные копии. Для роста объёма данных используют расширение диска, перенос или архивирование старых данных, очистку по retention либо шардинг по нескольким узлам. Партиционирование помогает управлять данными, но само по себе не переносит их на другой сервер. Реплики повышают доступность и могут разгружать чтение, однако полные реплики требуют места для полной копии.\n"
  popularity = 2.11

[[questions]]
  id = 3
  question = "Репликация базы данных. Что это такое?"
  answer = "\nРепликация - это процесс создания и поддержания копий базы данных на нескольких серверах.  \nОна используется для обеспечения отказоустойчивости, увеличения производительности и масштабируемости.\n\n**Типы репликации**\n1. **Синхронная репликация**:\n    - данные копируются на реплику сразу после внесения изменений\n    - высокая консистентность, но может снижать производительность\n2. **Асинхронная репликация**:\n    - данные копируются с задержкой\n    - более производительная, но возможна временная несогласованность данных.\n\n**Преимущества:**\n- увеличение отказоустойчивости\n- балансировка нагрузки (например, чтение может выполняться с реплики)\n- географическое распределение данных для улучшения задержек\n\n**Пример использования репликации**\n- **Master-Slave** - один главный сервер (`master`) обрабатывает запись, а копии (`slave`) отвечают за чтение.\n- **Master-Master** - все узлы могут записывать и читать, требуется механизм разрешения конфликтов (по сути это уже кластер)\n"
  popularity = 3.92

[[questions]]
  id = 4
  question = "Что такое шардирование?"
  answer = "Шардирование - это метод горизонтального масштабирования, заключающийся в разбиении данных исходной базы на части (шарды) и распределении этих частей по разным экземплярам субд на одном или нескольких серверах. Каждый шард содержит только часть общего набора данных и работает как отдельная бд\n\n**Как работает шардирование?**\n1. Данные разбиваются по определённому ключу (например, идентификатор пользователя, географический регион)\n2. Каждая часть (шард) хранится на отдельном сервере или экземпляре базы данных\n3. При запросе система определяет, на каком шарде находятся нужные данные, и обращается к нему\n\n**Зачем нужно шардирование?**\n- **Масштабируемость** - увеличение объёма данных обрабатывается добавлением новых серверов\n- **Производительность** - запросы выполняются быстрее, так как каждый сервер обрабатывает только часть данных\n- **Изоляция** - ошибка на одном шарде не влияет на другие\n\n**Плюсы шардирования**\n- Возможность обработки больших объёмов данных\n- Уменьшение нагрузки на каждый отдельный сервер\n- Горизонтальное масштабирование дешевле чем вертикальное\n\n**Минусы шардирования**\n- Сложность реализации - требуется правильное распределение данных между шардами\n- Сложность обеспечения ACID на нескольких узлах\n- Обслуживание - управление несколькими серверами сложнее\n- Перераспределение данных - если количество серверов изменяется, данные нужно перераспределить\n"
  popularity = 7.83

[[questions]]
  id = 5
  question = "NoSQL vs SQL"
  answer = "- SQL (реляционные базы данных) - структурированные таблицы с чёткой схемой данных.\n- NoSQL (нереляционные базы данных) - гибкая структура для неструктурированных или полуструктурированных данных.\n\n| **Критерий**                         | **SQL (реляционные)**                                                                          | **NoSQL (нереляционные)**                                                               |\n| ------------------------------------ | ---------------------------------------------------------------------------------------------- | --------------------------------------------------------------------------------------- |\n| Структура данных                     | Таблицы (строки и столбцы)                                                                     | Документы, ключ-значение, графы, колонки                                                |\n| Схема                                | Жёсткая, требуется заранее определить                                                          | Гибкая, можно изменять структуру данных                                                 |\n| Язык запросов                        | SQL (стандартный язык запросов)                                                                | API или специальные запросы (например, MongoDB Query)                                   |\n| Предпочтительный тип масштабирования | Вертикальный (добавление ресурсов серверу). Горизонтальное сложно в связи с жёсткой структурой | Горизонтальный (добавление серверов), хотя и вертикальный не доставляет больших проблем |\n| Целостность данных                   | Высокая (ACID-транзакции)                                                                      | Может быть слабее, иногда поддерживается BASE                                           |\n| Скорость                             | Оптимизировано для сложных операций и JOIN                                                     | Высокая скорость для простых операций                                                   |\n| Когда использовать                   | Структурированные данные, сложные связи                                                        | Гибкие, быстро меняющиеся данные                                                        |\n| Примеры                              | MySQL, PostgreSQL, Oracle                                                                      | MongoDB, Redis, Cassandra, Neo4j                                                        |\n\nACID - это классический подход к управлению транзакциями в реляционных базах данных, который обеспечивает высокий уровень согласованности и надежности данных. ACID-транзакции являются “жёсткими”, так как они гарантируют, что транзакция либо полностью выполнится, либо откатится к исходному состоянию в случае сбоя, что обеспечивает согласованность данных\n\nBASE - более гибкий подход, который учитывает ограничения и неизбежность ошибок в распределенных системах. BASE поддерживает высокую доступность и отказоустойчивость путем снижения требований к согласованности данных. Это достигается за счет того, что база данных может находиться в промежуточном состоянии - состоянии, когда некоторые копии данных могут быть обновлены, а другие нет. Однако, с течением времени все копии данных сходятся к одному состоянию (eventually consistent), что обеспечивает согласованность.\n- **B**asic **A**vailability - система отвечает на любой запрос, но этот ответ может быть содержать ошибку или несогласованные данные\n- **S**oft-state - состояние системы может меняться со временем из-за изменений конечной согласованности\n- **E**ventual consistency (конечная согласованность) - система, в конечном итоге, станет согласованной. Она будет продолжать принимать данные и не будет проверять каждую транзакцию на согласованность\n\nТаким образом, основная разница между BASE и ACID заключается в том, что ACID обеспечивает жесткую согласованность данных, в то время как BASE обеспечивает гибкую согласованность, позволяющую достичь высокой доступности и отказоустойчивости данных в условиях распределённости и масштабируемости.\n"
  popularity = 5.72

[[questions]]
  id = 6
  question = "Партиционирование"
  answer = "**Партиционирование** делит логическую таблицу на части. В PostgreSQL оптимизатор может исключать ненужные части по ключу партиции, а управление retention упрощается. Партиции остаются в рамках того же сервера, пока отдельно не организовано распределение.\n- **RANGE** — по диапазонам. Верхняя граница исключается.\n- **LIST** — по перечисленным значениям. Например, `PARTITION BY LIST (country)` и `FOR VALUES IN ('Germany', 'France')`.\n- **HASH** — по хешу. Для полного покрытия при одном модуле нужны все остатки. При `MODULUS 3` это 0, 1 и 2.\n- **Вертикальное разбиение** — вынесение редко используемых столбцов в связанную таблицу. Это другой приём, а не четвёртый способ декларативного `PARTITION BY` PostgreSQL.\n\n```sql\nCREATE TABLE orders (\n    id bigint GENERATED BY DEFAULT AS IDENTITY,\n    created_at date NOT NULL,\n    PRIMARY KEY (created_at, id)\n) PARTITION BY RANGE (created_at);\n\nCREATE TABLE orders_2023 PARTITION OF orders\n    FOR VALUES FROM ('2023-01-01') TO ('2024-01-01');\nCREATE TABLE orders_2024 PARTITION OF orders\n    FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');\n```\n\n---\n**Когда применять партиционирование?**\n\nКогда запросы часто ограничены ключом партиции или нужно быстро отделять старые периоды. Универсального порога числа строк нет. Запросы без подходящего фильтра, большое число партиций и усложнение схемы могут снизить выгоду.\n"
  popularity = 5.72
