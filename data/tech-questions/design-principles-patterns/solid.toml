[[questions]]
  id = 1
  question = "Что такое SOLID (каждая буква)?"
  answer = "**SOLID** – это принципы разработки программного обеспечения, следуя которым получаем хороший код, который в дальнейшем будет хорошо масштабироваться и поддерживаться в рабочем состоянии.\n\n  **S** Single Responsibility Principle – принцип единственной ответственности.Каждый класс должен иметь только одну зону ответственности.\n \n  **O** Open closed Principle – принцип открытости-закрытости.Классы должны быть открыты для расширения, но закрыты для изменения.\n  \n  **L** Liskov substitution Principle – принцип подстановки Барбары Лисков. Должна быть возможность вместо базового (родительского) типа класса подставить любой его подтип (класс-наследник), при этом работа программы не должна измениться.\n  \n  **I** Interface Segregation Principle – это принцип разделения интерфейсов. Данный принцип обозначает, что не нужно заставлять клиента (класс) реализовывать интерфейс, который не имеет к нему отношения.\n  \n  **D** Dependency Inversion Principle – это принцип инверсии зависимостей. Абстракции НЕ должны зависеть от деталей. Детали должны зависеть от абстракций. Модули верхнего уровня НЕ должны зависеть от модулей нижнего уровня, НО должны зависеть от абстракции."
  popularity = 18.07

[[questions]]
  id = 2
  question = "Какие принципы можешь назвать?"
  answer = "- **DRY** (*Don’t Repeat Yourself*) — поддерживать одно место, которое определяет правило или знание о системе.\n- **KISS** (*Keep It Simple, Stupid*) — предпочитать простое решение, достаточное для задачи.\n- **YAGNI** (*You Aren’t Gonna Need It*) — добавлять возможность, когда в ней появилась потребность.\n- **Бритва Оккама** — при равных объяснениях предпочитать то, которое требует меньше предположений.\n- **Избегать преждевременной оптимизации** — сначала определить узкое место измерениями, затем оптимизировать его.\n"
  popularity = 0.9

[[questions]]
  id = 3
  question = "Когда мы можем нарушать принципы SOLID?"
  answer = "Принципы SOLID являются руководством для написания гибкого, поддерживаемого и расширяемого кода, но бывают ситуации, когда их нарушение может быть оправдано. Рассмотрим такие случаи:\n- Оптимизация производительности\n- Прототипирование и быстрые итерации\n- Ограниченные ресурсы\n- Преемственность кода"
  popularity = 1.2
